[project]
name = "SALTISE_course_flow"
version = "2.0.0"
description = "CourseFlow"
readme = "README.md"
authors = []
license = { text = "BSD-3-Clause" }
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.12"

dependencies = [
  "django-cors-headers>=4.6",
  "django>=5.0,<6.1",
  "django-ninja>=1.3.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[project.scripts]
cf-seed-e2e-data = "course_flow.cli:seed_e2e_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course_flow"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.8",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "course_flow.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.isort]
skip = ["./course_flow/models/__init__.py"]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 79
