version: 2

resource: project

states:
  - private
  - public
  - archived

roles:
  - owner
  - editor
  - commenter
  - viewer
  - public

actions:

  view:
    private:
      owner: true
      editor: true
      commenter: true
      viewer: true
      public: false
    public:
      owner: true
      editor: true
      commenter: true
      viewer: true
      public: true
    archived:
      owner: false
      editor: false
      commenter: false
      viewer: false
      public: false

  edit_project:
    private:
      owner: true
      editor: true
    public:
      owner: true
      editor: true

  manage_members:
    private:
      owner: true
      editor: true
    public:
      owner: true
      editor: true

  create_workflow:
    private:
      owner: true
      editor: true
    public:
      owner: true
      editor: true

  archive_project:
    private:
      owner: true
    public:
      owner: true

  restore_project:
    archived:
      owner: true

  delete_project:
    archived:
      owner: true

  publish_project:
    private:
      owner: true
      editor: true
    public:
      owner: true
      editor: true
