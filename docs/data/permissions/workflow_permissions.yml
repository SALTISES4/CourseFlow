      owner: true
      editor: true

  import_outcomes:
    active:
      owner: true
      editor: true

  node_management:
    active:
      owner: true
      editor: true

  part_management:
    active:
      owner: true
      editor: true

  node_category_management:
    active:
      owner: true
      editor: true

  node_link_management:
    active:
      owner: true
      editor: true

  outcome_management:
    active:
      owner: true
      editor: true

  comment:
    active:
      owner: true
      editor: true
      commenter: true

  delete_own_comment:
    active:
      owner: true
      editor: true
      commenter: true

  delete_any_comment:
    active:
      owner: true
      editor: true

  assign_outcomes:
    active:
      owner: true
      editor: true
