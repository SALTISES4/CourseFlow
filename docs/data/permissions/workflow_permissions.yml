version: 2

resource: workflow

states:
  - private
  - public
  - archived

roles:
  - owner
  - editor
  - commenter
  - viewer
  - public

actions:

  view:
    private:
      owner: true
      editor: true
      commenter: true
      viewer: true
      public: false
    public:
      owner: true
      editor: true
      commenter: true
      viewer: true
      public: true
    archived:
      owner: false
      editor: false
      commenter: false
      viewer: false
      public: false

  edit_attributes: &owner_editor_active
    private:
      owner: true
      editor: true
    public:
      owner: true
      editor: true

  archive:
    private:
      owner: true
    public:
      owner: true

  restore:
    archived:
      owner: true

  delete_permanently:
    archived:
      owner: true

  export: &contributor_active
    private:
      owner: true
      editor: true
      commenter: true
      viewer: true
    public:
      owner: true
      editor: true
      commenter: true
      viewer: true
      public: false

  copy: *contributor_active
  import_nodes: *owner_editor_active
  import_outcomes: *owner_editor_active
  node_management: *owner_editor_active
  part_management: *owner_editor_active
  node_category_management: *owner_editor_active
  node_link_management: *owner_editor_active
  outcome_management: *owner_editor_active
  assign_outcomes: *owner_editor_active

  comment:
    private:
      owner: true
      editor: true
      commenter: true
    public:
      owner: true
      editor: true
      commenter: true

  delete_own_comment:
    private:
      owner: true
      editor: true
      commenter: true
    public:
      owner: true
      editor: true
      commenter: true
