version: 1

resource: workflow

states:
  - active
  - archived

roles:
  - owner
  - editor
  - commenter
  - viewer
  - anonymous

actions:

  view:
    active:
      owner: true
      editor: true
      commenter: true
      viewer: true
      anonymous: false
    archived:
      owner: true
      editor: true
      commenter: true
      viewer: true
      anonymous: false

  edit_attributes:
    active:
      owner: true
      editor: true
      commenter: false
      viewer: false
      anonymous: false

  manage_contributors:
    active:
      owner: true
      editor: true

  archive:
    active:
      owner: true
      editor: true

  restore:
