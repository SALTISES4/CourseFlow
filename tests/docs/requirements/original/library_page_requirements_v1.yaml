# Normalized requirements: 'My library' page (route /library) — filters and sort
# Source: tests/docs/__ARCHIVE/functional-requirements.md ('My library' Section; Sorting, Filtering and Searching; archived project visibility and restore)
# Design evidence: CourseFlow 2.0 'My library' frames (filters, empty, error, archive, favourites, workflow restore)—see designEvidenceLinkTable
# Application code evidence: react/src/components/pages/Library/MyLibrary/*
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/main_navigation_requirements_v1.yaml (library navigation plus '/favourites' navigation entry); tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard and workflowCard — FR-CARD-001 through FR-CARD-006 as applicable; FR-LIB-006 Owner restore/delete on archived rows on 'My library'); tests/docs/requirements/original/explore_page_requirements_v1.yaml, favourites_page_requirements_v1.yaml, and project_workflows_view_requirements_v1.yaml (consume FR-LIB-002 and FR-LIB-003; Explore route and shared search/summary patterns per FR-LIB-001 and FR-LIB-004 through FR-LIB-005)

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  libraryPage:
    meaning: My library page at /library listing the user's in-scope projects and workflows.
  libraryFilterToolbar:
    meaning: Filter toolbar on libraryPage with sort, ownership, type, workflow-type, favourites, archive, and keyword controls.
  sortControl:
    meaning: Sort control on libraryFilterToolbar with placeholder 'Sort' and options A–Z and Date created.
  sortResetButton:
    meaning: Clear control on sortControl that resets active sort.
  ownershipFilter:
    meaning: Single-select ownership filter on libraryFilterToolbar with placeholder 'Ownership'.
  ownershipFilterResetButton:
    meaning: Clear (X) control on ownershipFilter when 'Owned' or 'Shared' is active
  typeFilter:
    meaning: Single-select type filter on libraryFilterToolbar with placeholder 'Type'.
  typeFilterResetButton:
    meaning: Clear (X) control on typeFilter when a non-default type scope is active per design
  workflowTypeFilter:
    meaning: Multiselect workflow-type filter on the library filter toolbar with options Activity, Course, and Program.
  workflowTypeFilterSelectionIndicator:
    meaning: Selection-count badge on the closed workflowTypeFilter trigger.
  favouritesToggle:
    meaning: Favourites boolean filter toggle on libraryFilterToolbar.
  archiveToggle:
    meaning: Archive boolean filter toggle on libraryFilterToolbar.
  keywordSearchField:
    meaning: Keyword search field on libraryFilterToolbar.
  keywordSearchClearButton:
    meaning: Clear control on keywordSearchField when the field is non-empty.
  resultsSummary:
    meaning: Result-count summary region between the filter toolbar and resultsRegion.
  resultsRegion:
    meaning: Main two-column card grid listing library search results.
  projectCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  workflowCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  projectCardRestoreProjectButton:
    meaning: Restore project action on an archived projectCard.
  projectCardDeletePermanentlyButton:
    meaning: Delete permanently action on an archived projectCard.
  deleteProjectPermanentlyModal:
    meaning: Confirmation modal for permanently deleting an archived project.
  deleteProjectPermanentlyModalDeleteProjectButton:
    meaning: Primary confirm control in deleteProjectPermanentlyModal labeled 'Delete project'
  deleteProjectPermanentlyModalCancelButton:
    meaning: Secondary control in deleteProjectPermanentlyModal labeled 'Cancel'
  workflowCardRestoreButton:
    meaning: Restore action on an archived workflowCard.
  restoreParentProjectModal:
    meaning: Modal explaining that restoring a workflow requires restoring its parent project.
  restoreParentProjectModalRestoreProjectButton:
    meaning: Primary control in restoreParentProjectModal labeled 'Restore project'
  workflowCardDeletePermanentlyButton:
    meaning: Delete permanently action on an archived workflowCard.
  deleteWorkflowPermanentlyModal:
    meaning: Confirmation modal for permanently deleting an archived workflow.
  deleteWorkflowPermanentlyModalConfirmButton:
    meaning: Confirm action on deleteWorkflowPermanentlyModal.
  pagination:
    meaning: Shared pagination control for listing surfaces when result count exceeds the page size.
  paginationPageNumberButton:
    meaning: Clickable numeric page control within pagination; clicking navigates to the selected page.
  paginationPreviousNextButton:
    meaning: Single-arrow control within pagination that navigates one page backward or one page forward.
  paginationFirstLastButton:
    meaning: Double-arrow control within pagination that navigates directly to the first page or the last page.
  libraryLoadingState:
    meaning: Loading placeholders shown while library search query is in flight.
  libraryEmptyState:
    meaning: Empty state when library search returns zero matching cards; layout and copy per FIGMA-LIB-EMPTY.
  libraryErrorState:
    meaning: Error state when library search query fails; layout and copy per FIGMA-LIB-ERROR.

