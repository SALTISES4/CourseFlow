# Normalized requirements: 'My library' page (route /library) — filters and sort
# Source: tests/docs/__ARCHIVE/functional-requirements.md ('My library' Section; Sorting, Filtering and Searching; archived project visibility and restore)
# Design evidence: CourseFlow 2.0 'My library' frames (filters, empty, error, archive, favourites, workflow restore)—see designEvidenceLinkTable
# Application code evidence: react/src/components/pages/Library/MyLibrary/*
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/main_navigation_requirements_v1.yaml (library navigation plus '/favourites' navigation entry); tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard and workflowCard — FR-CARD-001 through FR-CARD-006 as applicable; FR-LIB-006 Owner restore/delete on archived rows on 'My library'); tests/docs/requirements/original/project_archive_requirements_v1.yaml (archive-time favourite and Explore removal—FR-PROJ-ARCH-003; in-project links preserved on project archive); tests/docs/requirements/original/workflow_archive_requirements_v1.yaml (archive-time link break, favourite removal—FR-WF-ARCH-003); tests/docs/requirements/original/project_workflows_view_requirements_v1.yaml (archived workflowCard listing when parent project not archived—FR-PROJ-WF-003; permanent delete removes archived workflowCard from that listing—FR-LIB-006); tests/docs/requirements/original/explore_page_requirements_v1.yaml, favourites_page_requirements_v1.yaml, and project_workflows_view_requirements_v1.yaml (consume FR-LIB-002, FR-LIB-003, and FR-LIB-004 where cross-referenced per FR — Explore per FR-EXP-002/003/006, Favourites per FR-FAV-002/003/005, project 'Workflows' per FR-PROJ-WF-002/003/004; templatesToggle uiObject canonical in this file, used on 'Explore' and 'Favourites' only, behaviour per FR-EXP-005 and FR-FAV-004; Explore route and shared search/summary/pagination patterns per FR-LIB-001)

documentPreconditions:
  - user is authenticated to CourseFlow
  - libraryPage base query scope is limited to projects and workflows in the user's 'My library' membership scope per FR-LIB-001

uiObjectDefinitions:
  libraryPage:
    meaning: My library page at /library listing the user's in-scope projects and workflows.
  libraryFilterToolbar:
    meaning: Filter toolbar on libraryPage with sort, ownership, type, workflow-type, favourites, archive, and keyword controls.
  sortControl:
    meaning: Sort control on 'My library', 'Explore', 'Favourites', and project 'Workflows' filter toolbars with placeholder 'Sort' and options 'A - Z' and 'Date created'.
  sortResetButton:
    meaning: Clear control on sortControl that resets active sort.
  ownershipFilter:
    meaning: Single-select ownership filter with placeholder 'Ownership' and options 'Owned' and 'Shared' on 'My library', 'Favourites', and project 'Workflows' filter toolbars.
  ownershipFilterResetButton:
    meaning: Clear (X) control on ownershipFilter that resets the active ownership selection.
  typeFilter:
    meaning: Single-select type filter with placeholder 'Type' on 'My library', 'Explore', and 'Favourites' filter toolbars.
  typeFilterResetButton:
    meaning: Clear (X) control on typeFilter that resets the committed type scope.
  workflowTypeFilter:
    meaning: Multiselect workflow-type filter with options 'Activity', 'Course', and 'Program' on 'My library', 'Explore', 'Favourites', and project 'Workflows' filter toolbars.
  workflowTypeFilterSelectionIndicator:
    meaning: Selection-count badge on the closed workflowTypeFilter trigger.
  favouritesToggle:
    meaning: Boolean filter toggle labeled 'Favourites' on 'My library', 'Explore', and project 'Workflows' filter toolbars.
  archiveToggle:
    meaning: Boolean filter toggle labeled 'Archive' on 'My library' and project 'Workflows' filter toolbars.
  templatesToggle:
    meaning: Boolean filter toggle labeled 'Templates' on 'Explore' and 'Favourites' filter toolbars.
  keywordSearchField:
    meaning: Keyword search field on 'My library', 'Explore', 'Favourites', and project 'Workflows' filter toolbars.
  keywordSearchClearButton:
    meaning: Clear control on keywordSearchField that clears the keyword input.
  resultsSummary:
    meaning: Result-count summary region between the filter toolbar and resultsRegion on listing pages.
  resultsRegion:
    meaning: Two-column grid region on listing pages that renders projectCard and workflowCard instances for the current query page.
  projectCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  workflowCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  projectCardRestoreProjectButton:
    meaning: Restore project action on an archived projectCard.
  projectCardDeletePermanentlyButton:
    meaning: Delete permanently action on an archived projectCard.
  deleteProjectPermanentlyModal:
    meaning: Confirmation modal for permanently deleting an archived project.
  deleteProjectPermanentlyModalDeleteProjectButton:
    meaning: Primary confirm control in deleteProjectPermanentlyModal labeled 'Delete project'
  deleteProjectPermanentlyModalCancelButton:
    meaning: Secondary control in deleteProjectPermanentlyModal labeled 'Cancel'
  workflowCardRestoreButton:
    meaning: Restore action on an archived workflowCard.
  restoreParentProjectModal:
    meaning: Modal explaining that restoring a workflow requires restoring its parent project.
  restoreParentProjectModalRestoreProjectButton:
    meaning: Primary control in restoreParentProjectModal labeled 'Restore project'
  workflowCardDeletePermanentlyButton:
    meaning: Delete permanently action on an archived workflowCard.
  deleteWorkflowPermanentlyModal:
    meaning: Confirmation modal for permanently deleting an archived workflow.
  deleteWorkflowPermanentlyModalConfirmButton:
    meaning: Confirm action on deleteWorkflowPermanentlyModal.
  pagination:
    meaning: Pagination control below resultsRegion on listing pages.
  paginationPageNumberButton:
    meaning: Numeric page item within pagination.
  paginationPreviousNextButton:
    meaning: Single-arrow previous or next control within pagination.
  paginationFirstLastButton:
    meaning: Double-arrow first or last page control within pagination.
  libraryLoadingState:
    meaning: Loading placeholders shown in resultsRegion while a listing query is in flight.
  libraryEmptyState:
    meaning: Empty-state view shown in resultsRegion when the listing query returns zero projectCard and workflowCard instances; layout and copy per FIGMA-LIB-EMPTY.
  libraryErrorState:
    meaning: Error-state view shown in resultsRegion when the listing query fails; layout and copy per FIGMA-LIB-ERROR.

