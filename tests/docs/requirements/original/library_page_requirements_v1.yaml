# Normalized requirements: 'My library' page (route /library) — filters and sort
# Source: tests/docs/__ARCHIVE/functional-requirements.md ('My library' Section; Sorting, Filtering and Searching; archived project visibility and restore)
# Design evidence: CourseFlow 2.0 'My library' frames (filters, empty, error, archive, favourites, workflow restore)—see designEvidenceLinkTable
# Application code evidence: react/src/components/pages/Library/MyLibrary/*
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/main_navigation_requirements_v1.yaml (library navigation plus '/favourites' navigation entry); tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard FR-CARD-001 and FR-CARD-003; workflowCard FR-CARD-002 and FR-CARD-004); tests/docs/requirements/original/explore_page_requirements_v1.yaml (Explore route; keyword search and resultsSummary share the same contracts as 'My library')

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  libraryPage:
    meaning: Surface for 'My library' at route pathname /library with no additional path prefix segment; base scope includes only projects and workflows created by the user or where user role is Editor, Viewer, or Commenter, rendered as projectCard and/or workflowCard per 'Type' scope, with sort, filters, and optional keyword search per this document.
  libraryFilterToolbar:
    meaning: Horizontal toolbar on libraryPage containing sortControl, ownershipFilter, typeFilter, workflowTypeFilter (only when typeFilter includes 'Workflows' in scope—when typeFilter is committed to 'Workflows', or when typeFilter is Unset (no committed 'Projects' or 'Workflows' selection), per FR-LIB-003), favouritesToggle, archiveToggle, and keywordSearchField; control order and grouping per design evidence.
  sortControl:
    meaning: Sort control on libraryFilterToolbar; canonical labels are placeholder 'Sort', options 'A - Z' and 'Date created'; on first load of /library the list is ordered by most recently modified project; user may open the control to choose 'A - Z' or 'Date created'; first click on an option applies ascending order, second click on the same option toggles to descending; when a non-default sort is active, the control shows 'A - Z' or 'Date created' as the visible label (instead of 'Sort') together with sortResetButton.
  sortResetButton:
    meaning: Clear (X) control on sortControl when a non-default sort is active; clears the active sort and restores default ordering by most recently modified project.
  ownershipFilter:
    meaning: Single-select ownership filter on libraryFilterToolbar; canonical placeholder label is 'Ownership'; selectable options include at least 'Owned' and 'Shared'; when an option is active, the visible label is that option name (instead of 'Ownership') together with ownershipFilterResetButton; clicking ownershipFilterResetButton clears the active ownership selection and restores placeholder 'Ownership' (unfiltered by ownership per backend contract).
  ownershipFilterResetButton:
    meaning: Clear (X) control on ownershipFilter when 'Owned' or 'Shared' is active; clears the ownership filter and restores placeholder label 'Ownership'.
  typeFilter:
    meaning: Single-select type filter on libraryFilterToolbar; canonical placeholder label is 'Type'; selectable commitments are 'Projects' and 'Workflows' only (no separate selectable 'All types' row). On first land of /library, default commitment is 'Projects' (FR-LIB-001). When a commitment is active, the visible label is that commitment (instead of 'Type') together with typeFilterResetButton per product reset-display rules. Clearing removes the active commitment and restores default or placeholder behavior per FR-LIB-003.
  typeFilterResetButton:
    meaning: Clear (X) control on typeFilter when a non-default type scope is active per design; clears to the canonical default 'Type' selection ('Projects' on land) or to placeholder per product rules.
  workflowTypeFilter:
    meaning: Multiselect workflow-type filter on libraryFilterToolbar with exactly three options ('Activity', 'Course', and 'Program'). It is visible only when typeFilter includes 'Workflows' in scope—that is, when typeFilter is committed to 'Workflows', or when typeFilter is Unset (no committed 'Projects' or 'Workflows'), per FR-LIB-003; it is not visible when typeFilter is committed to 'Projects' only. When not visible, it does not occupy filter toolbar space. When visible, user may select one or more workflow types; user clears the filter by manually unselecting selected options or using the 'None' control; user may select all options via the 'All' control. When an option has no matching results in the current query context, that option's checkbox is read-only and cannot be clicked.
  workflowTypeFilterSelectionIndicator:
    meaning: Numeric badge shown on the top-right of workflowTypeFilter when at least one workflow-type option is selected; value equals the number of selected options; hidden when no workflow-type option is selected.
  favouritesToggle:
    meaning: Boolean filter on libraryFilterToolbar; when on, results are limited to favourites within 'My library' base scope (objects where user is Owner, Editor, Viewer, or Commenter); when off, favourites filter is not applied (favourites may still appear among other results unless excluded by other filters). This is distinct from the dedicated '/favourites' page, which may include additional published favourited workflows outside 'My library' contributor scope.
  archiveToggle:
    meaning: Boolean filter on libraryFilterToolbar; when off, archived items are excluded from result sets for scopes where archived items are hidden by default; when on, archived items may appear per backend contract (see FR-LIB-006). This control replaces treating 'Archived' as a relationship menu row.
  keywordSearchField:
    meaning: Search field on libraryFilterToolbar; results narrow as user types keyword input; pressing 'Enter' is not required. Keyword search behavior matches 'Explore' (same search contract as 'Explore').
  keywordSearchClearButton:
    meaning: Icon-only clear control ('X') shown on the right side of keywordSearchField when the field is not empty; clicking it clears the field and resets keyword-search filtering.
  resultsSummary:
    meaning: Region between the page filter toolbar and resultsRegion that displays total or range result counts for the current query (e.g. 'Showing X of XX results'); same object on My library (below libraryFilterToolbar) and Explore (below exploreFilterToolbar); exact copy pattern per design evidence.
  resultsRegion:
    meaning: Main content area listing result cards in a fixed two-column grid—always exactly two cards per row everywhere this object appears—at most five rows per page for the current page (10 projectCard and/or workflowCard instances visible at once per active Type scope), plus empty, loading, or error states.
  projectCard:
    meaning: Same canonical object as projectCard in card_content_requirements_v1.yaml; on libraryPage, one instance per project in the current result set when project rows are in scope.
  workflowCard:
    meaning: Same canonical object as workflowCard in card_content_requirements_v1.yaml; on libraryPage, one instance per workflow in the current result set when workflow rows are in scope.
  projectCardRestoreProjectButton:
    meaning: Action on an archived projectCard with label 'Restore project' (placement per FIGMA-LIB-FILTER-ARCHIVE); shown when user hovers the archived projectCard; restores the project and all its child workflows to an active state; after restore, the project and those workflows appear again in the library under normal filters, with the same project contributors and metadata as at the time the project was archived; not a substitute for opening or browsing the archived project while it remains archived.
  projectCardDeletePermanentlyButton:
    meaning: Destructive action on an archived projectCard with label 'Delete permanently' (per FIGMA-LIB-FILTER-ARCHIVE); shown when user hovers the archived projectCard; opens deleteProjectPermanentlyModal so the user must confirm before the project and its child workflows are removed without recovery.
  deleteProjectPermanentlyModal:
    meaning: Confirmation modal shown after user chooses Delete permanently on an archived projectCard; copy and layout match FIGMA-LIB-MODAL-DELETE-PROJECT exactly; user must click deleteProjectPermanentlyModalDeleteProjectButton to proceed with permanent deletion; user may click deleteProjectPermanentlyModalCancelButton ('Cancel') to close the modal and return to the prior screen state without deleting.
  deleteProjectPermanentlyModalDeleteProjectButton:
    meaning: Primary confirm control in deleteProjectPermanentlyModal labeled 'Delete project'; when clicked, system permanently deletes the project and its child workflows so they never become available again in the library or elsewhere under normal product semantics.
  deleteProjectPermanentlyModalCancelButton:
    meaning: Secondary control in deleteProjectPermanentlyModal labeled 'Cancel'; when clicked, system closes deleteProjectPermanentlyModal and leaves the user in the same place as before the modal opened (no permanent deletion).
  workflowCardRestoreButton:
    meaning: Action on an archived workflowCard labeled 'Restore' (per FIGMA-LIB-RESTORE-WORKFLOW); shown when user hovers the archived workflowCard; a child workflow cannot be restored without restoring its parent project, so clicking it opens restoreParentProjectModal rather than restoring the workflow in isolation.
  restoreParentProjectModal:
    meaning: Modal explaining that restoring the workflow requires restoring the parent project; layout and copy match FIGMA-LIB-RESTORE-WORKFLOW exactly; offers restoreParentProjectModalRestoreProjectButton so the user can restore the parent project and all its child workflows together.
  restoreParentProjectModalRestoreProjectButton:
    meaning: Primary control in restoreParentProjectModal labeled 'Restore project'; when clicked, system restores the parent project and every child workflow that was archived with it, after which those objects follow the same post-restore availability rules as a direct projectCardRestoreProjectButton restore.
  workflowCardDeletePermanentlyButton:
    meaning: Destructive action on an archived workflowCard with label 'Delete permanently'; shown when user hovers the archived workflowCard; opens deleteWorkflowPermanentlyModal for explicit confirmation before the workflow is permanently removed per FIGMA-LIB-MODAL-DELETE-WORKFLOW.
  deleteWorkflowPermanentlyModal:
    meaning: Confirmation modal for permanently deleting an archived workflow after Delete permanently on the workflow card; layout and copy match FIGMA-LIB-MODAL-DELETE-WORKFLOW exactly; Owner may use this flow even when the parent project is still archived.
  deleteWorkflowPermanentlyModalConfirmButton:
    meaning: Primary confirm control in deleteWorkflowPermanentlyModal that completes permanent deletion of the workflow when clicked; label matches FIGMA-LIB-MODAL-DELETE-WORKFLOW exactly.
  pagination:
    meaning: Shared pagination control shown when total matching objects for the current query are 11 or more (more than one page at 10 cards per page in a 2×5 grid). Includes clickable page numbers, single-arrow previous or next controls, and double-arrow first or last controls.
  paginationPageNumberButton:
    meaning: Clickable numeric page control within pagination; clicking navigates to the selected page.
  paginationPreviousNextButton:
    meaning: Single-arrow control within pagination that navigates one page backward or one page forward.
  paginationFirstLastButton:
    meaning: Double-arrow control within pagination that navigates directly to the first page or the last page.
  libraryLoadingState:
    meaning: Loading placeholders shown while library search query is in flight.
  libraryEmptyState:
    meaning: Empty state when library search returns zero matching cards; layout and copy per FIGMA-LIB-EMPTY.
  libraryErrorState:
    meaning: Error state when library search query fails; layout and copy per FIGMA-LIB-ERROR.

