# Normalized requirements: global top navigation (application shell)
# Source: application code (no separate Google Doc for this run)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md

documentPreconditions:
  - user is authenticated to CourseFlow
  - user is within the main application shell that renders the global top bar

uiObjectDefinitions:
  topNavigationBar:
    meaning: Global AppBar strip at the top of the main content area; contains a single horizontal layout row (Material-UI Toolbar in current implementation) with leading space for return links and trailing space for add, notifications, and account controls; root uses stable test id top-bar in current implementation.
  returnLinksRegion:
    meaning: Leading segment of topNavigationBar reserved for contextual return links; when the user is viewing a workflow, it occupies the leading side of the bar with return link content (see FR-TOP-005); when the user is not viewing a workflow, it does not occupy that leading side with return navigation.
  addMenuTrigger:
    meaning: Icon button that opens the create/add menu in current implementation.
  addMenuDropdown:
    meaning: Dropdown surface listing create actions for project and workflow types from the add menu in current implementation.
  addMenuItemProject:
    meaning: Menu row that opens createProjectDialog in current implementation.
  addMenuItemProgram:
    meaning: Menu row that opens createWorkflowDialog for a program workflow in current implementation.
  addMenuItemCourse:
    meaning: Menu row that opens createWorkflowDialog for a course workflow in current implementation.
  addMenuItemActivity:
    meaning: Menu row that opens createWorkflowDialog for an activity workflow in current implementation.
  createProjectDialog:
    meaning: Modal dialog for creating a new project; opened from addMenuItemProject.
  createWorkflowDialog:
    meaning: Modal dialog for creating a new workflow; one shared dialog with copy adjusted per workflow type (program, course, activity); opened from addMenuItemProgram, addMenuItemCourse, or addMenuItemActivity.
  notificationsMenuTrigger:
    meaning: Icon button opening notifications; always visible in the top bar when the shell is shown, including when there are no notifications; when there are no unread notifications, the icon has no badge; when there is at least one unread notification, shows a green badge with the unread count (see FR-TOP-006).
  notificationsDropdownPanel:
    meaning: Dropdown panel opened from notificationsMenuTrigger; includes a header with see-all affordance and notificationsList.
  notificationsSeeAllLink:
    meaning: Link in notifications panel header routing to the full notifications view in current implementation.
  notificationsList:
    meaning: List region inside notificationsDropdownPanel; shows at most three notification rows, the three most recent notifications (see FR-TOP-004).
  notificationListItem:
    meaning: One row in notificationsList; composed of notificationListItemUserAvatar, notificationListItemUserName, notificationListItemRelativeTimestamp, notificationListItemContent, and notificationListItemUnreadDot; intended primary navigation target on click is the referenced project or workflow (see FR-TOP-007, not yet implemented).
  notificationListItemUserAvatar:
    meaning: Visual representing the acting user; for now shows initials only (image placeholder until a full user image is used).
  notificationListItemUserName:
    meaning: Display name of the user associated with the notification.
  notificationListItemRelativeTimestamp:
    meaning: Time label relative to now for when the notification applies (for example '9 hours ago').
  notificationListItemContent:
    meaning: Body text of the notification (for example 'Added you to project X').
  notificationListItemUnreadDot:
    meaning: Dot indicator for an unread notification (see FR-TOP-004); visible until the user has clicked that notificationListItem; only that click marks the row read in the panel (opening the panel or other panel controls do not mark notifications read).
  accountMenuTrigger:
    meaning: Icon button that opens the account menu in current implementation.
  accountMenuDropdown:
    meaning: Dropdown opened from accountMenuTrigger; sub-item order and grouping (including separator before sign out) match FIGMA-TOP-PROFILE-OPEN; lists accountMenuItemProfile, accountMenuItemPassword, accountMenuItemNotificationsSettings, and accountMenuItemSignOut in top-to-bottom order.
  accountMenuItemProfile:
    meaning: Row in accountMenuDropdown that navigates to profile settings route pattern /user/profile-settings.
  accountMenuItemPassword:
    meaning: Row in accountMenuDropdown that navigates to password reset route pattern /user/password-reset (passwordResetPage).
  accountMenuItemNotificationsSettings:
    meaning: Row in accountMenuDropdown that navigates to notification settings route pattern /user/notifications-settings.
  accountMenuItemSignOut:
    meaning: Row in accountMenuDropdown that performs sign out via external logout path in current implementation.
  passwordResetPage:
    meaning: Full-page password reset experience at route pattern /user/password-reset (not a modal dialog); reached by clicking accountMenuItemPassword.
  backToProjectLink:
    meaning: Link in returnLinksRegion whose label follows 'Return to [Project Name]' (localized return prefix plus parent project title); a workflow is always one of Program, Course, or Activity and always belongs to a project; shown only while the user is viewing a workflow; must not appear in any other context.

locatorMappings:
  topNavigationBar:
    strategy: "[data-test-id=\"top-bar\"]"
    confidence: confirmed
  addMenuTrigger:
    strategy: "[aria-label=\"add menu\"]"
    confidence: inferred
  accountMenuTrigger:
    strategy: "[aria-label=\"account of current user\"]"
    confidence: inferred
  notificationsMenuTrigger:
    strategy: "[aria-controls=\"notifications-menu\"]"
    confidence: inferred
  returnLinksRegion:
    strategy: "{topNavigationBar} .back-links-wrap"
    confidence: inferred
  backToProjectLink:
    strategy: "#project-return"
    confidence: inferred
  addMenuDropdown:
    strategy: null
    confidence: unresolved
  notificationsDropdownPanel:
    strategy: null
    confidence: unresolved
  accountMenuDropdown:
    strategy: null
    confidence: unresolved
  accountMenuItemProfile:
    strategy: null
    confidence: unresolved
  accountMenuItemPassword:
    strategy: null
    confidence: unresolved
  accountMenuItemNotificationsSettings:
    strategy: null
    confidence: unresolved
  accountMenuItemSignOut:
    strategy: null
    confidence: unresolved
  passwordResetPage:
    strategy: null
    confidence: confirmed
  createProjectDialog:
    strategy: null
    confidence: unresolved
  createWorkflowDialog:
    strategy: null
    confidence: unresolved

requirements:
  - id: FR-TOP-001
    title: Top navigation bar visibility and layout

    designEvidence:
      - FIGMA-TOP-DEFAULT

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - returnLinksRegion
      - addMenuTrigger
      - notificationsMenuTrigger
      - accountMenuTrigger

    preconditions:
      - main application shell is rendered

    trigger: []

    mainFlow:
      - system renders topNavigationBar spanning the top of the main block
      - when the user is viewing a workflow, returnLinksRegion occupies the leading (start) side of topNavigationBar's horizontal layout row with return link content; when the user is not viewing a workflow, returnLinksRegion is hidden
      - addMenuTrigger, notificationsMenuTrigger, and accountMenuTrigger are shown in a horizontal cluster at the trailing end of topNavigationBar's horizontal layout row

    roleBehavior: {}

    acceptanceCriteria:
      - topNavigationBar is visible
      - addMenuTrigger is visible
      - notificationsMenuTrigger is visible, including when there are no notifications
      - accountMenuTrigger is visible

    openQuestions:
      - Current implementation may omit notificationsMenuTrigger while the notifications query is loading or when response data is absent; align implementation with FR-TOP-001 acceptance if discrepancies remain.

  - id: FR-TOP-002
    title: Add menu (create project and workflows)

    designEvidence:
      - FIGMA-TOP-DEFAULT
      - FIGMA-TOP-ADD-OPEN

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - addMenuTrigger
      - addMenuDropdown
      - addMenuItemProject
      - addMenuItemProgram
      - addMenuItemCourse
      - addMenuItemActivity
      - createProjectDialog
      - createWorkflowDialog

    preconditions:
      - addMenuTrigger is visible

    trigger:
      - user clicks addMenuTrigger

    mainFlow:
      - system opens addMenuDropdown
      - addMenuDropdown lists addMenuItemProject, addMenuItemProgram, addMenuItemCourse, and addMenuItemActivity
      - when the user clicks addMenuItemProject, system opens createProjectDialog
      - when the user clicks addMenuItemProgram, addMenuItemCourse, or addMenuItemActivity, system opens createWorkflowDialog with copy appropriate to the selected workflow type

    roleBehavior: {}

    acceptanceCriteria:
      - when addMenuDropdown is open, user sees all four create entries: addMenuItemProject, addMenuItemProgram, addMenuItemCourse, and addMenuItemActivity
      - when user clicks addMenuItemProject, createProjectDialog opens
      - when user clicks addMenuItemProgram, addMenuItemCourse, or addMenuItemActivity, createWorkflowDialog opens with copy adjusted for program, course, or activity respectively

    openQuestions:
      - Menu copy is localized via strings module; acceptance should use current locale strings rather than hardcoded English.

  - id: FR-TOP-003
    title: Account menu (profile, settings, sign out)

    designEvidence:
      - FIGMA-TOP-DEFAULT
      - FIGMA-TOP-PROFILE-OPEN

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - accountMenuTrigger
      - accountMenuDropdown
      - accountMenuItemProfile
      - accountMenuItemPassword
      - accountMenuItemNotificationsSettings
      - accountMenuItemSignOut
      - passwordResetPage

    preconditions:
      - accountMenuTrigger is visible

    trigger:
      - user clicks accountMenuTrigger

    mainFlow:
      - system opens accountMenuDropdown
      - accountMenuDropdown lists accountMenuItemProfile, accountMenuItemPassword, accountMenuItemNotificationsSettings, and accountMenuItemSignOut in top-to-bottom order (separator before accountMenuItemSignOut per FIGMA-TOP-PROFILE-OPEN)
      - when user clicks accountMenuItemProfile, application navigates to route pattern /user/profile-settings
      - when user clicks accountMenuItemPassword, application navigates to route pattern /user/password-reset (passwordResetPage)
      - when user clicks accountMenuItemNotificationsSettings, application navigates to route pattern /user/notifications-settings
      - when user clicks accountMenuItemSignOut, user signs out via external logout path

    roleBehavior: {}

    acceptanceCriteria:
      - when accountMenuDropdown is open, user sees accountMenuItemProfile, accountMenuItemPassword, accountMenuItemNotificationsSettings, and accountMenuItemSignOut in top-to-bottom order matching FIGMA-TOP-PROFILE-OPEN
      - when user clicks accountMenuItemProfile, current route matches /user/profile-settings
      - when user clicks accountMenuItemPassword, current route matches /user/password-reset
      - when user clicks accountMenuItemNotificationsSettings, current route matches /user/notifications-settings
      - when user clicks accountMenuItemSignOut, user session ends per external logout behavior

    openQuestions: []

  - id: FR-TOP-004
    title: Notifications dropdown panel (list limit, read or unread rows, see all)

    designEvidence:
      - FIGMA-TOP-DEFAULT
      - FIGMA-TOP-NOTIF-OPEN

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - notificationsMenuTrigger
      - notificationsDropdownPanel
      - notificationsSeeAllLink
      - notificationsList
      - notificationListItem
      - notificationListItemUserAvatar
      - notificationListItemUserName
      - notificationListItemRelativeTimestamp
      - notificationListItemContent
      - notificationListItemUnreadDot

    preconditions:
      - user has at least one notification

    trigger:
      - user clicks notificationsMenuTrigger

    mainFlow:
      - system opens notificationsDropdownPanel showing a notifications heading and notificationsSeeAllLink
      - notificationsList renders at most three notificationListItem rows, the most recent notifications, from most recent to less recent
      - each notificationListItem presents notificationListItemUserAvatar (initials for now), notificationListItemUserName, notificationListItemRelativeTimestamp, notificationListItemContent, and notificationListItemUnreadDot
      - notificationListItemUnreadDot is visible until the user has clicked notificationListItem; after the user clicks notificationListItem, notificationListItemUnreadDot is not shown for that row in notificationsDropdownPanel
      - marking a notification read in notificationsDropdownPanel is only by clicking that notificationListItem; opening notificationsDropdownPanel or clicking notificationsSeeAllLink does not mark notifications read
      - when user clicks notificationsSeeAllLink, application navigates to route pattern /user/notifications

    roleBehavior: {}

    acceptanceCriteria:
      - notificationsList shows at most three notificationListItem rows, corresponding to the most recent notifications
      - each notificationListItem shows notificationListItemUserAvatar (initials for now), notificationListItemUserName, notificationListItemRelativeTimestamp, notificationListItemContent, and notificationListItemUnreadDot when the row is unread
      - notificationListItemRelativeTimestamp is expressed relative to now (for example hours or days ago)
      - notificationListItemContent conveys the notification message (for example reference to a project or workflow action)
      - given a notificationListItem the user has not clicked, notificationListItemUnreadDot is visible in notificationsDropdownPanel
      - given a notificationListItem the user has clicked, notificationListItemUnreadDot is not shown in notificationsDropdownPanel
      - opening notificationsDropdownPanel or navigating via notificationsSeeAllLink does not by itself change read or unread state of notification rows in the panel; only clicking notificationListItem does
      - notificationsSeeAllLink is visible in the panel header and routes to /user/notifications

    openQuestions:
      - Persistence of read state after navigation or refresh depends on API contract; confirm when authoring tests.
      - Panel when the API returns fewer than three notifications or none may still need product rules; FR-TOP-001 requires notificationsMenuTrigger to remain visible per current requirement set.

  - id: FR-TOP-005
    title: Return to project link from workflow view

    designEvidence:
      - FIGMA-TOP-DEFAULT

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - returnLinksRegion
      - backToProjectLink

    preconditions:
      - user is viewing a workflow

    trigger: []

    mainFlow:
      - when the user is viewing a workflow, system shows backToProjectLink at the top left of topNavigationBar (returnLinksRegion) with label 'Return to [Project Name]' using the parent project title.
      - when the user is in any other context, system does not show backToProjectLink
      - when the user clicks backToProjectLink, application navigates to the project's 'Workflows' view route pattern /project/{id}/workflows for that project

    roleBehavior: {}

    acceptanceCriteria:
      - given the user is viewing a workflow, backToProjectLink is visible in returnLinksRegion and its label includes 'Return to' and the parent project name
      - given the user is not viewing a workflow, backToProjectLink is not visible
      - when backToProjectLink is visible, it navigates to route pattern /project/{id}/workflows for the active project id

    openQuestions:
      - Current ReturnLinks implementation may not yet match visibility rules (e.g. public view); align implementation and tests with acceptance criteria.

  - id: FR-TOP-006
    title: Notifications menu trigger unread badge states

    designEvidence:
      - FIGMA-TOP-NOTIF-ZERO
      - FIGMA-TOP-NOTIF-BADGE

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - notificationsMenuTrigger

    preconditions:
      - notificationsMenuTrigger is visible

    trigger: []

    mainFlow:
      - when there are no unread notifications (unreadCount is zero), notificationsMenuTrigger shows the bell without a green badge
      - when there is at least one unread notification (unreadCount is greater than zero), notificationsMenuTrigger shows a green badge on the bell with the unread count

    roleBehavior: {}

    acceptanceCriteria:
      - given there are no unread notifications, notificationsMenuTrigger matches FIGMA-TOP-NOTIF-ZERO (no green badge)
      - given there is at least one unread notification, notificationsMenuTrigger matches FIGMA-TOP-NOTIF-BADGE (green badge shows the unread count)

    openQuestions:
      - Until the client always renders notificationsMenuTrigger while data loads, align loading and error states with FR-TOP-001.

  - id: FR-TOP-007
    title: Notification list item navigates to referenced project or workflow [NOT READY]

    designEvidence:
      - FIGMA-TOP-NOTIF-OPEN

    actors:
      - user

    uiObjects:
      - notificationsDropdownPanel
      - notificationsList
      - notificationListItem

    preconditions:
      - notificationsDropdownPanel is open
      - at least one notificationListItem is present

    trigger:
      - user clicks notificationListItem

    mainFlow:
      - when the user clicks notificationListItem, application navigates to the project or workflow that the notification references

    roleBehavior: {}

    acceptanceCriteria:
      - technical intent (not for test generation until finalized): when the user clicks notificationListItem, application navigates to the project or workflow that the notification references

    openQuestions:
      - Intentional placeholder; navigation on notificationListItem click is not implemented and the full specification (routing, project vs workflow, deep links, error handling) is pending; do not generate tests from this requirement until the product spec is complete and implementation exists.

