# Normalized requirements: workflow section management in Workflow view
# Source: tests/docs/__ARCHIVE/edit_section_requirements_v1.md
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md

documentPreconditions:
  - user is authenticated to CourseFlow
  - user has navigated to a workflow where they have Viewer, Commenter, Editor, or Owner role (per upstream prerequisites)

uiObjectDefinitions:
  workflowView:
    meaning: Surface for the active course workflow route; in scope here, the edit view that lists sections and nodes (not strategy-only presentation when applicable).
  weeksBlock:
    meaning: Scrollable block that contains all section containers in document order; root uses stable test id weeks-block in current implementation.
  sectionContainer:
    meaning: Visual and interaction container for one section (ordered segment of the workflow); maps to one section entity; root exposes data-week-id with section id in current implementation.
  sectionHeader:
    meaning: Header row for a sectionContainer including section index label, optional title text, collapse control, and hover affordances; clicking the header (outside node cells) selects the section for the right sidebar in current implementation.
  sectionNumberLabel:
    meaning: Numeric label for section order (1-based top-to-bottom in current implementation).
  sectionTitleText:
    meaning: Title string shown on sectionHeader when the section title is persisted and non-empty; when the stored title is empty, sectionHeader shows no title text (no placeholder, no default label—only section number per FR-SEC-002).
  sectionHeaderHoverMenu:
    meaning: Hover toolbar on sectionHeader with insert-below, duplicate, delete, and comment actions in current implementation.
  insertBelowControl:
    meaning: Control that inserts a new empty section directly below the target section (hover menu item in current implementation).
  duplicateSectionControl:
    meaning: Entry point that duplicates the section below the source; available from sectionHeaderHoverMenu and from editSectionForm in current implementation.
  deleteSectionControl:
    meaning: Entry point that opens delete confirmation; available from sectionHeaderHoverMenu and from editSectionForm in current implementation.
  commentSectionControl:
    meaning: Control on sectionHeaderHoverMenu that opens comments for the section in the right sidebar in current implementation.
  rightSidebar:
    meaning: Right-hand panel for editing and comments; root uses stable test id sidebar in current implementation.
  editSectionForm:
    meaning: Form region for the selected section inside rightSidebar 'Edit' tab, including title field and actions (template, duplicate, delete) in current implementation.
  sectionTitleField:
    meaning: Single-line field for section title on editSectionForm (labeled 'Week' in current UI copy).
  duplicateSectionButton:
    meaning: Duplicate action button on editSectionForm.
  deleteSectionButton:
    meaning: Delete action button on editSectionForm.
  deleteSectionDialog:
    meaning: Modal confirming section deletion; same modal for delete entry from hover or sidebar per upstream FR-SEC-006.
  deleteSectionDialogCancelButton:
    meaning: Cancel control on deleteSectionDialog; dismisses without deleting.
  deleteSectionDialogConfirmButton:
    meaning: Primary confirm control on deleteSectionDialog; performs delete when the user clicks it.
  sidebarTabs:
    meaning: Tab strip on rightSidebar switching 'Edit' vs 'Comments' when comments are available for the selection in current implementation.
  commentsTab:
    meaning: Tab value that shows threaded comments UI for the selected object in rightSidebar.

locatorMappings:
  weeksBlock:
    strategy: "[data-test-id=\"weeks-block\"]"
    confidence: confirmed
  sectionContainer:
    strategy: "[data-week-id]"
    confidence: confirmed
  sectionHeader:
    strategy: "{sectionContainer} header region including week title row"
    confidence: inferred
  rightSidebar:
    strategy: "[data-test-id=\"sidebar\"]"
    confidence: confirmed
  editSectionForm:
    strategy: null
    confidence: unresolved
  sectionTitleField:
    strategy: null
    confidence: unresolved
  sectionHeaderHoverMenu:
    strategy: "{sectionContainer} .hover-menu"
    confidence: inferred
  deleteSectionDialog:
    strategy: "[aria-labelledby=\"delete-week-part-modal\"]"
    confidence: inferred

requirements:
  - id: FR-SEC-001
    title: Open Edit Section Form

    designEvidence:
      - FIGMA-SEC-OE-EDIT
      - FIGMA-SEC-CV-EDIT

    actors:
      - owner
      - editor
      - viewer
      - commenter

    uiObjects:
      - workflowView
      - weeksBlock
      - sectionContainer
      - sectionHeader
      - rightSidebar
      - editSectionForm

    preconditions:
      - workflowView is open on the Workflow edit presentation
      - at least one sectionContainer exists

    trigger:
      - user clicks sectionContainer (section header area) to select the section, or
      - user already has rightSidebar open and clicks sectionHeader for a section (header above the separator between section header and node area per upstream)

    mainFlow:
      - system opens rightSidebar with editSectionForm for the identified section, or updates rightSidebar content to editSectionForm when the sidebar was already open

    roleBehavior:
      viewer:
        editSectionForm: readOnlyPresentation
      commenter:
        editSectionForm: readOnlyPresentation
      owner:
        editSectionForm: editableWhereApplicable
      editor:
        editSectionForm: editableWhereApplicable

    acceptanceCriteria:
      - given rightSidebar is closed, when user clicks sectionHeader for a section, then rightSidebar opens and shows editSectionForm for that section
      - given rightSidebar is already open, when user clicks sectionHeader for a section, then rightSidebar shows editSectionForm for that section

    openQuestions: []

  - id: FR-SEC-002
    title: Section numbering and display

    designEvidence:
      - FIGMA-SEC-OE-EDIT
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-C-HOVER

    actors:
      - system

    uiObjects:
      - weeksBlock
      - sectionContainer
      - sectionHeader
      - sectionNumberLabel
      - sectionTitleText
      - editSectionForm

    preconditions:
      - workflow contains 1..N section containers

    trigger:
      - any section create, insert, delete, or reorder operation completes

    mainFlow:
      - system recalculates section numbers top-to-bottom starting at 1
      - system always shows section number on sectionHeader without requiring hover
      - if editSectionForm title field is non-empty for a section, sectionHeader shows number and title text; if title is empty, sectionHeader shows number only with no additional title text (no default text)

    roleBehavior: {}

    acceptanceCriteria:
      - when a section is inserted between existing sections, numbering updates so indices stay contiguous from top to bottom
      - given edit section title field is empty for a section, sectionHeader shows only the number with no title text and no default text

    openQuestions: []

  - id: FR-SEC-003
    title: Edit section title (auto-save)

    designEvidence:
      - FIGMA-SEC-OE-EDIT

    actors:
      - owner
      - editor

    preconditions:
      - editSectionForm is open for a section
      - user has edit rights for the workflow

    trigger:
      - user types, pastes, or clears sectionTitleField

    mainFlow:
      - system auto-saves changes without a Save button on the form
      - sectionHeader updates to reflect persisted title after save

    roleBehavior:
      viewer:
        sectionTitleField: notEditable
      commenter:
        sectionTitleField: notEditable
      owner:
        sectionTitleField: editable
      editor:
        sectionTitleField: editable

    acceptanceCriteria:
      - when changes are valid, title persists without an explicit Save control and sectionHeader reflects the persisted title
      - given sectionTitleField is cleared, when auto-save completes, section shows number only on sectionHeader per FR-SEC-002 (no placeholder)

    openQuestions: []

  - id: FR-SEC-004
    title: Insert section below (hover)

    designEvidence:
      - FIGMA-SEC-OE-HOVER

    actors:
      - owner
      - editor
      - commenter
      - viewer

    preconditions:
      - target section exists
      - user has edit rights where insert is allowed

    trigger:
      - user clicks insertBelowControl on sectionHeaderHoverMenu (visible on hover of sectionHeader per upstream)

    mainFlow:
      - system inserts a new empty section directly below the target section
      - system renumbers sections

    roleBehavior:
      viewer:
        insertBelowControl: notVisibleOnHover
      commenter:
        insertBelowControl: visibleOnHoverInactive
      owner:
        insertBelowControl: active
      editor:
        insertBelowControl: active

    acceptanceCriteria:
      - given section at index K, when insert below succeeds, new section is at K+1 and following indices shift
      - given commenter role, insertBelowControl is visible on hover of sectionHeader but inactive
      - given viewer role, insertBelowControl is not visible on hover of sectionHeader

    openQuestions:
      - Commenter and viewer hover inactive behavior per acceptance criteria is pending in the application; confirm when implementing or testing.

  - id: FR-SEC-005
    title: Duplicate section below (hover or sidebar)

    designEvidence:
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-OE-EDIT

    actors:
      - owner
      - editor
      - commenter
      - viewer

    preconditions:
      - at least one section exists in the workflow

    trigger:
      - user clicks duplicate from sectionHeaderHoverMenu, or
      - user clicks duplicateSectionButton on editSectionForm in rightSidebar

    mainFlow:
      - system creates a copy of the section below the source section
      - system duplicates nodes, node metas, associated outcomes, linked workflows, and edges per upstream
      - system does not duplicate comments
      - copied section title is generated by appending literal ' (copy)' to the current source title when the source title is non-empty; when the source title is empty, the copied section title is the literal ' (copy)' (leading space)
      - nested duplicates append per upstream (e.g. 'section (copy)' → 'section (copy) (copy)')
      - system renumbers sections

    roleBehavior:
      viewer:
        duplicateSectionControl: hoverNotVisible
        duplicateSectionButton: readOnly
      commenter:
        duplicateSectionControl: hoverVisibleInactive
        duplicateSectionButton: readOnly
      owner:
        duplicateSectionControl: active
        duplicateSectionButton: active
      editor:
        duplicateSectionControl: active
        duplicateSectionButton: active

    acceptanceCriteria:
      - content mirrored except comments; copied section is placed immediately below the source section
      - given commenter role, duplicate hover control is visible and inactive and duplicateSectionButton is read-only in editSectionForm
      - given viewer role, duplicate hover control is not visible and duplicateSectionButton is read-only in editSectionForm
      - given source section title is empty, duplicated section stored title is the literal ' (copy)'

    openQuestions:
      - Deep duplication scope (nodes, edges, outcomes) is asserted in upstream FR; confirm backend contract for full parity in automated tests.

  - id: FR-SEC-006
    title: Delete section

    designEvidence:
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-OE-EDIT
      - FIGMA-SEC-DEL-WARN

    actors:
      - owner
      - editor

    preconditions:
      - target section exists

    trigger:
      - user clicks delete from sectionHeaderHoverMenu, or
      - user clicks deleteSectionButton on editSectionForm in rightSidebar

    mainFlow:
      - system opens deleteSectionDialog for either entry path
      - modal content (title, subtitle, button labels) is identical across locales per upstream
      - if user clicks deleteSectionDialogCancelButton, modal closes and workflow is unchanged (section, nodes, edges, numbering unchanged)
      - if user clicks deleteSectionDialogConfirmButton, system removes section and contained content (nodes, edges, node metas, associated outcomes, linked workflows, comments per upstream) then renumbers remaining sections

    roleBehavior: {}

    acceptanceCriteria:
      - section is not deleted until the user clicks deleteSectionDialogConfirmButton
      - when deleteSectionDialogCancelButton is clicked, modal closes and no changes occur
      - given confirmed delete, when operation completes, section and listed content are removed and remaining section numbers reflect new order

    openQuestions: []

  - id: FR-SEC-007
    title: Permissions and read-only presentation

    designEvidence:
      - FIGMA-SEC-OE-EDIT
      - FIGMA-SEC-CV-EDIT
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-C-HOVER

    actors:
      - system
      - owner
      - editor
      - commenter
      - viewer

    preconditions:
      - user has access to the workflow

    trigger: []

    mainFlow:
      - owner and editor may use section-hover actions (insert, duplicate, delete, comment) and editSectionForm fields are editable
      - viewer sees sections; section hover icons are not visible; editSectionForm fields are read-only; form action buttons are disabled per upstream
      - commenter may view and comment on sections; on hover, all four icons are visible but only commentSectionControl is active; editSectionForm fields are read-only; form action buttons are disabled per upstream
      - full behavior in this requirement is partially deferred in the current application; acceptance criteria describe the target product behavior

    roleBehavior:
      owner:
        sectionHeaderHoverMenu: fullEditSet
      editor:
        sectionHeaderHoverMenu: fullEditSet
      commenter:
        sectionHeaderHoverMenu: commentOnlyActive
      viewer:
        sectionHeaderHoverMenu: hidden

    acceptanceCriteria:
      - given viewer role, section hover icons are not displayed on sectionHeader
      - given owner or editor role, when hovering sectionHeader, all four hover actions are available
      - given commenter role, when hovering sectionHeader, all four hover icons are visible but only commentSectionControl is active
      - given viewer or commenter role, when editSectionForm is open in rightSidebar, sectionTitleField is read-only and buttons are disabled

    openQuestions: []

  - id: FR-SEC-008
    title: Data integrity for edges across section changes

    designEvidence: []

    actors:
      - system

    preconditions:
      - workflow contains inter-section edges (edges linking nodes in different sections)

    trigger:
      - section insert, reorder, delete, or duplicate operations occur

    mainFlow:
      - system applies global edge rules (preservation on insert, reorder, duplicate; delete removes incident edges with deleted nodes)

    roleBehavior: {}

    acceptanceCriteria:
      - given section insertion between two sections that had linked nodes, when insert completes, existing cross-section edges remain
      - given confirmed section delete, when section nodes are removed, all edges originating or targeting those nodes are deleted

    openQuestions:
      - No Figma design evidence in upstream; validate against backend or graph-level specifications when authoring tests.

  - id: FR-SEC-009
    title: Comment on section (hover icon)

    designEvidence:
      - FIGMA-SEC-C-HOVER
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-COM-OE
      - FIGMA-SEC-COM-C
      - FIGMA-SEC-COM-V

    actors:
      - owner
      - editor
      - commenter
      - viewer

    preconditions:
      - user has comment rights on the workflow

    trigger:
      - user clicks commentSectionControl on sectionHeaderHoverMenu

    mainFlow:
      - user clicks commentSectionControl on sectionHeaderHoverMenu
      - commentsTab is selected in rightSidebar
      - capabilities in comments tab follow product commenting permissions (create, reply, edit, delete as applicable)

    roleBehavior: {}

    acceptanceCriteria:
      - given owner or editor role, when comments are opened from section, UI matches FIGMA-SEC-COM-OE
      - given commenter role, when comments are opened, UI matches FIGMA-SEC-COM-C
      - given viewer role, when comments are opened via allowed entry path, UI matches FIGMA-SEC-COM-V

    openQuestions: []

