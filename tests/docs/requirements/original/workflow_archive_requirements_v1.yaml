# Normalized requirements: archive workflow (confirmation and outcomes)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Archiving a Workflow)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/original/context_action_bar_requirements_v1.yaml (FR-CAB-005 entry from contextActionBarOverflowItemArchiveWorkflow)
#   - tests/docs/requirements/original/project_workflows_view_requirements_v1.yaml (post-archive navigation target—/project/{id}/workflows)
#   - tests/docs/requirements/original/project_overview_requirements_v1.yaml (unpublish when archiving a published workflow—FR-PROJ-OV-003)
#   - tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml (parent node link break and field retention—FR-WF-ARCH-003; link dialog eligibility—FR-WF-EN-010; manual unlink contrast—FR-WF-EN-011)
#   - tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (workflowNodeLinkedWorkflowIndicator removed on parent nodes—FR-WF-NODE-001)
#   - tests/docs/requirements/original/workflow_overview_requirements_v1.yaml (parent Overview auto-calculate after link break—FR-WF-OV-003 through FR-WF-OV-010)
#   - tests/docs/requirements/original/main_navigation_requirements_v1.yaml (containsSection no longer lists archived-unlinked child—FR-NAV-012)
#   - tests/docs/requirements/original/project_archive_requirements_v1.yaml (batch project archive preserves in-project links—FR-PROJ-ARCH-003)
#   - tests/docs/requirements/original/library_page_requirements_v1.yaml (single-workflow restore does not re-link—FR-LIB-006; project restore reinstates links—FR-LIB-006)
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002; mid-session archive eviction—FR-WS-ACCESS-005)

documentPreconditions:
  - user is authenticated to CourseFlow
  - requirements in this file assume the above hold; when they do not, assert per tests/docs/requirements/original/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002

uiObjectDefinitions:
  contextActionBarOverflowItemArchiveWorkflow:
    meaning: Canonical definition in context_action_bar_requirements_v1.yaml (FR-CAB-005).
  archiveWorkflowConfirmationModal:
    meaning: Confirmation modal for archiving a workflow.
  archiveWorkflowConfirmationModalCancelButton:
    meaning: Cancel action on archiveWorkflowConfirmationModal.
  archiveWorkflowConfirmationModalConfirmButton:
    meaning: Confirm action on archiveWorkflowConfirmationModal.
  globalMessageSnackbar:
    meaning: Canonical definition in workflow_header_requirements_v1.yaml.

locatorMappings:
  contextActionBarOverflowItemArchiveWorkflow: "canonical_locators.yaml -> contextActionBarOverflowItemArchiveWorkflow"
  archiveWorkflowConfirmationModal: "canonical_locators.yaml -> archiveWorkflowConfirmationModal"
  archiveWorkflowConfirmationModalCancelButton: "canonical_locators.yaml -> archiveWorkflowConfirmationModalCancelButton"
  archiveWorkflowConfirmationModalConfirmButton: "canonical_locators.yaml -> archiveWorkflowConfirmationModalConfirmButton"
  globalMessageSnackbar: "canonical_locators.yaml -> globalMessageSnackbar"

requirements:
  - id: FR-WF-ARCH-001
    title: Archive workflow confirmation modal opens from contextActionBar overflow

    designEvidence:
      - FIGMA-CAB-WF-ARCHIVE-WORKFLOW-MODAL

    actors:
      - owner

    uiObjects:
      - contextActionBarOverflowItemArchiveWorkflow
      - archiveWorkflowConfirmationModal
      - archiveWorkflowConfirmationModalCancelButton
      - archiveWorkflowConfirmationModalConfirmButton

    preconditions:
      - current route matches route pattern '/workflow/{id}' or '/workflow/{id}/...' (workflow sub-views such as overview or outcomes)
      - user is owner of the workflow
      - contextActionBarOverflowMenu is open with contextActionBarOverflowItemArchiveWorkflow actionable per FR-CAB-005

    trigger:
      - owner clicks contextActionBarOverflowItemArchiveWorkflow

    mainFlow:
      - system presents archiveWorkflowConfirmationModal per FIGMA-CAB-WF-ARCHIVE-WORKFLOW-MODAL
      - archiveWorkflowConfirmationModal includes archiveWorkflowConfirmationModalCancelButton and archiveWorkflowConfirmationModalConfirmButton; modal title, body copy, and both button labels match the user-visible strings in FIGMA-CAB-WF-ARCHIVE-WORKFLOW-MODAL after substituting the workflow's user-visible type label for any '[workflow type]' placeholder shown in that design (for example for an activity workflow, confirm copy reads 'Archive activity' instead of a string that still contains '[workflow type]')

    roleBehavior: {}

    acceptanceCriteria:
      - given owner trigger, archiveWorkflowConfirmationModal is visible
      - archiveWorkflowConfirmationModalCancelButton and archiveWorkflowConfirmationModalConfirmButton are visible
      - modal title and body copy match FIGMA-CAB-WF-ARCHIVE-WORKFLOW-MODAL with '[workflow type]' replaced by the workflow's type label for that workflow instance
      - archiveWorkflowConfirmationModalCancelButton and archiveWorkflowConfirmationModalConfirmButton labels match FIGMA-CAB-WF-ARCHIVE-WORKFLOW-MODAL with the same substitution rule where templated copy applies

    openQuestions: []

  - id: FR-WF-ARCH-002
    title: Cancel archive workflow leaves workflow unchanged

    designEvidence:
      - FIGMA-CAB-WF-ARCHIVE-WORKFLOW-MODAL

    actors:
      - owner

    uiObjects:
      - archiveWorkflowConfirmationModal
      - archiveWorkflowConfirmationModalCancelButton

    preconditions:
      - archiveWorkflowConfirmationModal is open
      - owner opened archiveWorkflowConfirmationModal from contextActionBar per FR-WF-ARCH-001 (including from any workflow sub-view pathname under '/workflow/{id}/')

    trigger:
      - owner clicks archiveWorkflowConfirmationModalCancelButton

    mainFlow:
      - system closes archiveWorkflowConfirmationModal
      - owner is returned to the same application location as when owner opened the modal—pathname matches the pathname that was current when the modal opened (including any segments after '/workflow/{id}/' for the same workflow id)
      - workflow remains not archived

    roleBehavior: {}

    acceptanceCriteria:
      - given trigger, archiveWorkflowConfirmationModal is not visible
      - given trigger, application URL pathname equals the pathname when owner opened archiveWorkflowConfirmationModal (any '/workflow/{id}/...' sub-view is preserved for the same workflow id)
      - workflow is not archived as a result of clicking archiveWorkflowConfirmationModalCancelButton

    openQuestions: []

  - id: FR-WF-ARCH-003
    title: Confirm archive workflow applies archived state and navigates to /project/{id}/workflows

    designEvidence:
      - FIGMA-CAB-WF-ARCHIVE-WORKFLOW-MODAL

    actors:
      - owner

    uiObjects:
      - archiveWorkflowConfirmationModal
      - archiveWorkflowConfirmationModalConfirmButton
      - globalMessageSnackbar

    preconditions:
      - archiveWorkflowConfirmationModal is open

    trigger:
      - owner clicks archiveWorkflowConfirmationModalConfirmButton

    mainFlow:
      - system closes archiveWorkflowConfirmationModal after successful archive
      - workflow is archived and removed from favourites
      - if the workflow was published at the time of archiving, it becomes unpublished per FR-PROJ-OV-003
      - scope — link break bullets below apply only when owner archives a single workflow from contextActionBarOverflowItemArchiveWorkflow per FR-WF-ARCH-001; they do not apply when the whole parent project is archived per tests/docs/requirements/original/project_archive_requirements_v1.yaml FR-PROJ-ARCH-003, which preserves in-project linkedWorkflow associations for project restore per FR-LIB-006
      - link break on archive — when archived workflow C had been linked from one or more workflowNodes in other workflows in the same parent project per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-010, each such linkedWorkflow association on those parent nodes is cleared as part of successful archive confirm
      - node data on link break — for each affected parent workflowNode, the values displayed on the node while linked (title, description, time, and for program parent workflow type credits, ponderation hours, and specific-education switch as applicable per FR-WF-EN-004 and FR-WF-EN-006) remain on that node as persisted node-local values; fields that were read-only while linked become editable again for owner and editor per FR-WF-EN-002 through FR-WF-EN-006; this path differs from manual unlink per FR-WF-EN-011, which restores the node's pre-link persisted values instead
      - parent canvas and sidebar — on each affected parent node, workflowNodeLinkedWorkflowIndicator is no longer rendered per tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-001; workflowEditNodeFormLinkWorkflowButton shows 'Link an activity' or 'Link a course' again when that node is opened
      - parent overview — parent workflow Overview auto-calculate fields per tests/docs/requirements/original/workflow_overview_requirements_v1.yaml FR-WF-OV-003 through FR-WF-OV-006 recompute without C's mirrored contribution when the actor opens Overview per FR-WF-OV-010
      - parent contains navigation — archived workflow C no longer appears in containsSection relatedWorkflowList on parent course or program workflows once links are cleared per tests/docs/requirements/original/main_navigation_requirements_v1.yaml FR-NAV-012
      - restore does not re-link — when C is later restored per tests/docs/requirements/original/library_page_requirements_v1.yaml FR-LIB-006, parent workflowNodes whose links were cleared on C's archive are unchanged; owner or editor must link again per FR-WF-EN-008 if they want a new association; restored C becomes eligible again in workflowLinkWorkflowDialogSearchResults per FR-WF-EN-010
      - mid-session eviction — when workflow W is archived per this FR, any actor already on '/workflow/{id}/*' for W except the archiving owner loses workspace access on their next in-app action per tests/docs/requirements/original/workspace_access_requirements_v1.yaml FR-WS-ACCESS-005 (workflowAccessDeniedView per FR-WS-ACCESS-002); actors on other non-archived workflow routes in the same parent project are not evicted by W's archive alone
      - application navigates owner to route pathname '/project/{id}/workflows' for the parent project that contains the archived workflow
      - system shows globalMessageSnackbar with copy matching the template 'Your [workflow type] has been successfully archived' after substituting that workflow's user-visible type label for '[workflow type]'

    roleBehavior: {}

    acceptanceCriteria:
      - given successful confirm, archiveWorkflowConfirmationModal is not visible
      - given successful confirm, workflow is archived
      - given successful confirm, workflow is removed from favourites
      - given workflow was published before archive, after confirm workflow publish state is unpublished per FR-PROJ-OV-003
      - given course workflow node N is linked to activity workflow A in the same project and owner confirms archive of A, when owner reopens the parent course on the Workflow sub-view and selects N, N has no linked workflow, workflowNodeLinkedWorkflowIndicator is not rendered on N, workflowEditNodeFormLinkWorkflowButton shows 'Link an activity', and workflowEditNodeFormTitleField and other applicable fields are editable for owner and show the values that were displayed while the link was active
      - given program workflow node N is linked to course workflow C in the same project and owner confirms archive of C, when owner selects Overview on the parent program per FR-WF-HEADER-001, calculated totals no longer include C's mirrored contribution per FR-WF-OV-010
      - given course node N was the only node linked to activity A and owner confirms archive of A, when owner reopens the parent course, containsSection is not visible in mainNavigation per FR-NAV-012
      - given course node N was linked to activity A, owner archived A (link cleared on N), and owner later restores A per FR-LIB-006, when owner reopens the parent course and selects N, N has no linked workflow and workflowEditNodeFormLinkWorkflowButton shows 'Link an activity'; A may appear again as an eligible candidate when owner opens workflowLinkWorkflowDialog per FR-WF-EN-010
      - given successful confirm, current route pathname is '/project/{id}/workflows' for the parent project of the archived workflow (per FR-PROJ-WF-001)
      - given successful confirm, globalMessageSnackbar is visible with copy matching 'Your [workflow type] has been successfully archived' after the same '[workflow type]' substitution as in FR-WF-ARCH-001 (for example 'Your activity has been successfully archived' for an activity workflow)

    openQuestions: []

  - id: FR-WF-ARCH-004
    title: Confirm archive workflow failure keeps modal open and shows error snackbar

    designEvidence:
      - FIGMA-CAB-WF-ARCHIVE-WORKFLOW-MODAL

    actors:
      - owner

    uiObjects:
      - archiveWorkflowConfirmationModal
      - archiveWorkflowConfirmationModalConfirmButton
      - globalMessageSnackbar

    preconditions:
      - archiveWorkflowConfirmationModal is open
      - owner opened archiveWorkflowConfirmationModal from contextActionBar per FR-WF-ARCH-001 (including from any workflow sub-view pathname under '/workflow/{id}/')

    trigger:
      - owner clicks archiveWorkflowConfirmationModalConfirmButton and the archive operation does not complete successfully (for example API or server error), leaving the workflow in a non-archived state

    mainFlow:
      - archiveWorkflowConfirmationModal remains open
      - archiveWorkflowConfirmationModalConfirmButton is enabled and clickable
      - workflow remains not archived
      - system shows globalMessageSnackbar with copy matching the template 'We encountered an issue and your [workflow type] was not archived' after substituting the workflow's user-visible type label for '[workflow type]'

    roleBehavior: {}

    acceptanceCriteria:
      - given failed confirm outcome described in trigger, archiveWorkflowConfirmationModal remains open
      - given failed confirm, workflow is not archived
      - given failed confirm, globalMessageSnackbar is visible with copy matching 'We encountered an issue and your [workflow type] was not archived' after the same '[workflow type]' substitution as in FR-WF-ARCH-001 (for example 'We encountered an issue and your activity was not archived' for an activity workflow)
      - given failed confirm, archiveWorkflowConfirmationModalConfirmButton is enabled and clickable

    openQuestions: []

