# Normalized requirements: login
# Source: Figma design evidence; application code (course_flow/routes/aggregated_urls.py LoginView; course_flow/templates/course_flow/html/registration/login.html; course_flow/settings.py LOGIN_REDIRECT_URL)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/register_requirements_v1.yaml (public auth routes per documentPreconditions; registerEmailField value is account username per FR-REG-001; loginRegisterPrompt and loginRegisterLink mirror registerLoginPrompt and registerLoginLink per FR-REG-001); tests/docs/requirements/original/homepage_requirements_v1.yaml (post-login destination Home per FR-LOGIN-005); tests/docs/requirements/original/main_navigation_requirements_v1.yaml (homeNavItem labeled 'Home'); tests/docs/requirements/original/password_reset_requirements_v1.yaml (authenticated change-password at '/user/password-reset' is a separate flow); tests/docs/requirements/original/forgot_password_requirements_v1.yaml (forgotPasswordPage at '/password-reset' per FR-FPWD-001; entry via loginForgotPasswordLink)

documentPreconditions:
  - user is not authenticated to CourseFlow

uiObjectDefinitions:
  loginPage:
    meaning: Public full-page sign-in experience at route '/login/' accessible without authentication.
  loginTitle:
    meaning: Page title on loginPage labeled 'Login to CourseFlow'.
  loginForm:
    meaning: Form container on loginPage for sign-in fields.
  loginEmailField:
    meaning: Required text input labeled 'Email' on loginForm for the account email address; this value is the account username per tests/docs/requirements/original/register_requirements_v1.yaml FR-REG-001; valid when non-empty with at least one character before '@' and a domain name after '@' per FR-LOGIN-003.
  loginPasswordField:
    meaning: Required secret input labeled 'Password' on loginForm for the account password; must be non-empty per FR-LOGIN-003.
  loginSubmitButton:
    meaning: Primary submit button on loginForm labeled 'Login'; disabled and not clickable until loginEmailField and loginPasswordField are valid per FR-LOGIN-003.
  loginForgotPasswordLink:
    meaning: Clickable link labeled 'Forgot your password?' on loginPage that navigates to forgotPasswordPage at public route '/password-reset' per tests/docs/requirements/original/forgot_password_requirements_v1.yaml FR-FPWD-001; distinct from authenticated change-password at '/user/password-reset' per tests/docs/requirements/original/password_reset_requirements_v1.yaml.
  loginRegisterPrompt:
    meaning: Static prompt copy 'Don't have an account? ' on loginPage adjacent to loginRegisterLink; mirror of registerLoginPrompt per FR-REG-001.
  loginRegisterLink:
    meaning: Clickable link labeled 'Register' on loginPage that navigates to public route '/register/'; mirror of registerLoginLink per FR-REG-001.
  loginFieldValidationMessage:
    meaning: Inline field-level error text on loginForm field controls; validation rules per FR-LOGIN-003.
  loginAuthenticationErrorMessage:
    meaning: Sign-in failure message on loginPage with copy 'The email or password you entered is incorrect. please check your details and try again.' when submitted valid loginForm values do not match an existing account; rules per FR-LOGIN-004.
  homePage:
    meaning: Canonical definition in tests/docs/requirements/original/homepage_requirements_v1.yaml.

locatorMappings:
  loginPage: "canonical_locators.yaml -> loginPage"
  loginTitle: "canonical_locators.yaml -> loginTitle"
  loginForm: "canonical_locators.yaml -> loginForm"
  loginEmailField: "canonical_locators.yaml -> loginEmailField"
  loginPasswordField: "canonical_locators.yaml -> loginPasswordField"
  loginSubmitButton: "canonical_locators.yaml -> loginSubmitButton"
  loginForgotPasswordLink: "canonical_locators.yaml -> loginForgotPasswordLink"
  loginRegisterPrompt: "canonical_locators.yaml -> loginRegisterPrompt"
  loginRegisterLink: "canonical_locators.yaml -> loginRegisterLink"
  loginFieldValidationMessage: "canonical_locators.yaml -> loginFieldValidationMessage"
  loginAuthenticationErrorMessage: "canonical_locators.yaml -> loginAuthenticationErrorMessage"

requirements:
  - id: FR-LOGIN-001
    title: Login route and primary form elements

    designEvidence:
      - FIGMA-LOGIN
      - FIGMA-LOGIN-FORGOT-PASSWORD

    actors:
      - user

    uiObjects:
      - loginPage
      - loginTitle
      - loginForm
      - loginEmailField
      - loginPasswordField
      - loginForgotPasswordLink
      - loginSubmitButton
      - loginRegisterPrompt
      - loginRegisterLink

    preconditions:
      - documentPreconditions for this file hold

    trigger:
      - user navigates to '/login/'

    mainFlow:
      - given user is not authenticated, user can navigate to '/login/' without being redirected
      - given user is authenticated and navigates to '/login/', application redirects to '/home' and loginPage is not visible
      - given current route matches '/login/', loginPage is visible
      - loginForm is visible
      - loginForm shows loginTitle, loginEmailField, loginPasswordField, loginForgotPasswordLink, loginSubmitButton and the loginRegisterPrompt and loginRegisterLink combo in that order
      - loginPage does not include a separate username field; loginEmailField is the account username
      - given user clicks loginForgotPasswordLink, application navigates to '/password-reset' without requiring authentication
      - given user clicks loginRegisterLink, application navigates to '/register/' without requiring authentication

    roleBehavior: {}

    acceptanceCriteria:
      - given user is not authenticated, current route matches '/login/' and loginPage is visible
      - given user is authenticated and user navigates to '/login/', current route matches '/home' and loginPage is not visible
      - loginForm is visible
      - loginForm shows loginTitle, loginEmailField, loginPasswordField, loginForgotPasswordLink, loginSubmitButton and the loginRegisterPrompt and loginRegisterLink combo in that order
      - loginPasswordField masks entered characters
      - given user is not authenticated and user clicks loginForgotPasswordLink, current route matches '/password-reset'
      - given user is not authenticated and user clicks loginRegisterLink, current route matches '/register/'

    openQuestions: []

  - id: FR-LOGIN-002
    title: Login form initial state

    designEvidence:
      - FIGMA-LOGIN

    actors:
      - user

    uiObjects:
      - loginPage
      - loginForm
      - loginEmailField
      - loginPasswordField
      - loginFieldValidationMessage
      - loginSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/login/'

    trigger: []

    mainFlow:
      - loginEmailField and loginPasswordField start empty
      - loginSubmitButton is disabled and not clickable
      - loginFieldValidationMessage is not visible for loginForm fields before user interaction

    roleBehavior: {}

    acceptanceCriteria:
      - loginEmailField value is empty
      - loginPasswordField value is empty
      - loginSubmitButton is disabled and not clickable
      - given user has not interacted with loginForm, loginFieldValidationMessage is not visible for loginEmailField or loginPasswordField

    openQuestions: []

  - id: FR-LOGIN-003
    title: Login field validation rules

    designEvidence:
      - FIGMA-LOGIN

    actors:
      - user

    uiObjects:
      - loginForm
      - loginEmailField
      - loginPasswordField
      - loginFieldValidationMessage
      - loginSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - loginForm is visible

    trigger:
      - user changes loginForm field content

    mainFlow:
      - all loginForm input fields are mandatory; user cannot submit loginForm with any required field empty or invalid
      - loginEmailField requires a non-empty valid email address with at least one character before '@' and a domain name after '@'
      - given loginEmailField value is non-empty but not a valid email address after interaction, loginFieldValidationMessage is visible with text 'Invalid email format' for loginEmailField and loginSubmitButton is disabled and not clickable
      - loginPasswordField requires a non-empty value
      - validation for loginForm fields starts after user interaction with the relevant field and runs before user clicks loginSubmitButton
      - loginSubmitButton is disabled and not clickable until loginEmailField and loginPasswordField are valid per this requirement
      - when all loginForm fields are valid, loginSubmitButton becomes enabled and clickable
      - given loginFieldValidationMessage is visible for a loginForm field and the user corrects that field to a valid value, loginFieldValidationMessage is not visible for that field
      - given validation fails for a loginForm field, loginFieldValidationMessage is visible on the invalid field, loginSubmitButton is disabled and not clickable, and loginForm is not submitted while invalid values remain

    roleBehavior: {}

    acceptanceCriteria:
      - given user clears loginEmailField after interaction, loginFieldValidationMessage is visible with text 'Email is required' for loginEmailField
      - given loginEmailField value is non-empty but not a valid email address after interaction, loginFieldValidationMessage is visible with text 'Invalid email format' for loginEmailField
      - given loginEmailField value is non-empty but not a valid email address, loginSubmitButton is disabled and not clickable
      - given user clears loginPasswordField after interaction, loginFieldValidationMessage is visible with text 'Password is required' for loginPasswordField
      - given any loginForm field is empty or invalid, loginSubmitButton is disabled and not clickable
      - given loginFieldValidationMessage is visible for loginEmailField and user then enters a valid email address, loginFieldValidationMessage is not visible for loginEmailField
      - given loginFieldValidationMessage is visible for loginPasswordField with text 'Password is required' and user then enters a non-empty value, loginFieldValidationMessage is not visible for loginPasswordField
      - given all loginForm fields are valid, loginSubmitButton is enabled and clickable

    openQuestions: []

  - id: FR-LOGIN-004
    title: Failed login with invalid credentials

    designEvidence:
      - FIGMA-LOGIN
      - FIGMA-LOGIN-CREDENTIALS-ERROR

    actors:
      - user

    uiObjects:
      - loginPage
      - loginTitle
      - loginForm
      - loginEmailField
      - loginPasswordField
      - loginForgotPasswordLink
      - loginSubmitButton
      - loginRegisterPrompt
      - loginRegisterLink
      - loginAuthenticationErrorMessage

    preconditions:
      - documentPreconditions for this file hold
      - loginForm is visible
      - loginForm is valid

    trigger:
      - user changes loginForm content and clicks loginSubmitButton with valid loginForm values that do not match an existing account

    mainFlow:
      - given user clicks loginSubmitButton with valid loginForm values that do not match an existing account, login fails
      - given login fails, user remains on loginPage and is not authenticated to CourseFlow
      - given login fails, loginForm remains visible with loginEmailField and loginPasswordField retaining the submitted values
      - given login fails with a valid loginForm, loginSubmitButton is enabled and clickable
      - given login fails, loginTitle, loginForgotPasswordLink, loginRegisterPrompt, and loginRegisterLink remain visible on loginPage
      - given login fails, loginAuthenticationErrorMessage is visible with text 'The email or password you entered is incorrect. please check your details and try again.' on loginPage per FIGMA-LOGIN-CREDENTIALS-ERROR
      - given login fails, current route remains '/login/'
      - given login fails and user then changes any loginForm field value, loginAuthenticationErrorMessage is not visible

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks loginSubmitButton with valid loginForm values that do not match an existing account, login fails
      - given login fails, user is not authenticated to CourseFlow
      - given login fails, current route matches '/login/'
      - given login fails, loginForm is visible
      - given login fails, loginEmailField and loginPasswordField retain the values submitted on the failed attempt
      - given login fails with a valid loginForm, loginSubmitButton is enabled and clickable
      - given login fails, loginTitle is visible with text 'Login to CourseFlow'
      - given login fails, loginForgotPasswordLink is visible with label 'Forgot your password?' and is clickable
      - given login fails, loginRegisterPrompt is visible with text 'Don't have an account? '
      - given login fails, loginRegisterLink is visible with label 'Register' and is clickable
      - given login fails, loginAuthenticationErrorMessage is visible with text 'The email or password you entered is incorrect. please check your details and try again.' on loginPage per FIGMA-LOGIN-CREDENTIALS-ERROR
      - given login fails and user then changes any loginForm field value, loginAuthenticationErrorMessage is not visible

    openQuestions: []

  - id: FR-LOGIN-005
    title: Successful login and redirect to 'Home'

    designEvidence:
      - FIGMA-LOGIN

    actors:
      - user

    uiObjects:
      - loginPage
      - loginForm
      - loginEmailField
      - loginPasswordField
      - loginSubmitButton
      - homePage

    preconditions:
      - documentPreconditions for this file hold
      - loginForm is visible
      - loginForm is valid
      - valid loginForm values match an existing account

    trigger:
      - user changes loginForm content and clicks loginSubmitButton

    mainFlow:
      - given user clicks loginSubmitButton with valid loginForm values that match an existing account, user is authenticated to CourseFlow
      - given login succeeds, application navigates immediately to route '/home' with no interim confirmation copy or snackbar on loginPage
      - given login succeeds, homePage is visible

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks loginSubmitButton with valid loginForm values that match an existing account, login succeeds
      - given login succeeds, user is authenticated to CourseFlow
      - given login succeeds, application navigates immediately to '/home' with no interim confirmation copy or snackbar
      - given login succeeds, current route matches '/home'
      - given login succeeds, homePage is visible per tests/docs/requirements/original/homepage_requirements_v1.yaml FR-HOME-001

    openQuestions: []

