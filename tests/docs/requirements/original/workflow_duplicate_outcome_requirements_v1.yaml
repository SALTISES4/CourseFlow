# Normalized requirements: duplicate an existing workflowOutcome in the workflowOutcomeView ('Outcomes' view)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Scope (this file): duplication of a single workflowOutcome from (a) workflowEditOutcomeFormDuplicateButton on workflowEditOutcomeForm and (b) workflowOutcomeHoverActionsMenuDuplicateItem on workflowOutcomeHoverActionsMenu, including the subtree clone, sibling placement, title suffix, sidebar binding after duplicate, depth-cap interaction, comments reset on the duplicate subtree, and tree expand/collapse behavior. Out of scope: drag-and-drop, outcome-to-node assignment (duplicate subtree starts with zero assignments), outcome filter highlight.
# Cross-reference: tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml (canonical workflowOutcomeView, workflowOutcomeTree, workflowOutcome, workflowOutcomeHeader, workflowOutcomeHoverActionsMenu, workflowEditOutcomeForm; hover-menu container visibility and per-item gating — FR-WF-EO-003; sidebar binding rules — FR-WF-EO-004; field-level form rules — FR-WF-EO-005; title display fallback — FR-WF-EO-006; outcome header selection chrome — FR-WF-EO-018; auto-numbering — FR-WF-EO-007; three-level depth cap — FR-WF-EO-008; drag reorder/reparent — tests/docs/requirements/original/workflow_outcome_tree_drag_reorder_requirements_v1.yaml FR-WF-EO-015 through FR-WF-EO-017); tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml (workflowNode duplicate convention this file is adapted from; comments reset on duplicate — FR-WF-DUP-004); tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (workflowNodeHoverActionsMenuDuplicateItem actionability mirror — FR-WF-NODE-005); tests/docs/requirements/original/workflow_comments_tab_requirements_v1.yaml (comments tab host binding — FR-WF-COMMENTS-004); tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar collapsed/expanded presentation — FR-WF-RS-001, FR-WF-RS-002, FR-WF-RS-004); tests/docs/requirements/guidelines_functional_requirements.md

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/outcomes'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowOutcomeView is open with workflowOutcomeTree rendered and at least one workflowOutcome
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

