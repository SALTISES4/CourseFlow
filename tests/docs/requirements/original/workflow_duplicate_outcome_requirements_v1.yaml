requirements:
  - id: FR-WF-EO-009
    title: Trigger duplication from workflowEditOutcomeFormDuplicateButton
    
    designEvidence:
      - FIGMA-WF-EO-OE-EDIT
    
    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
    
    uiObjects:
      - workflowEditOutcomeForm
      - workflowEditOutcomeFormDuplicateButton
      - workflowOutcomeTree
      - workflowOutcome
      - workflowOutcomeHeader
      - workflowOutcomeHeaderSelectedBorder
      - workflowRightSidebar
      - workflowRightSidebarEditTab
    
    preconditions:
      - workflowEditOutcomeForm is rendered and bound to a workflowOutcome per FR-WF-EO-004
    
    trigger:
      - owner or editor clicks workflowEditOutcomeFormDuplicateButton
    
    mainFlow:
      - duplication takes effect immediately when workflowEditOutcomeFormDuplicateButton is clicked, with no confirmation dialog or other intermediate gate
      - system creates a duplicate workflowOutcome per FR-WF-EO-011
      - workflowEditOutcomeForm remains bound to the source workflowOutcome (the workflowOutcome that was duplicated from), not the newly created duplicate
      - workflowRightSidebar presentation and workflowOutcomeHeaderSelectedBorder per FR-WF-EO-018 remain unchanged (workflowRightSidebar stays on workflowRightSidebarEditTab bound to the source workflowOutcome)
    
    roleBehavior:
      owner:
        workflowEditOutcomeFormDuplicateButton: active
      editor:
        workflowEditOutcomeFormDuplicateButton: active
      commenter:
        workflowEditOutcomeFormDuplicateButton: disabled
      viewer:
        workflowEditOutcomeFormDuplicateButton: disabled
      user:
        workflowEditOutcomeFormDuplicateButton: disabled
    
    acceptanceCriteria:
      - given owner or editor with workflowEditOutcomeForm open on a workflowOutcome clicks workflowEditOutcomeFormDuplicateButton, no confirmation dialog intervenes before a duplicate workflowOutcome is created per FR-WF-EO-011 and workflowEditOutcomeForm remains bound to the source workflowOutcome (not the new duplicate)
      - given workflowRightSidebar is bound to source workflowOutcome S on workflowRightSidebarEditTab when owner or editor clicks workflowEditOutcomeFormDuplicateButton, after duplication workflowRightSidebar presentation is unchanged, workflowEditOutcomeForm remains bound to S (not the new duplicate), and workflowOutcomeHeaderSelectedBorder remains on S per FR-WF-EO-018
      - given actor is commenter, viewer, or user (published-access), workflowEditOutcomeFormDuplicateButton is rendered and disabled (no-op on click) and no duplication is produced
    
    openQuestions: []

  - id: FR-WF-EO-010
    title: Trigger duplication from workflowOutcomeHoverActionsMenuDuplicateItem
    
    designEvidence:
      - FIGMA-WF-EO-OE-EDIT
    
    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
    
    uiObjects:
      - workflowOutcomeTree
      - workflowOutcome
      - workflowOutcomeHeader
      - workflowOutcomeHeaderSelectedBorder
      - workflowOutcomeHoverActionsMenu
      - workflowOutcomeHoverActionsMenuDuplicateItem
      - workflowRightSidebar
      - workflowRightSidebarEditTab
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent
      - workflowEditOutcomeForm
    
    preconditions:
      - workflowOutcomeView is open with workflowOutcomeTree rendered and at least one workflowOutcome
    
    trigger:
      - owner or editor hovers a workflowOutcomeHeader and clicks workflowOutcomeHoverActionsMenuDuplicateItem in the resulting workflowOutcomeHoverActionsMenu
    
    mainFlow:
      - container visibility of workflowOutcomeHoverActionsMenu conforms to FR-WF-EO-003
      - per-item actionability of workflowOutcomeHoverActionsMenuDuplicateItem follows this FR's roleBehavior block, mirroring insert-item gating in FR-WF-EO-003 and duplicate-item gating on workflowNodeHoverActionsMenu per FR-WF-NODE-005
      - when workflowOutcomeHoverActionsMenuDuplicateItem is active for the actor, duplication takes effect immediately on click, with no confirmation dialog or other intermediate gate
      - system creates a duplicate workflowOutcome per FR-WF-EO-011
      - workflowEditOutcomeForm and workflowRightSidebar selection state are unchanged by this trigger; the newly created duplicate workflowOutcome is not auto-selected and workflowEditOutcomeForm is not opened or rebound as a result of the duplicate alone (parallels FR-WF-EO-003 acceptanceCriteria for sibling/child inserts)
      - when workflowRightSidebar is bound to a workflowOutcome on workflowRightSidebarEditTab or workflowRightSidebarCommentsTab before the duplicate, workflowRightSidebar presentation and workflowOutcomeHeaderSelectedBorder per FR-WF-EO-018 remain on that same bound workflowOutcome after the duplicate (not moved to the new duplicate)
    
    roleBehavior:
      owner:
        workflowOutcomeHoverActionsMenu: shownOnHover
        workflowOutcomeHoverActionsMenuDuplicateItem: active
      editor:
        workflowOutcomeHoverActionsMenu: shownOnHover
        workflowOutcomeHoverActionsMenuDuplicateItem: active
      commenter:
        workflowOutcomeHoverActionsMenu: shownOnHover
        workflowOutcomeHoverActionsMenuDuplicateItem: disabled
      viewer:
        workflowOutcomeHoverActionsMenu: notRendered
        workflowOutcomeHoverActionsMenuDuplicateItem: notRendered
      user:
        workflowOutcomeHoverActionsMenu: notRendered
        workflowOutcomeHoverActionsMenuDuplicateItem: notRendered
    
    acceptanceCriteria:
      - given owner or editor hovers a workflowOutcomeHeader and clicks workflowOutcomeHoverActionsMenuDuplicateItem when active per this FR's roleBehavior, no confirmation dialog intervenes before a duplicate workflowOutcome is created per FR-WF-EO-011
      - given actor is commenter with workflowOutcomeHoverActionsMenu visible per FR-WF-EO-003, workflowOutcomeHoverActionsMenuDuplicateItem is disabled per this FR's roleBehavior
      - given actor is viewer or user (published-access), workflowOutcomeHoverActionsMenuDuplicateItem is not reachable per this FR's roleBehavior (workflowOutcomeHoverActionsMenu is notRendered)
      - given a duplicate is created via this trigger, workflowEditOutcomeForm binding and workflowRightSidebar presentation are unchanged by the duplicate alone (the duplicate is selected only when the actor subsequently clicks its workflowOutcomeHeader, per FR-WF-EO-004)
      - given workflowRightSidebar is bound to workflowOutcome S on workflowRightSidebarEditTab before owner or editor duplicates a different workflowOutcome via workflowOutcomeHoverActionsMenuDuplicateItem, after duplication workflowRightSidebar presentation is unchanged, workflowEditOutcomeForm remains bound to S, and workflowOutcomeHeaderSelectedBorder remains on S per FR-WF-EO-018
      - given workflowRightSidebarCommentsTabContent is bound to workflowOutcome S per FR-WF-COMMENTS-004 before owner or editor duplicates a different workflowOutcome via workflowOutcomeHoverActionsMenuDuplicateItem, after duplication workflowRightSidebar remains on workflowRightSidebarCommentsTab bound to S and workflowOutcomeHeaderSelectedBorder remains on S per FR-WF-EO-018
    
    openQuestions: []

  - id: FR-WF-EO-011
    title: Duplicated workflowOutcome — placement, subtree clone, field values, assignments, comments, and tree visibility
    
    designEvidence:
      - FIGMA-WF-EO-OE-EDIT
    
    actors:
      - owner
      - editor
    
    uiObjects:
      - workflowOutcomeTree
      - workflowOutcome
      - workflowOutcomeHeader
      - workflowOutcomeHeaderTitle
      - workflowOutcomeHeaderToggle
    
    preconditions:
      - a duplicate has been triggered against a source workflowOutcome per FR-WF-EO-009 or FR-WF-EO-010
    
    trigger: []
    
    mainFlow:
      - placement — the duplicate root workflowOutcome is inserted at the same level as the source workflowOutcome and immediately after the source in the source's sibling order; the duplicate root has the same parent as the source (the duplicate is a sibling of the source, not a child)
      - subtree clone — every descendant of the source (children at level+1 and grandchildren at level+2, recursively, up to the three-level cap defined in FR-WF-EO-008) is also cloned and attached under the corresponding clone; child order within each cloned subtree matches the source
      - title suffix — when the source root has a non-empty persisted workflowEditOutcomeFormTitleField value, the duplicate root's persisted workflowEditOutcomeFormTitleField value is that source value with the literal suffix ' (copy)' appended; when the source root has an empty persisted workflowEditOutcomeFormTitleField value (workflowOutcomeHeaderTitle shows the 'Untitled outcome' display fallback per FR-WF-EO-006), the duplicate root has an empty persisted workflowEditOutcomeFormTitleField value and workflowOutcomeHeaderTitle shows the 'Untitled outcome' display fallback per FR-WF-EO-006 with no ' (copy)' suffix appended; cloned descendants (children, grandchildren) preserve their source descendant's persisted workflowEditOutcomeFormTitleField value verbatim, with no suffix appended
      - field values — for each cloned workflowOutcome, persisted field values match the corresponding source workflowOutcome at the same tree level per FR-WF-EO-005: workflowEditOutcomeFormDescriptionField at every level (persisted HTML description markup verbatim per FR-WF-EN-012); workflowEditOutcomeFormCodeField and workflowEditOutcomeFormTagsAutocomplete selections only when the clone is at level 1 (copied from the corresponding level 1 source workflowOutcome in the duplicated subtree); level 2 and level 3 clones carry description and title only (no code or tag fields)
      - ordinals — workflowOutcomeHeaderTitle ordinals for the source's siblings (and the entire workflowOutcomeTree) are recomputed per FR-WF-EO-007 so the sibling sequence remains contiguous starting at 1
      - depth cap — duplication of a source workflowOutcome at level L produces a duplicate at level L with a cloned subtree of the same depth as the source; because the cloned subtree depth equals the source subtree depth, the resulting workflowOutcomeTree continues to satisfy the three-level cap from FR-WF-EO-008
      - outcome-to-node assignments — the duplicate root workflowOutcome and its cloned descendants do not inherit any of the source's outcome-to-node assignments (assignments of an outcome to a workflowNode in the 'Workflow' view); the duplicate subtree is created with no workflowNode assignments regardless of how many workflowNodes the source or any of its descendants were assigned to
      - comments — the duplicate root workflowOutcome and every cloned descendant start with an empty comments collection regardless of whether the source workflowOutcome or any source descendant had comments (parallels workflowNode duplicate comments reset per FR-WF-DUP-004)
      - tree visibility — duplication does not change the expanded/collapsed state of the source workflowOutcome or any other workflowOutcome in workflowOutcomeTree; the duplicate root workflowOutcome is rendered at its sibling position with workflowOutcomeHeader visible; when the duplicate root has cloned descendants, its direct-child entries start collapsed until the actor clicks workflowOutcomeHeaderToggle on the duplicate root per FR-WF-EO-004
    
    roleBehavior: {}
    
    acceptanceCriteria:
      - given a source workflowOutcome S at level L with no children, after duplication a new workflowOutcome D exists at level L with the same parent as S, inserted immediately after S in the sibling order, and D has no children
      - given a source workflowOutcome S at level L with N children (each potentially with its own descendants), after duplication a new workflowOutcome D exists at level L with the same parent as S, inserted immediately after S in the sibling order, and D has its own N child workflowOutcomes (clones of S's children) in the same order, each with its own cloned descendants matching the source subtree
      - given a source workflowOutcome S has persisted workflowEditOutcomeFormTitleField value 'Foo' (non-empty), after duplication the duplicate root D's persisted workflowEditOutcomeFormTitleField value is exactly 'Foo (copy)'
      - given a source workflowOutcome S has an empty persisted workflowEditOutcomeFormTitleField value (workflowOutcomeHeaderTitle for S shows 'Untitled outcome' as the display fallback per FR-WF-EO-006), after duplication the duplicate root D has an empty persisted workflowEditOutcomeFormTitleField value and workflowOutcomeHeaderTitle for D shows the 'Untitled outcome' display fallback per FR-WF-EO-006 with no ' (copy)' suffix
      - given a source workflowOutcome S at level 1 with a child S1 at level 2 (and S1 may have its own child S1a at level 3), after duplication the cloned descendants D1 (clone of S1) and D1a (clone of S1a) have persisted workflowEditOutcomeFormTitleField values exactly equal to S1's and S1a's persisted workflowEditOutcomeFormTitleField values respectively (no ' (copy)' suffix on descendants); descendants of D whose source's persisted workflowEditOutcomeFormTitleField value was empty remain empty and workflowOutcomeHeaderTitle for those descendants shows the 'Untitled outcome' display fallback per FR-WF-EO-006
      - given a source workflowOutcome S at level 1 has persisted workflowEditOutcomeFormCodeField value 'CODE123' and persisted workflowEditOutcomeFormTagsAutocomplete selections {T1, T2}, after duplication the duplicate root D at level 1 has persisted workflowEditOutcomeFormCodeField value 'CODE123' and persisted workflowEditOutcomeFormTagsAutocomplete selections {T1, T2}
      - given a source workflowOutcome S has persisted workflowEditOutcomeFormDescriptionField HTML markup at any level, after duplication the duplicate root D and every cloned descendant carry the corresponding source's persisted HTML description markup verbatim per FR-WF-EN-012
      - given a source workflowOutcome S at level 2 with a persisted workflowEditOutcomeFormDescriptionField value and a level 1 ancestor that has workflowEditOutcomeFormTagsAutocomplete selections, after duplication the level 2 duplicate root D copies S's description only and has no persisted tag or code fields; the level 1 clone in D's subtree (if any) copies tag and code fields from its level 1 source counterpart per FR-WF-EO-005
      - given a source workflowOutcome S at level 1 with children S1 and S2 (level 2), after duplication the new sibling sequence at level 1 is contiguous (1, 2, 3, …) with D placed immediately after S; D's children appear in workflowOutcomeTree as 1+offset.1 and 1+offset.2 with workflowOutcomeHeaderTitle ordinals recomputed per FR-WF-EO-007
      - given the workflowOutcomeTree was at maximum depth (a level-3 outcome exists) before duplication of any source workflowOutcome, the duplicated subtree has at most the same depth as the source subtree and the workflowOutcomeTree continues to satisfy the three-level cap from FR-WF-EO-008
      - given a source workflowOutcome S (or any of its descendants) was assigned to one or more workflowNodes in the 'Workflow' view before duplication, after duplication the duplicate root D and every cloned descendant have zero workflowNode assignments; S's and its descendants' original workflowNode assignments are unchanged
      - given the source workflowOutcome S (or any descendant in S's subtree) has one or more comments per FR-WF-COMMENTS-004, after duplication the duplicate root and every cloned descendant have zero comments; S's and its descendants' original comments are unchanged
      - given source workflowOutcome S has expanded direct children visible in workflowOutcomeTree and duplicate D is created per this FR, S remains expanded, D is rendered immediately after S, and D's cloned descendants are not visible until the actor expands D via workflowOutcomeHeaderToggle
      - given source workflowOutcome S is collapsed before duplication, after duplication S remains collapsed and D appears as a collapsed sibling header immediately after S
    
    openQuestions: []

