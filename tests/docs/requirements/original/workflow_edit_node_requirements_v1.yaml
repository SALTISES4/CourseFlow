# Normalized requirements: edit an existing workflowNode via workflowRightSidebarEditTab / workflowRightSidebarEditTabContent ('Workflow' view), including 'Link a workflow' dialog
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Nodes — Node Metadata, lines 641–840; Node Actions — Link a Workflow, lines 879–894)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar/Edit tab — FR-WF-RS-001, FR-WF-RS-002, FR-WF-RS-003); tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml (Insert mode toggle; add-node drops onto workflowSectionContainer); tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (workflowSectionContainer definitions; section hover menu lockstep — FR-SEC-007); tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (canvas layout and chrome — FR-WF-NODE-001, FR-WF-NODE-002, FR-WF-NODE-003; field values on canvas conform to FR-WF-EN-002 through FR-WF-EN-010 in this file); tests/docs/requirements/original/project_overview_requirements_v1.yaml (projectTagsSection, projectTagItem — tag catalog for workflowEditNodeFormTagsAutocomplete); tests/docs/requirements/original/workflow_overview_requirements_v1.yaml (workflowMetadataFieldTime — duration semantics aligned with workflowEditNodeFormTimeField); tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml (workflowEditNodeFormDuplicateButton click flow — FR-WF-DUP-001); tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml (detailed behavior of workflowEditNodeFormDeleteButton); tests/docs/requirements/original/card_content_requirements_v1.yaml (workflowCard in link dialog — FR-CARD-001 through FR-CARD-007 as applicable)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/workflow'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published

uiObjectDefinitions:
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowNode:
    meaning: Placed workflow content unit at one workflowSectionRow × workflowChannel cell inside a workflowSectionContainer.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTab:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTabContent:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowEditNodeForm:
    meaning: Right-sidebar edit form for the selected workflowNode's metadata and node-scoped actions.
  workflowEditNodeFormHeading:
    meaning: Heading at the top of workflowEditNodeForm with literal copy 'Edit node'.
  workflowEditNodeFormTitleField:
    meaning: Single-line title input on workflowEditNodeForm labeled 'Title' for the selected workflowNode.
  workflowEditNodeFormDescriptionField:
    meaning: Multi-line description field labeled 'Description' on workflowEditNodeForm.
  workflowEditNodeFormContextSelect:
    meaning: Context dropdown labeled 'Context' on workflowEditNodeForm.
  workflowEditNodeFormTaskTypeSelect:
    meaning: Task-type dropdown labeled 'Type of task' on workflowEditNodeForm.
  workflowEditNodeFormTimeField:
    meaning: Duration field labeled 'Time' on workflowEditNodeForm.
  workflowEditNodeFormCreditsField:
    meaning: Credits numeric field on workflowEditNodeForm.
  workflowEditNodeFormTagsAutocomplete:
    meaning: Tags multi-select autocomplete labeled 'Tags' on workflowEditNodeForm.
  workflowEditNodeFormPonderationGroup:
    meaning: Ponderation field group on workflowEditNodeForm for program workflows.
  workflowEditNodeFormPonderationTheoryField:
    meaning: Theory hours field inside workflowEditNodeFormPonderationGroup.
  workflowEditNodeFormPonderationPracticeField:
    meaning: Practice hours field inside workflowEditNodeFormPonderationGroup.
  workflowEditNodeFormPonderationIndividualField:
    meaning: Individual hours field inside workflowEditNodeFormPonderationGroup.
  workflowEditNodeFormSpecificEducationSwitch:
    meaning: Specific education toggle on workflowEditNodeForm.
  workflowEditNodeFormLinkWorkflowButton:
    meaning: Link-or-remove-workflow action button in workflowEditNodeForm's action area.
  workflowEditNodeFormDuplicateButton:
    meaning: Duplicate button labeled 'Duplicate' on workflowEditNodeForm.
  workflowEditNodeFormDeleteButton:
    meaning: Delete button labeled 'Delete' on workflowEditNodeForm.
  workflowLinkWorkflowDialog:
    meaning: Modal dialog for searching and selecting a workflow to link to the current workflowNode.
  workflowLinkWorkflowDialogTitle:
    meaning: Accessible title on workflowLinkWorkflowDialog.
  workflowLinkWorkflowDialogSearchField:
    meaning: Search field labeled 'Search' on workflowLinkWorkflowDialog.
  workflowLinkWorkflowDialogSearchResults:
    meaning: Search-results list of workflowCard candidates on workflowLinkWorkflowDialog.
  workflowCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  workflowLinkWorkflowDialogEmptyState:
    meaning: Empty-state region on workflowLinkWorkflowDialog when no workflow candidates match.
  workflowLinkWorkflowDialogCancelButton:
    meaning: Cancel action on workflowLinkWorkflowDialog.
  workflowLinkWorkflowDialogLinkButton:
    meaning: Primary link action button at the bottom of workflowLinkWorkflowDialog.

