requirements:
  - id: FR-WF-EN-001
    title: Open workflowEditNodeForm when a workflowNode is selected in workflowView

    designEvidence:
      - FIGMA-WF-EN-ACTIVITY-OE
      - FIGMA-WF-EN-ACTIVITY-CV
      - FIGMA-WF-EN-COURSE-OE-NOLINK
      - FIGMA-WF-EN-PROGRAM-OE-NOLINK

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowSectionContainer
      - workflowNode
      - workflowRightSidebar
      - workflowRightSidebarAddTab
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowEditNodeForm
      - workflowEditNodeFormHeading

    preconditions:
      - workflowView is rendered
      - workflowView contains at least one workflowSectionContainer

    trigger:
      - user clicks a workflowNode in workflowView while workflowRightSidebar is closed
      - user clicks a workflowNode in workflowView while workflowRightSidebar is already open
      - user adds a new workflowNode by a drop from workflowRightSidebarAddTabContent per FR-WF-ADD-004, FR-WF-ADD-005, or FR-WF-ADD-006

    mainFlow:
      - system identifies the workflowNode to bind — for click triggers, the workflowNode under the clicked target; for drag-and-drop triggers, the workflowNode just finalized at the drop destination per FR-WF-ADD-004, FR-WF-ADD-005, or FR-WF-ADD-006
      - if workflowRightSidebar is closed, system opens workflowRightSidebar with workflowRightSidebarEditTab selected
      - if workflowRightSidebar is open on a different tab (including workflowRightSidebarAddTab, which is the active tab at the moment of a drag-and-drop trigger) or a different selection, system switches workflowRightSidebar to workflowRightSidebarEditTab and rebinds workflowRightSidebarEditTabContent to the identified workflowNode
      - system renders workflowEditNodeForm inside workflowRightSidebarEditTabContent bound to the identified workflowNode
      - workflowEditNodeFormHeading reads 'Edit node'
      - field set inside workflowEditNodeForm follows the parent workflow type per FR-WF-EN-002 (activity), FR-WF-EN-003 / FR-WF-EN-004 (course, depending on whether the workflowNode has a linked workflow), or FR-WF-EN-005 / FR-WF-EN-006 (program, depending on whether the workflowNode has a linked workflow)
      - editable field changes auto-save per FR-WF-EN-007 without an explicit save control on workflowEditNodeForm
      - canvas presentation of workflowNodeTitle, workflowNodeMeta tags, and workflowNodeLinkedWorkflowIndicator in workflowView uses the same field values and applicability as workflowEditNodeForm per FR-WF-EN-002 through FR-WF-EN-006 and FR-WF-EN-010; layout and chrome on the canvas conform to tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-001
      - edit affordance follows the actor's role per this FR's roleBehavior block and the per-type field-set FRs (FR-WF-EN-002, FR-WF-EN-003, FR-WF-EN-004, FR-WF-EN-005, FR-WF-EN-006)

    roleBehavior:
      owner:
        workflowEditNodeForm: editableWhereApplicable
      editor:
        workflowEditNodeForm: editableWhereApplicable
      commenter:
        workflowEditNodeForm: readOnlyPresentation
      viewer:
        workflowEditNodeForm: readOnlyPresentation
      user:
        workflowEditNodeForm: readOnlyPresentation

    acceptanceCriteria:
      - given workflowRightSidebar is closed, when user clicks a workflowNode, then workflowRightSidebar opens, workflowRightSidebarEditTab is selected, and workflowEditNodeForm is rendered for that workflowNode
      - given workflowRightSidebar is already open on a different selection or tab, when user clicks a workflowNode, then workflowRightSidebar switches to workflowRightSidebarEditTab and workflowEditNodeForm is rebound to the clicked workflowNode
      - given owner or editor completes a drop from workflowRightSidebarAddTabContent that finalizes a new workflowNode per FR-WF-ADD-004, FR-WF-ADD-005, or FR-WF-ADD-006, workflowRightSidebar switches from workflowRightSidebarAddTab to workflowRightSidebarEditTab and workflowEditNodeForm opens bound to the newly-created workflowNode
      - when workflowEditNodeForm is rendered, workflowEditNodeFormHeading text is 'Edit node'

    openQuestions: []

  - id: FR-WF-EN-002
    title: workflowEditNodeForm field set for activity workflow type

    designEvidence:
      - FIGMA-WF-EN-ACTIVITY-OE
      - FIGMA-WF-EN-ACTIVITY-CV

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormContextSelect
      - workflowEditNodeFormTaskTypeSelect
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeFormDuplicateButton
      - workflowEditNodeFormDeleteButton

    preconditions:
      - FR-WF-EN-001 has rendered workflowEditNodeForm
      - parent workflow type is activity

    trigger:
      - workflowEditNodeForm is rendered for a workflowNode whose parent workflow type is activity

    mainFlow:
      - workflowEditNodeForm shows workflowEditNodeFormTitleField
      - workflowEditNodeForm shows workflowEditNodeFormDescriptionField
      - workflowEditNodeForm shows workflowEditNodeFormContextSelect
      - workflowEditNodeForm shows workflowEditNodeFormTaskTypeSelect
      - workflowEditNodeForm shows workflowEditNodeFormTimeField
      - workflowEditNodeForm shows workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeForm does not render program-only or course-only metadata controls when parent workflow type is activity
      - workflowEditNodeForm shows workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton in its action area

    roleBehavior:
      owner:
        workflowEditNodeForm: editableWhereApplicable
      editor:
        workflowEditNodeForm: editableWhereApplicable
      commenter:
        workflowEditNodeForm: readOnlyPresentation
      viewer:
        workflowEditNodeForm: readOnlyPresentation
      user:
        workflowEditNodeForm: readOnlyPresentation

    acceptanceCriteria:
      - given parent workflow type is activity, when workflowEditNodeForm is rendered, the visible fields are exactly workflowEditNodeFormTitleField, workflowEditNodeFormDescriptionField, workflowEditNodeFormContextSelect, workflowEditNodeFormTaskTypeSelect, workflowEditNodeFormTimeField, and workflowEditNodeFormTagsAutocomplete
      - given parent workflow type is activity, workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton are present in the form's action area

    openQuestions: []

  - id: FR-WF-EN-003
    title: workflowEditNodeForm field set for course workflow type with no linked workflow

    designEvidence:
      - FIGMA-WF-EN-COURSE-OE-NOLINK

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormContextSelect
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeFormLinkWorkflowButton
      - workflowEditNodeFormDuplicateButton
      - workflowEditNodeFormDeleteButton

    preconditions:
      - FR-WF-EN-001 has rendered workflowEditNodeForm
      - parent workflow type is course
      - the workflowNode has no linked workflow

    trigger:
      - workflowEditNodeForm is rendered for an unlinked workflowNode whose parent workflow type is course

    mainFlow:
      - workflowEditNodeForm shows workflowEditNodeFormTitleField
      - workflowEditNodeForm shows workflowEditNodeFormDescriptionField
      - workflowEditNodeForm shows workflowEditNodeFormContextSelect
      - workflowEditNodeForm shows workflowEditNodeFormTimeField
      - workflowEditNodeForm shows workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeForm does not render activity-only or program-only metadata controls when parent workflow type is course
      - workflowEditNodeForm shows workflowEditNodeFormLinkWorkflowButton, workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton in its action area;

    roleBehavior:
      owner:
        workflowEditNodeForm: editableWhereApplicable
      editor:
        workflowEditNodeForm: editableWhereApplicable
      commenter:
        workflowEditNodeForm: readOnlyPresentation
      viewer:
        workflowEditNodeForm: readOnlyPresentation
      user:
        workflowEditNodeForm: readOnlyPresentation

    acceptanceCriteria:
      - given parent workflow type is course and the workflowNode has no linked workflow, the visible fields in workflowEditNodeForm are workflowEditNodeFormTitleField, workflowEditNodeFormDescriptionField, workflowEditNodeFormContextSelect, workflowEditNodeFormTimeField, and workflowEditNodeFormTagsAutocomplete; workflowEditNodeFormLinkWorkflowButton, workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton are also visible in the action area

    openQuestions: []

  - id: FR-WF-EN-004
    title: workflowEditNodeForm field set for course workflow type with a linked workflow

    designEvidence:
      - FIGMA-WF-EN-COURSE-CUSTOMINFO

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormLinkWorkflowButton
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormContextSelect
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeFormDuplicateButton
      - workflowEditNodeFormDeleteButton

    preconditions:
      - FR-WF-EN-001 has rendered workflowEditNodeForm
      - parent workflow type is course
      - the workflowNode has a linked activity workflow per FR-WF-EN-010

    trigger:
      - workflowEditNodeForm is rendered for a course workflowNode whose linkedWorkflow is set

    mainFlow:
      - workflowEditNodeFormTitleField is rendered at the top of workflowEditNodeForm and is read-only for every actor; its visible value is the linked activity workflow's workflowTitle
      - workflowEditNodeFormLinkWorkflowButton is rendered as the first control in the action area with label 'Remove linked activity' for owner and editor (active — click clears the link per FR-WF-EN-011); for commenter, viewer, and user (published-access) it shows the same label but is disabled (no-op on click)
      - workflowEditNodeFormDescriptionField and workflowEditNodeFormTimeField display the linked activity workflow's workflowMetadataFieldDescription and workflowMetadataFieldTime respectively and are read-only for every actor; changing those values requires editing the linked activity workflow (not this node's form)
      - workflowEditNodeForm still shows workflowEditNodeFormContextSelect and workflowEditNodeFormTagsAutocomplete; these are course-node-local metadata, are not sourced from the linked activity workflow, and remain editable for owner/editor
      - workflowEditNodeForm shows workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton in its action area

    roleBehavior:
      owner:
        workflowEditNodeForm: editableWhereApplicable
      editor:
        workflowEditNodeForm: editableWhereApplicable
      commenter:
        workflowEditNodeForm: readOnlyPresentation
      viewer:
        workflowEditNodeForm: readOnlyPresentation
      user:
        workflowEditNodeForm: readOnlyPresentation

    acceptanceCriteria:
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormTitleField is rendered read-only at the top and displays the linked activity workflow's workflowTitle
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormDescriptionField and workflowEditNodeFormTimeField are read-only for every actor and mirror the linked activity workflow's workflowMetadataFieldDescription and workflowMetadataFieldTime respectively; updates follow only when those metadata fields change on the linked activity workflow
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormContextSelect and workflowEditNodeFormTagsAutocomplete are still rendered as course-node-local metadata and remain editable for owner/editor (they are not forced to read-only by the linked workflow)
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormLinkWorkflowButton displays 'Remove linked activity' and is active for owner and editor and disabled for commenter, viewer, and user; workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton are present in the form's action area

    openQuestions: []

  - id: FR-WF-EN-005
    title: workflowEditNodeForm field set for program workflow type with no linked workflow

    designEvidence:
      - FIGMA-WF-EN-PROGRAM-OE-NOLINK

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormCreditsField
      - workflowEditNodeFormPonderationGroup
      - workflowEditNodeFormPonderationTheoryField
      - workflowEditNodeFormPonderationPracticeField
      - workflowEditNodeFormPonderationIndividualField
      - workflowEditNodeFormSpecificEducationSwitch
      - workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeFormLinkWorkflowButton
      - workflowEditNodeFormDuplicateButton
      - workflowEditNodeFormDeleteButton

    preconditions:
      - FR-WF-EN-001 has rendered workflowEditNodeForm
      - parent workflow type is program
      - the workflowNode has no linked workflow

    trigger:
      - workflowEditNodeForm is rendered for an unlinked workflowNode whose parent workflow type is program

    mainFlow:
      - workflowEditNodeForm shows workflowEditNodeFormTitleField
      - workflowEditNodeForm shows workflowEditNodeFormDescriptionField
      - workflowEditNodeForm shows workflowEditNodeFormTimeField
      - workflowEditNodeForm shows workflowEditNodeFormCreditsField
      - workflowEditNodeForm shows workflowEditNodeFormPonderationGroup containing workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, and workflowEditNodeFormPonderationIndividualField
      - workflowEditNodeForm shows workflowEditNodeFormSpecificEducationSwitch
      - workflowEditNodeForm shows workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeForm does not render activity-only or course-only metadata controls when parent workflow type is program
      - workflowEditNodeForm shows workflowEditNodeFormLinkWorkflowButton, workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton in its action area

    roleBehavior:
      owner:
        workflowEditNodeForm: editableWhereApplicable
      editor:
        workflowEditNodeForm: editableWhereApplicable
      commenter:
        workflowEditNodeForm: readOnlyPresentation
      viewer:
        workflowEditNodeForm: readOnlyPresentation
      user:
        workflowEditNodeForm: readOnlyPresentation

    acceptanceCriteria:
      - given parent workflow type is program and the workflowNode has no linked workflow, the visible fields in workflowEditNodeForm are, in order, workflowEditNodeFormTitleField, workflowEditNodeFormDescriptionField, workflowEditNodeFormTimeField, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationGroup (with its three hours fields), workflowEditNodeFormSpecificEducationSwitch, and workflowEditNodeFormTagsAutocomplete; workflowEditNodeFormLinkWorkflowButton, workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton are visible in the action area
      - given parent workflow type is program and the workflowNode is newly created (no prior user interaction with workflowEditNodeFormSpecificEducationSwitch), workflowEditNodeFormSpecificEducationSwitch defaults to OFF

    openQuestions: []

  - id: FR-WF-EN-006
    title: workflowEditNodeForm field set for program workflow type with a linked workflow

    designEvidence:
      - FIGMA-WF-EN-PROGRAM-CUSTOMINFO

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormLinkWorkflowButton
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormCreditsField
      - workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeFormPonderationGroup
      - workflowEditNodeFormPonderationTheoryField
      - workflowEditNodeFormPonderationPracticeField
      - workflowEditNodeFormPonderationIndividualField
      - workflowEditNodeFormSpecificEducationSwitch
      - workflowEditNodeFormDuplicateButton
      - workflowEditNodeFormDeleteButton

    preconditions:
      - FR-WF-EN-001 has rendered workflowEditNodeForm
      - parent workflow type is program
      - the workflowNode has a linked course workflow per FR-WF-EN-010

    trigger:
      - workflowEditNodeForm is rendered for a program workflowNode whose linkedWorkflow is set

    mainFlow:
      - workflowEditNodeFormTitleField is rendered at the top of workflowEditNodeForm and is read-only for every actor; its visible value is the linked course workflow's workflowTitle
      - workflowEditNodeFormLinkWorkflowButton is rendered as the first control in the action area with label 'Remove linked course' for owner and editor (active — click clears the link per FR-WF-EN-011); for commenter, viewer, and user (published-access) it shows the same label but is disabled (no-op on click)
      - workflowEditNodeFormDescriptionField, workflowEditNodeFormTimeField, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, and workflowEditNodeFormPonderationIndividualField display the linked course workflow's workflowMetadataFieldDescription, workflowMetadataFieldTime, workflowMetadataFieldCredits, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime respectively (all canonically defined in tests/docs/requirements/original/workflow_overview_requirements_v1.yaml) and are read-only for every actor; changing those values requires editing the linked course workflow (not this node's form)
      - workflowEditNodeForm still shows workflowEditNodeFormTagsAutocomplete; tags are program-node-local metadata, are not sourced from the linked course workflow, and remain editable for owner/editor
      - workflowEditNodeForm still shows workflowEditNodeFormSpecificEducationSwitch; it remains editable for owner/editor even while a link exists
      - workflowEditNodeForm does not render activity-only or course-only metadata controls when parent workflow type is program
      - workflowEditNodeForm shows workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton in its action area

    roleBehavior:
      owner:
        workflowEditNodeForm: editableWhereApplicable
      editor:
        workflowEditNodeForm: editableWhereApplicable
      commenter:
        workflowEditNodeForm: readOnlyPresentation
      viewer:
        workflowEditNodeForm: readOnlyPresentation
      user:
        workflowEditNodeForm: readOnlyPresentation

    acceptanceCriteria:
      - given parent workflow type is program and the workflowNode has a linked course workflow, workflowEditNodeFormTitleField is rendered read-only at the top and displays the linked course workflow's workflowTitle
      - given parent workflow type is program and the workflowNode has a linked course workflow, workflowEditNodeFormDescriptionField, workflowEditNodeFormTimeField, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, and workflowEditNodeFormPonderationIndividualField are read-only for every actor and mirror the linked course workflow's workflowMetadataFieldDescription, workflowMetadataFieldTime, workflowMetadataFieldCredits, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime respectively; updates follow only when those metadata fields change on the linked course workflow
      - given parent workflow type is program and the workflowNode has a linked course workflow, workflowEditNodeFormTagsAutocomplete is rendered as program-node-local metadata and remains editable for owner/editor (it is not forced to read-only by the linked workflow)
      - given parent workflow type is program and the workflowNode has a linked course workflow, workflowEditNodeFormSpecificEducationSwitch is rendered and editable for owner/editor
      - given parent workflow type is program and the workflowNode has a linked course workflow, workflowEditNodeFormLinkWorkflowButton displays 'Remove linked course' and is active for owner and editor and disabled for commenter, viewer, and user; workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton are present in the form's action area

    openQuestions: []

  - id: FR-WF-EN-007
    title: Auto-save field changes on workflowEditNodeForm

    designEvidence:
      - FIGMA-WF-EN-ACTIVITY-OE
      - FIGMA-WF-EN-COURSE-OE-NOLINK
      - FIGMA-WF-EN-PROGRAM-OE-NOLINK

    actors:
      - owner
      - editor

    uiObjects:
      - workflowEditNodeForm

    preconditions:
      - workflowEditNodeForm is rendered for a workflowNode
      - actor is owner or editor

    trigger:
      - user types, pastes, clears, or otherwise modifies a value in any editable field on workflowEditNodeForm

    mainFlow:
      - system persists changes without an explicit save control on workflowEditNodeForm
      - if workflowEditNodeFormTitleField is rendered and editable for the actor and the actor clears it, the empty string is persisted as the workflowNode's title; the 'Untitled node' placeholder is a display fallback only and is not auto-substituted into the persisted value; workflowNodeTitle in workflowView shows the same display fallback when persisted title is empty (canvas layout per tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-001)
      - persisted field values are reflected on subsequent re-renders of workflowEditNodeForm for the same workflowNode

    roleBehavior:
      owner:
        workflowEditNodeForm: editableWhereApplicable
      editor:
        workflowEditNodeForm: editableWhereApplicable
      commenter:
        workflowEditNodeForm: readOnlyPresentation
      viewer:
        workflowEditNodeForm: readOnlyPresentation

    acceptanceCriteria:
      - given workflowEditNodeForm is open for a workflowNode and actor is owner or editor, when user modifies an editable field, then the change is persisted without an explicit save control click
      - given workflowEditNodeForm is open and actor is commenter, viewer, or user (published-access), no field is editable and no auto-save fires

    openQuestions:
      - Confirm the exact debounce / save policy and any visible auto-save indicator (e.g., a 'Saving…' or 'Saved' affordance) per Figma; the current implementation persists silently.

  - id: FR-WF-EN-008
    title: Open workflowLinkWorkflowDialog from workflowEditNodeForm

    designEvidence:
      - FIGMA-WF-EN-COURSE-LINK-DIALOG
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG

    actors:
      - owner
      - editor

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormLinkWorkflowButton
      - workflowLinkWorkflowDialog

    preconditions:
      - workflowEditNodeForm is rendered for a workflowNode whose parent workflow type is course or program
      - the workflowNode currently has no linked workflow
      - actor is owner or editor

    trigger:
      - user clicks workflowEditNodeFormLinkWorkflowButton

    mainFlow:
      - system opens workflowLinkWorkflowDialog
      - workflowLinkWorkflowDialog renders workflowLinkWorkflowDialogTitle, workflowLinkWorkflowDialogSearchField, workflowLinkWorkflowDialogSearchResults, workflowLinkWorkflowDialogCancelButton, and workflowLinkWorkflowDialogLinkButton
      - workflowLinkWorkflowDialogSearchResults is populated per FR-WF-EN-010 from the parent project's own workflows only
      - when workflowLinkWorkflowDialogSearchResults contains at least one workflowCard, the first workflowCard is selected by default and workflowLinkWorkflowDialogLinkButton shows 'Link activity' or 'Link course' per FR-WF-EN-009
      - when workflowLinkWorkflowDialogSearchResults contains no workflowCard (the parent project has no eligible same-type workflows), workflowLinkWorkflowDialogEmptyState is rendered in place of the list, no workflowCard is selected, and workflowLinkWorkflowDialogLinkButton is disabled per FR-WF-EN-009

    roleBehavior:
      owner:
        workflowEditNodeFormLinkWorkflowButton: active
      editor:
        workflowEditNodeFormLinkWorkflowButton: active
      commenter:
        workflowEditNodeFormLinkWorkflowButton: disabled
      viewer:
        workflowEditNodeFormLinkWorkflowButton: disabled
      user:
        workflowEditNodeFormLinkWorkflowButton: disabled

    acceptanceCriteria:
      - given owner or editor is viewing workflowEditNodeForm for a course or program workflowNode with no linked workflow, when user clicks workflowEditNodeFormLinkWorkflowButton, workflowLinkWorkflowDialog opens with workflowLinkWorkflowDialogSearchField, workflowLinkWorkflowDialogSearchResults, workflowLinkWorkflowDialogCancelButton, and workflowLinkWorkflowDialogLinkButton; when workflowLinkWorkflowDialogSearchResults contains at least one workflowCard, the first card is selected by default and workflowLinkWorkflowDialogLinkButton shows 'Link activity' or 'Link course' per FR-WF-EN-009
      - given the parent project has no eligible same-type workflow for the workflowNode being edited (per FR-WF-EN-010), when workflowLinkWorkflowDialog opens, workflowLinkWorkflowDialogSearchResults contains no workflowCard, workflowLinkWorkflowDialogEmptyState is rendered, and workflowLinkWorkflowDialogLinkButton is disabled per FR-WF-EN-009
      - given workflowEditNodeForm is for an activity workflowNode, workflowEditNodeFormLinkWorkflowButton is not present (no entry path to workflowLinkWorkflowDialog) per FR-WF-EN-010
      - given actor is commenter, viewer, or user (published-access), workflowEditNodeFormLinkWorkflowButton is rendered and disabled (no-op on click) and workflowLinkWorkflowDialog does not open

    openQuestions: []

  - id: FR-WF-EN-009
    title: workflowLinkWorkflowDialog selection, search, empty state, confirm, and dismiss

    designEvidence:
      - FIGMA-WF-EN-COURSE-LINK-DIALOG
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG-EMPTY
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG-SEARCH-EMPTY

    actors:
      - owner
      - editor

    uiObjects:
      - workflowLinkWorkflowDialog
      - workflowLinkWorkflowDialogTitle
      - workflowLinkWorkflowDialogSearchField
      - workflowLinkWorkflowDialogSearchResults
      - workflowCard
      - workflowLinkWorkflowDialogEmptyState
      - workflowLinkWorkflowDialogCancelButton
      - workflowLinkWorkflowDialogLinkButton
      - workflowEditNodeForm

    preconditions:
      - workflowLinkWorkflowDialog is open per FR-WF-EN-008

    trigger:
      - user types in workflowLinkWorkflowDialogSearchField, or
      - user clicks a workflowCard, or
      - user clicks workflowLinkWorkflowDialogLinkButton, or
      - user clicks workflowLinkWorkflowDialogCancelButton, or
      - user clicks outside workflowLinkWorkflowDialog, or
      - user presses Escape

    mainFlow:
      - when user types in workflowLinkWorkflowDialogSearchField, workflowLinkWorkflowDialogSearchResults is filtered by workflow title; clearing workflowLinkWorkflowDialogSearchField restores the full list
      - workflowLinkWorkflowDialogSearchResults is a single flat list with no grouping; entries are drawn exclusively from the parent project's own workflows per FR-WF-EN-010 (workflows of other projects, including published workflows from other projects, are not eligible)
      - workflowLinkWorkflowDialog does not support keyboard navigation or selection of workflowCard entries; selection is mouse/pointer-based only
      - clicking a workflowCard selects that card as the single proposed link target; only one workflowCard may be selected at a time; clicking a different workflowCard replaces the prior selection
      - workflowCard presentation and card interactions in workflowLinkWorkflowDialogSearchResults conform to card_content_requirements_v1.yaml
      - workflowLinkWorkflowDialogLinkButton label is 'Link activity' (course parent) or 'Link course' (program parent) regardless of result-set state; it is enabled when a workflowCard is selected and disabled otherwise — on dialog open with at least one workflowCard, the first workflowCard is selected by default per FR-WF-EN-008 so the button is enabled
      - when workflowLinkWorkflowDialogSearchResults contains no workflowCard, workflowLinkWorkflowDialogEmptyState is rendered in place of the list and workflowLinkWorkflowDialogLinkButton is disabled (no-op on click); this applies to both (a) the parent project has no eligible same-type workflow for the workflowNode being edited per FR-WF-EN-010 and (b) workflowLinkWorkflowDialogSearchField is non-empty and returns zero matches against a non-empty project candidate set; workflowLinkWorkflowDialog does not offer any affordance to create a new workflow
      - when user clicks workflowLinkWorkflowDialogLinkButton, system links the selected workflow to the workflowNode, closes workflowLinkWorkflowDialog, and returns to workflowEditNodeForm in its linked-workflow state per FR-WF-EN-004 and FR-WF-EN-006
      - when user clicks workflowLinkWorkflowDialogCancelButton, clicks outside workflowLinkWorkflowDialog, or presses Escape, system closes workflowLinkWorkflowDialog without linking; the workflowNode's linkedWorkflow state is unchanged

    roleBehavior:
      owner:
        workflowLinkWorkflowDialog: editable
      editor:
        workflowLinkWorkflowDialog: editable

    acceptanceCriteria:
      - given workflowLinkWorkflowDialog is open with at least one workflowCard in workflowLinkWorkflowDialogSearchResults, workflowCard conforms to card_content_requirements_v1.yaml
      - given workflowLinkWorkflowDialog is open and workflowLinkWorkflowDialogSearchResults contains at least one workflowCard, the first workflowCard is selected by default and workflowLinkWorkflowDialogLinkButton is enabled
      - given workflowLinkWorkflowDialog is open and workflowLinkWorkflowDialogSearchResults contains no workflowCard, workflowLinkWorkflowDialogEmptyState is rendered in place of the list and workflowLinkWorkflowDialogLinkButton is disabled
      - given workflowLinkWorkflowDialogEmptyState is rendered and parent workflow type is course, workflowLinkWorkflowDialogEmptyState displays the title 'No activity found' and the subtitle 'There is currently no activity associated with this project. Before you can link an activity to a node here, you must first add or create an activity within the project.'
      - given workflowLinkWorkflowDialogEmptyState is rendered and parent workflow type is program, workflowLinkWorkflowDialogEmptyState displays the title 'No course found' and the subtitle 'There is currently no course associated with this project. Before you can link a course to a node here, you must first add or create a course within the project.'
      - given workflowLinkWorkflowDialog is open, when user clicks a workflowCard, that card is shown as selected and any previously selected workflowCard is deselected; workflowLinkWorkflowDialogLinkButton is enabled
      - given a workflowCard is selected and user clicks workflowLinkWorkflowDialogLinkButton, the workflowNode is linked to that workflow, workflowLinkWorkflowDialog closes, and workflowEditNodeForm enters its linked-workflow state per FR-WF-EN-004 and FR-WF-EN-006
      - given workflowLinkWorkflowDialog is open and parent workflow type is course, workflowLinkWorkflowDialogLinkButton displays the label 'Link activity'
      - given workflowLinkWorkflowDialog is open and parent workflow type is program, workflowLinkWorkflowDialogLinkButton displays the label 'Link course'
      - given workflowLinkWorkflowDialog is open, when user clicks workflowLinkWorkflowDialogCancelButton or clicks outside workflowLinkWorkflowDialog, workflowLinkWorkflowDialog closes and the workflowNode's linkedWorkflow state is unchanged
      - given workflowLinkWorkflowDialog is open, when user types into workflowLinkWorkflowDialogSearchField, workflowLinkWorkflowDialogSearchResults filters to entries whose title matches the search; when user clears workflowLinkWorkflowDialogSearchField, workflowLinkWorkflowDialogSearchResults restores to the full candidate set per FR-WF-EN-010

    openQuestions: []

  - id: FR-WF-EN-010
    title: Workflow-type linkability constraints for workflowLinkWorkflowDialog

    designEvidence:
      - FIGMA-WF-EN-COURSE-LINK-DIALOG
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG

    actors:
      - owner
      - editor

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormLinkWorkflowButton
      - workflowLinkWorkflowDialog
      - workflowLinkWorkflowDialogSearchResults
      - workflowCard

    preconditions:
      - workflowEditNodeForm is rendered for a workflowNode

    trigger:
      - workflowEditNodeForm is rendered (determines whether workflowEditNodeFormLinkWorkflowButton is present), or
      - workflowLinkWorkflowDialog is opened (determines what workflowLinkWorkflowDialogSearchResults contains)

    mainFlow:
      - when parent workflow type is activity, workflowEditNodeFormLinkWorkflowButton is not rendered; activity workflowNodes cannot be linked to any workflow
      - workflowLinkWorkflowDialogSearchResults is restricted to workflows whose parent project is the same as the workflowNode being edited; workflows of other projects, including published workflows owned by other projects, are not eligible link targets
      - when parent workflow type is course, workflowLinkWorkflowDialogSearchResults includes only same-project workflows whose type is activity;
      - when parent workflow type is program, workflowLinkWorkflowDialogSearchResults includes only same-project workflows whose type is course; 
      - a workflowNode can be linked to at most one workflow at a time

    roleBehavior: {}

    acceptanceCriteria:
      - given parent workflow type is activity, workflowEditNodeForm does not render workflowEditNodeFormLinkWorkflowButton
      - given workflowLinkWorkflowDialog is open, every workflowCard in workflowLinkWorkflowDialogSearchResults belongs to the same parent project as the workflowNode being edited (no cross-project workflows appear, regardless of published status)
      - given parent workflow type is course and workflowLinkWorkflowDialog is open, every workflowCard in workflowLinkWorkflowDialogSearchResults corresponds to an activity-type workflow within the parent project
      - given parent workflow type is program and workflowLinkWorkflowDialog is open, every workflowCard in workflowLinkWorkflowDialogSearchResults corresponds to a course-type workflow within the parent project
      - given a workflowNode already has a linked workflow, workflowEditNodeFormLinkWorkflowButton is rendered with label 'Remove linked activity' (course parent) or 'Remove linked course' (program parent); owner and editor can click it to clear the link per FR-WF-EN-011; commenter, viewer, and user (published-access) see the same label but the control is disabled (no-op on click) until the link is cleared by an owner or editor

    openQuestions: []

  - id: FR-WF-EN-011
    title: Remove linked workflow from a workflowNode

    designEvidence:
      - FIGMA-WF-EN-COURSE-CUSTOMINFO
      - FIGMA-WF-EN-PROGRAM-CUSTOMINFO

    actors:
      - owner
      - editor

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormLinkWorkflowButton
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormCreditsField
      - workflowEditNodeFormPonderationTheoryField
      - workflowEditNodeFormPonderationPracticeField
      - workflowEditNodeFormPonderationIndividualField

    preconditions:
      - workflowEditNodeForm is rendered for a workflowNode whose parent workflow type is course or program
      - the workflowNode currently has a linked workflow

    trigger:
      - user clicks workflowEditNodeFormLinkWorkflowButton while it displays 'Remove linked activity' or 'Remove linked course'

    mainFlow:
      - system clears the workflowNode's linkedWorkflow association immediately on click
      - the workflowNode's own values for title, description, time, and (for program parent workflow type) credits and ponderation hours are preserved while the link is active (they are not overwritten by the linked workflow's metadata, only masked in the read-only mirror fields per FR-WF-EN-004 and FR-WF-EN-006); on link removal those persisted node-local values are restored to their respective fields
      - workflowEditNodeFormTitleField switches from read-only display of the linked workflow's workflowTitle to an editable field for owner/editor and shows the workflowNode's own previously-persisted title (or the placeholder 'Untitled node' if that persisted title is empty per FR-WF-EN-007)
      - workflowEditNodeFormLinkWorkflowButton label returns to 'Link workflow' and becomes the active entry path to workflowLinkWorkflowDialog per FR-WF-EN-008 for owner and editor
      - workflowEditNodeFormDescriptionField and workflowEditNodeFormTimeField become editable for owner/editor again and show the workflowNode's own previously-persisted values; for parent workflow type program, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, and workflowEditNodeFormPonderationIndividualField also become editable for owner/editor again and show the workflowNode's own previously-persisted values

    roleBehavior:
      owner:
        workflowEditNodeFormLinkWorkflowButton: activeWhenLinked
      editor:
        workflowEditNodeFormLinkWorkflowButton: activeWhenLinked

    acceptanceCriteria:
      - given the workflowNode has a linked workflow and owner or editor clicks workflowEditNodeFormLinkWorkflowButton ('Remove linked activity' or 'Remove linked course'), the link is cleared immediately with no confirmation dialog; workflowEditNodeFormTitleField becomes editable again and shows the workflowNode's own previously-persisted title (or placeholder), and workflowEditNodeFormLinkWorkflowButton shows 'Link workflow' and is active again as the dialog entry control
      - given the workflowNode had a linked workflow that is removed, workflowEditNodeFormTitleField, workflowEditNodeFormDescriptionField, and workflowEditNodeFormTimeField are editable for owner/editor again and show the workflowNode's own previously-persisted values (the node-local values that existed at the moment the link was created, plus any node-local edits made while the link existed)
      - given parent workflow type is program and the workflowNode had a linked course workflow that is removed, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, and workflowEditNodeFormPonderationIndividualField are editable for owner/editor again and show the workflowNode's own previously-persisted values

    openQuestions: []

