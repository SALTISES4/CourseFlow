# Normalized requirements: 'Favourites' page (route /favourites)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (library/navigation favourites behavior), implementation evidence in Library/Favourites page and Favourite toggle component.
# Application code evidence: react/src/components/pages/Library/Favourites/index.tsx; react/src/components/common/UIPrimitives/Favourite/index.tsx; react/src/HTTP/XMLHTTP/API/library.rtk.ts
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/main_navigation_requirements_v1.yaml (FR-NAV-007 route entry to /favourites); tests/docs/requirements/original/library_page_requirements_v1.yaml (sort and shared filters — FR-LIB-002, FR-LIB-003; favouritesToggle on 'My library' is scoped to contributor objects only); tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard and workflowCard — FR-CARD-001 through FR-CARD-006 as applicable)

