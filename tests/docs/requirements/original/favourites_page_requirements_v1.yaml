locatorMappings:
  favouritesPage:
    strategy: "URL pathname /favourites"
    confidence: confirmed
  favouritesFilterToolbar:
    strategy: "{favouritesPage} top filter toolbar row"
    confidence: inferred
  sortControl:
    strategy: "{favouritesFilterToolbar} control showing label 'Sort', 'A - Z', or 'Date created'"
    confidence: inferred
  sortResetButton:
    strategy: "{sortControl} button[aria-label='close'] or icon-only clear control adjacent to active sort label"
    confidence: inferred
  ownershipFilter:
    strategy: "{favouritesFilterToolbar} single-select filter showing placeholder 'Ownership' or active label Owned or Shared"
    confidence: inferred
  ownershipFilterResetButton:
    strategy: "{ownershipFilter} button[aria-label='close'] or icon-only clear control adjacent to active ownership label"
    confidence: inferred
  typeFilter:
    strategy: "{favouritesFilterToolbar} single-select filter showing label 'Type' or committed type label 'Projects' or 'Workflows'"
    confidence: inferred
  typeFilterResetButton:
    strategy: "{typeFilter} button[aria-label='close'] or icon-only clear control when committed type scope is active"
    confidence: inferred
  workflowTypeFilter:
    strategy: "{favouritesFilterToolbar} multiselect filter for workflow program types; present only when typeFilter is committed to 'Workflows' or is Unset (no committed 'Projects' or 'Workflows')"
    confidence: inferred
  templatesToggle:
    strategy: "{favouritesFilterToolbar} toggle labeled 'Templates'"
    confidence: inferred
  keywordSearchField:
    strategy: "{favouritesFilterToolbar} inline search field using same interaction mechanism as 'My library'"
    confidence: inferred
  keywordSearchClearButton:
    strategy: "{keywordSearchField} right-side icon button shown when input is non-empty"
    confidence: inferred
  resultsSummary:
    strategy: "{favouritesPage} region between favouritesFilterToolbar and resultsRegion showing count summary"
    confidence: inferred
  resultsRegion:
    strategy: "{favouritesPage} main results grid/listing region"
    confidence: inferred
  projectCard:
    strategy: "{resultsRegion} card where object type is project"
    confidence: inferred
  workflowCard:
    strategy: "{resultsRegion} card where object type is workflow/program/course/activity; template workflows remain workflowCard and are identified by cardTemplateChip"
    confidence: inferred
  cardTemplateChip:
    strategy: "{workflowCard} chip with text 'Template' on template workflow rows"
    confidence: inferred
  pagination:
    strategy: "{favouritesPage} pagination control shown when pageCount > 1"
    confidence: inferred
  paginationPageNumberButton:
    strategy: "{pagination} clickable numeric page item"
    confidence: inferred
  paginationPreviousNextButton:
    strategy: "{pagination} single-arrow previous/next control"
    confidence: inferred
  paginationFirstLastButton:
    strategy: "{pagination} double-arrow first/last control"
    confidence: inferred
  favouritesLoadingState:
    strategy: "{resultsRegion} 10 rectangular skeleton rows while loading"
    confidence: inferred
  favouritesEmptyState:
    strategy: "{resultsRegion} text 'No results found'"
    confidence: inferred
  favouritesErrorState:
    strategy: "{resultsRegion} error view"
    confidence: inferred

requirements:
  - id: FR-FAV-001
    title: Route and base scope for '/favourites'

    designEvidence:
      - FIGMA-FAV-DEFAULT
      - FIGMA-FAV-WITH-WORKFLOWS

    actors:
      - user

    uiObjects:
      - favouritesPage
      - favouritesFilterToolbar
      - resultsSummary
      - resultsRegion
      - projectCard
      - workflowCard

    preconditions:
      - user is authenticated
      - user navigates to route pattern /favourites (for example from viewAllLink in mainNavigation)

    trigger:
      - user lands on /favourites

    mainFlow:
      - system renders favouritesPage with favouritesFilterToolbar, resultsSummary, and resultsRegion
      - on first land of /favourites, typeFilter is committed to 'Projects' by default (same as 'My library')
      - with default first-load typeFilter committed to 'Projects', resultsRegion includes favourited projects only
      - when typeFilter includes workflows in scope, resultsRegion may include favourited workflows and favourited published workflows where user is not Owner, Editor, Viewer, or Commenter
      - resultsRegion may include favourited published projects where user is not Owner, Editor, Viewer, or Commenter
      - results render as projectCard and/or workflowCard according to object type and active filters
      - projectCard and workflowCard presentation and card interactions in resultsRegion conform to card_content_requirements_v1.yaml

    roleBehavior: {}

    acceptanceCriteria:
      - current route matches /favourites
      - favouritesPage is visible
      - favouritesFilterToolbar is visible
      - on first land of /favourites, typeFilter reflects committed 'Projects' by default
      - resultsSummary is visible between favouritesFilterToolbar and resultsRegion
      - given first land on /favourites with default typeFilter state, resultsRegion shows favourited projects only
      - given typeFilter includes workflows in scope, resultsRegion may show favourited workflows and favourited projects according to active filters
      - given resultsRegion shows at least one card, projectCard and workflowCard in resultsRegion conform to card_content_requirements_v1.yaml

    openQuestions: []

  - id: FR-FAV-002
    title: Toolbar filtering on '/favourites'

    designEvidence:
      - FIGMA-FAV-DEFAULT
      - FIGMA-FAV-WITH-WORKFLOWS

    actors:
      - user

    uiObjects:
      - favouritesPage
      - favouritesFilterToolbar
      - sortControl
      - sortResetButton
      - ownershipFilter
      - ownershipFilterResetButton
      - typeFilter
      - typeFilterResetButton
      - workflowTypeFilter
      - templatesToggle
      - keywordSearchField
      - keywordSearchClearButton
      - resultsSummary
      - resultsRegion

    preconditions:
      - favouritesPage is rendered

    trigger:
      - user changes sortControl, ownershipFilter, typeFilter, workflowTypeFilter, templatesToggle, or keywordSearchField, or uses a filter reset control

    mainFlow:
      - sortControl behaviour conforms to library_page_requirements_v1.yaml FR-LIB-002
      - ownershipFilter, typeFilter, workflowTypeFilter, templatesToggle, and keywordSearchField behaviour conform to library_page_requirements_v1.yaml FR-LIB-003 where those controls are present on favouritesFilterToolbar
      - favouritesPage has no favouritesToggle and no archiveToggle; base scope is already limited to favourited objects per FR-FAV-001
      - changing sort or any filter control on favouritesFilterToolbar resets listing to the first results page

    roleBehavior: {}

    acceptanceCriteria:
      - given favouritesPage is rendered, sortControl behaviour conforms to FR-LIB-002
      - given favouritesPage is rendered, ownershipFilter and typeFilter behaviour conform to FR-LIB-003
      - given first land on /favourites, typeFilter is committed to 'Projects' by default
      - given typeFilter is reset to Unset, typeFilter shows placeholder 'Type'
      - given typeFilter is committed to 'Projects' only, workflowTypeFilter is not visible
      - given typeFilter includes 'Workflows' in scope (committed 'Workflows', or Unset), workflowTypeFilter is visible
      - given ownershipFilter has an active option, ownershipFilterResetButton is visible and clears ownership selection
      - given typeFilter has an active committed option, typeFilterResetButton is visible and clears the committed type scope per product default
      - given workflowTypeFilter is visible and user selects more than one option, results include workflows matching any selected workflow type
      - given templatesToggle is on, results include only template favourited cards
      - given templatesToggle is off, results may include template and non-template favourited cards
      - given keywordSearchField receives input, results are constrained by keyword without requiring 'Enter', using the same mechanism as 'My library'
      - given keywordSearchField is non-empty, keywordSearchClearButton is visible and clears the keyword constraint when clicked
      - given any filter or sort change, resultsSummary updates to reflect the current query result counts

    openQuestions: []

  - id: FR-FAV-003
    title: Loading, empty, error, and pagination states on '/favourites'

    designEvidence:
      - FIGMA-FAV-DEFAULT
      - FIGMA-FAV-WITH-WORKFLOWS
      - FIGMA-FAV-EMPTY
      - FIGMA-FAV-ERROR

    actors:
      - user

    uiObjects:
      - favouritesPage
      - resultsRegion
      - favouritesLoadingState
      - favouritesEmptyState
      - favouritesErrorState
      - pagination
      - paginationPageNumberButton
      - paginationPreviousNextButton
      - paginationFirstLastButton

    preconditions:
      - favouritesPage is rendered

    trigger:
      - favourites query state changes or user interacts with pagination controls

    mainFlow:
      - while query is loading, system renders favouritesLoadingState placeholders in resultsRegion
      - when query returns zero rows, system renders favouritesEmptyState
      - when query fails, system renders favouritesErrorState
      - when query succeeds with more than one page, system renders pagination and supports page changes

    roleBehavior: {}

    acceptanceCriteria:
      - given loading query, favouritesLoadingState is visible
      - given successful query with zero rows, favouritesEmptyState is visible
      - given failed query, favouritesErrorState is visible
      - given query meta pageCount greater than 1, pagination is visible
      - given user selects a different paginationPageNumberButton, resultsRegion updates for that page
      - given pagination is visible, paginationPreviousNextButton and paginationFirstLastButton navigate correctly between favourites result pages

    openQuestions: []

