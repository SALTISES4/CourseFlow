# Normalized requirements: 'Favourites' page (route /favourites)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (library/navigation favourites behavior), implementation evidence in Library/Favourites page and Favourite toggle component.
# Application code evidence: react/src/components/pages/Library/Favourites/index.tsx; react/src/components/common/UIPrimitives/Favourite/index.tsx; react/src/HTTP/XMLHTTP/API/library.rtk.ts
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/main_navigation_requirements_v1.yaml (FR-NAV-007 route entry to /favourites); tests/docs/requirements/original/library_page_requirements_v1.yaml (favouritesToggle on 'My library' is scoped to contributor objects only); tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard/workflowCard/cardTemplateChip and cardFavouriteToggle semantics)

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  favouritesPage:
    meaning: Dedicated page at route pathname /favourites for favourited library objects. Scope includes favourited workflows and favourited projects in 'My library' contributor scope and favourited published workflows and favourited published projects outside that contributor scope.
  favouritesFilterToolbar:
    meaning: Top toolbar on favouritesPage containing sortControl, ownershipFilter, typeFilter, workflowTypeFilter (visible only when typeFilter includes 'Workflows' in scope, same visibility rule as on 'My library'), templatesToggle, and keywordSearchField for favourites results.
  sortControl:
    meaning: Same canonical behavior as sortControl on 'My library' (FR-LIB-002), on favouritesFilterToolbar. Placeholder label is 'Sort'; selectable options include 'A - Z' and 'Date created'; when non-default sort is active, sortResetButton is shown.
  sortResetButton:
    meaning: Clear (X) control on sortControl when non-default sort is active; clears to default sort order for favourites results.
  ownershipFilter:
    meaning: Same canonical behavior as ownershipFilter on 'My library' (FR-LIB-003), on favouritesFilterToolbar. Single-select with placeholder label 'Ownership'; selectable options include at least 'Owned' and 'Shared'; when active, visible label is the selected option and ownershipFilterResetButton is shown.
  ownershipFilterResetButton:
    meaning: Clear (X) control on ownershipFilter when an ownership option is active; clears ownership selection and restores placeholder label 'Ownership'.
  typeFilter:
    meaning: Same canonical behavior as typeFilter on 'My library' (FR-LIB-003), on favouritesFilterToolbar. Placeholder label is 'Type'; commitments are 'Projects' or 'Workflows', with Unset as the cleared state; no separate selectable 'All types' row. On first land of /favourites, typeFilter is committed to 'Projects' until the user changes it.
  typeFilterResetButton:
    meaning: Clear (X) control on typeFilter when a committed type is active; clears to the canonical default for '/favourites' per product behavior.
  workflowTypeFilter:
    meaning: Same canonical behavior as workflowTypeFilter on 'My library' (FR-LIB-003), on favouritesFilterToolbar. Multiselect options are 'Activity', 'Course', and 'Program'; visible only when typeFilter includes 'Workflows' in scope (typeFilter committed to 'Workflows', or typeFilter is Unset), and not visible when typeFilter is committed to 'Projects' only.
  templatesToggle:
    meaning: Boolean filter on favouritesFilterToolbar labeled 'Templates'; when on, favourites results are constrained to template cards only; when off, both template and non-template favourited cards may be shown.
  keywordSearchField:
    meaning: Search field on favouritesFilterToolbar; same mechanism as keywordSearchField on 'My library': results narrow as user types keyword input and pressing 'Enter' is not required.
  keywordSearchClearButton:
    meaning: Icon-only clear control ('X') shown on the right side of keywordSearchField when the field is not empty; clicking it clears the field and removes keyword-search filtering.
  resultsSummary:
    meaning: Region between favouritesFilterToolbar and resultsRegion displaying current query result counts; same canonical contract as resultsSummary on 'My library' and 'Explore'.
  resultsRegion:
    meaning: Same canonical object as resultsRegion on 'My library' and 'Explore'; on favouritesPage it lists favourited projectCard and workflowCard items for the current query state, including loading, empty, and error states.
  projectCard:
    meaning: Same canonical object as projectCard in card_content_requirements_v1.yaml, when resultsRegion item type is project.
  workflowCard:
    meaning: Same canonical object as workflowCard in card_content_requirements_v1.yaml, when resultsRegion item type is workflow.
  cardTemplateChip:
    meaning: Same canonical object as cardTemplateChip in card_content_requirements_v1.yaml; shown on workflowCard when the workflow row represents a template.
  pagination:
    meaning: Same canonical pagination control used on 'My library' and 'Explore'; shown when total matching favourited items are more than one page at 10 items per page.
  paginationPageNumberButton:
    meaning: Clickable numeric page control within pagination.
  paginationPreviousNextButton:
    meaning: Single-arrow control within pagination that navigates one page backward or forward.
  paginationFirstLastButton:
    meaning: Double-arrow control within pagination that navigates directly to first or last page.
  favouritesLoadingState:
    meaning: Loading placeholders shown while favourites query is in flight.
  favouritesEmptyState:
    meaning: Empty state shown when the favourites query returns zero matching rows.
  favouritesErrorState:
    meaning: Error state shown when the favourites query fails.

