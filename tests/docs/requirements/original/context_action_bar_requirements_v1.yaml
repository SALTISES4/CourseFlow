# Normalized requirements: context action bar (project and workflow routes)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Contributors; Archiving a Project; Archiving a Workflow; View Settings / action bar)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/original/project_edit_form_requirements_v1.yaml (editPencilButton, editProjectDialog on project routes—FR-PROJ-FORM-003)
#   - tests/docs/requirements/original/workflow_edit_form_requirements_v1.yaml (editPencilButton, editWorkflowDialog on workflow routes—FR-WF-FORM-001)
#   - tests/docs/requirements/original/project_overview_requirements_v1.yaml (projectMetadataAddContributorsButton; addContributorsDialog—FR-PROJ-OV-004; contributor list outcomes—FR-PROJ-OV-002; project tags catalog—FR-PROJ-OV-005)
#   - tests/docs/requirements/original/project_archive_requirements_v1.yaml (FR-PROJ-ARCH-* after 'Archive project' overflow row)
#   - tests/docs/requirements/original/workflow_archive_requirements_v1.yaml (FR-WF-ARCH-* after 'Archive [workflow type]' overflow row)
#   - tests/docs/requirements/original/workflow_copy_requirements_v1.yaml (FR-WF-COPY-* after 'Copy [workflow type]' overflow row)
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail — FR-WS-ACCESS-001, FR-WS-ACCESS-002)
#   - tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (workflowView, workflowSectionContainer — expand/collapse section canvas behavior FR-SEC-012)
#   - tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (workflowNode — tag filter targets on Workflow sub-view)
#   - tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml (workflowOutcomeView, workflowOutcome — expand/collapse outcome targets)
#   - tests/docs/requirements/original/workflow_delete_section_requirements_v1.yaml (sole-section delete guard — FR-SEC-006; workflow always retains ≥1 workflowSectionContainer)

documentPreconditions:
  - user is authenticated to CourseFlow
  - on any route matching '/project/{id}/*', actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on that project, or (b) user (published-access, no explicit contributor role) viewing a project that is published
  - routes matching '/project/{id}/*' include '/project/{id}' (empty suffix) and '/project/{id}/<sub-view>' for any sub-view
  - on any route matching '/workflow/{id}/*', actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project of the workflow, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - routes matching '/workflow/{id}/*' include '/workflow/{id}' (empty suffix) and '/workflow/{id}/<sub-view>' for any sub-view
  - requirements in this file assume the above hold; when they do not, assert per tests/docs/requirements/original/workspace_access_requirements_v1.yaml FR-WS-ACCESS-001 (project routes) or FR-WS-ACCESS-002 (workflow routes)

uiObjectDefinitions:
  contextActionBar:
    meaning: Contextual action bar below top navigation on project and workflow routes.
  editPencilButton:
    meaning: Pencil edit control on contextActionBar for project and workflow routes.
  contextActionBarAddContributorsButton:
    meaning: Icon-only add-contributors control on contextActionBar for project routes (no user-visible label).
  contextActionBarOverflowTrigger:
    meaning: Overflow menu trigger on contextActionBar.
  contextActionBarOverflowMenu:
    meaning: Menu surface opened from contextActionBarOverflowTrigger
  contextActionBarOverflowItemArchiveProject:
    meaning: Archive project row in contextActionBarOverflowMenu.
  contextActionBarOverflowItemArchiveWorkflow:
    meaning: Archive row in contextActionBarOverflowMenu; label matches the 'Archive [workflow type]' template per FR-CAB-005.
  contextActionBarOverflowItemCopyWorkflow:
    meaning: Copy row in contextActionBarOverflowMenu; label matches the 'Copy [workflow type]' template per FR-CAB-005.
  workflowViewSettingsTrigger:
    meaning: View settings control on contextActionBar for workflow routes.
  workflowViewSettingsMenu:
    meaning: Menu opened from workflowViewSettingsTrigger
  workflowViewSettingsMenuItemExpandAllSections:
    meaning: Menu row labeled 'Expand all sections' in workflowViewSettingsMenu.
  workflowViewSettingsMenuItemCollapseAllSections:
    meaning: Menu row labeled 'Collapse all sections' in workflowViewSettingsMenu.
  workflowViewSettingsMenuItemExpandAllOutcomes:
    meaning: Menu row labeled 'Expand all outcomes' in workflowViewSettingsMenu.
  workflowViewSettingsMenuItemCollapseAllOutcomes:
    meaning: Menu row labeled 'Collapse all outcomes' in workflowViewSettingsMenu.
  workflowViewSettingsMenuTagsSection:
    meaning: Tags area in workflowViewSettingsMenu listing project tags with on/off toggles.
  workflowJumpToTrigger:
    meaning: Jump to control on contextActionBar on the Workflow sub-view.
  workflowJumpToMenu:
    meaning: Dropdown menu listing workflowSectionContainer entries from workflowJumpToTrigger.
  workflowJumpToMenuSectionItem:
    meaning: A workflowSectionContainer row inside workflowJumpToMenu.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.

locatorMappings:
  contextActionBar: "canonical_locators.yaml -> contextActionBar"
  editPencilButton: "canonical_locators.yaml -> editPencilButton"
  contextActionBarAddContributorsButton: "canonical_locators.yaml -> contextActionBarAddContributorsButton"
  contextActionBarOverflowTrigger: "canonical_locators.yaml -> contextActionBarOverflowTrigger"
  contextActionBarOverflowMenu: "canonical_locators.yaml -> contextActionBarOverflowMenu"
  contextActionBarOverflowItemArchiveProject: "canonical_locators.yaml -> contextActionBarOverflowItemArchiveProject"
  contextActionBarOverflowItemArchiveWorkflow: "canonical_locators.yaml -> contextActionBarOverflowItemArchiveWorkflow"
  contextActionBarOverflowItemCopyWorkflow: "canonical_locators.yaml -> contextActionBarOverflowItemCopyWorkflow"
  workflowViewSettingsTrigger: "canonical_locators.yaml -> workflowViewSettingsTrigger"
  workflowViewSettingsMenu: "canonical_locators.yaml -> workflowViewSettingsMenu"
  workflowViewSettingsMenuItemExpandAllSections: "canonical_locators.yaml -> workflowViewSettingsMenuItemExpandAllSections"
  workflowViewSettingsMenuItemCollapseAllSections: "canonical_locators.yaml -> workflowViewSettingsMenuItemCollapseAllSections"
  workflowViewSettingsMenuItemExpandAllOutcomes: "canonical_locators.yaml -> workflowViewSettingsMenuItemExpandAllOutcomes"
  workflowViewSettingsMenuItemCollapseAllOutcomes: "canonical_locators.yaml -> workflowViewSettingsMenuItemCollapseAllOutcomes"
  workflowViewSettingsMenuTagsSection: "canonical_locators.yaml -> workflowViewSettingsMenuTagsSection"
  workflowJumpToTrigger: "canonical_locators.yaml -> workflowJumpToTrigger"
  workflowJumpToMenu: "canonical_locators.yaml -> workflowJumpToMenu"
  workflowJumpToMenuSectionItem: "canonical_locators.yaml -> workflowJumpToMenuSectionItem"
  workflowSectionContainer: "canonical_locators.yaml -> workflowSectionContainer"

requirements:
  - id: FR-CAB-001
    title: contextActionBar on project routes

    designEvidence:
      - FIGMA-CAB-PROJECT-ACTION-BAR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar

    preconditions:
      - documentPreconditions hold for a project route
      - current route matches '/project/{id}/*'

    trigger: []

    mainFlow:
      - system renders contextActionBar directly below topNavigationBar when current route matches '/project/{id}/*'
      - contextActionBar remains available when switching between project sub-views via projectViewTabSelector per tests/docs/requirements/original/project_header_requirements_v1.yaml FR-PROJ-HEADER-001 (same bar contract across sub-views)

    roleBehavior: {}

    acceptanceCriteria:
      - given FR-CAB-001 preconditions hold, contextActionBar is visible below topNavigationBar

    openQuestions: []

  - id: FR-CAB-002
    title: Project contextActionBar primary actions (edit pencil, add contributors, overflow)

    designEvidence:
      - FIGMA-CAB-PROJECT-ACTION-BAR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - editPencilButton
      - contextActionBarAddContributorsButton
      - contextActionBarOverflowTrigger

    preconditions:
      - FR-CAB-001 preconditions hold

    trigger: []

    mainFlow:
      - on project routes, contextActionBar includes editPencilButton, contextActionBarAddContributorsButton, and contextActionBarOverflowTrigger for every actor in scope
      - contextActionBarAddContributorsButton is icon-only with no user-visible label
      - detailed editPencilButton behavior is specified in project_edit_form_requirements_v1.yaml FR-PROJ-FORM-003
      - contextActionBarAddContributorsButton and contextActionBarOverflowTrigger actionability per roleBehavior; addContributorsDialog opens from contextActionBarAddContributorsButton per tests/docs/requirements/original/project_overview_requirements_v1.yaml FR-PROJ-OV-002 and FR-PROJ-OV-004

    roleBehavior:
      owner:
        contextActionBarAddContributorsButton: available
        contextActionBarOverflowTrigger: available
      editor:
        contextActionBarAddContributorsButton: available
        contextActionBarOverflowTrigger: disabled
      viewer:
        contextActionBarAddContributorsButton: disabled
        contextActionBarOverflowTrigger: disabled
      commenter:
        contextActionBarAddContributorsButton: disabled
        contextActionBarOverflowTrigger: disabled
      user:
        contextActionBarAddContributorsButton: disabled
        contextActionBarOverflowTrigger: disabled

    acceptanceCriteria:
      - given FR-CAB-002 preconditions hold, editPencilButton, contextActionBarAddContributorsButton, and contextActionBarOverflowTrigger are visible on contextActionBar for every actor in scope; contextActionBarAddContributorsButton is icon-only with no user-visible label; editPencilButton actionability per FR-PROJ-FORM-003
      - contextActionBarAddContributorsButton and contextActionBarOverflowTrigger actionability per roleBehavior (viewer, commenter, and user see contextActionBarAddContributorsButton visible but disabled); addContributorsDialog and contextActionBarOverflowMenu open rules per FR-PROJ-OV-002

    openQuestions: []

  - id: FR-CAB-003
    title: Project overflow menu

    designEvidence:
      - FIGMA-CAB-PROJECT-ACTION-BAR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - contextActionBarOverflowTrigger
      - contextActionBarOverflowMenu
      - contextActionBarOverflowItemArchiveProject

    preconditions:
      - FR-CAB-001 preconditions hold

    trigger:
      - actor clicks contextActionBarOverflowTrigger per roleBehavior

    mainFlow:
      - when actor clicks contextActionBarOverflowTrigger per roleBehavior, system opens contextActionBarOverflowMenu
      - contextActionBarOverflowMenu lists exactly one selectable row contextActionBarOverflowItemArchiveProject labeled 'Archive project'
      - when actor clicks contextActionBarOverflowItemArchiveProject per roleBehavior, post-click behaviour is specified in project_archive_requirements_v1.yaml (FR-PROJ-ARCH-001 onward)

    roleBehavior:
      owner:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveProject: available
      editor:
        contextActionBarOverflowTrigger: disabled
      viewer:
        contextActionBarOverflowTrigger: disabled
      commenter:
        contextActionBarOverflowTrigger: disabled
      user:
        contextActionBarOverflowTrigger: disabled

    acceptanceCriteria:
      - given FR-CAB-003 preconditions hold and actor clicks contextActionBarOverflowTrigger per roleBehavior, contextActionBarOverflowMenu opens and shows exactly one row labeled 'Archive project'
      - contextActionBarOverflowItemArchiveProject actionability per roleBehavior; post-click behaviour per FR-PROJ-ARCH-001 onward in project_archive_requirements_v1.yaml

    openQuestions: []

  - id: FR-CAB-004
    title: contextActionBar on workflow routes ('Overview', 'Workflow', 'Outcomes')

    designEvidence:
      - FIGMA-CAB-WF-OVERVIEW
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar

    preconditions:
      - documentPreconditions hold for a workflow route
      - current route matches '/workflow/{id}/*'

    trigger: []

    mainFlow:
      - system renders contextActionBar directly below topNavigationBar when current route matches '/workflow/{id}/*'
      - contextActionBar remains available when switching between workflow sub-views via workflowViewTabSelector per tests/docs/requirements/original/workflow_header_requirements_v1.yaml FR-WF-HEADER-001 (same bar contract across sub-views)
      - contextActionBar includes editPencilButton, contextActionBarOverflowTrigger, and workflowViewSettingsTrigger; detailed editPencilButton behavior is specified in workflow_edit_form_requirements_v1.yaml FR-WF-FORM-001
      - when active workflow sub-view is 'Workflow', contextActionBar also includes workflowJumpToTrigger; on other workflow sub-views this control is not shown
      - contextActionBar shell is shown on each workflow sub-view (inner controls may differ per FR-CAB-005 and FR-CAB-006)

    roleBehavior: {}

    acceptanceCriteria:
      - given FR-CAB-004 preconditions hold, contextActionBar is visible below topNavigationBar for each of the workflow sub-views in scope

    openQuestions: []

  - id: FR-CAB-005
    title: Workflow overflow menu rows ('Archive [workflow type]', 'Copy [workflow type]')

    designEvidence:
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - contextActionBarOverflowTrigger
      - contextActionBarOverflowMenu
      - contextActionBarOverflowItemArchiveWorkflow
      - contextActionBarOverflowItemCopyWorkflow

    preconditions:
      - FR-CAB-004 preconditions hold

    trigger:
      - actor clicks contextActionBarOverflowTrigger per roleBehavior

    mainFlow:
      - actor clicks contextActionBarOverflowTrigger per roleBehavior to open contextActionBarOverflowMenu
      - contextActionBarOverflowMenu lists contextActionBarOverflowItemArchiveWorkflow labeled matching the 'Archive [workflow type]' template after substituting the current workflow's user-visible type label for '[workflow type]'
      - contextActionBarOverflowMenu lists contextActionBarOverflowItemCopyWorkflow labeled matching the 'Copy [workflow type]' template after substituting the current workflow's user-visible type label for '[workflow type]'
      - contextActionBarOverflowItemArchiveWorkflow and contextActionBarOverflowItemCopyWorkflow actionability per roleBehavior below; archiving a workflow is owner-only
      - no additional overflow rows exist in this product scope beyond those two
      - when actor clicks contextActionBarOverflowItemArchiveWorkflow per roleBehavior, post-click behaviour is specified in workflow_archive_requirements_v1.yaml (FR-WF-ARCH-001 onward)
      - when actor clicks contextActionBarOverflowItemCopyWorkflow per roleBehavior, post-click behaviour is specified in workflow_copy_requirements_v1.yaml (FR-WF-COPY-001 onward)

    roleBehavior:
      owner:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: available
        contextActionBarOverflowItemCopyWorkflow: available
      editor:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: readOnly
        contextActionBarOverflowItemCopyWorkflow: available
      viewer:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: readOnly
        contextActionBarOverflowItemCopyWorkflow: available
      commenter:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: readOnly
        contextActionBarOverflowItemCopyWorkflow: available
      user:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: readOnly
        contextActionBarOverflowItemCopyWorkflow: available

    acceptanceCriteria:
      - given FR-CAB-005 preconditions hold and actor clicks contextActionBarOverflowTrigger per roleBehavior, contextActionBarOverflowMenu opens and shows exactly two rows with labels matching the 'Archive [workflow type]' and 'Copy [workflow type]' templates after substituting the current workflow's user-visible type label for '[workflow type]', in that top-to-bottom order
      - contextActionBarOverflowItemArchiveWorkflow and contextActionBarOverflowItemCopyWorkflow actionability per roleBehavior; archiving a workflow is owner-only

    openQuestions: []

  - id: FR-CAB-006
    title: Workflow 'View settings' on contextActionBar (visibility by sub-view)

    designEvidence:
      - FIGMA-CAB-WF-OVERVIEW
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - workflowViewSettingsTrigger
      - workflowViewSettingsMenu
      - workflowViewSettingsMenuItemExpandAllSections
      - workflowViewSettingsMenuItemCollapseAllSections
      - workflowViewSettingsMenuItemExpandAllOutcomes
      - workflowViewSettingsMenuItemCollapseAllOutcomes
      - workflowViewSettingsMenuTagsSection

    preconditions:
      - FR-CAB-004 preconditions hold

    trigger:
      - actor clicks workflowViewSettingsTrigger per roleBehavior when that control is visible
      - actor clicks a row in workflowViewSettingsMenu when that row is visible for the active workflow sub-view

    mainFlow:
      - when active workflow sub-view is 'Overview', workflowViewSettingsTrigger is not shown on contextActionBar
      - when active workflow sub-view is 'Workflow' or 'Outcomes', workflowViewSettingsTrigger is visible on contextActionBar and opens workflowViewSettingsMenu when clicked per roleBehavior
      - all rows visible in workflowViewSettingsMenu for the active workflow sub-view are actionable when shown
      - when active workflow sub-view is 'Workflow' and workflowViewSettingsMenu is open, workflowViewSettingsMenu always shows workflowViewSettingsMenuItemExpandAllSections ('Expand all sections') and workflowViewSettingsMenuItemCollapseAllSections ('Collapse all sections'); when parent project has at least one tag per tests/docs/requirements/original/project_overview_requirements_v1.yaml FR-PROJ-OV-005 and at least one workflowNode in the current workflow has a tag assigned via workflowEditNodeFormTagsAutocomplete per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml, workflowViewSettingsMenu also shows workflowViewSettingsMenuTagsSection; otherwise workflowViewSettingsMenuTagsSection is not shown; workflowViewSettingsMenu does not show workflowViewSettingsMenuItemExpandAllOutcomes or workflowViewSettingsMenuItemCollapseAllOutcomes
      - when active workflow sub-view is 'Outcomes' and workflowViewSettingsMenu is open, workflowViewSettingsMenu always shows workflowViewSettingsMenuItemExpandAllOutcomes ('Expand all outcomes') and workflowViewSettingsMenuItemCollapseAllOutcomes ('Collapse all outcomes'); when parent project has at least one tag per FR-PROJ-OV-005 and at least one workflowOutcome in the current workflow has a tag assigned via workflowEditOutcomeFormTagsAutocomplete per tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml, workflowViewSettingsMenu also shows workflowViewSettingsMenuTagsSection; otherwise workflowViewSettingsMenuTagsSection is not shown; workflowViewSettingsMenu does not show workflowViewSettingsMenuItemExpandAllSections or workflowViewSettingsMenuItemCollapseAllSections
      - workflowViewSettingsMenuItemExpandAllSections, workflowViewSettingsMenuItemCollapseAllSections, workflowViewSettingsMenuItemExpandAllOutcomes, and workflowViewSettingsMenuItemCollapseAllOutcomes are discrete selectable menu rows (not switch toggles); legacy archive expand/collapse node rows and 'Show Legend' are not in product scope
      - clicking workflowViewSettingsMenuItemExpandAllSections expands all workflowSectionContainer entries in workflowView per FR-SEC-012 in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml; clicking workflowViewSettingsMenuItemCollapseAllSections collapses all workflowSectionContainer entries in workflowView per FR-SEC-012
      - clicking workflowViewSettingsMenuItemExpandAllOutcomes expands all workflowOutcome entries in workflowOutcomeView per tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml; clicking workflowViewSettingsMenuItemCollapseAllOutcomes collapses all workflowOutcome entries in workflowOutcomeView
      - when workflowViewSettingsMenuTagsSection is shown, it lists project tags from the parent project's tag catalog per FR-PROJ-OV-005 that are assigned to at least one workflowNode (Workflow sub-view) or workflowOutcome (Outcomes sub-view) in the current workflow; each listed tag has an on/off toggle — on the Workflow sub-view, turning a tag off hides workflowNode entries carrying that tag from workflowView; on the Outcomes sub-view, turning a tag off hides workflowOutcome entries carrying that tag from workflowOutcomeView; workflowNode or workflowOutcome entries with no tags assigned remain visible regardless of toggle state; when an entry carries multiple tags, it is hidden if any assigned tag matches a toggled-off tag; tag on/off toggle state in workflowViewSettingsMenuTagsSection is session-scoped only and is not persisted — refreshing the page or reopening the workflow resets all tag toggles to on (show all tagged entries)
      - when tag T is deleted from the project tag catalog per FR-PROJ-OV-005, T is not listed in workflowViewSettingsMenuTagsSection the next time the actor opens View settings on the Workflow or Outcomes sub-view

    roleBehavior:
      owner:
        workflowViewSettingsTrigger: available
      editor:
        workflowViewSettingsTrigger: available
      viewer:
        workflowViewSettingsTrigger: available
      commenter:
        workflowViewSettingsTrigger: available
      user:
        workflowViewSettingsTrigger: available

    acceptanceCriteria:
      - given workflow sub-view is 'Overview', workflowViewSettingsTrigger is not visible
      - given FR-CAB-006 preconditions hold and workflow sub-view is 'Workflow' or 'Outcomes', workflowViewSettingsTrigger is visible and clicking it opens workflowViewSettingsMenu
      - given workflow sub-view is 'Workflow' and workflowViewSettingsMenu is open, parent project has at least one tag per FR-PROJ-OV-005, and at least one workflowNode in the current workflow has a tag assigned via workflowEditNodeFormTagsAutocomplete, menu shows exactly three areas in order — 'Expand all sections', 'Collapse all sections', and workflowViewSettingsMenuTagsSection — and does not show 'Expand all outcomes' or 'Collapse all outcomes'
      - given workflow sub-view is 'Workflow' and workflowViewSettingsMenu is open, and either parent project has no tags per FR-PROJ-OV-005 or no workflowNode in the current workflow has a tag assigned via workflowEditNodeFormTagsAutocomplete, workflowViewSettingsMenuTagsSection is not shown and menu shows exactly two areas — 'Expand all sections' and 'Collapse all sections'
      - given workflow sub-view is 'Outcomes' and workflowViewSettingsMenu is open, parent project has at least one tag per FR-PROJ-OV-005, and at least one workflowOutcome in the current workflow has a tag assigned via workflowEditOutcomeFormTagsAutocomplete, menu shows exactly three areas in order — 'Expand all outcomes', 'Collapse all outcomes', and workflowViewSettingsMenuTagsSection — and does not show 'Expand all sections' or 'Collapse all sections'
      - given workflow sub-view is 'Outcomes' and workflowViewSettingsMenu is open, and either parent project has no tags per FR-PROJ-OV-005 or no workflowOutcome in the current workflow has a tag assigned via workflowEditOutcomeFormTagsAutocomplete, workflowViewSettingsMenuTagsSection is not shown and menu shows exactly two areas — 'Expand all outcomes' and 'Collapse all outcomes'
      - given actor turned a tag off in workflowViewSettingsMenuTagsSection, when the page is refreshed or the workflow is reopened, that tag toggle is on again and entries carrying that tag are visible per the filter rules above
      - given workflow sub-view is 'Workflow' and workflowNode N has no tags assigned via workflowEditNodeFormTagsAutocomplete, when actor toggles one or more tags off in workflowViewSettingsMenuTagsSection, N remains visible in workflowView
      - given workflow sub-view is 'Outcomes' and workflowOutcome O has no tags assigned via workflowEditOutcomeFormTagsAutocomplete, when actor toggles one or more tags off in workflowViewSettingsMenuTagsSection, O remains visible in workflowOutcomeView
      - given workflow sub-view is 'Workflow' and workflowNode N carries tags {T1, T2, …} via workflowEditNodeFormTagsAutocomplete, when actor toggles T1 off in workflowViewSettingsMenuTagsSection, N is hidden from workflowView; when T1 is toggled back on and no other tag assigned to N matches a toggled-off tag, N is visible again in workflowView
      - given workflow sub-view is 'Outcomes' and level-1 workflowOutcome O carries tags {T1, T2, …} via workflowEditOutcomeFormTagsAutocomplete, when actor toggles T1 off in workflowViewSettingsMenuTagsSection, O is hidden from workflowOutcomeView; when T1 is toggled back on and no other tag assigned to O matches a toggled-off tag, O is visible again in workflowOutcomeView
      - given workflowViewSettingsMenuTagsSection previously listed tag T and owner or editor deletes T from projectTagsSection per FR-PROJ-OV-005, when actor opens View settings on the Workflow or Outcomes sub-view, T is not shown in workflowViewSettingsMenuTagsSection

    openQuestions: []

  - id: FR-CAB-007
    title: Workflow 'Jump to' on contextActionBar scrolls to selected section

    designEvidence:
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - workflowJumpToTrigger
      - workflowJumpToMenu
      - workflowJumpToMenuSectionItem
      - workflowSectionContainer

    preconditions:
      - FR-CAB-004 preconditions hold
      - active workflow sub-view is 'Workflow'
      - workflowView contains at least one workflowSectionContainer

    trigger:
      - actor clicks workflowJumpToTrigger per roleBehavior, then clicks workflowJumpToMenuSectionItem

    mainFlow:
      - workflowJumpToTrigger is visible on contextActionBar with label 'Jump to'
      - clicking workflowJumpToTrigger per roleBehavior opens workflowJumpToMenu
      - workflowJumpToMenu lists every workflowSectionContainer in workflowView as a workflowJumpToMenuSectionItem row
      - clicking a workflowJumpToMenuSectionItem scrolls the viewport to the matching workflowSectionContainer in workflowView

    roleBehavior:
      user:
        workflowJumpToTrigger: available
      owner:
        workflowJumpToTrigger: available
      editor:
        workflowJumpToTrigger: available
      viewer:
        workflowJumpToTrigger: available
      commenter:
        workflowJumpToTrigger: available

    acceptanceCriteria:
      - given FR-CAB-007 preconditions hold, workflowJumpToTrigger is visible on contextActionBar with label 'Jump to'
      - given actor clicks workflowJumpToTrigger per roleBehavior, workflowJumpToMenu opens
      - given workflowJumpToMenu is open, every workflowSectionContainer in workflowView is listed as a selectable workflowJumpToMenuSectionItem row
      - given actor clicks a workflowJumpToMenuSectionItem, viewport scroll position moves to that corresponding workflowSectionContainer

    openQuestions: []

