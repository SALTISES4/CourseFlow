# Normalized requirements: context action bar (project and workflow routes)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Contributors; Archiving a Project; Archiving a Workflow; View Settings / action bar)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/original/project_create_edit_form_requirements_v1.yaml (editPencilButton, editProjectDialog on project routes—FR-PROJ-FORM-003)
#   - tests/docs/requirements/original/workflow_edit_form_requirements_v1.yaml (editPencilButton, editWorkflowDialog on workflow routes—FR-WF-FORM-001)
#   - tests/docs/requirements/original/project_overview_requirements_v1.yaml (projectMetadataAddContributorsButton; addContributorsDialog—FR-PROJ-OV-004; contributor list outcomes—FR-PROJ-OV-002)
#   - tests/docs/requirements/original/project_archive_requirements_v1.yaml (FR-PROJ-ARCH-* after 'Archive project' overflow row)
#   - tests/docs/requirements/original/workflow_archive_requirements_v1.yaml (FR-WF-ARCH-* after 'Archive workflow' overflow row)
#   - tests/docs/requirements/original/workflow_copy_requirements_v1.yaml (FR-WF-COPY-* after 'Copy workflow' overflow row)

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  contextActionBar:
    meaning: Contextual action bar below top navigation on project and workflow routes.
  editPencilButton:
    meaning: Pencil edit control on contextActionBar for project and workflow routes.
  contextActionBarAddContributorsButton:
    meaning: Add CourseFlow user button on contextActionBar for project routes.
  contextActionBarOverflowTrigger:
    meaning: Overflow menu trigger on contextActionBar.
  contextActionBarOverflowMenu:
    meaning: Menu surface opened from contextActionBarOverflowTrigger
  contextActionBarOverflowItemArchiveProject:
    meaning: Archive project row in contextActionBarOverflowMenu.
  contextActionBarOverflowItemArchiveWorkflow:
    meaning: Archive workflow row in contextActionBarOverflowMenu.
  contextActionBarOverflowItemCopyWorkflow:
    meaning: Copy workflow row in contextActionBarOverflowMenu.
  workflowViewSettingsTrigger:
    meaning: View settings control on contextActionBar for workflow routes.
  workflowViewSettingsMenu:
    meaning: Menu opened from workflowViewSettingsTrigger
  workflowJumpToTrigger:
    meaning: Jump to control on contextActionBar on the Workflow sub-view.
  workflowJumpToMenu:
    meaning: Dropdown menu listing workflow sections from workflowJumpToTrigger.
  workflowJumpToMenuSectionItem:
    meaning: A section row inside workflowJumpToMenu

