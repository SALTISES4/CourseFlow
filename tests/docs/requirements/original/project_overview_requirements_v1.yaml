# Normalized requirements: project overview screen (contributors, publish state, tags)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Project section: Contributors, Tags, Published Projects, Overview)
# Application code evidence: react/src/components/pages/Workspace/Project/index.tsx; react/src/components/pages/Workspace/Project/components/menuBar/menus.tsx; react/src/components/common/dialog/Workspace/ContributorAddDialog/index.tsx; react/src/components/views/ProjectView/TabOverview/index.tsx; react/src/components/views/ProjectView/TabOverview/TagsSection/*
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/explore_page_requirements_v1.yaml (published project visibility in Explore); tests/docs/requirements/original/context_action_bar_requirements_v1.yaml (contextActionBarAddContributorsButton on project routes—FR-CAB-002; distinct from projectMetadataAddContributorsButton here; both open addContributorsDialog); tests/docs/requirements/original/project_header_requirements_v1.yaml (project top section: title, favourite toggle, and tab selector across project sub-views); tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-001)

documentPreconditions:
  - user is authenticated to CourseFlow
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the project at route '/project/{id}', or (b) user (published-access, no explicit contributor role) viewing a project that is published
  - requirements in this file assume the above hold; when they do not, assert per tests/docs/requirements/original/workspace_access_requirements_v1.yaml FR-WS-ACCESS-001

uiObjectDefinitions:
  projectOverviewView:
    meaning: Project Overview view at /project/{id} for metadata, contributors, and publish controls.
  projectMetadataFieldDescription:
    meaning: Description block on projectOverviewView.
  projectMetadataFieldDisciplines:
    meaning: Overview metadata block labeled 'Disciplines' showing project disciplines.
  projectMetadataPermissionsPanel:
    meaning: Contributors and permissions panel on projectOverviewView.
  contributorRoleDropdown:
    meaning: Role dropdown on a contributor row in projectMetadataPermissionsPanel.
  projectMetadataAddContributorsButton:
    meaning: Add CourseFlow user button in the project Overview permissions area.
  contextActionBarAddContributorsButton:
    meaning: Canonical definition in tests/docs/requirements/original/context_action_bar_requirements_v1.yaml.
  addContributorsDialog:
    meaning: Modal dialog for adding contributors to a project.
  addContributorsUserSelector:
    meaning: CourseFlow Users autocomplete on addContributorsDialog.
  addContributorsUserSelectorClearButton:
    meaning: Icon-only clear ('X') control on addContributorsUserSelector that removes the current typed input.
  addContributorsRoleSelector:
    meaning: Role selector on addContributorsDialog.
  addContributorsSubmitButton:
    meaning: Primary action in addContributorsDialog that confirms adding selected users with assigned role(s).
  addContributorsCancelButton:
    meaning: Cancel action on addContributorsDialog.
  publishProjectButton:
    meaning: Publish project control on projectOverviewView.
  unpublishProjectButton:
    meaning: Unpublish project control on projectOverviewView.
  projectVisibilityStateMessage:
    meaning: Read-only project visibility status message on projectOverviewView.
  projectTagsSection:
    meaning: Overview block labeled 'Tags' where tags are displayed and managed.
  projectTagItem:
    meaning: Existing tag row/chip in projectTagsSection with editable label and delete action.
  addNewTagInput:
    meaning: Create affordance in projectTagsSection with placeholder 'Add new tag' used to add a new tag.
  editTagInput:
    meaning: Inline editable text input for renaming an existing projectTagItem.
  deleteTagButton:
    meaning: Icon control on projectTagItem used to remove that tag.

locatorMappings:
  projectOverviewView:
    strategy: "URL route pattern '/project/{id}' with overview view active"
    confidence: inferred
  projectMetadataFieldDescription:
    strategy: "{projectOverviewView} info block title 'Description'"
    confidence: inferred
  projectMetadataFieldDisciplines:
    strategy: "{projectOverviewView} info block title 'Disciplines'"
    confidence: inferred
  projectMetadataPermissionsPanel:
    strategy: "{projectOverviewView} info block title 'Permissions'"
    confidence: inferred
  contributorRoleDropdown:
    strategy: "{projectMetadataPermissionsPanel} role dropdown on a contributor entry with selectable roles and remove action"
    confidence: inferred
  projectMetadataAddContributorsButton:
    strategy: "{projectMetadataPermissionsPanel} control with label 'Add CourseFlow user' opening the same addContributorsDialog as contextActionBarAddContributorsButton"
    confidence: inferred
  contextActionBarAddContributorsButton:
    strategy: null
    confidence: unresolved
  addContributorsDialog:
    strategy: "Dialog with title 'Add contributor' from ContributorAddDialog"
    confidence: inferred
  addContributorsUserSelector:
    strategy: "{addContributorsDialog} 'CourseFlow Users' autocomplete control for selecting existing contributor account(s) with live narrowed results while typing"
    confidence: inferred
  addContributorsUserSelectorClearButton:
    strategy: "{addContributorsUserSelector} icon-only clear control ('X') shown when input is non-empty"
    confidence: inferred
  addContributorsRoleSelector:
    strategy: "{addContributorsDialog} role selector with assignable options 'Editor', 'Commenter', 'Viewer'"
    confidence: inferred
  addContributorsSubmitButton:
    strategy: "{addContributorsDialog} primary action button for confirming contributor addition"
    confidence: inferred
  addContributorsCancelButton:
    strategy: "{addContributorsDialog} secondary action button for cancelling and closing dialog"
    confidence: inferred
  publishProjectButton:
    strategy: null
    confidence: unresolved
  unpublishProjectButton:
    strategy: null
    confidence: unresolved
  projectVisibilityStateMessage:
    strategy: "{projectOverviewView} visibility-state text adjacent to publishProjectButton or unpublishProjectButton"
    confidence: inferred
  projectTagsSection:
    strategy: "{projectOverviewView} info block title 'Tags'"
    confidence: inferred
  projectTagItem:
    strategy: "{projectTagsSection} tag row with LocalOfferOutlined icon and editable input"
    confidence: inferred
  addNewTagInput:
    strategy: "{projectTagsSection} create tag input placeholder 'Add new tag'"
    confidence: inferred
  editTagInput:
    strategy: "{projectTagItem} inline text input"
    confidence: inferred
  deleteTagButton:
    strategy: "{projectTagItem} icon button with Close icon"
    confidence: inferred

requirements:
  - id: FR-PROJ-OV-001
    title: Project overview route and metadata blocks

    designEvidence:
      - FIGMA-PROJ-OV-UNPUBLISHED-WITH-TAGS
      - FIGMA-PROJ-OV-PUBLISHED-NO-TAGS
      - FIGMA-PROJ-OV-ADD-CONTRIBUTOR-DIALOG

    actors:
      - user
      - owner
      - editor
      - viewer
      - commenter

    uiObjects:
      - projectOverviewView
      - projectMetadataFieldDescription
      - projectMetadataFieldDisciplines
      - projectMetadataPermissionsPanel
      - projectTagsSection

    preconditions:
      - documentPreconditions for this file hold
      - user navigates to project 'Overview' view at route '/project/{id}'

    trigger:
      - user navigates to project 'Overview' view at route '/project/{id}'

    mainFlow:
      - system renders projectOverviewView at route '/project/{id}'
      - projectOverviewView displays projectMetadataFieldDescription, projectMetadataFieldDisciplines, projectMetadataPermissionsPanel, and projectTagsSection
      - projectMetadataFieldDescription always shows label 'Description'; when description is empty, displayed value is '-'
      - projectMetadataFieldDescription content is plain text only (no rich-text formatting) and has no maximum length limit
      - disciplines in projectMetadataFieldDisciplines are sorted from A-Z and shown as comma-separated values
      - project top section behavior (title, favourite toggle, tab selector, and sub-view switching) is defined in tests/docs/requirements/original/project_header_requirements_v1.yaml

    roleBehavior: {}

    acceptanceCriteria:
      - given documentPreconditions hold and user opens '/project/{id}', projectOverviewView is visible
      - given actor is user (published-access) per documentPreconditions, projectOverviewView is visible in read-only mode
      - given projectOverviewView is visible, projectMetadataFieldDescription label 'Description' is visible
      - given project description has a value, projectMetadataFieldDescription shows that value
      - given project description is empty, projectMetadataFieldDescription shows '-'
      - projectMetadataFieldDescription accepts plain text only (no rich-text formatting controls)
      - project description has no maximum length limit
      - given project has disciplines, projectMetadataFieldDisciplines displays disciplines sorted A-Z as comma-separated values
      - projectMetadataPermissionsPanel is visible
      - projectTagsSection is visible

    openQuestions: []

  - id: FR-PROJ-OV-002
    title: Add and manage contributors action

    designEvidence:
      - FIGMA-PROJ-OV-UNPUBLISHED-WITH-TAGS
      - FIGMA-PROJ-OV-PUBLISHED-NO-TAGS
      - FIGMA-PROJ-OV-EDIT-TAG

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - projectOverviewView
      - projectMetadataPermissionsPanel
      - projectMetadataAddContributorsButton
      - contextActionBarAddContributorsButton
      - addContributorsDialog
      - contributorRoleDropdown

    preconditions:
      - user has Owner, Editor, Viewer, or Commenter role on the project
      - for projectMetadataAddContributorsButton and contributorRoleDropdown flows, projectOverviewView is visible at '/project/{id}'
      - for contextActionBarAddContributorsButton flows, current route is a project route per context_action_bar_requirements_v1.yaml FR-CAB-001

    trigger:
      - user clicks projectMetadataAddContributorsButton or contextActionBarAddContributorsButton, or changes/removes an existing contributor via contributorRoleDropdown when projectMetadataPermissionsPanel is visible

    mainFlow:
      - projectMetadataAddContributorsButton is the permissions-context entry point on projectOverviewView with label 'Add CourseFlow user'; contextActionBarAddContributorsButton is the separate contextActionBar entry point with the same label (FR-CAB-002); both are distinct controls and both open addContributorsDialog when Owner or Editor clicks either control
      - Viewer and Commenter see both entry points read-only where each is rendered (addContributorsDialog does not open on click attempt)
      - addContributorsDialog allows selecting CourseFlow users and assigning a project role
      - projectMetadataPermissionsPanel lists current contributors and their roles
      - owner or editor may use contributorRoleDropdown on an existing contributor to select a different role among 'Editor', 'Commenter', and 'Viewer'
      - contributorRoleDropdown includes a 'Remove contributor' action to remove a contributor from projectMetadataPermissionsPanel
      - contributorRoleDropdown does not offer an 'Owner' assignment; project ownership cannot be transferred from this control
      - for viewer, commenter, or user (published-access, no explicit project role), contributor roles remain visible in projectMetadataPermissionsPanel but contributorRoleDropdown is read-only and not actionable
      - when contributor is added at project level, child workflows inherit project contributors and roles by default
      - workflow-level contributor modifications are not allowed
      - adding contributor results in project appearing in that contributor's 'My library' and role permissions applying per project permissions matrix

    roleBehavior:
      owner:
        projectMetadataAddContributorsButton: available
        contextActionBarAddContributorsButton: available
        contributorRoleDropdown: available
      editor:
        projectMetadataAddContributorsButton: available
        contextActionBarAddContributorsButton: available
        contributorRoleDropdown: available
      viewer:
        projectMetadataAddContributorsButton: readOnly
        contextActionBarAddContributorsButton: readOnly
        contributorRoleDropdown: readOnly
      commenter:
        projectMetadataAddContributorsButton: readOnly
        contextActionBarAddContributorsButton: readOnly
        contributorRoleDropdown: readOnly
      user:
        projectMetadataAddContributorsButton: readOnly
        contextActionBarAddContributorsButton: readOnly
        contributorRoleDropdown: readOnly

    acceptanceCriteria:
      - given projectOverviewView at '/project/{id}', projectMetadataAddContributorsButton is visible with label 'Add CourseFlow user' in the permissions context for Owner, Editor, Viewer, and Commenter when that block is shown
      - given a project route per FR-CAB-002, contextActionBarAddContributorsButton is visible with label 'Add CourseFlow user' on contextActionBar for Owner, Editor, Viewer, and Commenter
      - given owner or editor clicks projectMetadataAddContributorsButton or contextActionBarAddContributorsButton, addContributorsDialog opens
      - given viewer or commenter, each visible entry point (projectMetadataAddContributorsButton and/or contextActionBarAddContributorsButton) is read-only and addContributorsDialog does not open when user attempts to click that control
      - given owner or editor adds a contributor with role X in addContributorsDialog, projectMetadataPermissionsPanel shows that contributor with role X
      - given owner or editor opens contributorRoleDropdown, available options are exactly 'Editor', 'Commenter', 'Viewer', and 'Remove contributor'
      - given owner or editor changes a contributor role via contributorRoleDropdown, selected role must be one of 'Editor', 'Commenter', or 'Viewer' and projectMetadataPermissionsPanel updates to that selected role
      - given owner or editor uses remove action in contributorRoleDropdown, that contributor no longer appears in projectMetadataPermissionsPanel
      - given viewer or commenter, projectMetadataPermissionsPanel shows contributor roles and contributorRoleDropdown is read-only
      - given actor is user (published-access) per documentPreconditions, projectMetadataPermissionsPanel shows contributor roles and contributorRoleDropdown is read-only
      - given contributor is added at project level, child workflow access reflects inherited project contributor role

    openQuestions:
      - Current `ContributorAddDialog` active implementation is marked TODO and submit path logs local state; confirm authoritative implementation behavior for persistence and post-submit UI state.

  - id: FR-PROJ-OV-003
    title: Publish and unpublish controls on project overview

    designEvidence:
      - FIGMA-PROJ-OV-UNPUBLISHED-WITH-TAGS
      - FIGMA-PROJ-OV-PUBLISHED-NO-TAGS

    actors:
      - owner
      - editor

    uiObjects:
      - projectOverviewView
      - publishProjectButton
      - unpublishProjectButton
      - projectVisibilityStateMessage

    preconditions:
      - projectOverviewView is visible
      - user has owner or editor role on the project

    trigger:
      - user clicks publishProjectButton or unpublishProjectButton

    mainFlow:
      - "projectVisibilityStateMessage is always visible and reflects current state with exact copy: 'The project is currently private' when unpublished, and 'The project is currently public' when published"
      - when project is unpublished, projectOverviewView presents publishProjectButton to owner and editor roles
      - when owner or editor clicks publishProjectButton, project visibility transitions to published
      - when project is published, projectOverviewView presents unpublishProjectButton to owner and editor roles
      - when owner or editor clicks unpublishProjectButton, project visibility transitions to unpublished
      - project publish state applies at project level and child workflows inherit the same visibility state per source requirement
      - published project and child workflows are visible in Explore to logged-in users with read-only access; unpublished state hides project/workflows from non-contributors

    roleBehavior:
      owner:
        publishProjectButton: availableWhenUnpublished
        unpublishProjectButton: availableWhenPublished
      editor:
        publishProjectButton: availableWhenUnpublished
        unpublishProjectButton: availableWhenPublished
      viewer:
        publishProjectButton: notAvailable
        unpublishProjectButton: notAvailable
        projectVisibilityStateMessage: visibleReadOnly
      commenter:
        publishProjectButton: notAvailable
        unpublishProjectButton: notAvailable
        projectVisibilityStateMessage: visibleReadOnly

    acceptanceCriteria:
      - given unpublished project, projectVisibilityStateMessage is visible with copy 'The project is currently private'
      - given unpublished project as owner or editor, publishProjectButton is visible
      - given published project, projectVisibilityStateMessage is visible with copy 'The project is currently public'
      - given owner or editor clicks publishProjectButton, project state becomes published and child workflows inherit published visibility
      - given published project as owner or editor, unpublishProjectButton is visible
      - given owner or editor clicks unpublishProjectButton, project state becomes unpublished and child workflows inherit unpublished visibility
      - given viewer or commenter, projectVisibilityStateMessage is visible and publishProjectButton/unpublishProjectButton are not visible

    openQuestions:
      - Current project overview code does not expose explicit publish/unpublish controls or locator candidates; confirm implementation location and canonical identifiers for publishProjectButton and unpublishProjectButton.
      - Confirm whether publish/unpublish transitions are immediate or require confirmation dialog in this screen.

  - id: FR-PROJ-OV-004
    title: addContributorsDialog interaction and outcomes

    designEvidence:
      - FIGMA-PROJ-OV-ADD-CONTRIBUTOR-DIALOG

    actors:
      - owner
      - editor

    uiObjects:
      - projectOverviewView
      - projectMetadataAddContributorsButton
      - contextActionBarAddContributorsButton
      - addContributorsDialog
      - addContributorsUserSelector
      - addContributorsUserSelectorClearButton
      - addContributorsRoleSelector
      - addContributorsSubmitButton
      - addContributorsCancelButton
      - projectMetadataPermissionsPanel

    preconditions:
      - user has Owner or Editor role on the project
      - projectMetadataAddContributorsButton is visible on projectOverviewView at '/project/{id}', or contextActionBarAddContributorsButton is visible on a project route per FR-CAB-002

    trigger:
      - user opens addContributorsDialog by clicking projectMetadataAddContributorsButton or contextActionBarAddContributorsButton

    mainFlow:
      - clicking projectMetadataAddContributorsButton or contextActionBarAddContributorsButton opens the same addContributorsDialog
      - addContributorsDialog presents addContributorsUserSelector and addContributorsRoleSelector
      - addContributorsUserSelector is an autocomplete on existing CourseFlow users; when user types, narrowed matching results are displayed automatically
      - addContributorsUserSelectorClearButton clears typed input in addContributorsUserSelector
      - addContributorsRoleSelector allows assignable roles 'Editor', 'Commenter', and 'Viewer' only
      - when no user is selected in addContributorsUserSelector, addContributorsSubmitButton ('Add contributor') is read-only and not actionable
      - clicking addContributorsSubmitButton with a valid selection adds selected contributor(s) and updates projectMetadataPermissionsPanel
      - clicking addContributorsCancelButton closes addContributorsDialog without applying changes

    roleBehavior:
      owner:
        addContributorsDialog: available
      editor:
        addContributorsDialog: available
      viewer:
        addContributorsDialog: notAvailable
      commenter:
        addContributorsDialog: notAvailable

    acceptanceCriteria:
      - given owner or editor clicks projectMetadataAddContributorsButton or contextActionBarAddContributorsButton, addContributorsDialog is visible
      - addContributorsDialog shows addContributorsUserSelector and addContributorsRoleSelector
      - given user types in addContributorsUserSelector, narrowed matching CourseFlow users are displayed automatically
      - given addContributorsUserSelector has typed input, addContributorsUserSelectorClearButton is visible; clicking it clears the input
      - given role selector is opened in addContributorsDialog, assignable options are 'Editor', 'Commenter', and 'Viewer'
      - given no user is selected in addContributorsUserSelector, addContributorsSubmitButton ('Add contributor') is read-only
      - given owner or editor submits addContributorsDialog with valid user and role selection, projectMetadataPermissionsPanel reflects the added contributor assignment
      - given owner or editor clicks addContributorsCancelButton, addContributorsDialog closes and no contributor change is applied

    openQuestions: []

  - id: FR-PROJ-OV-005
    title: Tags system on project overview (create, edit, delete)

    designEvidence:
      - FIGMA-PROJ-OV-UNPUBLISHED-WITH-TAGS
      - FIGMA-PROJ-OV-EDIT-TAG
      - FIGMA-PROJ-OV-PUBLISHED-NO-TAGS
      - FIGMA-PROJ-OV-TAGS-READONLY

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - projectOverviewView
      - projectTagsSection
      - projectTagItem
      - addNewTagInput
      - editTagInput
      - deleteTagButton

    preconditions:
      - projectOverviewView is visible

    trigger:
      - user creates, edits, or deletes tags in projectTagsSection

    mainFlow:
      - projectTagsSection displays existing projectTagItem entries
      - for owner and editor, addNewTagInput with placeholder 'Add new tag' allows creating a new tag
      - for owner and editor, editTagInput allows inline editing of existing tag labels
      - for owner and editor, deleteTagButton removes tag from visible tag list
      - for viewer, commenter, or user (published-access) per documentPreconditions, projectTagsSection remains visible but tag controls are read-only and not actionable
      - tags are ordered by most recently added

    roleBehavior:
      owner:
        addNewTagInput: available
        editTagInput: available
        deleteTagButton: available
      editor:
        addNewTagInput: available
        editTagInput: available
        deleteTagButton: available
      viewer:
        addNewTagInput: readOnly
        editTagInput: readOnly
        deleteTagButton: notAvailable
      commenter:
        addNewTagInput: readOnly
        editTagInput: readOnly
        deleteTagButton: notAvailable
      user:
        addNewTagInput: readOnly
        editTagInput: readOnly
        deleteTagButton: notAvailable

    acceptanceCriteria:
      - given owner or editor enters a value in addNewTagInput and commits, a new projectTagItem is shown
      - given owner or editor edits a tag label and commits, projectTagItem reflects the new label
      - given owner or editor clicks deleteTagButton for a tag, that projectTagItem is removed from the list
      - given viewer, commenter, or user per documentPreconditions, projectTagsSection is visible and tag controls are read-only
      - tags are displayed in most-recently-added order

    openQuestions:
      - Current `TagsSection` implementation updates local component state only and does not show persisted project tag mutation calls in this path; confirm authoritative persistence contract for create/edit/delete in project overview.
      - Source requirement says tags apply for filtering nodes and outcomes; confirm whether this file should cross-reference specific normalized requirements for workflow view settings and outcomes view tag filtering.

