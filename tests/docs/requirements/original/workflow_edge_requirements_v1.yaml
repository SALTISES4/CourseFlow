  workflowNode:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowEdge:
    meaning: Directed canvas link between two workflowNodes with optional title, dashed style, and text-position metadata.
  workflowEdgeTitleLabel:
    meaning: Title label rendered along the path of a workflowEdge in workflowView.
  workflowNodeEdgeHandles:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml.
  workflowNodeEdgeHandleTop:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml.
  workflowNodeEdgeHandleRight:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml.
  workflowNodeEdgeHandleBottom:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml.
  workflowNodeEdgeHandleLeft:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml.
  workflowEdgeSourceReconnectHandle:
    meaning: Draggable reconnect affordance on the source end of a selected workflowEdge.
  workflowEdgeTargetReconnectHandle:
    meaning: Draggable reconnect affordance on the target end of a selected workflowEdge.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTab:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTabContent:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarAddTab:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarCommentsTab:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowEditEdgeForm:
    meaning: Right-sidebar edit form for the selected workflowEdge's title and dashed-line metadata.
  workflowEditEdgeFormHeading:
    meaning: Heading on workflowEditEdgeForm with text 'Edit node link'.
  workflowEditEdgeFormTitleField:
    meaning: Title text field on workflowEditEdgeForm.
  workflowEditEdgeFormDashedLineToggle:
    meaning: Dashed line toggle on workflowEditEdgeForm.
  workflowEditEdgeFormDeleteButton:
    meaning: Delete button on workflowEditEdgeForm.

