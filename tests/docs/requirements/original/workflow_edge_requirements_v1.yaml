# Normalized requirements: create, delete, reconnect, select, and canvas presentation of workflowEdges in Workflow view ('Workflow' sub-view)
# Application code evidence: react/src/components/views/WorkflowView/WorkflowEditView/components/LineSVG/* (Connection, DrawPreview, Handles); react/src/redux/slices/svglink.slice.ts; react/src/redux/slices/nodelink.slice.ts; react/src/components/pages/Workspace/Workflow/Sidebar/components/EditTab/components/EditNodelink/index.tsx
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml (workflowView canonical); tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (workflowNodeEdgeHandles — FR-WF-NODE-006); tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar, workflowRightSidebarEditTab — FR-WF-RS-001, FR-WF-RS-002, FR-WF-RS-004); tests/docs/requirements/original/workflow_move_node_requirements_v1.yaml (workflowEdge identity/metadata preservation on move — FR-WF-MV-005; path re-routing after move — FR-WF-EDGE-005); tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml (workflowEdge cleanup and bypass on workflowNode delete — FR-WF-DEL-004); tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml (linked-node sidebar read-only — FR-WF-EN-004, FR-WF-EN-006; node edit selection — FR-WF-EN-001); tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml (lateral channel reorder edge preservation — FR-CHAN-008); tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (section insert/delete/reorder edge integrity — FR-SEC-008, FR-SEC-009).
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/graph'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowView is open with at least two workflowNodes that can serve as edge endpoints
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

