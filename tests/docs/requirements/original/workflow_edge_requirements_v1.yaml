# Normalized requirements: create, delete, reconnect, select, and canvas presentation of workflowEdges in Workflow view ('Workflow' sub-view)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Edges — lines 973–1054; Edges Metadata — lines 975–1026)
# Application code evidence: react/src/components/views/WorkflowView/WorkflowEditView/components/LineSVG/* (Connection, DrawPreview, Handles); react/src/redux/slices/svglink.slice.ts; react/src/redux/slices/nodelink.slice.ts; react/src/components/pages/Workspace/Workflow/Sidebar/components/EditTab/components/EditNodelink/index.tsx
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml (workflowView canonical); tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (workflowNodeEdgeHandles — FR-WF-NODE-006); tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar, workflowRightSidebarEditTab — FR-WF-RS-001, FR-WF-RS-002); tests/docs/requirements/original/workflow_move_node_requirements_v1.yaml (workflowEdge preservation when workflowNodes move — FR-WF-MV-005; do not re-specify preservation rules here); tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml (workflowEdge cleanup and bypass on workflowNode delete — FR-WF-DEL-004); tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml (lateral channel reorder edge preservation — FR-CHAN-008); tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (section insert/delete/reorder edge integrity — FR-SEC-008, FR-SEC-009). Canvas layering and selection chrome for workflowEdge — FR-WF-EDGE-005.

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/workflow'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowView is open with at least two workflowNodes that can serve as edge endpoints
  - moving a workflowNode within a workflowSectionContainer or to another workflowSectionContainer preserves every workflowEdge incident on that workflowNode (same edge identities and metadata) per tests/docs/requirements/original/workflow_move_node_requirements_v1.yaml FR-WF-MV-005; this file does not restate move preservation rules

