requirements:
  - id: FR-WF-EDGE-001
    title: Create workflowEdge by dragging between workflowNode handles

    designEvidence:
      - FIGMA-WF-EDGE-EDIT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowNode
      - workflowNodeEdgeHandles
      - workflowNodeEdgeHandleTop
      - workflowNodeEdgeHandleRight
      - workflowNodeEdgeHandleBottom
      - workflowNodeEdgeHandleLeft
      - workflowEdge

    preconditions:
      - workflowView contains at least two workflowNodes
      - workflowNodeEdgeHandles is rendered on the source workflowNode per FR-WF-NODE-006

    trigger:
      - user presses pointer on a workflowNodeEdgeHandle (top, right, bottom, or left) on workflowNode S and drags toward another workflowNode
      - user releases pointer after dragging

    mainFlow:
      - while pointer is down and moving, system shows a preview line from the departure handle on workflowNode S toward the pointer position, snapping to the nearest valid arrival handle on another workflowNode when within snap threshold
      - on pointer release, when snap resolves to workflowNode T (T ≠ S) with a valid arrival handle, system creates a persisted workflowEdge from S on the departure handle to T on the snapped arrival handle and displays it in workflowView
      - self-loop workflowEdges are not permitted — source workflowNode and target workflowNode must be different identities (S ≠ T); snap and create reject release on the same workflowNode as the departure node
      - a user may create a workflowEdge from source workflowNode to target workflowNode that displays later (below) in workflowView, earlier (above), or in a different workflowSectionContainer than the source
      - a user may attach departing or arriving ends on any of the four workflowNode handles; handle choice does not allow a second workflowEdge for the same ordered source→target workflowNode pair
      - workflowEdge creation is permitted between endpoint workflowNodes that have linked workflows; sidebar read-only fields on those workflowNodes per FR-WF-EN-004 or FR-WF-EN-006 do not block creating or reconnecting workflowEdges
      - at most one workflowEdge may exist per ordered source→target workflowNode pair (same source workflowNode id and same target workflowNode id, regardless of which handles are used); attempting to create another workflowEdge for an existing pair does not add a second workflowEdge (reconnect may change handles on the single existing edge per FR-WF-EDGE-003)
      - at most 50 workflowEdges may depart from the same source workflowNode; at most 50 workflowEdges may arrive at the same target workflowNode
      - on pointer release without a valid snap target on a different workflowNode, system clears the preview line and does not create a workflowEdge
      - workflowView does not auto-scroll while the user drags to author a workflowEdge

    roleBehavior:
      owner:
        workflowNodeEdgeHandles: shownOnHoverOrSelection
      editor:
        workflowNodeEdgeHandles: shownOnHoverOrSelection
      commenter:
        workflowNodeEdgeHandles: notRendered
      viewer:
        workflowNodeEdgeHandles: notRendered
      user:
        workflowNodeEdgeHandles: notRendered

    acceptanceCriteria:
      - given owner or editor drags from a handle on workflowNode S and releases on a valid handle on workflowNode T (T ≠ S), a new workflowEdge appears connecting S → T with endpoints on the chosen handles
      - given owner or editor drags from workflowNode S and releases on a handle on the same workflowNode S, no workflowEdge is created
      - given workflowEdge A → B already exists, when owner or editor attempts to create another workflowEdge from A to B (any handle combination), no additional workflowEdge from A to B is created
      - given workflowNode N already has 50 outgoing workflowEdges, when owner or editor attempts to create another workflowEdge departing from N, the create is rejected
      - given workflowNode N already has 50 incoming workflowEdges, when owner or editor attempts to create another workflowEdge arriving at N, the create is rejected
      - given owner or editor starts a link drag from workflowNode S but releases without snapping to a different workflowNode, no new workflowEdge is persisted and the preview line is cleared
      - given two workflowNodes both with linked workflows, owner or editor may still create a workflowEdge between them
      - given actor is commenter, viewer, or user, workflowNodeEdgeHandles is not rendered and no workflowEdge can be created via handle drag
      - given owner or editor drags from a handle on workflowNode S toward another workflowNode while the pointer is near a workflowView boundary, workflowView does not auto-scroll

    openQuestions: []

  - id: FR-WF-EDGE-002
    title: Delete workflowEdge

    designEvidence:
      - FIGMA-WF-EDGE-EDIT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowEdge
      - workflowRightSidebar
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowEditEdgeForm
      - workflowEditEdgeFormDeleteButton

    preconditions:
      - a target workflowEdge exists in workflowView
      - workflowEditEdgeForm is open for that workflowEdge per FR-WF-EDGE-004

    trigger:
      - user clicks workflowEditEdgeFormDeleteButton on workflowEditEdgeForm

    mainFlow:
      - workflowEdge deletion is available only through workflowEditEdgeFormDeleteButton on workflowEditEdgeForm in workflowRightSidebar (no canvas, hover-menu, or keyboard delete entry path)
      - workflowEditEdgeFormDeleteButton role gating for commenter, viewer, and user matches FR-WF-EDGE-004 roleBehavior (disabled)
      - system removes the target workflowEdge from persisted state and from workflowView
      - on delete, workflowRightSidebar returns to default presentation per FR-WF-RS-004
      - no confirmation dialog intervenes before removal
      - deleting a workflowEdge does not remove either endpoint workflowNode

    roleBehavior:
      owner:
        workflowEditEdgeFormDeleteButton: active
      editor:
        workflowEditEdgeFormDeleteButton: active
      commenter:
        workflowEditEdgeFormDeleteButton: disabled
      viewer:
        workflowEditEdgeFormDeleteButton: disabled
      user:
        workflowEditEdgeFormDeleteButton: disabled

    acceptanceCriteria:
      - given owner or editor has workflowEditEdgeForm open for workflowEdge E, when user clicks workflowEditEdgeFormDeleteButton, workflowEdge E is removed from workflowView and workflowRightSidebar returns to default presentation per FR-WF-RS-004
      - given actor is commenter, viewer, or user, workflowEditEdgeFormDeleteButton is disabled and clicking it does not remove the workflowEdge
      - given workflowEdge E is deleted, both endpoint workflowNodes remain in workflowView
      - no control outside workflowEditEdgeFormDeleteButton in workflowRightSidebar removes a workflowEdge

    openQuestions: []

  - id: FR-WF-EDGE-003
    title: Reconnect workflowEdge source or target (move endpoint)

    designEvidence:
      - FIGMA-WF-EDGE-EDIT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowEdge
      - workflowEdgeSourceReconnectHandle
      - workflowEdgeTargetReconnectHandle
      - workflowNode
      - workflowNodeEdgeHandles

    preconditions:
      - target workflowEdge E is selected in workflowView per FR-WF-EDGE-004

    trigger:
      - user presses pointer on workflowEdgeSourceReconnectHandle or workflowEdgeTargetReconnectHandle on the selected workflowEdge and drags to another workflowNode handle
      - user releases pointer after dragging

    mainFlow:
      - workflowEdgeSourceReconnectHandle and workflowEdgeTargetReconnectHandle are rendered only while workflowEdge E is selected
      - dragging workflowEdgeSourceReconnectHandle changes only the source workflowNode and/or departure handle of E; the target workflowNode and arrival handle of E stay unchanged (directionality preserved)
      - dragging workflowEdgeTargetReconnectHandle changes only the target workflowNode and/or arrival handle of E; the source workflowNode and departure handle stay unchanged
      - while dragging, system shows a preview line and snaps to valid handles on other workflowNodes using the same snap rules as FR-WF-EDGE-001 (including no self-loop and no second edge for the same source→target pair)
      - on valid release, system updates persisted source or target endpoint of E; on release without valid snap, system reverts E to its prior endpoints
      - reconnecting workflowEdgeTargetReconnectHandle to workflowNode U is rejected when U equals the current source workflowNode of E (would create a self-loop); reconnecting workflowEdgeSourceReconnectHandle to workflowNode U is rejected when U equals the current target workflowNode of E
      - reconnect that would yield the same source→target workflowNode pair as a different existing workflowEdge is rejected; one workflowEdge per ordered pair and per-node maximum of 50 outgoing and 50 incoming workflowEdges from FR-WF-EDGE-001 apply
      - workflowView does not auto-scroll while the user drags a reconnect handle on a workflowEdge

    roleBehavior:
      owner:
        workflowEdgeSourceReconnectHandle: active
        workflowEdgeTargetReconnectHandle: active
      editor:
        workflowEdgeSourceReconnectHandle: active
        workflowEdgeTargetReconnectHandle: active
      commenter:
        workflowEdgeSourceReconnectHandle: notRendered
        workflowEdgeTargetReconnectHandle: notRendered
      viewer:
        workflowEdgeSourceReconnectHandle: notRendered
        workflowEdgeTargetReconnectHandle: notRendered
      user:
        workflowEdgeSourceReconnectHandle: notRendered
        workflowEdgeTargetReconnectHandle: notRendered

    acceptanceCriteria:
      - given selected workflowEdge E from S to T, when owner or editor drags workflowEdgeTargetReconnectHandle and releases on a valid handle on workflowNode U (U ≠ S), E's target becomes U on the chosen handle and E's source remains S
      - given selected workflowEdge E from S to T, when owner or editor drags workflowEdgeTargetReconnectHandle and releases on workflowNode S, E is unchanged (self-loop blocked)
      - given selected workflowEdge E from S to T, when owner or editor drags workflowEdgeSourceReconnectHandle and releases on a valid handle on workflowNode U (U ≠ T), E's source becomes U on the chosen handle and E's target remains T
      - given selected workflowEdge E from S to T, when owner or editor drags workflowEdgeSourceReconnectHandle and releases on workflowNode T, E is unchanged (self-loop blocked)
      - given selected workflowEdge E, when owner or editor drags a reconnect handle but releases without valid snap, E retains its original source and target
      - given actor is commenter, viewer, or user, workflowEdgeSourceReconnectHandle and workflowEdgeTargetReconnectHandle are not rendered
      - given owner or editor drags a reconnect handle on selected workflowEdge E while the pointer is near a workflowView boundary, workflowView does not auto-scroll

    openQuestions: []

  - id: FR-WF-EDGE-004
    title: Select workflowEdge, open workflowEditEdgeForm, and edit title and dashed style (save on change)

    designEvidence:
      - FIGMA-WF-EDGE-EDIT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowEdge
      - workflowEdgeTitleLabel
      - workflowNode
      - workflowRightSidebar
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowRightSidebarAddTab
      - workflowRightSidebarCommentsTab
      - workflowEditEdgeForm
      - workflowEditEdgeFormHeading
      - workflowEditEdgeFormTitleField
      - workflowEditEdgeFormDashedLineToggle
      - workflowEditEdgeFormDeleteButton

    preconditions:
      - workflowView displays at least one workflowEdge

    trigger:
      - user clicks a workflowEdge in workflowView
      - user clicks a workflowEdge in workflowView while workflowRightSidebar is already open
      - user types, pastes, or clears workflowEditEdgeFormTitleField
      - user changes workflowEditEdgeFormDashedLineToggle

    mainFlow:
      - if workflowRightSidebar is collapsed, system expands workflowRightSidebar with workflowRightSidebarEditTab selected per FR-WF-RS-001
      - if workflowRightSidebar is open on a different tab (including workflowRightSidebarAddTab or workflowRightSidebarCommentsTab) or bound to a different host, system switches workflowRightSidebar to workflowRightSidebarEditTab and rebinds workflowRightSidebarEditTabContent to the clicked workflowEdge
      - system selects the clicked workflowEdge and binds workflowEditEdgeForm in workflowRightSidebarEditTabContent to that workflowEdge
      - workflowRightSidebar presents workflowEditEdgeForm with workflowEditEdgeFormHeading and fields workflowEditEdgeFormTitleField, workflowEditEdgeFormDashedLineToggle, and workflowEditEdgeFormDeleteButton (text position control is out of scope)
      - workflowEditEdgeFormHeading reads 'Edit node link'
      - workflowEditEdgeFormTitleField and workflowEditEdgeFormDashedLineToggle are readOnly for commenter, viewer, and user; workflowEditEdgeFormDeleteButton is disabled for those actors (owner and editor may edit title and dashed style and may delete)
      - system persists changes without an explicit save control on workflowEditEdgeForm
      - workflowEditEdgeForm does not render any visible auto-save status indicator (e.g. 'Saving…' or 'Saved')
      - when owner or editor changes workflowEditEdgeFormTitleField, the title is saved without an explicit save control; workflowEdgeTitleLabel is shown on the workflowEdge in workflowView when the stored title is non-empty and is not shown when the stored title is empty
      - when owner or editor changes workflowEditEdgeFormDashedLineToggle, the persisted dashed flag updates and workflowEdge in workflowView reflects dashed when the toggle is on and solid when the toggle is off
      - when another workflowEdge is selected, selection moves to that workflowEdge
      - when multiple workflowEdges share the same target workflowNode, user selects a workflowEdge by clicking a segment of that workflowEdge where the line is visible without overlap from other workflowEdges sharing that target (typically an upstream segment before the lines converge on the target workflowNode)
      - canvas layering and selection appearance for the selected workflowEdge follow FR-WF-EDGE-005

    roleBehavior:
      owner:
        workflowEdge: selectable
        workflowEditEdgeFormTitleField: editable
        workflowEditEdgeFormDashedLineToggle: editable
        workflowEditEdgeFormDeleteButton: active
      editor:
        workflowEdge: selectable
        workflowEditEdgeFormTitleField: editable
        workflowEditEdgeFormDashedLineToggle: editable
        workflowEditEdgeFormDeleteButton: active
      commenter:
        workflowEdge: selectable
        workflowEditEdgeFormTitleField: readOnly
        workflowEditEdgeFormDashedLineToggle: readOnly
        workflowEditEdgeFormDeleteButton: disabled
      viewer:
        workflowEdge: selectable
        workflowEditEdgeFormTitleField: readOnly
        workflowEditEdgeFormDashedLineToggle: readOnly
        workflowEditEdgeFormDeleteButton: disabled
      user:
        workflowEdge: selectable
        workflowEditEdgeFormTitleField: readOnly
        workflowEditEdgeFormDashedLineToggle: readOnly
        workflowEditEdgeFormDeleteButton: disabled

    acceptanceCriteria:
      - given owner or editor clicks workflowEdge E in workflowView, workflowEditEdgeForm opens for E in workflowRightSidebarEditTabContent and workflowEdgeSourceReconnectHandle and workflowEdgeTargetReconnectHandle are available per FR-WF-EDGE-003
      - given commenter, viewer, or user clicks a workflowEdge in workflowView, workflowEditEdgeForm opens with workflowEditEdgeFormTitleField and workflowEditEdgeFormDashedLineToggle readOnly and workflowEditEdgeFormDeleteButton disabled
      - given owner or editor has workflowEditEdgeForm open for workflowEdge E, when workflowEditEdgeFormDashedLineToggle is on, workflowEdge E is drawn dashed in workflowView; when the toggle is off, workflowEdge E is drawn solid
      - given owner or editor has workflowEditEdgeForm open for workflowEdge E, when user modifies workflowEditEdgeFormTitleField, the change is saved without an explicit save control and workflowEdge E shows workflowEdgeTitleLabel in workflowView when the stored title is non-empty
      - given owner or editor has workflowEditEdgeForm open for workflowEdge E, when user modifies an editable field on workflowEditEdgeForm, workflowEditEdgeForm does not show any visible auto-save status indicator
      - given owner or editor clears workflowEditEdgeFormTitleField on workflowEdge E, when save completes, workflowEdge E does not show workflowEdgeTitleLabel in workflowView
      - given workflowEdge E is selected, when user clicks workflowEdge F in workflowView, workflowEditEdgeForm binds to F
      - given workflowRightSidebar is collapsed, when user clicks workflowEdge E in workflowView, workflowRightSidebar expands, workflowRightSidebarEditTab is selected, and workflowEditEdgeForm opens for E
      - given workflowRightSidebar is open on workflowRightSidebarAddTab or bound to a workflowNode per FR-WF-EN-001, when user clicks workflowEdge E in workflowView, workflowRightSidebar switches to workflowRightSidebarEditTab and workflowEditEdgeForm binds to E
      - given workflowNode T is the target of workflowEdges E1 and E2, when user clicks a segment of E1 where E1's line is visible without overlap from E2, workflowEditEdgeForm binds to E1
      - when workflowEditEdgeForm is rendered, workflowEditEdgeFormHeading text is 'Edit node link'

    openQuestions: []

  - id: FR-WF-EDGE-005
    title: workflowEdge canvas layering, selection appearance, and path re-routing on layout change

    designEvidence:
      - FIGMA-WF-EDGE-EDIT

    actors:
      - system

    uiObjects:
      - workflowView
      - workflowNode
      - workflowEdge
      - workflowNodeEdgeHandles
      - workflowRightSidebar
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent

    preconditions:
      - workflowView displays at least one workflowEdge

    trigger:
      - workflowEdge selection changes in workflowView
      - workflowRightSidebar edit selection binds to a workflowNode that is an endpoint of a workflowEdge or to a workflowEdge
      - a workflowNode move is finalized per FR-WF-MV-003 or FR-WF-MV-004 and one or more workflowEdges are preserved per FR-WF-MV-005

    mainFlow:
      - when a workflowNode move is finalized per FR-WF-MV-003 or FR-WF-MV-004, each workflowEdge preserved per FR-WF-MV-005 has its visible path in workflowView recalculated to connect the same persisted departure and arrival workflowNodeEdgeHandles on the updated canvas positions of its source and target workflowNodes; source/target identities and edge metadata are unchanged by re-routing
      - workflowEdge path re-routing uses orthogonal smooth-step routing between the attachment points of the persisted handles on each endpoint workflowNode
      - path re-routing applies to every preserved workflowEdge incident on the moved workflowNode and to every other preserved workflowEdge whose source or target workflowNode canvas position changed as a consequence of the move finalization
      - when workflowEdge E is not the selected workflowEdge in workflowView and workflowRightSidebar edit selection is not a workflowNode endpoint of E, E is stacked behind workflowNodes so overlapping regions show the workflowNode in front of the line
      - when workflowEdge E is the selected workflowEdge (user clicked E in workflowView per FR-WF-EDGE-004), E is stacked above workflowNodes so the line remains visible where it crosses workflowNode bounds
      - when workflowEdge E is the selected workflowEdge, its visible stroke colour is '#FCD748' (dashing per persisted dashed flag still applies)
      - when workflowEdge E is the selected workflowEdge, the workflowNodeEdgeHandle on the source workflowNode and the workflowNodeEdgeHandle on the target workflowNode that attach E each show a yellow selection border in the same emphasis family as '#FCD748'
      - when workflowRightSidebar edit selection is a workflowNode N that is an endpoint of workflowEdge E and E is not the selected workflowEdge, E keeps behind-workflowNode stacking but its visible stroke uses '#FCD748' until selection changes (endpoint handle yellow border applies only when E is the selected workflowEdge, not for node-only sidebar selection)

    roleBehavior: {}

    acceptanceCriteria:
      - given workflowEdge E from workflowNode A to workflowNode B with persisted handle attachments, when owner or editor moves A or B per FR-WF-MV-003 or FR-WF-MV-004 and E is preserved per FR-WF-MV-005, E remains displayed in workflowView connecting A to B on the same handles with a path updated to the nodes' new canvas positions
      - given workflowNode N with one or more incident workflowEdges preserved per FR-WF-MV-005 after a move finalization, each incident workflowEdge's visible path in workflowView reflects the updated endpoint positions while source/target identities and metadata are unchanged
      - given workflowEdge E is preserved after a move per FR-WF-MV-005 and E is not the selected workflowEdge, E remains stacked behind overlapping workflowNodes per this FR after re-routing
      - given workflowEdge E overlaps a workflowNode, E is not the selected workflowEdge, and neither endpoint of E is the current workflowRightSidebar workflowNode edit target, the overlapping stretch of E is visually behind that workflowNode
      - given workflowEdge E is the selected workflowEdge, E is visually in front of workflowNodes it crosses, E's visible stroke is '#FCD748', and the two workflowNodeEdgeHandles that E uses at its endpoints each display a yellow border consistent with that emphasis
      - given workflowEdge E from A to B and workflowRightSidebar edit selection is workflowNode A or B and E is not the selected workflowEdge, E's visible stroke uses '#FCD748' and E remains stacked behind workflowNodes where they overlap

    openQuestions: []

