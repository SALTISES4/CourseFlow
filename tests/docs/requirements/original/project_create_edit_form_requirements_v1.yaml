# Normalized requirements: create / edit project form (modal)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Project, Project Metadata spreadsheet reference, Discipline field)
# Application code: shared ProjectForm in create and edit project dialogs (current implementation)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: createProjectDialog and add menu entry in tests/docs/requirements/original/top_navigation_requirements_v1.yaml (FR-TOP-002); contextActionBar header-level behavior and project overflow menu in tests/docs/requirements/original/context_action_bar_requirements_v1.yaml (FR-CAB-001 through FR-CAB-003); edit workflow dialog and pencil on workflow routes in tests/docs/requirements/original/workflow_edit_form_requirements_v1.yaml (FR-WF-FORM-001)

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  createProjectDialog:
    meaning: Modal dialog for creating a project
  contextActionBar:
    meaning: Canonical definition in tests/docs/requirements/original/context_action_bar_requirements_v1.yaml.
  editPencilButton:
    meaning: Canonical definition in tests/docs/requirements/original/context_action_bar_requirements_v1.yaml.
  editProjectDialog:
    meaning: Modal dialog for editing an existing project
  projectForm:
    meaning: Form inside createProjectDialog or editProjectDialog for project metadata and submit actions.
  projectStartWithProjectAlert:
    meaning: Alert on projectOverviewView prompting the user to start from a project.
  projectFormDialogTitle:
    meaning: Dialog title for the form; 'Create project' in create mode and 'Edit project' in edit mode
  projectTitleField:
    meaning: Text input for project title
  projectDescriptionField:
    meaning: Text input for project description; optional; no maximum character length; label 'Description'
  projectDisciplineField:
    meaning: Multi-select control for zero or more disciplines
  projectFormCancelButton:
    meaning: Secondary action that closes the dialog without persisting changes; label 'Cancel'
  projectFormSubmitButton:
    meaning: Primary submit action
  projectFormFieldValidationMessage:
    meaning: Inline helper or error text for a field when validation fails.
  globalMessageSnackbar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_header_requirements_v1.yaml.

locatorMappings:
  createProjectDialog:
    strategy: null
    confidence: unresolved
  contextActionBar:
    strategy: null
    confidence: unresolved
  editPencilButton:
    strategy: null
    confidence: unresolved
  editProjectDialog:
    strategy: null
    confidence: unresolved
  projectForm:
    strategy: null
    confidence: unresolved
  projectTitleField:
    strategy: "{projectForm} input[name=\"title\"]"
    confidence: inferred
  projectDescriptionField:
    strategy: "{projectForm} input[name=\"description\"]"
    confidence: inferred
  projectDisciplineField:
    strategy: "{projectForm} [aria-labelledby=\"create-project-discipline\"]"
    confidence: inferred
  projectFormCancelButton:
    strategy: null
    confidence: unresolved
  projectFormSubmitButton:
    strategy: "{projectForm} button[type=\"submit\"]"
    confidence: inferred
  projectFormFieldValidationMessage:
    strategy: null
    confidence: unresolved
  globalMessageSnackbar:
    strategy: null
    confidence: unresolved
  projectStartWithProjectAlert:
    strategy: null
    confidence: unresolved

requirements:
  - id: FR-PROJ-FORM-001
    title: Create project dialog layout and primary fields

    designEvidence:
      - FIGMA-PROJ-CREATE

    actors:
      - user

    uiObjects:
      - createProjectDialog
      - projectForm
      - projectFormDialogTitle
      - projectTitleField
      - projectDescriptionField
      - projectDisciplineField
      - projectFormCancelButton
      - projectFormSubmitButton

    preconditions:
      - addMenuItemProject is available from top navigation add menu

    trigger:
      - user clicks addMenuItemProject

    mainFlow:
      - system opens createProjectDialog
      - createProjectDialog presents projectForm with projectFormDialogTitle 'Create project'
      - projectForm presents projectTitleField, projectDescriptionField, and projectDisciplineField
      - projectForm presents projectFormCancelButton and projectFormSubmitButton with submit label 'Create project'
      - visible labels on form controls use sentence case where applicable

    roleBehavior: {}

    acceptanceCriteria:
      - createProjectDialog is open
      - projectFormDialogTitle matches 'Create project'
      - projectTitleField is visible
      - projectDescriptionField is visible
      - projectDisciplineField is visible
      - projectFormCancelButton is visible
      - projectFormSubmitButton is visible

    openQuestions:
      - Confirm final dialog chrome and spacing against FIGMA-PROJ-CREATE if implementation diverges.

  - id: FR-PROJ-FORM-002
    title: Create project new-user onboarding alert

    designEvidence:
      - FIGMA-PROJ-CREATE-NEW-USERS

    actors:
      - user

    uiObjects:
      - createProjectDialog
      - projectForm
      - projectStartWithProjectAlert

    preconditions:
      - user account has no projects
      - user opens createProjectDialog

    trigger: []

    mainFlow:
      - when preconditions hold, projectStartWithProjectAlert is shown above project fields in createProjectDialog with instructional copy per design

    roleBehavior: {}

    acceptanceCriteria:
      - given user account has no projects and createProjectDialog is open, projectStartWithProjectAlert is visible

    openQuestions: []

  - id: FR-PROJ-FORM-003
    title: Edit project dialog layout and prefilled fields

    designEvidence:
      - FIGMA-PROJ-EDIT

    actors:
      - owner
      - editor
      - viewer
      - commenter

    uiObjects:
      - contextActionBar
      - editPencilButton
      - editProjectDialog
      - projectForm
      - projectFormDialogTitle
      - projectTitleField
      - projectDescriptionField
      - projectDisciplineField
      - projectFormCancelButton
      - projectFormSubmitButton

    preconditions:
      - current route matches route pattern /project/{id} or route pattern /project/{id}/workflows
      - user is viewing that project in the main content area

    trigger:
      - user clicks editPencilButton on contextActionBar

    mainFlow:
      - contextActionBar is visible below the global top navigation
      - editPencilButton is visible on contextActionBar for Owner, Editor, Viewer, and Commenter
      - editPencilButton is clickable for Owner and Editor only; Viewer and Commenter see it visible but read-only (not clickable)
      - when user has Owner or Editor role and clicks editPencilButton, system opens editProjectDialog
      - editProjectDialog presents projectForm with projectFormDialogTitle 'Edit project'
      - projectTitleField, projectDescriptionField, and projectDisciplineField are prefilled from loaded project data
      - projectFormSubmitButton shows label 'Update project'
      - projectFormSubmitButton is disabled and not clickable until the user changes at least one field from the values loaded into projectForm

    roleBehavior:
      owner:
        editPencilButton: available
      editor:
        editPencilButton: available
      viewer:
        editPencilButton: readOnly
      commenter:
        editPencilButton: readOnly

    acceptanceCriteria:
      - given user has Owner or Editor role on the project, editPencilButton is clickable and user can open editProjectDialog via trigger
      - given user has Viewer or Commenter role on the project, editPencilButton is visible and read-only (not clickable), and editProjectDialog does not open when user attempts to click it
      - given Owner or Editor preconditions and trigger, editProjectDialog is open
      - projectFormDialogTitle matches 'Edit project'
      - projectTitleField, projectDescriptionField, and projectDisciplineField show values from the project being edited after load
      - given editProjectDialog is open with prefilled values and no field has been changed from those values, projectFormSubmitButton is disabled and not clickable
      - given editProjectDialog is open and user has changed at least one field from loaded values, projectFormSubmitButton is enabled and clickable

    openQuestions: []

  - id: FR-PROJ-FORM-004
    title: Project form validation

    designEvidence:
      - FIGMA-PROJ-CREATE
      - FIGMA-PROJ-EDIT

    actors:
      - user

    uiObjects:
      - projectForm
      - projectTitleField
      - projectDescriptionField
      - projectDisciplineField
      - projectFormFieldValidationMessage
      - projectFormSubmitButton

    preconditions:
      - projectForm is visible

    trigger:
      - user edits projectForm and attempts submit

    mainFlow:
      - projectTitleField requires a non-empty value and a maximum of 200 characters; when the value exceeds 200 characters, projectTitleField shows projectFormFieldValidationMessage
      - projectDescriptionField may be empty; there is no maximum character length and validation must not reject description solely for length
      - projectDisciplineField is optional for create and for edit; empty selection is valid and must not trigger required-field validation for disciplines; there is no maximum number of selected disciplines
      - when validation fails, system does not persist and shows projectFormFieldValidationMessage on invalid controls where applicable
      - validation copy may be locale-dependent; assert association and error state rather than fixed English strings unless product locks copy

    roleBehavior: {}

    acceptanceCriteria:
      - given projectTitleField is empty or invalid on submit, projectForm is not submitted successfully and user sees validation feedback for projectTitleField
      - given projectTitleField value exceeds 200 characters, projectTitleField shows projectFormFieldValidationMessage
      - validation does not fail solely because projectDescriptionField exceeds a character limit (no maximum length)
      - validation does not fail solely because projectDisciplineField exceeds a selection count (no maximum number of selected options)
      - given projectDisciplineField has no selection in create or edit mode, validation does not treat disciplines as required and does not block submit solely for empty disciplines

    openQuestions: []

  - id: FR-PROJ-FORM-005
    title: Project form submit enablement and persistence outcomes

    designEvidence:
      - FIGMA-PROJ-CREATE
      - FIGMA-PROJ-EDIT

    actors:
      - user

    uiObjects:
      - projectForm
      - projectFormSubmitButton
      - globalMessageSnackbar
      - editProjectDialog

    preconditions:
      - projectForm is visible

    trigger:
      - user clicks projectFormSubmitButton

    mainFlow:
      - projectFormSubmitButton is disabled while projectForm has no unsaved change in current implementation
      - when user clicks projectFormSubmitButton in create mode, system creates project and on success navigates to route pattern /project/{id} for the new project id and shows a success message in globalMessageSnackbar
      - when user clicks projectFormSubmitButton in edit mode, system updates project and closes dialog on success; application does not navigate away and user remains on the same route as before submit, whether route pattern /project/{id} or route pattern /project/{id}/workflows; on success, system shows a success message in globalMessageSnackbar
      - when create or update does not complete successfully after submit (for example API or server error), system does not apply the success outcomes above and shows an error message in globalMessageSnackbar

    roleBehavior: {}

    acceptanceCriteria:
      - given projectForm has no unsaved change, projectFormSubmitButton is disabled
      - given projectForm has unsaved change, projectFormSubmitButton is enabled
      - given successful create submit, current route matches route pattern /project/{id} for the created project id
      - given successful create submit, globalMessageSnackbar shows a success message
      - given successful edit submit, editProjectDialog is closed and current route is unchanged from immediately before submit (user remains on /project/{id} or /project/{id}/workflows as applicable)
      - given successful edit submit, globalMessageSnackbar shows a success message
      - given create submit does not complete successfully, globalMessageSnackbar shows an error message
      - given edit submit does not complete successfully, globalMessageSnackbar shows an error message

    openQuestions:
      - Confirm canonical success and error snackbar copy for create and update flows for downstream test assertions.

