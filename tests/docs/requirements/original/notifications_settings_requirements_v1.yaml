# Normalized requirements: notifications settings page
# Source: application code and Figma only (no separate Google Doc for this run)
# Application code evidence: react/src/components/pages/Settings/NotificationsSettings/index.tsx; react/src/HTTP/XMLHTTP/API/user.rtk.ts; react/src/router/appRoutes.tsx; react/src/router/apiRoutes.ts; react/src/utility/strings.ts
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/top_navigation_requirements_v1.yaml (navigation entry to notifications settings route)

documentPreconditions:
  - user is authenticated to CourseFlow
  - user is within the main application shell

uiObjectDefinitions:
  notificationsSettingsPage:
    meaning: Full page rendered at route '/user/notifications-settings' where user configures product-update email notification preference.
  notificationsSettingsTitle:
    meaning: Page title text on notificationsSettingsPage with copy 'Notification settings'.
  notificationsSettingsForm:
    meaning: Form container on notificationsSettingsPage that binds notification preference state.
  productUpdatesToggle:
    meaning: Primary switch control in notificationsSettingsForm that represents whether user receives product update emails.
  productUpdatesToggleLabel:
    meaning: Visible label associated with productUpdatesToggle; copy is 'I want to receive product updates emails' in current implementation.
  notificationSettingsMutationRequest:
    meaning: Save operation triggered when productUpdatesToggle changes; posts updated boolean preference to notifications settings update endpoint.
  globalMessageSnackbar:
    meaning: Global feedback surface used by generic message handling after notification settings update attempt.

locatorMappings:
  notificationsSettingsPage:
    strategy: "URL pathname /user/notifications-settings"
    confidence: confirmed
  notificationsSettingsTitle:
    strategy: "{notificationsSettingsPage} h1"
    confidence: inferred
  notificationsSettingsForm:
    strategy: "{notificationsSettingsPage} form"
    confidence: inferred
  productUpdatesToggle:
    strategy: "{notificationsSettingsForm} input[type=\"checkbox\"]"
    confidence: inferred
  productUpdatesToggleLabel:
    strategy: "{notificationsSettingsForm} label text 'I want to receive product updates emails'"
    confidence: inferred
  notificationSettingsMutationRequest:
    strategy: "POST /user/notifications-settings/update with body { notifications: boolean }"
    confidence: confirmed
  globalMessageSnackbar:
    strategy: "Application global snackbar message surface used by useGenericMsgHandler"
    confidence: confirmed

requirements:
  - id: FR-NOTIF-001
    title: Notifications settings route and primary controls

    designEvidence:
      - FIGMA-NOTIFICATION-SETTINGS

    actors:
      - user

    uiObjects:
      - notificationsSettingsPage
      - notificationsSettingsTitle
      - notificationsSettingsForm
      - productUpdatesToggle
      - productUpdatesToggleLabel

    preconditions:
      - user is authenticated

    trigger:
      - user navigates to '/user/notifications-settings'

    mainFlow:
      - when user navigates to '/user/notifications-settings', system renders notificationsSettingsPage
      - notificationsSettingsPage presents notificationsSettingsTitle with copy 'Notification settings'
      - notificationsSettingsForm presents productUpdatesToggle with label productUpdatesToggleLabel

    roleBehavior: {}

    acceptanceCriteria:
      - current route matches '/user/notifications-settings'
      - notificationsSettingsTitle is visible with text 'Notification settings'
      - productUpdatesToggle is visible
      - productUpdatesToggleLabel is visible with text 'I want to receive product updates emails'

    openQuestions: []

  - id: FR-NOTIF-002
    title: Notifications settings initial state hydration

    designEvidence:
      - FIGMA-NOTIFICATION-SETTINGS

    actors:
      - user

    uiObjects:
      - notificationsSettingsPage
      - notificationsSettingsForm
      - productUpdatesToggle

    preconditions:
      - user is authenticated to CourseFlow

    trigger:
      - user navigates to '/user/notifications-settings'

    mainFlow:
      - system fetches current notification settings from '/user/notifications-settings'
      - for a newly created account on first landing to notificationsSettingsPage, productUpdatesToggle default state is on (active)
      - if user had previously set notification preferences, productUpdatesToggle state matches the previous preference

    roleBehavior: {}

    acceptanceCriteria:
      - given user has just created an account and first lands on notificationsSettingsPage, productUpdatesToggle is on (active)
      - given user had previously set notification preferences, productUpdatesToggle state matches the previous preference

    openQuestions:
      - Confirm intended user-visible behavior while notification settings query is loading (e.g. loader, disabled switch, or immediate interactive default).
      - Confirm intended user-visible behavior when notification settings query fails (e.g. inline warning, retry affordance, fallback default state), since current page component does not render explicit query-error UI.

  - id: FR-NOTIF-003
    title: Toggle change triggers immediate save and feedback

    designEvidence:
      - FIGMA-NOTIFICATION-SETTINGS

    actors:
      - user

    uiObjects:
      - notificationsSettingsForm
      - productUpdatesToggle
      - notificationSettingsMutationRequest
      - globalMessageSnackbar

    preconditions:
      - notificationsSettingsForm is visible
      - productUpdatesToggle has an initial value from query state

    trigger:
      - user toggles productUpdatesToggle

    mainFlow:
      - when user toggles productUpdatesToggle, system immediately updates local form value and submits notificationSettingsMutationRequest without separate submit button click
      - notificationSettingsMutationRequest sends body `{ notifications: <current toggle boolean> }` to '/user/notifications-settings/update'
      - when update succeeds, system shows success feedback in globalMessageSnackbar
      - when update fails, system shows error feedback in globalMessageSnackbar

    roleBehavior: {}

    acceptanceCriteria:
      - given user toggles productUpdatesToggle, update request is issued to '/user/notifications-settings/update' with `notifications` matching the new toggle state
      - given update succeeds, success feedback is shown in globalMessageSnackbar
      - given update fails, error feedback is shown in globalMessageSnackbar

    openQuestions:
      - Confirm whether productUpdatesToggle should remain in the new state or revert to previous state when update fails (current implementation sets local value before mutation and does not explicitly rollback).
      - Confirm exact success and error copy for notification settings update in the global message surface.

