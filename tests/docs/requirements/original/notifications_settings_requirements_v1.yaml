# Normalized requirements: notifications settings page
# Source: application code and Figma only (no separate Google Doc for this run)
# Application code evidence: react/src/components/pages/Settings/NotificationsSettings/index.tsx; react/src/HTTP/XMLHTTP/API/user.rtk.ts; react/src/router/appRoutes.tsx; react/src/router/apiRoutes.ts; react/src/utility/strings.ts
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/top_navigation_requirements_v1.yaml FR-TOP-003 (entry path to '/user/notifications-settings' via accountMenuItemNotificationsSettings); tests/docs/requirements/original/card_content_requirements_v1.yaml (globalMessageSnackbar per FR-NOTIF-003)

documentPreconditions:
  - user is authenticated to CourseFlow
  - user is within the main application shell

uiObjectDefinitions:
  notificationsSettingsPage:
    meaning: Notifications settings page at route '/user/notifications-settings'.
  notificationsSettingsTitle:
    meaning: Page title text for the notifications settings screen; 'Notification settings'.
  notificationsSettingsForm:
    meaning: Form container on notificationsSettingsPage for productUpdatesToggle.
  productUpdatesToggle:
    meaning: MUI Switch for product-updates email preference on notificationsSettingsPage.
  productUpdatesToggleLabel:
    meaning: Label for productUpdatesToggle; 'I want to receive product updates emails'.
  globalMessageSnackbar:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.

locatorMappings:
  notificationsSettingsPage: "canonical_locators.yaml -> notificationsSettingsPage"
  notificationsSettingsTitle: "canonical_locators.yaml -> notificationsSettingsTitle"
  notificationsSettingsForm: "canonical_locators.yaml -> notificationsSettingsForm"
  productUpdatesToggle: "canonical_locators.yaml -> productUpdatesToggle"
  productUpdatesToggleLabel: "canonical_locators.yaml -> productUpdatesToggleLabel"
  globalMessageSnackbar: "canonical_locators.yaml -> globalMessageSnackbar"

requirements:
  - id: FR-NOTIF-001
    title: Notifications settings page route and primary form elements

    designEvidence:
      - FIGMA-NOTIFICATION-SETTINGS

    actors:
      - user

    uiObjects:
      - notificationsSettingsPage
      - notificationsSettingsTitle
      - notificationsSettingsForm
      - productUpdatesToggle
      - productUpdatesToggleLabel

    preconditions:
      - documentPreconditions for this file hold

    trigger: []

    mainFlow:
      - given current route matches '/user/notifications-settings', notificationsSettingsPage is visible
      - notificationsSettingsTitle is visible on notificationsSettingsPage
      - notificationsSettingsForm is visible on notificationsSettingsPage
      - notificationsSettingsForm shows productUpdatesToggle with label 'I want to receive product updates emails'

    roleBehavior: {}

    acceptanceCriteria:
      - current route matches '/user/notifications-settings'
      - notificationsSettingsTitle is visible with label 'Notification settings'
      - notificationsSettingsForm is visible
      - productUpdatesToggle is visible
      - productUpdatesToggleLabel is visible with label 'I want to receive product updates emails'

    openQuestions: []

  - id: FR-NOTIF-002
    title: Notifications settings initial load behavior and preference binding

    designEvidence:
      - FIGMA-NOTIFICATION-SETTINGS

    actors:
      - user

    uiObjects:
      - notificationsSettingsPage
      - notificationsSettingsForm
      - productUpdatesToggle

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/user/notifications-settings'
      - notificationsSettingsPage is visible

    trigger: []

    mainFlow:
      - productUpdatesToggle matches the user's saved email notification preference
      - given user has just created an account and first visits notificationsSettingsPage, productUpdatesToggle is on
      - given user had previously set notification preferences, productUpdatesToggle matches the saved preference

    roleBehavior: {}

    acceptanceCriteria:
      - given user has just created an account and first visits notificationsSettingsPage, productUpdatesToggle is on
      - given user had previously set notification preferences, productUpdatesToggle matches the saved preference

    openQuestions: []

  - id: FR-NOTIF-003
    title: Product updates switch click saves immediately and shows feedback

    designEvidence:
      - FIGMA-NOTIFICATION-SETTINGS

    actors:
      - user

    uiObjects:
      - notificationsSettingsForm
      - productUpdatesToggle
      - globalMessageSnackbar

    preconditions:
      - documentPreconditions for this file hold
      - notificationsSettingsForm is visible
      - productUpdatesToggle matches saved preference per FR-NOTIF-002

    trigger:
      - user clicks productUpdatesToggle

    mainFlow:
      - given user clicks productUpdatesToggle, preference saves immediately without separate submit button click
      - given save succeeds, globalMessageSnackbar shows 'Your notification settings have been updated'
      - given save fails, productUpdatesToggle returns to its previous state and globalMessageSnackbar shows 'We encountered an issue and your notification settings were not updated'

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks productUpdatesToggle, preference is saved immediately
      - given save succeeds, globalMessageSnackbar shows 'Your notification settings have been updated'
      - given save fails, productUpdatesToggle shows its previous state
      - given save fails, globalMessageSnackbar shows 'We encountered an issue and your notification settings were not updated'

    openQuestions: []

designEvidenceLinkTable:
  - key: FIGMA-NOTIFICATION-SETTINGS
    hyperlink: https://www.figma.com/design/ibrUG0Rc5B2lpUW4Tflbum/CourseFlow-2.0?node-id=1842-118329&t=lsKQpS4Jq8MOZwMT-1
