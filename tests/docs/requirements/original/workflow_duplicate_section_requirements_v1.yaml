# Normalized requirements: duplicate an existing workflowSectionContainer ('Workflow' view)
# Application code evidence: react/src/components/views/WorkflowView/WorkflowEditView/components/Week/HoverMenu/index.tsx (duplicate week below); react/src/components/pages/Workspace/Workflow/Sidebar/components/EditTab/components/EditSection/index.tsx (workflowEditSectionFormDuplicateButton); react/src/redux/slices/week.slice.ts (weekInsertBelow with duplicate flag)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (canonical section uiObjects and locators; FR-SEC-001–004, FR-SEC-007–012); tests/docs/requirements/original/workflow_delete_section_requirements_v1.yaml (FR-SEC-006); tests/docs/requirements/original/workflow_copy_requirements_v1.yaml (intra-workflow section duplicate preserves links within one workflow; cross-workflow copy link rules differ—FR-WF-COPY-003)
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/graph'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

uiObjectDefinitions:
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowSectionHeader:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowSectionNumberLabel:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowSectionTitleText:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowSectionRow:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowChannel:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml.
  workflowSectionContainerHoverActionsMenu:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowSectionContainerHoverActionsMenuDuplicateItem:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowEditSectionForm:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowEditSectionFormTitleField:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowEditSectionFormDuplicateButton:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowNode:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowNodeLinkedWorkflowIndicator:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml.
  workflowOutcome:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_assign_outcome_to_node_requirements_v1.yaml.
  workflowEdge:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edge_requirements_v1.yaml.

locatorMappings:
  workflowView: "canonical_locators.yaml -> workflowView"
  workflowSectionContainer: "canonical_locators.yaml -> workflowSectionContainer"
  workflowSectionContainerHoverActionsMenu: "canonical_locators.yaml -> workflowSectionContainerHoverActionsMenu"
  workflowRightSidebar: "canonical_locators.yaml -> workflowRightSidebar"
  workflowEditSectionFormDuplicateButton: "canonical_locators.yaml -> workflowEditSectionFormDuplicateButton"

requirements:
  - id: FR-SEC-005
    title: Duplicate section below (hover or sidebar)

    designEvidence:
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-OE-EDIT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowSectionContainer
      - workflowSectionHeader
      - workflowSectionNumberLabel
      - workflowSectionTitleText
      - workflowSectionRow
      - workflowChannel
      - workflowSectionContainerHoverActionsMenu
      - workflowSectionContainerHoverActionsMenuDuplicateItem
      - workflowRightSidebar
      - workflowEditSectionForm
      - workflowEditSectionFormTitleField
      - workflowEditSectionFormDuplicateButton
      - workflowNode
      - workflowNodeLinkedWorkflowIndicator
      - workflowOutcome
      - workflowEdge

    preconditions:
      - workflowView contains at least one workflowSectionContainer
      - for the hover-menu path, workflowSectionContainerHoverActionsMenuDuplicateItem actionability for the actor follows FR-SEC-007
      - for the sidebar path, workflowEditSectionForm is open for the source workflowSectionContainer and workflowEditSectionFormDuplicateButton actionability for the actor follows FR-SEC-005 roleBehavior

    trigger:
      - user clicks workflowSectionContainerHoverActionsMenuDuplicateItem on workflowSectionContainerHoverActionsMenu visible on workflowSectionHeader hover per FR-SEC-007
      - user clicks workflowEditSectionFormDuplicateButton on workflowEditSectionForm in workflowRightSidebar

    mainFlow:
      - system identifies the source workflowSectionContainer from workflowSectionContainerHoverActionsMenuDuplicateItem on that section's workflowSectionHeader, or from workflowEditSectionForm open in workflowRightSidebar for that workflowSectionContainer
      - system creates a new workflowSectionContainer in workflowView immediately below the source workflowSectionContainer
      - system duplicates graph content from the source workflowSectionContainer into the new workflowSectionContainer (workflowNodes and their metas, linkedWorkflow associations on those workflowNodes, associated outcomes per upstream); workflowEdges whose source and target workflowNodes are both in the source workflowSectionContainer are duplicated into the new workflowSectionContainer; cross-section workflowEdges incident on source workflowNodes are not duplicated and the original workflowEdges remain unchanged; comments on the source workflowSectionContainer are not copied
      - every copied workflowNode in the duplicate section keeps the same workflowChannel and workflowSectionRow coordinates relative to that duplicate section as its source workflowNode had in S
      - when workflowEditSectionFormTitleField for the source workflowSectionContainer is non-empty, the copy's workflowEditSectionFormTitleField and workflowSectionTitleText receive the source value with literal ' (copy)' appended; when the source title is empty, the copy's title is the literal ' (copy)' (leading space)
      - when the user duplicates a section whose workflowSectionTitleText already ends with ' (copy)', the new workflowSectionTitleText appends another ' (copy)' suffix (for example 'section (copy)' becomes 'section (copy) (copy)')
      - system recalculates workflowSectionNumberLabel on every workflowSectionHeader in workflowView per FR-SEC-002
      - duplicate does not open or rebind workflowRightSidebar; sidebar tab and section selection are unchanged unless the user subsequently selects the duplicate per FR-SEC-001

    roleBehavior:
      owner:
        workflowEditSectionFormDuplicateButton: active
      editor:
        workflowEditSectionFormDuplicateButton: active
      commenter:
        workflowEditSectionFormDuplicateButton: disabled
      viewer:
        workflowEditSectionFormDuplicateButton: disabled
      user:
        workflowEditSectionFormDuplicateButton: disabled

    acceptanceCriteria:
      - given source workflowSectionContainer S, when duplicate completes, a new workflowSectionContainer appears immediately below S in workflowView with mirrored graph content except comments
      - given source workflowSectionContainer S is at top-to-bottom index K, when duplicate completes, the new workflowSectionContainer is at K+1 and every workflowSectionContainer that was below S shifts down by one index; workflowSectionNumberLabel values on all workflowSectionHeaders reflect the new contiguous order per FR-SEC-002
      - given source workflowSectionContainer S contains workflowNode N at workflowChannel C and workflowSectionRow R, when duplicate completes, the corresponding copied workflowNode in the duplicate section is at C and R relative to that duplicate section
      - given source workflowSectionContainer S has a workflowEdge to a workflowNode in a different workflowSectionContainer, when duplicate completes, that original workflowEdge remains unchanged and no new cross-section workflowEdge is created for copied workflowNodes in the duplicate section
      - given source workflowSectionContainer S contains workflowNodes N1 and N2 with a workflowEdge from N1 to N2 wholly inside S, when duplicate completes, the duplicate section contains copied workflowNodes corresponding to N1 and N2 and a workflowEdge between those copied nodes with the same source workflowNode, target workflowNode, and metadata as the source edge
      - given source workflowSectionContainer S contains workflowNode N with a linkedWorkflow association, when duplicate completes, the corresponding copied workflowNode in the duplicate section has the same linkedWorkflow association as N and workflowNodeLinkedWorkflowIndicator is rendered per FR-WF-NODE-001
      - given source workflowSectionContainer S contains workflowNode N with one or more assigned workflowOutcomes, when duplicate completes, the corresponding copied workflowNode in the duplicate section has the same workflowOutcome assignments as N
      - given workflowEditSectionFormTitleField for source workflowSectionContainer has stored title 'Week 1', when duplicate completes, duplicated workflowSectionTitleText is 'Week 1 (copy)'
      - given workflowEditSectionFormTitleField for source workflowSectionContainer is empty, duplicated workflowSectionTitleText is the literal ' (copy)'
      - given actor is commenter with workflowSectionContainerHoverActionsMenu visible per FR-SEC-007, workflowSectionContainerHoverActionsMenuDuplicateItem is disabled
      - given actor is viewer or user (published-access), workflowSectionContainerHoverActionsMenu is not rendered on workflowSectionHeader hover per FR-SEC-007, so workflowSectionContainerHoverActionsMenuDuplicateItem is not reachable via the hover path
      - given duplicate completes via workflowSectionContainerHoverActionsMenuDuplicateItem, workflowRightSidebar tab and section selection are unchanged until the user selects the duplicate per FR-SEC-001
      - given workflowEditSectionForm is open for source workflowSectionContainer S and owner or editor clicks workflowEditSectionFormDuplicateButton, when duplicate completes, a new workflowSectionContainer appears immediately below S with mirrored graph content except comments and workflowRightSidebar remains bound to S until the user selects the duplicate per FR-SEC-001
      - given actor is commenter, viewer, or user (published-access) with workflowEditSectionForm open, workflowEditSectionFormDuplicateButton is disabled

    openQuestions: []

