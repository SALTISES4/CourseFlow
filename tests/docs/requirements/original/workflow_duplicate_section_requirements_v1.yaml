# Normalized requirements: duplicate an existing workflowSectionContainer ('Workflow' view)
# Source: tests/docs/__ARCHIVE/edit_section_requirements_v1.md
# Application code evidence: react/src/components/views/WorkflowView/WorkflowEditView/components/Week/HoverMenu/index.tsx (duplicate week below); react/src/components/pages/Workspace/Workflow/Sidebar/components/EditTab/components/EditSection/index.tsx (workflowEditSectionFormDuplicateButton); react/src/redux/slices/week.slice.ts (weekInsertBelow with duplicate flag)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (canonical section uiObjects and locators; FR-SEC-001–004, FR-SEC-007–009); tests/docs/requirements/original/workflow_delete_section_requirements_v1.yaml (FR-SEC-006)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/workflow'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published

