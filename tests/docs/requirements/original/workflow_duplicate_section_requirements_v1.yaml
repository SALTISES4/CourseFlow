    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.

locatorMappings:
  workflowView:
    strategy: null
    confidence: unresolved
  workflowSectionContainer:
    strategy: "[data-week-id]"
    confidence: confirmed
  workflowSectionContainerHoverActionsMenu:
    strategy: "{workflowSectionContainer} .hover-menu"
    confidence: inferred
  workflowRightSidebar:
    strategy: "[data-test-id='sidebar']"
    confidence: confirmed
  workflowEditSectionFormDuplicateButton:
    strategy: null
    confidence: unresolved

requirements:
  - id: FR-SEC-005
    title: Duplicate section below (hover or sidebar)

    designEvidence:
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-OE-EDIT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowSectionContainer
      - workflowSectionHeader
      - workflowSectionNumberLabel
      - workflowSectionTitleText
      - workflowSectionContainerHoverActionsMenu
      - workflowSectionContainerHoverActionsMenuDuplicateItem
      - workflowRightSidebar
      - workflowEditSectionForm
      - workflowEditSectionFormTitleField
      - workflowEditSectionFormDuplicateButton

    preconditions:
      - workflowView contains at least one workflowSectionContainer
      - for the hover-menu path, workflowSectionContainerHoverActionsMenuDuplicateItem is active for the actor per this FR roleBehavior and FR-SEC-007 lockstep with FR-WF-NODE-005 in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml
      - for the sidebar path, workflowEditSectionFormDuplicateButton is active for the actor per this FR roleBehavior

    trigger:
      - user clicks workflowSectionContainerHoverActionsMenuDuplicateItem on workflowSectionContainerHoverActionsMenu visible on workflowSectionHeader hover per FR-SEC-007
      - user clicks workflowEditSectionFormDuplicateButton on workflowEditSectionForm in workflowRightSidebar

    mainFlow:
      - system identifies the source workflowSectionContainer from workflowSectionContainerHoverActionsMenuDuplicateItem on that section's workflowSectionHeader, or from workflowEditSectionForm open in workflowRightSidebar for that workflowSectionContainer
      - system creates a new workflowSectionContainer in workflowView immediately below the source workflowSectionContainer
      - system duplicates graph content from the source workflowSectionContainer into the new workflowSectionContainer (workflowNodes and their metas, associated outcomes and edges per upstream); comments on the source workflowSectionContainer are not copied
      - when workflowEditSectionFormTitleField for the source workflowSectionContainer is non-empty, the copy's workflowEditSectionFormTitleField and workflowSectionTitleText receive the source value with literal ' (copy)' appended; when the source title is empty, the copy's title is the literal ' (copy)' (leading space)
      - when the user duplicates a section whose workflowSectionTitleText already ends with ' (copy)', the new workflowSectionTitleText appends another ' (copy)' suffix (for example 'section (copy)' becomes 'section (copy) (copy)')
      - system recalculates workflowSectionNumberLabel on every workflowSectionHeader in workflowView per FR-SEC-002 in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml

    roleBehavior:
      owner:
        workflowSectionContainerHoverActionsMenuDuplicateItem: active
        workflowEditSectionFormDuplicateButton: active
      editor:
        workflowSectionContainerHoverActionsMenuDuplicateItem: active
        workflowEditSectionFormDuplicateButton: active
      commenter:
        workflowSectionContainerHoverActionsMenuDuplicateItem: readOnly
        workflowEditSectionFormDuplicateButton: readOnly
      viewer:
        workflowSectionContainerHoverActionsMenuDuplicateItem: notRendered
        workflowEditSectionFormDuplicateButton: readOnly
      user:
        workflowSectionContainerHoverActionsMenuDuplicateItem: notRendered
        workflowEditSectionFormDuplicateButton: readOnly

    acceptanceCriteria:
      - given source workflowSectionContainer S, when duplicate completes, a new workflowSectionContainer appears immediately below S in workflowView with mirrored graph content except comments
      - given workflowEditSectionFormTitleField for source workflowSectionContainer is empty, duplicated workflowSectionTitleText is the literal ' (copy)'
      - given actor is commenter with workflowSectionContainerHoverActionsMenu visible per FR-SEC-007, workflowSectionContainerHoverActionsMenuDuplicateItem is readOnly and no duplicate section is created when that control is clicked
      - given actor is viewer or user (published-access), workflowSectionContainerHoverActionsMenu is not rendered on workflowSectionHeader hover per FR-SEC-007 lockstep with FR-WF-NODE-004, so workflowSectionContainerHoverActionsMenuDuplicateItem is not reachable via the hover path

    openQuestions:
      - Deep duplication scope (nodes, edges, outcomes) is asserted in upstream FR; confirm backend contract for full parity in automated tests.
      - Global edge behavior when duplicating a section with cross-section links is summarized in FR-SEC-008 in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml; confirm duplicate-specific graph semantics in implementation.

