      - workflowSectionContainerHoverActionsMenu
      - workflowSectionContainerHoverActionsMenuCommentsItem
      - workflowRightSidebar
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent

    preconditions:
      - workflowRightSidebar is visible per tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-001
      - for the hover-menu path, workflowView shows at least one workflowSectionContainer row where workflowSectionContainerHoverActionsMenu can appear on hover
      - for the sidebar-tab path, sidebar.edit already designates a workflowSectionContainer (WEEK) for that section

    trigger:
      - user clicks workflowSectionContainerHoverActionsMenuCommentsItem on a hovered workflowSectionContainer
      - user clicks workflowRightSidebarCommentsTab while sidebar.edit designates that section (CfObjectType.WEEK)

    mainFlow:
      - system sets sidebar.edit to that workflowSectionContainer with tab 'comments' (hover path per tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml FR-SEC-007 lockstep with FR-WF-NODE-005) or switches workflowRightSidebar to workflowRightSidebarCommentsTab while preserving the WEEK selection
      - if workflowRightSidebar is collapsed, system expands workflowRightSidebar with workflowRightSidebarCommentsTab selected
      - system renders workflowRightSidebarCommentsTabContent for that workflowSectionContainer as the workflowCommentsHostObject
      - per-role actionability for workflowRightSidebarCommentsTab follows tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-003

    roleBehavior:
      owner:
        workflowSectionContainerHoverActionsMenuCommentsItem: activeWhenSectionHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      editor:
        workflowSectionContainerHoverActionsMenuCommentsItem: activeWhenSectionHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      commenter:
        workflowSectionContainerHoverActionsMenuCommentsItem: activeWhenSectionHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      viewer:
        workflowSectionContainerHoverActionsMenuCommentsItem: notRendered
        workflowRightSidebarCommentsTab: disabled
      user:
        workflowSectionContainerHoverActionsMenuCommentsItem: notRendered
        workflowRightSidebarCommentsTab: disabledWhenPublishedParentProject

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and the user clicks workflowSectionContainerHoverActionsMenuCommentsItem on a hovered section S, workflowRightSidebar shows workflowRightSidebarCommentsTab selected and workflowRightSidebarCommentsTabContent is bound to section S
      - given actor is owner, editor, or commenter and sidebar.edit targets section S (WEEK), when the user clicks workflowRightSidebarCommentsTab, workflowRightSidebarCommentsTabContent is bound to section S

    openQuestions:
      - Confirm section hover menu role gating matches FR-SEC-007 lockstep to FR-WF-NODE-005 for every actor (hover Comments affordance vs sidebar tab).
      - Confirm dedicated Figma frames for section-hosted comments or inherit node Comments chrome.
      - Legacy Playwright traceability used FR-SEC-011 for section comment hover; use this FR (FR-WF-COMMENTS-002) as the normative requirement id going forward.

