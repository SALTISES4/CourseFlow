# Normalized requirements: workflowRightSidebarCommentsTab — comments for workflow hosts (nodes, channels, sections, outcomes)
# Scope: workflowRightSidebarCommentsTabContent for any workflowCommentsHostObject whose type is one of NODE, COLUMN, WEEK, or OUTCOME (NODE → workflowNode, COLUMN → workflowChannel, WEEK → workflowSectionContainer, OUTCOME → workflowOutcome). FR-WF-COMMENTS-001 through FR-WF-COMMENTS-004 each normalize how to open comments for one host type; FR-WF-COMMENTS-005 binds that host to sidebar.edit and the Edit tab; FR-WF-COMMENTS-006 and FR-WF-COMMENTS-007 normalize compose and delete; FR-WF-COMMENTS-008 normalizes the comments-presence indicator on hover action menus. Archive and product intent: commenting works the same way for every host type (list, composer, plain text, own-comment delete); only entry paths differ. Same bind/rebind vocabulary as workflow_edit_node_requirements_v1.yaml FR-WF-EN-001 for sidebar.edit targets where applicable.
# Source (product): tests/docs/__ARCHIVE/functional-requirements.md — Commenting (comments on Nodes, Channels, Sections, Outcomes, Permissions; roles Owner/Editor/Commentor add and view; plain text; own-comment delete; Owner-only delete of others' comments — lines 91–107); Node/Channel/Section references in the same archive; Workflow sidebar matrix Comment tab visibility (lines 1273–1276).
# Source (design): Figma CourseFlow 2.0 — comment section frames for owner/editor, commenter, and viewer for node context (see designEvidenceLinkTable); other host types are assumed to reuse the same Comments chrome until separate design evidence exists.
# Normative entry-path cross-references: tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-005 (node hover); tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml FR-SEC-007 (section hover lockstep); tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml FR-CHAN-007 (channel hover lockstep); Outcomes view — outcome header hover comments entry (align with FR-WF-COMMENTS-004 when outcome hover menu is normalized).
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/guidelines_functional_requirements.md; tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar, FR-WF-RS-002, FR-WF-RS-003); tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (FR-WF-NODE-005); tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml (workflowEditNodeForm / sidebar.edit binding per FR-WF-EN-001); tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml (workflowChannel); tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (workflowSectionContainer); tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml (workflowChannelHoverActionsMenu — FR-CHAN-007).
#
# IMPORTANT: Gaps vs design and archive are called out per FR (mock data, placeholder author strings, moderation delete, comments-presence indicator on hover menus). Figma frames anchor owner/editor vs commenter vs viewer layouts; where product behavior is still undecided, openQuestions record the delta.

documentPreconditions:
  - user is authenticated to CourseFlow and on an existing workflow route
  - workflowRightSidebar is visible per tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-001
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published

