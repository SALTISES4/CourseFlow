    acceptanceCriteria:
      - given actor is owner, editor, or commenter and the user clicks workflowOutcomeHoverActionsMenuCommentsItem on a hovered outcome O, workflowRightSidebar shows workflowRightSidebarCommentsTab selected and workflowRightSidebarCommentsTabContent is bound to outcome O
      - given actor is owner, editor, or commenter and sidebar.edit targets outcome O (OUTCOME), when the user clicks workflowRightSidebarCommentsTab, workflowRightSidebarCommentsTabContent is bound to outcome O

    openQuestions:
      - Confirm whether LinkedOutcomes vs OutcomeTree headers must be distinguished as separate ui surfaces for tests, or a single workflowOutcomeHoverActionsMenu abstraction suffices.
      - Confirm dedicated Figma frames for outcome-hosted comments or inherit node Comments chrome.

  - id: FR-WF-COMMENTS-005
    title: Comments tab host matches sidebar selection and Edit tab content

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - FIGMA-WF-COMMENTS-NODE-COMMENTER
      - FIGMA-WF-COMMENTS-NODE-VIEWER

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowCommentsHostObject
      - workflowNode
      - workflowChannel
      - workflowSectionContainer
      - workflowOutcome
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowEditNodeForm

    preconditions:
      - workflowRightSidebar is visible per tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-001
      - user has opened workflowRightSidebarCommentsTabContent for a workflowCommentsHostObject H via FR-WF-COMMENTS-001, FR-WF-COMMENTS-002, FR-WF-COMMENTS-003, or FR-WF-COMMENTS-004 (or an equivalent dispatch that sets sidebar.edit to H with tab 'comments')

    trigger:
      - user views workflowRightSidebarCommentsTabContent after opening comments for host H
      - user clicks workflowRightSidebarEditTab after opening comments for host H

    mainFlow:
      - sidebar.edit identifies workflowCommentsHostObject H shown in workflowRightSidebarCommentsTabContent (same id and CfObjectType as the thread being listed and composed)
      - when the user clicks workflowRightSidebarEditTab, workflowRightSidebarEditTabContent shows the edit surface for the same H per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-001 when H is a workflowNode (workflowEditNodeForm targets that workflowNode); when H is a workflowChannel, workflowSectionContainer, or workflowOutcome, workflowRightSidebarEditTabContent shows the corresponding edit surface for that same sidebar.edit target (canonical detail in workflow_edit_node_requirements_v1.yaml and related requirement sets for non-node hosts)
      - viewer and user cannot reach this state for a comments-eligible host per tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-003

    roleBehavior:
      owner:
        workflowRightSidebarCommentsTabContent: readWrite
      editor:
        workflowRightSidebarCommentsTabContent: readWrite
      commenter:
        workflowRightSidebarCommentsTabContent: readWrite
      viewer:
        workflowRightSidebarCommentsTabContent: notReachable
      user:
        workflowRightSidebarCommentsTabContent: notReachable

    acceptanceCriteria:
      - given workflowEditNodeForm was showing workflowNode N1 and the user opens comments for workflowNode N2 via FR-WF-COMMENTS-001, workflowRightSidebarCommentsTabContent is bound to N2 and sidebar.edit targets N2 so that when the user clicks workflowRightSidebarEditTab, workflowEditNodeForm targets workflowNode N2 per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-001
      - given sidebar.edit targets a workflowChannel, workflowSectionContainer, or workflowOutcome and the user opened comments for that host via FR-WF-COMMENTS-002, FR-WF-COMMENTS-003, or FR-WF-COMMENTS-004, when the user clicks workflowRightSidebarEditTab, workflowRightSidebarEditTabContent reflects the same host identity as the comments thread (no stale selection from a previously focused object)

    openQuestions:
      - Enumerate acceptance fixtures for non-node edit surfaces (channel rename, section settings, outcome fields) when asserting 'same host' after switching tabs.

  - id: FR-WF-COMMENTS-006
    title: Add a new comment in workflowRightSidebarCommentsTabContent

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - FIGMA-WF-COMMENTS-NODE-COMMENTER

    actors:
      - owner
      - editor
      - commenter

    uiObjects:
      - workflowRightSidebarCommentsTabContent
      - workflowCommentsHostObject
      - workflowCommentsTabTitle
      - workflowCommentsTabList
      - workflowCommentsTabListItem
      - workflowCommentsTabListItemHeader
      - workflowCommentsTabListItemBody
      - workflowCommentsTabComposer
      - workflowCommentsTabComposerTextField
      - workflowCommentsTabComposerSubmitButton

    preconditions:
      - workflowRightSidebarCommentsTabContent is bound to a workflowCommentsHostObject per FR-WF-COMMENTS-005
      - actor is owner, editor, or commenter (viewer and user cannot reach this composer per tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-003)

    trigger:
      - user types into workflowCommentsTabComposerTextField and clicks workflowCommentsTabComposerSubmitButton

    mainFlow:
      - workflowRightSidebarCommentsTabContent is laid out vertically as workflowCommentsTabTitle, then workflowCommentsTabList (scrollable), then workflowCommentsTabComposer pinned at the bottom
      - workflowCommentsTabTitle text is the literal 'Comments'
      - workflowCommentsTabList renders zero or more workflowCommentsTabListItem entries for the bound workflowCommentsHostObject, in chronological order (oldest first)
      - each workflowCommentsTabListItem shows workflowCommentsTabListItemHeader on the first line and workflowCommentsTabListItemBody beneath; workflowCommentsTabListItemHeader format is exactly '{author-label} • {date-label}' with author-label 'Me' for the current actor's own comments and the author's name otherwise
      - workflowCommentsTabComposer contains workflowCommentsTabComposerTextField with label 'Comment' (multiline, up to 5 visible rows before internal scroll) and workflowCommentsTabComposerSubmitButton with literal label 'Comment'
      - while the user types, workflowCommentsTabComposerTextField updates; workflowCommentsTabComposerSubmitButton remains enabled
      - when the user clicks workflowCommentsTabComposerSubmitButton and workflowCommentsTabComposerTextField value is empty, the click is a no-op (no new workflowCommentsTabListItem is appended)
      - when the user clicks workflowCommentsTabComposerSubmitButton and workflowCommentsTabComposerTextField value is non-empty, system appends a new workflowCommentsTabListItem with author equal to the current actor, a canonical recent date-label, and body equal to the submitted text
      - after a successful submit, workflowCommentsTabComposerTextField is reset to empty and workflowCommentsTabList scrolls to make the newly-appended workflowCommentsTabListItem visible

    roleBehavior:
      owner:
        workflowCommentsTabComposer: editable
      editor:
        workflowCommentsTabComposer: editable
      commenter:
        workflowCommentsTabComposer: editable

    acceptanceCriteria:
      - given workflowRightSidebarCommentsTabContent is bound to a workflowCommentsHostObject, workflowCommentsTabTitle text is exactly 'Comments'
      - given workflowCommentsTabComposerTextField is empty, when the user clicks workflowCommentsTabComposerSubmitButton, no new workflowCommentsTabListItem is appended to workflowCommentsTabList
      - given workflowCommentsTabComposerTextField value is 'Hello', when the user clicks workflowCommentsTabComposerSubmitButton, a new workflowCommentsTabListItem appears at the end of workflowCommentsTabList with workflowCommentsTabListItemBody text 'Hello' and workflowCommentsTabListItemHeader author-label 'Me'
      - given a successful submit, workflowCommentsTabComposerTextField is reset to empty after the new workflowCommentsTabListItem is appended

    openQuestions:
      - Confirm canonical chronological ordering of workflowCommentsTabList items (oldest first vs newest first; whether the list auto-scrolls to the latest on initial render).
      - Confirm whether workflowCommentsTabComposerSubmitButton should be disabled when workflowCommentsTabComposerTextField is empty, or remain enabled with a no-op submit.
      - Confirm persistence on submit (whether comments persist to the server and how the list is sourced before persistence exists).
      - Confirm canonical author label for newly-submitted comments (including placeholder handling until profiles are finalized).

  - id: FR-WF-COMMENTS-007
    title: Delete an own comment from workflowCommentsTabList

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - FIGMA-WF-COMMENTS-NODE-COMMENTER

    actors:
      - owner
      - editor
      - commenter

    uiObjects:
      - workflowRightSidebarCommentsTabContent
      - workflowCommentsTabList
      - workflowCommentsTabListItem
      - workflowCommentsTabListItemDeleteLink

    preconditions:
      - workflowRightSidebarCommentsTabContent is bound to a workflowCommentsHostObject per FR-WF-COMMENTS-005
      - workflowCommentsTabList contains at least one workflowCommentsTabListItem authored by the current actor

    trigger:
      - user clicks workflowCommentsTabListItemDeleteLink on a workflowCommentsTabListItem they authored

    mainFlow:
      - system removes the target workflowCommentsTabListItem from workflowCommentsTabList immediately, without showing a confirmation dialog
      - other workflowCommentsTabListItem entries are not affected
      - workflowCommentsTabComposer state is not affected by a delete

    roleBehavior:
      owner:
        workflowCommentsTabListItemDeleteLink: visibleOnOwnComment
      editor:
        workflowCommentsTabListItemDeleteLink: visibleOnOwnComment
      commenter:
        workflowCommentsTabListItemDeleteLink: visibleOnOwnComment

    acceptanceCriteria:
      - given a workflowCommentsTabListItem authored by another user, workflowCommentsTabListItemDeleteLink is not rendered on that item
      - given a workflowCommentsTabListItem authored by the current actor and the user clicks its workflowCommentsTabListItemDeleteLink, the item is removed from workflowCommentsTabList immediately and no confirmation dialog is shown

    openQuestions:
      - Confirm whether deletion requires a confirmation dialog (immediate delete vs confirm step).
      - Confirm whether owners and editors can delete other users' comments (moderation); today only own-comment delete is specified in acceptance criteria.

  - id: FR-WF-COMMENTS-008
    title: Comments presence indicator on host hover action menus

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowCommentsHostObject
      - workflowCommentsPresenceIndicator
      - workflowNodeHoverActionsMenu
      - workflowNodeHoverActionsMenuCommentsItem
      - workflowSectionContainerHoverActionsMenu
      - workflowSectionContainerHoverActionsMenuCommentsItem
      - workflowChannelHoverActionsMenu
      - workflowChannelHoverActionsMenuCommentsItem
      - workflowOutcomeHoverActionsMenu
      - workflowOutcomeHoverActionsMenuCommentsItem

    preconditions:
      - workflowCommentsHostObject H is displayed in workflowView or Outcomes view with its hover actions menu available on hover (per FR-WF-NODE-005 for workflowNode; analogous hover for other hosts)
      - the canonical comment count for H is at least one (persisted or session-local per product decision)

    trigger:
      - user hovers the host surface so the relevant hover actions menu is visible

    mainFlow:
      - when H has at least one comment, the Comments affordance in that host's hover actions menu (workflowNodeHoverActionsMenuCommentsItem, workflowSectionContainerHoverActionsMenuCommentsItem, workflowChannelHoverActionsMenuCommentsItem, or workflowOutcomeHoverActionsMenuCommentsItem) shows workflowCommentsPresenceIndicator as a green circular badge on or adjacent to the comment icon
      - when H has zero comments, workflowCommentsPresenceIndicator is not shown on that Comments affordance

    roleBehavior:
      owner:
        workflowCommentsPresenceIndicator: visibleWhenCommentsExist
      editor:
        workflowCommentsPresenceIndicator: visibleWhenCommentsExist
      commenter:
        workflowCommentsPresenceIndicator: visibleWhenCommentsExist
      viewer:
        workflowCommentsPresenceIndicator: notRendered
      user:
        workflowCommentsPresenceIndicator: notRendered

    acceptanceCriteria:
      - given workflowNode N has at least one comment, when the user hovers N and workflowNodeHoverActionsMenu is visible, workflowNodeHoverActionsMenuCommentsItem shows workflowCommentsPresenceIndicator
      - given workflowNode N has zero comments, when the user hovers N and workflowNodeHoverActionsMenu is visible, workflowNodeHoverActionsMenuCommentsItem does not show workflowCommentsPresenceIndicator
      - given the same count rules, workflowSectionContainerHoverActionsMenuCommentsItem, workflowChannelHoverActionsMenuCommentsItem, and workflowOutcomeHoverActionsMenuCommentsItem each show or hide workflowCommentsPresenceIndicator consistently for their respective hosts

    openQuestions:
      - Confirm whether host hover menus render workflowCommentsPresenceIndicator as specified; finalize green token, size, and stacking order versus the comment icon.
      - Confirm whether the indicator reflects only top-level thread count for H or includes replies if threading is introduced later.

