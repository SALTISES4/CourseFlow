        workflowChannelHoverActionsMenuCommentsItem: activeWhenChannelHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      editor:
        workflowChannelHoverActionsMenuCommentsItem: activeWhenChannelHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      commenter:
        workflowChannelHoverActionsMenuCommentsItem: activeWhenChannelHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      viewer:
        workflowChannelHoverActionsMenuCommentsItem: notRendered
        workflowRightSidebarCommentsTab: disabled
      user:
        workflowChannelHoverActionsMenuCommentsItem: notRendered
        workflowRightSidebarCommentsTab: disabledWhenPublishedParentProject

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and the user clicks workflowChannelHoverActionsMenuCommentsItem on a hovered channel C, workflowRightSidebar shows workflowRightSidebarCommentsTab selected and workflowRightSidebarCommentsTabContent is bound to channel C
      - given actor is owner, editor, or commenter and sidebar.edit targets channel C (COLUMN), when the user clicks workflowRightSidebarCommentsTab, workflowRightSidebarCommentsTabContent is bound to channel C

    openQuestions:
      - Confirm whether workflowChannelHoverActionsMenuCommentsItem is hidden for viewer and user the same way workflowNodeHoverActionsMenuCommentsItem is hidden per FR-WF-NODE-005; roleBehavior assumes parity — verify channel hover menu against product policy.
      - Confirm dedicated Figma frames for channel-hosted comments or inherit node Comments chrome.

  - id: FR-WF-COMMENTS-004
    title: Open comments for a workflowOutcome (trigger paths)

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowOutcome
      - workflowOutcomeHoverActionsMenu
      - workflowOutcomeHoverActionsMenuCommentsItem
      - workflowRightSidebar
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent

    preconditions:
      - workflowRightSidebar is visible per tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-001
      - user is in an Outcomes workspace view where outcome headers render workflowOutcomeHoverActionsMenu on hover
      - for the sidebar-tab path, sidebar.edit already designates a workflowOutcome (OUTCOME)

    trigger:
      - user clicks workflowOutcomeHoverActionsMenuCommentsItem on a hovered outcome header
      - user clicks workflowRightSidebarCommentsTab while sidebar.edit designates that outcome (CfObjectType.OUTCOME)

    mainFlow:
      - system sets sidebar.edit to that workflowOutcome with tab 'comments' (hover path from the outcome header comments affordance in Outcomes view) or switches workflowRightSidebar to workflowRightSidebarCommentsTab while preserving the OUTCOME selection
      - if workflowRightSidebar is collapsed, system expands workflowRightSidebar with workflowRightSidebarCommentsTab selected
      - system renders workflowRightSidebarCommentsTabContent for that workflowOutcome as the workflowCommentsHostObject
      - per-role actionability for workflowRightSidebarCommentsTab follows tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-003

    roleBehavior:
      owner:
        workflowOutcomeHoverActionsMenuCommentsItem: activeWhenOutcomeHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      editor:
        workflowOutcomeHoverActionsMenuCommentsItem: activeWhenOutcomeHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      commenter:
        workflowOutcomeHoverActionsMenuCommentsItem: activeWhenOutcomeHovered
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      viewer:
