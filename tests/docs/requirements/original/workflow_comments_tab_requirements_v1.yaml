requirements:
  - id: FR-WF-COMMENTS-001
    title: Open comments for a workflowNode (trigger paths)

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - FIGMA-WF-COMMENTS-NODE-COMMENTER
      - FIGMA-WF-COMMENTS-NODE-VIEWER

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowNode
      - workflowNodeHoverActionsMenu
      - workflowNodeHoverActionsMenuCommentsItem
      - workflowRightSidebar
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent

    preconditions:
      - workflowRightSidebar is visible per tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-001
      - for the hover-menu path, workflowView is rendered with at least one workflowNode and the user can hover that workflowNode so workflowNodeHoverActionsMenu is shown per tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-005
      - for the sidebar-tab path, sidebar.edit already designates a workflowNode (CfObjectType.NODE) before the user clicks workflowRightSidebarCommentsTab

    trigger:
      - user clicks workflowNodeHoverActionsMenuCommentsItem on a hovered workflowNode
      - user clicks workflowRightSidebarCommentsTab while sidebar.edit designates a workflowNode (CfObjectType.NODE)

    mainFlow:
      - system sets sidebar.edit to that workflowNode with tab 'comments' (hover path per tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-005) or switches workflowRightSidebar to workflowRightSidebarCommentsTab while preserving the NODE selection (tab path)
      - if workflowRightSidebar is collapsed, system expands workflowRightSidebar with workflowRightSidebarCommentsTab selected
      - if workflowRightSidebar is open on a different tab, system switches to workflowRightSidebarCommentsTab
      - system renders workflowRightSidebarCommentsTabContent for that workflowNode as the workflowCommentsHostObject
      - per-role actionability for workflowNodeHoverActionsMenuCommentsItem follows tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-005; per-role actionability for workflowRightSidebarCommentsTab follows tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-003

    roleBehavior:
      owner:
        workflowNodeHoverActionsMenuCommentsItem: active
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      editor:
        workflowNodeHoverActionsMenuCommentsItem: active
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      commenter:
        workflowNodeHoverActionsMenuCommentsItem: active
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
      viewer:
        workflowNodeHoverActionsMenuCommentsItem: notRendered
        workflowRightSidebarCommentsTab: disabled
      user:
        workflowNodeHoverActionsMenuCommentsItem: notRendered
        workflowRightSidebarCommentsTab: disabledWhenPublishedParentProject

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and the user clicks workflowNodeHoverActionsMenuCommentsItem on hovered workflowNode N, workflowRightSidebar shows workflowRightSidebarCommentsTab selected and workflowRightSidebarCommentsTabContent is bound to workflowNode N
      - given actor is owner, editor, or commenter and sidebar.edit targets workflowNode N, when the user clicks workflowRightSidebarCommentsTab, workflowRightSidebarCommentsTabContent is bound to workflowNode N
      - given actor is viewer or user, workflowRightSidebarCommentsTab is not actionable per FR-WF-RS-003 and the actor cannot open workflowRightSidebarCommentsTabContent for a workflowNode via these paths

    openQuestions:
      - Align trigger copy and empty-state behavior with Figma frames (FIGMA-WF-COMMENTS-NODE-*); list data source and backend persistence for comments remain open until wired.

  - id: FR-WF-COMMENTS-002
    title: Open comments for a workflowSectionContainer (trigger paths)

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
