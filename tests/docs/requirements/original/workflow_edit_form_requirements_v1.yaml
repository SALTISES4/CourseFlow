# Normalized requirements: edit workflow form (modal)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Workflow metadata)
# Application code evidence: react/src/components/common/dialog/Workflow/WorkflowEditDialog/index.tsx
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/original/context_action_bar_requirements_v1.yaml (editPencilButton on workflow routes—FR-CAB-004)
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002)
#   - tests/docs/requirements/original/workflow_create_stepped_form_requirements_v1.yaml (shared workflowTitleField and workflowDescriptionField; edit-scoped title validation in FR-WF-FORM-002 owned in this file; workflowDescriptionField rich-text editor contract in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-012)
#   - tests/docs/requirements/original/workflow_header_requirements_v1.yaml (workflowTitle update path—FR-WF-FORM-003)
#   - tests/docs/requirements/original/project_edit_form_requirements_v1.yaml (parallel edit dialog pattern for projects—FR-PROJ-FORM-003, FR-PROJ-FORM-006, FR-PROJ-FORM-007; edit-scoped title validation in FR-WF-FORM-002 owned in this file)

documentPreconditions:
  - user is authenticated to CourseFlow
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project of the workflow on any route matching '/workflow/{id}/*', or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - routes matching '/workflow/{id}/*' include '/workflow/{id}' (empty suffix) and '/workflow/{id}/<sub-view>' for any sub-view
  - requirements in this file assume the above hold; when they do not, assert per tests/docs/requirements/original/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002

uiObjectDefinitions:
  editPencilButton:
    meaning: Canonical definition in context_action_bar_requirements_v1.yaml.
  editWorkflowDialog:
    meaning: Modal dialog for editing workflow title and description.
  workflowEditForm:
    meaning: Form inside editWorkflowDialog containing workflowTitleField and workflowDescriptionField.
  editWorkflowFormDialogTitle:
    meaning: Accessible title on editWorkflowDialog using the 'Edit [workflow type]' pattern.
  workflowTitleField:
    meaning: Canonical definition in workflow_create_stepped_form_requirements_v1.yaml.
  workflowDescriptionField:
    meaning: Canonical definition in workflow_create_stepped_form_requirements_v1.yaml.
  workflowFormFieldValidationMessage:
    meaning: Inline helper or error text shown on workflowTitleField when edit validation fails.
  editWorkflowFormCancelButton:
    meaning: Cancel action on editWorkflowDialog.
  editWorkflowFormSubmitButton:
    meaning: Submit action on editWorkflowDialog.
  workflowTitle:
    meaning: Canonical definition in workflow_header_requirements_v1.yaml.
  globalMessageSnackbar:
    meaning: Canonical definition in workflow_header_requirements_v1.yaml.

locatorMappings:
  editPencilButton: "canonical_locators.yaml -> editPencilButton"
  editWorkflowDialog: "canonical_locators.yaml -> editWorkflowDialog"
  workflowEditForm: "canonical_locators.yaml -> workflowEditForm"
  editWorkflowFormDialogTitle: "canonical_locators.yaml -> editWorkflowFormDialogTitle"
  workflowTitleField: "canonical_locators.yaml -> workflowTitleField"
  workflowDescriptionField: "canonical_locators.yaml -> workflowDescriptionField"
  editWorkflowFormCancelButton: "canonical_locators.yaml -> editWorkflowFormCancelButton"
  editWorkflowFormSubmitButton: "canonical_locators.yaml -> editWorkflowFormSubmitButton"
  workflowFormFieldValidationMessage: "canonical_locators.yaml -> workflowFormFieldValidationMessage"
  workflowTitle: "canonical_locators.yaml -> workflowTitle"
  globalMessageSnackbar: "canonical_locators.yaml -> globalMessageSnackbar"

requirements:
  - id: FR-WF-FORM-001
    title: Edit workflow dialog layout, prefilled fields, and cancel

    designEvidence:
      - FIGMA-CAB-WF-OVERVIEW
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - editPencilButton
      - editWorkflowDialog
      - workflowEditForm
      - editWorkflowFormDialogTitle
      - workflowTitleField
      - workflowDescriptionField
      - editWorkflowFormCancelButton
      - editWorkflowFormSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - FR-CAB-004 preconditions hold
      - workflow being edited already exists
      - current route matches route pattern '/workflow/{id}' or '/workflow/{id}/...' (workflow sub-views such as overview or outcomes)

    trigger:
      - owner or editor clicks editPencilButton on contextActionBar
      - owner or editor clicks editWorkflowFormCancelButton while editWorkflowDialog is open

    mainFlow:
      - editPencilButton actionability conforms to roleBehavior for this FR
      - given actor is owner or editor and clicks editPencilButton, system opens editWorkflowDialog
      - editWorkflowDialog presents workflowEditForm with editWorkflowFormDialogTitle matching the 'Edit [workflow type]' template after lowercase substitution for that workflow's type label
      - workflowTitleField and workflowDescriptionField are prefilled from loaded workflow data
      - editWorkflowFormSubmitButton shows label matching the 'Update [workflow type]' template after the same lowercase substitution for that workflow's type label
      - given editWorkflowDialog is open with prefilled values and no field has been changed from those values, editWorkflowFormSubmitButton is disabled and not clickable
      - editWorkflowFormSubmitButton enablement after field changes follows FR-WF-FORM-002
      - given owner or editor clicks editWorkflowFormCancelButton while editWorkflowDialog is open, cancel behavior conforms to acceptanceCriteria for this FR
      - save behavior on editWorkflowFormSubmitButton is specified in FR-WF-FORM-003

    roleBehavior:
      owner:
        editPencilButton: available
      editor:
        editPencilButton: available
      viewer:
        editPencilButton: disabled
      commenter:
        editPencilButton: disabled
      user:
        editPencilButton: disabled

    acceptanceCriteria:
      - given actor is owner or editor, editPencilButton is clickable and actor can open editWorkflowDialog via trigger
      - given editPencilButton actionability is disabled per roleBehavior for this FR, editWorkflowDialog does not open when actor attempts to click editPencilButton
      - given actor is owner or editor and FR-WF-FORM-001 preconditions hold and trigger fires, editWorkflowDialog is open
      - editWorkflowFormDialogTitle matches the 'Edit [workflow type]' pattern with lowercase type substitution for the workflow instance
      - editWorkflowFormSubmitButton is visible with label matching the 'Update [workflow type]' template after the same lowercase substitution for that workflow's type label
      - workflowTitleField and workflowDescriptionField show values from the workflow being edited after load
      - editWorkflowFormCancelButton and editWorkflowFormSubmitButton are visible
      - given editWorkflowDialog is open with prefilled values and no field has been changed from those values, editWorkflowFormSubmitButton is disabled and not clickable
      - editWorkflowFormSubmitButton enablement after field changes conforms to FR-WF-FORM-002
      - given owner or editor clicks editWorkflowFormCancelButton while editWorkflowDialog is open with no field changes from loaded values, editWorkflowDialog closes, current route/view is unchanged from immediately before opening editWorkflowDialog, and workflowTitleField and workflowDescriptionField on the workflow being edited are unchanged from immediately before opening editWorkflowDialog
      - given owner or editor clicks editWorkflowFormCancelButton while editWorkflowDialog is open after changing workflowEditForm fields from loaded values, editWorkflowDialog closes and workflowTitleField and workflowDescriptionField on the workflow being edited are unchanged from immediately before opening editWorkflowDialog
      - given owner or editor clicks editWorkflowFormCancelButton after changing workflowEditForm fields from loaded values, then opens editWorkflowDialog again via editPencilButton, workflowTitleField and workflowDescriptionField show values from the workflow being edited unchanged from immediately before the cancelled edit attempt
      - save outcomes on editWorkflowFormSubmitButton conform to FR-WF-FORM-003

    openQuestions: []

  - id: FR-WF-FORM-002
    title: Edit workflow form inline title validation

    designEvidence:
      - FIGMA-CAB-WF-OVERVIEW
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS

    actors:
      - owner
      - editor

    uiObjects:
      - editWorkflowDialog
      - workflowEditForm
      - workflowTitleField
      - workflowDescriptionField
      - workflowFormFieldValidationMessage
      - editWorkflowFormSubmitButton

    preconditions:
      - editWorkflowDialog is open per FR-WF-FORM-001
      - workflowEditForm is visible

    trigger:
      - owner or editor edits workflowTitleField or workflowDescriptionField

    mainFlow:
      - workflowTitleField is required and must be non-empty after trim
      - workflowDescriptionField is optional; empty or cleared description is valid on submit
      - when workflowTitleField is empty after trim, workflowFormFieldValidationMessage is visible on workflowTitleField with copy exactly 'Title is required'
      - editWorkflowFormSubmitButton stays disabled and not clickable until workflowTitleField satisfies the rule above and at least one field has changed from loaded values per FR-WF-FORM-001
      - editWorkflowDialog remains open while workflowFormFieldValidationMessage is visible for workflowTitleField

    roleBehavior: {}

    acceptanceCriteria:
      - given workflowTitleField is empty after trim, workflowFormFieldValidationMessage is visible with copy exactly 'Title is required'
      - given owner or editor has changed at least one field from loaded values and workflowTitleField is non-empty after trim, editWorkflowFormSubmitButton is enabled and clickable (including when workflowDescriptionField is empty)
      - given workflowFormFieldValidationMessage is visible for workflowTitleField, editWorkflowDialog remains open

    openQuestions: []

  - id: FR-WF-FORM-003
    title: Edit workflow save behavior and feedback

    designEvidence:
      - FIGMA-CAB-WF-OVERVIEW
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS

    actors:
      - owner
      - editor

    uiObjects:
      - editWorkflowDialog
      - workflowEditForm
      - workflowTitleField
      - workflowDescriptionField
      - editWorkflowFormSubmitButton
      - workflowTitle
      - globalMessageSnackbar

    preconditions:
      - workflow being edited already exists
      - editWorkflowDialog is open per FR-WF-FORM-001
      - workflowEditForm is visible
      - workflowTitleField and workflowDescriptionField show values from the workflow being edited per FR-WF-FORM-001
      - editWorkflowFormSubmitButton is enabled and clickable per FR-WF-FORM-001 and FR-WF-FORM-002

    trigger:
      - owner or editor clicks editWorkflowFormSubmitButton

    mainFlow:
      - given successful submit, system updates workflow title and description matching workflowTitleField and workflowDescriptionField immediately before submit, closes editWorkflowDialog, owner or editor remains on the same route/view as before submit, and globalMessageSnackbar shows copy matching 'Your [workflow type] has been successfully updated' after substituting that workflow's user-visible type label for '[workflow type]' (same rule as editWorkflowFormDialogTitle in FR-WF-FORM-001)
      - given failed submit, editWorkflowDialog remains open, workflowTitleField and workflowDescriptionField retain values from immediately before submit, editWorkflowFormSubmitButton is enabled and clickable, and globalMessageSnackbar shows copy matching 'We encountered an issue and your [workflow type] was not updated' after substituting that workflow's user-visible type label for '[workflow type]' (same rule as editWorkflowFormDialogTitle in FR-WF-FORM-001)

    roleBehavior: {}

    acceptanceCriteria:
      - given successful submit, editWorkflowDialog is not visible
      - given successful submit, current route/view is unchanged from immediately before submit
      - given successful submit, updated workflow title matches workflowTitleField value from immediately before submit
      - given successful submit, updated workflow description matches workflowDescriptionField value from immediately before submit (including empty)
      - given successful submit, workflowTitle on workflowHeader matches workflowTitleField value from immediately before submit
      - given successful submit, globalMessageSnackbar shows copy matching 'Your [workflow type] has been successfully updated' after substituting that workflow's user-visible type label for '[workflow type]' (same rule as editWorkflowFormDialogTitle in FR-WF-FORM-001)
      - given failed submit, editWorkflowDialog remains open
      - given failed submit, workflowTitleField and workflowDescriptionField retain values from immediately before submit
      - given failed submit, editWorkflowFormSubmitButton is enabled and clickable
      - given failed submit, globalMessageSnackbar shows copy matching 'We encountered an issue and your [workflow type] was not updated' after substituting that workflow's user-visible type label for '[workflow type]' (same rule as editWorkflowFormDialogTitle in FR-WF-FORM-001)

    openQuestions: []

