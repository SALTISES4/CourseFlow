# Normalized requirements: workspace route access denial (project and workflow)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Published Projects; permissions); Figma no-access frames (project and workflow)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/original/project_overview_requirements_v1.yaml (publish/unpublish—FR-PROJ-OV-003; contributor remove—FR-PROJ-OV-002; documentPreconditions for in-scope project overview tests)
#   - tests/docs/requirements/original/project_archive_requirements_v1.yaml (archive-triggered unpublish—FR-PROJ-ARCH-003 side effect via FR-PROJ-OV-003; mid-session archive eviction—FR-WS-ACCESS-005)
#   - tests/docs/requirements/original/workflow_archive_requirements_v1.yaml (single-workflow archive—FR-WF-ARCH-003; mid-session archive eviction—FR-WS-ACCESS-005)
#   - tests/docs/requirements/original/card_content_requirements_v1.yaml (archived objects not browsable—FR-CARD-006)
#   - tests/docs/requirements/original/project_header_requirements_v1.yaml (projectHeader — not rendered when access denied)
#   - tests/docs/requirements/original/project_workflows_view_requirements_v1.yaml (projectWorkflowsView — not rendered when access denied)
#   - tests/docs/requirements/original/context_action_bar_requirements_v1.yaml (contextActionBar — not rendered when access denied)
#   - tests/docs/requirements/original/workflow_header_requirements_v1.yaml (workflowHeader — not rendered when access denied)
#   - tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (linked-workflow new-tab — FR-WF-NODE-001; workflow denial when FR-WS-ACCESS-002 preconditions apply)

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  projectAccessDeniedView:
    meaning: Full-page project 'no access' presentation when the authenticated user cannot view the requested project workspace route.
  projectAccessDeniedTitle:
    meaning: Title heading on projectAccessDeniedView for the project no-access state.
  projectAccessDeniedSubtitle:
    meaning: Subtitle body copy on projectAccessDeniedView below projectAccessDeniedTitle.
  workflowAccessDeniedView:
    meaning: Full-page workflow 'no access' presentation when the authenticated user cannot view any workflow workspace route matching '/workflow/{id}/*'.
  workflowAccessDeniedTitle:
    meaning: Title heading on workflowAccessDeniedView for the workflow no-access state.
  workflowAccessDeniedSubtitle:
    meaning: Subtitle body copy on workflowAccessDeniedView below workflowAccessDeniedTitle.

locatorMappings:
  projectAccessDeniedView: "canonical_locators.yaml -> projectAccessDeniedView"
  projectAccessDeniedTitle: "canonical_locators.yaml -> projectAccessDeniedTitle"
  projectAccessDeniedSubtitle: "canonical_locators.yaml -> projectAccessDeniedSubtitle"
  workflowAccessDeniedView: "canonical_locators.yaml -> workflowAccessDeniedView"
  workflowAccessDeniedTitle: "canonical_locators.yaml -> workflowAccessDeniedTitle"
  workflowAccessDeniedSubtitle: "canonical_locators.yaml -> workflowAccessDeniedSubtitle"

requirements:
  - id: FR-WS-ACCESS-001
    title: Denied access — non-contributor on unpublished project routes

    designEvidence:
      - FIGMA-WS-ACCESS-PROJECT-NO-ACCESS

    actors:
      - user

    uiObjects:
      - projectAccessDeniedView
      - projectAccessDeniedTitle
      - projectAccessDeniedSubtitle

    preconditions:
      - user is authenticated to CourseFlow
      - actor has no owner, editor, viewer, or commenter role on the target project (not a project contributor; on positive-path specs this actor is labeled user per tests/docs/requirements/original/project_overview_requirements_v1.yaml documentPreconditions)
      - target project is unpublished

    trigger:
      - user navigates directly to any route matching '/project/{id}/*' for that project

    mainFlow:
      - this FR is the negative path when tests/docs/requirements/original/project_header_requirements_v1.yaml documentPreconditions fail — contributor roles (owner, editor, viewer, commenter) may access unpublished projects on any route matching '/project/{id}/*'; non-contributors may access only published projects
      - system does not render project workspace chrome for the requested project — projectHeader, contextActionBar, and any project sub-view content under '/project/{id}/*' are not visible
      - system renders projectAccessDeniedView per FIGMA-WS-ACCESS-PROJECT-NO-ACCESS in place of the project workspace content
      - projectAccessDeniedTitle shows exactly 'No project access'
      - projectAccessDeniedSubtitle shows exactly 'This project is private. You need permission from the owner to view or edit its contents.'

    roleBehavior: {}

    acceptanceCriteria:
      - given actor has no contributor role on the target project and the project is unpublished, when user opens any route matching '/project/{id}/*', projectAccessDeniedView is visible and matches FIGMA-WS-ACCESS-PROJECT-NO-ACCESS
      - given actor has no contributor role on the target project and the project is unpublished, when user opens any route matching '/project/{id}/*', projectHeader is not visible
      - given actor has no contributor role on the target project and the project is unpublished, when user opens any route matching '/project/{id}/*', contextActionBar is not visible
      - given actor has no contributor role on the target project and the project is unpublished, when user opens any route matching '/project/{id}/*', no project sub-view content is visible
      - given actor has no contributor role on the target project and the project is unpublished, when user opens any route matching '/project/{id}/*', projectAccessDeniedTitle is visible with text exactly 'No project access'
      - given actor has no contributor role on the target project and the project is unpublished, when user opens any route matching '/project/{id}/*', projectAccessDeniedSubtitle is visible with text exactly 'This project is private. You need permission from the owner to view or edit its contents.'

    openQuestions:
      - Until dedicated projectAccessDeniedView is implemented, confirm interim mapping from API failure to ErrorView vs the designed no-access screen.

  - id: FR-WS-ACCESS-002
    title: Denied access — non-contributor on workflow routes (unpublished parent project)

    designEvidence:
      - FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS

    actors:
      - user

    uiObjects:
      - workflowAccessDeniedView
      - workflowAccessDeniedTitle
      - workflowAccessDeniedSubtitle

    preconditions:
      - user is authenticated to CourseFlow
      - actor has no owner, editor, viewer, or commenter role on the parent project of the target workflow (not a project contributor)
      - parent project of the target workflow is unpublished

    trigger:
      - user navigates directly to any route matching '/workflow/{id}/*' for a workflow whose parent project is unpublished

    mainFlow:
      - system does not render workflow workspace chrome for that workflow — workflowHeader, workflowRightSidebar, contextActionBar, and any workflow sub-view content under '/workflow/{id}/*' (including but not limited to workflowOverviewView and workflowView) are not visible
      - system renders workflowAccessDeniedView per FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS in place of the workflow workspace content
      - workflowAccessDeniedTitle shows exactly 'No workflow access'
      - workflowAccessDeniedSubtitle shows exactly 'This workflow is private. You need permission from the owner to view or edit its contents.'

    roleBehavior: {}

    acceptanceCriteria:
      - given actor has no contributor role on the parent project and the parent project is unpublished, when user opens any route matching '/workflow/{id}/*' for that workflow, workflowAccessDeniedView is visible and matches FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS
      - given actor has no contributor role on the parent project and the parent project is unpublished, when user opens any route matching '/workflow/{id}/*' for that workflow, workflowHeader and any workflow sub-view content (e.g. workflowOverviewView, workflowView) are not visible
      - given actor has no contributor role on the parent project and the parent project is unpublished, when user opens any route matching '/workflow/{id}/*' for that workflow, workflowAccessDeniedTitle is visible with text exactly 'No workflow access'
      - given actor has no contributor role on the parent project and the parent project is unpublished, when user opens any route matching '/workflow/{id}/*' for that workflow, workflowAccessDeniedSubtitle is visible with text exactly 'This workflow is private. You need permission from the owner to view or edit its contents.'

    openQuestions:
      - Until dedicated workflowAccessDeniedView is implemented, confirm interim mapping from API failure to ErrorView vs the designed no-access screen.

  - id: FR-WS-ACCESS-003
    title: Access revocation for non-contributors when parent project becomes unpublished while already in workspace

    designEvidence:
      - FIGMA-WS-ACCESS-PROJECT-NO-ACCESS
      - FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS

    actors:
      - user

    uiObjects:
      - projectAccessDeniedView
      - projectAccessDeniedTitle
      - projectAccessDeniedSubtitle
      - workflowAccessDeniedView
      - workflowAccessDeniedTitle
      - workflowAccessDeniedSubtitle

    preconditions:
      - user is authenticated to CourseFlow
      - actor has no owner, editor, viewer, or commenter role on the target project (not a project contributor; on positive-path specs this actor is labeled user per tests/docs/requirements/original/project_overview_requirements_v1.yaml documentPreconditions)
      - actor is already on a route matching '/project/{id}/*' for that project or '/workflow/{id}/*' for a workflow whose parent project is that project
      - parent project visibility was published when the actor entered the current workspace session and has since transitioned to unpublished per tests/docs/requirements/original/project_overview_requirements_v1.yaml FR-PROJ-OV-003 (direct unpublish or side effect such as project archive per tests/docs/requirements/original/project_archive_requirements_v1.yaml FR-PROJ-ARCH-003 when the project was published at archive time)

    trigger:
      - user performs an in-app action in the project or workflow workspace after the parent project has become unpublished

    mainFlow:
      - timing — access revocation is not applied while the user is idle; it is applied on the next in-app action after the parent project becomes unpublished; in-app action means route navigation within the SPA (including workflowViewTabSelector or projectViewTabSelector tab switches), click on an interactive control in the workspace shell or sub-view content, or any interaction that triggers an API request scoped to the current project or workflow workspace
      - until that next in-app action, the currently rendered project or workflow workspace may remain visible as a stale session; the client is not required to revoke access on a timer or push notification alone while the user performs no in-app action
      - contributor roles (owner, editor, viewer, commenter) are not subject to this FR; they retain access to unpublished projects on any route matching '/project/{id}/*' and child workflow routes per FR-WS-ACCESS-001 mainFlow
      - project route — when the actor's current route matches '/project/{id}/*' and the next in-app action reveals the project is unpublished, system applies the same denial presentation as FR-WS-ACCESS-001 — projectHeader, contextActionBar, and any project sub-view content under '/project/{id}/*' are not visible; projectAccessDeniedView is rendered per FIGMA-WS-ACCESS-PROJECT-NO-ACCESS; projectAccessDeniedTitle shows exactly 'No project access'; projectAccessDeniedSubtitle shows exactly 'This project is private. You need permission from the owner to view or edit its contents.'
      - workflow route — when the actor's current route matches '/workflow/{id}/*' for a workflow in that project and the next in-app action reveals the parent project is unpublished, system applies the same denial presentation as FR-WS-ACCESS-002 — workflowHeader, workflowRightSidebar, contextActionBar, and any workflow sub-view content under '/workflow/{id}/*' are not visible; workflowAccessDeniedView is rendered per FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS; workflowAccessDeniedTitle shows exactly 'No workflow access'; workflowAccessDeniedSubtitle shows exactly 'This workflow is private. You need permission from the owner to view or edit its contents.'
      - modal dismissal — when access-denied presentation replaces the workspace, any open modal or dialog scoped to that project or workflow workspace shell (including but not limited to editProjectDialog, editWorkflowDialog, addContributorsDialog, and workflow sidebar edit forms) is dismissed and is not visible on the access-denied screen

    roleBehavior: {}

    acceptanceCriteria:
      - given user is on '/workflow/{id}/graph' for workflow W in published project P, owner unpublishes P per FR-PROJ-OV-003, and user performs no further in-app action, workflow workspace chrome and workflowView may remain visible until the user's next in-app action
      - given user is on '/workflow/{id}/graph' for workflow W in published project P, owner unpublishes P, when user next performs an in-app action in the workflow workspace, workflowAccessDeniedView is visible and matches FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS, workflowHeader and workflowView are not visible, workflowAccessDeniedTitle shows 'No workflow access', and workflowAccessDeniedSubtitle shows 'This workflow is private. You need permission from the owner to view or edit its contents.'
      - given user is on '/project/{id}' for published project P, owner unpublishes P, when user next performs an in-app action in the project workspace, projectAccessDeniedView is visible and matches FIGMA-WS-ACCESS-PROJECT-NO-ACCESS, projectHeader and project sub-view content are not visible, projectAccessDeniedTitle shows 'No project access', and projectAccessDeniedSubtitle shows 'This project is private. You need permission from the owner to view or edit its contents.'
      - given user is on '/workflow/{id}/graph' for workflow W in published project P, owner unpublishes P, and user clicks workflowViewTabSelector to switch to another workflow sub-view before any other in-app action, workflowAccessDeniedView is shown per this FR on that tab switch
      - given owner or editor is on '/workflow/{id}/graph' for workflow W in project P when owner unpublishes P, when owner or editor next performs an in-app action, project and workflow workspace chrome remain visible and access-denied views are not shown
      - given user is on '/workflow/{id}/graph' for W in published P with editWorkflowDialog open, owner unpublishes P, when user next performs an in-app action, editWorkflowDialog is not visible and workflowAccessDeniedView is shown

    openQuestions: []

  - id: FR-WS-ACCESS-004
    title: Access change when a contributor is removed while already in workspace

    designEvidence:
      - FIGMA-WS-ACCESS-PROJECT-NO-ACCESS
      - FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS

    actors:
      - editor
      - viewer
      - commenter

    uiObjects:
      - projectAccessDeniedView
      - projectAccessDeniedTitle
      - projectAccessDeniedSubtitle
      - workflowAccessDeniedView
      - workflowAccessDeniedTitle
      - workflowAccessDeniedSubtitle

    preconditions:
      - user is authenticated to CourseFlow
      - actor had owner, editor, viewer, or commenter role on the target project when entering the current workspace session and has since been removed as a contributor per tests/docs/requirements/original/project_overview_requirements_v1.yaml FR-PROJ-OV-002 (this FR applies to former editor, viewer, and commenter actors; project owner cannot be removed via contributorRoleDropdown)
      - actor is already on a route matching '/project/{id}/*' for that project or '/workflow/{id}/*' for a workflow whose parent project is that project

    trigger:
      - actor performs an in-app action in the project or workflow workspace after being removed as a contributor

    mainFlow:
      - timing — access or role change is not applied while the actor is idle; it is applied on the next in-app action after contributor removal; in-app action means route navigation within the SPA (including workflowViewTabSelector or projectViewTabSelector tab switches), click on an interactive control in the workspace shell or sub-view content, or any interaction that triggers an API request scoped to the current project or workflow workspace
      - until that next in-app action, the currently rendered project or workflow workspace may remain visible with the actor's prior contributor roleBehavior as a stale session; the client is not required to apply removal on a timer or push notification alone while the actor performs no in-app action
      - scope — this FR covers contributor removal only; contributor role changes without removal (for example editor to viewer) are out of scope
      - unpublished project — when the parent project is unpublished and the next in-app action reveals the actor no longer has a contributor role, system applies the same denial presentation as FR-WS-ACCESS-001 on project routes or FR-WS-ACCESS-002 on workflow routes; modal dismissal follows FR-WS-ACCESS-003 modal dismissal bullet
      - published project — when the parent project is published and the next in-app action reveals the actor no longer has a contributor role, the actor's effective role becomes user (published-access, no explicit contributor role) per documentPreconditions in tests/docs/requirements/original/project_header_requirements_v1.yaml and tests/docs/requirements/original/workflow_header_requirements_v1.yaml; project and workflow workspace chrome remain visible; access-denied views are not shown; roleBehavior across project and workflow FRs is re-evaluated for user on and after that in-app action (read-only published-access, not contributor edit capabilities)
      - permissions panel refresh — when the parent project's contributor list changes per FR-PROJ-OV-002 (add, remove, or role edit) and an actor has workflowOverviewView open, workflowMetadataPermissionsPanel listed users and roles match the parent project's projectMetadataPermissionsPanel on that actor's next in-app action per tests/docs/requirements/original/workflow_overview_requirements_v1.yaml FR-WF-OV-007

    roleBehavior: {}

    acceptanceCriteria:
      - given editor is on '/workflow/{id}/graph' for workflow W in unpublished project P, owner removes editor via contributorRoleDropdown per FR-PROJ-OV-002, and editor performs no further in-app action, workflow workspace chrome and workflowView may remain visible until editor's next in-app action
      - given editor is on '/workflow/{id}/graph' for W in unpublished P and owner removes editor, when editor next performs an in-app action, workflowAccessDeniedView is visible per FR-WS-ACCESS-002, workflowHeader and workflowView are not visible, and copy matches FR-WS-ACCESS-002
      - given editor is on '/project/{id}' for unpublished P and owner removes editor, when editor next performs an in-app action, projectAccessDeniedView is visible per FR-WS-ACCESS-001 and projectHeader is not visible
      - given editor is on '/workflow/{id}/graph' for W in published project P and owner removes editor, when editor next performs an in-app action, workflowHeader and workflowView remain visible, workflowAccessDeniedView is not shown, and subsequent interactions follow user (published-access) roleBehavior (for example workflowEditNodeFormDuplicateButton disabled per FR-WF-DUP-001)
      - given owner has workflowOverviewView open on W and owner removes a contributor via FR-PROJ-OV-002, when owner next performs an in-app action on that Overview view, workflowMetadataPermissionsPanel listed users and roles match projectMetadataPermissionsPanel on the parent project
      - given owner or editor on '/workflow/{id}/graph' in project P is not the removed contributor, when another contributor is removed via FR-PROJ-OV-002, owner or editor next in-app action does not show access-denied views

    openQuestions: []

  - id: FR-WS-ACCESS-005
    title: Workspace eviction when project or workflow becomes archived while already in workspace

    designEvidence:
      - FIGMA-WS-ACCESS-PROJECT-NO-ACCESS
      - FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - projectAccessDeniedView
      - projectAccessDeniedTitle
      - projectAccessDeniedSubtitle
      - workflowAccessDeniedView
      - workflowAccessDeniedTitle
      - workflowAccessDeniedSubtitle

    preconditions:
      - user is authenticated to CourseFlow
      - actor is already on a route matching '/project/{id}/*' for project P or '/workflow/{id}/*' for workflow W
      - actor is not the owner who confirmed archive of P or W in the current archive action (the archiving owner is navigated away per tests/docs/requirements/original/project_archive_requirements_v1.yaml FR-PROJ-ARCH-003 or tests/docs/requirements/original/workflow_archive_requirements_v1.yaml FR-WF-ARCH-003 and is not subject to this FR)
      - P or W has become archived since the actor entered the current workspace session per FR-PROJ-ARCH-003 (whole project and all child workflows archived) or FR-WF-ARCH-003 (single workflow W archived)

    trigger:
      - actor performs an in-app action in the project or workflow workspace after P or W became archived

    mainFlow:
      - timing — workspace eviction is not applied while the actor is idle; it is applied on the next in-app action after archive completes; in-app action means route navigation within the SPA (including workflowViewTabSelector or projectViewTabSelector tab switches), click on an interactive control in the workspace shell or sub-view content, or any interaction that triggers an API request scoped to the current project or workflow workspace
      - until that next in-app action, the currently rendered project or workflow workspace may remain visible as a stale session; the client is not required to evict on a timer or push notification alone while the actor performs no in-app action
      - archived not browsable — archived projects and workflows are not accessible or browsable per tests/docs/requirements/original/card_content_requirements_v1.yaml FR-CARD-006; this FR applies that rule to actors already in workspace when archive occurs
      - relationship to FR-WS-ACCESS-003 — when project archive also unpublishes a published project per FR-PROJ-OV-003, user (published-access) actors may be subject to both FR-WS-ACCESS-003 and this FR; both resolve to access-denied presentation on the next in-app action
      - project archive — when whole project P is archived per FR-PROJ-ARCH-003 and the actor's current route matches '/project/{id}/*' for P or '/workflow/{id}/*' for any workflow in P, the next in-app action applies access-denied presentation — project routes use the same denial presentation as FR-WS-ACCESS-001 (projectAccessDeniedView per FIGMA-WS-ACCESS-PROJECT-NO-ACCESS with copy per FR-WS-ACCESS-001); workflow routes in P use the same denial presentation as FR-WS-ACCESS-002 (workflowAccessDeniedView per FIGMA-WS-ACCESS-WORKFLOW-NO-ACCESS with copy per FR-WS-ACCESS-002)
      - single-workflow archive — when workflow W is archived individually per FR-WF-ARCH-003 and the actor's current route matches '/workflow/{id}/*' for W, the next in-app action applies the same denial presentation as FR-WS-ACCESS-002; parent project routes and other non-archived child workflow routes in the same project are not affected by W's archive alone
      - modal dismissal — when access-denied presentation replaces the workspace, any open modal or dialog scoped to that project or workflow workspace shell is dismissed per FR-WS-ACCESS-003 modal dismissal bullet

    roleBehavior: {}

    acceptanceCriteria:
      - given editor is on '/workflow/{id}/graph' for W in unpublished project P, owner archives P per FR-PROJ-ARCH-003, and editor performs no further in-app action, workflow workspace chrome and workflowView may remain visible until editor's next in-app action
      - given editor is on '/workflow/{id}/graph' for W in P and owner archives P, when editor next performs an in-app action, workflowAccessDeniedView is visible per FR-WS-ACCESS-002, workflowHeader and workflowView are not visible, and copy matches FR-WS-ACCESS-002
      - given editor is on '/project/{id}/workflows' for P and owner archives P, when editor next performs an in-app action, projectAccessDeniedView is visible per FR-WS-ACCESS-001, projectHeader is not visible, and copy matches FR-WS-ACCESS-001
      - given user is on '/workflow/{id}/graph' for W in published P, owner archives P, when user next performs an in-app action, workflowAccessDeniedView is visible per FR-WS-ACCESS-002 and copy matches FR-WS-ACCESS-002
      - given editor is on '/workflow/{id}/graph' for activity A in project P, owner archives A individually per FR-WF-ARCH-003 while P remains not archived, when editor next performs an in-app action on A's route, workflowAccessDeniedView is visible per FR-WS-ACCESS-002
      - given editor is on '/workflow/{id}/graph' for course C in P and owner archives activity A individually per FR-WF-ARCH-003 where A is not C, when editor next performs an in-app action on C's route, workflow workspace chrome remains visible and workflowAccessDeniedView is not shown
      - given owner confirms archive of P or W per FR-PROJ-ARCH-003 or FR-WF-ARCH-003, owner is navigated per those FRs and is not subject to this FR's access-denied presentation on that archive action

    openQuestions: []

