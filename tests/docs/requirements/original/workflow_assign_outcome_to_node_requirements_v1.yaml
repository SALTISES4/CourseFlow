# Normalized requirements: assign workflowOutcomes to workflowNodes from workflowRightSidebarOutcomesTab in the 'Workflow' view
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Scope (this file): content states of workflowRightSidebarOutcomesTab in the 'Workflow' view (empty state when the workflow has no workflowOutcome entries, populated state with tag grouping and an 'Untagged'-labeled group only when some level-1 outcomes are tagged and others are not, navigation to Outcomes view via 'Edit outcomes' button); drag-and-drop assignment from a workflowOutcome row in workflowRightSidebarOutcomesTab onto a workflowNode in workflowView; cascade assignment rules on workflowNodes (manual assign/unassign/delete plus tree-change triggers per FR-WF-AO-006 — assign→descendants, all-children→parent, child-removed→parent removal, tree-change→assign when a child is inserted or reparented under an assigned parent); click-to-highlight semantics that drive workflowNode outcome-highlight presentation — FR-WF-AO-005 defines qualification (highlight set scoped to '/workflow/{id}/graph', persists across workflowRightSidebar tab switches within that view, clears on navigation away from that route or full page reload; highlight–assignment branch overlap — assigned outcome A and highlighted outcome H overlap when A = H or A is an ancestor of H, not when only proper descendants of H are assigned on the node without H; badge/border coupling per FR-WF-AO-007). Out of scope (companion FRs that already exist or are to be authored separately): tab visibility and availability in workflowRightSidebar (canonical in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml); outcome creation, editing, deletion, duplication in the 'Outcomes' view (tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml, workflow_duplicate_outcome_requirements_v1.yaml, workflow_delete_outcome_requirements_v1.yaml); per-node linked-outcomes badge and popover (canonical in tests/docs/requirements/original/workflow_node_linked_outcomes_badge_requirements_v1.yaml — FR-WF-AO-007 through FR-WF-AO-010).
# Cross-reference: tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar, workflowRightSidebarOutcomesTab, workflowRightSidebarOutcomesTabContent — canonical definitions and tab visibility — FR-WF-RS-001 through FR-WF-RS-003); tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml (canonical workflowOutcome, workflowOutcomeHeaderTitle and ordinal-prefix display — FR-WF-EO-007; outcome levels — FR-WF-EO-005, FR-WF-EO-008; tag catalog parity with workflowEditNodeFormTagsAutocomplete — FR-WF-EO-005; insert sibling or child — FR-WF-EO-003 triggers FR-WF-AO-006 tree-change assign cascade); tests/docs/requirements/original/workflow_outcome_tree_drag_reorder_requirements_v1.yaml (outcome-tree reparent/combine — FR-WF-EO-016, FR-WF-EO-017; assignment side effects canonical in FR-WF-AO-006); tests/docs/requirements/original/project_overview_requirements_v1.yaml (projectTagsSection, projectTagItem — canonical project-level tag catalog feeding tag groupings on workflowRightSidebarOutcomesTabContent); tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (workflowNodeOutcomeHighlightBorder visual presentation — FR-WF-NODE-003; workflowNodeHoverActionsMenu — FR-WF-NODE-004, FR-WF-NODE-005); tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml (workflowChannelHoverActionsMenu — FR-CHAN-007); tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml (workflowNode canonical; sidebar Edit tab patterns); tests/docs/requirements/original/workflow_node_linked_outcomes_badge_requirements_v1.yaml (workflowNodeLinkedOutcomesBadge, popover, unlink — FR-WF-AO-007 through FR-WF-AO-010); tests/docs/requirements/original/workflow_delete_outcome_requirements_v1.yaml (FR-WF-EO-014 removes assign-tab rows and node assignments when a workflowOutcome is deleted); tests/docs/requirements/guidelines_functional_requirements.md
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/graph'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowRightSidebar is visible per FR-WF-RS-001
  - workflowRightSidebarOutcomesTab is visible per FR-WF-RS-002
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

