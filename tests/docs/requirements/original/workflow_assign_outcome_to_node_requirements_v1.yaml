  workflowView:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml.
  workflowNode:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowOutcome:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml.
  workflowOutcomeTree:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml.
  workflowOutcomeHeaderTitle:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml.
  workflowEditOutcomeFormTitleField:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml.
  workflowEditOutcomeFormCodeField:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarOutcomesTab:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarOutcomesTabContent:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowOutcomesAssignTabEmptyState:
    meaning: Assign-tab content region inside workflowRightSidebarOutcomesTabContent; mutually exclusive with workflowOutcomesAssignTabTagGroup, workflowOutcomesAssignTabUntaggedGroup, and workflowOutcomesAssignTabOutcomeRow. Corresponds to the sole case where the current workflow has zero workflowOutcome entries at any level (nothing to list from the 'Outcomes' view) per FR-WF-AO-001.
  workflowOutcomesAssignTabHeading:
    meaning: Heading inside workflowRightSidebarOutcomesTabContent with literal copy 'Outcomes'.
  workflowOutcomesAssignTabEmptyStateAlert:
    meaning: Informational alert inside workflowOutcomesAssignTabEmptyState; body copy per FR-WF-AO-001.
  workflowOutcomesAssignTabAddOutcomesButton:
    meaning: Action button inside workflowOutcomesAssignTabEmptyState labeled 'Add outcomes'.
  workflowOutcomesAssignTabEditOutcomesButton:
    meaning: Action button inside workflowRightSidebarOutcomesTabContent labeled 'Edit outcomes'.
  workflowOutcomesAssignTabTagGroup:
    meaning: Visual group inside workflowRightSidebarOutcomesTabContent for a single tag from the project-level tag catalog per FR-PROJ-OV-005.
  workflowOutcomesAssignTabTagGroupTitle:
    meaning: Heading of a workflowOutcomesAssignTabTagGroup (tag catalog label from FR-PROJ-OV-005) or, in the mixed tagged/untagged case per FR-WF-AO-002, of workflowOutcomesAssignTabUntaggedGroup with literal 'Untagged'.
  workflowOutcomesAssignTabUntaggedGroup:
    meaning: Group section inside workflowRightSidebarOutcomesTabContent for level-1 workflowOutcomes with zero tags assigned; workflowOutcomesAssignTabTagGroupTitle with literal 'Untagged' is rendered only in the mixed tagged/untagged case per FR-WF-AO-002.
  workflowOutcomesAssignTabOutcomeRow:
    meaning: Row inside workflowRightSidebarOutcomesTabContent representing a single workflowOutcome within the workflowOutcomesAssignTabTagGroup or workflowOutcomesAssignTabUntaggedGroup section of its level-1 ancestor in workflowOutcomeTree; level-1 rows are rendered at the top of that section, level-2 and level-3 rows are rendered nested under expanded ancestor rows per FR-WF-AO-003.
  workflowOutcomesAssignTabOutcomeRowToggle:
    meaning: Expand/collapse control inside a workflowOutcomesAssignTabOutcomeRow for the workflowOutcome's descendant rows.
  workflowOutcomeHighlightBorder:
    meaning: Visual highlight outline applied to a workflowOutcomesAssignTabOutcomeRow.
  workflowNodeOutcomeHighlightBorder:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml.
  workflowNodeOutcomeDropTargetBorder:
    meaning: Transient drop-target outline on a workflowNode.
  workflowNodeHoverActionsMenu:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml.
  workflowChannelHeader:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml.
  workflowChannelHoverActionsMenu:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml.
  workflowChannelsHeaderRow:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml.
  workflowNodeLinkedOutcomesBadge:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_linked_outcomes_badge_requirements_v1.yaml.
  workflowNodeLinkedOutcomesPopover:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_linked_outcomes_badge_requirements_v1.yaml.
  workflowNodeLinkedOutcomeRow:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_node_linked_outcomes_badge_requirements_v1.yaml.

