requirements:
  - id: FR-WF-NODE-001
    title: workflowNode static visual structure in workflowView

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW
      - FIGMA-WF-NODE-LINKED-WORKFLOW-LINK
      - FIGMA-WF-NODE-LINKED-WORKFLOW-LINK-PROGRAM

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowSectionContainer
      - workflowSectionRow
      - workflowChannel
      - workflowNode
      - workflowNodeBorder
      - workflowNodeContent
      - workflowNodeTitle
      - workflowNodeLinkedWorkflowIndicator
      - workflowNodeMeta
      - workflowNodeMetaContextTag
      - workflowNodeMetaTaskTag
      - workflowNodeMetaTimeTag
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormContextSelect
      - workflowEditNodeFormTaskTypeSelect
      - workflowEditNodeFormTimeField
      - workflowRightSidebar

    preconditions:
      - workflowView is rendered
      - workflowView contains at least one workflowSectionContainer with at least one workflowNode

    trigger:
      - system renders a workflowNode at its placed workflowSectionRow × workflowChannel cell inside a workflowSectionContainer in workflowView
      - user clicks workflowNodeLinkedWorkflowIndicator on a workflowNode that has linkedWorkflow set

    mainFlow:
      - workflowNodeTitle, workflowNodeMeta tags, and workflowNodeLinkedWorkflowIndicator use field values and applicability defined in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-002 through FR-WF-EN-006 and FR-WF-EN-010; this FR defines canvas layout and chrome only
      - when workflowNodeMetaContextTag and workflowNodeMetaTaskTag are both present, they are left-aligned within workflowNodeMeta; when workflowNodeMetaTimeTag is present, it is right-aligned within workflowNodeMeta

    roleBehavior:
      owner:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered
      editor:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered
      commenter:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered
      viewer:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered
      user:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered

    acceptanceCriteria:
      - given workflowView has rendered a workflowNode, workflowNodeTitle is rendered for that workflowNode
      - given a workflowNode, workflowNodeTitle visible text conforms to workflowEditNodeFormTitleField for that workflowNode per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-002 through FR-WF-EN-006 and FR-WF-EN-007 (including 'Untitled node' display fallback when persisted title is empty)
      - given a workflowNode has no linked workflow, workflowNodeLinkedWorkflowIndicator is not rendered for that workflowNode
      - given a workflowNode has a linked workflow, workflowNodeLinkedWorkflowIndicator is rendered in workflowNodeContent between workflowNodeTitle and workflowNodeMeta
      - given a workflowNode has a linked workflow, that link satisfies tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-010
      - given workflowNodeLinkedWorkflowIndicator is rendered, when the user clicks workflowNodeLinkedWorkflowIndicator, the linked workflow opens in a new browser tab at that route; workflowRightSidebar does not switch its binding to the source workflowNode as a side effect of that click
      - given workflowNodeLinkedWorkflowIndicator is rendered, the new-tab navigation outcome for the linked workflow route conforms to tests/docs/requirements/original/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002 when that FR's preconditions apply to the linked workflow; otherwise the new tab shows the linked workflow workspace and the original tab does not change workflowRightSidebar selection
      - given a workflowNode is rendered in workflowView, workflowEditNodeFormDescriptionField, workflowEditNodeFormTagsAutocomplete, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationGroup, and workflowEditNodeFormSpecificEducationSwitch are not shown on that workflowNode
      - given a workflowNode, workflowNodeMeta tag presence and icon content conform to field applicability and persisted values per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-002 through FR-WF-EN-006; when workflowNodeMeta is rendered, workflowNodeMetaContextTag and workflowNodeMetaTaskTag are left-aligned within workflowNodeMeta and workflowNodeMetaTimeTag is right-aligned when present
      - given a workflowNode is rendered in workflowView, workflowNodeBorder is rendered as the channel-colored top stripe on that workflowNode
      - given a workflowNode is in workflowChannel C, workflowNodeBorder fill colour conforms to tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml FR-CHAN-003

    openQuestions:
      - The full canonical mapping of context-classification values to icon glyphs and accessible names (and likewise for task-classification values) is not yet enumerated in the requirements layer; confirm whether the canonical mapping should live in this file or in a dedicated lookup document when meta-tag rules are finalized.

  - id: FR-WF-NODE-002
    title: workflowNode selected state

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowNode
      - workflowNodeSelectedBorder
      - workflowEdge
      - workflowNodeTitle
      - workflowNodeLinkedWorkflowIndicator
      - workflowNodeMeta
      - workflowEditNodeForm
      - workflowRightSidebarEditTabContent

    preconditions:
      - workflowView is rendered with at least one workflowNode

    trigger:
      - system updates which workflowNode is bound to workflowRightSidebarEditTabContent for editing (tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-001)

    mainFlow:
      - workflowNodeSelectedBorder appears on exactly the workflowNode bound to workflowRightSidebarEditTabContent for editing and on no other workflowNode
      - applying or clearing selection does not change workflowNodeBorder fill, workflowNodeTitle text, workflowNodeLinkedWorkflowIndicator when rendered, or workflowNodeMeta contents
      - applying or clearing selection does not remove workflowEdge instances from the canvas; any workflowEdge that is part of the loaded workflow remains displayed (how edges look when selection changes is deferred to the workflow-edge requirements file)

    roleBehavior: {}

    acceptanceCriteria:
      - given workflowEditNodeForm is bound to workflowNode N, workflowNode N shows workflowNodeSelectedBorder and no other workflowNode in the workflow shows workflowNodeSelectedBorder
      - given workflowEditNodeForm is not currently bound to any workflowNode, no workflowNode in the workflow shows workflowNodeSelectedBorder
      - given workflowNode N transitions between selected states (binding changes for workflowEditNodeForm), workflowNodeBorder fill, workflowNodeTitle text, workflowNodeLinkedWorkflowIndicator when rendered, and workflowNodeMeta contents do not change
      - given the workflow canvas is displaying one or more workflowEdges, when workflowEditNodeForm binding changes from one workflowNode to another or is cleared, those workflowEdges remain displayed on the canvas (edge styling and emphasis are deferred to the workflow-edge requirements file)

    openQuestions: []

  - id: FR-WF-NODE-003
    title: workflowNode outcome-highlight ring (outcome filter)

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowNode
      - workflowNodeOutcomeHighlightRing
      - workflowNodeSelectedBorder
      - workflowEditNodeForm
      - workflowRightSidebarEditTabContent
      - workflowNodeTitle
      - workflowNodeLinkedWorkflowIndicator
      - workflowNodeMeta

    preconditions:
      - workflowView is rendered with at least one workflowNode

    trigger:
      - active outcome filter changes the set of workflowNodes highlighted for their outcome associations

    mainFlow:
      - workflowNodeOutcomeHighlightRing toggles per outcome-filter highlighting on each workflowNode's outcome associations
      - applying or clearing outcome-highlight does not change workflowNodeBorder fill, workflowNodeTitle text, workflowNodeLinkedWorkflowIndicator when rendered, or workflowNodeMeta contents

    roleBehavior: {}

    acceptanceCriteria:
      - given workflowNode N is highlighted by the active outcome filter via its outcomenodeSet, workflowNode N shows workflowNodeOutcomeHighlightRing
      - given workflowNode N is not highlighted by the active outcome filter, workflowNode N does not show workflowNodeOutcomeHighlightRing
      - given workflowNode N is both bound to workflowEditNodeForm for editing and highlighted by the active outcome filter, workflowNode N shows both workflowNodeSelectedBorder and workflowNodeOutcomeHighlightRing

    openQuestions:
      - Full product rules for outcome filtering, outcomenodeSet semantics, and entry points from the workflow UI are not yet normalized here; revisit FR-WF-NODE-003 with design and engineering when outcome highlighting is finalized.
      - Confirm visual specification when workflowNodeSelectedBorder and workflowNodeOutcomeHighlightRing coexist (e.g., concentric rings, color precedence, or single combined outline).

  - id: FR-WF-NODE-004
    title: workflowNodeHoverActionsMenu hover-only visibility and dismissal

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowNode
      - workflowNodeHoverActionsMenu
      - workflowEdge

    preconditions:
      - workflowView is rendered with at least one workflowNode

    trigger:
      - user moves the pointer over a workflowNode
      - user moves the pointer off a workflowNode
      - user begins a drag gesture on a workflowNode (move drag per tests/docs/requirements/original/workflow_move_node_requirements_v1.yaml FR-WF-MV-001)

    mainFlow:
      - workflowNodeHoverActionsMenu visibility tracks pointer hover on the workflowNode, actor item actionability per FR-WF-NODE-005 roleBehavior, and absence of an in-progress move drag on that workflowNode (tests/docs/requirements/original/workflow_move_node_requirements_v1.yaml FR-WF-MV-001)
      - the pointer-hover region that keeps workflowNodeHoverActionsMenu visible on a workflowNode includes that workflowNode's bounds and workflowNodeHoverActionsMenu's own bounds for that same workflowNode (so the pointer can move from the node onto a menu control without dismissing the menu)
      - workflowNodeHoverActionsMenu visibility is driven by pointer position only; keyboard focus on the workflowNode or on controls inside workflowNodeHoverActionsMenu does not substitute for pointer hover and does not show the menu when the pointer is outside that combined hover region
      - when the pointer leaves both the workflowNode and workflowNodeHoverActionsMenu anchored to that workflowNode, workflowNodeHoverActionsMenu hides
      - at most one workflowNodeHoverActionsMenu is visible at a time in workflowView
      - showing or hiding workflowNodeHoverActionsMenu on a workflowNode does not remove workflowEdge instances from the canvas; workflowEdges that are part of the loaded workflow remain displayed (edge styling and emphasis are deferred to the workflow-edge requirements file)

    roleBehavior:
      owner:
        workflowNodeHoverActionsMenu: shownOnHover
      editor:
        workflowNodeHoverActionsMenu: shownOnHover
      commenter:
        workflowNodeHoverActionsMenu: shownOnHover
      viewer:
        workflowNodeHoverActionsMenu: notRendered
      user:
        workflowNodeHoverActionsMenu: notRendered

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and workflowView is rendered, when the user moves the pointer over workflowNode N, workflowNodeHoverActionsMenu becomes visible anchored to workflowNode N
      - given actor is viewer, when the user moves the pointer over workflowNode N, workflowNodeHoverActionsMenu is not rendered on workflowNode N
      - given actor is user (published-access), when the user moves the pointer over workflowNode N, workflowNodeHoverActionsMenu is not rendered on workflowNode N
      - given workflowNodeHoverActionsMenu is visible on workflowNode N, when the user moves the pointer from workflowNode N onto workflowNodeHoverActionsMenu anchored to workflowNode N, workflowNodeHoverActionsMenu remains visible
      - given workflowNodeHoverActionsMenu is visible on workflowNode N, when the user moves the pointer off workflowNode N and off workflowNodeHoverActionsMenu on that node, workflowNodeHoverActionsMenu hides
      - given actor is owner, editor, or commenter, when the pointer is not within the combined pointer-hover region of workflowNode N and workflowNodeHoverActionsMenu anchored to workflowNode N, keyboard focus on workflowNode N alone does not cause workflowNodeHoverActionsMenu to become visible
      - given the user hovers workflowNode A then moves the pointer onto workflowNode B, workflowNodeHoverActionsMenu on workflowNode A hides and workflowNodeHoverActionsMenu on workflowNode B becomes visible (subject to FR-WF-NODE-005 roleBehavior: at least one menu item is active for the actor on that node)
      - given the user begins a move drag on workflowNode N per FR-WF-MV-001, workflowNodeHoverActionsMenu on workflowNode N is not visible for the duration of the drag
      - given the user finalizes or aborts a move drag of workflowNode N, hover-based visibility of workflowNodeHoverActionsMenu on workflowNode N resumes (visible whenever the pointer is hovering workflowNode N and at least one hover-menu item has roleBehavior state active for the actor per FR-WF-NODE-005)
      - given the workflow canvas is displaying one or more workflowEdges incident to workflowNode N, when workflowNodeHoverActionsMenu visibility on N toggles per this FR, those workflowEdges remain displayed on the canvas (edge styling and emphasis are deferred to the workflow-edge requirements file)

    openQuestions: []

  - id: FR-WF-NODE-005
    title: workflowNodeHoverActionsMenu — composition, role behavior, and item actions

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowNode
      - workflowNodeHoverActionsMenu
      - workflowNodeHoverActionsMenuInsertItem
      - workflowNodeHoverActionsMenuDuplicateItem
      - workflowNodeHoverActionsMenuDeleteItem
      - workflowNodeHoverActionsMenuCommentsItem
      - workflowAddTabInsertModeToggleGroup
      - workflowNodeManualInsertPopupMenu
      - workflowEditNodeForm
      - workflowNodeContent
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarEditTab

    preconditions:
      - workflowNodeHoverActionsMenu is visible on a workflowNode per FR-WF-NODE-004

    trigger:
      - system renders workflowNodeHoverActionsMenu for the hovered workflowNode
      - user clicks an item in workflowNodeHoverActionsMenu

    mainFlow:
      - per-item actionability follows this FR's roleBehavior block; container visibility on hover is jointly governed by FR-WF-NODE-004
      - workflowNodeHoverActionsMenuInsertItem ('Insert node below'), workflowNodeHoverActionsMenuDuplicateItem ('Duplicate node below'), and workflowNodeHoverActionsMenuDeleteItem ('Delete node') share identical role gating for every actor who can see workflowNodeHoverActionsMenu: owner and editor have those three items active; commenter has those three items read-only (not clickable); viewer and user do not see workflowNodeHoverActionsMenu on hover (workflowNodeHoverActionsMenu notRendered per FR-WF-NODE-004), so those three items are unreachable for those actors
      - each item's click effect is delegated to the owning requirement set (insert-below placement per tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml FR-WF-DUP-003 with the hovered workflowNode as source, triggered by workflowNodeHoverActionsMenuInsertItem in this FR; duplicate per tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml FR-WF-DUP-002; delete per tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-002; workflowNodeHoverActionsMenuCommentsItem click path per tests/docs/requirements/original/workflow_comments_tab_requirements_v1.yaml FR-WF-COMMENTS-001 with workflowRightSidebarCommentsTab actionability per tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml FR-WF-RS-003)
      - workflowNodeHoverActionsMenuInsertItem, workflowNodeHoverActionsMenuDuplicateItem, and workflowNodeHoverActionsMenuDeleteItem clicks do not use workflowNodeContent as a primary selection path that would rebind workflowEditNodeForm to the hovered workflowNode (outcomes per FR-WF-DUP-003, FR-WF-DUP-002, and FR-WF-DEL-002)
      - workflowNodeHoverActionsMenuCommentsItem click selects the hovered workflowNode for workflowRightSidebar (comments for that node per FR-WF-COMMENTS-001; workflowRightSidebarEditTab shows workflowEditNodeForm for that same node when the user switches to it per FR-WF-COMMENTS-005 and tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-001)

    roleBehavior:
      owner:
        workflowNodeHoverActionsMenuInsertItem: active
        workflowNodeHoverActionsMenuDuplicateItem: active
        workflowNodeHoverActionsMenuDeleteItem: active
        workflowNodeHoverActionsMenuCommentsItem: active
      editor:
        workflowNodeHoverActionsMenuInsertItem: active
        workflowNodeHoverActionsMenuDuplicateItem: active
        workflowNodeHoverActionsMenuDeleteItem: active
        workflowNodeHoverActionsMenuCommentsItem: active
      commenter:
        workflowNodeHoverActionsMenuInsertItem: readOnly
        workflowNodeHoverActionsMenuDuplicateItem: readOnly
        workflowNodeHoverActionsMenuDeleteItem: readOnly
        workflowNodeHoverActionsMenuCommentsItem: active
      viewer:
        workflowNodeHoverActionsMenu: notRendered
      user:
        workflowNodeHoverActionsMenu: notRendered

    acceptanceCriteria:
      - given actor is owner or editor and workflowNodeHoverActionsMenu is visible, all four hover-menu items are present and active and clickable
      - given actor is commenter and workflowNodeHoverActionsMenu is visible, workflowNodeHoverActionsMenuInsertItem, workflowNodeHoverActionsMenuDuplicateItem, and workflowNodeHoverActionsMenuDeleteItem are rendered and read-only (not clickable) with identical role gating for those three items; workflowNodeHoverActionsMenuCommentsItem is present, active, and clickable
      - given actor is viewer or user (published-access), workflowNodeHoverActionsMenu is not rendered when the user hovers a workflowNode (per FR-WF-NODE-004)
      - given owner or editor clicks workflowNodeHoverActionsMenuInsertItem on a hovered workflowNode, final placement of the new blank workflowNode for insert mode 'Row', 'Column', or 'Manual' (including workflowNodeManualInsertPopupMenu when insert mode is 'Manual') matches tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml FR-WF-DUP-003 with that hovered workflowNode as the source workflowNode
      - given workflowNodeHoverActionsMenuDuplicateItem is clicked, the behavior matches tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml FR-WF-DUP-002
      - given workflowNodeHoverActionsMenuDeleteItem is clicked, the behavior matches tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-002
      - given workflowNodeHoverActionsMenuCommentsItem is clicked, behavior matches tests/docs/requirements/original/workflow_comments_tab_requirements_v1.yaml FR-WF-COMMENTS-001 (workflowRightSidebarCommentsTab selected, comments list and composer for the hovered workflowNode; hovered workflowNode becomes sidebar edit selection per FR-WF-COMMENTS-005 and tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-001)
      - given workflowNodeHoverActionsMenuInsertItem, workflowNodeHoverActionsMenuDuplicateItem, or workflowNodeHoverActionsMenuDeleteItem is clicked, that click does not bind workflowEditNodeForm to the hovered workflowNode via workflowNodeContent primary selection (selection state of workflowRightSidebarEditTab is not changed as a side effect of that click path)

    openQuestions:
      - Fine-grained edge cases for hover insert-below or duplicate (e.g. section boundaries, multi-node rows) may still need cross-check against tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml and tests/docs/requirements/original/workflow_move_node_requirements_v1.yaml when those flows are aligned to FR-WF-DUP-003.

  - id: FR-WF-NODE-006
    title: workflowNode edge handles — presence on hover or selection for edge authors only (edge drawing deferred)

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowNode
      - workflowNodeHoverActionsMenu
      - workflowNodeEdgeHandles
      - workflowNodeEdgeHandleTop
      - workflowNodeEdgeHandleRight
      - workflowNodeEdgeHandleBottom
      - workflowNodeEdgeHandleLeft
      - workflowEditNodeForm
      - workflowRightSidebarEditTabContent

    preconditions:
      - workflowView is rendered with at least one workflowNode
      - selection state per FR-WF-NODE-002 and combined pointer-hover region per FR-WF-NODE-004 are the inputs that determine workflowNodeEdgeHandles visibility in this FR

    trigger:
      - user moves the pointer over a workflowNode
      - user moves the pointer off a workflowNode
      - system binds or unbinds workflowEditNodeForm to a workflowNode for editing (tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-001; selected state per FR-WF-NODE-002)

    mainFlow:
      - for owner and editor, workflowNodeEdgeHandles on workflowNode N transitions to shown when N is selected per FR-WF-NODE-002 or when the pointer is in N's combined pointer-hover region per FR-WF-NODE-004, and transitions to hidden when neither applies
      - dragging from a handle to author or edit workflow edges is out of scope here (workflow-edge requirements file)

    roleBehavior:
      owner:
        workflowNodeEdgeHandles: shownOnHoverOrSelection
      editor:
        workflowNodeEdgeHandles: shownOnHoverOrSelection
      commenter:
        workflowNodeEdgeHandles: notRendered
      viewer:
        workflowNodeEdgeHandles: notRendered
      user:
        workflowNodeEdgeHandles: notRendered

    acceptanceCriteria:
      - given actor is owner or editor and workflowNode N satisfies neither FR-WF-NODE-002 selection nor FR-WF-NODE-004 combined pointer-hover, workflowNodeEdgeHandles is not rendered on N
      - given actor is owner or editor and workflowEditNodeForm is bound to workflowNode N while the pointer is outside N's FR-WF-NODE-004 combined region, workflowNodeEdgeHandles is rendered on N
      - given actor is owner or editor and the pointer is within workflowNode N's FR-WF-NODE-004 combined region while N is not selected per FR-WF-NODE-002, workflowNodeEdgeHandles is rendered on N
      - given actor is commenter, workflowNodeEdgeHandles is not rendered on any workflowNode
      - given actor is viewer or user, workflowNodeEdgeHandles is not rendered on any workflowNode

    openQuestions:
      - Edge authoring (create, delete, reconnect, selection) is normalized in tests/docs/requirements/original/workflow_edge_requirements_v1.yaml (FR-WF-EDGE-001 through FR-WF-EDGE-004); align handle display rules with that file and FR-WF-NODE-006.
      - Confirm whether workflowNodeEdgeHandles must appear when workflowNode N is selected per FR-WF-NODE-002 but the pointer is outside N's FR-WF-NODE-004 combined hover region, and whether handles remain visible during an in-progress edge draw when the pointer leaves the node; align with the hover-or-selection display rule in this FR when edge authoring is finalized in tests/docs/requirements/original/workflow_edge_requirements_v1.yaml.
      - Beyond the display-only assertions for workflowEdge in FR-WF-NODE-002 and FR-WF-NODE-004, workflowEdge authoring and selection are specified in tests/docs/requirements/original/workflow_edge_requirements_v1.yaml; edge styling and overlap display rules remain deferred there (FR-WF-EDGE-004 openQuestions).

