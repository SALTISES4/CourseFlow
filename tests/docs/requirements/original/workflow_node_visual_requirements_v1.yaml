  workflowNodeManualInsertPopupMenu:
    meaning: Canonical object in tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTabContent:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
