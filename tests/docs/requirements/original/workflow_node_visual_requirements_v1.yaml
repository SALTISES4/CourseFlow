requirements:
  - id: FR-WF-NODE-001
    title: workflowNode static visual structure in workflowView

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW
      - FIGMA-WF-NODE-LINKED-WORKFLOW-LINK
      - FIGMA-WF-NODE-LINKED-WORKFLOW-LINK-PROGRAM

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowView
      - workflowSectionContainer
      - workflowSectionRow
      - workflowChannel
      - workflowNode
      - workflowNodeBorder
      - workflowNodeContent
      - workflowNodeTitle
      - workflowNodeLinkedWorkflowIndicator
      - workflowNodeMeta
      - workflowNodeMetaContextTag
      - workflowNodeMetaTaskTag
      - workflowNodeMetaTimeTag
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormActivityContextSelect
      - workflowEditNodeFormCourseContextSelect
      - workflowEditNodeFormTaskTypeSelect
      - workflowEditNodeFormTimeField
      - workflowRightSidebar

    preconditions:
      - workflowView is rendered
      - workflowView contains at least one workflowSectionContainer with at least one workflowNode

    trigger:
      - system renders a workflowNode at its placed workflowSectionRow × workflowChannel cell inside a workflowSectionContainer in workflowView
      - user clicks workflowNodeLinkedWorkflowIndicator on a workflowNode that has linkedWorkflow set

    mainFlow:
      - workflowNodeTitle, workflowNodeMeta tags, and workflowNodeLinkedWorkflowIndicator use field values and applicability defined in FR-WF-EN-002 through FR-WF-EN-006 and FR-WF-EN-010; this FR defines canvas layout and chrome only
      - meta tags are optional on the canvas — context, task, and time are never mandatory for workflowNodeMeta to appear; each tag renders only when its corresponding edit-form field applies to the workflowNode per FR-WF-EN-002 through FR-WF-EN-006 and the persisted value is non-empty (context or task not 'None'; time has a persisted duration with a non-zero length and unit)
      - workflowNodeMetaContextTag is rendered only when workflowEditNodeFormActivityContextSelect or workflowEditNodeFormCourseContextSelect applies to the workflowNode per FR-WF-EN-002, FR-WF-EN-003, or FR-WF-EN-004 and the persisted context value is not 'None'
      - workflowNodeMetaTaskTag is rendered only when workflowEditNodeFormTaskTypeSelect applies to the workflowNode per FR-WF-EN-002 and the persisted task-type value is not 'None'
      - workflowNodeMetaTimeTag is rendered only when workflowEditNodeFormTimeField applies to the workflowNode per FR-WF-EN-002 through FR-WF-EN-006 and the persisted time value has a non-zero length with a valid unit (empty or cleared time is not shown on the canvas)
      - when no workflowNodeMeta tag would render for a workflowNode, workflowNodeMeta is not rendered for that workflowNode
      - when workflowNodeMetaContextTag and workflowNodeMetaTaskTag are both present, they are left-aligned within workflowNodeMeta; when workflowNodeMetaTimeTag is present, it is right-aligned within workflowNodeMeta
      - out of scope — per-value icon glyphs and accessible names for workflowNodeMetaContextTag and workflowNodeMetaTaskTag; tag presence and layout per field applicability are in scope

    roleBehavior:
      owner:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered
      editor:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered
      commenter:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered
      viewer:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered
      user:
        workflowNode: visible
        workflowNodeLinkedWorkflowIndicator: clickableWhenRendered

    acceptanceCriteria:
      - given workflowView has rendered a workflowNode, workflowNodeTitle is rendered for that workflowNode
      - given a workflowNode, workflowNodeTitle visible text conforms to workflowEditNodeFormTitleField for that workflowNode per FR-WF-EN-002 through FR-WF-EN-006 and FR-WF-EN-007 (including 'Untitled node' display fallback when persisted title is empty)
      - given a workflowNode has no linked workflow, workflowNodeLinkedWorkflowIndicator is not rendered for that workflowNode
      - given a workflowNode has a linked workflow, workflowNodeLinkedWorkflowIndicator is rendered in workflowNodeContent between workflowNodeTitle and workflowNodeMeta
      - given a workflowNode has a linked workflow, that link satisfies FR-WF-EN-010
      - when a parent node's linked child workflow is archived individually and parent node links are cleared per tests/docs/requirements/original/workflow_archive_requirements_v1.yaml FR-WF-ARCH-003, workflowNodeLinkedWorkflowIndicator is not rendered on that node after the parent workflow is next rendered in workflowView
      - when a parent project's linked child workflows are archived together via project archive per tests/docs/requirements/original/project_archive_requirements_v1.yaml FR-PROJ-ARCH-003, linkedWorkflow associations are preserved for project restore per FR-LIB-006; workflowNodeLinkedWorkflowIndicator is rendered again after project restore when the link existed at archival
      - given workflowNodeLinkedWorkflowIndicator is rendered, when the user clicks workflowNodeLinkedWorkflowIndicator, the linked workflow opens in a new browser tab at that route; workflowRightSidebar does not switch its binding to the source workflowNode as a side effect of that click
      - given workflowNodeLinkedWorkflowIndicator is rendered, the new-tab navigation outcome for the linked workflow route conforms to FR-WS-ACCESS-002 when that FR's preconditions apply to the linked workflow; otherwise the new tab shows the linked workflow workspace and the original tab does not change workflowRightSidebar selection
      - given a workflowNode is rendered in workflowView, workflowEditNodeFormDescriptionField, workflowEditNodeFormTagsAutocomplete, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationGroup, and workflowEditNodeFormSpecificEducationSwitch are not shown on that workflowNode
      - given a workflowNode, workflowNodeMeta tag presence conforms to field applicability and persisted values per FR-WF-EN-002 through FR-WF-EN-006; when workflowNodeMeta is rendered, workflowNodeMetaContextTag and workflowNodeMetaTaskTag are left-aligned within workflowNodeMeta and workflowNodeMetaTimeTag is right-aligned when present
      - given parent workflow type is activity and workflowEditNodeFormActivityContextSelect for the workflowNode is 'None' or unset, workflowNodeMetaContextTag is not rendered for that workflowNode
      - given parent workflow type is activity and workflowEditNodeFormTaskTypeSelect for the workflowNode is 'None' or unset, workflowNodeMetaTaskTag is not rendered for that workflowNode
      - given parent workflow type is course and workflowEditNodeFormCourseContextSelect for the workflowNode is 'None' or unset, workflowNodeMetaContextTag is not rendered for that workflowNode
      - given parent workflow type is course or program, workflowNodeMetaTaskTag is not rendered for that workflowNode (workflowEditNodeFormTaskTypeSelect does not apply per FR-WF-EN-003 through FR-WF-EN-006)
      - given parent workflow type is program, workflowNodeMetaContextTag is not rendered for that workflowNode (neither workflowEditNodeFormActivityContextSelect nor workflowEditNodeFormCourseContextSelect applies per FR-WF-EN-005 and FR-WF-EN-006)
      - given workflowEditNodeFormTimeField for the workflowNode has no persisted duration (empty or cleared), workflowNodeMetaTimeTag is not rendered for that workflowNode
      - given a workflowNode would show no workflowNodeMetaContextTag, workflowNodeMetaTaskTag, or workflowNodeMetaTimeTag, workflowNodeMeta is not rendered for that workflowNode
      - given a workflowNode is rendered in workflowView, workflowNodeBorder is rendered as the channel-colored top stripe on that workflowNode
      - given a workflowNode is in workflowChannel C, workflowNodeBorder fill colour conforms to FR-CHAN-003

    openQuestions: []

  - id: FR-WF-NODE-002
    title: workflowNode selected state

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowNode
      - workflowNodeSelectedBorder
      - workflowEdge
      - workflowNodeTitle
      - workflowNodeLinkedWorkflowIndicator
      - workflowNodeMeta
      - workflowEditNodeForm
      - workflowRightSidebarEditTabContent

    preconditions:
      - workflowView is rendered with at least one workflowNode

    trigger:
      - system updates which workflowNode is bound to workflowRightSidebarEditTabContent for editing (FR-WF-EN-001)

    mainFlow:
      - workflowNodeSelectedBorder appears on exactly the workflowNode bound to workflowRightSidebarEditTabContent for editing and on no other workflowNode, except when that workflowNode shows workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003 (in which case no workflowNode shows workflowNodeSelectedBorder)
      - workflowNodeSelectedBorder is not shown on a workflowNode that shows workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003
      - applying or clearing selection does not change workflowNodeBorder fill, workflowNodeTitle text, workflowNodeLinkedWorkflowIndicator when rendered, or workflowNodeMeta contents
      - applying or clearing selection does not remove workflowEdge instances from the canvas; any workflowEdge that is part of the loaded workflow remains displayed (how edges look when selection changes is deferred to the workflow-edge requirements file)

    roleBehavior: {}

    acceptanceCriteria:
      - given workflowEditNodeForm is bound to workflowNode N and N does not show workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003, workflowNode N shows workflowNodeSelectedBorder and no other workflowNode in the workflow shows workflowNodeSelectedBorder
      - given workflowNode N shows workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003, workflowNode N does not show workflowNodeSelectedBorder
      - given workflowEditNodeForm is bound to workflowNode N and N shows workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003, workflowNode N does not show workflowNodeSelectedBorder
      - given workflowEditNodeForm is not currently bound to any workflowNode, no workflowNode in the workflow shows workflowNodeSelectedBorder
      - given workflowNode N transitions between selected states (binding changes for workflowEditNodeForm), workflowNodeBorder fill, workflowNodeTitle text, workflowNodeLinkedWorkflowIndicator when rendered, and workflowNodeMeta contents do not change
      - given the workflow canvas is displaying one or more workflowEdges, when workflowEditNodeForm binding changes from one workflowNode to another or is cleared, those workflowEdges remain displayed on the canvas (edge styling and emphasis are deferred to the workflow-edge requirements file)

    openQuestions: []

  - id: FR-WF-NODE-003
    title: workflowNodeOutcomeHighlightBorder when a highlighted outcome is assigned to the node

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowNode
      - workflowNodeOutcomeHighlightBorder
      - workflowNodeSelectedBorder
      - workflowEditNodeForm
      - workflowRightSidebarEditTabContent
      - workflowNodeTitle
      - workflowNodeLinkedWorkflowIndicator
      - workflowNodeMeta

    preconditions:
      - workflowView is rendered with at least one workflowNode

    trigger:
      - the outcome highlight set changes per FR-WF-AO-005, updating which workflowNodes are in outcome-highlight presentation per FR-WF-AO-005

    mainFlow:
      - workflowNodeOutcomeHighlightBorder is shown on workflowNode N if and only if N is in outcome-highlight presentation per FR-WF-AO-005
      - workflowNodeOutcomeHighlightBorder and workflowNodeSelectedBorder are never shown on the same workflowNode at the same time
      - clicking workflowNodeContent on a workflowNode that shows workflowNodeOutcomeHighlightBorder does not change sidebar binding or selection chrome per FR-WF-EN-001; workflowNodeHoverActionsMenuCommentsItem and workflowRightSidebarEditTab remain available for that workflowNode per FR-WF-NODE-005 and FR-WF-COMMENTS-005
      - applying or clearing workflowNodeOutcomeHighlightBorder does not change workflowNodeBorder fill, workflowNodeTitle text, workflowNodeLinkedWorkflowIndicator when rendered, or workflowNodeMeta contents

    roleBehavior: {}

    acceptanceCriteria:
      - given workflowNode N is in outcome-highlight presentation per FR-WF-AO-005, workflowNode N shows workflowNodeOutcomeHighlightBorder and does not show workflowNodeSelectedBorder
      - given workflowNode N is not in outcome-highlight presentation per FR-WF-AO-005, workflowNode N does not show workflowNodeOutcomeHighlightBorder
      - given the user clicks workflowNodeContent on workflowNode N while N shows workflowNodeOutcomeHighlightBorder, N continues to show workflowNodeOutcomeHighlightBorder, workflowEditNodeForm binding is unchanged, and no workflowNode shows workflowNodeSelectedBorder as a result of that click
      - given workflowNode N shows workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003 and actor clicks workflowNodeHoverActionsMenuCommentsItem on N, behavior matches FR-WF-COMMENTS-001 and N does not show workflowNodeSelectedBorder; when the actor then clicks workflowRightSidebarEditTab, workflowEditNodeForm targets N per FR-WF-EN-001 and edit is not blocked by N showing workflowNodeOutcomeHighlightBorder

    openQuestions: []

  - id: FR-WF-NODE-004
    title: workflowNodeHoverActionsMenu hover-only visibility and dismissal

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowNode
      - workflowNodeHoverActionsMenu
      - workflowEdge

    preconditions:
      - workflowView is rendered with at least one workflowNode

    trigger:
      - user moves the pointer over a workflowNode
      - user moves the pointer off a workflowNode
      - user begins a drag gesture on a workflowNode (move drag per FR-WF-MV-001)

    mainFlow:
      - workflowNodeHoverActionsMenu visibility tracks pointer hover on the workflowNode and actor item actionability per FR-WF-NODE-005 roleBehavior, except while an add-tab drag per FR-WF-ADD-003 or a move drag per FR-WF-MV-001 is in progress
      - while an add-tab drag from workflowRightSidebarAddTabContent is in progress per FR-WF-ADD-003, workflowNodeHoverActionsMenu is not rendered on any placed workflowNode in workflowView, including while workflowManualPlacementDialog is open after a valid 'Manual'-mode release per FR-WF-ADD-006
      - while a move drag from an existing workflowNode is in progress per FR-WF-MV-001, workflowNodeHoverActionsMenu is not rendered on any placed workflowNode in workflowView (including nodes the dragged workflowNode or pointer passes over during the drag)
      - canvas hover suppression during an outcome-assign drag is canonical in FR-WF-AO-004
      - while workflowManualPlacementDialog is open pending duplicate or insert-below finalization on source workflowNode S initiated from workflowNodeHoverActionsMenuDuplicateItem per FR-WF-DUP-002 or workflowNodeHoverActionsMenuInsertItem per FR-WF-NODE-005, workflowNodeHoverActionsMenu is not rendered on workflowNode S; after the user clicks workflowManualPlacementDialogRowButton or workflowManualPlacementDialogColumnButton and placement finalizes, or dismisses workflowManualPlacementDialog per FR-WF-ADD-006, hover-based visibility on S resumes per the pointer rules above
      - the pointer-hover region that keeps workflowNodeHoverActionsMenu visible on a workflowNode includes that workflowNode's bounds and workflowNodeHoverActionsMenu's own bounds for that same workflowNode (so the pointer can move from the node onto a menu control without dismissing the menu)
      - workflowNodeHoverActionsMenu visibility is driven by pointer position only; keyboard focus on the workflowNode or on controls inside workflowNodeHoverActionsMenu does not substitute for pointer hover and does not show the menu when the pointer is outside that combined hover region
      - when the pointer leaves both the workflowNode and workflowNodeHoverActionsMenu anchored to that workflowNode, workflowNodeHoverActionsMenu hides
      - at most one workflowNodeHoverActionsMenu is visible at a time in workflowView
      - showing or hiding workflowNodeHoverActionsMenu on a workflowNode does not remove workflowEdge instances from the canvas; workflowEdges that are part of the loaded workflow remain displayed (edge styling and emphasis are deferred to the workflow-edge requirements file)

    roleBehavior:
      owner:
        workflowNodeHoverActionsMenu: shownOnHover
      editor:
        workflowNodeHoverActionsMenu: shownOnHover
      commenter:
        workflowNodeHoverActionsMenu: shownOnHover
      viewer:
        workflowNodeHoverActionsMenu: notRendered
      user:
        workflowNodeHoverActionsMenu: notRendered

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and workflowView is rendered, when the user moves the pointer over workflowNode N, workflowNodeHoverActionsMenu becomes visible anchored to workflowNode N
      - given actor is viewer, when the user moves the pointer over workflowNode N, workflowNodeHoverActionsMenu is not rendered on workflowNode N
      - given actor is user (published-access), when the user moves the pointer over workflowNode N, workflowNodeHoverActionsMenu is not rendered on workflowNode N
      - given workflowNodeHoverActionsMenu is visible on workflowNode N, when the user moves the pointer from workflowNode N onto workflowNodeHoverActionsMenu anchored to workflowNode N, workflowNodeHoverActionsMenu remains visible
      - given workflowNodeHoverActionsMenu is visible on workflowNode N, when the user moves the pointer off workflowNode N and off workflowNodeHoverActionsMenu on that node, workflowNodeHoverActionsMenu hides
      - given actor is owner, editor, or commenter, when the pointer is not within the combined pointer-hover region of workflowNode N and workflowNodeHoverActionsMenu anchored to workflowNode N, keyboard focus on workflowNode N alone does not cause workflowNodeHoverActionsMenu to become visible
      - given the user hovers workflowNode A then moves the pointer onto workflowNode B, workflowNodeHoverActionsMenu on workflowNode A hides and workflowNodeHoverActionsMenu on workflowNode B becomes visible (subject to FR-WF-NODE-005 roleBehavior: at least one menu item is active for the actor on that node)
      - given owner or editor is dragging an existing workflowNode per FR-WF-MV-001, workflowNodeHoverActionsMenu is not rendered on any placed workflowNode in workflowView for the duration of the drag
      - given owner or editor finalizes or aborts a move drag per FR-WF-MV-001, hover-based visibility on a workflowNode resumes per FR-WF-NODE-004 and FR-WF-NODE-005 when the pointer hovers that workflowNode
      - given owner or editor is dragging from workflowRightSidebarAddTabContent per FR-WF-ADD-003, workflowNodeHoverActionsMenu is not rendered on any placed workflowNode in workflowView for the duration of the drag, including while workflowManualPlacementDialog is open after a valid 'Manual'-mode release per FR-WF-ADD-006
      - given owner or editor clicked workflowNodeHoverActionsMenuDuplicateItem or workflowNodeHoverActionsMenuInsertItem on workflowNode S with insert mode 'Manual' per FR-WF-DUP-002 or FR-WF-NODE-005, workflowManualPlacementDialog is open anchored to S, and the pointer remains over workflowNode S, workflowNodeHoverActionsMenu is not rendered on S until placement finalizes or workflowManualPlacementDialog is dismissed per FR-WF-ADD-006
      - given the workflow canvas is displaying one or more workflowEdges incident to workflowNode N, when workflowNodeHoverActionsMenu visibility on N toggles per this FR, those workflowEdges remain displayed on the canvas (edge styling and emphasis are deferred to the workflow-edge requirements file)

    openQuestions: []

  - id: FR-WF-NODE-005
    title: workflowNodeHoverActionsMenu — composition, role behavior, and item actions

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowNode
      - workflowNodeHoverActionsMenu
      - workflowNodeHoverActionsMenuInsertItem
      - workflowNodeHoverActionsMenuDuplicateItem
      - workflowNodeHoverActionsMenuDeleteItem
      - workflowNodeHoverActionsMenuCommentsItem
      - workflowAddTabInsertModeToggleGroup
      - workflowManualPlacementDialog
      - workflowEditNodeForm
      - workflowNodeContent
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarEditTab

    preconditions:
      - workflowNodeHoverActionsMenu is visible on a workflowNode per FR-WF-NODE-004

    trigger:
      - system renders workflowNodeHoverActionsMenu for the hovered workflowNode
      - user clicks an item in workflowNodeHoverActionsMenu

    mainFlow:
      - per-item actionability follows this FR's roleBehavior block; container visibility on hover is jointly governed by FR-WF-NODE-004
      - workflowNodeHoverActionsMenuInsertItem ('Insert node below'), workflowNodeHoverActionsMenuDuplicateItem ('Duplicate node below'), and workflowNodeHoverActionsMenuDeleteItem ('Delete node') share identical role gating for every actor who can see workflowNodeHoverActionsMenu: owner and editor have those three items active; commenter has those three items disabled; viewer and user do not see workflowNodeHoverActionsMenu on hover (workflowNodeHoverActionsMenu notRendered per FR-WF-NODE-004), so those three items are unreachable for those actors
      - each item's click effect is delegated to the owning requirement set (insert-below placement per FR-WF-DUP-003 with the hovered workflowNode as source, triggered by workflowNodeHoverActionsMenuInsertItem in this FR; duplicate per FR-WF-DUP-002; delete per FR-WF-DEL-002; workflowNodeHoverActionsMenuCommentsItem click path per FR-WF-COMMENTS-001 with workflowRightSidebarCommentsTab actionability per FR-WF-RS-003)
      - workflowNodeHoverActionsMenuInsertItem, workflowNodeHoverActionsMenuDuplicateItem, and workflowNodeHoverActionsMenuDeleteItem clicks do not use workflowNodeContent as a primary selection path that would rebind workflowEditNodeForm to the hovered workflowNode (outcomes per FR-WF-DUP-003, FR-WF-DUP-002, and FR-WF-DEL-002)
      - workflowNodeHoverActionsMenuCommentsItem click selects the hovered workflowNode for workflowRightSidebar (comments for that node per FR-WF-COMMENTS-001; workflowRightSidebarEditTab shows workflowEditNodeForm for that same node when the user switches to it per FR-WF-COMMENTS-005 and FR-WF-EN-001); showing workflowNodeOutcomeHighlightBorder on the hovered workflowNode per FR-WF-NODE-003 does not block workflowNodeHoverActionsMenuCommentsItem or subsequent edit via workflowRightSidebarEditTab

    roleBehavior:
      owner:
        workflowNodeHoverActionsMenuInsertItem: active
        workflowNodeHoverActionsMenuDuplicateItem: active
        workflowNodeHoverActionsMenuDeleteItem: active
        workflowNodeHoverActionsMenuCommentsItem: active
      editor:
        workflowNodeHoverActionsMenuInsertItem: active
        workflowNodeHoverActionsMenuDuplicateItem: active
        workflowNodeHoverActionsMenuDeleteItem: active
        workflowNodeHoverActionsMenuCommentsItem: active
      commenter:
        workflowNodeHoverActionsMenuInsertItem: disabled
        workflowNodeHoverActionsMenuDuplicateItem: disabled
        workflowNodeHoverActionsMenuDeleteItem: disabled
        workflowNodeHoverActionsMenuCommentsItem: active
      viewer:
        workflowNodeHoverActionsMenu: notRendered
      user:
        workflowNodeHoverActionsMenu: notRendered

    acceptanceCriteria:
      - given actor is owner or editor and workflowNodeHoverActionsMenu is visible, all four hover-menu items are present and active and clickable
      - given actor is commenter and workflowNodeHoverActionsMenu is visible, workflowNodeHoverActionsMenuInsertItem, workflowNodeHoverActionsMenuDuplicateItem, and workflowNodeHoverActionsMenuDeleteItem are rendered and disabled with identical role gating for those three items; workflowNodeHoverActionsMenuCommentsItem is present, active, and clickable
      - given actor is viewer or user (published-access), workflowNodeHoverActionsMenu is not rendered when the user hovers a workflowNode (per FR-WF-NODE-004)
      - given owner or editor clicks workflowNodeHoverActionsMenuInsertItem on a hovered workflowNode, final placement of the new blank workflowNode for insert mode 'Row', 'Column', or 'Manual' (including workflowManualPlacementDialog when insert mode is 'Manual') matches FR-WF-DUP-003 with that hovered workflowNode as the source workflowNode
      - given workflowNodeHoverActionsMenuDuplicateItem is clicked, the behavior matches FR-WF-DUP-002
      - given workflowNodeHoverActionsMenuDeleteItem is clicked, the behavior matches FR-WF-DEL-002
      - given workflowNodeHoverActionsMenuCommentsItem is clicked, behavior matches FR-WF-COMMENTS-001 (workflowRightSidebarCommentsTab selected, comments list and composer for the hovered workflowNode; hovered workflowNode becomes sidebar edit selection per FR-WF-COMMENTS-005 and FR-WF-EN-001), including when the hovered workflowNode shows workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003
      - given workflowNodeHoverActionsMenuInsertItem, workflowNodeHoverActionsMenuDuplicateItem, or workflowNodeHoverActionsMenuDeleteItem is clicked, that click does not bind workflowEditNodeForm to the hovered workflowNode via workflowNodeContent primary selection (selection state of workflowRightSidebarEditTab is not changed as a side effect of that click path)

    openQuestions: []

  - id: FR-WF-NODE-006
    title: workflowNode edge handles — presence on hover for edge authors only (edge drawing deferred)

    designEvidence:
      - FIGMA-WF-NODE-WORKFLOW-VIEW

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowView
      - workflowNode
      - workflowNodeHoverActionsMenu
      - workflowNodeEdgeHandles
      - workflowNodeEdgeHandleTop
      - workflowNodeEdgeHandleRight
      - workflowNodeEdgeHandleBottom
      - workflowNodeEdgeHandleLeft

    preconditions:
      - workflowView is rendered with at least one workflowNode

    trigger:
      - user moves the pointer over a workflowNode
      - user moves the pointer off a workflowNode

    mainFlow:
      - for owner and editor, workflowNodeEdgeHandles on workflowNode N is shown if and only if the pointer is in N's combined pointer-hover region per FR-WF-NODE-004; selection chrome per FR-WF-NODE-002 and workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003 do not substitute for pointer hover and do not suppress handles when N is hovered
      - dragging from a handle to author or edit workflow edges is out of scope here (workflow-edge requirements file)

    roleBehavior:
      owner:
        workflowNodeEdgeHandles: shownOnHover
      editor:
        workflowNodeEdgeHandles: shownOnHover
      commenter:
        workflowNodeEdgeHandles: notRendered
      viewer:
        workflowNodeEdgeHandles: notRendered
      user:
        workflowNodeEdgeHandles: notRendered

    acceptanceCriteria:
      - given actor is owner or editor and the pointer is outside workflowNode N's FR-WF-NODE-004 combined region, workflowNodeEdgeHandles is not rendered on N regardless of whether N shows workflowNodeSelectedBorder per FR-WF-NODE-002 or workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003
      - given actor is owner or editor and the pointer is within workflowNode N's FR-WF-NODE-004 combined region, workflowNodeEdgeHandles is rendered on N regardless of whether N shows workflowNodeSelectedBorder or workflowNodeOutcomeHighlightBorder
      - given actor is commenter, workflowNodeEdgeHandles is not rendered on any workflowNode
      - given actor is viewer or user, workflowNodeEdgeHandles is not rendered on any workflowNode

    openQuestions: []

