  workflowNodeTitle: "canonical_locators.yaml -> workflowNodeTitle"
  workflowNodeLinkedWorkflowIndicator: "canonical_locators.yaml -> workflowNodeLinkedWorkflowIndicator"
  workflowNodeMeta: "canonical_locators.yaml -> workflowNodeMeta"
  workflowNodeMetaContextTag: "canonical_locators.yaml -> workflowNodeMetaContextTag"
  workflowNodeMetaTaskTag: "canonical_locators.yaml -> workflowNodeMetaTaskTag"
  workflowNodeMetaTimeTag: "canonical_locators.yaml -> workflowNodeMetaTimeTag"
