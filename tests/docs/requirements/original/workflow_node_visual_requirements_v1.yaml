# Normalized requirements: workflowNode visual appearance and hover actions in 'Workflow' view
# Out of scope: canonical mapping of context-classification and task-classification values to workflowNodeMetaContextTag and workflowNodeMetaTaskTag icon glyphs and accessible names (deferred until a dedicated lookup or FR-WF-NODE-001 extension is authored).
# Source: Figma workflow node frame (see designEvidenceLinkTable); tests/docs/requirements/guidelines_functional_requirements.md
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml (workflowView; workflowNode canonical in workflow_edit_node_requirements_v1.yaml); tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml (workflowChannel colour and workflowNodeBorder fill sync — FR-CHAN-003 canonical; workflowNodeBorder stripe presentation — FR-WF-NODE-001; channel hover menu lockstep — FR-CHAN-007); tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (section hover menu lockstep — FR-SEC-007); tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml (canonical workflowNode, workflowEditNodeForm field values and applicability — FR-WF-EN-002 through FR-WF-EN-010; canvas layout and chrome — FR-WF-NODE-001); tests/docs/requirements/original/workflow_archive_requirements_v1.yaml (single-workflow archive clears parent node link—FR-WF-ARCH-003); tests/docs/requirements/original/project_archive_requirements_v1.yaml (project archive preserves in-project links—FR-PROJ-ARCH-003); tests/docs/requirements/original/workflow_copy_requirements_v1.yaml (same-project copy preserves links; cross-project copy clears links per FR-WF-ARCH-003—FR-WF-COPY-003); tests/docs/requirements/original/workflow_edge_requirements_v1.yaml (edge authoring — FR-WF-EDGE-001 through FR-WF-EDGE-004; aligns with workflowNodeEdgeHandles display — FR-WF-NODE-006 canonical); tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml (workflowNodeHoverActionsMenuDuplicateItem click outcomes — FR-WF-DUP-002; placement — FR-WF-DUP-003; defers hover-menu item roleBehavior to FR-WF-NODE-005); tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml (workflowNodeHoverActionsMenuDeleteItem click outcomes — FR-WF-DEL-002; defers hover-menu item roleBehavior to FR-WF-NODE-005); tests/docs/requirements/original/workflow_move_node_requirements_v1.yaml (move drag source — FR-WF-MV-001; workflowNodeHoverActionsMenu suppressed on all placed nodes during move drag — FR-WF-NODE-004); tests/docs/requirements/original/workflow_assign_outcome_to_node_requirements_v1.yaml (outcome-assign drag — FR-WF-AO-004; canvas hover-menu suppression during outcome-assign drag canonical in that FR); tests/docs/requirements/original/workflow_node_linked_outcomes_badge_requirements_v1.yaml (workflowNodeLinkedOutcomesBadge — FR-WF-AO-007 through FR-WF-AO-010); tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebarCommentsTab role actionability — FR-WF-RS-003, referenced by workflowNodeHoverActionsMenuCommentsItem); tests/docs/requirements/original/workflow_comments_tab_requirements_v1.yaml (workflowNodeHoverActionsMenuCommentsItem click-to-open flow — FR-WF-COMMENTS-001).
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002)
#
# Naming note: The earlier identifier 'workflowNodeHoverMenu' (and its items workflowNodeHoverMenuInsertItem, workflowNodeHoverMenuDuplicateItem, workflowNodeHoverMenuDeleteItem, workflowNodeHoverMenuCommentsItem) is replaced in this file by workflowNodeHoverActionsMenu (and workflowNodeHoverActionsMenuInsertItem, workflowNodeHoverActionsMenuDuplicateItem, workflowNodeHoverActionsMenuDeleteItem, workflowNodeHoverActionsMenuCommentsItem). tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml uses the same workflowNodeHoverActionsMenu* identifiers.

documentPreconditions:
  - user is authenticated to CourseFlow and viewing an existing workflow
  - current route is '/workflow/{id}/graph'
  - workflowView is open
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

uiObjectDefinitions:
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowSectionRow:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowChannel:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml.
  workflowNode:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowNodeBorder:
    meaning: Channel-colored top border stripe on a workflowNode in workflowView.
  workflowNodeContent:
    meaning: Body region of a workflowNode below workflowNodeBorder.
  workflowNodeTitle:
    meaning: Primary title label at the top of workflowNodeContent.
  workflowNodeLinkedWorkflowIndicator:
    meaning: Linked-workflow hyperlink between workflowNodeTitle and workflowNodeMeta.
  workflowNodeMeta:
    meaning: Footer tag region on workflowNodeContent for context, task, and time tags.
  workflowNodeMetaContextTag:
    meaning: Icon-only context-classification tag in workflowNodeMeta.
  workflowNodeMetaTaskTag:
    meaning: Icon-only task-type tag in workflowNodeMeta.
  workflowNodeMetaTimeTag:
    meaning: Icon-only time-duration tag in workflowNodeMeta.
  workflowNodeSelectedBorder:
    meaning: Selection outline rendered on a selected workflowNode.
  workflowNodeOutcomeHighlightBorder:
    meaning: Highlight outline on a workflowNode in workflowView when shown per FR-WF-NODE-003 (outcome-highlight presentation per FR-WF-AO-005).
  workflowNodeEdgeHandles:
    meaning: Grouped side-midpoint edge-attachment affordances on a workflowNode in workflowView.
  workflowNodeEdgeHandleTop:
    meaning: Top edge-attachment affordance in workflowNodeEdgeHandles.
  workflowNodeEdgeHandleRight:
    meaning: Right edge-attachment affordance in workflowNodeEdgeHandles.
  workflowNodeEdgeHandleBottom:
    meaning: Bottom edge-attachment affordance in workflowNodeEdgeHandles.
  workflowNodeEdgeHandleLeft:
    meaning: Left edge-attachment affordance in workflowNodeEdgeHandles.
  workflowEdge:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edge_requirements_v1.yaml.
  workflowNodeHoverActionsMenu:
    meaning: Four-icon hover action menu at the top-right of a workflowNode.
  workflowNodeHoverActionsMenuInsertItem:
    meaning: Insert-below icon button in workflowNodeHoverActionsMenu.
  workflowNodeHoverActionsMenuDuplicateItem:
    meaning: Duplicate icon button in workflowNodeHoverActionsMenu.
  workflowNodeHoverActionsMenuDeleteItem:
    meaning: Delete icon button in workflowNodeHoverActionsMenu.
  workflowNodeHoverActionsMenuCommentsItem:
    meaning: Comments icon button in workflowNodeHoverActionsMenu.
  workflowEditNodeForm:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowEditNodeFormTitleField:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowEditNodeFormActivityContextSelect:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowEditNodeFormCourseContextSelect:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowEditNodeFormTaskTypeSelect:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowEditNodeFormTimeField:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowAddTabInsertModeToggleGroup:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml.
  workflowManualPlacementDialog:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTabContent:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarCommentsTab:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTab:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml.

