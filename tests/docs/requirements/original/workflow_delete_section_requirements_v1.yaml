# Normalized requirements: delete an existing workflowSectionContainer ('Workflow' view)
# Source: tests/docs/__ARCHIVE/edit_section_requirements_v1.md
# Application code evidence: react/src/components/views/WorkflowView/WorkflowEditView/components/Week/HoverMenu/index.tsx (delete week dialog dispatch); react/src/components/pages/Workspace/Workflow/Sidebar/components/EditTab/components/EditSection/index.tsx (workflowEditSectionFormDeleteButton); workflow delete-week modal (aria-labelledby delete-week-part-modal per locator table in workflow_edit_section_requirements_v1.yaml)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (canonical section uiObjects including workflowSectionDeleteDialog*, workflowSectionContainerHoverActionsMenuDeleteItem, workflowEditSectionFormDeleteButton; FR-SEC-001, FR-SEC-007–009); tests/docs/requirements/original/workflow_duplicate_section_requirements_v1.yaml (duplicate section — FR-SEC-005)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/workflow'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published

