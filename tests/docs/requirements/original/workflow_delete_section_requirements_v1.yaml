locatorMappings:
  workflowView:
    strategy: null
    confidence: unresolved
  workflowSectionContainer:
    strategy: "[data-week-id]"
    confidence: confirmed
  workflowSectionContainerHoverActionsMenu:
    strategy: "{workflowSectionContainer} .hover-menu"
    confidence: inferred
  workflowRightSidebar:
    strategy: "[data-test-id='sidebar']"
    confidence: confirmed
  workflowSectionDeleteDialog:
    strategy: "[aria-labelledby='delete-week-part-modal']"
    confidence: inferred
  workflowEditSectionFormDeleteButton:
    strategy: null
    confidence: unresolved

requirements:
  - id: FR-SEC-006
    title: Delete section

    designEvidence:
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-OE-EDIT
      - FIGMA-SEC-DEL-WARN

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowSectionContainer
      - workflowSectionHeader
      - workflowSectionNumberLabel
      - workflowSectionContainerHoverActionsMenu
      - workflowSectionContainerHoverActionsMenuDeleteItem
      - workflowRightSidebar
      - workflowEditSectionForm
      - workflowEditSectionFormDeleteButton
      - workflowSectionDeleteDialog
      - workflowSectionDeleteDialogCancelButton
      - workflowSectionDeleteDialogConfirmButton

    preconditions:
      - workflowView contains a target workflowSectionContainer
      - for the hover-menu path, workflowSectionContainerHoverActionsMenuDeleteItem is active for the actor per this FR roleBehavior and FR-SEC-007 lockstep with FR-WF-NODE-005 in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml
      - for the sidebar path, workflowEditSectionFormDeleteButton is active for the actor per this FR roleBehavior

    trigger:
      - user clicks workflowSectionContainerHoverActionsMenuDeleteItem on workflowSectionContainerHoverActionsMenu visible on workflowSectionHeader hover
      - user clicks workflowEditSectionFormDeleteButton on workflowEditSectionForm in workflowRightSidebar

    mainFlow:
      - system identifies the target workflowSectionContainer from workflowSectionContainerHoverActionsMenuDeleteItem on that section's workflowSectionHeader, or from workflowEditSectionForm open in workflowRightSidebar for that workflowSectionContainer
      - system opens workflowSectionDeleteDialog for either entry path
      - if user clicks workflowSectionDeleteDialogCancelButton, workflowSectionDeleteDialog closes and workflowView is unchanged (target workflowSectionContainer, its workflowNodes and edges, and workflowSectionNumberLabel values unchanged)
      - if user clicks workflowSectionDeleteDialogConfirmButton, system removes the target workflowSectionContainer and its contained graph content (workflowNodes, edges, node metas, associated outcomes, comments per upstream) from workflowView, then recalculates workflowSectionNumberLabel on every remaining workflowSectionHeader per FR-SEC-002 in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml

    roleBehavior:
      owner:
        workflowSectionContainerHoverActionsMenuDeleteItem: active
        workflowEditSectionFormDeleteButton: active
      editor:
        workflowSectionContainerHoverActionsMenuDeleteItem: active
        workflowEditSectionFormDeleteButton: active
      commenter:
        workflowSectionContainerHoverActionsMenuDeleteItem: readOnly
        workflowEditSectionFormDeleteButton: readOnly
      viewer:
        workflowSectionContainerHoverActionsMenuDeleteItem: notRendered
        workflowEditSectionFormDeleteButton: readOnly
      user:
        workflowSectionContainerHoverActionsMenuDeleteItem: notRendered
        workflowEditSectionFormDeleteButton: readOnly

    acceptanceCriteria:
      - given workflowSectionDeleteDialog is open, target workflowSectionContainer is not removed until user clicks workflowSectionDeleteDialogConfirmButton
      - when user clicks workflowSectionDeleteDialogCancelButton, workflowSectionDeleteDialog closes and workflowView is unchanged
      - given confirmed delete via workflowSectionDeleteDialogConfirmButton, target workflowSectionContainer and its contained content are removed from workflowView and remaining workflowSectionNumberLabel values reflect the new order per FR-SEC-002
      - given actor is commenter with workflowSectionContainerHoverActionsMenu visible per FR-SEC-007, workflowSectionContainerHoverActionsMenuDeleteItem is readOnly and workflowSectionDeleteDialog does not open when that control is clicked
      - given actor is viewer or user (published-access), workflowSectionContainerHoverActionsMenu is not rendered on workflowSectionHeader hover per FR-SEC-007 lockstep with FR-WF-NODE-004, so workflowSectionContainerHoverActionsMenuDeleteItem is not reachable and workflowSectionDeleteDialog cannot be opened via the hover path

    openQuestions: []

