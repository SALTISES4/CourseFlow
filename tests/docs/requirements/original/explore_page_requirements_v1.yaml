# Normalized requirements: 'Explore' page (route /explore) — filters and sort
# Source: tests/docs/__ARCHIVE/functional-requirements.md ('Explore' section)
# Illustrative implementation paths (traceability only; not normative for behaviour, especially filters not yet built): react/src/components/pages/Library/Explore/index.tsx
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/main_navigation_requirements_v1.yaml (explore navigation); tests/docs/requirements/original/library_page_requirements_v1.yaml (shared library search experience—typeFilter matches FR-LIB-003: Unset, committed 'Projects', or committed 'Workflows' only, with no 'All types' row ('Explore' first land leaves typeFilter Unset; 'My library' first land commits 'Projects' per FR-LIB-001); keywordSearchField, sortControl, workflowTypeFilter, favouritesToggle, templatesToggle, resultsSummary, resultsRegion, pagination—same interaction patterns as FR-LIB-002 through FR-LIB-005, including sort options and behaviour per FR-LIB-002; default list order before explicit sort is most recently modified, same as FR-LIB-002; 'Explore' only: disciplineFilter); tests/docs/requirements/original/project_create_edit_form_requirements_v1.yaml (createProjectDialog, projectForm, projectDisciplineField—disciplineFilter option catalogue aligns with projectDisciplineField); tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard, FR-CARD-001 and FR-CARD-003; workflowCard, workflowCard, cardTemplateChip, FR-CARD-002 and FR-CARD-004; FR-EXP-005 template rows use projectCard and workflowCard by typeFilter)

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  explorePage:
    meaning: The 'Explore' surface at route pathname /explore with no additional path prefix segment (confirmed for FR-EXP-001); lists published projects and workflows (mixed result types), with sort and filters per 'Explore' functional requirements. Application route enum registers `CFRoutes.EXPLORE` as `/${DOMAIN}/explore` with `DOMAIN` = `course-flow`; acceptance tests resolve the canonical product path `/explore` against the deployed base URL or router config.
  exploreFilterToolbar:
    meaning: Horizontal toolbar on explorePage containing sortControl, disciplineFilter, typeFilter, workflowTypeFilter (only when typeFilter includes 'Workflows' in scope—when typeFilter is committed to 'Workflows', or when typeFilter is Unset (no committed 'Projects' or 'Workflows'), same as 'My library' FR-LIB-003), favouritesToggle, templatesToggle, and keywordSearchField; control order per design evidence for 'Explore'. Omits controls that exist only on 'My library' (ownershipFilter and archiveToggle); see library_page_requirements_v1.yaml FR-LIB-003.
  sortControl:
    meaning: Same canonical behaviour as sortControl on 'My library' (FR-LIB-002), applied on exploreFilterToolbar; canonical labels are placeholder 'Sort', options 'A - Z' and 'Date created'; on first load of /explore the list is ordered by most recently modified (same default as 'My library' per FR-LIB-002—see resultsRegion); user may open the control to choose 'A - Z' or 'Date created'; first click on an option applies ascending order, second click on the same option toggles to descending; when a non-default sort is active, the control shows 'A - Z' or 'Date created' as the visible label (instead of 'Sort') together with sortResetButton.
  sortResetButton:
    meaning: Same canonical behaviour as sortResetButton on 'My library' (FR-LIB-002); clear (X) on sortControl when a non-default sort is active; clears the active sort and restores default ordering by most recently modified.
  disciplineFilter:
    meaning: Multiselect discipline filter on exploreFilterToolbar; same interaction pattern as workflowTypeFilter on 'My library' (FR-LIB-003)—popover with disciplineFilterSearchField, scrollable checklist, disciplineFilterAllOption, disciplineFilterNoneOption, and disciplineFilterSelectionIndicator when at least one discipline is selected. Options use the same discipline catalogue as projectDisciplineField on projectForm in createProjectDialog (see project_create_edit_form_requirements_v1.yaml; populated from application context at runtime). Within disciplineFilter, selected disciplines are additive (OR semantics), and a row may match any selected discipline. When a discipline row has no matching results in the current query context, that row's checkbox is read-only and cannot be clicked (same rule as workflowTypeFilter on 'My library', FR-LIB-003).
  disciplineFilterSearchField:
    meaning: Text field inside the disciplineFilter popover that filters the visible discipline list by label; canonical placeholder on 'Explore' is 'Find discipline' (per design).
  disciplineFilterAllOption:
    meaning: Control labeled 'All' at the bottom of the disciplineFilter popover; selects every discipline currently visible in the popover checklist that is selectable only (after any disciplineFilterSearchField narrowing); read-only rows with zero matching results are not toggled; same semantics as workflowTypeFilter 'All' in FR-LIB-003 (filtered options only).
  disciplineFilterNoneOption:
    meaning: Control labeled 'None' at the bottom of the disciplineFilter popover; clears every selected discipline so no discipline filter is applied.
  disciplineFilterSelectionIndicator:
    meaning: Count badge on the closed disciplineFilter trigger when at least one discipline is selected; same visual role as workflowTypeFilterSelectionIndicator (per design).
  typeFilter:
    meaning: Same canonical behaviour as typeFilter on 'My library' (FR-LIB-003), applied on exploreFilterToolbar. Single-select 'Type'; placeholder 'Type'. Exactly three states—no separate menu row meaning 'All types'. Unset means no committed 'Projects' or 'Workflows' (both published projects and workflows in scope when other filters allow). Committed 'Projects' and committed 'Workflows' are the only menu commitments; Unset is the cleared state (placeholder 'Type'). On first land of /explore after navigation to this surface, typeFilter is Unset (not committed 'Projects'), which differs from 'My library' default per FR-LIB-001. When committed, visible label is 'Projects' or 'Workflows' with typeFilterResetButton per FR-LIB-003 and product rules (see typeFilter in library_page_requirements_v1.yaml).
  typeFilterResetButton:
    meaning: Same control role as typeFilterResetButton on 'My library' (FR-LIB-003), on exploreFilterToolbar. Clear (X) on typeFilter when committed 'Projects' or 'Workflows' is active and reset is offered per design; clearing restores Unset (placeholder 'Type') on 'Explore'.
  workflowTypeFilter:
    meaning: Same multiselect contract as workflowTypeFilter on 'My library' (FR-LIB-003)—exactly three options 'Activity', 'Course', and 'Program'; 'All', 'None', and workflowTypeFilterSelectionIndicator; OR semantics across selected types; when an option has no matching results in the current query context, that option's checkbox is read-only and cannot be clicked. It is visible only when typeFilter includes 'Workflows' in scope—that is, when typeFilter is committed to 'Workflows', or when typeFilter is Unset (no committed 'Projects' or 'Workflows'), per FR-LIB-003; it is not visible when typeFilter is committed to 'Projects' only. When not visible, it does not occupy toolbar space.
  workflowTypeFilterSelectionIndicator:
    meaning: Same as workflowTypeFilterSelectionIndicator on 'My library' (FR-LIB-003); numeric badge when at least one workflow-type option is selected.
  favouritesToggle:
    meaning: Boolean favourites filter on exploreFilterToolbar; same behavior as favouritesToggle on 'My library' (FR-LIB-003)—when on, results are limited to favourites; when off, favourites filter is not applied.
  templatesToggle:
    meaning: Boolean template filter on exploreFilterToolbar (toggle labeled 'Templates' with icon per design); same interaction pattern as favouritesToggle—when on, results are limited to templates; when off, template constraint is not applied. When on, each populated card in resultsRegion is a projectCard or workflowCard per card_content_requirements_v1.yaml and FR-EXP-005 (by typeFilter scope), not a separate generic template-card object.
  keywordSearchField:
    meaning: Same commitment and title-only semantics as keywordSearchField on 'My library' (FR-LIB-004), applied inline on exploreFilterToolbar (keyword field on the right side of the toolbar per design—not a separate overlay); searches project titles and workflow titles only.
  keywordSearchClearButton:
    meaning: Same as keywordSearchClearButton on 'My library' (FR-LIB-004)—icon-only clear on the right when keywordSearchField is non-empty.
  resultsSummary:
    meaning: Same canonical object as resultsSummary in library_page_requirements_v1.yaml—region between exploreFilterToolbar and resultsRegion that displays total or range result counts for the current query (e.g. 'Showing X of XX results'); exact copy and whether the region is shown on 'Explore' follows design evidence (same role as on 'My library' when present).
  resultsRegion:
    meaning: Main content area listing published projects and workflows for the current query with the same layout and paging envelope as resultsRegion in library_page_requirements_v1.yaml—fixed two-column grid, always exactly two cards per row everywhere this object appears, at most five rows per page (10 projectCard and/or workflowCard instances per page), plus empty, loading, and error states. Default order is most recently modified first (same default sort behavior as 'My library' FR-LIB-002) until the user applies a non-default sort via sortControl ('A - Z' or 'Date created', per FR-LIB-002). Page index and counts follow the search response meta for the active query (loading UI uses 10 skeleton placeholders).
  projectCard:
    meaning: Same canonical object as projectCard in card_content_requirements_v1.yaml; on explorePage, one row per published project in the current result set when project rows are in scope, using the same listing card pattern as other library-style search surfaces.
  workflowCard:
    meaning: Same canonical object as workflowCard in card_content_requirements_v1.yaml; on explorePage, one row per published workflow in the current result set when workflow rows are in scope, using the same listing card pattern as other library-style search surfaces.
  cardTemplateChip:
    meaning: Same canonical object as cardTemplateChip in card_content_requirements_v1.yaml; shown on workflowCard when the workflow row represents a template.
  pagination:
    meaning: Same control as pagination on 'My library' (FR-LIB-005)—shown when total matching published projects and workflows are 11 or more (more than one page at 10 cards per page); not shown when total matches are 10 or fewer. Includes paginationPageNumberButton, paginationPreviousNextButton, and paginationFirstLastButton.
  paginationPageNumberButton:
    meaning: Same as paginationPageNumberButton on 'My library' (FR-LIB-005).
  paginationPreviousNextButton:
    meaning: Same as paginationPreviousNextButton on 'My library' (FR-LIB-005).
  paginationFirstLastButton:
    meaning: Same as paginationFirstLastButton on 'My library' (FR-LIB-005).
  exploreLoadingState:
    meaning: Loading placeholders shown while the library objects search query is in flight.
  exploreEmptyState:
    meaning: Empty state when the search returns zero matching objects; includes at least “No results found” copy in current implementation.
  exploreErrorState:
    meaning: Error state when the library objects search query fails.

