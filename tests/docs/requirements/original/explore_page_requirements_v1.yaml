    confidence: inferred
  sortResetButton:
    strategy: "{sortControl} button[aria-label='close'] or icon-only clear control adjacent to active sort label"
    confidence: inferred
  disciplineFilter:
    strategy: "{exploreFilterToolbar} multiselect with placeholder 'Discipline'"
    confidence: inferred
  disciplineFilterSearchField:
    strategy: "{disciplineFilter} popover TextField labeled 'Find discipline'"
    confidence: inferred
  disciplineFilterAllOption:
    strategy: "{disciplineFilter} popover footer button with label 'All'"
    confidence: confirmed
  disciplineFilterNoneOption:
