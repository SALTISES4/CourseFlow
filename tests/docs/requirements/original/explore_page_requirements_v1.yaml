# Normalized requirements: 'Explore' page (route /explore) — filters and sort
# Source: tests/docs/__ARCHIVE/functional-requirements.md ('Explore' section)
# Illustrative implementation paths (traceability only; not normative for behaviour, especially filters not yet built): react/src/components/pages/Library/Explore/index.tsx
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/main_navigation_requirements_v1.yaml (explore navigation); tests/docs/requirements/original/library_page_requirements_v1.yaml (shared library search experience—typeFilter matches FR-LIB-003: Unset, committed 'Projects', or committed 'Workflows' only, with no 'All types' row ('Explore' first land leaves typeFilter Unset; 'My library' first land commits 'Projects' per FR-LIB-001); keywordSearchField, sortControl, workflowTypeFilter, favouritesToggle, templatesToggle, resultsSummary, resultsRegion, pagination—same interaction patterns as FR-LIB-002 through FR-LIB-005, including sort options and behaviour per FR-LIB-002; default list order before explicit sort is most recently modified, same as FR-LIB-002; 'Explore' only: disciplineFilter); tests/docs/requirements/original/project_create_edit_form_requirements_v1.yaml (createProjectDialog, projectForm, projectDisciplineField—disciplineFilter option catalogue aligns with projectDisciplineField); tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard and workflowCard — FR-CARD-001 through FR-CARD-006 as applicable)

