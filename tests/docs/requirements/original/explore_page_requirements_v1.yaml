requirements:
  - id: FR-EXP-001
    title: "'Explore' route and published scope"

    designEvidence:
      - FIGMA-EXPLORE-DEFAULT
      - FIGMA-EXPLORE-ERROR
      - FIGMA-EXPLORE-SELECTED-FILTER-TEMPLATE

    actors:
      - user

    uiObjects:
      - explorePage
      - exploreFilterToolbar
      - resultsSummary
      - resultsRegion
      - pagination
      - paginationPageNumberButton
      - paginationPreviousNextButton
      - paginationFirstLastButton
      - projectCard
      - workflowCard
      - exploreLoadingState
      - exploreEmptyState
      - exploreErrorState

    preconditions:
      - current route pathname is /explore (no path segment before /explore)
      - user may reach explorePage via main navigation or direct navigation

    trigger:
      - user navigates to explorePage
      - library objects search query state changes or user interacts with pagination controls

    mainFlow:
      - explorePage base query scope is limited to published, non-archived projects and workflows per FR-PROJ-OV-003; child workflows inherit parent project publish state
      - toolbar filters in FR-EXP-002 through FR-EXP-006 apply subtractively within this base scope only
      - system renders explorePage with vertical order exploreFilterToolbar, then resultsSummary, then resultsRegion (same stacking contract as 'My library' FR-LIB-001)
      - projects and workflows marked as published are listed in resultsRegion
      - when resultsRegion is not empty, resultsSummary shows a count summary (e.g. 'Showing X of XX results') consistent with the total matching published objects and current page (same behavior as 'My library' FR-LIB-001)
      - disciplineFilter, typeFilter, workflowTypeFilter (when visible), favouritesToggle, and templatesToggle are cumulative (subtractive / AND semantics): when multiple filters are active, results include only items that satisfy all active filters simultaneously (same combined filter rule as 'My library' FR-LIB-003)
      - default sort on explorePage conforms to FR-EXP-002
      - resultsRegion shows at most 10 projectCard and/or workflowCard instances for the current page
      - when total matching published projects and workflows are 11 or more, system shows pagination below resultsRegion
      - when total matching published projects and workflows are 10 or fewer, system does not show pagination
      - while library objects search query is loading, system shows exploreLoadingState in resultsRegion
      - when search returns published items for the current page, system renders one projectCard or workflowCard per item shown in resultsRegion (up to 10)
      - primary click navigation for projectCard instances follows FR-CARD-003 and for workflowCard instances follows FR-CARD-004
      - when search returns zero matching published items, system shows exploreEmptyState in resultsRegion
      - when library objects search query fails, system shows exploreErrorState in resultsRegion
      - when user selects a page or uses paginationPageNumberButton, paginationPreviousNextButton, or paginationFirstLastButton, system loads that page of results into resultsRegion per backend contract; resultsSummary reflects the current range when applicable (same pattern as 'My library' FR-LIB-001)

    roleBehavior: {}

    acceptanceCriteria:
      - given explorePage is rendered, exploreFilterToolbar, resultsSummary, and resultsRegion are in vertical order (same pattern as 'My library' FR-LIB-001)
      - given first land with no keyword entered and at least one visible published project or workflow, resultsSummary is visible and reflects result counts for the default query state
      - given first land, typeFilter is Unset (placeholder 'Type') and workflowTypeFilter is visible
      - given successful search, resultsRegion lists only published projects and workflows
      - given more than one of disciplineFilter, typeFilter, workflowTypeFilter (when active), favouritesToggle, and templatesToggle constrains the query, resultsRegion contains only projectCard and workflowCard instances that match every active filter constraint
      - given successful search with at least one result, at least one projectCard or workflowCard is visible and at most 10 projectCard or workflowCard instances appear in resultsRegion
      - given 11 or more matching published projects and workflows, pagination is visible
      - given at most 10 matching published projects and workflows, pagination is not visible
      - given library objects search query is loading, exploreLoadingState is visible in resultsRegion
      - given successful search with zero matching items, exploreEmptyState is visible
      - given failed library objects search, exploreErrorState is visible
      - given successful search with at least one result, projectCard and workflowCard instances in resultsRegion conform to card_content_requirements_v1.yaml
      - given user selects a different paginationPageNumberButton, resultsRegion updates to show up to 10 projectCard or workflowCard instances for that page per backend contract
      - given pagination is visible, paginationPreviousNextButton and paginationFirstLastButton behave as on 'My library' (FR-LIB-001)
      - given user selects a different page, resultsSummary reflects the current range (e.g. 'Showing X of XX results') per product rules (same pattern as 'My library' FR-LIB-001)

    openQuestions: []

  - id: FR-EXP-002
    title: Sort on 'Explore' (same as 'My library', FR-LIB-002)

    designEvidence:
      - FIGMA-EXPLORE-DEFAULT
      - FIGMA-EXPLORE-FILTER-OPEN

    actors:
      - user

    uiObjects:
      - explorePage
      - exploreFilterToolbar
      - sortControl
      - sortResetButton
      - resultsRegion

    preconditions:
      - explorePage is rendered

    trigger:
      - user interacts with sortControl or sortResetButton

    mainFlow:
      - sortControl behaviour conforms to library_page_requirements_v1.yaml FR-LIB-002 on explorePage resultsRegion, except default and reset sort apply to projectCard and workflowCard instances in resultsRegion per explorePage base query scope and active typeFilter (first land typeFilter is Unset per FR-EXP-001)
      - when user changes sortControl or sortResetButton on explorePage, listing resets to the first results page

    roleBehavior: {}

    acceptanceCriteria:
      - given explorePage is rendered, sortControl offers the same options and toggle/reset interaction as FR-LIB-002
      - given user lands with no prior sort selection in session, projectCard and workflowCard instances in resultsRegion are ordered by most recently modified (first land typeFilter is Unset per FR-EXP-001)
      - given user clicks sortResetButton, sort returns to most recently modified ordering for projectCard and workflowCard instances in resultsRegion per current typeFilter scope and sortControl shows label 'Sort'

    openQuestions: []

  - id: FR-EXP-003
    title: Discipline filter (multiselect, search, 'All', 'None', selection indicator)

    designEvidence:
      - FIGMA-EXPLORE-FILTER-OPEN
      - FIGMA-EXPLORE-SELECTED-FILTER-TEMPLATE

    actors:
      - user

    uiObjects:
      - explorePage
      - exploreFilterToolbar
      - disciplineFilter
      - disciplineFilterSearchField
      - disciplineFilterAllOption
      - disciplineFilterNoneOption
      - disciplineFilterSelectionIndicator
      - resultsRegion

    preconditions:
      - explorePage is rendered

    trigger:
      - user opens disciplineFilter and uses search, 'All', 'None', or individual discipline checkboxes, then closes or applies the selection

    mainFlow:
      - user can restrict results to one or more disciplines; disciplineFilter selectable options match the fixed discipline catalogue per FR-PROJ-FORM-001 in tests/docs/requirements/original/project_create_form_requirements_v1.yaml, ordered alphabetically from A to Z
      - when a discipline row has no matching results in the current query context, that row's checkbox is read-only and cannot be clicked (same read-only zero-result rule as workflowTypeFilter per FR-LIB-003)
      - when more than one discipline is selected, discipline matching is additive (OR): a row is eligible if it matches any selected discipline
      - disciplineFilterSearchField lets the user type to narrow which disciplines appear in the checklist (label match)
      - disciplineFilterAllOption and disciplineFilterNoneOption follow the same multiselect 'All' and 'None' interaction pattern as workflowTypeFilter per FR-LIB-003, applied to the discipline checklist (including search-narrowed visible rows only)
      - disciplineFilterNoneOption clears all selected disciplines so the query is not constrained by discipline
      - when at least one discipline is selected, the closed disciplineFilter trigger shows disciplineFilterSelectionIndicator with the number of selected disciplines, styled per design for the multiselect trigger
      - when no disciplines are selected, disciplineFilterSelectionIndicator is not shown
      - when typeFilter, workflowTypeFilter (when visible), favouritesToggle, and/or templatesToggle are active, discipline filtering is subtractive with those filters (intersection of active constraints)
      - changing discipline selection resets listing to the first results page

    roleBehavior: {}

    acceptanceCriteria:
      - given user opens disciplineFilter, selectable discipline options match projectDisciplineField selectable options per FR-PROJ-FORM-001 in tests/docs/requirements/original/project_create_form_requirements_v1.yaml
      - given user opens disciplineFilter, disciplineFilterSearchField is available with 'Find discipline' (or equivalent) as the field label per design
      - given user types in disciplineFilterSearchField, only disciplines whose labels match the search term are shown in the checklist
      - given user chooses disciplineFilterAllOption, every selectable discipline currently visible in the popover checklist becomes selected, and no discipline hidden by disciplineFilterSearchField is selected solely because of 'All'; read-only disciplines with zero matching results stay unselected
      - given a discipline row has no matching results in the current query context, that row's checkbox is read-only and does not change selection when the user attempts to click it
      - given user chooses disciplineFilterNoneOption, no disciplines remain selected and discipline filter does not constrain results
      - given user selects one or more disciplines, disciplineFilterSelectionIndicator is visible on the filter trigger, displays the count of selected disciplines in a grey badge
      - given no disciplines are selected, disciplineFilterSelectionIndicator is not visible
      - given user selects disciplines, resultsRegion reflects the constrained result set when backend returns matches
      - given user selects two or more disciplines, resultsRegion includes projectCard and workflowCard instances matching discipline A or discipline B (or any other selected discipline)
      - given user selects disciplines while other toolbar filters are active, resultsRegion includes only projectCard and workflowCard instances that match at least one selected discipline and satisfy every other active filter
      - given user clears all discipline selections (including via 'None'), discipline filter does not constrain by discipline (no discipline constraint in the reduced search request when none are selected)

    openQuestions: []

  - id: FR-EXP-004
    title: Type filter and workflow type filter (library-aligned behavior on 'Explore')

    designEvidence:
      - FIGMA-EXPLORE-FILTER-OPEN
      - FIGMA-EXPLORE-SEARCH-TERM

    actors:
      - user

    uiObjects:
      - explorePage
      - exploreFilterToolbar
      - typeFilter
      - typeFilterResetButton
      - workflowTypeFilter
      - workflowTypeFilterSelectionIndicator
      - resultsRegion

    preconditions:
      - explorePage is rendered

    trigger:
      - user changes typeFilter or workflowTypeFilter, uses typeFilterResetButton, or uses workflow type 'All'/'None' controls

    mainFlow:
      - typeFilter and workflowTypeFilter behaviour conform to library_page_requirements_v1.yaml FR-LIB-003 on exploreFilterToolbar
      - on first land on explorePage, typeFilter is Unset per FR-EXP-001 (published projects and workflows in scope when other filters allow)
      - when disciplineFilter, favouritesToggle, and/or templatesToggle are active, typeFilter and workflowTypeFilter constraints are subtractive with those filters
      - changing typeFilter or workflowTypeFilter resets listing to the first results page

    roleBehavior: {}

    acceptanceCriteria:
      - given explorePage is rendered, typeFilter and workflowTypeFilter behaviour conform to FR-LIB-003
      - given typeFilter is unset (initial state or after reset), resultsRegion includes both published projects and published workflows in scope when other filters allow
      - given typeFilter is committed to 'Projects' only, workflowTypeFilter is not visible
      - given user selects a type scope, resultsRegion reflects that constraint per backend contract for published objects
      - given user clears type via typeFilterResetButton when shown, typeFilter returns to Unset (both published projects and workflows in scope when other filters allow)
      - given user applies typeFilter and workflowTypeFilter while other filters are active, resultsRegion includes only projectCard and workflowCard instances that satisfy every active filter

    openQuestions: []

  - id: FR-EXP-005
    title: Templates and favourites toggles (boolean)

    designEvidence:
      - FIGMA-EXPLORE-SELECTED-FILTER-TEMPLATE
      - FIGMA-EXPLORE-FILTER-OPEN

    actors:
      - user

    uiObjects:
      - explorePage
      - exploreFilterToolbar
      - typeFilter
      - templatesToggle
      - favouritesToggle
      - resultsRegion
      - projectCard
      - workflowCard

    preconditions:
      - explorePage is rendered

    trigger:
      - user toggles templatesToggle or favouritesToggle on or off

    mainFlow:
      - favouritesToggle is boolean; first click turns it on and restricts resultsRegion to favourited projectCard and workflowCard instances within explorePage base query scope per FR-EXP-001; second click turns it off and removes that constraint
      - templatesToggle is boolean; first click turns it on and restricts resultsRegion to template projectCard and workflowCard instances only (template workflows show cardTemplateChip per card_content_requirements_v1.yaml FR-CARD-002); second click turns it off and removes that constraint
      - when templatesToggle is active, every projectCard and workflowCard instance in resultsRegion conforms to card_content_requirements_v1.yaml per typeFilter scope
      - when disciplineFilter, typeFilter, workflowTypeFilter (when visible), and the other boolean toggle are active, each boolean filter is subtractive with all other active filters (intersection)
      - toggling either control resets listing to the first results page

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks favouritesToggle once, the favourites filter is active within explorePage base query scope; given user clicks favouritesToggle again, the favourites filter is inactive
      - given user clicks templatesToggle once, the templates filter is active; given user clicks templatesToggle again, the templates filter is inactive
      - given templatesToggle is active and typeFilter is committed to 'Projects' only, every projectCard in resultsRegion conforms to card_content_requirements_v1.yaml
      - given templatesToggle is active and typeFilter is committed to 'Workflows' only, every instance in resultsRegion is a workflowCard
      - given templatesToggle is active and typeFilter is Unset, every instance in resultsRegion is a projectCard or workflowCard
      - given templatesToggle is inactive, resultsRegion includes projectCard and/or workflowCard instances per typeFilter and object data
      - given templatesToggle is active while other toolbar filters are active, resultsRegion includes only projectCard and workflowCard instances that satisfy the template constraint and every other active filter
      - given favouritesToggle is active while other toolbar filters are active, resultsRegion includes only favourited projectCard and workflowCard instances that satisfy every other active filter

    openQuestions: []

  - id: FR-EXP-006
    title: Keyword search (project and workflow titles)

    designEvidence:
      - FIGMA-EXPLORE-SEARCH-TERM

    actors:
      - user

    uiObjects:
      - explorePage
      - exploreFilterToolbar
      - keywordSearchField
      - keywordSearchClearButton
      - resultsRegion

    preconditions:
      - explorePage is rendered

    trigger:
      - user enters or commits keyword search via keywordSearchField, or clears via keywordSearchClearButton

    mainFlow:
      - keywordSearchField is inline within exploreFilterToolbar (same toolbar row as other filters per design), not an overlay surface
      - Same contract as keyword search on 'My library' (FR-LIB-004)—keyword search matches project and workflow titles only; results narrow as user types; keywordSearchClearButton clears the field and removes keyword constraint
      - keyword and toolbar filter constraints combine on explorePage; both apply subtractively to resultsRegion within explorePage base query scope per FR-EXP-001
      - resultsRegion lists matching projectCard and workflowCard items only, up to 10 per page with pager when 11 or more total matches (same paging rule as 'My library' FR-LIB-001)
      - when keyword search changes, system resets listing to the first results page

    roleBehavior: {}

    acceptanceCriteria:
      - given explorePage is rendered, keywordSearchField is inline within exploreFilterToolbar (not an overlay)
      - given keyword matches a published project or workflow title, a matching projectCard or workflowCard instance appears in resultsRegion when other filters allow it
      - given keywordSearchField is non-empty, keywordSearchClearButton is visible; given user clicks it, field clears and keyword filter is removed
      - given user applies one or more filters and types in keywordSearchField, keyword and filter constraints both apply to resultsRegion
      - given user types in keywordSearchField and then changes filters, keyword and filter constraints both apply to resultsRegion

    openQuestions: []

