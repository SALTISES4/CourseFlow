# Normalized requirements: 'Explore' page (route /explore) — filters and sort
# Source: tests/docs/__ARCHIVE/functional-requirements.md ('Explore' section)
# Illustrative implementation paths (traceability only; not normative for behaviour, especially filters not yet built): react/src/components/pages/Library/Explore/index.tsx
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/main_navigation_requirements_v1.yaml (explore navigation); tests/docs/requirements/original/library_page_requirements_v1.yaml (shared library search experience—typeFilter and workflowTypeFilter per FR-LIB-003; templatesToggle uiObject canonical here, behaviour per FR-EXP-005; keywordSearchField, sortControl, favouritesToggle, resultsSummary, resultsRegion, pagination—shared patterns with FR-LIB-002 through FR-LIB-004 where cross-referenced per FR; pagination per FR-LIB-001; default list order before explicit sort is most recently modified, same as FR-LIB-002; 'Explore' only: disciplineFilter); tests/docs/requirements/original/project_overview_requirements_v1.yaml (FR-PROJ-OV-003 — publish state and 'Explore' catalog eligibility); tests/docs/requirements/original/project_create_form_requirements_v1.yaml (createProjectDialog, projectForm, projectDisciplineField—disciplineFilter option catalogue aligns with projectDisciplineField); tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard and workflowCard — FR-CARD-001 through FR-CARD-006 as applicable)

documentPreconditions:
  - user is authenticated to CourseFlow
  - explorePage base query scope is limited to published, non-archived projects and workflows per FR-EXP-001; publish state is defined in tests/docs/requirements/original/project_overview_requirements_v1.yaml FR-PROJ-OV-003

