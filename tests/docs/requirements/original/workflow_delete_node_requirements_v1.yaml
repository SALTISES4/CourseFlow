  workflowChannel: "canonical_locators.yaml -> workflowChannel"
  workflowNode: "canonical_locators.yaml -> workflowNode"
  workflowEdge: "canonical_locators.yaml -> workflowEdge"
  workflowEditNodeForm: "canonical_locators.yaml -> workflowEditNodeForm"
  workflowEditNodeFormDeleteButton: "canonical_locators.yaml -> workflowEditNodeFormDeleteButton"
  workflowRightSidebar: "canonical_locators.yaml -> workflowRightSidebar"
  workflowRightSidebarEditTab: "canonical_locators.yaml -> workflowRightSidebarEditTab"
  workflowRightSidebarEditTabContent: "canonical_locators.yaml -> workflowRightSidebarEditTabContent"
  workflowRightSidebarCommentsTabContent: "canonical_locators.yaml -> workflowRightSidebarCommentsTabContent"
