# Normalized requirements: delete an existing workflowNode ('Workflow' view)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Node Actions ▸ Delete, lines 872–876; Edges ▸ When Nodes are deleted, lines 1045–1046)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml (workflowEditNodeForm and workflowEditNodeFormDeleteButton canonical placement on the right sidebar); tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar collapsed/expanded presentation — FR-WF-RS-001); tests/docs/requirements/original/workflow_duplicate_node_requirements_v1.yaml (companion node-action flow); tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (workflowNodeHoverActionsMenu visibility — FR-WF-NODE-004; workflowNodeHoverActionsMenuDeleteItem actionability — FR-WF-NODE-005, canonical for hover-menu item roleBehavior); tests/docs/requirements/original/workflow_edge_requirements_v1.yaml (canonical workflowEdge; node delete does not restate edge cleanup — FR-WF-DEL-004); tests/docs/requirements/original/workflow_move_node_requirements_v1.yaml (edge preservation on move — FR-WF-MV-005); tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (workflowView, workflowSectionContainer, workflowSectionRow canonical definitions); tests/docs/requirements/original/workflow_overview_requirements_v1.yaml (node delete triggers overview auto-calculate per FR-WF-OV-003 through FR-WF-OV-006; reflected on Overview per FR-WF-OV-010)
#   - FR-WS-ACCESS-002 (denied access when documentPreconditions fail)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/graph'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowView is open with at least one workflowSectionContainer that contains at least one workflowNode
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

