    strategy: null
    confidence: unresolved
  workflowSectionContainer:
    strategy: "[data-week-id]"
    confidence: confirmed
  workflowSectionRow:
    strategy: null
    confidence: unresolved
  workflowChannel:
    strategy: null
    confidence: unresolved
  workflowNode:
    strategy: null
    confidence: unresolved
  workflowEdge:
    strategy: null
    confidence: unresolved
  workflowEditNodeForm:
    strategy: null
    confidence: unresolved
  workflowEditNodeFormDeleteButton:
    strategy: "{workflowEditNodeForm} button with text 'Delete'"
    confidence: inferred
  workflowRightSidebar:
    strategy: null
    confidence: unresolved
  workflowRightSidebarEditTab:
    strategy: null
    confidence: unresolved
