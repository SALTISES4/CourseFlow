# Normalized requirements: password reset page while logged in (change password)
# Source: Figma design evidence
# Scope: authenticated password change at '/user/password-reset' only; not the logged-out forgot-password flow at '/password-reset' (see tests/docs/requirements/original/forgot_password_requirements_v1.yaml; entry from loginForgotPasswordLink per tests/docs/requirements/original/login_requirements_v1.yaml FR-LOGIN-001). PasswordResetDialog in application code is legacy/out of scope; canonical flow is passwordResetPage at '/user/password-reset' per FR-PWD-001 through FR-PWD-005.
# Cross-reference: tests/docs/requirements/original/top_navigation_requirements_v1.yaml (account menu routes to '/user/password-reset' per FR-TOP-003); tests/docs/requirements/original/login_requirements_v1.yaml (logged-out reset at '/password-reset' per tests/docs/requirements/original/forgot_password_requirements_v1.yaml); tests/docs/requirements/original/forgot_password_requirements_v1.yaml (logged-out set-password form validation and passwordNewPasswordGuidelines copy align with forgotPasswordSetPasswordGuidelines per FR-FPWD-007 and FR-REG-001); tests/docs/requirements/original/register_requirements_v1.yaml (passwordNewPasswordGuidelines copy per FR-REG-001); tests/docs/requirements/original/profile_settings_requirements_v1.yaml (account email address per profileUsernameField and FR-PROFILE-002); tests/docs/requirements/original/card_content_requirements_v1.yaml (globalMessageSnackbar — FR-CARD-005)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
#
# IMPORTANT: Page chrome (global top bar, main nav) follows documentPreconditions and tests/docs/requirements/original/top_navigation_requirements_v1.yaml; this file pins passwordResetPage content only.

documentPreconditions:
  - user is authenticated to CourseFlow
  - user is within the main application shell

uiObjectDefinitions:
  passwordResetPage:
    meaning: Full-page change-password experience at route '/user/password-reset' for authenticated users; distinct from forgotPasswordPage at '/password-reset' per tests/docs/requirements/original/forgot_password_requirements_v1.yaml.
  passwordResetTitle:
    meaning: Page title for the password reset screen; literal text 'Password reset'.
  passwordResetForm:
    meaning: Form on passwordResetPage for current password, new password, and confirmation.
  currentPasswordField:
    meaning: Required secret input labeled 'Current password' on passwordResetForm for the user's current account password.
  newPasswordField:
    meaning: Required secret input labeled 'New password' on passwordResetForm for the new account password.
  confirmNewPasswordField:
    meaning: Required secret input labeled 'Confirm new password' on passwordResetForm to confirm newPasswordField.
  passwordNewPasswordGuidelines:
    meaning: Informational helper text on passwordResetForm for newPasswordField; copy per FR-REG-001.
  passwordResetSubmitButton:
    meaning: Primary submit button on passwordResetForm labeled 'Reset password'.
  passwordResetConfirmationEmail:
    meaning: Email sent to the authenticated user's account email address after a successful password change on passwordResetPage; subject and body copy per FR-PWD-005.
  passwordResetFieldValidationMessage:
    meaning: Inline field-level error text on passwordResetForm field controls; validation rules per FR-PWD-003.
  globalMessageSnackbar:
    meaning: Canonical definition per FR-CARD-005.

locatorMappings:
  passwordResetPage: "canonical_locators.yaml -> passwordResetPage"
  passwordResetTitle: "canonical_locators.yaml -> passwordResetTitle"
  passwordResetForm: "canonical_locators.yaml -> passwordResetForm"
  currentPasswordField: "canonical_locators.yaml -> currentPasswordField"
  newPasswordField: "canonical_locators.yaml -> newPasswordField"
  confirmNewPasswordField: "canonical_locators.yaml -> confirmNewPasswordField"
  passwordNewPasswordGuidelines: "canonical_locators.yaml -> passwordNewPasswordGuidelines"
  passwordResetSubmitButton: "canonical_locators.yaml -> passwordResetSubmitButton"
  passwordResetFieldValidationMessage: "canonical_locators.yaml -> passwordResetFieldValidationMessage"
  globalMessageSnackbar: "canonical_locators.yaml -> globalMessageSnackbar"

requirements:
  - id: FR-PWD-001
    title: Password reset page route and primary layout

    designEvidence:
      - FIGMA-PWD-EMPTY
      - FIGMA-PWD-FILLED
      - FIGMA-PWD-ERROR

    actors:
      - user

    uiObjects:
      - passwordResetPage
      - passwordResetTitle
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - confirmNewPasswordField
      - passwordNewPasswordGuidelines
      - passwordResetSubmitButton

    preconditions:
      - documentPreconditions for this file hold

    trigger: []

    mainFlow:
      - when user navigates to route pattern /user/password-reset, system renders passwordResetPage
      - passwordResetPage presents passwordResetTitle and passwordResetForm
      - passwordResetTitle text is the literal 'Password reset'
      - passwordResetPage does not show subtitle or introductory copy below passwordResetTitle
      - passwordResetForm presents currentPasswordField, newPasswordField, confirmNewPasswordField, passwordNewPasswordGuidelines, and passwordResetSubmitButton in that order
      - all passwordResetForm input fields are required; passwordNewPasswordGuidelines is informational helper text with copy per FR-REG-001
      - visible labels on password reset controls use sentence case

    roleBehavior: {}

    acceptanceCriteria:
      - current route matches /user/password-reset
      - passwordResetTitle is visible with text exactly 'Password reset'
      - passwordResetPage does not show subtitle or introductory copy below passwordResetTitle
      - passwordResetForm is visible
      - currentPasswordField is visible with label 'Current password', is editable, and is required
      - currentPasswordField masks entered characters
      - newPasswordField is visible with label 'New password', is editable, and is required
      - newPasswordField masks entered characters
      - confirmNewPasswordField is visible with label 'Confirm new password', is editable, and is required
      - confirmNewPasswordField masks entered characters
      - passwordNewPasswordGuidelines is visible with copy per FR-REG-001
      - passwordResetSubmitButton is visible with label 'Reset password'

    openQuestions: []

  - id: FR-PWD-002
    title: Password reset form initial state (not filled)

    designEvidence:
      - FIGMA-PWD-EMPTY

    actors:
      - user

    uiObjects:
      - passwordResetPage
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - confirmNewPasswordField
      - passwordResetSubmitButton
      - passwordResetFieldValidationMessage

    preconditions:
      - documentPreconditions for this file hold
      - passwordResetPage is visible
      - user has not yet interacted with passwordResetForm

    trigger: []

    mainFlow:
      - currentPasswordField, newPasswordField, and confirmNewPasswordField start empty
      - passwordResetSubmitButton is disabled and not clickable
      - passwordResetFieldValidationMessage is not visible for passwordResetForm fields before user interaction

    roleBehavior: {}

    acceptanceCriteria:
      - currentPasswordField value is empty
      - newPasswordField value is empty
      - confirmNewPasswordField value is empty
      - passwordResetSubmitButton is disabled and not clickable
      - given user has not interacted with passwordResetForm, passwordResetFieldValidationMessage is not visible for currentPasswordField, newPasswordField, or confirmNewPasswordField

    openQuestions: []

  - id: FR-PWD-003
    title: Password reset field validation rules

    designEvidence:
      - FIGMA-PWD-FILLED
      - FIGMA-PWD-ERROR

    actors:
      - user

    uiObjects:
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - confirmNewPasswordField
      - passwordNewPasswordGuidelines
      - passwordResetFieldValidationMessage
      - passwordResetSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - passwordResetForm is visible

    trigger:
      - user changes passwordResetForm field content

    mainFlow:
      - all passwordResetForm input fields are mandatory; user cannot submit passwordResetForm with any required field empty or invalid
      - currentPasswordField requires a non-empty value
      - newPasswordField requires a non-empty value that satisfies passwordNewPasswordGuidelines
      - given newPasswordField fails passwordNewPasswordGuidelines after interaction, passwordResetFieldValidationMessage is visible with copy per FR-REG-001 for newPasswordField and passwordResetSubmitButton is disabled and not clickable
      - newPasswordField must not equal currentPasswordField value; when they match after interaction, passwordResetFieldValidationMessage is visible with text 'New password must be different from your current password' for newPasswordField and passwordResetSubmitButton is disabled and not clickable
      - confirmNewPasswordField requires a non-empty value that matches newPasswordField
      - newPasswordField and confirmNewPasswordField must match; when they do not match, passwordResetFieldValidationMessage shows text 'Passwords do not match' on confirmNewPasswordField
      - validation for passwordResetForm fields starts after user interaction with the relevant field and runs before user clicks passwordResetSubmitButton
      - passwordResetSubmitButton is disabled and not clickable until currentPasswordField, newPasswordField, and confirmNewPasswordField are all valid per this requirement
      - when all passwordResetForm fields are valid, passwordResetSubmitButton becomes enabled and clickable
      - given validation fails for a passwordResetForm field, passwordResetFieldValidationMessage is visible on the invalid field, passwordResetSubmitButton is disabled and not clickable, and passwordResetForm is not submitted while invalid values remain
      - given passwordResetFieldValidationMessage is visible for a passwordResetForm field and the user corrects that field to a valid value, passwordResetFieldValidationMessage is not visible for that field
      - given passwordResetFieldValidationMessage is visible for confirmNewPasswordField with text 'Passwords do not match' and user then changes confirmNewPasswordField to match newPasswordField, passwordResetFieldValidationMessage is not visible for confirmNewPasswordField

    roleBehavior: {}

    acceptanceCriteria:
      - given user clears currentPasswordField after interaction, passwordResetFieldValidationMessage is visible with text 'Current password is required' for currentPasswordField
      - given user clears newPasswordField after interaction, passwordResetFieldValidationMessage is visible with text 'New password is required' for newPasswordField
      - given user clears confirmNewPasswordField after interaction, passwordResetFieldValidationMessage is visible with text 'Confirm new password is required' for confirmNewPasswordField
      - given newPasswordField and confirmNewPasswordField do not match after interaction, passwordResetFieldValidationMessage is visible with text 'Passwords do not match' for confirmNewPasswordField
      - given newPasswordField fails passwordNewPasswordGuidelines after interaction, passwordResetFieldValidationMessage is visible with copy per FR-REG-001 for newPasswordField
      - given newPasswordField value equals currentPasswordField value after interaction, passwordResetFieldValidationMessage is visible with text 'New password must be different from your current password' for newPasswordField
      - given any passwordResetForm field is empty or invalid, passwordResetSubmitButton is disabled and not clickable
      - given all passwordResetForm fields are valid, passwordResetSubmitButton is enabled and clickable
      - given confirmNewPasswordField matches newPasswordField and user then changes newPasswordField so the values no longer match, passwordResetFieldValidationMessage is visible with text 'Passwords do not match' for confirmNewPasswordField
      - given passwordResetFieldValidationMessage is visible for confirmNewPasswordField with text 'Passwords do not match' and user then changes confirmNewPasswordField to match newPasswordField, passwordResetFieldValidationMessage is not visible for confirmNewPasswordField

    openQuestions: []

  - id: FR-PWD-004
    title: Password reset submit failure and error presentation

    designEvidence:
      - FIGMA-PWD-ERROR

    actors:
      - user

    uiObjects:
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - confirmNewPasswordField
      - passwordResetSubmitButton
      - passwordResetFieldValidationMessage
      - passwordResetConfirmationEmail
      - globalMessageSnackbar

    preconditions:
      - documentPreconditions for this file hold
      - passwordResetForm is visible
      - passwordResetForm is valid per FR-PWD-003

    trigger:
      - user clicks passwordResetSubmitButton with valid passwordResetForm values per FR-PWD-003 and password change does not succeed

    mainFlow:
      - given currentPasswordField value does not match the account password after user clicks passwordResetSubmitButton, passwordResetFieldValidationMessage is visible with text 'Current password is incorrect' for currentPasswordField; password change does not complete and passwordResetConfirmationEmail is not sent per FR-PWD-005
      - FIGMA-PWD-ERROR shows field-level errors only on passwordResetForm via passwordResetFieldValidationMessage on the relevant field
      - form-level or non-field errors (not shown in Figma on the form) are displayed in globalMessageSnackbar
      - given password change request fails for a reason other than incorrect currentPasswordField, globalMessageSnackbar shows 'We encountered an issue and your password was not reset'
      - when password change request fails, password change does not complete and passwordResetConfirmationEmail is not sent per FR-PWD-005
      - given password change request fails, currentPasswordField, newPasswordField, and confirmNewPasswordField retain their pre-submit values
      - given passwordResetFieldValidationMessage is visible for currentPasswordField with text 'Current password is incorrect' and user then changes currentPasswordField, passwordResetFieldValidationMessage is not visible for currentPasswordField

    roleBehavior: {}

    acceptanceCriteria:
      - per FIGMA-PWD-ERROR, field-level failures use passwordResetFieldValidationMessage on the applicable field (currentPasswordField, newPasswordField, or confirmNewPasswordField)
      - given currentPasswordField value does not match the account password after user clicks passwordResetSubmitButton with valid passwordResetForm values per FR-PWD-003, passwordResetFieldValidationMessage is visible with text 'Current password is incorrect' for currentPasswordField
      - given a form-level or non-field error occurs, globalMessageSnackbar shows the message and passwordResetForm does not show an inline form-wide banner for that case
      - given password change request fails for a reason other than incorrect currentPasswordField, globalMessageSnackbar shows 'We encountered an issue and your password was not reset'
      - given password change request fails, passwordResetConfirmationEmail is not sent
      - given password change request fails, currentPasswordField, newPasswordField, and confirmNewPasswordField retain their pre-submit values
      - given passwordResetFieldValidationMessage is visible for currentPasswordField with text 'Current password is incorrect' and user then changes currentPasswordField, passwordResetFieldValidationMessage is not visible for currentPasswordField

    openQuestions: []

  - id: FR-PWD-005
    title: Password reset successful completion

    designEvidence:
      - FIGMA-PWD-FILLED

    actors:
      - user

    uiObjects:
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - confirmNewPasswordField
      - passwordResetSubmitButton
      - passwordResetConfirmationEmail
      - globalMessageSnackbar

    preconditions:
      - documentPreconditions for this file hold
      - passwordResetForm is visible
      - passwordResetForm is valid per FR-PWD-003

    trigger:
      - user clicks passwordResetSubmitButton with valid passwordResetForm values per FR-PWD-003

    mainFlow:
      - given user clicks passwordResetSubmitButton with valid passwordResetForm values per FR-PWD-003, account password is updated to newPasswordField value
      - given password change succeeds, passwordResetConfirmationEmail is sent to the authenticated user's account email address per FR-PROFILE-002
      - given password change succeeds, passwordResetConfirmationEmail subject is exactly 'Your CourseFlow password was reset'
      - given password change succeeds, passwordResetConfirmationEmail body is exactly "Hello,\n\nThe password for your account was changed successfully.\n\nDidn't make this change? Please contact administration immediately to lock your account and verify your access.\n\nThank you,\n\nThe CourseFlow Team."
      - given password change succeeds, globalMessageSnackbar shows 'Your password has been successfully reset'
      - given password change succeeds, currentPasswordField, newPasswordField, and confirmNewPasswordField are reset to empty and passwordResetSubmitButton is disabled and not clickable
      - given password change succeeds, user remains authenticated to CourseFlow and current route matches '/user/password-reset'

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks passwordResetSubmitButton with valid passwordResetForm values per FR-PWD-003, password change succeeds and account password matches newPasswordField value
      - given password change succeeds, passwordResetConfirmationEmail is sent to the authenticated user's account email address per FR-PROFILE-002
      - given password change succeeds, passwordResetConfirmationEmail subject is exactly 'Your CourseFlow password was reset'
      - given password change succeeds, passwordResetConfirmationEmail body is exactly "Hello,\n\nThe password for your account was changed successfully.\n\nDidn't make this change? Please contact administration immediately to lock your account and verify your access.\n\nThank you,\n\nThe CourseFlow Team."
      - given password change succeeds, globalMessageSnackbar shows 'Your password has been successfully reset'
      - given password change succeeds, currentPasswordField, newPasswordField, and confirmNewPasswordField are empty and passwordResetSubmitButton is disabled and not clickable
      - given password change succeeds, user remains authenticated to CourseFlow
      - given password change succeeds, current route matches '/user/password-reset'

    openQuestions: []

