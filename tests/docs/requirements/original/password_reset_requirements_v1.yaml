# Normalized requirements: password reset page (full page)
# Source: Figma design evidence
# Cross-reference: top navigation routes account menu to route pattern /user/password-reset (see tests/docs/requirements/original/top_navigation_requirements_v1.yaml, passwordResetPage)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md

documentPreconditions:
  - user is authenticated to CourseFlow
  - user is within the main application shell

uiObjectDefinitions:
  passwordResetPage:
    meaning: Full-page password reset experience at route pattern /user/password-reset; not a modal dialog; layout and copy per Figma password reset frames.
  passwordResetTitle:
    meaning: Page title for the password reset screen.
  passwordResetIntroCopy:
    meaning: Instructional or explanatory text on passwordResetPage describing what the user is doing or what happens next (exact copy per Figma).
  passwordResetForm:
    meaning: Form on passwordResetPage that collects current password, new password, and confirm new password, then submits the password change flow.
  currentPasswordField:
    meaning: Secret input for the user's current password in passwordResetForm.
  newPasswordField:
    meaning: Secret input for the new password value in passwordResetForm.
  confirmNewPasswordField:
    meaning: Secret input for confirming the new password in passwordResetForm.
  passwordNewPasswordGuidelines:
    meaning: Visible guidance for new password requirements associated with the new-password area on passwordResetForm; presents two lines of copy (English baseline) 'Your password must contain at least 12 characters.' and 'Your password must include a mix of numbers, letters and symbols.'; implementation may localize strings.
  passwordResetSubmitButton:
    meaning: Primary action on passwordResetForm that submits the password change request.
  passwordResetFieldValidationMessage:
    meaning: Inline field-level validation or error text on passwordResetForm; Figma error frame (FIGMA-PWD-ERROR) shows only this style of error on the form, not form-wide inline banners.
  globalMessageSnackbar:
    meaning: Global snackbar used for form-level or non-field errors (for example server or generic failures); not used for inline field errors shown in Figma.

locatorMappings:
  passwordResetPage:
    strategy: "URL pathname /user/password-reset"
    confidence: inferred
  passwordResetTitle:
    strategy: null
    confidence: unresolved
  passwordResetIntroCopy:
    strategy: null
    confidence: unresolved
  passwordResetForm:
    strategy: null
    confidence: unresolved
  currentPasswordField:
    strategy: null
    confidence: unresolved
  newPasswordField:
    strategy: null
    confidence: unresolved
  confirmNewPasswordField:
    strategy: null
    confidence: unresolved
  passwordNewPasswordGuidelines:
    strategy: null
    confidence: unresolved
  passwordResetSubmitButton:
    strategy: null
    confidence: unresolved
  passwordResetFieldValidationMessage:
    strategy: null
    confidence: unresolved
  globalMessageSnackbar:
    strategy: null
    confidence: unresolved

requirements:
  - id: FR-PWD-001
    title: Password reset page route and primary layout

    designEvidence:
      - FIGMA-PWD-EMPTY
      - FIGMA-PWD-FILLED
      - FIGMA-PWD-ERROR

    actors:
      - user

    uiObjects:
      - passwordResetPage
      - passwordResetTitle
      - passwordResetIntroCopy
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - passwordNewPasswordGuidelines
      - confirmNewPasswordField
      - passwordResetSubmitButton

    preconditions:
      - user is authenticated

    trigger: []

    mainFlow:
      - when user navigates to route pattern /user/password-reset, system renders passwordResetPage
      - passwordResetPage presents passwordResetTitle, passwordResetIntroCopy, and passwordResetForm
      - passwordResetForm presents currentPasswordField, newPasswordField, passwordNewPasswordGuidelines, confirmNewPasswordField, and passwordResetSubmitButton in an order matching Figma
      - passwordNewPasswordGuidelines presents the two password rules using English baseline copy 'Your password must contain at least 12 characters.' and 'Your password must include a mix of numbers, letters and symbols.' or equivalent localized strings
      - visible labels on password reset controls use sentence case

    roleBehavior: {}

    acceptanceCriteria:
      - current route matches /user/password-reset
      - passwordResetTitle is visible
      - passwordResetIntroCopy is visible
      - passwordResetForm is visible
      - currentPasswordField is visible
      - newPasswordField is visible
      - passwordNewPasswordGuidelines is visible and reflects the two rules (at least 12 characters; mix of numbers, letters, and symbols)
      - confirmNewPasswordField is visible
      - passwordResetSubmitButton is visible

    openQuestions:
      - Full-page route is specified in top navigation requirements; confirm shell chrome (global top bar, main nav) matches Figma for this page when implemented.

  - id: FR-PWD-002
    title: Password reset form initial state (not filled)

    designEvidence:
      - FIGMA-PWD-EMPTY

    actors:
      - user

    uiObjects:
      - passwordResetPage
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - passwordNewPasswordGuidelines
      - confirmNewPasswordField
      - passwordResetSubmitButton
      - passwordResetFieldValidationMessage

    preconditions:
      - user is on passwordResetPage
      - user has not yet interacted with passwordResetForm

    trigger: []

    mainFlow:
      - currentPasswordField, newPasswordField, and confirmNewPasswordField start empty
      - passwordNewPasswordGuidelines is visible and reflects the two password rules
      - passwordResetFieldValidationMessage is not shown for currentPasswordField, newPasswordField, or confirmNewPasswordField before user interaction with passwordResetForm

    roleBehavior: {}

    acceptanceCriteria:
      - currentPasswordField value is empty
      - newPasswordField value is empty
      - confirmNewPasswordField value is empty
      - passwordNewPasswordGuidelines is visible
      - given user has not interacted with passwordResetForm, passwordResetFieldValidationMessage is not shown for currentPasswordField, newPasswordField, or confirmNewPasswordField

    openQuestions: []

  - id: FR-PWD-003
    title: Password reset form filled state (valid input)

    designEvidence:
      - FIGMA-PWD-FILLED

    actors:
      - user

    uiObjects:
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - passwordNewPasswordGuidelines
      - confirmNewPasswordField
      - passwordResetSubmitButton

    preconditions:
      - passwordResetForm is visible

    trigger:
      - user enters current password and matching new password values in newPasswordField and confirmNewPasswordField

    mainFlow:
      - user can enter secret text in currentPasswordField
      - user can enter secret text in newPasswordField
      - user can enter secret text in confirmNewPasswordField
      - passwordResetSubmitButton enablement uses only field presence and new-password match; it does not evaluate password policy or complexity (those are evaluated on submit; see FR-PWD-004)
      - passwordResetSubmitButton is disabled and not clickable until currentPasswordField, newPasswordField, and confirmNewPasswordField are all non-empty and newPasswordField matches confirmNewPasswordField
      - when those conditions hold, passwordResetSubmitButton becomes enabled and clickable

    roleBehavior: {}

    acceptanceCriteria:
      - given user enters text in currentPasswordField, currentPasswordField holds the entered value
      - given user enters text in newPasswordField, newPasswordField holds the entered value
      - given user enters text in confirmNewPasswordField, confirmNewPasswordField holds the entered value
      - given any of currentPasswordField, newPasswordField, or confirmNewPasswordField is empty, passwordResetSubmitButton is disabled and not clickable
      - given newPasswordField and confirmNewPasswordField do not match, passwordResetSubmitButton is disabled and not clickable
      - given currentPasswordField, newPasswordField, and confirmNewPasswordField are all non-empty and newPasswordField matches confirmNewPasswordField, passwordResetSubmitButton is enabled and clickable even if new password would fail policy checks on submit

    openQuestions: []

  - id: FR-PWD-004
    title: Password reset validation and error presentation

    designEvidence:
      - FIGMA-PWD-ERROR

    actors:
      - user

    uiObjects:
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - confirmNewPasswordField
      - passwordNewPasswordGuidelines
      - passwordResetSubmitButton
      - passwordResetFieldValidationMessage
      - globalMessageSnackbar

    preconditions:
      - passwordResetForm is visible
      - user has interacted with passwordResetForm or attempted submit per product rules

    trigger:
      - user clicks passwordResetSubmitButton

    mainFlow:
      - password policy for newPasswordField after submit is at least 12 characters and a mix of numbers, letters, and symbols per passwordNewPasswordGuidelines
      - errors from new password not meeting policy are shown after user clicks passwordResetSubmitButton, not as part of submit-button enablement in FR-PWD-003
      - FIGMA-PWD-ERROR shows field-level errors only on passwordResetForm via passwordResetFieldValidationMessage on the relevant field
      - form-level or non-field errors (not shown in Figma on the form) are displayed in globalMessageSnackbar
      - when validation or submission fails, system does not complete a successful password change
      - post-submit validation error message copy for policy failures may be locale-dependent; tests should assert presence and association with newPasswordField, not exact English-only strings unless product locks copy

    roleBehavior: {}

    acceptanceCriteria:
      - per FIGMA-PWD-ERROR, field-level failures use passwordResetFieldValidationMessage on the applicable field (currentPasswordField, newPasswordField, or confirmNewPasswordField)
      - given validation fails for currentPasswordField, passwordResetFieldValidationMessage is visible for currentPasswordField
      - given validation fails for newPasswordField, passwordResetFieldValidationMessage is visible for newPasswordField
      - given validation fails for confirmNewPasswordField or new password mismatch, passwordResetFieldValidationMessage is visible for confirmNewPasswordField
      - given new password has fewer than 12 characters after user clicks passwordResetSubmitButton, passwordResetFieldValidationMessage is visible for newPasswordField or policy feedback is shown per product rules
      - given new password does not include a mix of numbers, letters, and symbols after user clicks passwordResetSubmitButton, passwordResetFieldValidationMessage is visible for newPasswordField or policy feedback is shown per product rules
      - given a form-level or non-field error occurs, globalMessageSnackbar shows the message and passwordResetForm does not show an inline form-wide banner for that case

    openQuestions: []

  - id: FR-PWD-005
    title: Password reset successful completion [NOT READY]

    designEvidence:
      - FIGMA-PWD-FILLED

    actors:
      - user

    uiObjects:
      - passwordResetForm
      - currentPasswordField
      - newPasswordField
      - confirmNewPasswordField
      - passwordResetSubmitButton

    preconditions:
      - passwordResetForm is visible
      - user has entered values that satisfy validation rules

    trigger:
      - user clicks passwordResetSubmitButton

    mainFlow:
      - technical intent when implementation exists: user submits password change; system responds with success or failure per backend contract

    roleBehavior: {}

    acceptanceCriteria:
      - technical intent (not for test generation until implemented): successful password change completes per product and security requirements

    openQuestions:
      - Confirm relationship to legacy PasswordResetDialog flow (SALTISE lobby copy) versus new full-page copy and behavior.

