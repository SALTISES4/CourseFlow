    uiObjects:
      - workflowOverviewView
      - workflowMetadataSwitchCalculateTimeAutomatically
      - workflowMetadataSwitchCalculatePonderationAutomatically
      - workflowMetadataSwitchCalculateCreditsAutomatically
      - workflowMetadataSwitchCalculateClassificationAutomatically

    preconditions:
      - workflow was newly created via tests/docs/requirements/original/workflow_create_stepped_form_requirements_v1.yaml FR-WF-CREATE-STEPPER-005
      - actor opens workflowOverviewView on the new workflow at route '/workflow/{id}'

    trigger:
      - actor opens workflowOverviewView after blank workflow create completes

    mainFlow:
      - for a blank-created workflow, workflowMetadataSwitchCalculateTimeAutomatically is OFF on initial overview state
      - for a blank-created program workflow, workflowMetadataSwitchCalculatePonderationAutomatically is OFF on initial overview state
      - for a blank-created program workflow, workflowMetadataSwitchCalculateCreditsAutomatically is OFF on initial overview state
      - for a blank-created program workflow, workflowMetadataSwitchCalculateClassificationAutomatically is OFF on initial overview state

    roleBehavior: {}

    acceptanceCriteria:
      - given workflow was blank-created per FR-WF-CREATE-STEPPER-005 and actor opens Overview, workflowMetadataSwitchCalculateTimeAutomatically is OFF
      - given workflow was blank-created as program per FR-WF-CREATE-STEPPER-005 and actor opens Overview, workflowMetadataSwitchCalculatePonderationAutomatically is OFF
      - given workflow was blank-created as program per FR-WF-CREATE-STEPPER-005 and actor opens Overview, workflowMetadataSwitchCalculateCreditsAutomatically is OFF
      - given workflow was blank-created as program per FR-WF-CREATE-STEPPER-005 and actor opens Overview, workflowMetadataSwitchCalculateClassificationAutomatically is OFF

