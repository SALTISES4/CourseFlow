  - id: FR-WF-OV-009
    title: Overview metadata copied from template source on template-based workflow create

    designEvidence:
      - FIGMA-WF-OV-ACTIVITY-OWNER-EDITOR
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR

    actors:
      - user

    uiObjects:
      - workflowOverviewView
      - workflowMetadataSection
      - workflowMetadataFieldDescription
      - workflowMetadataFieldCode
      - workflowMetadataSwitchCalculateTimeAutomatically
      - workflowMetadataFieldTime
      - workflowMetadataSwitchCalculatePonderationAutomatically
      - workflowMetadataFieldIndividualTime
      - workflowMetadataFieldPracticalTime
      - workflowMetadataFieldTheoryTime
      - workflowMetadataSwitchCalculateCreditsAutomatically
      - workflowMetadataFieldCredits
      - workflowMetadataSwitchCalculateClassificationAutomatically
      - workflowMetadataFieldGeneralTime
      - workflowMetadataFieldSpecificTime
      - workflowMetadataPermissionsPanel

    preconditions:
      - workflow was newly created via tests/docs/requirements/original/workflow_create_stepped_form_requirements_v1.yaml FR-WF-CREATE-STEPPER-006 from a selected template workflowCard
      - actor opens workflowOverviewView on the new workflow at route '/workflow/{id}'

    trigger:
      - actor opens workflowOverviewView after template-based create completes

    mainFlow:
      - workflowMetadataSection on workflowOverviewView reflects template-source metadata for every overview field and auto-calculate switch rendered for the workflow type per FR-WF-OV-001 through FR-WF-OV-006; copied values match the selected template workflowCard source at create time
      - workflowMetadataPermissionsPanel is not copied from the template source; contributor display follows the parent project per FR-WF-OV-007

    roleBehavior: {}

    acceptanceCriteria:
      - given successful template-based create per FR-WF-CREATE-STEPPER-006 and actor opens Overview, workflowMetadataFieldDescription matches the template source
      - given successful template-based create and actor opens Overview, workflowMetadataFieldCode matches the template source when rendered for the workflow type per FR-WF-OV-002
      - given successful template-based create and actor opens Overview, workflowMetadataSwitchCalculateTimeAutomatically and workflowMetadataFieldTime match the template source
      - given successful template-based create on a course or program workflow and actor opens Overview, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime match the template source
      - given successful template-based create on a course or program workflow and actor opens Overview, workflowMetadataFieldCredits matches the template source
      - given successful template-based create on a program workflow and actor opens Overview, workflowMetadataSwitchCalculatePonderationAutomatically, workflowMetadataSwitchCalculateCreditsAutomatically, workflowMetadataSwitchCalculateClassificationAutomatically, workflowMetadataFieldGeneralTime, and workflowMetadataFieldSpecificTime match the template source
      - given successful template-based create and actor opens Overview, workflowMetadataPermissionsPanel follows parent project contributor data per FR-WF-OV-007 and is not copied from the template source

    openQuestions: []

  - id: FR-WF-OV-010
    title: Calculated Overview metadata stays current after Workflow-tab edits

    designEvidence:
      - FIGMA-WF-OV-ACTIVITY-OWNER-EDITOR-AUTO-CALC-ON
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR-WARNING
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR-WARNING

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowOverviewView
      - workflowViewTabSelector
      - workflowMetadataSwitchCalculateTimeAutomatically
      - workflowMetadataFieldTime
      - workflowMetadataSwitchCalculatePonderationAutomatically
      - workflowMetadataFieldTheoryTime
      - workflowMetadataFieldPracticalTime
      - workflowMetadataFieldIndividualTime
      - workflowMetadataWarningBanner
      - workflowMetadataSwitchCalculateCreditsAutomatically
      - workflowMetadataFieldCredits
      - workflowMetadataSwitchCalculateClassificationAutomatically
      - workflowMetadataFieldGeneralTime
      - workflowMetadataFieldSpecificTime
      - workflowMetadataClassificationWarningBanner

    preconditions:
      - documentPreconditions for this file hold
      - the auto-calculate switch for the field in question is ON per FR-WF-OV-003 through FR-WF-OV-006 as applicable to the workflow type
      - actor is on the Workflow sub-view at '/workflow/{id}/graph' with workflowView open

    trigger:
      - owner or editor makes a qualifying change listed in FR-WF-OV-003 through FR-WF-OV-006 (for example edit node time, add or delete a workflowNode, link or unlink an activity or course)
      - actor selects Overview on workflowViewTabSelector per FR-WF-HEADER-001

    mainFlow:
      - calculated Overview fields per FR-WF-OV-003 through FR-WF-OV-006 reflect all qualifying Workflow-tab changes when the actor opens Overview
      - the actor does not need to save Overview separately or reload the page
      - mismatch warning banners on Overview (workflowMetadataWarningBanner, workflowMetadataClassificationWarningBanner) reflect the same current totals when Overview is opened after those changes
      - viewer, commenter, and user see the same calculated values read-only when they open Overview after a qualifying change made by owner or editor

    roleBehavior:
      owner:
        workflowViewTabSelector: available
      editor:
        workflowViewTabSelector: available
      viewer:
        workflowViewTabSelector: available
      commenter:
        workflowViewTabSelector: available
      user:
        workflowViewTabSelector: available

    acceptanceCriteria:
      - given auto-calculate time is ON per FR-WF-OV-003 and owner changes a node time on the Workflow sub-view, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldTime shows the updated total including that change
      - given auto-calculate ponderation is ON on a program workflow per FR-WF-OV-004 and owner adds a workflowNode on the Workflow sub-view per tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, ponderation totals include the new node
      - given workflowMetadataWarningBanner was visible before a Workflow-tab edit and the edit removes the ponderation mismatch, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataWarningBanner is not shown
      - given owner edits on the Workflow sub-view, navigates to Outcomes on workflowViewTabSelector per FR-WF-HEADER-001 and back to Overview without a full page reload, calculated fields on workflowOverviewView still reflect the Workflow-tab edit
      - given auto-calculate credits is ON on a program workflow per FR-WF-OV-005 and owner deletes a workflowNode on the Workflow sub-view per tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-003, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldCredits reflects the reduced total
      - given auto-calculate classification is ON on a program workflow per FR-WF-OV-006 and owner toggles workflowEditNodeFormSpecificEducationSwitch on a node on the Workflow sub-view, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime reflect the change

    openQuestions: []

