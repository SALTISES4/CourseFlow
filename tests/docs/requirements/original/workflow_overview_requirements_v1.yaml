# Normalized requirements: workflow 'Overview' view metadata (activity, course, program)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Workflow Metadata + Views/Overview sections)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/original/context_action_bar_requirements_v1.yaml (workflow header-level controls on contextActionBar)
#   - tests/docs/requirements/original/workflow_edit_form_requirements_v1.yaml (edit dialog open—FR-WF-FORM-001; save outcomes—FR-WF-FORM-003)
#   - tests/docs/requirements/original/workflow_create_stepped_form_requirements_v1.yaml (FR-WF-CREATE-STEPPER-005 — blank create path for FR-WF-OV-008; FR-WF-CREATE-STEPPER-006 — template create path for FR-WF-OV-009; post-create navigation lands on '/workflow/{id}/graph' with workflowView open per FR-WF-HEADER-001)
#   - tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml (qualifying Workflow-tab node edits — FR-WF-EN-007, FR-WF-EN-010, FR-WF-EN-011; reflected on Overview per FR-WF-OV-010)
#   - tests/docs/requirements/original/workflow_archive_requirements_v1.yaml (archive of linked child clears parent node links—FR-WF-ARCH-003)
#   - tests/docs/requirements/original/workflow_copy_requirements_v1.yaml (copy link preservation vs break—FR-WF-COPY-003; overview metadata and content fidelity on copy—FR-WF-COPY-003)
#   - tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml (qualifying node create — FR-WF-ADD-*; reflected on Overview per FR-WF-OV-010)
#   - tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml (qualifying node delete — FR-WF-DEL-003; reflected on Overview per FR-WF-OV-010)
#   - tests/docs/requirements/original/workflow_header_requirements_v1.yaml (workflow top section: title, favourite toggle, tab selector, and sub-view switching — FR-WF-HEADER-001)
#   - tests/docs/requirements/original/project_overview_requirements_v1.yaml (project-level publish/visibility and contributor inheritance—FR-PROJ-OV-002; contributor removal mid-session—FR-WS-ACCESS-004)
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail — FR-WS-ACCESS-002; mid-session contributor removal — FR-WS-ACCESS-004)

documentPreconditions:
  - user is authenticated to CourseFlow
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project of the workflow on any route matching '/workflow/{id}/*', or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - routes matching '/workflow/{id}/*' include '/workflow/{id}' (empty suffix) and '/workflow/{id}/<sub-view>' for any sub-view
  - requirements in this file assume the above hold; when they do not on navigation, assert per tests/docs/requirements/original/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002; when published-access preconditions fail mid-session because the parent project becomes unpublished, assert per FR-WS-ACCESS-003 on the actor's next in-app action; when a former contributor's access changes mid-session because they were removed per tests/docs/requirements/original/project_overview_requirements_v1.yaml FR-PROJ-OV-002, assert per FR-WS-ACCESS-004 on the actor's next in-app action

uiObjectDefinitions:
  workflowOverviewView:
    meaning: Workflow Overview sub-view for workflow metadata and permissions summary.
  workflowMetadataSection:
    meaning: Metadata section on workflowOverviewView containing workflow overview fields and banners.
  workflowMetadataFieldDescription:
    meaning: Description metadata field on workflowOverviewView.
  workflowMetadataFieldCode:
    meaning: Code metadata field on workflowOverviewView.
  workflowMetadataSwitchCalculateTimeAutomatically:
    meaning: Switch control labeled 'Calculate time automatically' on workflowOverviewView.
  workflowMetadataFieldTime:
    meaning: Time duration metadata field on workflowOverviewView.
  workflowMetadataSwitchCalculatePonderationAutomatically:
    meaning: Program-only switch control labeled 'Calculate ponderation automatically' on workflowOverviewView.
  workflowMetadataFieldIndividualTime:
    meaning: Individual duration field in the Ponderation section on workflowOverviewView.
  workflowMetadataFieldPracticalTime:
    meaning: Practical duration field in the Ponderation section on workflowOverviewView.
  workflowMetadataFieldTheoryTime:
    meaning: Theory duration field in the Ponderation section on workflowOverviewView.
  workflowMetadataSwitchCalculateCreditsAutomatically:
    meaning: Program-only switch control labeled 'Calculate credits automatically' on workflowOverviewView.
  workflowMetadataFieldCredits:
    meaning: Credits metadata field on workflowOverviewView.
  workflowMetadataSwitchCalculateClassificationAutomatically:
    meaning: Program-only switch control labeled 'Calculate classification automatically' on workflowOverviewView.
  workflowMetadataFieldGeneralTime:
    meaning: General time duration field on program workflowOverviewView.
  workflowMetadataFieldSpecificTime:
    meaning: Specific time duration field on program workflowOverviewView.
  workflowMetadataClassificationWarningBanner:
    meaning: Classification mismatch warning banner on program workflowOverviewView.
  workflowMetadataWarningBanner:
    meaning: Ponderation mismatch warning banner on workflowOverviewView.
  workflowMetadataPermissionsPanel:
    meaning: Contributors and permissions summary panel on workflowOverviewView.
  workflowViewTabSelector:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_header_requirements_v1.yaml.

locatorMappings:
  workflowOverviewView: "canonical_locators.yaml -> workflowOverviewView"
  workflowMetadataSection: "canonical_locators.yaml -> workflowMetadataSection"
  workflowMetadataFieldDescription: "canonical_locators.yaml -> workflowMetadataFieldDescription"
  workflowMetadataFieldCode: "canonical_locators.yaml -> workflowMetadataFieldCode"
  workflowMetadataSwitchCalculateTimeAutomatically: "canonical_locators.yaml -> workflowMetadataSwitchCalculateTimeAutomatically"
  workflowMetadataFieldTime: "canonical_locators.yaml -> workflowMetadataFieldTime"
  workflowMetadataSwitchCalculatePonderationAutomatically: "canonical_locators.yaml -> workflowMetadataSwitchCalculatePonderationAutomatically"
  workflowMetadataFieldIndividualTime: "canonical_locators.yaml -> workflowMetadataFieldIndividualTime"
  workflowMetadataFieldPracticalTime: "canonical_locators.yaml -> workflowMetadataFieldPracticalTime"
  workflowMetadataFieldTheoryTime: "canonical_locators.yaml -> workflowMetadataFieldTheoryTime"
  workflowMetadataSwitchCalculateCreditsAutomatically: "canonical_locators.yaml -> workflowMetadataSwitchCalculateCreditsAutomatically"
  workflowMetadataFieldCredits: "canonical_locators.yaml -> workflowMetadataFieldCredits"
  workflowMetadataSwitchCalculateClassificationAutomatically: "canonical_locators.yaml -> workflowMetadataSwitchCalculateClassificationAutomatically"
  workflowMetadataFieldGeneralTime: "canonical_locators.yaml -> workflowMetadataFieldGeneralTime"
  workflowMetadataFieldSpecificTime: "canonical_locators.yaml -> workflowMetadataFieldSpecificTime"
  workflowMetadataClassificationWarningBanner: "canonical_locators.yaml -> workflowMetadataClassificationWarningBanner"
  workflowMetadataWarningBanner: "canonical_locators.yaml -> workflowMetadataWarningBanner"
  workflowMetadataPermissionsPanel: "canonical_locators.yaml -> workflowMetadataPermissionsPanel"
  workflowViewTabSelector: "canonical_locators.yaml -> workflowViewTabSelector"

requirements:
  - id: FR-WF-OV-001
    title: Workflow overview view is available

    designEvidence:
      - FIGMA-WF-OV-ACTIVITY-OWNER-EDITOR
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR
      - FIGMA-WF-OV-COURSE-VIEWER-COMMENTER
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowOverviewView
      - workflowMetadataSection

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/workflow/{id}'

    trigger:
      - user opens workflow 'Overview' view at route '/workflow/{id}'

    mainFlow:
      - system renders workflowOverviewView at route '/workflow/{id}'
      - workflowOverviewView displays workflow metadata content in workflowMetadataSection
      - workflow top section behavior (title, favourite toggle, tab selector, and sub-view switching) is defined in tests/docs/requirements/original/workflow_header_requirements_v1.yaml
      - editable overview metadata fields per FR-WF-OV-002 through FR-WF-OV-006 persist on change without an explicit save control on workflowOverviewView; persisted values are shown on subsequent renders of workflowOverviewView for the same workflow (including after navigating to another sub-view and back)
      - when auto-calculate switches are ON per FR-WF-OV-003 through FR-WF-OV-006, calculated overview fields reflect qualifying Workflow-tab changes when the actor opens Overview per FR-WF-OV-010
      - workflow-type field composition on workflowOverviewView — activity workflows render workflowMetadataFieldDescription, workflowMetadataSwitchCalculateTimeAutomatically, workflowMetadataFieldTime, and workflowMetadataPermissionsPanel per FR-WF-OV-002, FR-WF-OV-003, and FR-WF-OV-007; activity workflows do not render workflowMetadataFieldCode (FR-WF-OV-002), the Ponderation section (FR-WF-OV-004), workflowMetadataFieldCredits (FR-WF-OV-005), or program classification controls (FR-WF-OV-006)
      - course workflows additionally render workflowMetadataFieldCode (FR-WF-OV-002), the Ponderation section (FR-WF-OV-004), and workflowMetadataFieldCredits (FR-WF-OV-005); course workflows do not render program-only auto-calculate switches for ponderation, credits, or classification (FR-WF-OV-004, FR-WF-OV-005, FR-WF-OV-006)
      - program workflows render all overview metadata sections defined in FR-WF-OV-002 through FR-WF-OV-007

    roleBehavior: {}

    acceptanceCriteria:
      - workflowOverviewView is visible
      - given actor is owner or editor and modifies an editable overview metadata field per FR-WF-OV-002 through FR-WF-OV-006, when actor navigates to another workflow sub-view and back to Overview, workflowOverviewView shows the persisted value
      - given workflow type is activity, workflowOverviewView renders workflowMetadataFieldDescription, workflowMetadataSwitchCalculateTimeAutomatically, workflowMetadataFieldTime, and workflowMetadataPermissionsPanel, and does not render workflowMetadataFieldCode, workflowMetadataSwitchCalculatePonderationAutomatically, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, workflowMetadataFieldIndividualTime, workflowMetadataFieldCredits, workflowMetadataSwitchCalculateCreditsAutomatically, workflowMetadataSwitchCalculateClassificationAutomatically, workflowMetadataFieldGeneralTime, or workflowMetadataFieldSpecificTime
      - given workflow type is course, workflowOverviewView renders workflowMetadataFieldDescription, workflowMetadataFieldCode, workflowMetadataSwitchCalculateTimeAutomatically, workflowMetadataFieldTime, the Ponderation section, workflowMetadataFieldCredits, and workflowMetadataPermissionsPanel, and does not render workflowMetadataSwitchCalculatePonderationAutomatically, workflowMetadataSwitchCalculateCreditsAutomatically, or program classification controls (workflowMetadataSwitchCalculateClassificationAutomatically, workflowMetadataFieldGeneralTime, workflowMetadataFieldSpecificTime)
      - given workflow type is program, workflowOverviewView renders workflowMetadataFieldDescription, workflowMetadataFieldCode, workflowMetadataSwitchCalculateTimeAutomatically, workflowMetadataFieldTime, the Ponderation section, workflowMetadataFieldCredits, workflowMetadataSwitchCalculatePonderationAutomatically, workflowMetadataSwitchCalculateCreditsAutomatically, workflowMetadataSwitchCalculateClassificationAutomatically, workflowMetadataFieldGeneralTime, workflowMetadataFieldSpecificTime, and workflowMetadataPermissionsPanel

    openQuestions:
      - Confirm the exact debounce / save policy and any visible auto-save indicator (e.g., a 'Saving…' or 'Saved' affordance) on workflowOverviewView per Figma; parallel open question in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-007.

  - id: FR-WF-OV-002
    title: Workflow overview metadata editability follows role permissions

    designEvidence:
      - FIGMA-WF-OV-ACTIVITY-OWNER-EDITOR
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR
      - FIGMA-WF-OV-COURSE-VIEWER-COMMENTER
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowOverviewView
      - workflowMetadataSection
      - workflowMetadataFieldDescription
      - workflowMetadataFieldCode

    preconditions:
      - FR-WF-OV-001 preconditions hold

    trigger:
      - workflowOverviewView renders workflowMetadataFieldDescription
      - workflow description is updated via editWorkflowDialog per FR-WF-FORM-003 for the current workflow

    mainFlow:
      - workflowMetadataFieldDescription is displayed in workflowOverviewView with label 'Description'
      - when workflow description data is empty, workflowMetadataFieldDescription shows '-'
      - workflowMetadataFieldDescription content is plain text only (no rich-text formatting) and has no maximum length limit
      - workflowMetadataFieldDescription is not editable directly on workflowOverviewView for any role
      - owner and editor can update workflow description only through editWorkflowDialog (open per FR-WF-FORM-001; save per FR-WF-FORM-003)
      - on course and program workflows, workflowMetadataFieldCode is displayed in workflowMetadataSection within workflowOverviewView
      - on activity workflows, workflowMetadataFieldCode is not shown
      - on course and program workflows, workflowMetadataFieldCode is editable for owner or editor and read-only for viewer, commenter, or user
      - workflow title display and edit-entry behavior are defined in workflow_header_requirements_v1.yaml; edit dialog open per FR-WF-FORM-001; title and description save outcomes per FR-WF-FORM-003
      - viewer, commenter, and user can view but cannot edit workflow metadata fields
      - no workflow overview metadata fields are intentionally hidden from viewer, commenter, or user; they see the same field set as owner and editor for that workflow type, subject to read-only rules in this requirement and related overview requirements
      - when workflow description is updated via editWorkflowDialog per FR-WF-FORM-003, workflowMetadataFieldDescription on workflowOverviewView updates to show the new value, or '-' when the saved description is empty

    roleBehavior:
      owner:
        workflowMetadataFieldDescription: readOnly
        workflowMetadataFieldCode: editable
      editor:
        workflowMetadataFieldDescription: readOnly
        workflowMetadataFieldCode: editable
      viewer:
        workflowMetadataFieldDescription: readOnly
        workflowMetadataFieldCode: readOnly
      commenter:
        workflowMetadataFieldDescription: readOnly
        workflowMetadataFieldCode: readOnly
      user:
        workflowMetadataFieldDescription: readOnly
        workflowMetadataFieldCode: readOnly

    acceptanceCriteria:
      - given workflowOverviewView is visible, workflowMetadataFieldDescription label 'Description' is visible
      - given workflow description has a value, workflowMetadataFieldDescription shows that value on workflowOverviewView
      - given workflow description is empty, workflowMetadataFieldDescription shows '-'
      - workflowMetadataFieldDescription accepts plain text only (no rich-text formatting controls)
      - workflow description has no maximum length limit
      - given any actor on workflowOverviewView, workflowMetadataFieldDescription is read-only and cannot be edited in place
      - given owner or editor needs to change description, update path is editWorkflowDialog (open per FR-WF-FORM-001; save per FR-WF-FORM-003)
      - given workflow type is course or program, workflowMetadataFieldCode is visible in workflowMetadataSection on workflowOverviewView
      - given workflow type is activity, workflowMetadataFieldCode is not visible
      - given workflow type is course or program and actor is owner or editor, workflowMetadataFieldCode is editable
      - given workflow type is course or program and actor is viewer, commenter, or user, workflowMetadataFieldCode is read-only
      - given viewer, commenter, or user on workflowOverviewView, metadata fields are read-only
      - given viewer, commenter, or user, no overview metadata field is intentionally hidden or omitted for that actor (read-only where applicable)
      - given workflowOverviewView shows workflowMetadataFieldDescription with value 'Old description', when owner updates the workflow description to 'New description' via editWorkflowDialog per FR-WF-FORM-003 and returns to Overview, workflowMetadataFieldDescription shows 'New description'
      - given workflowOverviewView shows workflowMetadataFieldDescription with a non-empty value, when owner clears the workflow description via editWorkflowDialog per FR-WF-FORM-003 and returns to Overview, workflowMetadataFieldDescription shows '-'

    openQuestions: []

  - id: FR-WF-OV-003
    title: Time auto-calculation switch controls editability of 'Time' field

    designEvidence:
      - FIGMA-WF-OV-ACTIVITY-OWNER-EDITOR
      - FIGMA-WF-OV-ACTIVITY-OWNER-EDITOR-AUTO-CALC-ON
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowMetadataSwitchCalculateTimeAutomatically
      - workflowMetadataFieldTime

    preconditions:
      - FR-WF-OV-001 preconditions hold

    trigger:
      - owner or editor toggles workflowMetadataSwitchCalculateTimeAutomatically
      - while workflowMetadataSwitchCalculateTimeAutomatically is ON, any change to the effective time contribution of one or more workflowNodes in the current workflow, including workflowNode create or delete in workflowView per tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml and tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-003, workflowEditNodeFormTimeField edit on a non-linked workflowNode per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-007, workflow link or unlink on a workflowNode per FR-WF-EN-010 and FR-WF-EN-011, archive of a linked child workflow that clears parent node links per tests/docs/requirements/original/workflow_archive_requirements_v1.yaml FR-WF-ARCH-003, and linked activity or course workflowMetadataFieldTime change on a child workflow that is linked from a node in this workflow per FR-WF-EN-004 and FR-WF-EN-006

    mainFlow:
      - workflowMetadataFieldTime is a duration-type field
      - for a newly blank-created workflow, initial auto-calculate switch defaults are defined in FR-WF-OV-008; for a template-created workflow, overview metadata including switch states are copied from the template source per FR-WF-OV-009
      - when workflowMetadataSwitchCalculateTimeAutomatically is OFF, workflowMetadataFieldTime is editable for owner or editor
      - when workflowMetadataSwitchCalculateTimeAutomatically is ON, workflowMetadataFieldTime is read-only and its displayed value equals the arithmetic sum of effective time durations across all workflowNodes in the current workflow; for each workflowNode, effective time is workflowEditNodeFormTimeField when the node has no linked workflow, or the linked activity/course workflow's workflowMetadataFieldTime when the node has a linked workflow per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-004 and FR-WF-EN-006; nodes with empty or unset effective time contribute zero to the sum
      - when workflowMetadataSwitchCalculateTimeAutomatically is ON and a qualifying trigger occurs while workflowOverviewView is visible, workflowMetadataFieldTime updates immediately to the recomputed sum (no separate save or apply step for the displayed calculated value)
      - when workflowMetadataSwitchCalculateTimeAutomatically is ON and a qualifying trigger occurs on the Workflow sub-view while Overview is not visible, workflowMetadataFieldTime shows the current calculated value when the actor opens Overview per FR-WF-OV-010
      - when owner or editor toggles workflowMetadataSwitchCalculateTimeAutomatically while workflowOverviewView is visible, the duration value shown in workflowMetadataFieldTime updates immediately (no separate save or apply step is required for that display update)
      - viewer, commenter, or user cannot edit either control and see resulting values read-only

    roleBehavior:
      owner:
        workflowMetadataSwitchCalculateTimeAutomatically: available
        workflowMetadataFieldTime: editableWhenSwitchOff
      editor:
        workflowMetadataSwitchCalculateTimeAutomatically: available
        workflowMetadataFieldTime: editableWhenSwitchOff
      viewer:
        workflowMetadataSwitchCalculateTimeAutomatically: readOnly
        workflowMetadataFieldTime: readOnly
      commenter:
        workflowMetadataSwitchCalculateTimeAutomatically: readOnly
        workflowMetadataFieldTime: readOnly
      user:
        workflowMetadataSwitchCalculateTimeAutomatically: readOnly
        workflowMetadataFieldTime: readOnly

    acceptanceCriteria:
      - given switch is OFF and actor is owner or editor, workflowMetadataFieldTime is editable
      - given switch is ON and actor is owner or editor, workflowMetadataFieldTime is read-only and shows calculated value
      - given actor is viewer, commenter, or user, switch and field are read-only regardless of switch state
      - given owner or editor toggles workflowMetadataSwitchCalculateTimeAutomatically while workflowOverviewView is visible, workflowMetadataFieldTime updates immediately to reflect the new mode and value
      - given workflowMetadataSwitchCalculateTimeAutomatically is ON and workflowNode N1 has effective time 2 hours and workflowNode N2 has effective time 3 hours (whether from local workflowEditNodeFormTimeField values or linked child workflowMetadataFieldTime per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-004 and FR-WF-EN-006), workflowMetadataFieldTime displays 5 hours
      - given workflowMetadataSwitchCalculateTimeAutomatically is ON and owner edits workflowEditNodeFormTimeField on a non-linked workflowNode from 2 hours to 4 hours on the Workflow sub-view, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldTime reflects the new sum per FR-WF-OV-010
      - given workflowMetadataSwitchCalculateTimeAutomatically is ON and a workflowNode with effective time 2 hours is deleted per tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-003 on the Workflow sub-view, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldTime reflects the reduced total per FR-WF-OV-010
      - given workflowMetadataSwitchCalculateTimeAutomatically is ON and a course workflowNode is linked to an activity workflow whose workflowMetadataFieldTime is 6 hours per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-004, that node contributes 6 hours to workflowMetadataFieldTime until the link is removed per FR-WF-EN-011 or the linked activity workflowMetadataFieldTime changes

    openQuestions: []

  - id: FR-WF-OV-004
    title: Course and program ponderation fields and program auto-calculate behavior

    designEvidence:
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR-WARNING
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR-WARNING

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowMetadataSwitchCalculatePonderationAutomatically
      - workflowMetadataFieldIndividualTime
      - workflowMetadataFieldPracticalTime
      - workflowMetadataFieldTheoryTime
      - workflowMetadataFieldTime
      - workflowMetadataWarningBanner

    preconditions:
      - FR-WF-OV-001 preconditions hold
      - workflow type is course or program

    trigger:
      - owner or editor edits workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, or workflowMetadataFieldIndividualTime and/or toggles workflowMetadataSwitchCalculatePonderationAutomatically on program
      - while workflowMetadataSwitchCalculatePonderationAutomatically is ON on a program workflow, any change to the effective ponderation contribution of one or more workflowNodes in the current workflow, including workflowNode create or delete in workflowView per tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml and tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-003, workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, or workflowEditNodeFormPonderationIndividualField edit on a non-linked program workflowNode per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-007, workflow link or unlink on a program workflowNode per FR-WF-EN-010 and FR-WF-EN-011, archive of a linked child workflow that clears parent node links per tests/docs/requirements/original/workflow_archive_requirements_v1.yaml FR-WF-ARCH-003, and linked course workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, or workflowMetadataFieldIndividualTime change on a child course workflow linked from a node in this program per FR-WF-EN-006
      - workflowMetadataFieldTime changes on the current workflow per FR-WF-OV-003 (manual edit when workflowMetadataSwitchCalculateTimeAutomatically is OFF, or recomputed display value when workflowMetadataSwitchCalculateTimeAutomatically is ON)

    mainFlow:
      - on course and program workflows, the 'Ponderation' section shows three duration fields: workflowMetadataFieldTheoryTime ('Theory'), workflowMetadataFieldPracticalTime ('Practical'), and workflowMetadataFieldIndividualTime ('Individual'), which are editable for owner or editor
      - on program workflows, there is an additional switch control: workflowMetadataSwitchCalculatePonderationAutomatically, which is editable for owner or editor
      - on program workflows, when workflowMetadataSwitchCalculatePonderationAutomatically is OFF, those three duration fields in the 'Ponderation' section are editable for owner or editor
      - on program workflows, when workflowMetadataSwitchCalculatePonderationAutomatically is ON, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime are read-only and their displayed values equal the arithmetic sums of effective ponderation durations across all workflowNodes in the current program workflow as follows — workflowMetadataFieldTheoryTime equals the sum of each workflowNode's effective Theory duration (workflowEditNodeFormPonderationTheoryField when the node has no linked workflow, or the linked course workflow's workflowMetadataFieldTheoryTime when the node has a linked course workflow per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-006); workflowMetadataFieldPracticalTime equals the sum of each workflowNode's effective Practical duration (workflowEditNodeFormPonderationPracticeField when the node has no linked workflow, or the linked course workflow's workflowMetadataFieldPracticalTime when the node has a linked course workflow per FR-WF-EN-006); workflowMetadataFieldIndividualTime equals the sum of each workflowNode's effective Individual duration (workflowEditNodeFormPonderationIndividualField when the node has no linked workflow, or the linked course workflow's workflowMetadataFieldIndividualTime when the node has a linked course workflow per FR-WF-EN-006); nodes with empty or unset effective values contribute zero to each respective sum
      - when workflowMetadataSwitchCalculatePonderationAutomatically is ON and a qualifying trigger occurs while workflowOverviewView is visible, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, workflowMetadataFieldIndividualTime, and workflowMetadataWarningBanner visibility update immediately to reflect the recomputed values (no separate save step for displayed calculated values)
      - when workflowMetadataSwitchCalculatePonderationAutomatically is ON and a qualifying trigger occurs on the Workflow sub-view while Overview is not visible, ponderation totals and workflowMetadataWarningBanner eligibility reflect the current workflow state when the actor opens Overview per FR-WF-OV-010
      - when the combined duration represented by workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime is not equal to the duration represented by workflowMetadataFieldTime, workflowMetadataWarningBanner is shown; its message is 'Total of ponderation hours does not match [workflow type] time.' where [workflow type] is replaced by the workflow type label (course or program)
      - when workflowMetadataFieldTime changes per FR-WF-OV-003 while workflowOverviewView is rendered, workflowMetadataWarningBanner visibility updates immediately to reflect whether the sum of workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime equals workflowMetadataFieldTime
      - example of a mismatch that triggers workflowMetadataWarningBanner — workflowMetadataFieldTheoryTime 40 hours, workflowMetadataFieldPracticalTime 60 hours, workflowMetadataFieldIndividualTime 80 hours (combined total 180 hours), and workflowMetadataFieldTime 150 hours

    roleBehavior:
      owner:
        workflowMetadataSwitchCalculatePonderationAutomatically: available
        workflowMetadataFieldIndividualTime: editableWhenSwitchOff
        workflowMetadataFieldPracticalTime: editableWhenSwitchOff
        workflowMetadataFieldTheoryTime: editableWhenSwitchOff
      editor:
        workflowMetadataSwitchCalculatePonderationAutomatically: available
        workflowMetadataFieldIndividualTime: editableWhenSwitchOff
        workflowMetadataFieldPracticalTime: editableWhenSwitchOff
        workflowMetadataFieldTheoryTime: editableWhenSwitchOff
      viewer:
        workflowMetadataSwitchCalculatePonderationAutomatically: readOnly
        workflowMetadataFieldIndividualTime: readOnly
        workflowMetadataFieldPracticalTime: readOnly
        workflowMetadataFieldTheoryTime: readOnly
      commenter:
        workflowMetadataSwitchCalculatePonderationAutomatically: readOnly
        workflowMetadataFieldIndividualTime: readOnly
        workflowMetadataFieldPracticalTime: readOnly
        workflowMetadataFieldTheoryTime: readOnly
      user:
        workflowMetadataSwitchCalculatePonderationAutomatically: readOnly
        workflowMetadataFieldIndividualTime: readOnly
        workflowMetadataFieldPracticalTime: readOnly
        workflowMetadataFieldTheoryTime: readOnly

    acceptanceCriteria:
      - given workflow type is course or program, the 'Ponderation' section shows Theory, Practical, and Individual as duration fields (workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, workflowMetadataFieldIndividualTime)
      - given workflow type is course, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, workflowMetadataFieldIndividualTime are editable
      - given workflow type is course, workflowMetadataSwitchCalculatePonderationAutomatically is not shown
      - given workflow type is program, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, workflowMetadataFieldIndividualTime are editable for owner or editor when workflowMetadataSwitchCalculatePonderationAutomatically is OFF
      - given workflow type is program and workflowMetadataSwitchCalculatePonderationAutomatically is ON, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime are read-only for owner or editor and their displayed values equal the sums of workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, and workflowEditNodeFormPonderationIndividualField respectively across all program workflowNodes (or mirrored linked-course workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime per FR-WF-EN-006 when a node has a linked course)
      - given workflow type is course or program and actor is viewer, commenter, or user, the three ponderation duration fields are read-only
      - given workflow type is program and actor is viewer, commenter, or user, workflowMetadataSwitchCalculatePonderationAutomatically is read-only
      - given workflow type is course or program, when the sum of the three ponderation duration values does not equal the duration in workflowMetadataFieldTime, workflowMetadataWarningBanner is visible
      - given workflowMetadataWarningBanner is visible, its text is 'Total of ponderation hours does not match [workflow type] time.' with [workflow type] substituted by the current workflow type label (course or program)
      - given workflow type is program, workflowMetadataSwitchCalculatePonderationAutomatically is ON, workflowNode N1 has workflowEditNodeFormPonderationTheoryField 10 hours and workflowNode N2 has workflowEditNodeFormPonderationTheoryField 15 hours (local values on non-linked nodes, or mirrored linked-course workflowMetadataFieldTheoryTime per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-006), workflowMetadataFieldTheoryTime displays 25 hours
      - given workflow type is program, workflowMetadataSwitchCalculatePonderationAutomatically is ON, and owner edits workflowEditNodeFormPonderationIndividualField on a non-linked program workflowNode on the Workflow sub-view, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldIndividualTime reflects the new sum per FR-WF-OV-010
      - given workflow type is program, workflowMetadataSwitchCalculatePonderationAutomatically is ON, and a program workflowNode is linked to a course whose workflowMetadataFieldPracticalTime is 8 hours per FR-WF-EN-006, that node's workflowEditNodeFormPonderationPracticeField mirrors 8 hours and contributes 8 hours to workflowMetadataFieldPracticalTime until the link is removed per FR-WF-EN-011 or the linked course workflowMetadataFieldPracticalTime changes
      - given workflow type is course or program, workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, and workflowMetadataFieldIndividualTime sum to 180 hours, workflowMetadataFieldTime is 150 hours, and workflowMetadataWarningBanner is visible, when owner toggles workflowMetadataSwitchCalculateTimeAutomatically ON per FR-WF-OV-003 and workflowMetadataFieldTime recomputes to 180 hours, workflowMetadataWarningBanner is no longer visible

    openQuestions: []

  - id: FR-WF-OV-005
    title: Course and program credits number field; program auto-calculation switch

    designEvidence:
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR
      - FIGMA-WF-OV-COURSE-VIEWER-COMMENTER
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR-WARNING

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowMetadataSwitchCalculateCreditsAutomatically
      - workflowMetadataFieldCredits

    preconditions:
      - FR-WF-OV-001 preconditions hold
      - workflow type is course or program

    trigger:
      - on course workflows, owner or editor edits workflowMetadataFieldCredits
      - on program workflows, owner or editor toggles workflowMetadataSwitchCalculateCreditsAutomatically and edits workflowMetadataFieldCredits where editable
      - while workflowMetadataSwitchCalculateCreditsAutomatically is ON on a program workflow, any change to the effective credits contribution of one or more workflowNodes in the current workflow, including workflowNode create or delete in workflowView per tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml and tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-003, workflowEditNodeFormCreditsField edit on a non-linked program workflowNode per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-007, workflow link or unlink on a program workflowNode per FR-WF-EN-010 and FR-WF-EN-011, archive of a linked child workflow that clears parent node links per tests/docs/requirements/original/workflow_archive_requirements_v1.yaml FR-WF-ARCH-003, and linked course workflowMetadataFieldCredits change on a child course workflow linked from a node in this program per FR-WF-EN-006

    mainFlow:
      - on course workflows, workflowOverviewView shows workflowMetadataFieldCredits as a number field; there is no option to calculate credits automatically on courses; owner and editor can edit workflowMetadataFieldCredits
      - workflowMetadataFieldCredits accepts and displays whole numbers only (no fractional credits), whether entered manually on courses or shown as calculated on programs when auto-calculate is ON
      - on program workflows, workflowOverviewView shows workflowMetadataSwitchCalculateCreditsAutomatically and workflowMetadataFieldCredits
      - on program workflows, when workflowMetadataSwitchCalculateCreditsAutomatically is OFF, workflowMetadataFieldCredits is editable for owner or editor
      - on program workflows, when workflowMetadataSwitchCalculateCreditsAutomatically is ON, workflowMetadataFieldCredits is read-only and its displayed value equals the arithmetic sum of workflowEditNodeFormCreditsField values across all workflowNodes in the current program workflow; for each workflowNode, the summed value is workflowEditNodeFormCreditsField when the node has no linked workflow, or the linked course workflow's workflowMetadataFieldCredits (mirrored into workflowEditNodeFormCreditsField per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-006) when the node has a linked course workflow; nodes with empty or unset workflowEditNodeFormCreditsField contribute zero to the sum; the displayed sum is a whole number per the existing whole-number rule
      - when workflowMetadataSwitchCalculateCreditsAutomatically is ON and a qualifying trigger occurs while workflowOverviewView is visible, workflowMetadataFieldCredits updates immediately to the recomputed sum (no separate save step for the displayed calculated value)
      - when workflowMetadataSwitchCalculateCreditsAutomatically is ON and a qualifying trigger occurs on the Workflow sub-view while Overview is not visible, workflowMetadataFieldCredits shows the current calculated value when the actor opens Overview per FR-WF-OV-010
      - viewer, commenter, or user cannot edit workflowMetadataFieldCredits; on program workflows they cannot edit workflowMetadataSwitchCalculateCreditsAutomatically

    roleBehavior:
      owner:
        workflowMetadataSwitchCalculateCreditsAutomatically: available
        workflowMetadataFieldCredits: editableWhenSwitchOff
      editor:
        workflowMetadataSwitchCalculateCreditsAutomatically: available
        workflowMetadataFieldCredits: editableWhenSwitchOff
      viewer:
        workflowMetadataSwitchCalculateCreditsAutomatically: readOnly
        workflowMetadataFieldCredits: readOnly
      commenter:
        workflowMetadataSwitchCalculateCreditsAutomatically: readOnly
        workflowMetadataFieldCredits: readOnly
      user:
        workflowMetadataSwitchCalculateCreditsAutomatically: readOnly
        workflowMetadataFieldCredits: readOnly

    acceptanceCriteria:
      - given workflow type is course, workflowMetadataSwitchCalculateCreditsAutomatically is not shown and workflowMetadataFieldCredits is editable for owner or editor
      - given workflow type is program and workflowMetadataSwitchCalculateCreditsAutomatically is OFF, workflowMetadataFieldCredits is editable for owner or editor
      - given workflow type is program and workflowMetadataSwitchCalculateCreditsAutomatically is ON, workflowMetadataFieldCredits is read-only and equals the sum of workflowEditNodeFormCreditsField values across all program workflowNodes (or mirrored linked-course workflowMetadataFieldCredits per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-006 when a node has a linked course)
      - given viewer, commenter, or user, workflowMetadataFieldCredits is read-only on course and program workflows
      - given viewer, commenter, or user on a program workflow, workflowMetadataSwitchCalculateCreditsAutomatically is read-only
      - given workflowMetadataFieldCredits is shown, its value is a whole number (integer) for manual entry on courses and for displayed calculated values on programs
      - given workflow type is program, workflowMetadataSwitchCalculateCreditsAutomatically is ON, workflowNode N1 has workflowEditNodeFormCreditsField 3 and workflowNode N2 has workflowEditNodeFormCreditsField 5 (local values on non-linked nodes, or mirrored linked-course workflowMetadataFieldCredits per FR-WF-EN-006), workflowMetadataFieldCredits displays 8
      - given workflow type is program, workflowMetadataSwitchCalculateCreditsAutomatically is ON, and owner edits workflowEditNodeFormCreditsField on a non-linked program workflowNode on the Workflow sub-view, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldCredits reflects the new sum per FR-WF-OV-010
      - given workflow type is program, workflowMetadataSwitchCalculateCreditsAutomatically is ON, and a program workflowNode is linked to a course whose workflowMetadataFieldCredits is 4 per FR-WF-EN-006, that node's workflowEditNodeFormCreditsField mirrors 4 and contributes 4 to workflowMetadataFieldCredits until the link is removed per FR-WF-EN-011 or the linked course workflowMetadataFieldCredits changes

    openQuestions: []

  - id: FR-WF-OV-006
    title: Program classification auto-calculation switch and duration fields

    designEvidence:
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR-WARNING

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowMetadataSwitchCalculateClassificationAutomatically
      - workflowMetadataFieldGeneralTime
      - workflowMetadataFieldSpecificTime
      - workflowMetadataFieldTime
      - workflowMetadataClassificationWarningBanner

    preconditions:
      - FR-WF-OV-001 preconditions hold
      - workflow type is program

    trigger:
      - owner or editor toggles workflowMetadataSwitchCalculateClassificationAutomatically and edits workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime where editable
      - while workflowMetadataSwitchCalculateClassificationAutomatically is ON on a program workflow, any change affecting a program workflowNode's classification bucket contribution, including workflowNode create or delete in workflowView per tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml and tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-003, workflowEditNodeFormTimeField edit per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-007, workflowEditNodeFormSpecificEducationSwitch toggle per FR-WF-EN-007, workflow link or unlink on a program workflowNode per FR-WF-EN-010 and FR-WF-EN-011, archive of a linked child workflow that clears parent node links per tests/docs/requirements/original/workflow_archive_requirements_v1.yaml FR-WF-ARCH-003, and linked course overview metadata changes that alter mirrored workflowEditNodeFormTimeField or workflowEditNodeFormSpecificEducationSwitch presentation per FR-WF-EN-006
      - workflowMetadataFieldTime changes on the current program workflow per FR-WF-OV-003

    mainFlow:
      - workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime are duration-type fields in the program overview classification controls
      - when workflowMetadataSwitchCalculateClassificationAutomatically is OFF, workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime are editable for owner or editor and workflowEditNodeFormSpecificEducationSwitch has no effect on these totals
      - when workflowMetadataSwitchCalculateClassificationAutomatically is ON, workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime are read-only and calculated from each program workflowNode's workflowEditNodeFormSpecificEducationSwitch (defined in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml) — a workflowNode with workflowEditNodeFormSpecificEducationSwitch ON contributes its workflowEditNodeFormTimeField duration to workflowMetadataFieldSpecificTime, and a workflowNode with workflowEditNodeFormSpecificEducationSwitch OFF contributes its workflowEditNodeFormTimeField duration to workflowMetadataFieldGeneralTime
      - when workflowMetadataSwitchCalculateClassificationAutomatically is ON and a qualifying trigger occurs while workflowOverviewView is visible, workflowMetadataFieldGeneralTime, workflowMetadataFieldSpecificTime, and workflowMetadataClassificationWarningBanner visibility update immediately to reflect the recomputed sums (no separate save step for displayed calculated values)
      - when workflowMetadataSwitchCalculateClassificationAutomatically is ON and a qualifying trigger occurs on the Workflow sub-view while Overview is not visible, classification totals and workflowMetadataClassificationWarningBanner eligibility reflect the current workflow state when the actor opens Overview per FR-WF-OV-010
      - when the combined duration represented by workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime is not equal to the duration represented by workflowMetadataFieldTime, workflowMetadataClassificationWarningBanner is shown with message 'Total of classification hours does not match program time'
      - when workflowMetadataFieldTime changes per FR-WF-OV-003 while workflowOverviewView is rendered, workflowMetadataClassificationWarningBanner visibility updates immediately to reflect whether the sum of workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime equals workflowMetadataFieldTime
      - viewer, commenter, or user cannot edit workflowMetadataSwitchCalculateClassificationAutomatically, workflowMetadataFieldGeneralTime, or workflowMetadataFieldSpecificTime

    roleBehavior:
      owner:
        workflowMetadataSwitchCalculateClassificationAutomatically: available
        workflowMetadataFieldGeneralTime: editableWhenSwitchOff
        workflowMetadataFieldSpecificTime: editableWhenSwitchOff
      editor:
        workflowMetadataSwitchCalculateClassificationAutomatically: available
        workflowMetadataFieldGeneralTime: editableWhenSwitchOff
        workflowMetadataFieldSpecificTime: editableWhenSwitchOff
      viewer:
        workflowMetadataSwitchCalculateClassificationAutomatically: readOnly
        workflowMetadataFieldGeneralTime: readOnly
        workflowMetadataFieldSpecificTime: readOnly
      commenter:
        workflowMetadataSwitchCalculateClassificationAutomatically: readOnly
        workflowMetadataFieldGeneralTime: readOnly
        workflowMetadataFieldSpecificTime: readOnly
      user:
        workflowMetadataSwitchCalculateClassificationAutomatically: readOnly
        workflowMetadataFieldGeneralTime: readOnly
        workflowMetadataFieldSpecificTime: readOnly

    acceptanceCriteria:
      - given owner or editor and workflowMetadataSwitchCalculateClassificationAutomatically is OFF, workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime are editable and workflowEditNodeFormSpecificEducationSwitch state on individual program workflowNodes does not affect either total
      - given owner or editor and workflowMetadataSwitchCalculateClassificationAutomatically is ON, workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime are read-only and computed by summing each program workflowNode's workflowEditNodeFormTimeField duration into workflowMetadataFieldSpecificTime when workflowEditNodeFormSpecificEducationSwitch is ON and into workflowMetadataFieldGeneralTime when workflowEditNodeFormSpecificEducationSwitch is OFF
      - given viewer, commenter, or user, workflowMetadataSwitchCalculateClassificationAutomatically, workflowMetadataFieldGeneralTime, and workflowMetadataFieldSpecificTime are read-only
      - given workflow type is program, when the sum of workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime does not equal the duration in workflowMetadataFieldTime, workflowMetadataClassificationWarningBanner is visible
      - given workflowMetadataClassificationWarningBanner is visible, its text is 'Total of classification hours does not match program time'
      - given workflowMetadataSwitchCalculateClassificationAutomatically is ON, program workflowNode N1 has workflowEditNodeFormSpecificEducationSwitch OFF and workflowEditNodeFormTimeField 2 hours and program workflowNode N2 has workflowEditNodeFormSpecificEducationSwitch ON and workflowEditNodeFormTimeField 3 hours, workflowMetadataFieldGeneralTime displays 2 hours and workflowMetadataFieldSpecificTime displays 3 hours
      - given workflowMetadataSwitchCalculateClassificationAutomatically is ON and owner toggles workflowEditNodeFormSpecificEducationSwitch on a program workflowNode from OFF to ON on the Workflow sub-view, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime reflect the moved duration per FR-WF-OV-010
      - given workflowMetadataSwitchCalculateClassificationAutomatically is ON and a program workflowNode with workflowEditNodeFormTimeField 2 hours is deleted per tests/docs/requirements/original/workflow_delete_node_requirements_v1.yaml FR-WF-DEL-003 on the Workflow sub-view, when owner selects Overview on workflowViewTabSelector per FR-WF-HEADER-001, workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime reflect the reduced totals per FR-WF-OV-010
      - given workflow type is program, workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime sum to 180 hours, workflowMetadataFieldTime is 150 hours, and workflowMetadataClassificationWarningBanner is visible, when workflowMetadataFieldTime updates to 180 hours per FR-WF-OV-003, workflowMetadataClassificationWarningBanner is no longer visible

    openQuestions: []

  - id: FR-WF-OV-007
    title: Workflow overview permissions panel visibility

    designEvidence:
      - FIGMA-WF-OV-ACTIVITY-OWNER-EDITOR
      - FIGMA-WF-OV-COURSE-OWNER-EDITOR
      - FIGMA-WF-OV-PROGRAM-OWNER-EDITOR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowMetadataSection
      - workflowMetadataPermissionsPanel

    preconditions:
      - FR-WF-OV-001 preconditions hold

    trigger: []

    mainFlow:
      - workflowOverviewView shows workflowMetadataPermissionsPanel in workflowMetadataSection
      - workflowMetadataPermissionsPanel displays the same permissions dataset as the parent project's projectMetadataPermissionsPanel per tests/docs/requirements/original/project_overview_requirements_v1.yaml FR-PROJ-OV-002
      - when the parent project's contributor list changes per FR-PROJ-OV-002 (add contributor, remove contributor, or role edit) while an actor has workflowOverviewView open, workflowMetadataPermissionsPanel listed users and roles refresh to match projectMetadataPermissionsPanel on that actor's next in-app action per tests/docs/requirements/original/workspace_access_requirements_v1.yaml FR-WS-ACCESS-004

    roleBehavior:
      owner:
        workflowMetadataPermissionsPanel: readOnly
      editor:
        workflowMetadataPermissionsPanel: readOnly
      viewer:
        workflowMetadataPermissionsPanel: readOnly
      commenter:
        workflowMetadataPermissionsPanel: readOnly
      user:
        workflowMetadataPermissionsPanel: readOnly

    acceptanceCriteria:
      - given workflowOverviewView is visible, workflowMetadataPermissionsPanel is visible in workflowMetadataSection
      - given workflowMetadataPermissionsPanel is shown, listed users and roles match the parent project's projectMetadataPermissionsPanel per tests/docs/requirements/original/project_overview_requirements_v1.yaml FR-PROJ-OV-002
      - given any actor, workflowMetadataPermissionsPanel is read-only and does not allow adding contributors
      - given any actor, workflowMetadataPermissionsPanel is read-only and does not allow removing contributors
      - given any actor, workflowMetadataPermissionsPanel is read-only and does not allow changing user role assignments
      - given owner has workflowOverviewView open and the parent project's contributor list changes per FR-PROJ-OV-002, when owner next performs an in-app action on that Overview view, workflowMetadataPermissionsPanel listed users and roles match projectMetadataPermissionsPanel

    openQuestions: []

  - id: FR-WF-OV-008
    title: Initial metadata auto-calculate switch defaults for blank-created workflows

    designEvidence:
