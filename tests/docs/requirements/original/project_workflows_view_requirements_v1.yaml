# Normalized requirements: project 'Workflows' view (route /project/{id}/workflows)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Project workflows scope) + current Project tabs implementation evidence.
# Application code evidence: react/src/components/pages/Workspace/Project/index.tsx; react/src/components/views/ProjectView/TabWorkflows/index.tsx
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/original/project_overview_requirements_v1.yaml (shared projectHeader and projectViewTabSelector contracts in FR-PROJ-OV-001; favourites behavior in FR-PROJ-OV-006)
#   - tests/docs/requirements/original/card_content_requirements_v1.yaml (workflowCard content and click destination in FR-CARD-002 and FR-CARD-004)

documentPreconditions:
  - user is authenticated to CourseFlow
  - user has access to a project route

uiObjectDefinitions:
  projectWorkflowsView:
    meaning: Project 'Workflows' view at route '/project/{id}/workflows', showing workflows scoped to the current project.
  projectWorkflowsFilterToolbar:
    meaning: Filter/search toolbar for projectWorkflowsView using global canonical controls shared across listing surfaces: sortControl, ownershipFilter, workflowTypeFilter, favouritesToggle, archiveToggle, and keywordSearchField.
  sortControl:
    meaning: Global canonical sortControl shared across listing surfaces. Placeholder label is 'Sort'; options are 'A - Z' and 'Date created'; selecting the same option again toggles direction; sortResetButton is visible when non-default sort is active.
  sortResetButton:
    meaning: Clear ('X') control on sortControl that resets sorting to default order.
  ownershipFilter:
    meaning: Global canonical ownershipFilter shared across listing surfaces, with a single-select option set and ownershipFilterResetButton when active.
  ownershipFilterResetButton:
    meaning: Clear ('X') control on ownershipFilter when an ownership option is active.
  workflowTypeFilter:
    meaning: Global canonical workflowTypeFilter shared across listing surfaces, with the same option set everywhere it appears. In projectWorkflowsView it is visible by default because only workflows are in scope.
  favouritesToggle:
    meaning: Global canonical favourites boolean filter shared across listing surfaces; when enabled, results are constrained to favourited workflows in current project scope.
  archiveToggle:
    meaning: Global canonical archive boolean filter shared across listing surfaces; when enabled, archived workflows may appear per backend contract.
  keywordSearchField:
    meaning: Global canonical inline keyword search field shared across listing surfaces, used to narrow workflows.
  keywordSearchClearButton:
    meaning: Icon-only clear ('X') control on keywordSearchField, visible when keywordSearchField is non-empty.
  resultsSummary:
    meaning: Region between projectWorkflowsFilterToolbar and resultsRegion showing current query result counts; same canonical contract as resultsSummary on 'My library' and 'Explore'.
  resultsRegion:
    meaning: Main grid results area in projectWorkflowsView listing workflowCard items for current query state. Uses shared results layout contract across listing surfaces: exactly 2 cards per row, maximum 5 rows (maximum 10 visible cards per page).
  workflowCard:
    meaning: Same canonical object as workflowCard in card_content_requirements_v1.yaml for each workflow listed in projectWorkflowsView.
  pagination:
    meaning: Shared pagination control shown only when total matching workflows are 11 or more.
  paginationPageNumberButton:
    meaning: Clickable numeric page control within pagination.
  paginationPreviousNextButton:
    meaning: Single-arrow control within pagination for previous/next page navigation.
  paginationFirstLastButton:
    meaning: Double-arrow control within pagination for first/last page navigation.
  projectWorkflowsLoadingState:
    meaning: Loading placeholders shown while project workflows query is in progress.
  projectWorkflowsEmptyState:
    meaning: Empty state shown when no workflows are present in the project workflows listing; exact copy is 'There are no workflows in this project'.
  projectWorkflowsErrorState:
    meaning: Error state shown when project workflows query fails.

