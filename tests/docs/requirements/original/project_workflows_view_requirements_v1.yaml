  sortControl:
    strategy: "{projectWorkflowsFilterToolbar} SortableFilterButton with placeholder 'Sort'"
    confidence: inferred
  sortResetButton:
    strategy: "{sortControl} clear control when non-default sort is active"
    confidence: inferred
  ownershipFilter:
    strategy: "{projectWorkflowsFilterToolbar} ownership filter control (same canonical object as 'My library')"
    confidence: inferred
  ownershipFilterResetButton:
    strategy: "{ownershipFilter} clear control when active"
    confidence: inferred
  workflowTypeFilter:
    strategy: "{projectWorkflowsFilterToolbar} workflow-type filter control (same canonical object as 'My library')"
    confidence: inferred
  favouritesToggle:
