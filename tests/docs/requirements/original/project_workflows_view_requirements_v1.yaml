# Normalized requirements: project 'Workflows' view (route /project/{id}/workflows)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Project workflows scope) + current Project tabs implementation evidence.
# Application code evidence: react/src/components/pages/Workspace/Project/index.tsx; react/src/components/views/ProjectView/TabWorkflows/index.tsx
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/original/project_overview_requirements_v1.yaml (shared projectHeader and projectViewTabSelector contracts in FR-PROJ-OV-001; favourites behavior in FR-PROJ-OV-006)
#   - tests/docs/requirements/original/library_page_requirements_v1.yaml (sort and shared filters — FR-LIB-002, FR-LIB-003)
#   - tests/docs/requirements/original/card_content_requirements_v1.yaml (workflowCard — FR-CARD-001 through FR-CARD-006 as applicable)

documentPreconditions:
  - user is authenticated to CourseFlow
  - user has access to a project route

uiObjectDefinitions:
  projectWorkflowsView:
    meaning: Project Workflows sub-view listing workflows belonging to the project.
  projectWorkflowsFilterToolbar:
    meaning: Filter toolbar on projectWorkflowsView with sort, ownership, workflow-type, favourites, archive, and keyword controls.
  sortControl:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  sortResetButton:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  ownershipFilter:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  ownershipFilterResetButton:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  workflowTypeFilter:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  favouritesToggle:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  archiveToggle:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  keywordSearchField:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  keywordSearchClearButton:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  resultsSummary:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  resultsRegion:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  workflowCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  pagination:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  paginationPageNumberButton:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  paginationPreviousNextButton:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  paginationFirstLastButton:
    meaning: Canonical definition in tests/docs/requirements/original/library_page_requirements_v1.yaml.
  projectWorkflowsLoadingState:
    meaning: Loading placeholders shown while project workflows query is in progress.
  projectWorkflowsEmptyState:
    meaning: Empty state shown when no workflows are present in the project workflows listing
  projectWorkflowsErrorState:
    meaning: Error state shown when project workflows query fails.

locatorMappings:
  projectWorkflowsView:
    strategy: "URL route pattern '/project/{id}/workflows' with project tab content rendered by TabWorkflows"
    confidence: inferred
  projectWorkflowsFilterToolbar:
    strategy: "{projectWorkflowsView} top filter toolbar region"
    confidence: inferred
  sortControl:
    strategy: "{projectWorkflowsFilterToolbar} SortableFilterButton with placeholder 'Sort'"
    confidence: inferred
  sortResetButton:
    strategy: "{sortControl} clear control when non-default sort is active"
    confidence: inferred
  ownershipFilter:
    strategy: "{projectWorkflowsFilterToolbar} ownership filter control (same canonical object as 'My library')"
    confidence: inferred
  ownershipFilterResetButton:
    strategy: "{ownershipFilter} clear control when active"
    confidence: inferred
  workflowTypeFilter:
    strategy: "{projectWorkflowsFilterToolbar} workflow-type filter control (same canonical object as 'My library')"
    confidence: inferred
  favouritesToggle:
    strategy: "{projectWorkflowsFilterToolbar} favourites toggle control (same canonical object as 'My library')"
    confidence: inferred
  archiveToggle:
    strategy: "{projectWorkflowsFilterToolbar} archive toggle control (same canonical object as 'My library')"
    confidence: inferred
  keywordSearchField:
    strategy: "{projectWorkflowsFilterToolbar} inline keyword input on the right side"
    confidence: inferred
  keywordSearchClearButton:
    strategy: "{keywordSearchField} icon-only clear control ('X') shown when input is non-empty"
    confidence: inferred
  resultsSummary:
    strategy: "{projectWorkflowsView} region between projectWorkflowsFilterToolbar and resultsRegion showing count summary"
    confidence: inferred
  resultsRegion:
    strategy: "{projectWorkflowsView} GridWrap containing workflow cards"
    confidence: inferred
  workflowCard:
    strategy: "{resultsRegion} WorkflowCardWrapper item"
    confidence: inferred
  pagination:
    strategy: "{projectWorkflowsView} Pagination shown when dataPackage.meta.pageCount > 1"
    confidence: inferred
  paginationPageNumberButton:
    strategy: "{pagination} clickable numeric page item"
    confidence: inferred
  paginationPreviousNextButton:
    strategy: "{pagination} single-arrow previous/next control"
    confidence: inferred
  paginationFirstLastButton:
    strategy: "{pagination} double-arrow first/last control"
    confidence: inferred
  projectWorkflowsLoadingState:
    strategy: "{resultsRegion} rectangular skeleton placeholders while loading"
    confidence: inferred
  projectWorkflowsEmptyState:
    strategy: "{resultsRegion} text 'There are no workflows in this project'"
    confidence: inferred
  projectWorkflowsErrorState:
    strategy: "{resultsRegion} ErrorView"
    confidence: inferred

requirements:
  - id: FR-PROJ-WF-001
    title: Project 'Workflows' route and scoped listing

    designEvidence:
      - FIGMA-PROJ-WF-DEFAULT
      - FIGMA-PROJ-WF-EMPTY
      - FIGMA-PROJ-WF-EMPTY-NO-WORKFLOWS

    actors:
      - user
      - owner
      - editor
      - viewer
      - commenter

    uiObjects:
      - projectWorkflowsView
      - projectWorkflowsFilterToolbar
      - projectViewTabSelector
      - resultsSummary
      - resultsRegion
      - workflowCard

    preconditions:
      - user navigates to route pattern '/project/{id}/workflows'
      - shared projectHeader and projectViewTabSelector behavior is governed by FR-PROJ-OV-001

    trigger:
      - user opens the project 'Workflows' tab

    mainFlow:
      - system renders projectWorkflowsView on route '/project/{id}/workflows'
      - projectViewTabSelector indicates 'Workflows' as the active tab
      - system renders projectWorkflowsFilterToolbar, resultsRegion and resultsSummary
      - resultsRegion lists workflowCard items scoped to the current project id
      - workflowCard presentation and card interactions in resultsRegion conform to card_content_requirements_v1.yaml

    roleBehavior: {}

    acceptanceCriteria:
      - given user opens '/project/{id}/workflows', projectWorkflowsView is visible
      - given user opens '/project/{id}/workflows', projectViewTabSelector shows 'Workflows' as active
      - projectWorkflowsFilterToolbar is visible
      - resultsSummary is visible between projectWorkflowsFilterToolbar and resultsRegion
      - given query returns workflows for the current project, workflowCard items are shown in resultsRegion
      - given query returns workflows for the current project, workflowCard in resultsRegion conforms to card_content_requirements_v1.yaml

    openQuestions:
      - Confirm whether published-project users without authentication can access '/project/{id}/workflows', or if this route is authenticated-only in product contract.

  - id: FR-PROJ-WF-002
    title: Sorting, filtering, and keyword search on project 'Workflows'

    designEvidence:
      - FIGMA-PROJ-WF-DEFAULT

    actors:
      - user

    uiObjects:
      - projectWorkflowsView
      - projectWorkflowsFilterToolbar
      - sortControl
      - sortResetButton
      - ownershipFilter
      - ownershipFilterResetButton
      - workflowTypeFilter
      - favouritesToggle
      - archiveToggle
      - keywordSearchField
      - keywordSearchClearButton
      - resultsSummary
      - resultsRegion

    preconditions:
      - projectWorkflowsView is visible

    trigger:
      - user changes sort/filter/search controls on projectWorkflowsFilterToolbar

    mainFlow:
      - sortControl behaviour conforms to library_page_requirements_v1.yaml FR-LIB-002
      - ownershipFilter, workflowTypeFilter, favouritesToggle, archiveToggle, keywordSearchField, and keywordSearchClearButton behaviour conform to library_page_requirements_v1.yaml FR-LIB-003 where those controls are present on projectWorkflowsFilterToolbar
      - projectWorkflowsFilterToolbar has no typeFilter; results are workflows scoped to the current project per FR-PROJ-WF-001
      - workflowTypeFilter is always visible on this workflows-only view
      - active sort and filter constraints combine with AND semantics against the project-scoped workflow set
      - changing sort or any filter/search control resets listing to the first page
      - resultsSummary updates to reflect current filtered/sorted query result counts

    roleBehavior: {}

    acceptanceCriteria:
      - given projectWorkflowsView is visible, sortControl behaviour conforms to FR-LIB-002
      - given projectWorkflowsView is visible, ownershipFilter, workflowTypeFilter, favouritesToggle, archiveToggle, and keywordSearchField behaviour conform to FR-LIB-003
      - keywordSearchField is visible
      - given keywordSearchField is non-empty, keywordSearchClearButton is visible and clears the input when clicked
      - given favouritesToggle is enabled, only favourited workflows are included in resultsRegion
      - given any sort or filter change, resultsSummary updates to current query result counts

    openQuestions: []

  - id: FR-PROJ-WF-003
    title: Loading, empty, error, and pagination states on project 'Workflows'

    designEvidence:
      - FIGMA-PROJ-WF-DEFAULT
      - FIGMA-PROJ-WF-EMPTY

    actors:
      - user

    uiObjects:
      - projectWorkflowsView
      - resultsRegion
      - projectWorkflowsLoadingState
      - projectWorkflowsEmptyState
      - projectWorkflowsErrorState
      - pagination
      - paginationPageNumberButton
      - paginationPreviousNextButton
      - paginationFirstLastButton

    preconditions:
      - projectWorkflowsView is visible

    trigger:
      - workflows query state changes or user interacts with pagination controls

    mainFlow:
      - while query is loading, system shows projectWorkflowsLoadingState in resultsRegion
      - when query returns zero matching workflows, system shows projectWorkflowsEmptyState
      - when query fails, system shows projectWorkflowsErrorState
      - resultsRegion displays at most 10 workflowCard items per page in a 2-cards-per-row grid (maximum 5 rows)
      - pagination is shown only when total matching workflows are 11 or more and supports page navigation controls

    roleBehavior: {}

    acceptanceCriteria:
      - given loading query, projectWorkflowsLoadingState is visible
      - given successful query with zero workflows, projectWorkflowsEmptyState is visible and includes 'There are no workflows in this project'
      - given failed query, projectWorkflowsErrorState is visible
      - given successful query, at most 10 workflowCard items are visible in resultsRegion (2 cards per row, maximum 5 rows)
      - given total matching workflows are 11 or more, pagination is visible
      - given total matching workflows are fewer than 11, pagination is not visible
      - given user selects a different paginationPageNumberButton, resultsRegion updates for that page
      - given pagination is visible, paginationPreviousNextButton and paginationFirstLastButton navigate correctly

    openQuestions:
      - Confirm whether any project-workflows-specific empty-state copy beyond 'No results found' is required by product, or if generic empty copy remains canonical.

