# Normalized requirements: move an existing workflowNode within a workflowSectionContainer or to another workflowSectionContainer ('Workflow' view)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Node Actions — Add New Node to Workflow insert modes; Edges — "When Nodes are moved" rules at lines 1039–1044)
# Application code evidence: react/src/components/views/WorkflowView/WorkflowEditView/* (drag-and-drop infrastructure)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml (canonical Insert mode toggle and pre-drop visuals — FR-WF-ADD-002, FR-WF-ADD-004, FR-WF-ADD-005, FR-WF-ADD-006); tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (workflowView, workflowSectionContainer canonical definitions)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/workflow'
  - user has owner or editor role on the parent project
  - workflowView is open with at least one workflowSectionContainer that contains at least one workflowNode

