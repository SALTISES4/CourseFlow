requirements:
  - id: FR-WF-CREATE-STEPPER-001
    title: Open create workflow stepped dialog with eligible projects

    designEvidence:
      - FIGMA-WF-CREATE-STEP-1
      - FIGMA-WF-CREATE-STEP-2
      - FIGMA-WF-CREATE-STEP-3-BLANK
      - FIGMA-WF-CREATE-STEP-3-TEMPLATE

    actors:
      - owner
      - editor

    uiObjects:
      - createWorkflowDialog
      - createWorkflowDialogTitle
      - createWorkflowStepper
      - createWorkflowCancelButton
      - createWorkflowPreviousStepButton
      - createWorkflowNextStepButton
      - workflowProjectSearchView
      - workflowProjectSearchField
      - projectCard

    preconditions:
      - user clicks a workflow-create entry point
      - user has at least one project where user role is Owner or Editor

    trigger:
      - user clicks on workflow create entry point

    mainFlow:
      - system opens createWorkflowDialog
      - createWorkflowDialog renders createWorkflowStepper with three steps
      - initial step is project selection and createWorkflowDialogTitle matches 'Select project'
      - step-1 project search/list/ordering/selection behavior is defined in FR-WF-CREATE-STEPPER-003
      - createWorkflowCancelButton is visible
      - when user clicks createWorkflowCancelButton on any step of createWorkflowDialog, system closes createWorkflowDialog without creating a workflow and returns user to the page/route that was open before the dialog was triggered
      - createWorkflowPreviousStepButton is not visible on the first step
      - createWorkflowNextStepButton is visible with label 'Next step'; enablement rules are defined in FR-WF-CREATE-STEPPER-003

    roleBehavior:
      owner:
        createWorkflowDialog: available
      editor:
        createWorkflowDialog: available
      viewer:
        createWorkflowDialog: available
      commenter:
        createWorkflowDialog: available

    acceptanceCriteria:
      - given workflow-create preconditions, createWorkflowDialog is open and shows step 1 content
      - given step 1 is shown, workflowProjectSearchField, workflowProjectSearchView, projectCard, and createWorkflowNextStepButton behavior follows FR-WF-CREATE-STEPPER-003
      - given user clicks createWorkflowCancelButton from any step, createWorkflowDialog closes and current route matches the route that was active immediately before dialog open

    openQuestions: []

  - id: FR-WF-CREATE-STEPPER-002
    title: Open create workflow dialog with no eligible projects

    designEvidence:
      - FIGMA-WF-CREATE-NO-ELIGIBLE-PROJECT

    actors:
      - user

    uiObjects:
      - createWorkflowDialog
      - createWorkflowNoEligibleProjectsDialog
      - createProjectFromNoEligibleProjectsButton
      - createProjectDialog
      - createWorkflowCancelButton

    preconditions:
      - user clicks a workflow-create entry point (addMenuItemProgram, addMenuItemCourse, addMenuItemActivity)
      - user has no projects where user role is Owner or Editor

    trigger:
      - user clicks on workflow create entry point

    mainFlow:
      - system opens createWorkflowDialog
      - system shows createWorkflowNoEligibleProjectsDialog because there are no eligible destination projects for workflow creation
      - createProjectFromNoEligibleProjectsButton is visible with label 'Create project'
      - when user clicks createProjectFromNoEligibleProjectsButton, system opens createProjectDialog
      - createWorkflowCancelButton is visible and closes the dialog when clicked, returning user to the page/route that was open before createWorkflowDialog was triggered

    roleBehavior:
      owner:
        createWorkflowDialog: available
      editor:
        createWorkflowDialog: available
      viewer:
        createWorkflowDialog: available
      commenter:
        createWorkflowDialog: available

    acceptanceCriteria:
      - given workflow-create trigger and no projects with Owner or Editor role, createWorkflowNoEligibleProjectsDialog is shown
      - given createWorkflowNoEligibleProjectsDialog is shown, user sees primary action createProjectFromNoEligibleProjectsButton with label 'Create project'
      - given user clicks createProjectFromNoEligibleProjectsButton, createProjectDialog is open
      - given createWorkflowNoEligibleProjectsDialog is shown, user cannot proceed to workflow type selection until an eligible project exists

    openQuestions: []

  - id: FR-WF-CREATE-STEPPER-003
    title: Step 1 select destination project

    designEvidence:
      - FIGMA-WF-CREATE-STEP-1

    actors:
      - user

    uiObjects:
      - createWorkflowDialog
      - workflowProjectSearchView
      - workflowProjectSearchField
      - projectCard
      - createWorkflowNextStepButton

    preconditions:
      - createWorkflowDialog is open on step 1
      - workflowProjectSearchView has at least one visible projectCard

    trigger:
      - on projectCard is selected

    mainFlow:
      - workflowProjectSearchView lists projects where user has Owner or Editor role only
      - if user opened createWorkflowDialog while currently viewing a project route (/project/{id}) or a child workflow route under that project (/workflow/{id} with known parent project), and user has Owner or Editor role on that project, that current project appears first in the list and is preselected
      - if user opened createWorkflowDialog from a project or child workflow where user does not have Owner or Editor role on that project, that project is not included in the step-1 list
      - remaining listed projects are ordered by modified date from most recently modified to least recently modified
      - workflowProjectSearchField filters projects by title match
      - projectCard presentation and card interactions in workflowProjectSearchView conform to card_content_requirements_v1.yaml
      - workflowProjectSearchView shows at most 4 projectCard items; there is no pager on this step
      - system marks clicked projectCard as selected
      - createWorkflowNextStepButton becomes enabled
      - when user clicks createWorkflowNextStepButton, system advances createWorkflowStepper to step 2

    roleBehavior: {}

    acceptanceCriteria:
      - given user enters text in workflowProjectSearchField, visible projectCard items match project title search criteria
      - given user was not already in a project or child workflow context when opening dialog and has not selected a project on step 1, createWorkflowNextStepButton is disabled
      - given user was already in a project or child workflow context when opening dialog and user has Owner or Editor role on that current project, that project appears first and is preselected on step 1 and createWorkflowNextStepButton is enabled
      - given user was already in a project or child workflow context when opening dialog and user does not have Owner or Editor role on that current project, that current project is not displayed in workflowProjectSearchView
      - given step 1 is shown, workflowProjectSearchView displays at most 4 projectCard items and no pager is shown
      - given user clicks a projectCard, selected state is visible on that card
      - given a projectCard is selected, createWorkflowNextStepButton is enabled
      - given user clicks createWorkflowNextStepButton after project selection, step 2 is displayed

    openQuestions: []

  - id: FR-WF-CREATE-STEPPER-004
    title: Step 2 choose blank or template creation mode

    designEvidence:
      - FIGMA-WF-CREATE-STEP-2

    actors:
      - owner
      - editor

    uiObjects:
      - createWorkflowDialog
      - createWorkflowDialogTitle
      - workflowCreationModeBlankOption
      - workflowCreationModeTemplateOption
      - createWorkflowPreviousStepButton
      - createWorkflowNextStepButton

    preconditions:
      - createWorkflowDialog is open on step 2
      - a destination project is already selected from step 1
      - for the selected destination project, user role is Owner or Editor

    trigger:
      - user clicks workflowCreationModeBlankOption or workflowCreationModeTemplateOption

    mainFlow:
      - createWorkflowDialogTitle matches 'Select {workflowType} type'
      - step 2 presents both workflowCreationModeBlankOption and workflowCreationModeTemplateOption
      - step-2 option titles and descriptions use localized copy; literal text is not final and may change
      - when user clicks workflowCreationModeBlankOption, blank mode is selected for step 3
      - when user clicks workflowCreationModeTemplateOption, template mode is selected for step 3
      - createWorkflowPreviousStepButton is visible and returns user to step 1 when clicked
      - when user clicks createWorkflowNextStepButton, system advances to step 3 with content matching the selected mode

    roleBehavior:
      owner:
        workflowCreationModeBlankOption: selectable
        workflowCreationModeTemplateOption: selectable
      editor:
        workflowCreationModeBlankOption: selectable
        workflowCreationModeTemplateOption: selectable

    acceptanceCriteria:
      - given step 2 is reachable only after selecting an eligible project on step 1, user role on selected project is Owner or Editor
      - both creation-mode options are visible on step 2
      - createWorkflowDialogTitle matches 'Select {workflowType} type'
      - step-2 option titles and descriptions remain localized and non-final; assertions should not require fixed English literals for option copy
      - clicking createWorkflowPreviousStepButton from step 2 returns to step 1
      - clicking createWorkflowNextStepButton from step 2 opens step 3 variant for the selected mode

    openQuestions: []

  - id: FR-WF-CREATE-STEPPER-005
    title: Step 3 blank workflow form and submit outcome

    designEvidence:
      - FIGMA-WF-CREATE-STEP-3-BLANK

    actors:
      - owner
      - editor

    uiObjects:
      - createWorkflowDialog
      - createWorkflowDialogTitle
      - workflowBlankForm
      - workflowTitleField
      - workflowDescriptionField
      - createWorkflowCancelButton
      - createWorkflowPreviousStepButton
      - createWorkflowSubmitButton
      - workflowViewWorkflow
      - globalMessageSnackbar

    preconditions:
      - createWorkflowDialog is open on step 3
      - blank mode was selected at step 2
      - destination project is selected from step 1
      - for the selected destination project, user role is Owner or Editor

    trigger:
      - user edits workflowBlankForm and clicks createWorkflowSubmitButton

    mainFlow:
      - createWorkflowDialogTitle follows pattern 'Create blank {workflowType}'
      - workflowBlankForm is rendered
      - workflowBlankForm metadata fields do not differ by workflow type
      - workflowTitleField is required
      - workflowDescriptionField is optional
      - createWorkflowSubmitButton is disabled until workflowTitleField is filled
      - when user clicks createWorkflowPreviousStepButton, system returns to step 2 with the previously selected destination project preserved
      - when user clicks createWorkflowCancelButton, system closes createWorkflowDialog without creating a workflow and returns user to the page/route that was open before createWorkflowDialog was triggered
      - when submit succeeds, system creates workflow in selected project, closes createWorkflowDialog, navigates to workflowViewWorkflow route pattern /workflow/{id}, and shows success feedback in globalMessageSnackbar with copy 'Your [workflow type] has been successfully created'
      - for a newly created workflow initial overview state, workflowMetadataSwitchCalculateTimeAutomatically defaults to OFF
      - for a newly created program workflow initial overview state, workflowMetadataSwitchCalculatePonderationAutomatically defaults to OFF
      - for a newly created program workflow initial overview state, workflowMetadataSwitchCalculateCreditsAutomatically defaults to OFF
      - for a newly created program workflow initial overview state, workflowMetadataSwitchCalculateClassificationAutomatically defaults to OFF
      - when submit fails, createWorkflowDialog remains open and system shows error feedback in globalMessageSnackbar with copy 'We encountered an issue and your [workflow type] was not created'

    roleBehavior:
      owner:
        createWorkflowSubmitButton: available
      editor:
        createWorkflowSubmitButton: available

    acceptanceCriteria:
      - given step 3 blank mode is reachable only after selecting an eligible project on step 1, user role on selected project is Owner or Editor
      - given blank mode on step 3 and no form change, createWorkflowSubmitButton is disabled
      - given workflowBlankForm has unsaved change and validation passes, createWorkflowSubmitButton is enabled
      - given user clicks createWorkflowPreviousStepButton on step 3 blank mode, dialog returns to step 2 and keeps previously selected destination project
      - given user clicks createWorkflowCancelButton on step 3 blank mode, createWorkflowDialog closes, no workflow is created, and current route matches the route active before dialog open
      - given blank-mode submit succeeds, current route matches /workflow/{id}
      - given blank-mode submit succeeds and user opens the new workflow overview, workflowMetadataSwitchCalculateTimeAutomatically is OFF by default
      - given blank-mode submit succeeds for program workflow and user opens overview, workflowMetadataSwitchCalculatePonderationAutomatically is OFF by default
      - given blank-mode submit succeeds for program workflow and user opens overview, workflowMetadataSwitchCalculateCreditsAutomatically is OFF by default
      - given blank-mode submit succeeds for program workflow and user opens overview, workflowMetadataSwitchCalculateClassificationAutomatically is OFF by default
      - given blank-mode submit succeeds, globalMessageSnackbar copy matches 'Your [workflow type] has been successfully created'
      - given blank-mode submit fails, globalMessageSnackbar copy matches 'We encountered an issue and your [workflow type] was not created'
      - given blank-mode submit succeeds and user opens workflowView on the 'Workflow' sub-view, workflowChannelsHeaderRow lists the predefined default workflowChannels (titles and colours) for the created workflow type per tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml FR-WF-ADD-003 and tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml FR-CHAN-002

    openQuestions: []

  - id: FR-WF-CREATE-STEPPER-006
    title: Step 3 template selection and template-based creation intent

    designEvidence:
      - FIGMA-WF-CREATE-STEP-3-TEMPLATE

    actors:
      - user

    uiObjects:
      - createWorkflowDialog
      - createWorkflowDialogTitle
      - workflowTemplateSearchView
      - workflowTemplateSearchField
      - workflowCard
      - createWorkflowCancelButton
      - createWorkflowPreviousStepButton
      - createWorkflowSubmitButton
      - workflowViewWorkflow
      - globalMessageSnackbar

    preconditions:
      - createWorkflowDialog is open on step 3
      - template mode was selected at step 2
      - destination project is selected from step 1
      - for the selected destination project, user role is Owner or Editor

    trigger:
      - user clicks workflowCard and clicks createWorkflowSubmitButton

    mainFlow:
      - createWorkflowDialogTitle follows pattern 'Create {workflowType} from a template'
      - workflowTemplateSearchView is rendered with workflowTemplateSearchField
      - workflowTemplateSearchView displays a list of template workflowCard options filtered strictly by selected workflowType and template flag
      - workflowCard presentation and card interactions in workflowTemplateSearchView conform to card_content_requirements_v1.yaml
      - workflowTemplateSearchView displays at most 4 workflowCard template options
      - workflowTemplateSearchField filters visible workflowCard template options by title match
      - createWorkflowSubmitButton remains disabled until a workflowCard is selected
      - when user clicks createWorkflowPreviousStepButton, system returns to step 2 with the previously selected destination project preserved
      - when user clicks createWorkflowCancelButton, system closes createWorkflowDialog without creating a workflow and returns user to the page/route that was open before createWorkflowDialog was triggered
      - selected template is copied into the selected project as a new workflow, with predefined sections, channels, nodes, and node edges already present in the new workflow
      - on successful template-based create, system navigates to workflowViewWorkflow route pattern /workflow/{id} and shows success feedback in globalMessageSnackbar
      - for a newly created workflow initial overview state, workflowMetadataSwitchCalculateTimeAutomatically defaults to OFF
      - for a newly created program workflow initial overview state, workflowMetadataSwitchCalculatePonderationAutomatically defaults to OFF
      - for a newly created program workflow initial overview state, workflowMetadataSwitchCalculateCreditsAutomatically defaults to OFF
      - for a newly created program workflow initial overview state, workflowMetadataSwitchCalculateClassificationAutomatically defaults to OFF
      - on template-based create failure, system shows error feedback in globalMessageSnackbar

    roleBehavior:
      owner:
        workflowCard: selectable
        createWorkflowSubmitButton: available
      editor:
        workflowCard: selectable
        createWorkflowSubmitButton: available

    acceptanceCriteria:
      - given step 3 template mode is reachable only after selecting an eligible project on step 1, user role on selected project is Owner or Editor
      - given template mode on step 3, workflowTemplateSearchField is visible
      - given template mode on step 3, workflowCard in workflowTemplateSearchView conforms to card_content_requirements_v1.yaml
      - given template mode on step 3, workflowTemplateSearchView displays at most 4 workflowCard template options that match selected workflowType
      - given user enters text in workflowTemplateSearchField, visible workflowCard template options match title search criteria within the selected workflowType
      - given template mode on step 3 and no selected workflowCard, createWorkflowSubmitButton is disabled
      - given template mode on step 3 and selected workflowCard, createWorkflowSubmitButton is enabled
      - given user clicks createWorkflowPreviousStepButton on step 3 template mode, dialog returns to step 2 and keeps previously selected destination project
      - given user clicks createWorkflowCancelButton on step 3 template mode, createWorkflowDialog closes, no workflow is created, and current route matches the route active before dialog open
      - given template mode on step 3, workflowTemplateSearchView results include only templates matching selected workflowType
      - given successful template-based create, current route matches /workflow/{id}
      - given successful template-based create and user opens the new workflow overview, workflowMetadataSwitchCalculateTimeAutomatically is OFF by default
      - given successful template-based create for program workflow and user opens overview, workflowMetadataSwitchCalculatePonderationAutomatically is OFF by default
      - given successful template-based create for program workflow and user opens overview, workflowMetadataSwitchCalculateCreditsAutomatically is OFF by default
      - given successful template-based create for program workflow and user opens overview, workflowMetadataSwitchCalculateClassificationAutomatically is OFF by default
      - given successful template-based create, opened workflow includes template-derived predefined sections, channels, nodes, and node edges
      - given template-based create failure, globalMessageSnackbar shows error feedback

    openQuestions: []

