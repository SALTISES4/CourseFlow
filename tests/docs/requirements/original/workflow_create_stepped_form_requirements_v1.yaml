# Normalized requirements: create workflow stepped form
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Workflows, Templates; especially "When creating a workflow within a Project, users get prompted to start from a template instead of starting from scratch" and template-copy behavior)
# Application code evidence: react/src/components/common/dialog/Workflow/CreateWizardDialog/*
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: workflow-create entry points — tests/docs/requirements/original/top_navigation_requirements_v1.yaml (FR-TOP-002: addMenuItemProgram, addMenuItemCourse, addMenuItemActivity); tests/docs/requirements/original/homepage_requirements_v1.yaml (FR-HOME-002: homeWelcomeProgramButton, homeWelcomeCourseButton, homeWelcomeActivityButton); shared card content in tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard and workflowCard in this dialog — FR-CARD-001 through FR-CARD-005 as applicable); edit workflow metadata dialog in tests/docs/requirements/original/workflow_edit_form_requirements_v1.yaml (FR-WF-FORM-001); workflowDescriptionField rich-text editor contract in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-012; default workflowChannel sets at blank create — tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml FR-WF-ADD-003 and tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml FR-CHAN-002; initial workflowSectionContainer at blank create — tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml (workflowSectionContainer); template Overview metadata copy — tests/docs/requirements/original/workflow_overview_requirements_v1.yaml FR-WF-OV-009

documentPreconditions:
  - user is authenticated to CourseFlow
  - createWorkflowDialog is opened from a workflow-create entry point per this file's cross-references (FR-TOP-002, FR-HOME-002)
  - opening createWorkflowDialog is not gated by project membership role; any authenticated user may trigger it from those entry points
  - destination project eligibility (owner or editor on that project) is enforced at step 1 only per FR-WF-CREATE-STEPPER-003
  - created workflows must be associated with a project (no standalone workflow entity)

uiObjectDefinitions:
  createWorkflowDialog:
    meaning: Modal dialog for creating a new workflow via the stepped form.
  createWorkflowDialogTitle:
    meaning: Title region of createWorkflowDialog that changes by current step and selected workflow type.
  createWorkflowStepper:
    meaning: Step indicator strip at the top of createWorkflowDialog.
  createWorkflowCancelButton:
    meaning: Cancel action in createWorkflowDialog footer.
  createWorkflowPreviousStepButton:
    meaning: Previous-step action in createWorkflowDialog footer.
  createWorkflowNextStepButton:
    meaning: Primary forward action in createWorkflowDialog footer before the final step.
  createWorkflowSubmitButton:
    meaning: Primary submit action in createWorkflowDialog footer on the final step.
  workflowProjectSearchView:
    meaning: Project selection surface rendered at step 1, listing project cards and allowing project selection.
  workflowProjectSearchField:
    meaning: Search input on step 1 used to filter project list by project title.
  workflowProjectSearchEmptyState:
    meaning: Empty-results region in workflowProjectSearchView.
  projectCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  createWorkflowNoEligibleProjectsDialog:
    meaning: Warning region on createWorkflowDialog step 1 when no eligible destination project exists.
  workflowCreationModeBlankOption:
    meaning: Selectable option in step 2 for creating a blank workflow structure.
  workflowCreationModeTemplateOption:
    meaning: Selectable option in step 2 for creating from a template.
  workflowBlankForm:
    meaning: Blank-workflow metadata form used in createWorkflowDialog.
  workflowTitleField:
    meaning: Text input for workflow title; required; label 'Title'.
  workflowDescriptionField:
    meaning: Description field region on workflowBlankForm and workflowEditForm; optional; visible label matches workflow type (e.g. 'Activity description'); contains workflowRichTextDescriptionEditor per tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml FR-WF-EN-012.
  workflowTemplateSearchView:
    meaning: Template selection surface shown on step 3 when template mode is selected.
  workflowTemplateSearchField:
    meaning: Search input in workflowTemplateSearchView.
  workflowTemplateSearchEmptyState:
    meaning: Empty-results region in workflowTemplateSearchView.
  workflowCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_section_requirements_v1.yaml.
  workflowChannelsHeaderRow:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml.
  workflowNode:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml.
  workflowEdge:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edge_requirements_v1.yaml.
  workflowOverviewView:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_overview_requirements_v1.yaml.
  workflowTitle:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_header_requirements_v1.yaml.
  globalMessageSnackbar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_header_requirements_v1.yaml.

