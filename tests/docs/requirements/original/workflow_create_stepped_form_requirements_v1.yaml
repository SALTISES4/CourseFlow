# Normalized requirements: create workflow stepped form
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Workflows, Templates; especially "When creating a workflow within a Project, users get prompted to start from a template instead of starting from scratch" and template-copy behavior)
# Application code evidence: react/src/components/common/dialog/Workflow/CreateWizardDialog/*
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: add-menu entry points in tests/docs/requirements/original/top_navigation_requirements_v1.yaml (FR-TOP-002); shared card content in tests/docs/requirements/original/card_content_requirements_v1.yaml (projectCard and workflowCard in this dialog — FR-CARD-001 through FR-CARD-005 as applicable); edit workflow metadata dialog in tests/docs/requirements/original/workflow_edit_form_requirements_v1.yaml (FR-WF-FORM-001); default workflowChannel sets at blank create — tests/docs/requirements/original/workflow_add_tab_requirements_v1.yaml FR-WF-ADD-003 and tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml FR-CHAN-002

documentPreconditions:
  - user is authenticated to CourseFlow
  - createWorkflowDialog can be triggered from anywhere in the application via workflow-create entry points (user may or may not currently be viewing a project context)
  - created workflows must be associated with a project (no standalone workflow entity)

uiObjectDefinitions:
  createWorkflowDialog:
    meaning: Modal dialog for creating a new workflow via the stepped form.
  createWorkflowDialogTitle:
    meaning: Title region of createWorkflowDialog that changes by current step and selected workflow type.
  createWorkflowStepper:
    meaning: Step indicator strip at the top of createWorkflowDialog.
  createWorkflowCancelButton:
    meaning: Cancel action on createWorkflowDialog that closes the dialog without creating a workflow.
  createWorkflowPreviousStepButton:
    meaning: Action button that navigates to the previous step in createWorkflowDialog; hidden on first step
  createWorkflowNextStepButton:
    meaning: Primary action button used to advance from step 1 or step 2; label 'Next step' before final step.
  createWorkflowSubmitButton:
    meaning: Primary action button on the final step; label follows 'Create {workflowType}'
  workflowProjectSearchView:
    meaning: Project selection surface rendered at step 1, listing project cards and allowing project selection.
  workflowProjectSearchField:
    meaning: Search input on step 1 used to filter project list by project title.
  projectCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  createWorkflowNoEligibleProjectsDialog:
    meaning: Modal shown when no eligible parent project exists for workflow creation.
  createProjectFromNoEligibleProjectsButton:
    meaning: Create-project action on createWorkflowNoEligibleProjectsDialog.
  createProjectDialog:
    meaning: Canonical definition in tests/docs/requirements/original/project_create_edit_form_requirements_v1.yaml.
  workflowCreationModeBlankOption:
    meaning: Selectable option in step 2 for creating a blank workflow structure.
  workflowCreationModeTemplateOption:
    meaning: Selectable option in step 2 for creating from a template.
  workflowBlankForm:
    meaning: Blank-workflow metadata form used in createWorkflowDialog.
  workflowTitleField:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_form_requirements_v1.yaml.
  workflowDescriptionField:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_edit_form_requirements_v1.yaml.
  workflowTemplateSearchView:
    meaning: Template selection surface shown on step 3 when template mode is selected.
  workflowTemplateSearchField:
    meaning: Search input in workflowTemplateSearchView.
  workflowCard:
    meaning: Canonical definition in tests/docs/requirements/original/card_content_requirements_v1.yaml.
  workflowViewWorkflow:
    meaning: "'Workflow' view of the Workflow, at route pattern /workflow/{id}."
  globalMessageSnackbar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_header_requirements_v1.yaml.

