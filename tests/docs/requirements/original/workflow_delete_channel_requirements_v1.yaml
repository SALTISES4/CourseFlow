requirements:
  - id: FR-CHAN-006
    title: Delete channel

    designEvidence:
      - FIGMA-CHAN-OE-HOVER
      - FIGMA-CHAN-OE-EDIT
      - FIGMA-CHAN-DEL-WARN

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowChannelsHeaderRow
      - workflowChannelHeader
      - workflowChannelHoverActionsMenu
      - workflowChannelHoverActionsMenuDeleteItem
      - workflowRightSidebar
      - workflowEditChannelForm
      - workflowEditChannelFormDeleteButton
      - workflowChannelDeleteDialog
      - workflowChannelDeleteDialogCancelButton
      - workflowChannelDeleteDialogConfirmButton
      - workflowNode
      - workflowEdge

    preconditions:
      - workflowView contains a target workflowChannel in workflowChannelsHeaderRow
      - when workflowChannelsHeaderRow contains exactly one workflowChannel, workflowChannelHoverActionsMenuDeleteItem is inactive and workflowEditChannelFormDeleteButton is readOnly for every actor for whom those controls are rendered
      - when workflowChannelsHeaderRow contains at least two workflowChannels, for the hover-menu path, workflowChannelHoverActionsMenuDeleteItem is active for the actor per this FR roleBehavior and FR-CHAN-007 lockstep with FR-WF-NODE-005 in tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml
      - when workflowChannelsHeaderRow contains at least two workflowChannels, for the sidebar path, workflowEditChannelFormDeleteButton is active for the actor per this FR roleBehavior

    trigger:
      - user clicks workflowChannelHoverActionsMenuDeleteItem on workflowChannelHoverActionsMenu visible on workflowChannelHeader hover
      - user clicks workflowEditChannelFormDeleteButton on workflowEditChannelForm in workflowRightSidebar

    mainFlow:
      - when workflowChannelsHeaderRow contains exactly one workflowChannel, workflowChannelHoverActionsMenuDeleteItem is inactive and workflowEditChannelFormDeleteButton is readOnly for every actor for whom those controls are rendered (overrides active on both delete controls in roleBehavior below for owner and editor); workflowChannelDeleteDialog does not open from either entry path
      - when workflowChannelsHeaderRow contains at least two workflowChannels, delete control actionability follows roleBehavior below; system identifies the target workflowChannel from workflowChannelHoverActionsMenuDeleteItem on that channel's workflowChannelHeader, or from workflowEditChannelForm open in workflowRightSidebar for that workflowChannel
      - when workflowChannelsHeaderRow contains at least two workflowChannels and the actor clicks an active workflowChannelHoverActionsMenuDeleteItem or an active workflowEditChannelFormDeleteButton per roleBehavior, system opens workflowChannelDeleteDialog for either entry path
      - workflowChannelDeleteDialog body warns that deleting the node category will delete all associated nodes
      - if user clicks workflowChannelDeleteDialogCancelButton, workflowChannelDeleteDialog closes and workflowView is unchanged (target workflowChannel, its assigned workflowNodes, workflowEdges, and channel order unchanged)
      - if user clicks workflowChannelDeleteDialogConfirmButton, system removes the target workflowChannel from workflowChannelsHeaderRow and removes every workflowNode assigned to that workflowChannel from every workflowSectionContainer; every workflowEdge whose source or target was a removed workflowNode is removed

    roleBehavior:
      owner:
        workflowChannelHoverActionsMenuDeleteItem: active
        workflowEditChannelFormDeleteButton: active
      editor:
        workflowChannelHoverActionsMenuDeleteItem: active
        workflowEditChannelFormDeleteButton: active
      commenter:
        workflowChannelHoverActionsMenuDeleteItem: readOnly
        workflowEditChannelFormDeleteButton: readOnly
      viewer:
        workflowChannelHoverActionsMenuDeleteItem: notRendered
        workflowEditChannelFormDeleteButton: readOnly
      user:
        workflowChannelHoverActionsMenuDeleteItem: notRendered
        workflowEditChannelFormDeleteButton: readOnly

    acceptanceCriteria:
      - given workflowChannelsHeaderRow contains exactly one workflowChannel and actor is owner or editor, workflowChannelHoverActionsMenuDeleteItem is inactive, workflowEditChannelFormDeleteButton is readOnly, workflowChannelDeleteDialog does not open from either entry path, and that workflowChannel remains in workflowView
      - given workflowChannelsHeaderRow contains exactly one workflowChannel and actor is commenter with workflowChannelHoverActionsMenu visible per FR-CHAN-007, workflowChannelHoverActionsMenuDeleteItem is inactive and workflowEditChannelFormDeleteButton is readOnly
      - given workflowChannelDeleteDialog is open, target workflowChannel is not removed until user clicks workflowChannelDeleteDialogConfirmButton
      - when user clicks workflowChannelDeleteDialogCancelButton, workflowChannelDeleteDialog closes and workflowView is unchanged
      - given workflowChannelsHeaderRow contains at least two workflowChannels and confirmed delete via workflowChannelDeleteDialogConfirmButton labeled 'Delete node category', target workflowChannel is removed from workflowChannelsHeaderRow, at least one workflowChannel remains, no workflowNode remains assigned to the deleted channel in any workflowSectionContainer, and no workflowEdge references a removed workflowNode
      - given workflowChannelsHeaderRow contains at least two workflowChannels and actor is commenter with workflowChannelHoverActionsMenu visible per FR-CHAN-007, workflowChannelHoverActionsMenuDeleteItem is readOnly and workflowChannelDeleteDialog does not open when that control is clicked
      - given actor is viewer or user (published-access), workflowChannelHoverActionsMenu is not rendered on workflowChannelHeader hover per FR-CHAN-007 lockstep with FR-WF-NODE-004, so workflowChannelHoverActionsMenuDeleteItem is not reachable and workflowChannelDeleteDialog cannot be opened via the hover path

    openQuestions:
      - workflowEditChannelFormDeleteButton is rendered without onClick in react/src/components/pages/Workspace/Workflow/Sidebar/components/EditTab/components/EditColumn/index.tsx — confirm intended sidebar delete entry path wiring before tests target that path.
      - Confirm backend/redux cascade when columnDeleteSelf runs — current column.slice deleteSelf removes the channel entity from workflow.columns order only; verify whether orphaned workflowNodes are purged server-side or requires additional reducer logic before automated tests assert node-and-edge removal on confirm.
      - When workflowChannelsHeaderRow contains exactly one workflowChannel, implement inactive on workflowChannelHoverActionsMenuDeleteItem and readOnly on workflowEditChannelFormDeleteButton per this FR; no sole-channel guard found in ColumnsHeader/HoverMenu or EditColumn in current code.

