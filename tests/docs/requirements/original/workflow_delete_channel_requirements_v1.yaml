# Normalized requirements: delete an existing workflowChannel ('Workflow' view)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Channels ▸ Delete — lines 969–970)
# Application code evidence: react/src/components/views/WorkflowView/WorkflowEditView/components/ColumnsHeader/Cell/HoverMenu/index.tsx; react/src/components/common/dialog/Workflow/DeleteNodeCategory/index.tsx; react/src/redux/slices/column.slice.ts (columnDeleteSelf)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/original/workflow_edit_channel_requirements_v1.yaml (canonical channel uiObjects including workflowChannelDeleteDialog*, workflowChannelHoverActionsMenuDeleteItem, workflowEditChannelFormDeleteButton; FR-CHAN-001, FR-CHAN-007); tests/docs/requirements/original/workflow_duplicate_channel_requirements_v1.yaml (duplicate channel — FR-CHAN-005)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/workflow'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflow always retains at least one workflowChannel; deleting the sole remaining channel is not permitted (FR-CHAN-006)

