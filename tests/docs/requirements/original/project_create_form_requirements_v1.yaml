# Normalized requirements: create project form (modal)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Project, Project Metadata spreadsheet reference, Discipline field)
# Application code: shared ProjectForm in create and edit project dialogs (current implementation)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: createProjectDialog and add menu entry in tests/docs/requirements/original/top_navigation_requirements_v1.yaml (FR-TOP-002); edit project dialog in tests/docs/requirements/original/project_edit_form_requirements_v1.yaml (FR-PROJ-FORM-003); shared projectForm field definitions and createProjectFormDialogTitle/createProjectFormSubmitButton owned here; editProjectFormDialogTitle/editProjectFormSubmitButton owned in edit file

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  addMenuItemProject:
    meaning: Canonical definition in tests/docs/requirements/original/top_navigation_requirements_v1.yaml.
  createProjectDialog:
    meaning: Modal dialog for creating a project
  projectForm:
    meaning: Form for project metadata and submit actions within a project dialog.
  projectStartWithProjectAlert:
    meaning: Onboarding alert above project fields in createProjectDialog.
  createProjectFormDialogTitle:
    meaning: Dialog title on createProjectDialog.
  projectTitleField:
    meaning: Text input for project title; label 'Title'; edits the same project title metadata displayed as projectTitle in projectHeader per tests/docs/requirements/original/project_header_requirements_v1.yaml FR-PROJ-HEADER-001.
  projectTitle:
    meaning: Canonical definition in tests/docs/requirements/original/project_header_requirements_v1.yaml.
  projectDescriptionField:
    meaning: Text input for project description; label 'Description'.
  projectDisciplineField:
    meaning: Multi-select control for zero or more project disciplines; label 'Disciplines'.
  projectFormCancelButton:
    meaning: Secondary cancel action on projectForm; label 'Cancel'.
  createProjectFormSubmitButton:
    meaning: Primary submit action on projectForm in createProjectDialog.
  projectFormFieldValidationMessage:
    meaning: Inline helper or error text for a field when validation fails.
  globalMessageSnackbar:
    meaning: Canonical definition in tests/docs/requirements/original/workflow_header_requirements_v1.yaml.

locatorMappings:
  addMenuItemProject: "canonical_locators.yaml -> addMenuItemProject"
  createProjectDialog: "canonical_locators.yaml -> createProjectDialog"
  projectForm: "canonical_locators.yaml -> projectForm"
  createProjectFormDialogTitle: "canonical_locators.yaml -> createProjectFormDialogTitle"
  projectTitleField: "canonical_locators.yaml -> projectTitleField"
  projectTitle: "canonical_locators.yaml -> projectTitle"
  projectDescriptionField: "canonical_locators.yaml -> projectDescriptionField"
  projectDisciplineField: "canonical_locators.yaml -> projectDisciplineField"
  projectFormCancelButton: "canonical_locators.yaml -> projectFormCancelButton"
  createProjectFormSubmitButton: "canonical_locators.yaml -> createProjectFormSubmitButton"
  projectFormFieldValidationMessage: "canonical_locators.yaml -> projectFormFieldValidationMessage"
  globalMessageSnackbar: "canonical_locators.yaml -> globalMessageSnackbar"
  projectStartWithProjectAlert: "canonical_locators.yaml -> projectStartWithProjectAlert"

requirements:
  - id: FR-PROJ-FORM-001
    title: Create project dialog layout and primary fields

    designEvidence:
      - FIGMA-PROJ-CREATE

    actors:
      - user

    uiObjects:
      - addMenuItemProject
      - createProjectDialog
      - projectForm
      - createProjectFormDialogTitle
      - projectTitleField
      - projectDescriptionField
      - projectDisciplineField
      - projectFormCancelButton
      - createProjectFormSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - addMenuItemProject is visible per FR-TOP-002 in tests/docs/requirements/original/top_navigation_requirements_v1.yaml

    trigger:
      - user clicks addMenuItemProject
      - user clicks projectFormCancelButton while createProjectDialog is open

    mainFlow:
      - system opens createProjectDialog
      - createProjectDialog presents projectForm with createProjectFormDialogTitle 'Create project'
      - projectForm presents projectTitleField, projectDescriptionField, and projectDisciplineField with visible labels 'Title', 'Description', and 'Disciplines'
      - projectDisciplineField selectable options conform to acceptanceCriteria for this FR
      - projectForm presents projectFormCancelButton and createProjectFormSubmitButton with label 'Create project'
      - given createProjectDialog is open with default empty values and no field has been changed, createProjectFormSubmitButton is disabled and not clickable
      - createProjectFormSubmitButton enablement after field changes follows FR-PROJ-FORM-004
      - given user clicks projectFormCancelButton while createProjectDialog is open, cancel behavior conforms to acceptanceCriteria for this FR

    roleBehavior: {}

    acceptanceCriteria:
      - createProjectDialog is open
      - createProjectFormDialogTitle matches 'Create project'
      - projectTitleField is visible with label 'Title'
      - projectDescriptionField is visible with label 'Description'
      - projectDisciplineField is visible with label 'Disciplines'
      - given createProjectDialog is open per trigger, projectTitleField and projectDescriptionField are empty
      - given createProjectDialog is open per trigger, projectDisciplineField has no selected disciplines
      - projectDisciplineField selectable options are exactly 'Anthropology', 'Business', 'Chemistry', 'Computer Science', 'Design', 'Economics', 'Engineering', 'Environmental Science', 'Geography', 'History', 'Humanities', 'Languages', 'Law', 'Literature', 'Mathematics', 'Medicine', 'Nursing', 'Other', 'Performing Arts', 'Philosophy', 'Physics', 'Political Science', 'Psychology', 'Science (General)', 'Social Sciences (General)', 'Social Work', 'Sociology', 'Theology', and 'Visual Arts' in that order
      - projectFormCancelButton is visible with label 'Cancel'
      - createProjectFormSubmitButton is visible with label 'Create project'
      - given createProjectDialog is open with no field changes, createProjectFormSubmitButton is disabled and not clickable
      - createProjectFormSubmitButton enablement after field changes conforms to FR-PROJ-FORM-004
      - given user clicks projectFormCancelButton while createProjectDialog is open with no field changes, createProjectDialog closes, no project was created, and current route is unchanged from immediately before opening createProjectDialog
      - given user clicks projectFormCancelButton while createProjectDialog is open after changing projectForm fields, createProjectDialog closes and no project was created
      - given user clicks projectFormCancelButton while createProjectDialog is open after changing projectForm fields, then opens createProjectDialog again via addMenuItemProject, projectTitleField and projectDescriptionField are empty and projectDisciplineField has no selected disciplines

    openQuestions: []

  - id: FR-PROJ-FORM-002
    title: Create project new-user onboarding alert

    designEvidence:
      - FIGMA-PROJ-CREATE
      - FIGMA-PROJ-CREATE-NEW-USERS

    actors:
      - user

    uiObjects:
      - createProjectDialog
      - projectForm
      - projectStartWithProjectAlert

    preconditions:
      - documentPreconditions for this file hold
      - createProjectDialog is open per FR-PROJ-FORM-001

    trigger:
      - createProjectDialog opens per FR-PROJ-FORM-001

    mainFlow:
      - on createProjectDialog open per trigger, given user is not owner of any project, projectStartWithProjectAlert is visible above project fields in createProjectDialog with title 'Start by creating a project' and subtitle 'All workflows, whether they are programs, courses, or activities, exist within projects. You must start by creating a project before proceeding to create any type of workflow.'
      - on createProjectDialog open per trigger, given user is owner of at least one project, projectStartWithProjectAlert is not visible in createProjectDialog

    roleBehavior: {}

    acceptanceCriteria:
      - given user is not owner of any project, projectStartWithProjectAlert is visible with title 'Start by creating a project' and subtitle 'All workflows, whether they are programs, courses, or activities, exist within projects. You must start by creating a project before proceeding to create any type of workflow.'
      - given user is owner of at least one project, projectStartWithProjectAlert is not visible

    openQuestions: []

  - id: FR-PROJ-FORM-004
    title: Create project form inline title validation

    designEvidence:
      - FIGMA-PROJ-CREATE

    actors:
      - user

    uiObjects:
      - createProjectDialog
      - projectForm
      - projectTitleField
      - projectDescriptionField
      - projectDisciplineField
      - projectFormFieldValidationMessage
      - createProjectFormSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - projectForm is visible
      - createProjectDialog is open per FR-PROJ-FORM-001

    trigger:
      - user edits projectTitleField, projectDescriptionField, or projectDisciplineField

    mainFlow:
      - projectTitleField requires a non-empty value and a maximum of 200 characters
      - projectTitleField uses inline validation; createProjectFormSubmitButton stays disabled and not clickable until projectTitleField satisfies these rules and user has changed at least one field in projectForm per FR-PROJ-FORM-001
      - given projectTitleField is empty and user has changed at least one field in projectForm, projectTitleField shows projectFormFieldValidationMessage with text 'Project title cannot be empty' and createProjectFormSubmitButton is disabled and not clickable
      - given projectTitleField value exceeds 200 characters, projectTitleField shows projectFormFieldValidationMessage with text 'Project title cannot be longer than 200 characters' and createProjectFormSubmitButton is disabled and not clickable
      - given projectTitleField is non-empty and at most 200 characters, projectTitleField does not show projectFormFieldValidationMessage for empty or length rules
      - projectDescriptionField may be empty; there is no maximum character length and validation must not reject description solely for length
      - projectDisciplineField is optional; empty selection is valid and must not trigger required-field validation for disciplines; there is no maximum number of selected disciplines
      - createProjectDialog remains open while projectFormFieldValidationMessage is visible for projectTitleField validation errors

    roleBehavior: {}

    acceptanceCriteria:
      - given projectTitleField is empty and user has changed at least one field in projectForm, projectFormFieldValidationMessage is visible for projectTitleField with text 'Project title cannot be empty' and createProjectFormSubmitButton is disabled and not clickable
      - given projectTitleField value exceeds 200 characters, projectFormFieldValidationMessage is visible for projectTitleField with text 'Project title cannot be longer than 200 characters' and createProjectFormSubmitButton is disabled and not clickable
      - given projectTitleField is non-empty and at most 200 characters, projectTitleField does not show projectFormFieldValidationMessage for empty or length rules
      - validation does not fail solely because projectDescriptionField exceeds a character limit (no maximum length)
      - validation does not fail solely because projectDisciplineField exceeds a selection count (no maximum number of selected options)
      - given projectDisciplineField has no selection, validation does not treat disciplines as required and does not block submit solely for empty disciplines
      - given user has changed at least one field in projectForm and projectTitleField is non-empty and at most 200 characters, createProjectFormSubmitButton is enabled and clickable
      - given projectFormFieldValidationMessage is visible for projectTitleField, createProjectDialog remains open

    openQuestions: []

  - id: FR-PROJ-FORM-005
    title: Create project save behavior and feedback

    designEvidence:
      - FIGMA-PROJ-CREATE

    actors:
      - user

    uiObjects:
      - createProjectDialog
      - projectForm
      - projectTitleField
      - projectDescriptionField
      - projectDisciplineField
      - createProjectFormSubmitButton
      - projectTitle
      - globalMessageSnackbar

    preconditions:
      - documentPreconditions for this file hold
      - createProjectDialog is open per FR-PROJ-FORM-001
      - projectForm is visible
      - createProjectFormSubmitButton is enabled and clickable
      - projectForm satisfies inline title validation rules per FR-PROJ-FORM-004

    trigger:
      - user clicks createProjectFormSubmitButton

    mainFlow:
      - given user clicks createProjectFormSubmitButton and create submit succeeds, system creates project with title, description, and disciplines matching values from projectTitleField, projectDescriptionField, and projectDisciplineField immediately before submit, closes createProjectDialog, navigates to route pattern '/project/{id}' for the new project id, and globalMessageSnackbar shows 'Your project has been successfully created'
      - given user clicks createProjectFormSubmitButton and create submit does not complete successfully, createProjectDialog remains open, no project was created, projectTitleField, projectDescriptionField, and projectDisciplineField retain values from immediately before submit, createProjectFormSubmitButton is enabled and clickable, and globalMessageSnackbar shows 'We encountered an issue and your project was not created'

    roleBehavior: {}

    acceptanceCriteria:
      - given successful create submit, createProjectDialog closes
      - given successful create submit, project was created
      - given successful create submit, created project title matches projectTitleField value from immediately before submit
      - given successful create submit, projectTitle on projectHeader matches projectTitleField value from immediately before submit
      - given successful create submit, created project description matches projectDescriptionField value from immediately before submit
      - given successful create submit, created project disciplines match projectDisciplineField selection from immediately before submit
      - given successful create submit, current route matches route pattern '/project/{id}' for the created project id
      - given successful create submit, globalMessageSnackbar shows 'Your project has been successfully created'
      - given create submit does not complete successfully, createProjectDialog remains open
      - given create submit does not complete successfully, projectTitleField, projectDescriptionField, and projectDisciplineField retain values from immediately before submit
      - given create submit does not complete successfully, globalMessageSnackbar shows 'We encountered an issue and your project was not created'
      - given create submit does not complete successfully, no project was created
      - given create submit does not complete successfully, createProjectFormSubmitButton is enabled and clickable

    openQuestions: []

