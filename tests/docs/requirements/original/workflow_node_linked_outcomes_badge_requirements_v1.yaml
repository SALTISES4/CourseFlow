# Normalized requirements: workflowNode linked-outcomes badge and popover (view assigned workflowOutcomes; unassign via 'Unlink outcome')
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Outcomes-to-Nodes Relationships — unassignment implied by child/parent cascade rules, lines 1193–1199; Outcomes Tab drag-and-drop complement, lines 1561–1567)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Scope (this file): workflowNodeLinkedOutcomesBadge rendered on a workflowNode in workflowView when that workflowNode has at least one assigned workflowOutcome id in its persisted set; click opens workflowNodeLinkedOutcomesPopover listing those assignments with hierarchical expansion for descendants; per-row hover actions include workflowNodeLinkedOutcomeRowUnlinkOutcomeMenuItem only (canonical unassignment trigger, add-only complement to FR-WF-AO-004). Outcome comments from the linked-outcomes popover are out of scope (entry paths for outcome comments remain FR-WF-COMMENTS-004 in the Outcomes view only). Cascade rules on unassignment are per FR-WF-AO-006. Outcome-highlight presentation on workflowNodes (workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003 and badge highlight variant) follows highlight qualification per FR-WF-AO-005 and badge/border coupling per FR-WF-AO-007. Out of scope: drag-and-drop assignment from workflowRightSidebarOutcomesTab (FR-WF-AO-004); click-to-highlight from the Outcomes tab (FR-WF-AO-005); outcome CRUD and tree reorder in the 'Outcomes' view (FR-WF-EO-001 through FR-WF-EO-017); dedicated Figma frame for the badge (pending — see designEvidenceLinkTable).
# Cross-reference: tests/docs/requirements/original/workflow_assign_outcome_to_node_requirements_v1.yaml (FR-WF-AO-004 add-only assignment; FR-WF-AO-006 cascade rules; FR-WF-AO-005 outcome-highlight qualification; FR-WF-AO-007 badge/border highlight variant coupling per FR-WF-NODE-003); tests/docs/requirements/original/workflow_delete_outcome_requirements_v1.yaml (FR-WF-EO-014 assignment cleanup on outcome delete); tests/docs/requirements/original/workflow_node_visual_requirements_v1.yaml (workflowNodeOutcomeHighlightBorder — FR-WF-NODE-003); tests/docs/requirements/original/workflow_edit_node_requirements_v1.yaml (workflowNode); tests/docs/requirements/original/workflow_edit_outcome_requirements_v1.yaml (workflowOutcome, workflowOutcomeHeaderTitle display rules — FR-WF-EO-007); tests/docs/requirements/original/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar, tab binding); tests/docs/requirements/guidelines_functional_requirements.md
#   - tests/docs/requirements/original/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/graph'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowView renders at least one workflowNode
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

