# Normalized requirements: delete an existing workflowOutcome in the workflowOutcomeView ('Outcomes' view)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Scope (this file): deletion of a single workflowOutcome from (a) workflowEditOutcomeFormDeleteButton on workflowEditOutcomeForm and (b) workflowOutcomeHoverActionsMenuDeleteItem on workflowOutcomeHoverActionsMenu, including subtree removal, sibling renumbering, sidebar binding follow-through (Edit and Comments tabs per FR-WF-RS-004; selection chrome per FR-WF-EO-018; last-outcome sidebar not rendered per FR-WF-RS-001), outcome-to-node assignment cleanup on delete per FR-WF-EO-014 (downstream badge and assign-tab updates per FR-WF-AO-007 and FR-WF-AO-002 and highlight-set cleanup per FR-WF-AO-005), and reversion to workflowOutcomeViewEmptyState when the last workflowOutcome is removed. Out of scope: drag-and-drop, outcome filter highlight.
# Cross-reference: tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml (canonical workflowOutcomeView, workflowOutcomeViewEmptyState, workflowOutcomeTree, workflowOutcome, workflowOutcomeHeader, workflowOutcomeHoverActionsMenu, workflowEditOutcomeForm; hover-menu container visibility and per-item gating — FR-WF-EO-003; sidebar binding rules including clear-on-removed-outcome — FR-WF-EO-004; outcome header selection chrome — FR-WF-EO-018; auto-numbering recompute — FR-WF-EO-007; three-level depth cap — FR-WF-EO-008; drag reorder/reparent — tests/docs/requirements/features/workflow/workflow_outcome_tree_drag_reorder_requirements_v1.yaml FR-WF-EO-015 through FR-WF-EO-017; empty state reversion — FR-WF-EO-001); tests/docs/requirements/features/workflow/workflow_delete_node_requirements_v1.yaml (workflowNode delete convention this file is adapted from); tests/docs/requirements/features/workflow/workflow_assign_outcome_to_node_requirements_v1.yaml (FR-WF-AO-002 assign-tab content; FR-WF-AO-005 highlight-set cleanup on delete; FR-WF-AO-006 parent-assignment cascade on delete); tests/docs/requirements/features/workflow/workflow_node_linked_outcomes_badge_requirements_v1.yaml (FR-WF-AO-007 badge updates when assignments removed on delete); tests/docs/requirements/features/workflow/workflow_comments_tab_requirements_v1.yaml (comments tab host binding — FR-WF-COMMENTS-004); tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar collapsed/expanded presentation — FR-WF-RS-001, FR-WF-RS-002, FR-WF-RS-004); tests/docs/requirements/guidelines_functional_requirements.md

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/outcomes'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowOutcomeView is open with workflowOutcomeTree rendered and at least one workflowOutcome
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

