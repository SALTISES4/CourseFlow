# Normalized requirements: workflow right sidebar in 'Workflow' and 'Outcomes' views
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Right Sidebar section); legacy archive uses 'closed'/'open' for collapsed/expanded on workflowRightSidebar
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml (workflow tab routes and sub-view navigation)
#   - tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (section uiObjects — FR-SEC-001, FR-SEC-007)
#   - tests/docs/requirements/features/shared/context_action_bar_requirements_v1.yaml (view-settings controls in Workflow/Outcomes views)
#   - tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml (Add tab — FR-WF-ADD-*)
#   - tests/docs/requirements/features/workflow/workflow_comments_tab_requirements_v1.yaml (comments tab host objects — FR-WF-RS-003 eligible selection)
#   - tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml (empty state — FR-WF-EO-001/002/004)
#   - tests/docs/requirements/features/workflow/workflow_delete_node_requirements_v1.yaml (delete sidebar follow-through — FR-WF-DEL-002)
#   - tests/docs/requirements/features/workflow/workflow_delete_outcome_requirements_v1.yaml (last outcome removed — empty-state reversion)
#   - tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml (denied access — FR-WS-ACCESS-002)

documentPreconditions:
  - user is authenticated to CourseFlow
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project of the workflow, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - routes matching '/workflow/{id}/*' include '/workflow/{id}' (empty suffix) and '/workflow/{id}/<sub-view>' for any sub-view
  - requirements in this file assume documentPreconditions above hold; when they do not, assert per FR-WS-ACCESS-002

uiObjectDefinitions:
  workflowRightSidebar:
    meaning: Right-hand sidebar container on workflow routes with collapsed and expanded states; rendered means workflowRightSidebarTabStrip (at minimum) is in the DOM and does not imply expanded or that workflowRightSidebarContentPanel is shown.
  workflowRightSidebarTabStrip:
    meaning: Vertical icon tab strip on workflowRightSidebar.
  workflowRightSidebarToggleButton:
    meaning: Exclusive collapse control (arrow pointing right) on expanded workflowRightSidebar; the only user action that collapses the sidebar.
  workflowRightSidebarContentPanel:
    meaning: Expandable region on workflowRightSidebar that shows the selected tab's content when expanded and is hidden when collapsed.
  workflowRightSidebarEditTab:
    meaning: Edit tab on workflowRightSidebar.
  workflowRightSidebarAddTab:
    meaning: Add tab on workflowRightSidebar.
  workflowRightSidebarCommentsTab:
    meaning: Comments tab on workflowRightSidebar.
  workflowRightSidebarOutcomesTab:
    meaning: Outcomes tab on workflowRightSidebar.
  workflowRightSidebarEditTabContent:
    meaning: Content region shown when workflowRightSidebarEditTab is selected.
  workflowRightSidebarAddTabContent:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml.
  workflowRightSidebarCommentsTabContent:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_comments_tab_requirements_v1.yaml.
  workflowRightSidebarOutcomesTabContent:
    meaning: Content region shown when workflowRightSidebarOutcomesTab is selected.
  workflowNode:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml.
  workflowEdge:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edge_requirements_v1.yaml.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml.
  workflowChannel:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowOutcome:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml.
  workflowViewTabSelector:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml.
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml.

locatorMappings:
  workflowRightSidebar: "canonical_locators.yaml -> workflowRightSidebar"
  workflowRightSidebarTabStrip: "canonical_locators.yaml -> workflowRightSidebarTabStrip"
  workflowRightSidebarEditTab: "canonical_locators.yaml -> workflowRightSidebarEditTab"
  workflowRightSidebarAddTab: "canonical_locators.yaml -> workflowRightSidebarAddTab"
  workflowRightSidebarCommentsTab: "canonical_locators.yaml -> workflowRightSidebarCommentsTab"
  workflowRightSidebarOutcomesTab: "canonical_locators.yaml -> workflowRightSidebarOutcomesTab"
  workflowRightSidebarToggleButton: "canonical_locators.yaml -> workflowRightSidebarToggleButton"
  workflowRightSidebarContentPanel: "canonical_locators.yaml -> workflowRightSidebarContentPanel"
  workflowRightSidebarEditTabContent: "canonical_locators.yaml -> workflowRightSidebarEditTabContent"
  workflowRightSidebarAddTabContent: "canonical_locators.yaml -> workflowRightSidebarAddTabContent"
  workflowRightSidebarCommentsTabContent: "canonical_locators.yaml -> workflowRightSidebarCommentsTabContent"
  workflowRightSidebarOutcomesTabContent: "canonical_locators.yaml -> workflowRightSidebarOutcomesTabContent"

requirements:
  - id: FR-WF-RS-001
    title: Right sidebar visibility and collapsed state in workflow sub-views

    designEvidence:
      - FIGMA-WF-SIDEBAR-WORKFLOW-OPEN
      - FIGMA-WF-SIDEBAR-WORKFLOW-COLLAPSED
      - FIGMA-WF-SIDEBAR-OUTCOMES

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowRightSidebar
      - workflowRightSidebarTabStrip
      - workflowRightSidebarToggleButton
      - workflowRightSidebarContentPanel
      - workflowRightSidebarEditTab
      - workflowRightSidebarAddTab
      - workflowRightSidebarAddTabContent
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarOutcomesTab
      - workflowViewTabSelector

    preconditions:
      - documentPreconditions for this file hold
      - current route is '/workflow/{id}/graph' or '/workflow/{id}/outcomes'

    trigger:
      - user lands on '/workflow/{id}/graph' or '/workflow/{id}/outcomes'
      - user clicks workflowRightSidebarToggleButton
      - user clicks a visible tab icon in workflowRightSidebarTabStrip while workflowRightSidebar is collapsed
      - user selects a workspace object in the active sub-view while workflowRightSidebar is collapsed and that selection requires workflowRightSidebarEditTab or workflowRightSidebarCommentsTab to show content per FR-WF-RS-003 (workflowEdge selection requires workflowRightSidebarEditTab only)
      - workflowOutcome count on '/workflow/{id}/outcomes' transitions from zero to at least one while the actor remains on that route (first workflowOutcome created per FR-WF-EO-002)
      - workflowOutcome count on '/workflow/{id}/outcomes' transitions from at least one to zero while the actor remains on that route (last workflowOutcome removed)
      - user selects a different sub-view on workflowViewTabSelector (navigates between '/workflow/{id}/graph' and '/workflow/{id}/outcomes', or from either to '/workflow/{id}')

    mainFlow:
      - workflowRightSidebar is not rendered on '/workflow/{id}'
      - on '/workflow/{id}/graph', workflowRightSidebar is visible, including when the workflow has no workflowNode entries yet
      - on '/workflow/{id}/outcomes' when the workflow has zero workflowOutcome entries, workflowRightSidebar is not rendered
      - on '/workflow/{id}/outcomes' when the workflow has at least one workflowOutcome, workflowRightSidebar is rendered (collapsed default per this FR applies on initial load and after the zero-to-one transition below)
      - when the last workflowOutcome is removed while on '/workflow/{id}/outcomes', workflowRightSidebar is not rendered
      - when the first workflowOutcome is created on '/workflow/{id}/outcomes' per FR-WF-EO-002, workflowRightSidebar is rendered in default presentation for that sub-view (collapsed with no tab selected, workflowRightSidebarContentPanel hidden); workflowRightSidebarEditTabContent does not bind to the new workflowOutcome until the actor clicks that workflowOutcome's workflowOutcomeHeader per FR-WF-EO-004
      - workflowRightSidebar supports collapsed and expanded presentation; collapse occurs only when the user clicks workflowRightSidebarToggleButton
      - when collapsed, workflowRightSidebarTabStrip remains visible and workflowRightSidebarContentPanel is hidden
      - when expanded, workflowRightSidebarTabStrip and workflowRightSidebarContentPanel are visible and exactly one visible tab may be selected with its matching tab content
      - default presentation on initial render of an admissible route (sidebar visible per rules above) is collapsed with no tab selected
      - on '/workflow/{id}/graph' when the workflow has zero workflowNode entries across workflowView, owner and editor see expanded presentation with workflowRightSidebarAddTab selected and workflowRightSidebarAddTabContent visible; commenter, viewer, and user see the same collapsed default as on populated workflows (Add tab actionability per FR-WF-RS-003)
      - when user clicks workflowRightSidebarToggleButton while expanded, workflowRightSidebar collapses and workflowRightSidebarContentPanel is hidden
      - when user clicks any visible and enabled tab icon in workflowRightSidebarTabStrip while collapsed, workflowRightSidebar expands and the clicked tab is selected
      - when workflowRightSidebar is collapsed and the user selects a workspace object that requires workflowRightSidebarEditTab or workflowRightSidebarCommentsTab to show content per FR-WF-RS-003, workflowRightSidebar expands, the required tab is selected, and matching tab content is shown in workflowRightSidebarContentPanel; workflowEdge selection expands workflowRightSidebar on workflowRightSidebarEditTab only
      - when the actor navigates between '/workflow/{id}/graph' and '/workflow/{id}/outcomes' via workflowViewTabSelector, workflowRightSidebar is re-evaluated for visibility per the destination route rules in this FR (including zero workflowOutcome entries on '/workflow/{id}/outcomes')
      - when workflowRightSidebar remains visible after such navigation, workflowRightSidebar receives default presentation for the destination sub-view, actor, and workflowNode count in workflowView per the initial-render rules in this FR — any bound workflowRightSidebarEditTabContent or workflowRightSidebarCommentsTabContent is cleared, and tab enabled/disabled states follow FR-WF-RS-003 for the destination sub-view
      - when the actor navigates to '/workflow/{id}' (Overview) via workflowViewTabSelector, workflowRightSidebar is not rendered regardless of its state on the prior sub-view
      - sub-view navigation is a system reset of sidebar presentation, not a user click on workflowRightSidebarToggleButton; only workflowRightSidebarToggleButton performs user-initiated collapse per this FR

    roleBehavior: {}

    acceptanceCriteria:
      - given route '/workflow/{id}', workflowRightSidebar is not visible
      - given route '/workflow/{id}/graph', workflowRightSidebar is visible even when the workflow has zero workflowNode entries in workflowView
      - given route '/workflow/{id}/outcomes' and zero workflowOutcome entries, workflowRightSidebar is not visible
      - given route '/workflow/{id}/outcomes' and at least one workflowOutcome exists, workflowRightSidebar is rendered
      - given actor is on '/workflow/{id}/outcomes' with zero workflowOutcome entries and workflowRightSidebar is not visible, when owner or editor creates the first workflowOutcome per FR-WF-EO-002, workflowRightSidebar is rendered, workflowRightSidebar is collapsed with no tab selected, workflowRightSidebarContentPanel is hidden, and workflowRightSidebarEditTabContent is not bound to the new workflowOutcome
      - given workflowRightSidebar is rendered and collapsed on '/workflow/{id}/outcomes' after the first workflowOutcome was created and no workflowOutcomeHeader has been clicked, when actor clicks a workflowOutcomeHeader per FR-WF-EO-004, workflowRightSidebar expands, workflowRightSidebarEditTab is selected, workflowRightSidebarContentPanel is visible, and workflowEditOutcomeForm is bound to the clicked workflowOutcome
      - given actor is on '/workflow/{id}/outcomes' with at least one workflowOutcome and workflowRightSidebar is rendered, when the last workflowOutcome in the workflow is removed per FR-WF-EO-014, workflowRightSidebar is not visible and workflowOutcomeViewEmptyState is rendered per FR-WF-EO-001
      - given route '/workflow/{id}/graph' and the workflow has at least one workflowNode in workflowView, when workflowRightSidebar is visible on initial load, workflowRightSidebar is collapsed and no tab is selected
      - given route '/workflow/{id}/graph' and zero workflowNode entries, when actor is owner or editor and workflowRightSidebar is visible on initial load, workflowRightSidebar is expanded, workflowRightSidebarAddTab is selected, and workflowRightSidebarAddTabContent is visible
      - given route '/workflow/{id}/graph' and zero workflowNode entries, when actor is commenter, viewer, or user and workflowRightSidebar is visible on initial load, workflowRightSidebar is collapsed and no tab is selected
      - given route '/workflow/{id}/outcomes' and at least one workflowOutcome exists, when workflowRightSidebar is rendered on initial load, workflowRightSidebar is collapsed and no tab is selected
      - given workflowRightSidebar is expanded, when user clicks workflowRightSidebarToggleButton, workflowRightSidebar collapses and workflowRightSidebarContentPanel is hidden
      - given workflowRightSidebar is collapsed, workflowRightSidebarTabStrip icons remain visible
      - given workflowRightSidebar is collapsed, when user clicks a visible and enabled tab icon in workflowRightSidebarTabStrip, workflowRightSidebar expands and the clicked tab is selected
      - given workflowRightSidebar is collapsed, when user clicks a workflowNode in workflowView per FR-WF-EN-001, workflowRightSidebar expands, workflowRightSidebarEditTab is selected, and workflowRightSidebarContentPanel is visible
      - given workflowRightSidebar is collapsed on '/workflow/{id}/graph', when user clicks a workflowEdge in workflowView per FR-WF-EDGE-004, workflowRightSidebar expands, workflowRightSidebarEditTab is selected, and workflowRightSidebarContentPanel is visible
      - given workflowRightSidebar is collapsed on '/workflow/{id}/graph' and a workflowEdge is selected per FR-WF-EDGE-004, workflowRightSidebarCommentsTab remains disabled per FR-WF-RS-003
      - given workflowRightSidebar is collapsed on '/workflow/{id}/graph', when user clicks workflowSectionHeader for a workflowSectionContainer per FR-SEC-001, workflowRightSidebar expands, workflowRightSidebarEditTab is selected, and workflowRightSidebarContentPanel is visible
      - given workflowRightSidebar is collapsed on '/workflow/{id}/graph', when user clicks workflowChannelHeader for a workflowChannel per FR-CHAN-001, workflowRightSidebar expands, workflowRightSidebarEditTab is selected, and workflowRightSidebarContentPanel is visible
      - given workflowRightSidebar is collapsed on '/workflow/{id}/outcomes' and at least one workflowOutcome exists, when actor clicks a workflowOutcomeHeader per FR-WF-EO-004, workflowRightSidebar expands, workflowRightSidebarEditTab is selected, and workflowRightSidebarContentPanel is visible
      - given actor is on '/workflow/{id}/graph' with workflowRightSidebar expanded and workflowRightSidebarAddTab selected, when actor selects 'Outcomes' on workflowViewTabSelector per FR-WF-HEADER-001 and the workflow has at least one workflowOutcome, then workflowRightSidebar is visible on '/workflow/{id}/outcomes', workflowRightSidebar is collapsed with no tab selected, and workflowRightSidebarTabStrip shows only Edit and Comments per FR-WF-RS-002
      - given actor is on '/workflow/{id}/outcomes' with workflowRightSidebar expanded and workflowRightSidebarEditTab selected showing workflowEditOutcomeForm, when actor selects 'Workflow' on workflowViewTabSelector per FR-WF-HEADER-001, then workflowRightSidebar is visible on '/workflow/{id}/graph', workflowRightSidebar is collapsed with no tab selected (or per zero-node owner/editor rules in this FR), workflowRightSidebarEditTabContent is not bound to the prior workflowOutcome, and workflowRightSidebarTabStrip shows Edit, Add, Outcomes, and Comments per FR-WF-RS-002
      - given workflowRightSidebar is visible on any workflow sub-view, when actor selects 'Overview' on workflowViewTabSelector per FR-WF-HEADER-001, then workflowRightSidebar is not visible on '/workflow/{id}'

    openQuestions: []

  - id: FR-WF-RS-002
    title: Right sidebar tab visibility by workflow view and workflow type

    designEvidence:
      - FIGMA-WF-SIDEBAR-WORKFLOW-OPEN
      - FIGMA-WF-SIDEBAR-OUTCOMES

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowRightSidebarTabStrip
      - workflowRightSidebarEditTab
      - workflowRightSidebarAddTab
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarOutcomesTab

    preconditions:
      - FR-WF-RS-001 preconditions hold
      - workflowRightSidebar is visible

    trigger:
      - system computes visible sidebar tabs for current workflow type and active sub-view

    mainFlow:
      - in '/workflow/{id}/graph' for activity/course/program, visible tabs are ordered exactly as: workflowRightSidebarEditTab, workflowRightSidebarAddTab, workflowRightSidebarOutcomesTab, workflowRightSidebarCommentsTab
      - in 'Outcomes' view for activity/course/program, visible tabs are ordered exactly as: workflowRightSidebarEditTab, workflowRightSidebarCommentsTab
      - in 'Outcomes' view, workflowRightSidebarAddTab and workflowRightSidebarOutcomesTab are hidden
      - workflowRightSidebarRelatedTab is out of scope for this requirement version

    roleBehavior: {}

    acceptanceCriteria:
      - given activity/course/program on '/workflow/{id}/graph', tab strip order is Edit, Add, Outcomes, Comments
      - given activity/course/program in 'Outcomes' view, tab strip shows Edit and Comments

    openQuestions: []

  - id: FR-WF-RS-003
    title: Right sidebar tab actionability states

    designEvidence:
      - FIGMA-WF-SIDEBAR-WORKFLOW-OPEN
      - FIGMA-WF-SIDEBAR-OUTCOMES

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowRightSidebarEditTab
      - workflowRightSidebarAddTab
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarOutcomesTab
      - workflowRightSidebarEditTabContent
      - workflowRightSidebarAddTabContent
      - workflowRightSidebarCommentsTabContent
      - workflowRightSidebarOutcomesTabContent
      - workflowNode
      - workflowEdge
      - workflowSectionContainer
      - workflowChannel
      - workflowOutcome

    preconditions:
      - FR-WF-RS-002 preconditions hold

    trigger:
      - user clicks a visible sidebar tab
      - user selects a workspace object in the active sub-view that enables edit or comments per companion FRs

    mainFlow:
      - editable selection context exists when a workflowNode, workflowEdge, workflowSectionContainer, workflowChannel, or workflowOutcome is selected in the active workspace view
      - eligible selection context exists when a workflowNode, workflowChannel, workflowSectionContainer, or workflowOutcome is selected in the active workspace view
      - workflowRightSidebarEditTab is actionable only when editable selection context exists; otherwise the tab remains visible but disabled
      - workflowRightSidebarCommentsTab is actionable for owner/editor/commenter only when eligible selection context exists; for viewer and user it remains visible but disabled
      - workflowRightSidebarAddTab is actionable for owner/editor only; for commenter/viewer/user it remains visible but disabled
      - when visible, workflowRightSidebarOutcomesTab is actionable
      - clicking an actionable tab that tab is selected and displays matching tab content region

    roleBehavior:
      owner:
        workflowRightSidebarEditTab: enabledWhenEditableSelectionExists
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
        workflowRightSidebarAddTab: enabledWhenVisible
      editor:
        workflowRightSidebarEditTab: enabledWhenEditableSelectionExists
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
        workflowRightSidebarAddTab: enabledWhenVisible
      commenter:
        workflowRightSidebarEditTab: enabledWhenEditableSelectionExists
        workflowRightSidebarCommentsTab: enabledWhenEligibleSelectionExists
        workflowRightSidebarAddTab: disabled
      viewer:
        workflowRightSidebarEditTab: enabledWhenEditableSelectionExists
        workflowRightSidebarCommentsTab: disabled
        workflowRightSidebarAddTab: disabled
      user:
        workflowRightSidebarEditTab: enabledWhenEditableSelectionExists
        workflowRightSidebarCommentsTab: disabled
        workflowRightSidebarAddTab: disabled

    acceptanceCriteria:
      - given no workflowNode, workflowEdge, workflowSectionContainer, workflowChannel, or workflowOutcome is selected in the active workspace view, workflowRightSidebarEditTab is visible and disabled
      - given a workflowNode, workflowEdge, workflowSectionContainer, workflowChannel, or workflowOutcome is selected in the active workspace view, workflowRightSidebarEditTab is enabled
      - given actor is owner/editor/commenter and no workflowNode, workflowChannel, workflowSectionContainer, or workflowOutcome is selected in the active workspace view, workflowRightSidebarCommentsTab is visible and disabled
      - given actor is owner/editor/commenter and a workflowNode, workflowChannel, workflowSectionContainer, or workflowOutcome is selected in the active workspace view, workflowRightSidebarCommentsTab is enabled
      - given actor is viewer or user, workflowRightSidebarCommentsTab is visible and disabled
      - given actor is owner or editor and workflowRightSidebarAddTab is visible, it is enabled
      - given actor is commenter/viewer/user and workflowRightSidebarAddTab is visible, it is disabled
      - when workflowRightSidebarOutcomesTab is visible, it is enabled
      - given user clicks an enabled tab, corresponding tab content is visible and that tab is selected

    openQuestions: []

  - id: FR-WF-RS-004
    title: Restore default sidebar presentation when selection or bound tab content clears

    designEvidence:
      - FIGMA-WF-SIDEBAR-WORKFLOW-OPEN
      - FIGMA-WF-SIDEBAR-WORKFLOW-COLLAPSED

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowRightSidebar
      - workflowRightSidebarTabStrip
      - workflowRightSidebarContentPanel
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent
      - workflowRightSidebarAddTab
      - workflowRightSidebarAddTabContent
      - workflowRightSidebarOutcomesTab
      - workflowRightSidebarOutcomesTabContent

    preconditions:
      - FR-WF-RS-001 preconditions hold
      - workflowRightSidebar is visible

    trigger:
      - user clears the workspace selection that was driving workflowRightSidebarEditTab or workflowRightSidebarCommentsTab content (including deselect-on-second-click per FR-WF-EO-004)
      - a workflowNode, workflowEdge, workflowSectionContainer, workflowChannel, or workflowOutcome shown in workflowRightSidebarEditTabContent or workflowRightSidebarCommentsTabContent is removed from the workflow
      - owner or editor causes workflowNode count in workflowView to cross the zero-node threshold (first workflowNode added or last workflowNode removed) per FR-WF-ADD-* and FR-WF-DEL-*
      - workflowOutcome count on '/workflow/{id}/outcomes' transitions from at least one to zero

    mainFlow:
      - when the last workflowOutcome is removed on '/workflow/{id}/outcomes', workflowRightSidebar is not rendered per FR-WF-RS-001; default-presentation rules in this FR do not apply because workflowRightSidebar is not visible
      - when the user clears the selection that was driving workflowRightSidebarEditTab or workflowRightSidebarCommentsTab content, workflowRightSidebar returns to default presentation per FR-WF-RS-001 — bound content is cleared and Edit/Comments disabled states follow FR-WF-RS-003
      - when a workflowNode, workflowEdge, workflowSectionContainer, workflowChannel, or workflowOutcome is removed and it was the object shown in workflowRightSidebarEditTabContent or workflowRightSidebarCommentsTabContent, workflowRightSidebar returns to default presentation per FR-WF-RS-001
      - when a workflowNode, workflowEdge, workflowSectionContainer, workflowChannel, or workflowOutcome is removed but workflowRightSidebar was not showing that object on Edit or Comments (including when workflowRightSidebarAddTab or workflowRightSidebarOutcomesTab is the selected tab, or Edit is bound to a different object), workflowRightSidebar keeps the same expanded or collapsed state and selected tab as immediately before the removal; only the canvas updates (workflowNode delete detail per FR-WF-DEL-002)
      - when owner or editor causes workflowNode count to transition from zero to at least one, workflowRightSidebar returns to default presentation per FR-WF-RS-001 unless that actor has changed presentation via workflowRightSidebarToggleButton or a tab icon since the transition
      - when owner or editor causes workflowNode count to transition from at least one to zero, workflowRightSidebar receives default presentation per FR-WF-RS-001 for zero workflowNode entries
      - returning to default presentation is a system reset per FR-WF-RS-001, not a user click on workflowRightSidebarToggleButton

    roleBehavior: {}

    acceptanceCriteria:
      - given a workflowOutcome is selected and workflowEditOutcomeForm is shown on workflowRightSidebarEditTab, when actor clicks the same workflowOutcomeHeader again per FR-WF-EO-004, workflowRightSidebar returns to default presentation per FR-WF-RS-001
      - given workflowEditOutcomeForm was bound to a workflowOutcome that is removed from the workflow, workflowRightSidebar returns to default presentation per FR-WF-RS-001
      - given owner or editor deletes a workflowNode via workflowNodeHoverActionsMenuDeleteItem while workflowRightSidebarAddTab is the selected tab and workflowEditNodeForm is not bound to that workflowNode, workflowRightSidebar remains expanded on workflowRightSidebarAddTab with workflowRightSidebarAddTabContent visible per FR-WF-DEL-002
      - given owner or editor deletes a workflowNode while workflowEditNodeForm on workflowRightSidebarEditTab is bound to that same workflowNode, after deletion per FR-WF-DEL-002, workflowRightSidebar returns to default presentation per FR-WF-RS-001
      - given owner or editor deletes a workflowEdge via workflowEditEdgeFormDeleteButton while workflowEditEdgeForm on workflowRightSidebarEditTab is bound to that same workflowEdge, after deletion per FR-WF-EDGE-002, workflowRightSidebar returns to default presentation per FR-WF-RS-001
      - given owner or editor confirms delete of a workflowSectionContainer via workflowSectionDeleteDialogConfirmButton while workflowEditSectionForm on workflowRightSidebarEditTab is bound to that same workflowSectionContainer, after deletion per FR-SEC-006, workflowRightSidebar returns to default presentation per FR-WF-RS-001
      - given owner or editor confirms delete of a workflowChannel via workflowChannelDeleteDialogConfirmButton while workflowEditChannelForm on workflowRightSidebarEditTab is bound to that same workflowChannel, after deletion per FR-CHAN-006, workflowRightSidebar returns to default presentation per FR-WF-RS-001
      - given owner or editor on '/workflow/{id}/graph' with zero workflowNode entries and workflowRightSidebarAddTab selected, when the first workflowNode is added to workflowView, workflowRightSidebar returns to default presentation per FR-WF-RS-001 unless the user has clicked workflowRightSidebarToggleButton or a tab icon since the add
      - given owner or editor on '/workflow/{id}/graph' with at least one workflowNode and workflowRightSidebar is expanded on any tab, when the last workflowNode is removed from workflowView, workflowRightSidebar receives default presentation per FR-WF-RS-001 for zero workflowNode entries
      - given owner or editor on '/workflow/{id}/outcomes' with workflowEditOutcomeForm open on workflowRightSidebarEditTab, when the last workflowOutcome in the workflow is deleted per FR-WF-EO-014, workflowRightSidebar is not visible and workflowOutcomeViewEmptyState is rendered per FR-WF-RS-001 and FR-WF-EO-001

    openQuestions: []

