    mainFlow:
      - per workflowNode row, workflowOutcomeTableProgramGeneralEducationColumn cell displays workflowEditNodeFormTimeField when workflowEditNodeFormSpecificEducationSwitch is OFF and is empty when ON; workflowOutcomeTableProgramSpecificEducationColumn cell displays workflowEditNodeFormTimeField when ON and is empty when OFF; a displayed unset time value uses an em dash and an explicit zero uses the localized zero-duration value
      - per workflowNode row, workflowOutcomeTableProgramPonderationTheoryColumn cell displays workflowEditNodeFormPonderationTheoryField; workflowOutcomeTableProgramPonderationPracticalColumn cell displays workflowEditNodeFormPonderationPracticeField; workflowOutcomeTableProgramPonderationIndividualColumn cell displays workflowEditNodeFormPonderationIndividualField; each set duration uses normalized localized Days + Hours per FR-WF-DURATION-002 and FR-WF-DURATION-003 and each unset duration displays an em dash
      - workflowOutcomeTableProgramPonderationTotalHoursColumn cell converts each set Theory, Practical, and Individual duration to whole hours, treats an unset component as zero when at least one component is set, sums the components, and normalizes the result to localized Days + Hours; when all three components are unset, it displays an em dash
      - workflowOutcomeTableProgramCreditsColumn cell displays workflowEditNodeFormCreditsField numerically; an unset credit value displays an em dash and an explicit zero displays 0
      - on workflowOutcomeTableSectionRow for workflowSectionContainer S, each program summary column cell sums the per-node values shown in that column for all workflowNode entries in S; unset values contribute zero when at least one value in that column is set, and an all-unset column total displays an em dash
