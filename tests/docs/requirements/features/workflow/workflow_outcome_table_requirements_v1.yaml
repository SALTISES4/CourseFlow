  - id: FR-WF-OT-005
    title: Toggle outcome-to-node assignment from 'Outcome table' cells

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
      - anonymousViewer

    uiObjects:
      - workflowOutcomeTableGridCell
      - workflowOutcomeTableGridCellCompleteIndicator
      - workflowOutcomeTableGridCellPartialIndicator
      - workflowOutcomeTableGridCellFocusBorder
      - workflowOutcomeTree
      - workflowOutcome
      - workflowNode
      - workflowView
      - workflowRightSidebarOutcomesTab
      - globalMessageSnackbar

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/workflow/{id}/outcome-table'
      - workflow has at least one workflowOutcome and at least one workflowNode
      - assignment actionability is derived from WorkflowPermission.ASSIGN_OUTCOMES and the workflow edit-lock state per tests/docs/requirements/features/global/workspace_edit_lock_requirements_v1.yaml

    trigger:
      - actor activates an actionable workflowOutcomeTableGridCell with a pointer click, Space, or Enter

    mainFlow:
      - workflowOutcomeTableSectionOutcomeCell is read-only; only workflowOutcomeTableGridCell, each representing one workflowOutcome and one workflowNode pair, is assignable per below
      - every workflowOutcomeTableGridCell exposes role='checkbox'; its accessible name contains the full hierarchical numbered workflowOutcome title and full workflowNode title, and aria-checked is 'false' for empty, 'mixed' for partial, or 'true' for complete per FR-WF-OT-006
      - workflowOutcomeTableGridCell is actionable only when actor has WorkflowPermission.ASSIGN_OUTCOMES and currently holds the workflow's unexpired edit lock; an edit lock never grants assignment permission that the actor does not already have
      - an actionable workflowOutcomeTableGridCell participates in keyboard tab order, Space or Enter performs the same assignment toggle as a pointer click, and keyboard focus renders workflowOutcomeTableGridCellFocusBorder without relying on colour alone
      - when owner or editor has assignment permission but does not currently hold the workflow edit lock, workflowOutcomeTableGridCell remains visible and read-only until the actor acquires or takes over the lock and the latest server state has reloaded per FR-WS-LOCK-001 through FR-WS-LOCK-004
      - when owner or editor clicks a workflowOutcomeTableGridCell that is empty or shows workflowOutcomeTableGridCellPartialIndicator for workflowOutcome O on workflowNode N, system assigns O to N; assign→descendants cascade per tests/docs/requirements/features/workflow/workflow_assign_outcome_to_node_requirements_v1.yaml FR-WF-AO-006 adds every descendant workflowOutcome of O to N's assignment set; cell (O, N) and all affected descendant cells show workflowOutcomeTableGridCellCompleteIndicator per FR-WF-OT-006 — same cascade as drag-and-drop from workflowRightSidebarOutcomesTab onto workflowNode on the 'Workflow' sub-view per FR-WF-OT-007
      - when owner or editor clicks a workflowOutcomeTableGridCell that shows workflowOutcomeTableGridCellCompleteIndicator for workflowOutcome O on workflowNode N, system removes O from N's assignment set; child-removed → parent removal cascade per FR-WF-AO-006 applies; cell presentation updates per FR-WF-OT-006; removal updates the same assignment set as unlink on the 'Workflow' sub-view per FR-WF-OT-007
      - while an assignment or unassignment request is pending, the initiating cell and every cell whose state may change under the assignment cascade are non-actionable and additional clicks do not submit duplicate mutations
      - every non-actionable or pending workflowOutcomeTableGridCell exposes aria-disabled='true', preserves its aria-checked status for assistive technology, and does not respond to pointer, Space, or Enter activation
      - after a successful request, all affected cells render from the authoritative assignment delta returned by the server
      - after a failed request, no partial assignment change is presented as persisted; affected cells return to the last authoritative assignment state and global error feedback follows the existing graph-mutation and workspace edit-lock behavior, including the exact FR-WS-LOCK-005 feedback when the mutation is rejected because the lock expired or another actor holds it
      - click zone on workflowOutcomeTableGridCell is deactivated for commenter, viewer, user, anonymousViewer, and any owner or editor who lacks current assignment actionability
      
    roleBehavior:
      owner:
        workflowOutcomeTableGridCell: editable only with WorkflowPermission.ASSIGN_OUTCOMES and the current unexpired workflow edit lock; otherwise readOnly
      editor:
        workflowOutcomeTableGridCell: editable only with WorkflowPermission.ASSIGN_OUTCOMES and the current unexpired workflow edit lock; otherwise readOnly
      commenter:
        workflowOutcomeTableGridCell: readOnly
      viewer:
        workflowOutcomeTableGridCell: readOnly
      user:
        workflowOutcomeTableGridCell: readOnly
      anonymousViewer:
        workflowOutcomeTableGridCell: readOnly

    acceptanceCriteria:
      - given any outcome-node assignment cell, it exposes role='checkbox', an accessible name containing the full numbered outcome title and full node title, and aria-checked matching its FR-WF-OT-006 state
      - given owner or editor has WorkflowPermission.ASSIGN_OUTCOMES and holds the current unexpired edit lock, an assignment cell is actionable by pointer, Space, and Enter and receives a visible non-colour-only focus outline on keyboard focus
      - given an empty or partial actionable cell for outcome O and node N, activation assigns O and its descendants to N using the FR-WF-AO-006 cascade; given a complete cell, activation removes O using the corresponding parent-removal cascade
      - given actor lacks WorkflowPermission.ASSIGN_OUTCOMES, lacks the current edit lock, has a read-only role, or is anonymousViewer, the cell exposes aria-disabled='true', preserves its checked state, and pointer, Space, or Enter causes no mutation
      - given an assignment request is pending, every potentially affected cascade cell is non-actionable and repeated activation does not submit another mutation
      - given the server accepts the mutation, every affected cell renders the authoritative returned assignment state
      - given the server rejects the mutation, every affected cell returns to its last authoritative state, no partial change remains presented as persisted, and the applicable graph-mutation or FR-WS-LOCK-005 error feedback is visible
      - given an owner or editor acquires or takes over the edit lock, cells remain non-actionable until current server state has reloaded and both permission and lock conditions hold

    openQuestions: []

  - id: FR-WF-OT-006
    title: Normal outcome-style completion indicators with partial roll-up on 'Outcome table'

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT
      - FIGMA-WF-OT-COURSE-COMPETENCY-MATRIX-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
      - anonymousViewer

    uiObjects:
      - workflowOutcomeTableGridCell
      - workflowOutcomeTableSectionOutcomeCell
      - workflowOutcomeTableSectionRow
      - workflowOutcomeTableGridCellCompleteIndicator
      - workflowOutcomeTableGridCellPartialIndicator
      - workflowOutcome
      - workflowSectionContainer
      - workflowNode

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/workflow/{id}/outcome-table'
      - workflowOutcomeTree has level-1, level-2, and level-3 workflowOutcome entries per FR-WF-EO-008

    trigger:
      - system renders workflowOutcomeTableGridCell on 'Outcome table'

    mainFlow:
      - when workflowOutcome O is assigned to workflowNode N and O is complete for N, workflowOutcomeTableGridCell has aria-checked='true' and shows workflowOutcomeTableGridCellCompleteIndicator
      - when O is not assigned to N but some but not all descendant workflowOutcome entries of O are assigned to N, workflowOutcomeTableGridCell has aria-checked='mixed' and shows workflowOutcomeTableGridCellPartialIndicator
      - when no descendant of O is assigned to N, workflowOutcomeTableGridCell for O has aria-checked='false' and is visually empty
      - workflowOutcomeTableSectionOutcomeCell for workflowOutcome O and workflowSectionContainer S in both 'Normal' and 'Competency matrix' style is derived automatically from workflowOutcomeTableGridCell status for O on each workflowNode in S — when every such node cell shows workflowOutcomeTableGridCellCompleteIndicator, section cell shows workflowOutcomeTableGridCellCompleteIndicator; when no node cell in S shows workflowOutcomeTableGridCellCompleteIndicator or workflowOutcomeTableGridCellPartialIndicator for O, section cell is empty; otherwise section cell shows workflowOutcomeTableGridCellPartialIndicator

    roleBehavior: {}

    acceptanceCriteria:
      - given outcome O is fully assigned to node N, cell (O, N) has aria-checked='true' and shows the complete indicator
      - given O is not directly assigned to N and some but not all descendants of O are assigned, cell (O, N) has aria-checked='mixed' and shows the partial indicator
      - given neither O nor any descendant of O is assigned to N, cell (O, N) has aria-checked='false' and is visually empty
      - given section S has at least one node and every node cell for O is complete, the read-only section rollup for O is complete
      - given S has at least one node and no node cell for O is complete or partial, the read-only section rollup for O is empty
      - given S has at least one node and its node cells for O contain any other mixture of complete, partial, and empty states, the read-only section rollup for O is partial
      - given S has no nodes, its read-only section rollup is empty and is never reported as complete
      - given either table style is active, identical assignment data produces identical node-cell and section-rollup states

    openQuestions: []

  - id: FR-WF-OT-007
    title: Outcome-to-node assignment shared with 'Workflow' sub-view

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT

    actors:
      - owner
      - editor
