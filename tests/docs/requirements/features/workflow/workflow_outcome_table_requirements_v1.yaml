  - id: FR-WF-OT-008
    title: Outcome tag grouping on 'Outcome table'

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT
      - FIGMA-WF-OT-COURSE-COMPETENCY-MATRIX-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
      - anonymousViewer

    uiObjects:
      - workflowOutcomeTableGrid
      - workflowOutcomeTableOutcomeTagGroupBand
      - workflowOutcomeTableNormalLayout
      - workflowOutcomeTableCompetencyMatrixLayout
      - workflowOutcomeTree
      - workflowOutcomeTableOutcomeRowLabel
      - workflowOutcomeTableColumnHeader
      - projectTagItem
      - workflowEditOutcomeFormTagsAutocomplete

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/workflow/{id}/outcome-table'

    trigger:
      - system renders workflowOutcomeTableOutcomeTagGroupBand on the outcome axis of workflowOutcomeTableGrid

    mainFlow:
      - workflowOutcomeTableOutcomeTagGroupBand layout on the outcome axis of workflowOutcomeTableGrid mirrors workflowOutcomesAssignTabTagGroup on workflowRightSidebarOutcomesTab per tests/docs/requirements/features/workflow/workflow_assign_outcome_to_node_requirements_v1.yaml FR-WF-AO-002
      - tagged workflowOutcomeTableOutcomeTagGroupBand — one band per projectTagItem from FR-PROJ-OV-005 assigned to at least one level-1 workflowOutcome via workflowEditOutcomeFormTagsAutocomplete, ordered alphabetically by tag label (case-insensitive); each band for projectTagItem T shows label T's catalog label and contains every level-1 workflowOutcome tagged with T and their nested descendants on the outcome axis; a level-1 workflowOutcome with multiple tags appears within each qualifying tagged band
      - untagged workflowOutcomeTableOutcomeTagGroupBand — when at least one tagged band and at least one level-1 workflowOutcome has zero tags, one additional band labeled 'Untagged' contains every untagged level-1 workflowOutcome and their nested descendants on the outcome axis, appended last; when no level-1 workflowOutcome has any tag, every outcome on the outcome axis appears in a single unlabeled band and literal 'Untagged' is not shown; when every level-1 workflowOutcome has at least one tag, no 'Untagged' band and no unlabeled band are rendered
      - in 'Normal' style per FR-WF-OT-001, outcome-axis members are workflowOutcomeTree rows; in 'Competency matrix' style per FR-WF-OT-002, outcome-axis members are workflowOutcomeTableColumnHeader entries and nested descendant outcome columns
      - repeated presentation of a multi-tag level-1 workflowOutcome in multiple workflowOutcomeTableOutcomeTagGroupBand entries represents the same underlying workflowOutcome and outcome-to-node assignment set; repeated presentation never creates duplicate persisted assignments and never causes the outcome or its assignment to be counted more than once in any derived calculation
      - tag-filter visibility follows FR-CAB-008: only outcome tags participate; any toggled-off tag hides every occurrence of a matching workflowOutcome and hides that outcome's displayed subtree, while node tags do not affect Outcome Table visibility

    roleBehavior: {}

    acceptanceCriteria:
      - given tagged level-1 outcomes, one named outcome group is rendered per in-use tag in case-insensitive alphabetical tag-label order and each group contains its tagged level-1 outcomes and their descendants
      - given a level-1 outcome has multiple tags, it appears in each corresponding tag group but every occurrence represents the same assignment data and is counted at most once in derived calculations
      - given tagged and untagged level-1 outcomes coexist, an 'Untagged' group containing untagged roots and descendants is rendered last
      - given no level-1 outcome has a tag, all outcomes render in one visually unlabeled group with accessible name 'Outcomes' and literal 'Untagged' is absent
      - given every level-1 outcome is tagged, no 'Untagged' or unlabeled group is rendered
      - given Normal style is active, grouped outcomes appear as rows; given Competency matrix style is active, the same grouping appears as outcome columns
      - given tag T is toggled off, every occurrence of an outcome carrying T and its displayed subtree is hidden, while node-only tags do not affect Outcome Table visibility

    openQuestions: []

  - id: FR-WF-OT-003
    title: Expand and collapse workflowOutcome hierarchy in 'Outcome table'

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT
      - FIGMA-WF-OT-COURSE-COMPETENCY-MATRIX-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
      - anonymousViewer

    uiObjects:
      - workflowOutcomeTableView
      - workflowOutcomeTableGrid
      - workflowOutcomeTableNormalLayout
      - workflowOutcomeTableCompetencyMatrixLayout
      - workflowOutcomeTableOutcomeRowLabel
      - workflowOutcomeTableColumnHeader
      - workflowOutcomeTree
      - workflowOutcomeHeaderToggle
      - workflowOutcomeTableViewSettingsMenuItemExpandOutcomes
      - workflowOutcomeTableViewSettingsMenuItemCollapseOutcomes

    preconditions:
      - documentPreconditions for this file hold
      - workflowOutcomeTableGrid is rendered per FR-WF-OT-001 or FR-WF-OT-002
      - workflowOutcomeTree has at least one level-1 or level-2 workflowOutcome with at least one direct child per FR-WF-EO-008

    trigger:
      - user clicks workflowOutcomeHeaderToggle on a level-1 or level-2 workflowOutcome row or column label in workflowOutcomeTableGrid
      - user clicks workflowOutcomeTableViewSettingsMenuItemExpandOutcomes or workflowOutcomeTableViewSettingsMenuItemCollapseOutcomes in 'View settings' per FR-CAB-008

    mainFlow:
      - level-1 and level-2 workflowOutcome entries that have at least one direct child in workflowOutcomeTree expose workflowOutcomeHeaderToggle on workflowOutcomeTableOutcomeRowLabel when 'Normal' style is active and on workflowOutcomeTableColumnHeader when 'Competency matrix' style is active
      - on first entry to 'Outcome table' in a newly opened workflow, every expandable workflowOutcome is collapsed
      - when workflowOutcomeHeaderToggle on level-1 or level-2 workflowOutcome P is expanded, descendant workflowOutcome rows or columns nested under P are visible in workflowOutcomeTableGrid; when collapsed, those descendants are hidden
      - clicking workflowOutcomeTableViewSettingsMenuItemExpandOutcomes labeled 'Expand outcomes' sets every workflowOutcomeHeaderToggle in the active layout to expanded
      - clicking workflowOutcomeTableViewSettingsMenuItemCollapseOutcomes labeled 'Collapse outcomes' sets every workflowOutcomeHeaderToggle in the active layout to collapsed
      - expansion state is shared between workflowOutcomeTableNormalLayout and workflowOutcomeTableCompetencyMatrixLayout and is preserved while the actor changes table style or moves among sub-views within the same mounted workflow
      - expansion state resets to every expandable workflowOutcome collapsed when the actor leaves and later reopens the workflow, opens a different workflow, or reloads the page; expansion state is not persisted to backend data or browser storage

    roleBehavior: {}

    acceptanceCriteria:
      - given actor first enters Outcome Table in a newly opened workflow, every expandable level-1 and level-2 outcome is collapsed
      - given actor expands outcome P, every descendant nested under P becomes visible on the outcome axis; collapsing P hides those descendants in either table style
      - given actor selects 'Expand outcomes', every expandable outcome is expanded; selecting 'Collapse outcomes' collapses every expandable outcome
      - given actor changes between Normal and Competency matrix or moves among sub-views in the mounted workflow, each outcome's expansion state is preserved
      - given actor reopens the workflow, opens another workflow, or reloads the page, every expandable outcome resets to collapsed
      - given actor has read-only workflow access, individual and global expand/collapse controls remain actionable because they do not persist data

