  - id: FR-WF-OT-011
    title: Non-mutating Outcome Table presentation controls remain available in read-only modes

    designEvidence: []

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
      - anonymousViewer

    uiObjects:
      - workflowOutcomeTableView
      - workflowOutcomeTablePresentationControls
      - workflowOutcomeTableStyleTrigger
      - workflowOutcomeTableSortTrigger
      - workflowOutcomeTableViewSettingsMenuItemExpandOutcomes
      - workflowOutcomeTableViewSettingsMenuItemCollapseOutcomes
      - workflowOutcomeTableViewSettingsMenuTagsSection

    preconditions:
      - documentPreconditions for this file hold
      - workflowOutcomeTableView is visible

    trigger:
      - actor uses a table-style, sort, expand/collapse, or tag-filter control

    mainFlow:
      - workflowOutcomeTablePresentationControls change only the current browser presentation and never create, update, or delete backend data
      - every actor who can read workflowOutcomeTableView can use workflowOutcomeTablePresentationControls regardless of mutation permissions or workflow edit-lock ownership
      - for authenticated actors, workflowOutcomeTablePresentationControls are presented through contextActionBar per FR-CAB-008, FR-CAB-009, and FR-CAB-010
      - for anonymousViewer, the same presentation capabilities are available inside the public workflowOutcomeTableView without rendering the authenticated contextActionBar, top navigation, workflow right sidebar, or workflow dialogs
      - on first entry to 'Outcome table' in a newly opened workflow, presentation defaults are 'Normal' style, 'Chronological' sort, every expandable outcome collapsed, and every outcome tag toggled on
      - style, sort, outcome-expansion, and tag-toggle state is preserved while the actor changes table style or moves among sub-views within the same mounted workflow
      - all presentation state resets to the stated defaults when the actor leaves and later reopens the workflow, opens a different workflow, or reloads the page; presentation state is not persisted to backend data or browser storage
      - using workflowOutcomeTablePresentationControls never makes workflowOutcomeTableGridCell actionable when that cell is read-only under FR-WF-OT-005

    roleBehavior:
      owner:
        workflowOutcomeTablePresentationControls: available
      editor:
        workflowOutcomeTablePresentationControls: available
      commenter:
        workflowOutcomeTablePresentationControls: available
      viewer:
        workflowOutcomeTablePresentationControls: available
      user:
        workflowOutcomeTablePresentationControls: available
      anonymousViewer:
        workflowOutcomeTablePresentationControls: available without authenticated application chrome

    acceptanceCriteria:
      - given any actor who can read Outcome Table, table style, sorting, expand/collapse, and outcome-tag filtering controls are visible and enabled regardless of mutation permission or edit-lock ownership
      - given an authenticated actor, presentation controls are exposed in contextActionBar; given anonymousViewer, equivalent controls are exposed within the public Outcome Table and authenticated application chrome remains absent
      - given actor uses any presentation control, only the current browser presentation changes and no create, update, or delete request for workflow data is submitted
      - given actor first enters Outcome Table in a newly opened workflow, defaults are Normal style, Chronological sort, all expandable outcomes collapsed, and all outcome tags on
      - given actor changes presentation state and moves among sub-views or table styles inside the mounted workflow, style, sort, expansion, and tag state are preserved
      - given actor leaves and later reopens the workflow, opens a different workflow, or reloads the page, all presentation state returns to the defaults and no prior state is restored from backend or browser storage
      - given an assignment cell is read-only under FR-WF-OT-005, using presentation controls never makes that cell actionable

    openQuestions: []

