# Normalized requirements: workflow 'Outcome table' sub-view
# Status: Active functional requirements.
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Outcome table row in sidebar matrix — values missing in export); Figma CourseFlow-2.0 frames (see designEvidenceLinkTable); engineering interview 2026-06-25
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Scope (this file): 'Outcome table' sub-view content on route '/workflow/{id}/outcome-table' for course and program workflows; 'Normal' and 'Competency matrix' style presentations; outcome tag grouping on the grid; Competency matrix summary columns; expand/collapse; Normal outcome-style cell semantics; assignment toggling from table cells; sticky scroll regions. Out of scope: Advanced outcome-style cell semantics (I/D/A indicators) and activity workflows. Header tab entry is governed by tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml FR-WF-HEADER-003; authenticated contextActionBar controls are governed by tests/docs/requirements/features/global/context_action_bar_requirements_v1.yaml FR-CAB-008 through FR-CAB-010.
# Cross-reference:
#   - tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml (workflowOutcomeTableTab, tab enablement, and navigation — FR-WF-HEADER-003)
#   - tests/docs/requirements/features/global/context_action_bar_requirements_v1.yaml ('View settings', table style, and 'Sort' on contextActionBar — FR-CAB-008, FR-CAB-009, FR-CAB-010)
#   - tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml (FR-WF-RS-001 whitelist — sidebar only on '/workflow/{id}/graph' and '/workflow/{id}/outcomes'; '/workflow/{id}/outcome-table' is out of scope for sidebar; Overview also has no sidebar)
#   - tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml (workflowView — 'Workflow' sub-view on '/workflow/{id}/graph')
#   - tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml (workflowOutcome, workflowOutcomeTree, workflowOutcomeHeaderTitle, workflowOutcomeHeaderToggle — FR-WF-EO-007; outcome hierarchy expand/collapse)
#   - tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml (workflowNode, workflowEditNodeFormTimeField, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, workflowEditNodeFormPonderationIndividualField, workflowEditNodeFormSpecificEducationSwitch — program Competency matrix column values)
#   - tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml (workflowChannel node-category colour — FR-CHAN-003; workflowOutcomeTableNodeChannelColorBand)
#   - tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (workflowSectionContainer)
#   - tests/docs/requirements/features/workflow/workflow_assign_outcome_to_node_requirements_v1.yaml (outcome-to-node assignment on 'Workflow' sub-view — FR-WF-AO-004, FR-WF-AO-006, FR-WF-AO-010; tag grouping parity on assign tab — FR-WF-AO-002; shared assignment state with 'Outcome table' per FR-WF-OT-007)
#   - tests/docs/requirements/features/project/project_overview_requirements_v1.yaml (projectTagsSection, projectTagItem — tag catalog per FR-PROJ-OV-005; in-use tags on workflowOutcomeTableViewSettingsMenuTagsSection per FR-CAB-008)
#   - tests/docs/requirements/features/workflow/workflow_overview_requirements_v1.yaml (program classification and ponderation overview fields — related metadata domain for program Competency matrix columns)
#   - tests/docs/requirements/features/global/workspace_access_requirements_v1.yaml (denied access — FR-WS-ACCESS-002)
#   - tests/docs/requirements/features/global/workspace_edit_lock_requirements_v1.yaml (workflow mutation controls require the current edit lock — FR-WS-LOCK-001 onward)
#   - tests/docs/requirements/features/workflow/workflow_public_link_requirements_v1.yaml (anonymous read-only Outcome Table access — FR-WF-PUBLIC-002)
#   - tests/docs/requirements/features/workflow/workflow_duration_requirements_v1.yaml (normalized Days + Hours display and arithmetic for node and section duration values — FR-WF-DURATION-001 through FR-WF-DURATION-003)

documentPreconditions:
  - actor is one of (a) authenticated owner, editor, commenter, or viewer with an explicit contributor role on the parent project of the workflow, (b) authenticated user (published-access, no explicit contributor role) viewing a workflow whose parent project is published, or (c) anonymousViewer viewing a workflow whose workflow-specific public-link mode is enabled per tests/docs/requirements/features/workflow/workflow_public_link_requirements_v1.yaml FR-WF-PUBLIC-002
  - current workflow is a course or program workflow
  - current route matches '/workflow/{id}/outcome-table'
  - workflowOutcomeTableTab eligibility per tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml FR-WF-HEADER-003 holds (at least one workflowOutcome and at least one workflowNode; tab enabled)
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002
  - anonymousViewer sees workflowOutcomeTableView read-only and cannot persist outcome-to-node assignment or any other workflow change

uiObjectDefinitions:
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml.
  workflowOutcomeTree:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml.
  workflowSectionHeader:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml.
  projectTagItem:
    meaning: Canonical definition in tests/docs/requirements/features/project/project_overview_requirements_v1.yaml.
  workflowOutcomeTableTab:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml.
  workflowOutcomeTableView:
    meaning: Main content region of the 'Outcome table' sub-view on route '/workflow/{id}/outcome-table'.
  workflowOutcomeTableGrid:
    meaning: Scrollable outcome–node assignment matrix inside workflowOutcomeTableView.
  workflowOutcomeTableNormalLayout:
    meaning: "'Normal' style variant of workflowOutcomeTableGrid."
  workflowOutcomeTableCompetencyMatrixLayout:
    meaning: "'Competency matrix' style variant of workflowOutcomeTableGrid."
  workflowOutcomeTableOutcomeTagGroupBand:
    meaning: Group band on the outcome axis of workflowOutcomeTableGrid for one outcome tag group.
  workflowOutcomeTableSectionGroupBand:
    meaning: Group band in workflowOutcomeTableGrid labeling one workflowSectionContainer from workflowView.
  workflowOutcomeTableSectionOutcomeCell:
    meaning: Read-only cell at the intersection of one workflowOutcome and one workflowSectionContainer in workflowOutcomeTableGrid.
  workflowOutcomeTableSectionRow:
    meaning: Section header row for one workflowSectionContainer in 'Competency matrix' style workflowOutcomeTableGrid.
  workflowOutcomeTableSectionTotalHoursCell:
    meaning: Read-only summary cell in workflowOutcomeTableSectionRow under workflowOutcomeTableTotalHoursColumn.
  workflowOutcomeTableOutcomeRowLabel:
    meaning: Sticky left row label for one workflowOutcome in 'Normal' style workflowOutcomeTableGrid.
  workflowOutcomeTableColumnHeader:
    meaning: Angled header cell on the column axis of workflowOutcomeTableGrid.
  workflowOutcomeTableNodeRowLabel:
    meaning: Sticky left row label for one workflowNode in 'Competency matrix' style workflowOutcomeTableGrid.
  workflowOutcomeTableNodeChannelColorBand:
    meaning: Left-edge colour stripe on a workflowNode label or header in workflowOutcomeTableGrid.
  workflowChannel:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowOutcomeTableGridCell:
    meaning: Intersection cell in workflowOutcomeTableGrid for one workflowOutcome and one workflowNode pair; exposes checkbox semantics and an accessible name containing the full outcome and node titles.
  workflowOutcomeTableGridCellCompleteIndicator:
    meaning: Solid checkmark icon within workflowOutcomeTableGridCell.
  workflowOutcomeTableGridCellPartialIndicator:
    meaning: Semi-transparent checkmark icon within workflowOutcomeTableGridCell.
  workflowOutcomeTableGridCellFocusBorder:
    meaning: Visible focus outline on an actionable workflowOutcomeTableGridCell when it has keyboard focus matching :focus-visible.
  workflowOutcomeTableTruncatedLabelTooltip:
    meaning: Tooltip showing the full localized label for a truncated workflowOutcomeTableOutcomeRowLabel, workflowOutcomeTableColumnHeader, or workflowOutcomeTableNodeRowLabel on pointer hover or keyboard focus.
  workflowOutcomeTableTotalHoursColumn:
    meaning: Read-only summary column labeled 'Total hours' in 'Competency matrix' style workflowOutcomeTableGrid.
  workflowOutcomeTableProgramClassificationHeaderGroup:
    meaning: Program-only column group header labeled 'Classification' in 'Competency matrix' style workflowOutcomeTableGrid.
  workflowOutcomeTableProgramGeneralEducationColumn:
    meaning: Program-only read-only column labeled 'General education' under workflowOutcomeTableProgramClassificationHeaderGroup.
  workflowOutcomeTableProgramSpecificEducationColumn:
    meaning: Program-only read-only column labeled 'Specific education' under workflowOutcomeTableProgramClassificationHeaderGroup.
  workflowOutcomeTableProgramPonderationHeaderGroup:
    meaning: Program-only column group header labeled 'Ponderation' in 'Competency matrix' style workflowOutcomeTableGrid.
  workflowOutcomeTableProgramPonderationTheoryColumn:
    meaning: Program-only read-only column labeled 'Theory' under workflowOutcomeTableProgramPonderationHeaderGroup.
  workflowOutcomeTableProgramPonderationPracticalColumn:
    meaning: Program-only read-only column labeled 'Practical' under workflowOutcomeTableProgramPonderationHeaderGroup.
  workflowOutcomeTableProgramPonderationIndividualColumn:
    meaning: Program-only read-only column labeled 'Individual work' under workflowOutcomeTableProgramPonderationHeaderGroup.
  workflowOutcomeTableProgramPonderationTotalHoursColumn:
    meaning: Program-only read-only column labeled 'Total hours' under workflowOutcomeTableProgramPonderationHeaderGroup.
  workflowOutcomeTableProgramCreditsColumn:
    meaning: Program-only read-only column labeled 'Credits' in 'Competency matrix' style workflowOutcomeTableGrid.
  workflowEditNodeFormCreditsField:
