requirements:
  - id: FR-WF-OT-001
    title: Layout of 'Normal' style on 'Outcome table'

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
      - anonymousViewer

    uiObjects:
      - workflowOutcomeTableView
      - workflowOutcomeTableGrid
      - workflowOutcomeTableNormalLayout
      - workflowOutcomeTableOutcomeTagGroupBand
      - workflowOutcomeTableSectionGroupBand
      - workflowOutcomeTableSectionOutcomeCell
      - workflowOutcomeTableOutcomeRowLabel
      - workflowOutcomeTableColumnHeader
      - workflowOutcomeTableNodeChannelColorBand
      - workflowOutcomeTableGridCell
      - workflowOutcomeTableTruncatedLabelTooltip
      - workflowOutcomeTree
      - workflowView
      - workflowNode
      - workflowChannel
      - workflowSectionContainer
      - workflowSectionHeader
      - projectTagItem
      - workflowEditOutcomeFormTagsAutocomplete

    preconditions:
      - documentPreconditions for this file hold

    trigger:
      - user navigates to 'Outcome table' sub-view
      - user selects 'Normal' on workflowOutcomeTableStyleTrigger per FR-CAB-010

    mainFlow:
      - workflowOutcomeTableView renders workflowOutcomeTableGrid as a scrollable matrix of workflowOutcomeTableGridCell entries at every workflowOutcome and workflowNode pair, plus workflowOutcomeTableSectionOutcomeCell entries at every workflowOutcome and workflowSectionContainer pair
      - workflowOutcomeTableGrid uses workflowOutcomeTableNormalLayout — row axis is workflowOutcomeTree hierarchy grouped under workflowOutcomeTableOutcomeTagGroupBand per FR-WF-OT-008; column axis is workflowNode entries from workflowView grouped under workflowOutcomeTableSectionGroupBand (one band per workflowSectionContainer); workflowNode order on the column axis per FR-CAB-009 default sort
      - within each workflowOutcomeTableSectionGroupBand, the leftmost column is workflowOutcomeTableSectionOutcomeCell (one read-only cell per workflowOutcome row, assignment rollup per FR-WF-OT-006) followed by workflowOutcomeTableColumnHeader entries for each workflowNode in that section
      - each workflowOutcomeTableOutcomeRowLabel shows workflowOutcomeHeaderTitle with hierarchical numbering per FR-WF-EO-007
      - each workflowOutcomeTableColumnHeader for a workflowNode shows the workflowNode title from workflowView, workflowOutcomeTableNodeChannelColorBand on the left edge coloured per the node's parent workflowChannel per FR-CHAN-003, and is angled
      - when a workflowOutcomeTableOutcomeRowLabel or workflowOutcomeTableColumnHeader is visually truncated, pointer hover or keyboard focus shows workflowOutcomeTableTruncatedLabelTooltip containing the full localized label; no tooltip is attached to workflowOutcomeTableGridCell
      - each workflowOutcomeTableSectionGroupBand displays workflowSectionTitleText for the corresponding workflowSectionContainer in workflowView on the 'Workflow' sub-view

    roleBehavior: {}

    acceptanceCriteria:
      - given Normal style is active, workflowOutcomeTableGrid has outcome hierarchy rows grouped by outcome tag on the vertical axis and node columns grouped by workflow section on the horizontal axis
      - given section S contains nodes, S's group starts with one read-only section-rollup column followed by one column for each node in the selected FR-CAB-009 order
      - given an outcome row, its sticky row header shows the full hierarchical numbered outcome title and each node column header shows the node title and its channel colour stripe
      - given a truncated outcome row label or node column header, pointer hover and keyboard focus show the full localized label in workflowOutcomeTableTruncatedLabelTooltip and no assignment cell opens that tooltip
      - given Normal style renders, workflowOutcomeTableGrid exposes role='grid', tag and section bands expose named groups, outcome labels expose rowheader semantics, and node headers expose columnheader semantics

    openQuestions: []

  - id: FR-WF-OT-002
    title: Layout of 'Competency matrix' style on 'Outcome table'

    designEvidence:
      - FIGMA-WF-OT-COURSE-COMPETENCY-MATRIX-SCROLLED-LEFT
      - FIGMA-WF-OT-COURSE-COMPETENCY-MATRIX-SCROLLED-RIGHT
      - FIGMA-WF-OT-PROGRAM-COMPETENCY-MATRIX-SCROLLED-RIGHT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
      - anonymousViewer

    uiObjects:
      - workflowOutcomeTableView
      - workflowOutcomeTableGrid
      - workflowOutcomeTableCompetencyMatrixLayout
      - workflowOutcomeTableOutcomeTagGroupBand
      - workflowOutcomeTableSectionGroupBand
      - workflowOutcomeTableSectionOutcomeCell
      - workflowOutcomeTableSectionRow
      - workflowOutcomeTableSectionTotalHoursCell
      - workflowOutcomeTableNodeRowLabel
      - workflowOutcomeTableColumnHeader
      - workflowOutcomeTableNodeChannelColorBand
      - workflowOutcomeTableGridCell
      - workflowOutcomeTableTruncatedLabelTooltip
      - workflowOutcomeTableTotalHoursColumn
      - workflowOutcomeTableProgramClassificationHeaderGroup
      - workflowOutcomeTableProgramGeneralEducationColumn
      - workflowOutcomeTableProgramSpecificEducationColumn
      - workflowOutcomeTableProgramPonderationHeaderGroup
      - workflowOutcomeTableProgramPonderationTheoryColumn
      - workflowOutcomeTableProgramPonderationPracticalColumn
      - workflowOutcomeTableProgramPonderationIndividualColumn
      - workflowOutcomeTableProgramPonderationTotalHoursColumn
      - workflowOutcomeTableProgramCreditsColumn
      - workflowOutcomeTree
      - workflowView
      - workflowNode
      - workflowChannel
      - workflowSectionContainer
      - workflowSectionHeader
      - projectTagItem
      - workflowEditOutcomeFormTagsAutocomplete

    preconditions:
      - documentPreconditions for this file hold

    trigger:
      - user navigates to 'Outcome table' sub-view
      - user selects 'Competency matrix' on workflowOutcomeTableStyleTrigger per FR-CAB-010

    mainFlow:
      - workflowOutcomeTableView renders workflowOutcomeTableGrid as a scrollable matrix of workflowOutcomeTableGridCell entries at every workflowOutcome and workflowNode pair, plus workflowOutcomeTableSectionOutcomeCell entries at every workflowOutcome and workflowSectionContainer pair
      - workflowOutcomeTableGrid uses workflowOutcomeTableCompetencyMatrixLayout — row axis is workflowNode entries from workflowView grouped under workflowOutcomeTableSectionGroupBand (one band per workflowSectionContainer); column axis is workflowOutcomeTree hierarchy grouped under workflowOutcomeTableOutcomeTagGroupBand per FR-WF-OT-008; workflowNode order on the row axis per FR-CAB-009 default sort
      - within each workflowOutcomeTableSectionGroupBand, workflowOutcomeTableSectionRow for that workflowSectionContainer contains one read-only workflowOutcomeTableSectionOutcomeCell per visible workflowOutcome column (assignment rollup per FR-WF-OT-006), read-only section totals in summary columns per FR-WF-OT-009 or FR-WF-OT-010, followed by workflowOutcomeTableNodeRowLabel rows for each workflowNode in that section
      - each workflowOutcomeTableSectionRow displays workflowSectionTitleText for the corresponding workflowSectionContainer in workflowView on the 'Workflow' sub-view
      - each workflowOutcomeTableNodeRowLabel shows the workflowNode title from workflowView and workflowOutcomeTableNodeChannelColorBand on the left edge coloured per the node's parent workflowChannel per FR-CHAN-003
      - each workflowOutcomeTableColumnHeader for a workflowOutcome shows workflowOutcomeHeaderTitle with hierarchical numbering per FR-WF-EO-007 and is angled
      - when a workflowOutcomeTableNodeRowLabel or workflowOutcomeTableColumnHeader is visually truncated, pointer hover or keyboard focus shows workflowOutcomeTableTruncatedLabelTooltip containing the full localized label; no tooltip is attached to workflowOutcomeTableGridCell
      - on course workflows, workflowOutcomeTableCompetencyMatrixLayout includes read-only workflowOutcomeTableTotalHoursColumn only; column values and section totals per FR-WF-OT-009
      - on program workflows, workflowOutcomeTableCompetencyMatrixLayout includes read-only workflowOutcomeTableProgramClassificationHeaderGroup spanning workflowOutcomeTableProgramGeneralEducationColumn and workflowOutcomeTableProgramSpecificEducationColumn; workflowOutcomeTableProgramPonderationHeaderGroup spanning workflowOutcomeTableProgramPonderationTheoryColumn, workflowOutcomeTableProgramPonderationPracticalColumn, workflowOutcomeTableProgramPonderationIndividualColumn, and workflowOutcomeTableProgramPonderationTotalHoursColumn; and workflowOutcomeTableProgramCreditsColumn; workflowOutcomeTableProgramClassificationHeaderGroup and workflowOutcomeTableProgramPonderationHeaderGroup are group separators only, not data columns; column values and section totals per FR-WF-OT-010

    roleBehavior: {}

    acceptanceCriteria:
      - given Competency matrix style is active, workflowOutcomeTableGrid has node rows grouped by workflow section on the vertical axis and hierarchical outcome columns grouped by outcome tag on the horizontal axis
      - given section S renders, its section row contains one read-only rollup cell for each visible outcome column, the applicable course or program summary columns, and then one row for each node in the selected FR-CAB-009 order
      - given a node row, its sticky row header shows the full node title and channel colour stripe; each outcome column header shows the full hierarchical numbered outcome title
      - given a course workflow, Competency matrix renders the Total hours summary column and does not render program-only summary groups or columns
      - given a program workflow, Competency matrix renders Classification with General education and Specific education, Ponderation with Theory, Practical, Individual work, and Total hours, plus Credits
      - given a truncated node row label or outcome column header, pointer hover and keyboard focus show the full localized label in workflowOutcomeTableTruncatedLabelTooltip and no assignment cell opens that tooltip

    openQuestions: []

  - id: FR-WF-OT-009
    title: Course summary columns in 'Competency matrix' style on 'Outcome table'

    designEvidence:
      - FIGMA-WF-OT-COURSE-COMPETENCY-MATRIX-SCROLLED-RIGHT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
      - anonymousViewer

    uiObjects:
      - workflowOutcomeTableCompetencyMatrixLayout
      - workflowOutcomeTableSectionRow
      - workflowOutcomeTableSectionTotalHoursCell
      - workflowOutcomeTableTotalHoursColumn
      - workflowOutcomeTableNodeRowLabel
      - workflowSectionContainer
      - workflowNode
      - workflowEditNodeFormTimeField

    preconditions:
      - documentPreconditions for this file hold
      - current workflow is a course workflow
      - workflowOutcomeTableCompetencyMatrixLayout is active per FR-WF-OT-002

    trigger:
      - system renders summary columns in workflowOutcomeTableCompetencyMatrixLayout on a course workflow

    mainFlow:
      - per workflowNode row, workflowOutcomeTableTotalHoursColumn cell displays workflowEditNodeFormTimeField for that workflowNode using the normalized localized Days + Hours presentation from FR-WF-DURATION-002 and FR-WF-DURATION-003
      - an unset per-node workflowEditNodeFormTimeField displays an em dash, while an explicit zero displays the localized zero-duration value
      - workflowOutcomeTableSectionTotalHoursCell on workflowOutcomeTableSectionRow for workflowSectionContainer S converts each set workflowEditNodeFormTimeField to whole hours, sums all workflowNode entries in S, and normalizes the result to localized Days + Hours per FR-WF-DURATION-002
      - an unset duration contributes zero when at least one node in S has a set duration; when every node duration in S is unset, workflowOutcomeTableSectionTotalHoursCell displays an em dash instead of zero

    roleBehavior: {}

    acceptanceCriteria:
      - given a course node time of 1 day and 2 hours, its Total hours cell displays the localized normalized equivalent of 1 day and 2 hours
      - given a course node has unset time, its Total hours cell displays an em dash; given explicit zero time, the cell displays the localized zero-duration value
      - given section S contains node times of 1 day 20 hours and 10 hours, S's total displays the localized normalized equivalent of 2 days and 6 hours
      - given S contains one set duration and one unset duration, the unset duration contributes zero to S's total
      - given every node time in S is unset, S's total displays an em dash rather than zero

