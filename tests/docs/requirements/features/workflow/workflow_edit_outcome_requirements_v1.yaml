# Normalized requirements: create and edit a workflowOutcome in the workflowOutcomeView ('Outcomes' view), including workflowEditOutcomeForm rendered in the right-sidebar Edit tab
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Scope (this file): creating an outcome from the workflowOutcomeView (empty state and hover-menu inserts), editing an outcome's fields via workflowEditOutcomeForm in the right sidebar Edit tab, and outcome header selection chrome (FR-WF-EO-018). Out of scope (companion FRs in other files): deleting an outcome (tests/docs/requirements/features/workflow/workflow_delete_outcome_requirements_v1.yaml), duplicating an outcome (tests/docs/requirements/features/workflow/workflow_duplicate_outcome_requirements_v1.yaml), drag-and-drop reorder/reparent/nest in workflowOutcomeTree (tests/docs/requirements/features/workflow/workflow_outcome_tree_drag_reorder_requirements_v1.yaml — FR-WF-EO-015 through FR-WF-EO-017), outcome-to-node assignment (workflowRightSidebar Outcomes tab in 'Workflow' view), outcome filter via View settings, and commenting on an outcome.
# Cross-reference: tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar, workflowRightSidebarEditTab, workflowRightSidebarEditTabContent — FR-WF-RS-001, FR-WF-RS-002, FR-WF-RS-004); tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml (workflowOutcomeHoverActionsMenu gating — FR-WF-NODE-004, FR-WF-NODE-005); tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml (sidebar Edit-tab patterns; workflowEditNodeFormTagsAutocomplete; workflowRichTextDescriptionEditor and FR-WF-EN-012 for workflowEditOutcomeFormDescriptionField); tests/docs/requirements/features/project/project_overview_requirements_v1.yaml (projectTagsSection, projectTagItem — canonical project-level tag catalog shared by workflowEditNodeFormTagsAutocomplete and workflowEditOutcomeFormTagsAutocomplete; catalog deletion removes tag from level-1 outcomes per FR-PROJ-OV-005); tests/docs/requirements/features/workflow/workflow_comments_tab_requirements_v1.yaml (comments tab for a workflowOutcome host object — FR-WF-COMMENTS-004; entry via hover-menu Comments item, deferred to that file); tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml (published-access vs contributor-role gating for the '/workflow/{id}/outcomes' route); tests/docs/requirements/features/workflow/workflow_outcome_tree_drag_reorder_requirements_v1.yaml (workflowOutcomeTree drag reorder — FR-WF-EO-015 through FR-WF-EO-017); tests/docs/requirements/guidelines_functional_requirements.md

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/outcomes'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

uiObjectDefinitions:
  workflowOutcomeView:
    meaning: Main content region of the 'Outcomes' view of a workflow.
  workflowOutcomeViewEmptyState:
    meaning: First-run region inside workflowOutcomeView for a workflow with no workflowOutcome entries.
  workflowOutcomeViewEmptyStateAlert:
    meaning: Informational alert inside workflowOutcomeViewEmptyState with literal title 'How to use outcomes' and body copy per FR-WF-EO-001.
  workflowOutcomeViewAddOutcomeButton:
    meaning: Action button inside workflowOutcomeViewEmptyState labeled 'Add outcome'.
  workflowOutcomeTree:
    meaning: Hierarchical list of workflowOutcome entries inside workflowOutcomeView.
  workflowOutcome:
    meaning: One outcome entity rendered as an entry in workflowOutcomeTree.
  workflowOutcomeHeader:
    meaning: Header strip of a workflowOutcome.
  workflowOutcomeHeaderSelectedBorder:
    meaning: Selection outline on workflowOutcomeHeader when workflowRightSidebar is bound to that workflowOutcome (Edit or Comments tab); parallel role to workflowNodeSelectedBorder per FR-WF-NODE-002.
  workflowOutcomeHeaderTitle:
    meaning: Title label inside workflowOutcomeHeader.
  workflowOutcomeHeaderTagChips:
    meaning: Chip group inside workflowOutcomeHeader for the workflowOutcome's assigned tag labels.
  workflowOutcomeHeaderToggle:
    meaning: Expand/collapse control inside workflowOutcomeHeader for the workflowOutcome's child entries.
  workflowOutcomeHoverActionsMenu:
    meaning: Floating icon-button group attached to workflowOutcomeHeader exposing per-outcome actions.
  workflowOutcomeHoverActionsMenuInsertSiblingItem:
    meaning: Hover-menu item on workflowOutcomeHoverActionsMenu with tooltip 'Insert outcome below'.
  workflowOutcomeHoverActionsMenuInsertChildItem:
    meaning: Hover-menu item on workflowOutcomeHoverActionsMenu with tooltip 'Insert child outcome'.
  workflowOutcomeHoverActionsMenuDuplicateItem:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_duplicate_outcome_requirements_v1.yaml.
  workflowOutcomeHoverActionsMenuDeleteItem:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_delete_outcome_requirements_v1.yaml.
  workflowOutcomeHoverActionsMenuCommentsItem:
    meaning: Hover-menu item on workflowOutcomeHoverActionsMenu with tooltip 'Comments'.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTab:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTabContent:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarCommentsTab:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarCommentsTabContent:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowEditOutcomeForm:
    meaning: Form inside workflowRightSidebarEditTabContent bound to the selected workflowOutcome.
  workflowEditOutcomeFormHeading:
    meaning: Heading inside workflowEditOutcomeForm with literal copy 'Edit outcome'.
  workflowEditOutcomeFormTitleField:
    meaning: Optional single-line text input inside workflowEditOutcomeForm labeled 'Title'.
  workflowEditOutcomeFormDescriptionField:
    meaning: Description field region on workflowEditOutcomeForm labeled 'Description'; contains workflowRichTextDescriptionEditor per FR-WF-EN-012 (canonical editor definition in workflow_edit_node_requirements_v1.yaml).
  workflowEditOutcomeFormCodeField:
    meaning: Optional single-line text input inside workflowEditOutcomeForm labeled 'Code'.
  workflowEditOutcomeFormTagsAutocomplete:
    meaning: Optional multi-select tag autocomplete inside workflowEditOutcomeForm labeled 'Tags' whose option list is the project-level tag catalog defined in tests/docs/requirements/features/project/project_overview_requirements_v1.yaml (projectTagsSection, projectTagItem).
  workflowEditOutcomeFormDuplicateButton:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_duplicate_outcome_requirements_v1.yaml.
  workflowEditOutcomeFormDeleteButton:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_delete_outcome_requirements_v1.yaml.

