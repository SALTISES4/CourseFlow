# Normalized requirements: edit an existing workflowNode via workflowRightSidebarEditTab / workflowRightSidebarEditTabContent ('Workflow' view), including link-workflow dialog (course → activity, program → course)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Nodes — Node Metadata; Node Actions — Link a Workflow)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar / Edit tab — FR-WF-RS-001, FR-WF-RS-002, FR-WF-RS-003)
#   - tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml (add-node drops — FR-WF-ADD-004, FR-WF-ADD-005, FR-WF-ADD-006)
#   - tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (workflowSectionContainer — FR-SEC-*)
#   - tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml (canvas layout and chrome — FR-WF-NODE-001, FR-WF-NODE-002, FR-WF-NODE-003)
#   - tests/docs/requirements/features/project/project_overview_requirements_v1.yaml (projectTagsSection — tag catalog for workflowEditNodeFormTagsAutocomplete; catalog deletion removes tag from nodes per FR-PROJ-OV-005)
#   - tests/docs/requirements/features/workflow/workflow_overview_requirements_v1.yaml (duration and overview totals — FR-WF-OV-003 through FR-WF-OV-006; Workflow-tab edits reflected on Overview — FR-WF-OV-010)
#   - tests/docs/requirements/features/workflow/workflow_duplicate_node_requirements_v1.yaml (workflowEditNodeFormDuplicateButton — FR-WF-DUP-001)
#   - tests/docs/requirements/features/workflow/workflow_delete_node_requirements_v1.yaml (workflowEditNodeFormDeleteButton — FR-WF-DEL-*)
#   - tests/docs/requirements/features/shared/card_content_requirements_v1.yaml (workflowCard in link dialog — FR-CARD-*)
#   - tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml (workflowEditOutcomeFormDescriptionField hosts workflowRichTextDescriptionEditor per FR-WF-EN-012)
#   - tests/docs/requirements/features/project/project_create_form_requirements_v1.yaml (projectDescriptionField hosts workflowRichTextDescriptionEditor per FR-WF-EN-012)
#   - tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml (projectDescriptionField in editProjectDialog per FR-WF-EN-012)
#   - tests/docs/requirements/features/workflow/workflow_create_stepped_form_requirements_v1.yaml (workflowDescriptionField hosts workflowRichTextDescriptionEditor per FR-WF-EN-012)
#   - tests/docs/requirements/features/workflow/workflow_edit_form_requirements_v1.yaml (workflowDescriptionField in editWorkflowDialog per FR-WF-EN-012)
#   - tests/docs/requirements/features/workflow/workflow_archive_requirements_v1.yaml (archive breaks parent node links and retains displayed node data—FR-WF-ARCH-003; batch project archive preserves links—FR-PROJ-ARCH-003)
#   - tests/docs/requirements/features/workflow/workflow_copy_requirements_v1.yaml (cross-project copy link break matches FR-WF-ARCH-003; same-project copy preserves links—FR-WF-COPY-003)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/graph'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - requirements in this file assume documentPreconditions above hold; when they do not, assert per FR-WS-ACCESS-002
  - field editing and link/remove-workflow actions in this file apply to owner and editor unless an FR states read-only presentation for other actors

uiObjectDefinitions:
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml.
  workflowNode:
    meaning: Placed workflow content unit at one workflowSectionRow × workflowChannel cell inside a workflowSectionContainer.
  workflowNodeTitle:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml.
  workflowNodeMeta:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml.
  workflowNodeLinkedWorkflowIndicator:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTab:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTabContent:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarAddTab:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowEditNodeForm:
    meaning: Right-sidebar edit form for the bound workflowNode's metadata and node-scoped actions.
  workflowEditNodeFormHeading:
    meaning: Heading on workflowEditNodeForm with text 'Edit node'.
  workflowEditNodeFormTitleField:
    meaning: Single-line title input on workflowEditNodeForm labeled 'Title' for the bound workflowNode; shows display fallback 'Untitled node' when persisted title is empty.
  workflowEditNodeFormDescriptionField:
    meaning: Description field region on workflowEditNodeForm labeled 'Description'; contains workflowRichTextDescriptionEditor per FR-WF-EN-012.
  workflowRichTextDescriptionEditor:
    meaning: Shared rich-text editor surface; hosts workflowRichTextDescriptionEditorToolbar and an editable content region; used inside workflowEditNodeFormDescriptionField, workflowEditOutcomeFormDescriptionField, projectDescriptionField, and workflowDescriptionField per FR-WF-EN-012.
  workflowRichTextDescriptionEditorToolbar:
    meaning: Formatting toolbar on workflowRichTextDescriptionEditor; exposes exactly the controls listed in FR-WF-EN-012 and no others.
  workflowRichTextDescriptionEditorBoldButton:
    meaning: Toolbar control on workflowRichTextDescriptionEditorToolbar that toggles bold on the current selection.
  workflowRichTextDescriptionEditorItalicButton:
    meaning: Toolbar control on workflowRichTextDescriptionEditorToolbar that toggles italic on the current selection.
  workflowRichTextDescriptionEditorUnderlineButton:
    meaning: Toolbar control on workflowRichTextDescriptionEditorToolbar that toggles underline on the current selection.
  workflowRichTextDescriptionEditorSuperscriptButton:
    meaning: Toolbar control on workflowRichTextDescriptionEditorToolbar that applies superscript to the current selection.
  workflowRichTextDescriptionEditorSubscriptButton:
    meaning: Toolbar control on workflowRichTextDescriptionEditorToolbar that applies subscript to the current selection.
  workflowRichTextDescriptionEditorBulletListButton:
    meaning: Toolbar control on workflowRichTextDescriptionEditorToolbar that toggles a bulleted list for the current block or selection.
  workflowRichTextDescriptionEditorNumberedListButton:
    meaning: Toolbar control on workflowRichTextDescriptionEditorToolbar that toggles a numbered list for the current block or selection.
  workflowRichTextDescriptionEditorLinkButton:
    meaning: Toolbar control on workflowRichTextDescriptionEditorToolbar that inserts or edits a hyperlink on the current selection per FR-WF-EN-012.
  workflowRichTextDescriptionEditorLinkDialog:
    meaning: Inline or modal prompt opened from workflowRichTextDescriptionEditorLinkButton for entering or editing a hyperlink URL.
  workflowEditNodeFormActivityContextSelect:
    meaning: Context select on workflowEditNodeForm labeled 'Context'; activity parent workflow type only; options are 'None', 'Individual Work', 'Work in Groups', and 'Whole Class'.
  workflowEditNodeFormCourseContextSelect:
    meaning: Context select on workflowEditNodeForm labeled 'Context'; course parent workflow type only; options are 'None', 'Formative', 'Summative', and 'Comprehensive'.
  workflowEditNodeFormTaskTypeSelect:
    meaning: Task-type select on workflowEditNodeForm labeled 'Task'; activity parent workflow type only; options are 'None', 'Gather Information', 'Discuss', 'Problem Solve', 'Analyze', 'Assess/Review Peers', 'Debate', 'Game/Roleplay', 'Create/Design', 'Revise/Improve', 'Read', 'Write', 'Present', 'Experiment/Inquiry', 'Quiz/Test', 'Instructor Resource Curation', 'Instructor Orchestration', 'Instructor Evaluation', and 'Other'.
  workflowEditNodeFormTimeField:
    meaning: Duration input on workflowEditNodeForm labeled 'Time'.
  workflowEditNodeFormCreditsField:
    meaning: Numeric input on workflowEditNodeForm labeled 'Credits'; program workflow type only.
  workflowEditNodeFormTagsAutocomplete:
    meaning: Tags multi-select autocomplete on workflowEditNodeForm labeled 'Tags'.
  workflowEditNodeFormPonderationGroup:
    meaning: Field group on workflowEditNodeForm with heading 'Ponderation'; program workflow type only.
  workflowEditNodeFormPonderationTheoryField:
    meaning: Numeric input inside workflowEditNodeFormPonderationGroup labeled 'Hrs. theory'.
  workflowEditNodeFormPonderationPracticeField:
    meaning: Numeric input inside workflowEditNodeFormPonderationGroup labeled 'Hrs. practice'.
  workflowEditNodeFormPonderationIndividualField:
    meaning: Numeric input inside workflowEditNodeFormPonderationGroup labeled 'Hrs. individual'.
  workflowEditNodeFormSpecificEducationSwitch:
    meaning: Binary switch on workflowEditNodeForm labeled 'Specific education'; program workflow type only.
  workflowEditNodeFormLinkWorkflowButton:
    meaning: Link-or-remove-workflow action button in workflowEditNodeForm's action area; labeled 'Link an activity' when parent workflow type is course and the workflowNode has no linked workflow, 'Link a course' when parent workflow type is program and unlinked, 'Remove linked activity' when course parent and linked, or 'Remove linked course' when program parent and linked.
  workflowEditNodeFormDuplicateButton:
    meaning: Duplicate button on workflowEditNodeForm labeled 'Duplicate'.
  workflowEditNodeFormDeleteButton:
    meaning: Delete button on workflowEditNodeForm labeled 'Delete'.
  workflowLinkWorkflowDialog:
    meaning: Modal dialog for searching candidate workflows and linking one to the bound workflowNode via workflowCard click.
  workflowLinkWorkflowDialogTitle:
    meaning: Accessible title on workflowLinkWorkflowDialog; reads 'Link an activity' when parent workflow type is course, or 'Link a course' when parent workflow type is program.
  workflowLinkWorkflowDialogSearchField:
    meaning: Search input on workflowLinkWorkflowDialog labeled 'Search'.
  workflowLinkWorkflowDialogSearchResults:
    meaning: Search-results list of workflowCard candidates on workflowLinkWorkflowDialog.
  workflowCard:
    meaning: Canonical definition in tests/docs/requirements/features/shared/card_content_requirements_v1.yaml.
  workflowLinkWorkflowDialogEmptyState:
    meaning: Empty-state region on workflowLinkWorkflowDialog when workflowLinkWorkflowDialogSearchResults contains no workflowCard; copy distinguishes search-no-results from no eligible link target per FR-WF-EN-009.
  workflowLinkWorkflowDialogCancelButton:
    meaning: Cancel button on workflowLinkWorkflowDialog labeled 'Cancel'.
  workflowLinkWorkflowDialogLinkButton:
    meaning: Link button on workflowLinkWorkflowDialog; reads 'Link activity' when parent workflow type is course, or 'Link course' when parent workflow type is program.

