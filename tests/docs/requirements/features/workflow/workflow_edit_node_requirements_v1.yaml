  - id: FR-WF-EN-007
    title: Auto-save field changes on workflowEditNodeForm

    designEvidence:
      - FIGMA-WF-EN-ACTIVITY-OE
      - FIGMA-WF-EN-COURSE-OE-NOLINK
      - FIGMA-WF-EN-PROGRAM-OE-NOLINK

    actors:
      - owner
      - editor

    uiObjects:
      - workflowEditNodeForm

    preconditions:
      - workflowEditNodeForm is rendered for a workflowNode
      - workflowEditNodeForm permissions per FR-WF-EN-001 roleBehavior

    trigger:
      - user types, pastes, clears, applies a toolbar format on workflowEditNodeFormDescriptionField, inserts or edits a hyperlink on workflowEditNodeFormDescriptionField, or otherwise modifies a value in any editable field on workflowEditNodeForm

    mainFlow:
      - system persists changes without an explicit save control on workflowEditNodeForm
      - workflowEditNodeForm does not render any visible auto-save status indicator (e.g. 'Saving…' or 'Saved')
      - applying a toolbar format on workflowEditNodeFormDescriptionField or inserting or editing a hyperlink via workflowRichTextDescriptionEditorLinkButton counts as a field modification for auto-save
      - if workflowEditNodeFormTitleField is rendered and editable for the actor and the actor clears it, the empty string is persisted as the workflowNode's title; the 'Untitled node' placeholder is a display fallback only and is not auto-substituted into the persisted value; workflowNodeTitle in workflowView shows the same display fallback when persisted title is empty (canvas layout per FR-WF-NODE-001)
      - persisted field values are reflected on subsequent re-renders of workflowEditNodeForm for the same workflowNode
      - downstream overview totals — when the parent workflow has workflowMetadataSwitchCalculateTimeAutomatically ON per FR-WF-OV-003, changes to workflowEditNodeFormTimeField on non-linked nodes and changes to mirrored linked workflowMetadataFieldTime per FR-WF-EN-004 and FR-WF-EN-006 cause workflowMetadataFieldTime on the parent workflow overview to recompute per FR-WF-OV-003
      - downstream overview ponderation totals — when the parent program workflow has workflowMetadataSwitchCalculatePonderationAutomatically ON per FR-WF-OV-004, changes to workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, or workflowEditNodeFormPonderationIndividualField on non-linked nodes and changes to mirrored linked-course workflowMetadataFieldTheoryTime, workflowMetadataFieldPracticalTime, or workflowMetadataFieldIndividualTime per FR-WF-EN-006 cause the corresponding overview ponderation fields to recompute per FR-WF-OV-004
      - downstream overview credits totals — when the parent program workflow has workflowMetadataSwitchCalculateCreditsAutomatically ON per FR-WF-OV-005, changes to workflowEditNodeFormCreditsField on non-linked nodes and changes to mirrored linked-course workflowMetadataFieldCredits per FR-WF-EN-006 cause workflowMetadataFieldCredits on the parent program overview to recompute per FR-WF-OV-005
      - downstream overview classification totals — when the parent program workflow has workflowMetadataSwitchCalculateClassificationAutomatically ON per FR-WF-OV-006, changes to workflowEditNodeFormTimeField or workflowEditNodeFormSpecificEducationSwitch on non-linked program nodes cause workflowMetadataFieldGeneralTime and workflowMetadataFieldSpecificTime on the parent program overview to recompute per FR-WF-OV-006

    roleBehavior: {}

    acceptanceCriteria:
      - given workflowEditNodeForm is open for a workflowNode and actor is owner or editor, when user modifies an editable field, then the change is persisted without an explicit save control click
      - given workflowEditNodeForm is open for a workflowNode and actor is owner or editor, when user modifies an editable field, workflowEditNodeForm does not show any visible auto-save status indicator

