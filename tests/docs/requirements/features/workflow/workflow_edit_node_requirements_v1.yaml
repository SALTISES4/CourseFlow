  - id: FR-WF-EN-009
    title: workflowLinkWorkflowDialog selection, search, empty state, confirm, and dismiss

    designEvidence:
      - FIGMA-WF-EN-COURSE-LINK-DIALOG
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG-EMPTY
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG-SEARCH-EMPTY

    actors:
      - owner
      - editor

    uiObjects:
      - workflowLinkWorkflowDialog
      - workflowLinkWorkflowDialogSearchField
      - workflowLinkWorkflowDialogSearchResults
      - workflowCard
      - workflowLinkWorkflowDialogEmptyState
      - workflowLinkWorkflowDialogCancelButton
      - workflowLinkWorkflowDialogLinkButton
      - workflowEditNodeForm

    preconditions:
      - workflowLinkWorkflowDialog is open per FR-WF-EN-008

    trigger:
      - workflowLinkWorkflowDialog is opened per FR-WF-EN-008, or
      - user types in workflowLinkWorkflowDialogSearchField, or
      - user clicks a workflowCard, or
      - user clicks workflowLinkWorkflowDialogLinkButton, or
      - user clicks workflowLinkWorkflowDialogCancelButton, or
      - user clicks outside workflowLinkWorkflowDialog, or
      - user presses Escape

    mainFlow:
      - on dialog open per FR-WF-EN-008, workflowLinkWorkflowDialogSearchResults is populated per FR-WF-EN-010; when it contains at least one workflowCard, the first workflowCard is selected by default and workflowLinkWorkflowDialogLinkButton shows 'Link activity' or 'Link course' and is enabled; when it contains no workflowCard, workflowLinkWorkflowDialogEmptyState is rendered in place of the list, no workflowCard is selected, and workflowLinkWorkflowDialogLinkButton is disabled
      - when user types in workflowLinkWorkflowDialogSearchField, workflowLinkWorkflowDialogSearchResults is filtered by workflow title; clearing workflowLinkWorkflowDialogSearchField restores the full list
      - workflowLinkWorkflowDialogSearchResults is a single flat list with no grouping; entries are drawn exclusively from the parent project's own workflows per FR-WF-EN-010 (workflows of other projects, including published workflows from other projects, are not eligible)
      - workflowLinkWorkflowDialog does not support keyboard navigation or selection of workflowCard entries; selection is mouse/pointer-based only
      - clicking a workflowCard selects that card as the single proposed link target; only one workflowCard may be selected at a time; clicking a different workflowCard replaces the prior selection
      - workflowCard presentation and card interactions in workflowLinkWorkflowDialogSearchResults conform to FR-CARD-* as applicable
      - workflowLinkWorkflowDialogLinkButton label is 'Link activity' when parent workflow type is course, or 'Link course' when parent workflow type is program, regardless of result-set state; it is enabled when a workflowCard is selected and disabled otherwise
      - when workflowLinkWorkflowDialogSearchResults contains no workflowCard, workflowLinkWorkflowDialogEmptyState is rendered in place of the list and workflowLinkWorkflowDialogLinkButton is disabled (no-op on click); copy depends on why the list is empty — when workflowLinkWorkflowDialogSearchField is non-empty and returns zero matches against a non-empty eligible candidate set per FR-WF-EN-010, workflowLinkWorkflowDialogEmptyState displays 'There are no exact matches.'; when the parent project has no eligible same-type workflow for the workflowNode being edited per FR-WF-EN-010, workflowLinkWorkflowDialogEmptyState displays a title and subtitle for the link-target workflow type — for course parent workflows the title is 'No activity found' and the subtitle is 'There are currently no activities in this project. Before you can link an activity to a node here, you must first add or create the activity within the project.'; for program parent workflows the title is 'No course found' and the subtitle is 'There are currently no courses in this project. Before you can link a course to a node here, you must first add or create the course within the project.'; workflowLinkWorkflowDialog does not offer any affordance to create a new workflow
      - when user clicks workflowLinkWorkflowDialogLinkButton, system links the selected workflow to the workflowNode, closes workflowLinkWorkflowDialog, and returns to workflowEditNodeForm in its linked-workflow state per FR-WF-EN-004 and FR-WF-EN-006
      - when user clicks workflowLinkWorkflowDialogCancelButton, clicks outside workflowLinkWorkflowDialog, or presses Escape, system closes workflowLinkWorkflowDialog without linking; the workflowNode's linkedWorkflow state is unchanged

    roleBehavior:
      owner:
        workflowLinkWorkflowDialog: editable
      editor:
        workflowLinkWorkflowDialog: editable

    acceptanceCriteria:
      - given workflowLinkWorkflowDialog is open with at least one workflowCard in workflowLinkWorkflowDialogSearchResults, workflowCard conforms to FR-CARD-* as applicable
      - given workflowLinkWorkflowDialog is open and workflowLinkWorkflowDialogSearchResults contains at least one workflowCard, the first workflowCard is selected by default and workflowLinkWorkflowDialogLinkButton is enabled
      - given workflowLinkWorkflowDialog is open and workflowLinkWorkflowDialogSearchResults contains no workflowCard, workflowLinkWorkflowDialogEmptyState is rendered in place of the list and workflowLinkWorkflowDialogLinkButton is disabled
      - given workflowLinkWorkflowDialogEmptyState is rendered because the parent project has no eligible same-type workflow per FR-WF-EN-010 and parent workflow type is course, workflowLinkWorkflowDialogEmptyState displays the title 'No activity found' and the subtitle 'There are currently no activities in this project. Before you can link an activity to a node here, you must first add or create the activity within the project.'
      - given workflowLinkWorkflowDialogEmptyState is rendered because the parent project has no eligible same-type workflow per FR-WF-EN-010 and parent workflow type is program, workflowLinkWorkflowDialogEmptyState displays the title 'No course found' and the subtitle 'There are currently no courses in this project. Before you can link a course to a node here, you must first add or create the course within the project.'
      - given workflowLinkWorkflowDialog is open with at least one eligible workflowCard in the candidate set per FR-WF-EN-010, when user types into workflowLinkWorkflowDialogSearchField and zero workflowCards match, workflowLinkWorkflowDialogEmptyState is rendered in place of the list, no workflowCard is selected, workflowLinkWorkflowDialogLinkButton is disabled, and workflowLinkWorkflowDialogEmptyState displays 'There are no exact matches.'
      - given workflowLinkWorkflowDialog is open, when user clicks a workflowCard, that card is shown as selected and any previously selected workflowCard is deselected; workflowLinkWorkflowDialogLinkButton is enabled
      - given a workflowCard is selected and user clicks workflowLinkWorkflowDialogLinkButton, the workflowNode is linked to that workflow, workflowLinkWorkflowDialog closes, and workflowEditNodeForm enters its linked-workflow state per FR-WF-EN-004 and FR-WF-EN-006
      - given workflowLinkWorkflowDialog is open and parent workflow type is course, workflowLinkWorkflowDialogLinkButton displays the label 'Link activity'
      - given workflowLinkWorkflowDialog is open and parent workflow type is program, workflowLinkWorkflowDialogLinkButton displays the label 'Link course'
      - given workflowLinkWorkflowDialog is open, when user clicks workflowLinkWorkflowDialogCancelButton, clicks outside workflowLinkWorkflowDialog, or presses Escape, workflowLinkWorkflowDialog closes and the workflowNode's linkedWorkflow state is unchanged
      - given workflowLinkWorkflowDialog is open, when user types into workflowLinkWorkflowDialogSearchField, workflowLinkWorkflowDialogSearchResults filters to entries whose title matches the search; when user clears workflowLinkWorkflowDialogSearchField, workflowLinkWorkflowDialogSearchResults restores to the full candidate set per FR-WF-EN-010

    openQuestions: []

  - id: FR-WF-EN-010
    title: Workflow-type linkability constraints for workflowLinkWorkflowDialog

    designEvidence:
      - FIGMA-WF-EN-COURSE-LINK-DIALOG
      - FIGMA-WF-EN-PROGRAM-LINK-DIALOG

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormLinkWorkflowButton
      - workflowLinkWorkflowDialog
      - workflowLinkWorkflowDialogSearchResults
      - workflowCard

    preconditions:
      - workflowEditNodeForm is rendered for a workflowNode
      - workflowEditNodeForm permissions per FR-WF-EN-001 roleBehavior

    trigger:
      - workflowEditNodeForm is rendered (determines whether workflowEditNodeFormLinkWorkflowButton is present), or
      - workflowLinkWorkflowDialog is opened (determines what workflowLinkWorkflowDialogSearchResults contains)

    mainFlow:
      - when parent workflow type is activity, workflowEditNodeFormLinkWorkflowButton is not rendered; activity workflowNodes cannot be linked to any workflow
      - workflowLinkWorkflowDialogSearchResults is restricted to workflows whose parent project is the same as the workflowNode being edited; workflows of other projects, including published workflows owned by other projects, are not eligible link targets
      - when parent workflow type is course, workflowLinkWorkflowDialogSearchResults includes only same-project workflows whose type is activity
      - when parent workflow type is program, workflowLinkWorkflowDialogSearchResults includes only same-project workflows whose type is course
      - workflowLinkWorkflowDialogSearchResults excludes archived workflows; only non-archived same-project workflows of the eligible type are offered
      - a workflowNode can be linked to at most one workflow at a time
      - when workflowEditNodeFormLinkWorkflowButton is rendered on course or program workflowNodes, workflowEditNodeFormLinkWorkflowButton actionability per this FR's roleBehavior

    roleBehavior:
      owner:
        workflowEditNodeFormLinkWorkflowButton: activeWhenPresent
      editor:
        workflowEditNodeFormLinkWorkflowButton: activeWhenPresent
      commenter:
        workflowEditNodeFormLinkWorkflowButton: disabledWhenPresent
      viewer:
        workflowEditNodeFormLinkWorkflowButton: disabledWhenPresent
      user:
        workflowEditNodeFormLinkWorkflowButton: disabledWhenPresent

    acceptanceCriteria:
      - given parent workflow type is activity, workflowEditNodeForm does not render workflowEditNodeFormLinkWorkflowButton
      - given workflowLinkWorkflowDialog is open, every workflowCard in workflowLinkWorkflowDialogSearchResults belongs to the same parent project as the workflowNode being edited (no cross-project workflows appear, regardless of published status)
      - given parent workflow type is course and workflowLinkWorkflowDialog is open, every workflowCard in workflowLinkWorkflowDialogSearchResults corresponds to an activity-type workflow within the parent project
      - given parent workflow type is program and workflowLinkWorkflowDialog is open, every workflowCard in workflowLinkWorkflowDialogSearchResults corresponds to a course-type workflow within the parent project
      - given activity workflow A in the parent project is archived and parent workflow type is course, when owner or editor opens workflowLinkWorkflowDialog for an unlinked course node, A does not appear in workflowLinkWorkflowDialogSearchResults
      - given course workflow C in the parent project is archived and parent workflow type is program, when owner or editor opens workflowLinkWorkflowDialog for an unlinked program node, C does not appear in workflowLinkWorkflowDialogSearchResults
      - given a workflowNode already has a linked workflow, workflowEditNodeFormLinkWorkflowButton label and permissions per this FR's roleBehavior; field presentation per FR-WF-EN-004 or FR-WF-EN-006; unlink per FR-WF-EN-011
      - given parent workflow type is course or program, the workflowNode has no linked workflow, and actor is commenter, viewer, or user (published-access), workflowEditNodeFormLinkWorkflowButton is rendered and disabled (no-op on click) and workflowLinkWorkflowDialog does not open per FR-WF-EN-008

    openQuestions: []

  - id: FR-WF-EN-011
    title: Remove linked workflow from a workflowNode

    designEvidence:
      - FIGMA-WF-EN-COURSE-CUSTOMINFO
      - FIGMA-WF-EN-PROGRAM-CUSTOMINFO

    actors:
      - owner
      - editor

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormLinkWorkflowButton
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormCreditsField
      - workflowEditNodeFormPonderationTheoryField
      - workflowEditNodeFormPonderationPracticeField
      - workflowEditNodeFormPonderationIndividualField

    preconditions:
      - workflowEditNodeForm is rendered for a workflowNode whose parent workflow type is course or program
      - the workflowNode currently has a linked workflow
      - workflowEditNodeFormLinkWorkflowButton permissions per FR-WF-EN-010 roleBehavior

    trigger:
      - user clicks workflowEditNodeFormLinkWorkflowButton while it displays 'Remove linked activity' or 'Remove linked course'

    mainFlow:
      - system clears the workflowNode's linkedWorkflow association immediately on click
      - the workflowNode's own values for title, description, time, and (for program parent workflow type) credits and ponderation hours are preserved while the link is active (they are not overwritten by the linked workflow's metadata, only masked in the read-only mirror fields per FR-WF-EN-004 and FR-WF-EN-006); on link removal those persisted node-local values are restored to their respective fields
      - workflowEditNodeFormTitleField switches from read-only display of the linked workflow's workflowTitle to an editable field for owner/editor and shows the workflowNode's own previously-persisted title (or the placeholder 'Untitled node' if that persisted title is empty per FR-WF-EN-007)
      - workflowEditNodeFormLinkWorkflowButton label returns to 'Link an activity' when parent workflow type is course, or 'Link a course' when parent workflow type is program, and becomes the active entry path to workflowLinkWorkflowDialog per FR-WF-EN-008 for owner and editor
      - workflowEditNodeFormDescriptionField and workflowEditNodeFormTimeField become editable for owner/editor again and show the workflowNode's own previously-persisted values; for parent workflow type program, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, and workflowEditNodeFormPonderationIndividualField also become editable for owner/editor again and show the workflowNode's own previously-persisted values
      - archive-triggered link break — when a linked child workflow is archived individually per tests/docs/requirements/features/workflow/workflow_archive_requirements_v1.yaml FR-WF-ARCH-003 (not when the whole parent project is archived per tests/docs/requirements/features/project/project_archive_requirements_v1.yaml FR-PROJ-ARCH-003), parent nodes pointing at that child lose linkedWorkflow without user action with the same field-reset outcomes as manual unlink per this FR (pre-link persisted values, or empty or product default when no pre-link value exists; inherited linked-workflow metadata is not retained)
      - cross-project copy link break — when a workflow is copied to a different destination project per tests/docs/requirements/features/workflow/workflow_copy_requirements_v1.yaml FR-WF-COPY-003, copied nodes lose linkedWorkflow with the same node field-reset outcomes as archive-triggered link break per FR-WF-ARCH-003; same-project copy preserves linkedWorkflow associations per FR-WF-COPY-003

    roleBehavior: {}

    acceptanceCriteria:
      - given the workflowNode has a linked workflow and owner or editor clicks workflowEditNodeFormLinkWorkflowButton ('Remove linked activity' or 'Remove linked course'), the link is cleared immediately with no confirmation dialog; workflowEditNodeFormTitleField becomes editable again and shows the workflowNode's own previously-persisted title (or placeholder), and workflowEditNodeFormLinkWorkflowButton shows 'Link an activity' when parent workflow type is course or 'Link a course' when parent workflow type is program, and is active again as the dialog entry control
      - given the workflowNode had a linked workflow that is removed, workflowEditNodeFormTitleField, workflowEditNodeFormDescriptionField, and workflowEditNodeFormTimeField are editable for owner/editor again and show the workflowNode's own previously-persisted values (the node-local values that existed at the moment the link was created, plus any node-local edits made while the link existed)
      - given parent workflow type is program and the workflowNode had a linked course workflow that is removed, workflowEditNodeFormCreditsField, workflowEditNodeFormPonderationTheoryField, workflowEditNodeFormPonderationPracticeField, and workflowEditNodeFormPonderationIndividualField are editable for owner/editor again and show the workflowNode's own previously-persisted values

    openQuestions: []

