requirements:
  - id: FR-WF-EN-001
    title: Open workflowEditNodeForm when user clicks a workflowNode in workflowView

    designEvidence:
      - FIGMA-WF-EN-ACTIVITY-OE
      - FIGMA-WF-EN-ACTIVITY-CV
      - FIGMA-WF-EN-COURSE-OE-NOLINK
      - FIGMA-WF-EN-PROGRAM-OE-NOLINK

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowSectionContainer
      - workflowNode
      - workflowRightSidebar
      - workflowRightSidebarAddTab
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowEditNodeForm
      - workflowEditNodeFormHeading

    preconditions:
      - documentPreconditions for this file hold
      - workflowView is rendered
      - workflowView contains at least one workflowSectionContainer

    trigger:
      - user clicks a workflowNode in workflowView while workflowRightSidebar is closed
      - user clicks a workflowNode in workflowView while workflowRightSidebar is already open
      - user adds a new workflowNode by a drop from workflowRightSidebarAddTabContent per FR-WF-ADD-004, FR-WF-ADD-005, or FR-WF-ADD-006

    mainFlow:
      - system identifies the workflowNode to bind — for click triggers, the workflowNode under the clicked target; for drag-and-drop triggers, the workflowNode just finalized at the drop destination per FR-WF-ADD-004, FR-WF-ADD-005, or FR-WF-ADD-006
      - for click triggers on workflowNodeContent only, if the clicked workflowNode shows workflowNodeOutcomeHighlightBorder per tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-003, the click is a no-op — workflowRightSidebar tab, selection, and binding are unchanged and workflowEditNodeForm is not opened or rebound; this no-op does not apply to workflowNodeHoverActionsMenuCommentsItem per FR-WF-NODE-005 or to workflowRightSidebarEditTab after comments for that workflowNode per FR-WF-COMMENTS-005
      - if workflowRightSidebar is closed, system opens workflowRightSidebar with workflowRightSidebarEditTab selected
      - if workflowRightSidebar is open on a different tab (including workflowRightSidebarAddTab at the moment of a drag-and-drop trigger) or a different selection, system switches workflowRightSidebar to workflowRightSidebarEditTab and rebinds workflowRightSidebarEditTabContent to the identified workflowNode; for drag-and-drop triggers, post-drop sidebar behavior per FR-WF-ADD-004
      - system renders workflowEditNodeForm inside workflowRightSidebarEditTabContent bound to the identified workflowNode
      - workflowEditNodeFormHeading reads 'Edit node'
      - field set inside workflowEditNodeForm follows the parent workflow type per FR-WF-EN-002 (activity), FR-WF-EN-003 / FR-WF-EN-004 (course, depending on whether the workflowNode has a linked workflow), or FR-WF-EN-005 / FR-WF-EN-006 (program, depending on whether the workflowNode has a linked workflow)
      - editable field changes auto-save per FR-WF-EN-007 without an explicit save control on workflowEditNodeForm
      - canvas presentation of workflowNodeTitle, workflowNodeMeta tags, and workflowNodeLinkedWorkflowIndicator in workflowView uses the same field values and applicability as workflowEditNodeForm per FR-WF-EN-002 through FR-WF-EN-006; layout and chrome on the canvas conform to FR-WF-NODE-001
      - field-level read-only when linked per FR-WF-EN-004 or FR-WF-EN-006

    roleBehavior:
      owner:
        workflowEditNodeForm: editableWhereApplicable
      editor:
        workflowEditNodeForm: editableWhereApplicable
      commenter:
        workflowEditNodeForm: readOnlyPresentation
      viewer:
        workflowEditNodeForm: readOnlyPresentation
      user:
        workflowEditNodeForm: readOnlyPresentation

    acceptanceCriteria:
      - given workflowRightSidebar is closed, when user clicks a workflowNode, then workflowRightSidebar opens, workflowRightSidebarEditTab is selected, and workflowEditNodeForm is rendered for that workflowNode
      - given workflowRightSidebar is already open on a different selection or tab, when user clicks a workflowNode, then workflowRightSidebar switches to workflowRightSidebarEditTab and workflowEditNodeForm is rebound to the clicked workflowNode
      - given workflowNode N shows workflowNodeOutcomeHighlightBorder per tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-003, when the user clicks workflowNodeContent on workflowNode N, workflowRightSidebar state and workflowEditNodeForm binding are unchanged
      - given workflowNode N shows workflowNodeOutcomeHighlightBorder per FR-WF-NODE-003, when the user opens comments for N via workflowNodeHoverActionsMenuCommentsItem per FR-WF-NODE-005 and FR-WF-COMMENTS-001 and then clicks workflowRightSidebarEditTab, workflowEditNodeForm is rendered for N per this FR and is not blocked by N showing workflowNodeOutcomeHighlightBorder
      - given owner or editor completes a drop from workflowRightSidebarAddTabContent that finalizes a new workflowNode per FR-WF-ADD-004, FR-WF-ADD-005, or FR-WF-ADD-006, post-drop sidebar and edit-form behavior per FR-WF-ADD-004
      - when workflowEditNodeForm is rendered, workflowEditNodeFormHeading text is 'Edit node'

    openQuestions: []

  - id: FR-WF-EN-002
    title: workflowEditNodeForm field set for activity workflow type

    designEvidence:
      - FIGMA-WF-EN-ACTIVITY-OE
      - FIGMA-WF-EN-ACTIVITY-CV

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormActivityContextSelect
      - workflowEditNodeFormTaskTypeSelect
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeFormDuplicateButton
      - workflowEditNodeFormDeleteButton

    preconditions:
      - FR-WF-EN-001 has rendered workflowEditNodeForm
      - parent workflow type is activity
      - workflowEditNodeForm permissions per FR-WF-EN-001 roleBehavior

    trigger:
      - workflowEditNodeForm is rendered for a workflowNode whose parent workflow type is activity

    mainFlow:
      - workflowEditNodeForm shows workflowEditNodeFormTitleField
      - workflowEditNodeForm shows workflowEditNodeFormDescriptionField
      - workflowEditNodeForm shows workflowEditNodeFormActivityContextSelect
      - workflowEditNodeForm shows workflowEditNodeFormTaskTypeSelect
      - workflowEditNodeForm shows workflowEditNodeFormTimeField
      - workflowEditNodeForm shows workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeForm does not render program-only or course-only metadata controls, including workflowEditNodeFormCourseContextSelect, when parent workflow type is activity
      - workflowEditNodeForm does not render workflowEditNodeFormLinkWorkflowButton per FR-WF-EN-010
      - workflowEditNodeForm shows workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton in its action area

    roleBehavior: {}

    acceptanceCriteria:
      - given parent workflow type is activity, when workflowEditNodeForm is rendered, the visible fields are exactly workflowEditNodeFormTitleField, workflowEditNodeFormDescriptionField, workflowEditNodeFormActivityContextSelect, workflowEditNodeFormTaskTypeSelect, workflowEditNodeFormTimeField, and workflowEditNodeFormTagsAutocomplete
      - given parent workflow type is activity, when workflowEditNodeForm is rendered, workflowEditNodeFormActivityContextSelect offers exactly the options defined in uiObjectDefinitions for workflowEditNodeFormActivityContextSelect
      - given parent workflow type is activity, when workflowEditNodeForm is rendered, workflowEditNodeFormTaskTypeSelect has the exact visible label 'Task'
      - given parent workflow type is activity, when workflowEditNodeForm is rendered, workflowEditNodeFormTaskTypeSelect offers exactly the options defined in uiObjectDefinitions for workflowEditNodeFormTaskTypeSelect
      - given parent workflow type is activity, workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton are present in the form's action area
      - given parent workflow type is activity, workflowEditNodeForm does not render workflowEditNodeFormLinkWorkflowButton per FR-WF-EN-010
      - given actor is commenter, viewer, or user (published-access), workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton actionability per FR-WF-DUP-001 and FR-WF-DEL-001 respectively

    openQuestions: []

  - id: FR-WF-EN-003
    title: workflowEditNodeForm field set for course workflow type with no linked workflow

    designEvidence:
      - FIGMA-WF-EN-COURSE-OE-NOLINK

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormCourseContextSelect
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeFormLinkWorkflowButton
      - workflowEditNodeFormDuplicateButton
      - workflowEditNodeFormDeleteButton

    preconditions:
      - FR-WF-EN-001 has rendered workflowEditNodeForm
      - parent workflow type is course
      - the workflowNode has no linked workflow
      - workflowEditNodeForm permissions per FR-WF-EN-001 roleBehavior
      - workflowEditNodeFormLinkWorkflowButton permissions per FR-WF-EN-010 roleBehavior

    trigger:
      - workflowEditNodeForm is rendered for an unlinked workflowNode whose parent workflow type is course

    mainFlow:
      - workflowEditNodeForm shows workflowEditNodeFormTitleField
      - workflowEditNodeForm shows workflowEditNodeFormDescriptionField
      - workflowEditNodeForm shows workflowEditNodeFormCourseContextSelect
      - workflowEditNodeForm shows workflowEditNodeFormTimeField
      - workflowEditNodeForm shows workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeForm does not render activity-only or program-only metadata controls, including workflowEditNodeFormActivityContextSelect and workflowEditNodeFormTaskTypeSelect, when parent workflow type is course
      - workflowEditNodeForm shows workflowEditNodeFormLinkWorkflowButton labeled 'Link an activity', workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton in its action area

    roleBehavior: {}

    acceptanceCriteria:
      - given parent workflow type is course and the workflowNode has no linked workflow, the visible fields in workflowEditNodeForm are workflowEditNodeFormTitleField, workflowEditNodeFormDescriptionField, workflowEditNodeFormCourseContextSelect, workflowEditNodeFormTimeField, and workflowEditNodeFormTagsAutocomplete; workflowEditNodeFormLinkWorkflowButton, workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton are also visible in the action area
      - given parent workflow type is course and the workflowNode has no linked workflow, workflowEditNodeFormCourseContextSelect offers exactly the options defined in uiObjectDefinitions for workflowEditNodeFormCourseContextSelect
      - given parent workflow type is course and the workflowNode has no linked workflow, workflowEditNodeFormLinkWorkflowButton displays 'Link an activity'

    openQuestions: []

  - id: FR-WF-EN-004
    title: workflowEditNodeForm field set for course workflow type with a linked workflow

    designEvidence:
      - FIGMA-WF-EN-COURSE-CUSTOMINFO

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeForm
      - workflowEditNodeFormTitleField
      - workflowEditNodeFormLinkWorkflowButton
      - workflowEditNodeFormDescriptionField
      - workflowEditNodeFormCourseContextSelect
      - workflowEditNodeFormTimeField
      - workflowEditNodeFormTagsAutocomplete
      - workflowEditNodeFormDuplicateButton
      - workflowEditNodeFormDeleteButton

    preconditions:
      - FR-WF-EN-001 has rendered workflowEditNodeForm
      - parent workflow type is course
      - the workflowNode has a linked activity workflow per FR-WF-EN-010
      - workflowEditNodeForm permissions per FR-WF-EN-001 roleBehavior
      - workflowEditNodeFormLinkWorkflowButton permissions per FR-WF-EN-010 roleBehavior

    trigger:
      - workflowEditNodeForm is rendered for a course workflowNode whose linkedWorkflow is set

    mainFlow:
      - workflowEditNodeFormTitleField is rendered at the top of workflowEditNodeForm and is read-only for every actor; its visible value is the linked activity workflow's workflowTitle
      - workflowEditNodeFormLinkWorkflowButton is rendered as the first control in the action area with label 'Remove linked activity'; workflowEditNodeFormLinkWorkflowButton permissions per FR-WF-EN-010 roleBehavior; when owner or editor clicks workflowEditNodeFormLinkWorkflowButton, the link is cleared per FR-WF-EN-011
      - workflowEditNodeFormDescriptionField and workflowEditNodeFormTimeField display the linked activity workflow's workflowMetadataFieldDescription and workflowMetadataFieldTime respectively and are read-only for every actor; changing those values requires editing the linked activity workflow (not this node's form)
      - workflowEditNodeForm still shows workflowEditNodeFormCourseContextSelect and workflowEditNodeFormTagsAutocomplete; these are course-node-local metadata, are not sourced from the linked activity workflow, and remain editable for owner/editor
      - workflowEditNodeForm shows workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton in its action area

    roleBehavior: {}

    acceptanceCriteria:
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormTitleField is rendered read-only at the top and displays the linked activity workflow's workflowTitle
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormDescriptionField and workflowEditNodeFormTimeField are read-only for every actor and mirror the linked activity workflow's workflowMetadataFieldDescription and workflowMetadataFieldTime respectively; updates follow only when those metadata fields change on the linked activity workflow
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormCourseContextSelect and workflowEditNodeFormTagsAutocomplete are still rendered as course-node-local metadata and remain editable for owner/editor (they are not forced to read-only by the linked workflow)
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormCourseContextSelect offers the same option set as on unlinked course nodes per FR-WF-EN-003
      - given parent workflow type is course and the workflowNode has a linked activity workflow, workflowEditNodeFormLinkWorkflowButton displays 'Remove linked activity' and permissions per FR-WF-EN-010 roleBehavior; workflowEditNodeFormDuplicateButton and workflowEditNodeFormDeleteButton are present in the form's action area

    openQuestions: []

  - id: FR-WF-EN-005
