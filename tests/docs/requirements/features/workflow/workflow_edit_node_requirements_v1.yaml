  - id: FR-WF-EN-012
    title: Rich-text Description field (shared editor contract)

    designEvidence: []

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowEditNodeFormDescriptionField
      - workflowEditOutcomeFormDescriptionField
      - projectDescriptionField
      - workflowDescriptionField
      - workflowRichTextDescriptionEditor
      - workflowRichTextDescriptionEditorToolbar
      - workflowRichTextDescriptionEditorBoldButton
      - workflowRichTextDescriptionEditorItalicButton
      - workflowRichTextDescriptionEditorUnderlineButton
      - workflowRichTextDescriptionEditorSuperscriptButton
      - workflowRichTextDescriptionEditorSubscriptButton
      - workflowRichTextDescriptionEditorBulletListButton
      - workflowRichTextDescriptionEditorNumberedListButton
      - workflowRichTextDescriptionEditorLinkButton
      - workflowRichTextDescriptionEditorLinkDialog

    preconditions:
      - one of workflowEditNodeFormDescriptionField is rendered per FR-WF-EN-002 through FR-WF-EN-006, workflowEditOutcomeFormDescriptionField is rendered per FR-WF-EO-005, projectDescriptionField is rendered in createProjectDialog or editProjectDialog per tests/docs/requirements/features/project/project_create_form_requirements_v1.yaml FR-PROJ-FORM-001 or tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml FR-PROJ-FORM-003, or workflowDescriptionField is rendered in createWorkflowDialog or editWorkflowDialog per tests/docs/requirements/features/workflow/workflow_create_stepped_form_requirements_v1.yaml FR-WF-CREATE-STEPPER-005 or tests/docs/requirements/features/workflow/workflow_edit_form_requirements_v1.yaml FR-WF-FORM-001

    trigger:
      - workflowEditNodeFormDescriptionField, workflowEditOutcomeFormDescriptionField, projectDescriptionField, or workflowDescriptionField renders

    mainFlow:
      - workflowEditNodeFormDescriptionField, workflowEditOutcomeFormDescriptionField, projectDescriptionField, and workflowDescriptionField each render workflowRichTextDescriptionEditor; none is a plain text input or plain multiline text input
      - visible field label is 'Description' on workflowEditNodeFormDescriptionField, workflowEditOutcomeFormDescriptionField, and projectDescriptionField; on workflowDescriptionField the visible label matches the hosting workflow create or edit dialog pattern (e.g. 'Activity description') per the hosting form FR
      - when editable for the actor (owner or editor, and not read-only per FR-WF-EN-004, FR-WF-EN-006, or FR-WF-EO-005 roleBehavior), workflowRichTextDescriptionEditorToolbar is visible with exactly these controls — workflowRichTextDescriptionEditorBoldButton, workflowRichTextDescriptionEditorItalicButton, workflowRichTextDescriptionEditorUnderlineButton, workflowRichTextDescriptionEditorSuperscriptButton, workflowRichTextDescriptionEditorSubscriptButton, workflowRichTextDescriptionEditorBulletListButton, workflowRichTextDescriptionEditorNumberedListButton, and workflowRichTextDescriptionEditorLinkButton — and exposes no other formatting controls (no headings, font size, colour, tables, images, code blocks, or blockquote)
      - owner or editor can apply each supported format to the current selection or insertion point via the corresponding toolbar control; formatting is reflected immediately in the editor content region
      - owner or editor can create and edit bulleted and numbered lists via workflowRichTextDescriptionEditorBulletListButton and workflowRichTextDescriptionEditorNumberedListButton
      - when owner or editor clicks workflowRichTextDescriptionEditorLinkButton with a non-empty text selection, workflowRichTextDescriptionEditorLinkDialog opens so the actor can enter or edit a URL; on confirm, the selected text becomes a hyperlink opening in a new browser tab with `http` or `https` protocol; when owner or editor clicks workflowRichTextDescriptionEditorLinkButton with an empty selection, the system inserts the literal link text 'link', selects it, and opens workflowRichTextDescriptionEditorLinkDialog so the actor can set the URL for that insertion
      - URLs entered without a protocol are normalized to `https://` on save
      - when owner or editor pastes content from an external source into workflowRichTextDescriptionEditor, the system strips unsupported formatting and retains only markup for the supported formats listed above (bold, italic, underline, superscript, subscript, bulleted lists, numbered lists, and hyperlinks)
      - persisted description value is HTML markup limited to the supported formats above; empty description persists as an empty string (editor shows blank content, not placeholder markup)
      - changes to description content or formatting auto-save per FR-WF-EN-007 when the field is on workflowEditNodeForm and per FR-WF-EO-006 when the field is on workflowEditOutcomeForm
      - changes to projectDescriptionField persist on createProjectFormSubmitButton or editProjectFormSubmitButton per tests/docs/requirements/features/project/project_create_form_requirements_v1.yaml FR-PROJ-FORM-005 and tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml FR-PROJ-FORM-008 respectively (not auto-save)
      - changes to workflowDescriptionField persist on createWorkflowSubmitButton or editWorkflowFormSubmitButton per tests/docs/requirements/features/workflow/workflow_create_stepped_form_requirements_v1.yaml FR-WF-CREATE-STEPPER-005 and tests/docs/requirements/features/workflow/workflow_edit_form_requirements_v1.yaml FR-WF-FORM-003 respectively (not auto-save)
      - when workflowEditNodeFormDescriptionField mirrors workflowMetadataFieldDescription from a linked workflow per FR-WF-EN-004 or FR-WF-EN-006, the displayed value is the workflow description HTML from the linked workflow per workflow_overview requirements; workflowRichTextDescriptionEditorToolbar is not interactive and the content region is not editable
      - when workflowEditNodeFormDescriptionField is read-only for other reasons per FR-WF-EN-004 or FR-WF-EN-006, or when workflowEditOutcomeFormDescriptionField is read-only per FR-WF-EO-005 roleBehavior, workflowRichTextDescriptionEditorToolbar is not interactive, the content region is not editable, and stored markup is rendered with its formatting applied (not as raw HTML source)
      - workflowEditNodeFormDescriptionField, workflowEditOutcomeFormDescriptionField, projectDescriptionField, and workflowDescriptionField are not marked as required

    roleBehavior:
      owner:
        workflowRichTextDescriptionEditorToolbar: interactiveWhenFieldEditable
      editor:
        workflowRichTextDescriptionEditorToolbar: interactiveWhenFieldEditable
      commenter:
        workflowRichTextDescriptionEditorToolbar: readOnlyPresentation
      viewer:
        workflowRichTextDescriptionEditorToolbar: readOnlyPresentation
      user:
        workflowRichTextDescriptionEditorToolbar: readOnlyPresentation

    acceptanceCriteria:
      - given workflowEditNodeFormDescriptionField is editable for owner or editor, workflowRichTextDescriptionEditorToolbar shows exactly bold, italic, underline, superscript, subscript, bullet list, numbered list, and link controls and no additional formatting controls
      - given workflowEditOutcomeFormDescriptionField is editable for owner or editor, the same toolbar controls and restrictions apply per this FR
      - given projectDescriptionField is rendered in createProjectDialog or editProjectDialog for an actor who can edit that form, projectDescriptionField hosts workflowRichTextDescriptionEditor and the same toolbar controls and restrictions apply per this FR
      - given workflowDescriptionField is rendered in createWorkflowDialog or editWorkflowDialog for an actor who can edit that form, workflowDescriptionField hosts workflowRichTextDescriptionEditor and the same toolbar controls and restrictions apply per this FR
      - given projectDescriptionField or workflowDescriptionField is editable, neither field is a plain text input or plain multiline text input
      - given owner or editor selects text and applies bold, italic, underline, superscript, or subscript via the corresponding toolbar control, the formatted text is visible in the editor and persists on auto-save per FR-WF-EN-007 or FR-WF-EO-006
      - given owner or editor creates a bulleted or numbered list, list markers and indentation persist on auto-save
      - given owner or editor confirms a hyperlink via workflowRichTextDescriptionEditorLinkDialog, the linked text is clickable after reload and uses an `http` or `https` URL
      - given owner or editor pastes rich content from an external source into workflowRichTextDescriptionEditor, only supported formatting (bold, italic, underline, superscript, subscript, bulleted lists, numbered lists, hyperlinks) is retained in the persisted markup
      - given workflowEditNodeFormDescriptionField or workflowEditOutcomeFormDescriptionField is read-only for commenter, viewer, or user, workflowRichTextDescriptionEditorToolbar is not interactive and the content region is not editable
      - given a persisted description contains supported HTML markup, reopening the bound workflowNode or workflowOutcome shows the same formatted content in the editor

    openQuestions: []

