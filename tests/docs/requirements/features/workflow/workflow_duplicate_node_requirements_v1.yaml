# Normalized requirements: duplicate an existing workflowNode ('Workflow' view)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Node Actions ▸ Duplicate, lines 868–871)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml (canonical insert mode toggle — workflowAddTabInsertModeToggleGroup; manual placement menu — workflowManualPlacementDialog, FR-WF-ADD-006; drag-drop placement from Add tab remains FR-WF-ADD-004 / FR-WF-ADD-005 / FR-WF-ADD-006); tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml (workflowEditNodeForm and workflowEditNodeFormDuplicateButton canonical placement on the right sidebar); tests/docs/requirements/features/workflow/workflow_move_node_requirements_v1.yaml (companion node-action flow; workflowEdge); tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (workflowView, workflowSectionContainer, workflowSectionRow canonical definitions); tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml (workflowNodeHoverActionsMenu visibility — FR-WF-NODE-004; workflowNodeHoverActionsMenuDuplicateItem actionability — FR-WF-NODE-005, canonical for hover-menu item roleBehavior; hover insert-below placement defers to FR-WF-DUP-003 same as duplicate placement).
#   - FR-WS-ACCESS-002 (denied access when documentPreconditions fail)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/graph'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowView is open with at least one workflowSectionContainer that contains at least one workflowNode
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

