locatorMappings:
  workflowEditSectionFormDeleteButton: "canonical_locators.yaml -> workflowEditSectionFormDeleteButton"

requirements:
  - id: FR-SEC-006
    title: Delete section (hover or sidebar)

    designEvidence:
      - FIGMA-SEC-OE-HOVER
      - FIGMA-SEC-OE-EDIT
      - FIGMA-SEC-DEL-WARN

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - workflowView
      - workflowSectionContainer
      - workflowSectionHeader
      - workflowSectionNumberLabel
      - workflowSectionContainerHoverActionsMenu
      - workflowSectionContainerHoverActionsMenuDeleteItem
      - workflowRightSidebar
      - workflowRightSidebarEditTab
      - workflowEditSectionForm
      - workflowEditSectionFormDeleteButton
      - workflowSectionDeleteDialog
      - workflowSectionDeleteDialogCancelButton
      - workflowSectionDeleteDialogConfirmButton
      - workflowSectionContainerSelectedBorder
      - workflowNode
      - workflowOutcome
      - workflowEdge

    preconditions:
      - workflowView contains a target workflowSectionContainer
      - for the hover-menu path, workflowSectionContainerHoverActionsMenuDeleteItem actionability for the actor follows FR-SEC-007
      - for the sidebar path, workflowEditSectionForm is open for the target workflowSectionContainer and workflowEditSectionFormDeleteButton actionability for the actor follows FR-SEC-006 roleBehavior

    trigger:
      - user clicks workflowSectionContainerHoverActionsMenuDeleteItem on workflowSectionContainerHoverActionsMenu visible on workflowSectionHeader hover per FR-SEC-007
      - user clicks workflowEditSectionFormDeleteButton on workflowEditSectionForm in workflowRightSidebar

    mainFlow:
      - when workflowView contains exactly one workflowSectionContainer, workflowSectionContainerHoverActionsMenuDeleteItem is disabled and workflowEditSectionFormDeleteButton is disabled for every actor for whom those controls are rendered; workflowSectionDeleteDialog does not open from either entry path
      - when workflowView contains at least two workflowSectionContainers, hover-menu delete actionability follows FR-SEC-007 and sidebar delete button actionability follows FR-SEC-006 roleBehavior; system identifies the target workflowSectionContainer from workflowSectionContainerHoverActionsMenuDeleteItem on that section's workflowSectionHeader, or from workflowEditSectionForm open in workflowRightSidebar for that workflowSectionContainer
      - when workflowView contains at least two workflowSectionContainers and the actor clicks workflowSectionContainerHoverActionsMenuDeleteItem when active per FR-SEC-007 or workflowEditSectionFormDeleteButton when active per FR-SEC-006 roleBehavior, system opens workflowSectionDeleteDialog for the workflowSectionContainer from that entry path; the same workflowSectionDeleteDialog is shown for either entry path
      - workflowSectionDeleteDialog title is 'You are about to delete a section'; workflowSectionDeleteDialog body is 'By deleting this section, you will deleted all nodes which have been added to the section. Are you sure you want to proceed?'; workflowSectionDeleteDialogCancelButton is labeled 'Cancel' and workflowSectionDeleteDialogConfirmButton is labeled 'Delete section'
      - if user clicks workflowSectionDeleteDialogCancelButton, workflowSectionDeleteDialog closes and workflowView is unchanged (target workflowSectionContainer, its assigned workflowNodes, workflowEdges, and workflowSectionNumberLabel values unchanged)
      - if user clicks workflowSectionDeleteDialogConfirmButton, system removes the target workflowSectionContainer from workflowView and removes every workflowNode assigned to that workflowSectionContainer; every workflowEdge whose source or target was a removed workflowNode is removed; associated node metas and comments on the deleted section are removed per upstream; workflowOutcome assignments on removed workflowNodes are removed and workflowOutcome entities in the outcome tree are unchanged; system recalculates workflowSectionNumberLabel on every remaining workflowSectionHeader per FR-SEC-002
      - on confirm delete, if workflowRightSidebar was bound to the deleted workflowSectionContainer, workflowRightSidebar returns to default presentation per FR-WF-RS-004; if workflowRightSidebar was bound to a different host, sidebar tab and section selection are unchanged except that the deleted workflowSectionContainer is no longer in workflowView

    roleBehavior:
      owner:
        workflowEditSectionFormDeleteButton: active
      editor:
        workflowEditSectionFormDeleteButton: active
      commenter:
        workflowEditSectionFormDeleteButton: disabled
      viewer:
        workflowEditSectionFormDeleteButton: disabled
      user:
        workflowEditSectionFormDeleteButton: disabled

    acceptanceCriteria:
      - given workflowView contains exactly one workflowSectionContainer and actor is owner or editor, workflowSectionContainerHoverActionsMenuDeleteItem is disabled, workflowEditSectionFormDeleteButton is disabled, workflowSectionDeleteDialog does not open from either entry path, and that workflowSectionContainer remains in workflowView
      - given workflowView contains exactly one workflowSectionContainer and actor is commenter with workflowSectionContainerHoverActionsMenu visible per FR-SEC-007, workflowSectionContainerHoverActionsMenuDeleteItem is disabled and workflowEditSectionFormDeleteButton is disabled
      - given workflowSectionDeleteDialog is open, target workflowSectionContainer is not removed until user clicks workflowSectionDeleteDialogConfirmButton
      - given owner or editor opens workflowSectionDeleteDialog from either entry path, workflowSectionDeleteDialog title is 'You are about to delete a section', body is 'By deleting this section, you will deleted all nodes which have been added to the section. Are you sure you want to proceed?', workflowSectionDeleteDialogCancelButton is labeled 'Cancel', and workflowSectionDeleteDialogConfirmButton is labeled 'Delete section'
      - when user clicks workflowSectionDeleteDialogCancelButton, workflowSectionDeleteDialog closes and workflowView is unchanged (target workflowSectionContainer, its assigned workflowNodes, workflowEdges, and workflowSectionNumberLabel values unchanged)
      - given workflowView contains at least two workflowSectionContainers and confirmed delete via workflowSectionDeleteDialogConfirmButton, target workflowSectionContainer is removed from workflowView, at least one workflowSectionContainer remains, no workflowNode remains in the deleted workflowSectionContainer, no workflowEdge references a removed workflowNode, and remaining workflowSectionNumberLabel values reflect the new contiguous order per FR-SEC-002
      - given target workflowSectionContainer S is at top-to-bottom index K and owner or editor confirms delete of S via workflowSectionDeleteDialogConfirmButton, when delete completes, every workflowSectionContainer that was below S shifts up by one index and workflowSectionNumberLabel values on all remaining workflowSectionHeaders reflect the new contiguous order per FR-SEC-002
      - given target workflowSectionContainer S contains workflowNode A and workflowNode B is in a different workflowSectionContainer with a workflowEdge from A to B, when owner or editor confirms delete of S via workflowSectionDeleteDialogConfirmButton, that workflowEdge is removed and B remains in workflowView
      - given target workflowSectionContainer S contains workflowNode N assigned to workflowOutcome O and owner or editor confirms delete of S via workflowSectionDeleteDialogConfirmButton, when delete completes, N is removed from workflowView and workflowOutcome O still exists in the outcome tree
      - given workflowView contains at least two workflowSectionContainers and actor is commenter with workflowSectionContainerHoverActionsMenu visible per FR-SEC-007, workflowSectionContainerHoverActionsMenuDeleteItem is disabled
      - given actor is viewer or user (published-access), workflowSectionContainerHoverActionsMenu is not rendered on workflowSectionHeader hover per FR-SEC-007, so workflowSectionContainerHoverActionsMenuDeleteItem is not reachable and workflowSectionDeleteDialog cannot be opened via the hover path
      - given workflowEditSectionForm on workflowRightSidebarEditTab is bound to workflowSectionContainer S and owner or editor confirms delete of S via workflowSectionDeleteDialogConfirmButton, when delete completes, workflowRightSidebar returns to default presentation per FR-WF-RS-004 and no workflowSectionContainer shows workflowSectionContainerSelectedBorder per FR-SEC-010
      - given workflowRightSidebar is bound to workflowSectionContainer S2 and owner or editor confirms delete of a different workflowSectionContainer S1 via workflowSectionDeleteDialogConfirmButton, when delete completes, workflowRightSidebar remains bound to S2
      - given owner or editor confirms delete via workflowSectionContainerHoverActionsMenuDeleteItem while workflowRightSidebar is closed or bound to a non-deleted host, when delete completes, workflowRightSidebar presentation is unchanged except that the deleted workflowSectionContainer is removed from workflowView
      - given workflowEditSectionForm is open for workflowSectionContainer S and owner or editor clicks workflowEditSectionFormDeleteButton, workflowSectionDeleteDialog opens for S; given confirm via workflowSectionDeleteDialogConfirmButton, S is removed from workflowView
      - given actor is commenter, viewer, or user (published-access) with workflowEditSectionForm open, workflowEditSectionFormDeleteButton is disabled

    openQuestions: []

