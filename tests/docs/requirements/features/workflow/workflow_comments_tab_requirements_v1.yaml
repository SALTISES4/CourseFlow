requirements:
  - id: FR-WF-COMMENTS-001
    title: Open comments for a workflowNode (trigger paths)

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - FIGMA-WF-COMMENTS-NODE-COMMENTER
      - FIGMA-WF-COMMENTS-NODE-VIEWER

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowNode
      - workflowNodeHoverActionsMenu
      - workflowNodeHoverActionsMenuCommentsItem
      - workflowRightSidebar
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent

    preconditions:
      - workflowRightSidebar is visible per FR-WF-RS-001
      - for the hover-menu path, workflowView is rendered with at least one workflowNode and the user can hover that workflowNode so workflowNodeHoverActionsMenu is shown per FR-WF-NODE-005
      - for the sidebar-tab path, sidebar.edit already designates a workflowNode (CfObjectType.NODE) and workflowRightSidebarCommentsTab is rendered per FR-WF-RS-002 and FR-WF-RS-003

    trigger:
      - user clicks workflowNodeHoverActionsMenuCommentsItem on a hovered workflowNode
      - user clicks workflowRightSidebarCommentsTab while sidebar.edit designates a workflowNode (CfObjectType.NODE)

    mainFlow:
      - system sets sidebar.edit to that workflowNode with tab 'comments' (hover path per FR-WF-NODE-005) or switches workflowRightSidebar to workflowRightSidebarCommentsTab while preserving the NODE selection (tab path)
      - if workflowRightSidebar is collapsed, system expands workflowRightSidebar with workflowRightSidebarCommentsTab selected
      - if workflowRightSidebar is open on a different tab, system switches to workflowRightSidebarCommentsTab
      - system renders workflowRightSidebarCommentsTabContent for that workflowNode as the workflowCommentsHostObject
      - per-role actionability for workflowNodeHoverActionsMenuCommentsItem follows FR-WF-NODE-005; per-role actionability for workflowRightSidebarCommentsTab follows FR-WF-RS-003

    roleBehavior:
      owner:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      editor:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      commenter:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      viewer:
        workflowRightSidebarCommentsTab: notRenderedWhenNoEligibleSelection; disabledWhenEligibleSelectionExists
      user:
        workflowRightSidebarCommentsTab: notRenderedWhenNoEligibleSelection; disabledWhenEligibleSelectionExists

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and the user clicks workflowNodeHoverActionsMenuCommentsItem on hovered workflowNode N, workflowRightSidebar shows workflowRightSidebarCommentsTab selected and workflowRightSidebarCommentsTabContent is bound to workflowNode N
      - given actor is owner, editor, or commenter and sidebar.edit targets workflowNode N with workflowRightSidebarCommentsTab rendered, when the user clicks workflowRightSidebarCommentsTab, workflowRightSidebarCommentsTabContent is bound to workflowNode N
      - given actor is viewer or user, workflowRightSidebarCommentsTab is not rendered when no eligible host is selected and is not actionable when rendered per FR-WF-RS-003; the actor cannot open workflowRightSidebarCommentsTabContent for a workflowNode via these paths

    openQuestions: []

  - id: FR-WF-COMMENTS-002
    title: Open comments for a workflowSectionContainer (trigger paths)

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowSectionContainer
      - workflowSectionContainerHoverActionsMenu
      - workflowSectionContainerHoverActionsMenuCommentsItem
      - workflowRightSidebar
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent

    preconditions:
      - workflowRightSidebar is visible per FR-WF-RS-001
      - for the hover-menu path, workflowView shows at least one workflowSectionContainer row where workflowSectionContainerHoverActionsMenu can appear on hover
      - for the sidebar-tab path, sidebar.edit already designates a workflowSectionContainer (WEEK) for that section and workflowRightSidebarCommentsTab is rendered per FR-WF-RS-002 and FR-WF-RS-003

    trigger:
      - user clicks workflowSectionContainerHoverActionsMenuCommentsItem on a hovered workflowSectionContainer
      - user clicks workflowRightSidebarCommentsTab while sidebar.edit designates that section (CfObjectType.WEEK)

    mainFlow:
      - system sets sidebar.edit to that workflowSectionContainer with tab 'comments' (hover path per FR-SEC-007) or switches workflowRightSidebar to workflowRightSidebarCommentsTab while preserving the WEEK selection (tab path)
      - if workflowRightSidebar is collapsed, system expands workflowRightSidebar with workflowRightSidebarCommentsTab selected
      - if workflowRightSidebar is open on a different tab, system switches to workflowRightSidebarCommentsTab
      - system renders workflowRightSidebarCommentsTabContent for that workflowSectionContainer as the workflowCommentsHostObject
      - per-role actionability for workflowSectionContainerHoverActionsMenuCommentsItem follows FR-SEC-007; per-role actionability for workflowRightSidebarCommentsTab follows FR-WF-RS-003

    roleBehavior:
      owner:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      editor:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      commenter:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      viewer:
        workflowRightSidebarCommentsTab: notRenderedWhenNoEligibleSelection; disabledWhenEligibleSelectionExists
      user:
        workflowRightSidebarCommentsTab: notRenderedWhenNoEligibleSelection; disabledWhenEligibleSelectionExists

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and the user clicks workflowSectionContainerHoverActionsMenuCommentsItem on a hovered section S, workflowRightSidebar shows workflowRightSidebarCommentsTab selected and workflowRightSidebarCommentsTabContent is bound to section S
      - given actor is owner, editor, or commenter and sidebar.edit targets section S (WEEK) with workflowRightSidebarCommentsTab rendered, when the user clicks workflowRightSidebarCommentsTab, workflowRightSidebarCommentsTabContent is bound to section S

    openQuestions: []

  - id: FR-WF-COMMENTS-003
    title: Open comments for a workflowChannel (trigger paths)

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowChannel
      - workflowChannelHoverActionsMenu
      - workflowChannelHoverActionsMenuCommentsItem
      - workflowRightSidebar
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent

    preconditions:
      - workflowRightSidebar is visible per FR-WF-RS-001
      - for the hover-menu path, workflowView shows at least one workflowChannel header where workflowChannelHoverActionsMenu can appear on hover
      - for the sidebar-tab path, sidebar.edit already designates a workflowChannel (COLUMN) and workflowRightSidebarCommentsTab is rendered per FR-WF-RS-002 and FR-WF-RS-003

    trigger:
      - user clicks workflowChannelHoverActionsMenuCommentsItem on a hovered workflowChannel column header
      - user clicks workflowRightSidebarCommentsTab while sidebar.edit designates that channel (CfObjectType.COLUMN)

    mainFlow:
      - system sets sidebar.edit to that workflowChannel with tab 'comments' (hover path per FR-CHAN-007) or switches workflowRightSidebar to workflowRightSidebarCommentsTab while preserving the COLUMN selection (tab path)
      - if workflowRightSidebar is collapsed, system expands workflowRightSidebar with workflowRightSidebarCommentsTab selected
      - if workflowRightSidebar is open on a different tab, system switches to workflowRightSidebarCommentsTab
      - system renders workflowRightSidebarCommentsTabContent for that workflowChannel as the workflowCommentsHostObject
      - per-role actionability for workflowChannelHoverActionsMenuCommentsItem follows FR-CHAN-007; per-role actionability for workflowRightSidebarCommentsTab follows FR-WF-RS-003

    roleBehavior:
      owner:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      editor:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      commenter:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      viewer:
        workflowRightSidebarCommentsTab: notRenderedWhenNoEligibleSelection; disabledWhenEligibleSelectionExists
      user:
        workflowRightSidebarCommentsTab: notRenderedWhenNoEligibleSelection; disabledWhenEligibleSelectionExists

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and the user clicks workflowChannelHoverActionsMenuCommentsItem on a hovered channel C, workflowRightSidebar shows workflowRightSidebarCommentsTab selected and workflowRightSidebarCommentsTabContent is bound to channel C
      - given actor is owner, editor, or commenter and sidebar.edit targets channel C (COLUMN) with workflowRightSidebarCommentsTab rendered, when the user clicks workflowRightSidebarCommentsTab, workflowRightSidebarCommentsTabContent is bound to channel C

    openQuestions: []

  - id: FR-WF-COMMENTS-004
    title: Open comments for a workflowOutcome (trigger paths)

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowOutcome
      - workflowOutcomeHoverActionsMenu
      - workflowOutcomeHoverActionsMenuCommentsItem
      - workflowRightSidebar
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent

    preconditions:
      - workflowRightSidebar is visible per FR-WF-RS-001
      - for the Outcomes-view hover-menu path, user is in an Outcomes workspace view where outcome headers render workflowOutcomeHoverActionsMenu on hover
      - for the sidebar-tab path, sidebar.edit already designates a workflowOutcome (OUTCOME) and workflowRightSidebarCommentsTab is rendered per FR-WF-RS-002 and FR-WF-RS-003

    trigger:
      - user clicks workflowOutcomeHoverActionsMenuCommentsItem on a hovered outcome header in the Outcomes view
      - user clicks workflowRightSidebarCommentsTab while sidebar.edit designates that outcome (CfObjectType.OUTCOME)

    mainFlow:
      - system sets sidebar.edit to that workflowOutcome with tab 'comments' (Outcomes-view hover path from workflowOutcomeHoverActionsMenuCommentsItem) or switches workflowRightSidebar to workflowRightSidebarCommentsTab while preserving the OUTCOME selection (sidebar-tab path)
      - if workflowRightSidebar is collapsed, system expands workflowRightSidebar with workflowRightSidebarCommentsTab selected
      - if workflowRightSidebar is open on a different tab, system switches to workflowRightSidebarCommentsTab
      - system renders workflowRightSidebarCommentsTabContent for that workflowOutcome as the workflowCommentsHostObject
      - per-role actionability for workflowOutcomeHoverActionsMenuCommentsItem follows FR-WF-EO-003; per-role actionability for workflowRightSidebarCommentsTab follows FR-WF-RS-003

    roleBehavior:
      owner:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      editor:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      commenter:
        workflowRightSidebarCommentsTab: renderedAndEnabledWhenEligibleSelectionExists
      viewer:
        workflowRightSidebarCommentsTab: notRenderedWhenNoEligibleSelection; disabledWhenEligibleSelectionExists
      user:
        workflowRightSidebarCommentsTab: notRenderedWhenNoEligibleSelection; disabledWhenEligibleSelectionExists

    acceptanceCriteria:
      - given actor is owner, editor, or commenter and the user clicks workflowOutcomeHoverActionsMenuCommentsItem on a hovered outcome O in the Outcomes view, workflowRightSidebar shows workflowRightSidebarCommentsTab selected and workflowRightSidebarCommentsTabContent is bound to outcome O
      - given actor is owner, editor, or commenter and sidebar.edit targets outcome O (OUTCOME) with workflowRightSidebarCommentsTab rendered, when the user clicks workflowRightSidebarCommentsTab, workflowRightSidebarCommentsTabContent is bound to outcome O
      - given actor is viewer or user, workflowOutcomeHoverActionsMenuCommentsItem is not rendered per FR-WF-EO-003; workflowRightSidebarCommentsTab is not rendered when no eligible host is selected and is not actionable when rendered per FR-WF-RS-003

    openQuestions: []

  - id: FR-WF-COMMENTS-005
    title: Comments tab host matches sidebar selection and Edit tab content

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - FIGMA-WF-COMMENTS-NODE-COMMENTER
      - FIGMA-WF-COMMENTS-NODE-VIEWER

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowCommentsHostObject
      - workflowNode
      - workflowChannel
      - workflowSectionContainer
      - workflowOutcome
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowEditNodeForm

    preconditions:
      - workflowRightSidebar is visible per FR-WF-RS-001
      - user has opened workflowRightSidebarCommentsTabContent for a workflowCommentsHostObject H via FR-WF-COMMENTS-001, FR-WF-COMMENTS-002, FR-WF-COMMENTS-003, or FR-WF-COMMENTS-004 (or an equivalent dispatch that sets sidebar.edit to H with tab 'comments')

    trigger:
      - user views workflowRightSidebarCommentsTabContent after opening comments for host H
      - user clicks workflowRightSidebarEditTab after opening comments for host H

    mainFlow:
      - sidebar.edit identifies workflowCommentsHostObject H shown in workflowRightSidebarCommentsTabContent (same id and CfObjectType as the thread being listed and composed)
      - when the user clicks workflowRightSidebarEditTab, workflowRightSidebarEditTabContent shows the edit surface for the same H per FR-WF-EN-001 when H is a workflowNode; when H is a workflowChannel, workflowSectionContainer, or workflowOutcome, acceptance fixtures for the matching edit form are canonical in FR-CHAN-001, FR-SEC-001, and FR-WF-EO-004 respectively — this FR pins host identity only, not edit-form field detail
      - when H is deselected, removed from the workflow, or sub-view navigation resets sidebar presentation, workflowRightSidebarCommentsTabContent clears and workflowRightSidebarCommentsTab is removed from workflowRightSidebarTabStrip when no eligible host remains selected per FR-WF-RS-004 and FR-WF-RS-001 (not restated in this FR)
      - viewer and user cannot reach this state for a comments-eligible host per FR-WF-RS-003

    roleBehavior:
      owner:
        workflowRightSidebarCommentsTabContent: readWrite
      editor:
        workflowRightSidebarCommentsTabContent: readWrite
      commenter:
        workflowRightSidebarCommentsTabContent: readWrite
      viewer:
        workflowRightSidebarCommentsTabContent: notReachable
      user:
        workflowRightSidebarCommentsTabContent: notReachable

    acceptanceCriteria:
      - given workflowEditNodeForm was showing workflowNode N1 and the user opens comments for workflowNode N2 via FR-WF-COMMENTS-001, workflowRightSidebarCommentsTabContent is bound to N2 and sidebar.edit targets N2 so that when the user clicks workflowRightSidebarEditTab, workflowEditNodeForm targets workflowNode N2 per FR-WF-EN-001
      - given sidebar.edit targets a workflowChannel, workflowSectionContainer, or workflowOutcome and the user opened comments for that host via FR-WF-COMMENTS-002, FR-WF-COMMENTS-003, or FR-WF-COMMENTS-004, when the user clicks workflowRightSidebarEditTab, workflowRightSidebarEditTabContent reflects the same host identity as the comments thread (no stale selection from a previously focused object); per-host edit-form ACs are canonical in FR-CHAN-001 (workflowChannel), FR-SEC-001 (workflowSectionContainer), and this FR plus FR-WF-EO-004 / FR-WF-EO-018 (workflowOutcome)

    openQuestions: []

  - id: FR-WF-COMMENTS-006
    title: Display and compose comments in workflowRightSidebarCommentsTabContent

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - FIGMA-WF-COMMENTS-NODE-COMMENTER
      - FIGMA-WF-COMMENTS-EMPTY

    actors:
      - owner
      - editor
      - commenter

    uiObjects:
      - workflowRightSidebarCommentsTabContent
      - workflowCommentsHostObject
      - workflowCommentsTabTitle
      - workflowCommentsTabList
      - workflowCommentsTabListItem
      - workflowCommentsTabListItemHeader
      - workflowCommentsTabListItemBody
      - workflowCommentsTabComposer
      - workflowCommentsTabComposerTextField
      - workflowCommentsTabComposerSubmitButton

    preconditions:
      - workflowRightSidebarCommentsTabContent is bound to a workflowCommentsHostObject H per FR-WF-COMMENTS-005
      - actor is owner, editor, or commenter (viewer and user cannot reach this composer per FR-WF-RS-003)

    trigger:
      - user opens workflowRightSidebarCommentsTabContent for H via FR-WF-COMMENTS-001, FR-WF-COMMENTS-002, FR-WF-COMMENTS-003, or FR-WF-COMMENTS-004 (including sidebar-tab path)
      - user re-opens workflowRightSidebarCommentsTab for the same H after switching away to another sidebar tab while sidebar.edit still targets H
      - user types into workflowCommentsTabComposerTextField and clicks workflowCommentsTabComposerSubmitButton

    mainFlow:
      - shared chrome — workflowRightSidebarCommentsTabContent presents the same layout, labels, list, and composer for every workflowCommentsHostObject type (workflowNode, workflowChannel, workflowSectionContainer, workflowOutcome); FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR, FIGMA-WF-COMMENTS-NODE-COMMENTER, FIGMA-WF-COMMENTS-NODE-VIEWER, and FIGMA-WF-COMMENTS-EMPTY are the canonical design evidence for all host types
      - workflowRightSidebarCommentsTabContent is laid out vertically as workflowCommentsTabTitle, then workflowCommentsTabList (scrollable), then workflowCommentsTabComposer pinned at the bottom
      - workflowCommentsTabTitle text is the literal 'Comments'
      - on bind or re-open for H, system loads the stored comment thread for H and renders workflowCommentsTabList in reverse chronological order (newest first); when H has zero stored comments, workflowCommentsTabList contains no workflowCommentsTabListItem entries and matches FIGMA-WF-COMMENTS-EMPTY (empty list region with workflowCommentsTabComposer visible)
      - when workflowCommentsTabList contains at least one workflowCommentsTabListItem after open for H, workflowCommentsTabList is scrolled to the top so the newest comment (first item) is visible
      - workflowCommentsTabList renders zero or more workflowCommentsTabListItem entries for H in reverse chronological order (newest first)
      - each workflowCommentsTabListItem shows workflowCommentsTabListItemHeader on the first line and workflowCommentsTabListItemBody beneath; workflowCommentsTabListItemHeader format is exactly '{author-label} • {date-label}' where author-label is the comment author's first name and last name joined by a single space per FR-PROFILE-002
      - date-label for each workflowCommentsTabListItem is derived from the stored comment timestamp relative to when workflowCommentsTabList renders — age less than 1 minute renders 'just now'; age at least 1 minute and less than 1 hour renders '{n} minutes ago' (or '1 minute ago' when n is 1); age at least 1 hour and less than 24 hours renders '{n} hours ago' (or '1 hour ago' when n is 1); age at least 24 hours and at most 7 days renders '{n} days ago' (or '1 day ago' when n is 1); age greater than 7 days renders the stored timestamp as '{Month long} {Day}, {Year}' in en-US locale (e.g. 'May 11, 2026')
      - workflowCommentsTabComposer contains workflowCommentsTabComposerTextField with label 'Add a comment' (multiline, up to 5 visible rows before internal scroll, no maximum character length) and workflowCommentsTabComposerSubmitButton with literal label 'Add comment'
      - while the user types, workflowCommentsTabComposerTextField updates; workflowCommentsTabComposerSubmitButton is disabled when workflowCommentsTabComposerTextField value is empty and enabled when the value is non-empty
      - when the user clicks workflowCommentsTabComposerSubmitButton and workflowCommentsTabComposerTextField value is non-empty, system stores the new comment for H, then prepends the corresponding workflowCommentsTabListItem at the top of workflowCommentsTabList with author-label equal to the current actor's first name and last name joined by a single space per FR-PROFILE-002, date-label 'just now', and body equal to the submitted text; globalMessageSnackbar is not shown on successful submit (snackbar feedback applies to comment delete only per FR-WF-COMMENTS-007)
      - on failed submit, workflowCommentsTabComposerTextField retains the user's text, no workflowCommentsTabListItem is prepended, workflowCommentsTabComposerSubmitButton remains enabled, and globalMessageSnackbar is not shown
      - after a successful submit, workflowCommentsTabComposerTextField is reset to empty, workflowCommentsTabComposerSubmitButton returns to disabled, and workflowCommentsTabList scrolls to the top so the newly prepended workflowCommentsTabListItem is visible
      - canonical comment count for H (used by FR-WF-COMMENTS-008) is the stored flat comment count for H on the workflow; reply threading is out of scope

    roleBehavior:
      owner:
        workflowCommentsTabComposer: editable
        workflowCommentsTabComposerSubmitButton: disabledWhenComposerEmpty
      editor:
        workflowCommentsTabComposer: editable
        workflowCommentsTabComposerSubmitButton: disabledWhenComposerEmpty
      commenter:
        workflowCommentsTabComposer: editable
        workflowCommentsTabComposerSubmitButton: disabledWhenComposerEmpty

    acceptanceCriteria:
      - given workflowRightSidebarCommentsTabContent is bound to any workflowCommentsHostObject (workflowNode, workflowChannel, workflowSectionContainer, or workflowOutcome), the visible Comments tab layout matches the node Comments chrome in FIGMA-WF-COMMENTS-NODE-* (workflowCommentsTabTitle, scrollable workflowCommentsTabList, workflowCommentsTabComposer with the same structure and labels)
      - given workflowRightSidebarCommentsTabContent is bound to a workflowCommentsHostObject, workflowCommentsTabTitle text is exactly 'Comments'
      - given workflowRightSidebarCommentsTabContent opens for workflowCommentsHostObject H and H has zero stored comments, workflowCommentsTabList contains no workflowCommentsTabListItem entries, the layout matches FIGMA-WF-COMMENTS-EMPTY, workflowCommentsTabComposerTextField label is 'Add a comment', workflowCommentsTabComposerSubmitButton label is 'Add comment', and workflowCommentsTabComposerSubmitButton is disabled
      - given workflowRightSidebarCommentsTabContent opens for workflowCommentsHostObject H and H has two stored comments from other contributors plus none from the current actor, workflowCommentsTabList renders exactly those two items in newest-first order before the user submits
      - given workflowCommentsHostObject H has a stored comment authored by a contributor with profile first name 'Alex' and last name 'Smith' per FR-PROFILE-002 and stored timestamp less than 1 minute before workflowCommentsTabList renders, workflowCommentsTabListItemHeader for that comment is exactly 'Alex Smith • just now'
      - given a stored comment timestamp is 5 minutes before workflowCommentsTabList renders, date-label is '5 minutes ago'
      - given a stored comment timestamp is 2 days before workflowCommentsTabList renders, date-label is '2 days ago'
      - given a stored comment timestamp is May 11, 2026 and workflowCommentsTabList renders more than 7 days after that timestamp, date-label is exactly 'May 11, 2026'
      - given workflowCommentsTabComposerTextField is empty, workflowCommentsTabComposerSubmitButton is disabled
      - given the current actor's profile first name is 'Jane' and last name is 'Doe' per FR-PROFILE-002, workflowCommentsTabComposerTextField value is 'Hello', workflowCommentsTabComposerSubmitButton is enabled and when the user clicks it a new workflowCommentsTabListItem appears at the top of workflowCommentsTabList with workflowCommentsTabListItemBody text 'Hello' and workflowCommentsTabListItemHeader exactly 'Jane Doe • just now'
      - given a successful submit, workflowCommentsTabComposerTextField is reset to empty and workflowCommentsTabComposerSubmitButton is disabled after the new workflowCommentsTabListItem is prepended at the top, and globalMessageSnackbar is not shown
      - given a successful submit for H, when the actor reloads the page and re-opens comments for H via FR-WF-COMMENTS-001, the submitted comment is still present in workflowCommentsTabList
      - given workflowCommentsTabList has at least one item after open for H, the list is scrolled to the top so the newest item (first in the list) is visible

      - given workflowCommentsTabComposerTextField contains plain text longer than one visible row, the field scrolls internally after 5 visible rows and workflowCommentsTabComposerSubmitButton remains enabled when the value is non-empty
      - given submit fails when workflowCommentsTabComposerTextField value is 'Hello', workflowCommentsTabList is unchanged, workflowCommentsTabComposerTextField still contains 'Hello', workflowCommentsTabComposerSubmitButton is enabled, and globalMessageSnackbar is not shown

    openQuestions: []

  - id: FR-WF-COMMENTS-007
    title: Delete an own comment from workflowCommentsTabList

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - FIGMA-WF-COMMENTS-NODE-COMMENTER

    actors:
      - owner
      - editor
      - commenter

    uiObjects:
      - workflowRightSidebarCommentsTabContent
      - workflowCommentsTabList
      - workflowCommentsTabListItem
      - workflowCommentsTabListItemDeleteLink
      - globalMessageSnackbar

    preconditions:
      - workflowRightSidebarCommentsTabContent is bound to a workflowCommentsHostObject per FR-WF-COMMENTS-005
      - workflowCommentsTabList contains at least one workflowCommentsTabListItem authored by the current actor

    trigger:
      - user clicks workflowCommentsTabListItemDeleteLink on a workflowCommentsTabListItem they authored

    mainFlow:
      - workflowCommentsTabListItemDeleteLink is rendered only on workflowCommentsTabListItem entries authored by the current actor; owner, editor, and commenter cannot delete another user's comment (no moderation delete for any role)
      - delete is a single step — no confirmation dialog is shown before or after the user clicks workflowCommentsTabListItemDeleteLink
      - on successful delete, system removes the stored comment for the bound workflowCommentsHostObject, removes the corresponding workflowCommentsTabListItem from workflowCommentsTabList immediately, and shows globalMessageSnackbar with copy 'Your comment has been successfully deleted'
      - on failed delete, the target workflowCommentsTabListItem remains in workflowCommentsTabList and globalMessageSnackbar shows copy 'We encountered an issue and your comment was not deleted'
      - other workflowCommentsTabListItem entries are not affected
      - workflowCommentsTabComposer state is not affected by a delete

    roleBehavior:
      owner:
        workflowCommentsTabListItemDeleteLink: visibleOnOwnCommentOnly
      editor:
        workflowCommentsTabListItemDeleteLink: visibleOnOwnCommentOnly
      commenter:
        workflowCommentsTabListItemDeleteLink: visibleOnOwnCommentOnly

    acceptanceCriteria:
      - given a workflowCommentsTabListItem authored by another user, workflowCommentsTabListItemDeleteLink is not rendered on that item for owner, editor, or commenter
      - given a workflowCommentsTabListItem authored by the current actor and delete succeeds when the user clicks workflowCommentsTabListItemDeleteLink, the item is removed from workflowCommentsTabList immediately, no confirmation dialog is shown, and globalMessageSnackbar shows 'Your comment has been successfully deleted'
      - given a workflowCommentsTabListItem authored by the current actor and delete fails when the user clicks workflowCommentsTabListItemDeleteLink, the item remains in workflowCommentsTabList, no confirmation dialog is shown, and globalMessageSnackbar shows 'We encountered an issue and your comment was not deleted'

    openQuestions: []

  - id: FR-WF-COMMENTS-008
    title: Comments presence indicator on host hover action menus

    designEvidence:
      - FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowCommentsHostObject
      - workflowCommentsPresenceIndicator
      - workflowNodeHoverActionsMenu
      - workflowNodeHoverActionsMenuCommentsItem
      - workflowSectionContainerHoverActionsMenu
      - workflowSectionContainerHoverActionsMenuCommentsItem
      - workflowChannelHoverActionsMenu
      - workflowChannelHoverActionsMenuCommentsItem
      - workflowOutcomeHoverActionsMenu
      - workflowOutcomeHoverActionsMenuCommentsItem

    preconditions:
      - workflowCommentsHostObject H is displayed in workflowView or Outcomes view with its hover actions menu available on hover (per FR-WF-NODE-005 for workflowNode; analogous hover for other hosts)

    trigger:
      - user hovers the host surface so the relevant hover actions menu is visible

    mainFlow:
      - when the stored comment count for H per FR-WF-COMMENTS-006 is at least one, the Comments affordance in that host's hover actions menu (workflowNodeHoverActionsMenuCommentsItem, workflowSectionContainerHoverActionsMenuCommentsItem, workflowChannelHoverActionsMenuCommentsItem, or workflowOutcomeHoverActionsMenuCommentsItem) shows workflowCommentsPresenceIndicator as a green circular badge on or adjacent to the comment icon; shape, color, and placement match FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - when the stored comment count for H per FR-WF-COMMENTS-006 is zero, workflowCommentsPresenceIndicator is not shown on that Comments affordance
      - read/unread state does not affect workflowCommentsPresenceIndicator; only stored comment count for H matters

    roleBehavior:
      owner:
        workflowCommentsPresenceIndicator: visibleWhenCommentsExist
      editor:
        workflowCommentsPresenceIndicator: visibleWhenCommentsExist
      commenter:
        workflowCommentsPresenceIndicator: visibleWhenCommentsExist
      viewer:
        workflowCommentsPresenceIndicator: notRendered
      user:
        workflowCommentsPresenceIndicator: notRendered

    acceptanceCriteria:
      - given workflowNode N has at least one stored comment per FR-WF-COMMENTS-006, when the user hovers N and workflowNodeHoverActionsMenu is visible, workflowNodeHoverActionsMenuCommentsItem shows workflowCommentsPresenceIndicator matching FIGMA-WF-COMMENTS-NODE-OWNER-EDITOR
      - given workflowNode N has zero stored comments per FR-WF-COMMENTS-006, when the user hovers N and workflowNodeHoverActionsMenu is visible, workflowNodeHoverActionsMenuCommentsItem does not show workflowCommentsPresenceIndicator
      - given workflowNode N has at least one stored comment per FR-WF-COMMENTS-006 and the actor has opened and viewed comments for N via FR-WF-COMMENTS-001, workflowCommentsPresenceIndicator remains visible on workflowNodeHoverActionsMenuCommentsItem when the user hovers N again (read/unread does not hide the badge)
      - given the same stored-count rules, workflowSectionContainerHoverActionsMenuCommentsItem, workflowChannelHoverActionsMenuCommentsItem, and workflowOutcomeHoverActionsMenuCommentsItem each show or hide workflowCommentsPresenceIndicator consistently for their respective hosts
    
    openQuestions: []

