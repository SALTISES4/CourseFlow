# Normalized requirements: workflowRightSidebarCommentsTab — comments for workflow hosts (nodes, channels, sections, outcomes)
# Scope: workflowRightSidebarCommentsTabContent for any workflowCommentsHostObject whose type is one of NODE, COLUMN, WEEK, or OUTCOME (NODE → workflowNode, COLUMN → workflowChannel, WEEK → workflowSectionContainer, OUTCOME → workflowOutcome). FR-WF-COMMENTS-001 through FR-WF-COMMENTS-004 each normalize how to open comments for one host type; FR-WF-COMMENTS-005 binds that host to sidebar.edit and the Edit tab; FR-WF-COMMENTS-006 normalizes thread display and compose; FR-WF-COMMENTS-007 normalizes delete; FR-WF-COMMENTS-008 normalizes the comments-presence indicator on hover action menus. Bound comments content teardown (host deselected, host removed, sub-view navigation) is canonical per FR-WF-RS-004 and FR-WF-RS-001 in workflow_right_sidebar_requirements_v1.yaml — this file does not restate those rules. Archive and product intent: commenting works the same way for every host type (list, composer, plain text, own-comment delete); only entry paths differ. Same bind/rebind vocabulary as workflow_edit_node_requirements_v1.yaml FR-WF-EN-001 for sidebar.edit targets where applicable.
# Source (product): tests/docs/__ARCHIVE/functional-requirements.md — Commenting (comments on Nodes, Channels, Sections, Outcomes, Permissions; roles Owner/Editor/Commentor add and view; plain text; own-comment delete — lines 91–107). Archive line 105 describes owner-only delete of others' comments; normalized product intent in this file rejects that — only the authoring user may delete a comment (owner, editor, and commenter alike). Node/Channel/Section references in the same archive; Workflow sidebar matrix Comment tab visibility (lines 1273–1276).
# Source (design): Figma CourseFlow 2.0 — FIGMA-WF-COMMENTS-NODE-* frames (owner/editor, commenter, viewer) and FIGMA-WF-COMMENTS-EMPTY (empty thread + composer) are the canonical design evidence for workflowRightSidebarCommentsTabContent for every workflowCommentsHostObject type (workflowNode, workflowChannel, workflowSectionContainer, workflowOutcome); there are no host-specific Comments tab layouts.
# Normative entry-path cross-references: tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml FR-WF-NODE-005 (node hover); tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml FR-SEC-007 (section hover lockstep); tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml FR-CHAN-007 (channel hover lockstep); tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml (outcome header hover in Outcomes view — FR-WF-COMMENTS-004).
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/guidelines_functional_requirements.md; tests/docs/requirements/features/shared/card_content_requirements_v1.yaml (globalMessageSnackbar — FR-CARD-005); tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar, FR-WF-RS-001, FR-WF-RS-002, FR-WF-RS-003, FR-WF-RS-004 — sidebar visibility, tab strip, eligible selection, bound Edit/Comments content teardown); tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml (FR-WF-NODE-005); tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml (workflowEditNodeForm / sidebar.edit binding per FR-WF-EN-001); tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml (workflowChannel); tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (workflowSectionContainer); tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml (workflowChannelHoverActionsMenu — FR-CHAN-007); tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml (workflowOutcomeHoverActionsMenu — Outcomes view entry path for FR-WF-COMMENTS-004); tests/docs/requirements/features/workflow/workflow_node_linked_outcomes_badge_requirements_v1.yaml (linked-outcomes popover — no outcome comments entry; unlink only per FR-WF-AO-010).
#   - tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002)
#
# IMPORTANT: Loading presentation for comment thread load is out of scope for this normalization pass. Reply threading is out of scope. Where product behavior is still undecided, openQuestions record the delta. Figma frames anchor owner/editor vs commenter vs viewer layouts, comments-presence indicator chrome, and FIGMA-WF-COMMENTS-EMPTY for the zero-comment thread.

documentPreconditions:
  - user is authenticated to CourseFlow and on an existing workflow route
  - workflowRightSidebar is visible per FR-WF-RS-001
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

