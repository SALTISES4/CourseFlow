requirements:
  - id: FR-WF-EO-015
    title: Drag a workflowOutcome row from workflowOutcomeHeader to initiate a tree move
    
    designEvidence:
      - FIGMA-WF-EO-OE-EDIT
    
    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user
    
    uiObjects:
      - workflowOutcomeTree
      - workflowOutcome
      - workflowOutcomeHeader
    
    preconditions:
      - workflowOutcomeView is open
      - workflowOutcomeTree is rendered with at least one workflowOutcome
    
    trigger:
      - owner or editor presses pointer on workflowOutcomeHeader of a source workflowOutcome, moves the pointer with the button held, and releases over a valid drop target defined in FR-WF-EO-016 or FR-WF-EO-017
    
    mainFlow:
      - drag source — owner or editor initiates an outcome tree move by dragging workflowOutcomeHeader; commenter, viewer, and user cannot initiate outcome tree reorder drag
      - while owner or editor holds the pointer after press on workflowOutcomeHeader, the source workflowOutcome row is in an in-drag presentation until release or cancel
      - release over a non-valid drop target leaves the workflowOutcomeTree unchanged
    
    roleBehavior:
      owner:
        workflowOutcomeHeader: dragSourceActive
      editor:
        workflowOutcomeHeader: dragSourceActive
      commenter:
        workflowOutcomeHeader: notDraggableForTreeReorder
      viewer:
        workflowOutcomeHeader: notDraggableForTreeReorder
      user:
        workflowOutcomeHeader: notDraggableForTreeReorder
    
    acceptanceCriteria:
      - given actor is owner or editor, when actor begins a pointer drag from workflowOutcomeHeader of a workflowOutcome while dragSourceActive per this FR's roleBehavior, then the source row shows an in-drag presentation until release
      - given actor is commenter, when actor presses pointer on workflowOutcomeHeader and moves the pointer, no outcome tree reorder drag session is initiated per this FR's roleBehavior (workflowOutcomeHeader is notDraggableForTreeReorder), the source row does not show an in-drag presentation, and workflowOutcomeTree is unchanged
      - given actor is viewer or user (published-access), when actor presses pointer on workflowOutcomeHeader and moves the pointer, no outcome tree reorder drag session is initiated per this FR's roleBehavior (workflowOutcomeHeader is notDraggableForTreeReorder), the source row does not show an in-drag presentation, and workflowOutcomeTree is unchanged
    
    openQuestions: []

  - id: FR-WF-EO-016
    title: Reorder or reparent a workflowOutcome before or after another same-level row (insert-before / insert-after)
    
    designEvidence:
      - FIGMA-WF-EO-OE-EDIT
    
    actors:
      - owner
      - editor
    
    uiObjects:
      - workflowOutcomeTree
      - workflowOutcome
      - workflowOutcomeHeader
      - workflowOutcomeHeaderToggle
      - workflowOutcomeHeaderTitle
      - workflowOutcomeTreeRowDropIndicator
      - workflowOutcomeHeaderSelectedBorder
      - workflowEditOutcomeForm
      - workflowRightSidebar
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent
    
    preconditions:
      - FR-WF-EO-015 preconditions hold
      - actor is owner or editor
      - two distinct workflowOutcome rows exist at the same level (level 1, level 2, or level 3)
    
    trigger:
      - owner or editor drags the source workflowOutcome and releases on an insert-before or insert-after drop position relative to the destination workflowOutcome row when that position is a valid reorder target for the drag payload
    
    mainFlow:
      - the drop hit-target for a destination row spans the entire workflowOutcomeHeader strip, including the workflowOutcomeHeaderToggle area; hovering over workflowOutcomeHeaderToggle during a drag is treated identically to hovering over the rest of workflowOutcomeHeader (no excluded sub-region within the row's header strip)
      - within the destination workflowOutcomeHeader strip the vertical axis is split 50/50 to map pointer position to insert-before vs insert-after — the top 50% of the header maps to the insert-before position relative to that row, the bottom 50% maps to the insert-after position; consequently the slot 'between two adjacent same-level rows O1 and O2' is reachable from either the bottom 50% of O1's workflowOutcomeHeader or the top 50% of O2's workflowOutcomeHeader (both pointer positions resolve to the same insert slot)
      - reorder drop affordance — valid insert-before and insert-after targets for this FR are rendered only as workflowOutcomeTreeRowDropIndicator (a vertical line above or below a destination row), whether reordering same-level siblings under the same parent or reparenting a same-level source to insert among another parent's existing children at that level (for example three level-2 outcomes under the same level-1 parent show line indicators above or below each level-2 row when reordering among them)
      - while the pointer moves over a destination workflowOutcome row at the same level as the source, workflowOutcomeTreeRowDropIndicator shows the resulting insert-before or insert-after line position per the 50/50 mapping above
      - collapsed parent expands on drag-over — when the source is a level-2 or level-3 child workflowOutcome and the actor drags it toward a different parent target row (the level-1 parent when reparenting level-2 children among another level-1 parent's children, or the level-2 parent when reparenting level-3 children among another level-2 parent's children) that is collapsed, the parent target row expands while the pointer remains over that parent target during the in-flight drag; after expansion, same-level workflowOutcomeTreeRowDropIndicator line affordances among that parent's children are offered per the rules above
      - level unchanged — workflowOutcomeTreeRowDropIndicator insert-before and insert-after affordances are offered only on destination workflowOutcome rows at the same level as the source (for example a level-2 source shows reorder drop zones only on other level-2 rows, whether reparenting under a different level-1 parent or reordering among siblings under the same level-1 parent); hovering or releasing over a destination at a different level does not show a reorder drop zone per this FR; reparenting a source as the last child under a different parent row at the adjacent tier (level-2 onto level-1 header, or level-3 onto level-2 header) uses the combine affordance on the destination workflowOutcomeHeader per FR-WF-EO-017 when eligible, not insert-before or insert-after; after any valid move per this FR or FR-WF-EO-017 the source remains at the same level (L1, L2, or L3 — only parent and sibling index may change)
      - on release on a valid before or after position, system moves the source workflowOutcome to the ordered position relative to the destination within their shared parent child list (the parent is the destination row's parent; if the source had a different parent, the source is reparented to that parent and inserted at the chosen index)
      - subtree travels with the source — the source workflowOutcome is moved as a whole subtree; every direct child and grandchild of the source remains a descendant of the source after the move, with their relative order preserved; no descendant is orphaned or reparented independently of the source
      - after the move, workflowOutcomeHeaderTitle ordinals for all affected rows recompute per FR-WF-EO-007
      - sidebar and selection — a valid move does not change workflowRightSidebar host binding or clear workflowOutcomeHeaderSelectedBorder; when workflowRightSidebarEditTabContent or workflowRightSidebarCommentsTabContent was bound to the source workflowOutcome before the move, after the move it remains bound to that same workflowOutcome and workflowOutcomeHeaderSelectedBorder remains on that workflowOutcome per FR-WF-EO-018; when workflowRightSidebar was bound to a different workflowOutcome not in the moved subtree, binding and selection chrome are unchanged aside from FR-WF-EO-007 ordinal updates on affected headers
      - downstream workflow view — when a valid move reparents source workflowOutcome S under workflowOutcome P, workflowNode assignment sets and linked-outcomes UI refresh per FR-WF-AO-006 (tree-change assign cascade), FR-WF-AO-007, and FR-WF-AO-009
    
    roleBehavior:
      owner:
        workflowOutcomeTree: editableWhereApplicable
      editor:
        workflowOutcomeTree: editableWhereApplicable
    
    acceptanceCriteria:
      - given two workflowOutcome rows A and B share the same parent and appear in order (A then B) at the same level, when owner drags B and drops on the insert-before position relative to A while workflowOutcomeTree is editableWhereApplicable per this FR's roleBehavior, then the sibling order becomes (B then A) and ordinals per FR-WF-EO-007 update accordingly
      - given two workflowOutcome rows at the same level with different parents, when owner drags the source onto a valid before or after position on a destination row, then the source appears adjacent to the destination in the destination parent's child order and the source's parent reference matches the destination's parent
      - given a workflowOutcome P has ordered direct-child workflowOutcomes C1, C2, …, Cn (n≥1) at the same level and a workflowOutcome S at that same level is a direct child of a different parent, when owner drags S and releases on the insert-before position relative to Ck (1≤k≤n), then S is reparented to P, the direct-child order under P becomes (C1, …, C(k-1), S, Ck, …, Cn), and workflowOutcomeHeaderTitle ordinals for all affected rows recompute per FR-WF-EO-007 (each of Ck through Cn shifts down one ordinal position among P's children)
      - given a level-1 source workflowOutcome S with direct-child level-2 workflowOutcomes S1, S2 (and S1 may itself have a level-3 child S1a) is moved via a valid before or after release to a new position in the level-1 sibling order, after the move S still has direct children S1 and S2 in the same relative order, S1 still has direct child S1a, and no descendant of S appears at any other position in workflowOutcomeTree
      - given three level-2 workflowOutcome rows C1, C2, and C3 under the same level-1 parent, when owner drags one of them to reorder among the others during an in-flight drag per FR-WF-EO-015, only workflowOutcomeTreeRowDropIndicator line affordances (insert-before or insert-after) are offered on the other level-2 rows
      - given level-1 parent workflowOutcome P is collapsed with direct-child level-2 workflowOutcomes C1 and C2, when owner drags a level-2 source S (direct child of a different level-1 parent) over P during an in-flight drag per FR-WF-EO-015, then P expands while the pointer remains over P and workflowOutcomeTreeRowDropIndicator line affordances are offered on C1 and C2 as eligible same-level reorder targets for S
      - given two adjacent same-level destination rows O1 and O2 in workflowOutcomeTree (O2 appearing immediately after O1 in the same parent's child order), when the pointer is over the bottom 50% of O1's workflowOutcomeHeader or the top 50% of O2's workflowOutcomeHeader, workflowOutcomeTreeRowDropIndicator shows the same insert position (between O1 and O2) and release on either position produces the same resulting tree
      - given source workflowOutcome S and destination workflowOutcome D are at different levels, when owner drags S over D's workflowOutcomeHeader, workflowOutcomeTreeRowDropIndicator does not show insert-before or insert-after affordances on D (no reorder drop zone is offered for cross-level rows per this FR)
      - given owner completes a valid insert-before or insert-after move of source workflowOutcome S per this FR, S remains at the same level after the move (only S's parent and sibling index may change)
      - given workflowEditOutcomeForm is bound to workflowOutcome O on workflowRightSidebarEditTab and owner completes a valid sibling reorder or reparent move of O per this FR, after the move workflowEditOutcomeForm remains bound to O and workflowOutcomeHeaderSelectedBorder remains on O per FR-WF-EO-018
      - given workflowEditOutcomeForm is bound to workflowOutcome O on workflowRightSidebarEditTab and owner completes a valid sibling reorder or reparent move of a different workflowOutcome not in O's subtree, after the move workflowEditOutcomeForm remains bound to O, workflowRightSidebar presentation is unchanged, and workflowOutcomeHeaderSelectedBorder remains on O per FR-WF-EO-018
      - given workflowRightSidebarCommentsTabContent is bound to workflowOutcome O per FR-WF-COMMENTS-004 and owner completes a valid sibling reorder or reparent move of O per this FR, after the move workflowRightSidebarCommentsTabContent remains bound to O and workflowOutcomeHeaderSelectedBorder remains on O per FR-WF-EO-018
      - given workflowRightSidebarCommentsTabContent is bound to workflowOutcome O per FR-WF-COMMENTS-004 and owner completes a valid sibling reorder or reparent move of a different workflowOutcome not in O's subtree, after the move workflowRightSidebarCommentsTabContent remains bound to O and workflowOutcomeHeaderSelectedBorder remains on O per FR-WF-EO-018
      - given owner completes a valid reparent move per this FR, workflowNode assignment sets and linked-outcomes badge/popover refresh per FR-WF-AO-006, FR-WF-AO-007, and FR-WF-AO-009
    
    openQuestions: []

  - id: FR-WF-EO-017
    title: Reparent a workflowOutcome as the last child of a parent row (combine drop on header)
    
    designEvidence:
      - FIGMA-WF-EO-OE-EDIT
    
    actors:
      - owner
      - editor
    
    uiObjects:
      - workflowOutcomeTree
      - workflowOutcome
      - workflowOutcomeHeader
      - workflowOutcomeHeaderToggle
      - workflowOutcomeHeaderTitle
      - workflowOutcomeTreeRowDropIndicator
      - workflowOutcomeHeaderSelectedBorder
      - workflowEditOutcomeForm
      - workflowRightSidebar
      - workflowRightSidebarEditTab
      - workflowRightSidebarEditTabContent
      - workflowRightSidebarCommentsTab
      - workflowRightSidebarCommentsTabContent
    
    preconditions:
      - FR-WF-EO-015 preconditions hold
      - actor is owner or editor
      - source workflowOutcome is exactly one level deeper than the destination workflowOutcome (level 2 source onto level 1 destination, or level 3 source onto level 2 destination)
      - the source workflowOutcome is not already a direct child of the destination workflowOutcome
    
    trigger:
      - owner or editor drags the source workflowOutcome and releases on the destination workflowOutcomeHeader on the combine affordance that nests the source as the last child of the destination (distinct from insert-before or insert-after positions shown by workflowOutcomeTreeRowDropIndicator on that row per FR-WF-EO-016)
    
    mainFlow:
      - level unchanged — combine drop reparents the source under the destination parent as its last direct child; a level-2 source remains level 2 and a level-3 source remains level 3 after the move (only which parent owns the source and its sibling index among that parent's children may change)
      - on a valid combine release (pointer release on the destination workflowOutcomeHeader on that nest-as-last-child affordance, not on an FR-WF-EO-016 insert-before or insert-after indicator on the same row), system reparents the source workflowOutcome so its parent is the destination workflowOutcome and it becomes the last entry in the destination's child list
      - collapsed destination expands on drag-over — when the destination workflowOutcome row is collapsed and the actor drags an eligible source (level 2 onto level 1, or level 3 onto level 2) over that destination during an in-flight drag per FR-WF-EO-015, the destination expands while the pointer remains over it so FR-WF-EO-016 line affordances among its children and the combine nest affordance on its workflowOutcomeHeader per this FR are offered as usual
      - subtree travels with the source — the source workflowOutcome is moved as a whole subtree; every direct child and grandchild of the source remains a descendant of the source after the move, with their relative order preserved; no descendant is orphaned or reparented independently of the source
      - if the destination row was still collapsed at combine release, system expands it so the newly nested source row is visible
      - after the move, workflowOutcomeHeaderTitle ordinals for all affected rows recompute per FR-WF-EO-007
      - sidebar and selection — a valid move does not change workflowRightSidebar host binding or clear workflowOutcomeHeaderSelectedBorder; when workflowRightSidebarEditTabContent or workflowRightSidebarCommentsTabContent was bound to the source workflowOutcome before the move, after the move it remains bound to that same workflowOutcome and workflowOutcomeHeaderSelectedBorder remains on that workflowOutcome per FR-WF-EO-018; when workflowRightSidebar was bound to a different workflowOutcome not in the moved subtree, binding and selection chrome are unchanged aside from FR-WF-EO-007 ordinal updates on affected headers
      - downstream workflow view — when a valid move reparents source workflowOutcome S under workflowOutcome P, workflowNode assignment sets and linked-outcomes UI refresh per FR-WF-AO-006 (tree-change assign cascade), FR-WF-AO-007, and FR-WF-AO-009
    
    roleBehavior:
      owner:
        workflowOutcomeTree: editableWhereApplicable
      editor:
        workflowOutcomeTree: editableWhereApplicable
    
    acceptanceCriteria:
      - given a level-2 workflowOutcome C and a level-1 workflowOutcome P where C is not already a child of P, when owner completes a valid combine drop of C onto P while workflowOutcomeTree is editableWhereApplicable per this FR's roleBehavior, then C's parent is P and C appears as the last child under P in workflowOutcomeTree
      - given a level-1 workflowOutcome P with existing direct-child level-2 workflowOutcomes C1, C2, …, Cn (n≥0) and a level-2 workflowOutcome S that is not already a direct child of P, when owner completes a valid combine drop of S onto P's workflowOutcomeHeader, then S's parent is P and the direct-child order under P is (C1, C2, …, Cn, S) with S last
      - given a level-2 source workflowOutcome S with direct-child level-3 workflowOutcome S1 and a level-1 destination P, when owner completes a valid combine drop of S onto P per this FR, then after the move S is the last direct child of P, S still has direct child S1, and S1 is at level 3 under S (no descendant of S is orphaned or reparented independently of S)
      - given destination workflowOutcome P is collapsed and owner drags an eligible level-2 source over P during an in-flight drag per FR-WF-EO-015, then P expands while the pointer remains over P and the combine nest affordance on P's workflowOutcomeHeader is offered per this FR
      - given destination workflowOutcome P is collapsed and a valid combine drop nests C under P, then P is expanded after the drop and C is visible
      - given workflowEditOutcomeForm is bound to workflowOutcome O on workflowRightSidebarEditTab and owner completes a valid combine drop that moves O per this FR, after the move workflowEditOutcomeForm remains bound to O and workflowOutcomeHeaderSelectedBorder remains on O per FR-WF-EO-018
      - given workflowEditOutcomeForm is bound to workflowOutcome O on workflowRightSidebarEditTab and owner completes a valid combine drop of a different workflowOutcome not in O's subtree, after the move workflowEditOutcomeForm remains bound to O, workflowRightSidebar presentation is unchanged, and workflowOutcomeHeaderSelectedBorder remains on O per FR-WF-EO-018
      - given workflowRightSidebarCommentsTabContent is bound to workflowOutcome O per FR-WF-COMMENTS-004 and owner completes a valid combine drop that moves O per this FR, after the move workflowRightSidebarCommentsTabContent remains bound to O and workflowOutcomeHeaderSelectedBorder remains on O per FR-WF-EO-018
      - given workflowRightSidebarCommentsTabContent is bound to workflowOutcome O per FR-WF-COMMENTS-004 and owner completes a valid combine drop of a different workflowOutcome not in O's subtree, after the move workflowRightSidebarCommentsTabContent remains bound to O and workflowOutcomeHeaderSelectedBorder remains on O per FR-WF-EO-018
      - given owner completes a valid reparent move per this FR, workflowNode assignment sets and linked-outcomes badge/popover refresh per FR-WF-AO-006, FR-WF-AO-007, and FR-WF-AO-009
    
    openQuestions: []

openQuestions: []
