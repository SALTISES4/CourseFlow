# Normalized requirements: drag-and-drop reorder, reparent, and nest workflowOutcome rows in workflowOutcomeTree ('Outcomes' view)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Scope (this file): owner and editor drag a workflowOutcome row from workflowOutcomeHeader within workflowOutcomeTree to reorder (insert-before/insert-after at the same level via workflowOutcomeTreeRowDropIndicator line affordances only), reparent among same-level siblings, or nest as the last child of another row (combine drop); collapsed parent or destination rows expand on drag-over so child line affordances and combine targets are offered; in-flight drop affordances; post-move ordinal recompute per FR-WF-EO-007; sidebar binding and selection chrome persistence on valid moves per FR-WF-EO-018; downstream linked-outcomes badge and popover refresh per FR-WF-AO-007 and FR-WF-AO-009. Out of scope: creating outcomes (FR-WF-EO-001 through FR-WF-EO-003), editing fields (FR-WF-EO-004 through FR-WF-EO-006), duplicate (FR-WF-EO-009 through FR-WF-EO-011), delete (FR-WF-EO-012 through FR-WF-EO-014), drag-and-drop assignment of outcomes to workflowNodes (tests/docs/requirements/features/workflow/workflow_assign_outcome_to_node_requirements_v1.yaml — FR-WF-AO-004). Three-level depth cap is a global invariant per FR-WF-EO-008 (not re-specified in this file).
# Cross-reference: tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml (canonical workflowOutcomeView, workflowOutcomeTree, workflowOutcome, workflowOutcomeHeader, workflowOutcomeHeaderToggle, workflowOutcomeHeaderTitle — FR-WF-EO-004; auto-numbering ordinals — FR-WF-EO-007; outcome header selection chrome — FR-WF-EO-018; three-level depth cap — FR-WF-EO-008); tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml (workflowRightSidebar, workflowRightSidebarEditTab, workflowRightSidebarEditTabContent — FR-WF-RS-004); tests/docs/requirements/features/workflow/workflow_comments_tab_requirements_v1.yaml (comments tab host binding — FR-WF-COMMENTS-004); tests/docs/requirements/features/workflow/workflow_node_linked_outcomes_badge_requirements_v1.yaml (linked-outcomes badge and popover refresh on tree move — FR-WF-AO-007, FR-WF-AO-009); tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail — FR-WS-ACCESS-002); tests/docs/requirements/guidelines_functional_requirements.md

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/outcomes'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - workflowOutcomeView is open and workflowOutcomeTree is rendered
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

