# Normalized requirements: workflow 'Overview' view metadata (activity, course, program)
# Version: 1.5
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Workflow Metadata + Views/Overview sections)
# Product decision: 2026-11-24 uses Figma-authoritative split Hours/Minutes controls for Time while retaining canonical integer minutes.
# Product decision: 2026-11-26 uses one whole-number Hours input for Ponderation and Classification, stores its value as integer minutes divisible by 60, and rounds automatic Classification minutes only for presentation.
# Product decision: 2026-11-27 suppresses Ponderation and Classification mismatch warnings until the corresponding section contains at least one value greater than zero.
# Product decision: COURSEFLOW-655 limits the Code field to course workflows.
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/features/shared/context_action_bar_requirements_v1.yaml (workflow header-level controls on contextActionBar)
#   - tests/docs/requirements/features/workflow/workflow_edit_form_requirements_v1.yaml (edit dialog open—FR-WF-FORM-001; save outcomes—FR-WF-FORM-003)
#   - tests/docs/requirements/features/workflow/workflow_create_stepped_form_requirements_v1.yaml (FR-WF-CREATE-STEPPER-005 — blank create path for FR-WF-OV-008; FR-WF-CREATE-STEPPER-006 — template create path for FR-WF-OV-009; post-create navigation lands on '/workflow/{id}/graph' with workflowView open per FR-WF-HEADER-001)
#   - tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml (qualifying Workflow-tab node edits — FR-WF-EN-007, FR-WF-EN-010, FR-WF-EN-011; reflected on Overview per FR-WF-OV-010)
#   - tests/docs/requirements/features/workflow/workflow_archive_requirements_v1.yaml (archive of linked child clears parent node links—FR-WF-ARCH-003)
#   - tests/docs/requirements/features/workflow/workflow_copy_requirements_v1.yaml (copy link preservation vs break—FR-WF-COPY-003; overview metadata and content fidelity on copy—FR-WF-COPY-003)
#   - tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml (qualifying node create — FR-WF-ADD-*; reflected on Overview per FR-WF-OV-010)
#   - tests/docs/requirements/features/workflow/workflow_delete_node_requirements_v1.yaml (qualifying node delete — FR-WF-DEL-003; reflected on Overview per FR-WF-OV-010)
#   - tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml (workflow top section: title, favourite toggle, tab selector, and sub-view switching — FR-WF-HEADER-001)
#   - tests/docs/requirements/features/project/project_overview_requirements_v1.yaml (project-level publish/visibility and contributor inheritance—FR-PROJ-OV-002; contributor removal mid-session—FR-WS-ACCESS-004)
#   - tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail — FR-WS-ACCESS-002; mid-session contributor removal — FR-WS-ACCESS-004)
#   - tests/docs/requirements/features/workflow/workflow_public_link_requirements_v1.yaml (workflowGeneratePublicLinkButton and anonymous Overview exception — FR-WF-PUBLIC-001 and FR-WF-PUBLIC-002)
#   - tests/docs/requirements/features/workflow/workflow_duration_requirements_v1.yaml (shared canonical minutes and host-specific duration presentation — FR-WF-DURATION-001 through FR-WF-DURATION-003)

documentPreconditions:
  - user is authenticated to CourseFlow
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project of the workflow on any route matching '/workflow/{id}/*', or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - routes matching '/workflow/{id}/*' include '/workflow/{id}' (empty suffix) and '/workflow/{id}/<sub-view>' for any sub-view
  - requirements in this file assume the above hold; when they do not on navigation, assert per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002; when published-access preconditions fail mid-session because the parent project becomes unpublished, assert per FR-WS-ACCESS-003 on the actor's next in-app action; when a former contributor's access changes mid-session because they were removed per tests/docs/requirements/features/project/project_overview_requirements_v1.yaml FR-PROJ-OV-002, assert per FR-WS-ACCESS-004 on the actor's next in-app action

uiObjectDefinitions:
  workflowOverviewView:
    meaning: Workflow Overview sub-view for workflow metadata and permissions summary.
  workflowMetadataSection:
    meaning: Metadata section on workflowOverviewView containing workflow overview fields and banners.
  workflowMetadataFieldDescription:
    meaning: Read-only Description metadata field on workflowOverviewView; supported persisted HTML is rendered as formatted content rather than literal tags and its content inherits the application's Open Sans font stack.
  workflowMetadataFieldCode:
    meaning: Course-only Code metadata field on workflowOverviewView.
  workflowMetadataSwitchCalculateTimeAutomatically:
    meaning: Switch control labeled 'Auto-calculate' for Time on workflowOverviewView.
  workflowMetadataFieldTime:
    meaning: Time duration group on workflowOverviewView containing workflowMetadataFieldTimeHours and workflowMetadataFieldTimeMinutes; conforms to FR-WF-DURATION-001 through FR-WF-DURATION-003.
  workflowMetadataFieldTimeHours:
    meaning: Non-negative whole-number Hours input inside workflowMetadataFieldTime.
  workflowMetadataFieldTimeMinutes:
    meaning: Whole-number Minutes input from 0 through 59 inside workflowMetadataFieldTime.
  workflowMetadataSwitchCalculatePonderationAutomatically:
    meaning: Program-only switch control labeled 'Auto-calculate' for Ponderation on workflowOverviewView.
  workflowMetadataFieldIndividualTime:
    meaning: Individual whole-number Hours field in the Ponderation section on workflowOverviewView; its canonical value is integer minutes divisible by 60.
  workflowMetadataFieldPracticalTime:
    meaning: Practical whole-number Hours field in the Ponderation section on workflowOverviewView; its canonical value is integer minutes divisible by 60.
  workflowMetadataFieldTheoryTime:
    meaning: Theory whole-number Hours field in the Ponderation section on workflowOverviewView; its canonical value is integer minutes divisible by 60.
  workflowMetadataSwitchCalculateCreditsAutomatically:
    meaning: Program-only switch control labeled 'Auto-calculate' for Credits on workflowOverviewView.
  workflowMetadataFieldCredits:
    meaning: Credits metadata field on workflowOverviewView.
  workflowMetadataSwitchCalculateClassificationAutomatically:
    meaning: Program-only switch control labeled 'Auto-calculate' for classification on workflowOverviewView.
  workflowMetadataFieldGeneralTime:
    meaning: General education whole-number Hours field on program workflowOverviewView; manual values are canonical integer minutes divisible by 60, while automatic values retain exact integer minutes and are rounded to the nearest whole hour only for presentation.
  workflowMetadataFieldSpecificTime:
    meaning: Specific education whole-number Hours field on program workflowOverviewView; manual values are canonical integer minutes divisible by 60, while automatic values retain exact integer minutes and are rounded to the nearest whole hour only for presentation.
  workflowMetadataClassificationWarningBanner:
    meaning: Classification mismatch warning banner on program workflowOverviewView.
  workflowMetadataWarningBanner:
    meaning: Ponderation mismatch warning banner on workflowOverviewView.
  workflowMetadataPermissionsPanel:
    meaning: Contributors and permissions summary panel on workflowOverviewView.
  workflowViewTabSelector:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml.

