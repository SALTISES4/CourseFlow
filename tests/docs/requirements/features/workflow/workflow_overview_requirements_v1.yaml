      - workflowOverviewView shows workflowMetadataPermissionsPanel in workflowMetadataSection
      - workflowMetadataPermissionsPanel displays the same permissions dataset as the parent project's projectMetadataPermissionsPanel per tests/docs/requirements/features/project/project_overview_requirements_v1.yaml FR-PROJ-OV-002
      - when the parent project's contributor list changes per FR-PROJ-OV-002 (add contributor, remove contributor, or role edit) while an actor has workflowOverviewView open, workflowMetadataPermissionsPanel listed users and roles refresh to match projectMetadataPermissionsPanel on that actor's next in-app action per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-004

    roleBehavior:
