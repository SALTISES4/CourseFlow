changelog:
  - version: '1.5'
    date: '2026-11-27'
    changes:
      - Suppressed Ponderation and Classification mismatch warnings while all values in the corresponding section are empty or zero.
      - Made each warning eligible immediately after any value in its section becomes greater than zero.
  - version: '1.4'
    date: '2026-11-26'
    changes:
      - Replaced Ponderation and Classification masks with single whole-number Hours inputs backed by canonical integer minutes.
      - Required manual and imported Ponderation and Classification values to be divisible by 60.
      - Kept automatic Classification totals exact in minutes, rounded them only for display, and made the node Specific education boolean the sole bucket selector.
  - version: '1.3'
    date: '2026-11-24'
    changes:
      - Replaced the Overview Time mask with Figma-authoritative Hours and Minutes fields.
      - Standardized all overview switch labels as 'Auto-calculate'.
  - version: '1.1'
    date: '2026-10-05'
    changes:
      - Restored every Overview duration field through the shared FR-WF-DURATION contract.
      - Added normalized duration examples for manual values and automatic totals.
      - Replaced hours-only mismatch wording with duration wording for Ponderation and Classification.
