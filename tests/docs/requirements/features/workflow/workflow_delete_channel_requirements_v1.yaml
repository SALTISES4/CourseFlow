# Normalized requirements: delete an existing workflowChannel ('Workflow' view)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Channels ▸ Delete — lines 969–970)
# Application code evidence: react/src/components/views/WorkflowView/WorkflowEditView/components/ColumnsHeader/Cell/HoverMenu/index.tsx; react/src/components/common/dialog/Workflow/DeleteNodeCategory/index.tsx; react/src/redux/slices/column.slice.ts (columnDeleteSelf)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml (canonical channel uiObjects and locators; FR-CHAN-001–004, FR-CHAN-007–009; hover-menu delete gating — FR-CHAN-007); tests/docs/requirements/features/workflow/workflow_duplicate_channel_requirements_v1.yaml (duplicate channel — FR-CHAN-005). Canonical workflowChannelDeleteDialog* in this file.
#   - tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-002)

documentPreconditions:
  - user is authenticated to CourseFlow
  - current route is '/workflow/{id}/graph'
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - requirements in this file assume the above hold; when they do not, assert per FR-WS-ACCESS-002

uiObjectDefinitions:
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml.
  workflowChannelsHeaderRow:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowChannel:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowChannelHeader:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowChannelHeaderSelectedBorder:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowChannelHoverActionsMenu:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowChannelHoverActionsMenuDeleteItem:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowRightSidebar:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowRightSidebarEditTab:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_right_sidebar_requirements_v1.yaml.
  workflowEditChannelForm:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowEditChannelFormDeleteButton:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowChannelDeleteDialog:
    meaning: Confirmation modal for deleting a workflowChannel.
  workflowChannelDeleteDialogCancelButton:
    meaning: Cancel control labeled 'Cancel' on workflowChannelDeleteDialog.
  workflowChannelDeleteDialogConfirmButton:
    meaning: Confirm action labeled 'Delete node category' on workflowChannelDeleteDialog.
  workflowNode:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml.
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml.
  workflowEdge:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edge_requirements_v1.yaml.

locatorMappings:
  workflowView: "canonical_locators.yaml -> workflowView"
  workflowChannel: "canonical_locators.yaml -> workflowChannel"
  workflowChannelHoverActionsMenu: "canonical_locators.yaml -> workflowChannelHoverActionsMenu"
  workflowRightSidebar: "canonical_locators.yaml -> workflowRightSidebar"
  workflowChannelDeleteDialog: "canonical_locators.yaml -> workflowChannelDeleteDialog"
  workflowChannelDeleteDialogCancelButton: "canonical_locators.yaml -> workflowChannelDeleteDialogCancelButton"
  workflowChannelDeleteDialogConfirmButton: "canonical_locators.yaml -> workflowChannelDeleteDialogConfirmButton"
  workflowEditChannelFormDeleteButton: "canonical_locators.yaml -> workflowEditChannelFormDeleteButton"

requirements:
  - id: FR-CHAN-006
    title: Delete node category (hover or sidebar)

    designEvidence:
      - FIGMA-CHAN-OE-HOVER
      - FIGMA-CHAN-OE-EDIT
      - FIGMA-CHAN-DEL-WARN

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - workflowView
      - workflowChannelsHeaderRow
      - workflowChannel
      - workflowChannelHeader
      - workflowChannelHeaderSelectedBorder
      - workflowChannelHoverActionsMenu
      - workflowChannelHoverActionsMenuDeleteItem
      - workflowRightSidebar
      - workflowRightSidebarEditTab
      - workflowEditChannelForm
      - workflowEditChannelFormDeleteButton
      - workflowChannelDeleteDialog
      - workflowChannelDeleteDialogCancelButton
      - workflowChannelDeleteDialogConfirmButton
      - workflowNode
      - workflowSectionContainer
      - workflowEdge

    preconditions:
      - workflowView contains a target workflowChannel in workflowChannelsHeaderRow
      - when workflowChannelsHeaderRow contains exactly one workflowChannel, workflowChannelHoverActionsMenuDeleteItem is disabled and workflowEditChannelFormDeleteButton is disabled for every actor for whom those controls are rendered
      - when workflowChannelsHeaderRow contains at least two workflowChannels, for the hover-menu path, workflowChannelHoverActionsMenuDeleteItem actionability for the actor follows FR-CHAN-007
      - when workflowChannelsHeaderRow contains at least two workflowChannels, for the sidebar path, workflowEditChannelForm is open for the target workflowChannel and workflowEditChannelFormDeleteButton actionability for the actor follows FR-CHAN-006 roleBehavior

    trigger:
      - user clicks workflowChannelHoverActionsMenuDeleteItem on workflowChannelHoverActionsMenu visible on workflowChannelHeader hover per FR-CHAN-007
      - user clicks workflowEditChannelFormDeleteButton on workflowEditChannelForm in workflowRightSidebar

    mainFlow:
      - when actor clicks workflowChannelHoverActionsMenuDeleteItem when active per FR-CHAN-007 or workflowEditChannelFormDeleteButton when active per FR-CHAN-006 roleBehavior, system opens workflowChannelDeleteDialog for the workflowChannel from that entry path
      - workflowChannelDeleteDialog body warns that deleting the node category will delete all associated nodes
      - if user clicks workflowChannelDeleteDialogCancelButton, workflowChannelDeleteDialog closes and workflowView is unchanged (target workflowChannel, its assigned workflowNodes, workflowEdges, and left-to-right order in workflowChannelsHeaderRow unchanged)
      - if user clicks workflowChannelDeleteDialogConfirmButton, system removes the target workflowChannel from workflowChannelsHeaderRow and removes every workflowNode assigned to that workflowChannel from every workflowSectionContainer; every workflowEdge whose source or target was a removed workflowNode is removed
      - on confirm delete, if workflowRightSidebar was bound to the deleted workflowChannel, workflowRightSidebar returns to default presentation per FR-WF-RS-004; if workflowRightSidebar was bound to a different host, sidebar tab and channel selection are unchanged except that the deleted workflowChannel is no longer in workflowChannelsHeaderRow

    roleBehavior:
      owner:
        workflowEditChannelFormDeleteButton: active
      editor:
        workflowEditChannelFormDeleteButton: active
      commenter:
        workflowEditChannelFormDeleteButton: disabled
      viewer:
        workflowEditChannelFormDeleteButton: disabled
      user:
        workflowEditChannelFormDeleteButton: disabled

    acceptanceCriteria:
      - given workflowChannelsHeaderRow contains exactly one workflowChannel and actor is owner or editor, workflowChannelHoverActionsMenuDeleteItem is disabled, workflowEditChannelFormDeleteButton is disabled, workflowChannelDeleteDialog does not open from either entry path, and that workflowChannel remains in workflowView
      - given workflowChannelsHeaderRow contains exactly one workflowChannel and actor is commenter with workflowChannelHoverActionsMenu visible per FR-CHAN-007, workflowChannelHoverActionsMenuDeleteItem is disabled and workflowEditChannelFormDeleteButton is disabled
      - given workflowChannelDeleteDialog is open, target workflowChannel is not removed until user clicks workflowChannelDeleteDialogConfirmButton
      - when user clicks workflowChannelDeleteDialogCancelButton, workflowChannelDeleteDialog closes and workflowView is unchanged (target workflowChannel, its assigned workflowNodes, workflowEdges, and left-to-right order in workflowChannelsHeaderRow unchanged)
      - given target workflowChannel C is at index K in left-to-right order and workflowChannelsHeaderRow contains at least two workflowChannels, when delete of C is confirmed via workflowChannelDeleteDialogConfirmButton, C is removed and following workflowChannels shift left by one index
      - given workflowChannelsHeaderRow contains at least two workflowChannels and confirmed delete via workflowChannelDeleteDialogConfirmButton, target workflowChannel is removed from workflowChannelsHeaderRow, at least one workflowChannel remains, no workflowNode remains assigned to the deleted workflowChannel in any workflowSectionContainer, and no workflowEdge references a removed workflowNode
      - given workflowEditChannelForm on workflowRightSidebarEditTab is bound to workflowChannel C and owner or editor confirms delete of C via workflowChannelDeleteDialogConfirmButton, when delete completes, workflowRightSidebar returns to default presentation per FR-WF-RS-004 and no workflowChannelHeader shows workflowChannelHeaderSelectedBorder per FR-CHAN-009
      - given workflowRightSidebar is bound to workflowChannel C2 and owner or editor confirms delete of a different workflowChannel C1 via workflowChannelDeleteDialogConfirmButton, when delete completes, workflowRightSidebar remains bound to C2
      - given owner or editor confirms delete via workflowChannelHoverActionsMenuDeleteItem while workflowRightSidebar is closed or bound to a non-deleted host, when delete completes, workflowRightSidebar presentation is unchanged except that the deleted workflowChannel is removed from workflowChannelsHeaderRow
      - given workflowEditChannelForm is open for workflowChannel C and owner or editor clicks workflowEditChannelFormDeleteButton, workflowChannelDeleteDialog opens for C; given confirm via workflowChannelDeleteDialogConfirmButton, C is removed from workflowChannelsHeaderRow per FR-CHAN-006 mainFlow
      - given workflowChannelsHeaderRow contains at least two workflowChannels and actor is commenter with workflowChannelHoverActionsMenu visible per FR-CHAN-007, workflowChannelHoverActionsMenuDeleteItem is disabled
      - given actor is commenter, viewer, or user (published-access) with workflowEditChannelForm open, workflowEditChannelFormDeleteButton is disabled
      - given actor is viewer or user (published-access), workflowChannelHoverActionsMenu is not rendered on workflowChannelHeader hover per FR-CHAN-007, so workflowChannelHoverActionsMenuDeleteItem is not reachable and workflowChannelDeleteDialog cannot be opened via the hover path

    openQuestions: []

