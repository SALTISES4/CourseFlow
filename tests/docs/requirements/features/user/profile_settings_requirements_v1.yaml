# Normalized requirements: profile settings page
# Source: application code (no separate Google Doc for this run)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/features/navigation/top_navigation_requirements_v1.yaml (entry path to '/user/profile-settings' via accountMenuItemProfile per FR-TOP-003); tests/docs/requirements/features/auth/register_requirements_v1.yaml (profileUsernameField, profileFirstNameField, and profileLastNameField show registerEmailField, registerFirstNameField, and registerLastNameField values from signup per FR-REG-004 and FR-PROFILE-002); tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml (notificationListItemUserName uses profileFirstNameField and profileLastNameField values per FR-NPAGE-002); tests/docs/requirements/features/shared/card_content_requirements_v1.yaml (globalMessageSnackbar per FR-PROFILE-005)

documentPreconditions:
  - user is authenticated to CourseFlow
  - user is within the main application shell

uiObjectDefinitions:
  profileSettingsPage:
    meaning: Profile settings page at route '/user/profile-settings'.
  profileSettingsTitle:
    meaning: Page title text for the profile settings screen; 'Profile settings'
  profileSettingsForm:
    meaning: Form container on profileSettingsPage.
  profileUsernameField:
    meaning: Read-only field labeled 'Email / Username' on profileSettingsForm; on first visit after signup shows registerEmailField value per tests/docs/requirements/features/auth/register_requirements_v1.yaml FR-REG-004.
  profileFirstNameField:
    meaning: Text input labeled 'First name' for the user's first name in profileSettingsForm; on first visit after signup shows registerFirstNameField value per tests/docs/requirements/features/auth/register_requirements_v1.yaml FR-REG-004.
  profileLastNameField:
    meaning: Text input labeled 'Last name' for the user's last name in profileSettingsForm; on first visit after signup shows registerLastNameField value per tests/docs/requirements/features/auth/register_requirements_v1.yaml FR-REG-004.
  profileLanguagePreferenceGroup:
    meaning: Radio-option group labeled 'Language preferences' on profileSettingsForm.
  profileLanguageOptionEnglish:
    meaning: Radio option labeled 'English' in profileLanguagePreferenceGroup.
  profileLanguageOptionFrench:
    meaning: Radio option labeled 'French' in profileLanguagePreferenceGroup.
  profileUpdateButton:
    meaning: Submit button on profileSettingsForm labeled 'Update profile'.
  profileFieldValidationMessage:
    meaning: Inline field-level error text on profileFirstNameField or profileLastNameField in profileSettingsForm; validation rules per FR-PROFILE-003.
  globalMessageSnackbar:
    meaning: Canonical definition in tests/docs/requirements/features/shared/card_content_requirements_v1.yaml.

locatorMappings:
  profileSettingsPage: "canonical_locators.yaml -> profileSettingsPage"
  profileSettingsTitle: "canonical_locators.yaml -> profileSettingsTitle"
  profileSettingsForm: "canonical_locators.yaml -> profileSettingsForm"
  profileUsernameField: "canonical_locators.yaml -> profileUsernameField"
  profileFirstNameField: "canonical_locators.yaml -> profileFirstNameField"
  profileLastNameField: "canonical_locators.yaml -> profileLastNameField"
  profileLanguagePreferenceGroup: "canonical_locators.yaml -> profileLanguagePreferenceGroup"
  profileLanguageOptionEnglish: "canonical_locators.yaml -> profileLanguageOptionEnglish"
  profileLanguageOptionFrench: "canonical_locators.yaml -> profileLanguageOptionFrench"
  profileUpdateButton: "canonical_locators.yaml -> profileUpdateButton"
  profileFieldValidationMessage: "canonical_locators.yaml -> profileFieldValidationMessage"
  globalMessageSnackbar: "canonical_locators.yaml -> globalMessageSnackbar"

requirements:
  - id: FR-PROFILE-001
    title: Profile settings page route and primary form elements

    designEvidence:
      - FIGMA-PROFILE-SETTINGS

    actors:
      - user

    uiObjects:
      - profileSettingsPage
      - profileSettingsTitle
      - profileSettingsForm
      - profileUsernameField
      - profileFirstNameField
      - profileLastNameField
      - profileLanguagePreferenceGroup
      - profileUpdateButton

    preconditions:
      - documentPreconditions for this file hold

    trigger: []

    mainFlow:
      - given current route matches '/user/profile-settings', profileSettingsPage is visible
      - profileSettingsTitle is visible on profileSettingsPage
      - profileSettingsForm is visible on profileSettingsPage
      - profileSettingsForm shows profileUsernameField, profileFirstNameField, profileLastNameField, profileLanguagePreferenceGroup, and profileUpdateButton in that order
      - profileUsernameField is not editable
      - visible labels on profile settings controls use sentence case

    roleBehavior: {}

    acceptanceCriteria:
      - current route matches '/user/profile-settings'
      - profileSettingsTitle is visible with label 'Profile settings'
      - profileSettingsForm is visible
      - profileUsernameField is visible with label 'Email / Username', is not editable, and shows the user's sign-up email
      - profileFirstNameField is visible with label 'First name' and is editable
      - profileLastNameField is visible with label 'Last name' and is editable
      - profileLanguagePreferenceGroup is visible with label 'Language preferences' and is editable
      - profileUpdateButton is visible with label 'Update profile'
      - profile settings labels use sentence case (for example 'First name' and 'Last name', not 'First Name' and 'Last Name')

    openQuestions: []

  - id: FR-PROFILE-002
    title: Profile settings initial load behavior and data binding

    designEvidence:
      - FIGMA-PROFILE-SETTINGS

    actors:
      - user

    uiObjects:
      - profileSettingsPage
      - profileSettingsForm
      - profileUsernameField
      - profileFirstNameField
      - profileLastNameField
      - profileLanguagePreferenceGroup
      - profileLanguageOptionEnglish

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/user/profile-settings'

    trigger: []

    mainFlow:
      - profileSettingsForm shows loaded profile settings values
      - profileUsernameField shows the user's sign-up email
      - profileFirstNameField shows the user's first name
      - profileLastNameField shows the user's last name
      - on first visit after signup, profileUsernameField shows registerEmailField value, profileFirstNameField shows registerFirstNameField value, and profileLastNameField shows registerLastNameField value per tests/docs/requirements/features/auth/register_requirements_v1.yaml FR-REG-004
      - profileLanguagePreferenceGroup shows the user's selected language option
      - given no user-specific language value is provided, profileLanguageOptionEnglish is selected per FR-PROFILE-004

    roleBehavior: {}

    acceptanceCriteria:
      - profileUsernameField shows the user's sign-up email
      - profileFirstNameField shows the user's first name
      - profileLastNameField shows the user's last name
      - on first visit after signup, profileUsernameField shows registerEmailField value
      - on first visit after signup, profileFirstNameField shows registerFirstNameField value
      - on first visit after signup, profileLastNameField shows registerLastNameField value
      - profileLanguagePreferenceGroup always has a selected option
      - profileLanguagePreferenceGroup shows the user's selected language option

    openQuestions: []

  - id: FR-PROFILE-003
    title: Profile settings field validation rules

    designEvidence:
      - FIGMA-PROFILE-SETTINGS

    actors:
      - user

    uiObjects:
      - profileSettingsForm
      - profileFirstNameField
      - profileLastNameField
      - profileFieldValidationMessage
      - profileUpdateButton

    preconditions:
      - documentPreconditions for this file hold
      - profileSettingsForm is visible

    trigger:
      - user changes profileSettingsForm content and clicks profileUpdateButton

    mainFlow:
      - profileFirstNameField requires a non-empty value and limits value length to 200 characters
      - profileLastNameField requires a non-empty value and limits value length to 200 characters
      - given user first visits profileSettingsPage after signup, profileFieldValidationMessage is not visible for profileFirstNameField or profileLastNameField
      - validation for profileFirstNameField and profileLastNameField starts only after user interaction with profileSettingsForm and user clicks profileUpdateButton
      - given validation fails for profileFirstNameField or profileLastNameField, profileSettingsForm is not submitted and profileFieldValidationMessage is visible on the invalid field

    roleBehavior: {}

    acceptanceCriteria:
      - given user first visits profileSettingsPage after signup, profileFieldValidationMessage is not visible for profileFirstNameField or profileLastNameField
      - given user clears profileFirstNameField after interaction and user clicks profileUpdateButton, profileSettingsForm is not submitted and profileFieldValidationMessage is visible with text 'First name is required' for profileFirstNameField
      - given user clears profileLastNameField after interaction and user clicks profileUpdateButton, profileSettingsForm is not submitted and profileFieldValidationMessage is visible with text 'Last name is required' for profileLastNameField
      - given profileFirstNameField value length exceeds 200 characters and user clicks profileUpdateButton, profileSettingsForm is not submitted and profileFieldValidationMessage is visible with text 'First name is limited to 200 characters' for profileFirstNameField
      - given profileLastNameField value length exceeds 200 characters and user clicks profileUpdateButton, profileSettingsForm is not submitted and profileFieldValidationMessage is visible with text 'Last name is limited to 200 characters' for profileLastNameField

    openQuestions: []

  - id: FR-PROFILE-004
    title: Language preference option set

    designEvidence:
      - FIGMA-PROFILE-SETTINGS

    actors:
      - user

    uiObjects:
      - profileSettingsForm
      - profileLanguagePreferenceGroup
      - profileLanguageOptionEnglish
      - profileLanguageOptionFrench

    preconditions:
      - documentPreconditions for this file hold
      - profileSettingsForm is visible

    trigger: []

    mainFlow:
      - profileLanguagePreferenceGroup controls the language in which the application interface is displayed for the user
      - given no user-specific language value is provided, profileLanguageOptionEnglish is selected

    roleBehavior: {}

    acceptanceCriteria:
      - profileLanguagePreferenceGroup includes profileLanguageOptionEnglish
      - profileLanguagePreferenceGroup includes profileLanguageOptionFrench
      - profileLanguageOptionEnglish is visible with label 'English'
      - profileLanguageOptionFrench is visible with label 'French'
      - profileLanguageOptionEnglish value is 'en'
      - profileLanguageOptionFrench value is 'fr'
      - no additional language options are present beyond profileLanguageOptionEnglish and profileLanguageOptionFrench
      - given no user-specific language value is provided, profileLanguageOptionEnglish is selected

    openQuestions: []

  - id: FR-PROFILE-005
    title: Profile update submit behavior and feedback

    designEvidence:
      - FIGMA-PROFILE-SETTINGS

    actors:
      - user

    uiObjects:
      - profileSettingsForm
      - profileFirstNameField
      - profileLastNameField
      - profileLanguagePreferenceGroup
      - profileUpdateButton
      - globalMessageSnackbar

    preconditions:
      - documentPreconditions for this file hold
      - profileSettingsForm is visible
      - profileSettingsForm is valid

    trigger:
      - user changes profileSettingsForm content and clicks profileUpdateButton

    mainFlow:
      - given profileSettingsForm has no unsaved content change, profileUpdateButton is disabled and not clickable
      - given at least one field value differs from the loaded form state, profileUpdateButton is enabled
      - given user clicks profileUpdateButton with valid profileSettingsForm values, profileFirstNameField, profileLastNameField, and profileLanguagePreferenceGroup values are saved
      - given profile settings are saved successfully, globalMessageSnackbar shows 'Your profile settings have been updated' and application interface is displayed in the language selected in profileLanguagePreferenceGroup
      - given profile settings update request fails, profileSettingsForm values are unchanged and globalMessageSnackbar shows 'We encountered an issue and your profile settings have not been updated'

    roleBehavior: {}

    acceptanceCriteria:
      - given profileSettingsForm has no unsaved content change, profileUpdateButton is disabled and not clickable
      - given profileSettingsForm has at least one unsaved change and no validation error, profileUpdateButton is enabled
      - given user clicks profileUpdateButton with valid profileSettingsForm values, profileFirstNameField, profileLastNameField, and profileLanguagePreferenceGroup values are saved
      - given profile settings are saved successfully, globalMessageSnackbar shows 'Your profile settings have been updated'
      - given successful profile update including profileLanguagePreferenceGroup change, application interface is displayed in the language selected in profileLanguagePreferenceGroup per mainFlow
      - given profile settings update request fails, globalMessageSnackbar shows 'We encountered an issue and your profile settings have not been updated'
      - given profile settings update request fails, profileFirstNameField, profileLastNameField, and profileLanguagePreferenceGroup retain their pre-submit values

    openQuestions: []

