changelog:
  - version: '1.2'
    date: '2026-10-29'
    changes:
      - linked the companion profile-details requirements for profile image, institution, and primary discipline
  - version: '1.1'
    date: '2026-10-29'
    changes:
      - replaced the combined read-only 'Email / Username' field with separate current-email and editable-username requirements
      - defined username validation, case-insensitive uniqueness, and independence from the email login credential
      - delegated verified email changes to tests/docs/requirements/features/user/email_change_requirements_v1.yaml
