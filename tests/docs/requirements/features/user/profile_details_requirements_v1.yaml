# Normalized requirements: profile image, institution, and primary discipline
# Source: 2026-10-29 product requirement
# Scope note: institution is optional user-entered text; discipline is one optional primary discipline selected from CourseFlow's existing fixed catalogue; profile-image add, replace, and removal use a separate save action from textual profile updates.
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/features/user/profile_settings_requirements_v1.yaml (profile route, shared form, update action, and feedback); tests/docs/requirements/features/project/project_create_form_requirements_v1.yaml FR-PROJ-FORM-001 (canonical discipline option set); tests/docs/requirements/features/global/localization_requirements_v1.yaml FR-LOC-004 (localized fixed-reference labels and ordering); tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml and tests/docs/requirements/features/deferred/top_navigation_notifications_dropdown_requirements_v1.yaml (existing avatar-bearing surfaces)

documentPreconditions:
  - user is authenticated to CourseFlow
  - profile settings page at route '/user/profile-settings' is visible

outOfScope:
  - media storage provider, upload protocol, image-derivative generation, cache invalidation mechanism, and other implementation details
  - image cropping, repositioning, filters, or other image-editing tools beyond previewing the final avatar framing
  - an institution directory, autocomplete, institution ownership, or verification of institutional affiliation
  - selecting more than one user discipline or entering a custom discipline outside the existing catalogue
  - using institution, discipline, or profile image to grant permissions, assign account roles, or establish identity
  - a public user-profile page, public account discovery, image reporting, and image moderation workflows

uiObjectDefinitions:
  profileSettingsPage:
    meaning: Canonical definition in tests/docs/requirements/features/user/profile_settings_requirements_v1.yaml.
  profileSettingsForm:
    meaning: Canonical definition in tests/docs/requirements/features/user/profile_settings_requirements_v1.yaml.
  profileUpdateButton:
    meaning: Canonical definition in tests/docs/requirements/features/user/profile_settings_requirements_v1.yaml.
  profileImageSection:
    meaning: Profile settings section that displays the user's saved profile image or fallback avatar and provides image-management actions.
  profileImage:
    meaning: Saved user-provided profile image rendered as an avatar using the final framing shown in profileImagePreview.
  profileImageFallbackAvatar:
    meaning: Generated avatar shown when no saved profile image exists; uses the user's initials when available and otherwise a generic user symbol.
  profileImageAddButton:
    meaning: Button labeled 'Add profile image' shown when the user has no saved profile image.
  profileImageChangeButton:
    meaning: Button labeled 'Change profile image' shown when the user has a saved profile image.
  profileImageRemoveButton:
    meaning: Button labeled 'Remove profile image' shown when the user has a saved profile image.
  profileImageEditor:
    meaning: Image-selection and preview surface opened from profileImageAddButton or profileImageChangeButton.
  profileImageFileInput:
    meaning: Single-file image input in profileImageEditor for selecting a local static JPEG, PNG, or WebP image.
  profileImagePreview:
    meaning: Preview in profileImageEditor showing the selected image with the same one-to-one avatar framing used after save.
  profileImageSaveButton:
    meaning: Button labeled 'Save profile image' in profileImageEditor.
  profileImageCancelButton:
    meaning: Button labeled 'Cancel' in profileImageEditor that discards the unsaved selection.
  profileImageValidationMessage:
    meaning: Inline error message in profileImageEditor explaining why a selected file cannot be saved.
  profileProfessionalDetailsSection:
    meaning: Profile settings section containing profileInstitutionField and profileDisciplineField.
  profileInstitutionField:
    meaning: Optional text input labeled 'Institution' for the user's self-reported institution name.
  profileDisciplineField:
    meaning: Optional single-select control labeled 'Discipline' for the user's self-reported primary discipline.
  profileDisciplineEmptyOption:
    meaning: Empty profileDisciplineField option labeled 'No discipline selected'.
  profileFieldValidationMessage:
    meaning: Canonical definition in tests/docs/requirements/features/user/profile_settings_requirements_v1.yaml.
  globalMessageSnackbar:
    meaning: Canonical definition in tests/docs/requirements/features/user/profile_settings_requirements_v1.yaml.

