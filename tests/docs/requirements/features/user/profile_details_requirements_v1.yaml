  profileImageSection: "canonical_locators.yaml -> profileImageSection"
  profileImage: "canonical_locators.yaml -> profileImage"
  profileImageFallbackAvatar: "canonical_locators.yaml -> profileImageFallbackAvatar"
  profileImageAddButton: "canonical_locators.yaml -> profileImageAddButton"
  profileImageChangeButton: "canonical_locators.yaml -> profileImageChangeButton"
  profileImageRemoveButton: "canonical_locators.yaml -> profileImageRemoveButton"
  profileImageEditor: "canonical_locators.yaml -> profileImageEditor"
  profileImageFileInput: "canonical_locators.yaml -> profileImageFileInput"
  profileImagePreview: "canonical_locators.yaml -> profileImagePreview"
  profileImageSaveButton: "canonical_locators.yaml -> profileImageSaveButton"
  profileImageCancelButton: "canonical_locators.yaml -> profileImageCancelButton"
  profileImageValidationMessage: "canonical_locators.yaml -> profileImageValidationMessage"
