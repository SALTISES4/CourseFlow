# Normalized requirements: project 'Workflows' view (route /project/{id}/workflows)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Project workflows scope) + Figma design evidence.
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml (project access preconditions)
#   - tests/docs/requirements/features/project/project_header_requirements_v1.yaml (FR-PROJ-HEADER-001 — projectHeader and projectViewTabSelector)
#   - tests/docs/requirements/features/project/project_overview_requirements_v1.yaml (favourites behavior in FR-PROJ-OV-006 where applicable)
#   - tests/docs/requirements/features/library/library_page_requirements_v1.yaml (sort and shared filters — FR-LIB-002, FR-LIB-003, FR-LIB-004; consumed by FR-PROJ-WF-002 through FR-PROJ-WF-004; workflow restore entry on 'My library'—FR-LIB-006; permanent delete removes archived workflowCard from archiveToggle listing—FR-LIB-006)
#   - tests/docs/requirements/features/workflow/workflow_archive_requirements_v1.yaml (archive-time link break and no link recovery on restore—FR-WF-ARCH-003)
#   - tests/docs/requirements/features/project/project_archive_requirements_v1.yaml (in-project links preserved on project archive—FR-PROJ-ARCH-003)
#   - tests/docs/requirements/features/shared/card_content_requirements_v1.yaml (workflowCard — FR-CARD-001 through FR-CARD-006 as applicable)

documentPreconditions:
  - user is authenticated to CourseFlow
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the project on any route matching '/project/{id}/*', or (b) user (published-access, no explicit contributor role) viewing a project that is published
  - routes matching '/project/{id}/*' include '/project/{id}' (empty suffix) and '/project/{id}/<sub-view>' for any sub-view
  - requirements in this file assume the above hold; when they do not, assert per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-001

