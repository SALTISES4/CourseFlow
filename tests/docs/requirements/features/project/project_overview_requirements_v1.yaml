# Normalized requirements: project overview screen (contributors, publish state, tags)
# Out of scope (this file): View settings tag filter toggle behavior (canonical in tests/docs/requirements/features/shared/context_action_bar_requirements_v1.yaml FR-CAB-006); globalMessageSnackbar feedback for tag create, edit, and delete on project overview.
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Project section: Contributors, Tags, Published Projects, Overview)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/features/library/explore_page_requirements_v1.yaml (published project visibility in Explore); tests/docs/requirements/features/shared/context_action_bar_requirements_v1.yaml (contextActionBarAddContributorsButton on project routes—FR-CAB-002; distinct from projectMetadataAddContributorsButton here; both show addContributorsDialog); tests/docs/requirements/features/project/project_header_requirements_v1.yaml (project top section: title, favourite toggle, and tab selector across project sub-views); tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml (project description update path via editProjectDialog, FR-PROJ-FORM-003); tests/docs/requirements/features/shared/card_content_requirements_v1.yaml (globalMessageSnackbar canonical uiObject); tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail—FR-WS-ACCESS-001; mid-session unpublish revocation for published-access—FR-WS-ACCESS-003; mid-session contributor removal—FR-WS-ACCESS-004)

documentPreconditions:
  - user is authenticated to CourseFlow
  - actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the project on any route matching '/project/{id}/*', or (b) user (published-access, no explicit contributor role) viewing a project that is published
  - routes matching '/project/{id}/*' include '/project/{id}' (empty suffix) and '/project/{id}/<sub-view>' for any sub-view
  - requirements in this file assume the above hold; when they do not on navigation, assert per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-001; when published-access preconditions fail mid-session because the project becomes unpublished, assert per FR-WS-ACCESS-003 on the actor's next in-app action; when a former contributor's access changes mid-session because they were removed per FR-PROJ-OV-002, assert per FR-WS-ACCESS-004 on the actor's next in-app action

uiObjectDefinitions:
  projectOverviewView:
    meaning: Project Overview view at /project/{id} for metadata, contributors, and publish controls.
  projectMetadataFieldDescription:
    meaning: Description block on projectOverviewView.
  projectMetadataFieldDisciplines:
    meaning: Overview metadata block labeled 'Disciplines' showing project disciplines.
  projectMetadataPermissionsPanel:
    meaning: Contributors and permissions panel on projectOverviewView.
  contributorRoleDropdown:
    meaning: Role dropdown on a contributor row in projectMetadataPermissionsPanel.
  projectMetadataAddContributorsButton:
    meaning: Add CourseFlow user button in the project Overview permissions area.
  contextActionBarAddContributorsButton:
    meaning: Canonical definition in tests/docs/requirements/features/shared/context_action_bar_requirements_v1.yaml.
  addContributorsDialog:
    meaning: Modal dialog for adding contributors to a project.
  addContributorsUserSelector:
    meaning: CourseFlow Users autocomplete on addContributorsDialog.
  addContributorsUserSelectorClearButton:
    meaning: Icon-only clear ('X') control on addContributorsUserSelector that removes the current typed input.
  addContributorsRoleSelector:
    meaning: Role selector on addContributorsDialog.
  addContributorsSubmitButton:
    meaning: Primary action in addContributorsDialog that confirms adding selected users with assigned role(s).
  addContributorsCancelButton:
    meaning: Cancel action on addContributorsDialog.
  publishProjectButton:
    meaning: Publish project control on projectOverviewView.
  unpublishProjectButton:
    meaning: Unpublish project control on projectOverviewView.
  publishProjectConfirmationModal:
    meaning: Confirmation modal shown after owner or editor clicks publishProjectButton on projectOverviewView.
  publishProjectConfirmationModalCancelButton:
    meaning: Cancel action on publishProjectConfirmationModal.
  publishProjectConfirmationModalConfirmButton:
    meaning: Confirm action on publishProjectConfirmationModal that applies published visibility.
  globalMessageSnackbar:
    meaning: Canonical definition in tests/docs/requirements/features/shared/card_content_requirements_v1.yaml (FR-CARD-005).
  projectVisibilityStateMessage:
    meaning: Read-only project visibility status message on projectOverviewView.
  projectTagsSection:
    meaning: Overview block labeled 'Tags' where tags are displayed and managed.
  projectTagItem:
    meaning: Existing tag row/chip in projectTagsSection with editable label and delete action.
  addNewTagInput:
    meaning: Create affordance in projectTagsSection with placeholder 'Add new tag' used to add a new tag.
  editTagInput:
    meaning: Inline editable text input for renaming an existing projectTagItem.
  deleteTagButton:
    meaning: Icon control on projectTagItem used to remove that tag.

