requirements:
  - id: FR-PROJ-OV-001
    title: Project overview route and metadata blocks

    designEvidence:
      - FIGMA-PROJ-OV-UNPUBLISHED-WITH-TAGS
      - FIGMA-PROJ-OV-PUBLISHED-NO-TAGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - projectOverviewView
      - projectMetadataFieldDescription
      - projectMetadataFieldDisciplines
      - projectMetadataPermissionsPanel
      - projectTagsSection

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/project/{id}'

    trigger:
      - user navigates to project Overview at route '/project/{id}'

    mainFlow:
      - system renders projectOverviewView at route '/project/{id}'
      - projectOverviewView displays projectMetadataFieldDescription, projectMetadataFieldDisciplines, projectMetadataPermissionsPanel, and projectTagsSection
      - projectMetadataFieldDescription always shows label 'Description'; when description is empty, displayed value is '-'
      - projectMetadataFieldDescription renders persisted description HTML with supported formatting applied per tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml FR-WF-EN-012 (not as raw HTML source); has no maximum length limit
      - projectMetadataFieldDescription is display-only on projectOverviewView; description updates are performed through editProjectDialog flow defined in tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml (FR-PROJ-FORM-003)
      - projectMetadataFieldDisciplines always shows label 'Disciplines'; when project has no disciplines, displayed value is '-'
      - when project has disciplines, disciplines in projectMetadataFieldDisciplines are sorted from A-Z and shown as comma-separated values
      - projectMetadataFieldDisciplines is display-only on projectOverviewView; discipline updates are performed through editProjectDialog flow defined in tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml (FR-PROJ-FORM-003)
      - projectTagsSection empty-state and read-only display rules are defined in FR-PROJ-OV-005
      - project top section behavior (title, favourite toggle, tab selector, and sub-view switching) is defined in tests/docs/requirements/features/project/project_header_requirements_v1.yaml

    roleBehavior: {}

    acceptanceCriteria:
      - projectOverviewView is visible
      - given projectOverviewView is visible, projectMetadataFieldDescription label 'Description' is visible
      - given project description has a value, projectMetadataFieldDescription shows that value with supported formatting rendered per FR-WF-EN-012 in tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml
      - given project description is empty, projectMetadataFieldDescription shows '-'
      - projectMetadataFieldDescription is display-only (no editing controls) and has no maximum length limit
      - given user needs to change project description, update path is editProjectDialog defined in tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml (FR-PROJ-FORM-003)
      - given projectOverviewView is visible, projectMetadataFieldDisciplines label 'Disciplines' is visible
      - given project has no disciplines, projectMetadataFieldDisciplines shows '-'
      - given project has disciplines, projectMetadataFieldDisciplines displays disciplines sorted A-Z as comma-separated values
      - given user needs to change project disciplines, update path is editProjectDialog defined in tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml (FR-PROJ-FORM-003)
      - given projectOverviewView is visible, projectMetadataPermissionsPanel label 'Permissions' is visible
      - given projectOverviewView is visible, projectTagsSection label 'Tags' is visible

    openQuestions: []

  - id: FR-PROJ-OV-002
    title: Add and manage contributors action

    designEvidence:
      - FIGMA-PROJ-OV-UNPUBLISHED-WITH-TAGS
      - FIGMA-PROJ-OV-PUBLISHED-NO-TAGS
      - FIGMA-PROJ-OV-ADD-CONTRIBUTOR-DIALOG

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - projectOverviewView
      - projectMetadataPermissionsPanel
      - projectMetadataAddContributorsButton
      - contextActionBarAddContributorsButton
      - addContributorsDialog
      - contributorRoleDropdown
      - globalMessageSnackbar

    preconditions:
      - documentPreconditions for this file hold
      - for projectMetadataAddContributorsButton and contributorRoleDropdown flows, current route matches '/project/{id}'
      - for contextActionBarAddContributorsButton flows, current route matches '/project/{id}/*' per tests/docs/requirements/features/shared/context_action_bar_requirements_v1.yaml FR-CAB-001

    trigger:
      - user clicks projectMetadataAddContributorsButton or contextActionBarAddContributorsButton, or changes/removes an existing contributor via contributorRoleDropdown when projectMetadataPermissionsPanel is visible

    mainFlow:
      - projectMetadataAddContributorsButton is the permissions-context entry point on projectOverviewView with label 'Add CourseFlow user'; contextActionBarAddContributorsButton is a separate icon-only entry point on contextActionBar per FR-CAB-002 (no user-visible label); both are distinct controls and addContributorsDialog is visible when owner or editor clicks either control
      - for viewer, commenter, or user (published-access) per documentPreconditions, projectMetadataAddContributorsButton is disabled where rendered (addContributorsDialog does not become visible on click attempt); contextActionBarAddContributorsButton visibility and disabled state per FR-CAB-002
      - addContributorsDialog allows selecting CourseFlow users and assigning a project role; addContributorsDialog submit success and failure outcomes per FR-PROJ-OV-004
      - projectMetadataPermissionsPanel lists current contributors and their roles
      - owner or editor may use contributorRoleDropdown on an existing contributor to select a different role among 'Editor', 'Commenter', and 'Viewer'
      - when owner or editor selects a different role via contributorRoleDropdown and role update succeeds, projectMetadataPermissionsPanel updates to that selected role and system shows globalMessageSnackbar with copy "The contributor's role was successfully updated"
      - when owner or editor selects a different role via contributorRoleDropdown and role update fails, projectMetadataPermissionsPanel is unchanged and system shows globalMessageSnackbar with copy "We encountered an issue and the contributor's role was not updated"
      - contributorRoleDropdown includes a 'Remove contributor' action to remove a contributor from projectMetadataPermissionsPanel
      - when owner or editor uses 'Remove contributor' in contributorRoleDropdown and remove succeeds, that contributor no longer appears in projectMetadataPermissionsPanel and system shows globalMessageSnackbar with copy 'The contributor was successfully removed from your project'; when the removed contributor is already on a route matching '/project/{id}/*' or '/workflow/{id}/*' for a workflow in that project, that actor's effective access changes on their next in-app action per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-004
      - when owner or editor uses 'Remove contributor' in contributorRoleDropdown and remove fails, projectMetadataPermissionsPanel is unchanged and system shows globalMessageSnackbar with copy 'We encountered an issue and the contributor was not removed from your project'
      - contributorRoleDropdown does not offer an 'Owner' assignment; project ownership cannot be transferred from this control
      - for viewer, commenter, or user (published-access, no explicit project role), contributor roles remain visible in projectMetadataPermissionsPanel but contributorRoleDropdown is read-only and not actionable
      - when contributor is added at project level, child workflows inherit project contributors and roles by default
      - workflow-level contributor modifications are not allowed
      - adding contributor results in project appearing in that contributor's 'My library' and role permissions applying per project permissions matrix

    roleBehavior:
      owner:
        projectMetadataAddContributorsButton: available
        contributorRoleDropdown: available
      editor:
        projectMetadataAddContributorsButton: available
        contributorRoleDropdown: available
      viewer:
        projectMetadataAddContributorsButton: disabled
        contributorRoleDropdown: readOnly
      commenter:
        projectMetadataAddContributorsButton: disabled
        contributorRoleDropdown: readOnly
      user:
        projectMetadataAddContributorsButton: disabled
        contributorRoleDropdown: readOnly

    acceptanceCriteria:
      - given projectOverviewView at '/project/{id}', projectMetadataAddContributorsButton is visible with label 'Add CourseFlow user' in the permissions context for owner, editor, viewer, commenter, and user when projectMetadataPermissionsPanel is visible
      - given owner or editor clicks projectMetadataAddContributorsButton or contextActionBarAddContributorsButton, addContributorsDialog is visible
      - given viewer, commenter, or user (published-access) per documentPreconditions, projectMetadataAddContributorsButton is disabled and addContributorsDialog does not become visible on click attempt; contextActionBarAddContributorsButton visibility and disabled state per FR-CAB-002
      - given owner or editor clicks contributorRoleDropdown, available options are exactly 'Editor', 'Commenter', 'Viewer', and 'Remove contributor'
      - given owner or editor changes a contributor role via contributorRoleDropdown and role update succeeds, projectMetadataPermissionsPanel updates to the selected role and globalMessageSnackbar shows "The contributor's role was successfully updated"
      - given owner or editor changes a contributor role via contributorRoleDropdown and role update fails, projectMetadataPermissionsPanel is unchanged and globalMessageSnackbar shows "We encountered an issue and the contributor's role was not updated"
      - given owner or editor uses remove action in contributorRoleDropdown and remove succeeds, that contributor no longer appears in projectMetadataPermissionsPanel and globalMessageSnackbar shows 'The contributor was successfully removed from your project'
      - given owner or editor uses remove action in contributorRoleDropdown and remove fails, projectMetadataPermissionsPanel is unchanged and globalMessageSnackbar shows 'We encountered an issue and the contributor was not removed from your project'
      - given viewer, commenter, or user (published-access) per documentPreconditions, projectMetadataPermissionsPanel shows contributor roles and contributorRoleDropdown is read-only
      - given contributor is added at project level, child workflow access reflects inherited project contributor role

    openQuestions: []

  - id: FR-PROJ-OV-003
    title: Publish and unpublish controls on project overview

    designEvidence:
      - FIGMA-PROJ-OV-UNPUBLISHED-WITH-TAGS
      - FIGMA-PROJ-OV-PUBLISHED-NO-TAGS
      - FIGMA-PROJ-OV-PUBLISH-PROJECT-MODAL

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - projectOverviewView
      - publishProjectButton
      - unpublishProjectButton
      - publishProjectConfirmationModal
      - publishProjectConfirmationModalCancelButton
      - publishProjectConfirmationModalConfirmButton
      - globalMessageSnackbar
      - projectVisibilityStateMessage

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/project/{id}'

    trigger:
      - user clicks publishProjectButton or unpublishProjectButton
      - user clicks publishProjectConfirmationModalCancelButton or publishProjectConfirmationModalConfirmButton while publishProjectConfirmationModal is visible

    mainFlow:
      - projectVisibilityStateMessage is always visible, display-only for all actors, and reflects current state with exact copy 'The project is currently private' when unpublished and 'The project is currently public' when published
      - when project is unpublished, projectOverviewView shows publishProjectButton with label 'Publish project' to owner and editor roles
      - when owner or editor clicks publishProjectButton, publishProjectConfirmationModal is visible
      - publishProjectConfirmationModal includes publishProjectConfirmationModalCancelButton and publishProjectConfirmationModalConfirmButton
      - when owner or editor clicks publishProjectConfirmationModalConfirmButton and publish succeeds, project visibility transitions to published, publishProjectConfirmationModal closes, child workflows inherit published visibility, and system shows globalMessageSnackbar with copy 'Your project has been successfully published'
      - when owner or editor clicks publishProjectConfirmationModalConfirmButton and publish fails, publishProjectConfirmationModal remains open, project visibility remains unpublished, and system shows globalMessageSnackbar with copy 'We encountered an issue and your project was not published'
      - when owner or editor clicks publishProjectConfirmationModalCancelButton, publishProjectConfirmationModal closes and project visibility remains unpublished
      - when project is published, projectOverviewView shows unpublishProjectButton with label 'Unpublish project' to owner and editor roles
      - when owner or editor clicks unpublishProjectButton and unpublish succeeds, project visibility transitions to unpublished, child workflows inherit unpublished visibility, and system shows globalMessageSnackbar with copy 'Your project has been successfully unpublished'; any user (published-access) already in '/project/{id}/*' or '/workflow/{id}/*' for that project loses workspace access on their next in-app action per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-003
      - when owner or editor clicks unpublishProjectButton and unpublish fails, project visibility remains published, and system shows globalMessageSnackbar with copy 'We encountered an issue and your project was not unpublished'
      - project publish state applies at project level and child workflows inherit the same visibility state per source requirement
      - published project and child workflows are visible in Explore to logged-in users with read-only access; unpublished state hides project/workflows from non-contributors

    roleBehavior:
      owner:
        publishProjectButton: availableWhenUnpublished
        unpublishProjectButton: availableWhenPublished
      editor:
        publishProjectButton: availableWhenUnpublished
        unpublishProjectButton: availableWhenPublished
      viewer:
        publishProjectButton: notAvailable
        unpublishProjectButton: notAvailable
      commenter:
        publishProjectButton: notAvailable
        unpublishProjectButton: notAvailable
      user:
        publishProjectButton: notAvailable
        unpublishProjectButton: notAvailable

    acceptanceCriteria:
      - given unpublished project, projectVisibilityStateMessage is visible with copy 'The project is currently private'
      - given unpublished project as owner or editor, publishProjectButton with label 'Publish project' is visible
      - given owner or editor clicks publishProjectButton, publishProjectConfirmationModal is visible
      - publishProjectConfirmationModalCancelButton and publishProjectConfirmationModalConfirmButton are visible
      - publishProjectConfirmationModal title, body copy, and publishProjectConfirmationModalCancelButton and publishProjectConfirmationModalConfirmButton labels match FIGMA-PROJ-OV-PUBLISH-PROJECT-MODAL
      - given owner or editor clicks publishProjectConfirmationModalConfirmButton and publish succeeds, project state becomes published, publishProjectConfirmationModal is not visible, child workflows inherit published visibility, and globalMessageSnackbar shows 'Your project has been successfully published'
      - given owner or editor clicks publishProjectConfirmationModalConfirmButton and publish succeeds, unpublishProjectButton is visible and publishProjectButton is not visible
      - given owner or editor clicks publishProjectConfirmationModalConfirmButton and publish succeeds, projectVisibilityStateMessage shows 'The project is currently public'
      - given owner or editor clicks publishProjectConfirmationModalConfirmButton and publish fails, project state remains unpublished, publishProjectConfirmationModal is visible, and globalMessageSnackbar shows 'We encountered an issue and your project was not published'
      - given owner or editor clicks publishProjectConfirmationModalCancelButton, publishProjectConfirmationModal is not visible and project state remains unpublished
      - given published project, projectVisibilityStateMessage is visible with copy 'The project is currently public'
      - given published project as owner or editor, unpublishProjectButton with label 'Unpublish project' is visible
      - given owner or editor clicks unpublishProjectButton and unpublish succeeds, project state becomes unpublished, child workflows inherit unpublished visibility, and globalMessageSnackbar shows 'Your project has been successfully unpublished'
      - given owner or editor clicks unpublishProjectButton and unpublish succeeds, publishProjectButton is visible and unpublishProjectButton is not visible
      - given owner or editor clicks unpublishProjectButton and unpublish succeeds, projectVisibilityStateMessage shows 'The project is currently private'
      - given owner or editor clicks unpublishProjectButton and unpublish fails, project state remains published, and globalMessageSnackbar shows 'We encountered an issue and your project was not unpublished'
      - given viewer, commenter, or user (published-access) per documentPreconditions, projectVisibilityStateMessage is visible and publishProjectButton and unpublishProjectButton are not visible

    openQuestions: []

  - id: FR-PROJ-OV-004
    title: addContributorsDialog interaction and outcomes

    designEvidence:
      - FIGMA-PROJ-OV-ADD-CONTRIBUTOR-DIALOG

    actors:
      - owner
      - editor

    uiObjects:
      - projectOverviewView
      - projectMetadataAddContributorsButton
      - contextActionBarAddContributorsButton
      - addContributorsDialog
      - addContributorsUserSelector
      - addContributorsUserSelectorClearButton
      - addContributorsRoleSelector
      - addContributorsSubmitButton
      - addContributorsCancelButton
      - globalMessageSnackbar
      - projectMetadataPermissionsPanel

    preconditions:
      - documentPreconditions for this file hold
      - for projectMetadataAddContributorsButton flows, current route matches '/project/{id}'
      - for contextActionBarAddContributorsButton flows, current route matches '/project/{id}/*' per tests/docs/requirements/features/shared/context_action_bar_requirements_v1.yaml FR-CAB-001
      - projectMetadataAddContributorsButton is visible on projectOverviewView, or contextActionBarAddContributorsButton is visible per FR-CAB-002

    trigger:
      - user clicks projectMetadataAddContributorsButton or contextActionBarAddContributorsButton

    mainFlow:
      - addContributorsDialog shows addContributorsUserSelector and addContributorsRoleSelector
      - addContributorsUserSelector is an autocomplete on existing CourseFlow users; when user types, narrowed matching results are displayed automatically
      - addContributorsUserSelectorClearButton clears typed input in addContributorsUserSelector
      - addContributorsRoleSelector allows assignable roles 'Editor', 'Commenter', and 'Viewer' only
      - when no user is selected in addContributorsUserSelector, addContributorsSubmitButton ('Add contributor') is disabled and not actionable
      - when owner or editor clicks addContributorsSubmitButton with a valid selection and add succeeds, system adds selected contributor(s), updates projectMetadataPermissionsPanel, closes addContributorsDialog, and shows globalMessageSnackbar with copy 'The contributor was successfully added to your project'
      - when owner or editor clicks addContributorsSubmitButton with a valid selection and add fails, addContributorsDialog remains visible, projectMetadataPermissionsPanel is unchanged, and system shows globalMessageSnackbar with copy 'We encountered an issue and the contributor could not be added to your project'
      - clicking addContributorsCancelButton closes addContributorsDialog without applying changes

    roleBehavior:
      owner:
        addContributorsDialog: available
      editor:
        addContributorsDialog: available

    acceptanceCriteria:
      - addContributorsDialog title is 'Add contributor'
      - addContributorsDialog shows addContributorsUserSelector and addContributorsRoleSelector
      - given user types in addContributorsUserSelector, narrowed matching CourseFlow users are displayed automatically
      - given addContributorsUserSelector has typed input, addContributorsUserSelectorClearButton is visible; clicking it clears the input
      - given owner or editor clicks addContributorsRoleSelector in addContributorsDialog, assignable options are 'Editor', 'Commenter', and 'Viewer'
      - given no user is selected in addContributorsUserSelector, addContributorsSubmitButton ('Add contributor') is disabled
      - given owner or editor clicks addContributorsSubmitButton with valid user and role selection and add succeeds, addContributorsDialog is not visible, projectMetadataPermissionsPanel reflects the added contributor assignment, and globalMessageSnackbar shows 'The contributor was successfully added to your project'
      - given owner or editor clicks addContributorsSubmitButton with valid user and role selection and add fails, addContributorsDialog remains visible, projectMetadataPermissionsPanel is unchanged, and globalMessageSnackbar shows 'We encountered an issue and the contributor could not be added to your project'
      - given owner or editor clicks addContributorsCancelButton, addContributorsDialog closes and no contributor change is applied
      - addContributorsCancelButton label is 'Cancel'

    openQuestions: []

  - id: FR-PROJ-OV-005
    title: Tags system on project overview (create, edit, delete)

    designEvidence:
      - FIGMA-PROJ-OV-UNPUBLISHED-WITH-TAGS
      - FIGMA-PROJ-OV-EDIT-TAG
      - FIGMA-PROJ-OV-PUBLISHED-NO-TAGS
      - FIGMA-PROJ-OV-TAGS-READONLY

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - projectOverviewView
      - projectTagsSection
      - projectTagItem
      - addNewTagInput
      - editTagInput
      - deleteTagButton

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/project/{id}'

    trigger:
      - user creates, edits, or deletes tags in projectTagsSection

    mainFlow:
      - projectTagsSection displays existing projectTagItem entries
      - for owner and editor, addNewTagInput with placeholder 'Add new tag' allows creating a new tag; when project has no tags, projectTagsSection shows no projectTagItem entries and addNewTagInput is visible; for viewer, commenter, or user (published-access) per documentPreconditions with no tags, displayed value is '-'
      - for owner and editor, when addNewTagInput has a non-empty value, committing addNewTagInput by pressing Enter or clicking outside addNewTagInput creates a new projectTagItem
      - for owner and editor, when addNewTagInput is empty or whitespace-only, committing addNewTagInput by pressing Enter or clicking outside addNewTagInput does not create a projectTagItem
      - for owner and editor, editTagInput allows inline editing of existing tag labels
      - for owner and editor, when editTagInput has a non-empty value, committing editTagInput by pressing Enter or clicking outside that projectTagItem saves the updated tag label on that projectTagItem
      - for owner and editor, when editTagInput is empty or whitespace-only, committing editTagInput by pressing Enter or clicking outside that projectTagItem does not update the tag label on that projectTagItem
      - for owner and editor, deleteTagButton removes tag from visible tag list
      - tag create, edit, and delete on projectTagsSection do not show globalMessageSnackbar feedback
      - for viewer, commenter, or user (published-access) per documentPreconditions, projectTagsSection remains visible; when project has tags, projectTagsSection shows projectTagItem entries; addNewTagInput and deleteTagButton are not visible; editTagInput is read-only
      - tags are ordered by most recently added
      - downstream assign tab on label edit — when a tag label is edited in projectTagsSection, workflowOutcomesAssignTabTagGroup titles and tag-group ordering on workflowRightSidebarOutcomesTab refresh per tests/docs/requirements/features/workflow/workflow_assign_outcome_to_node_requirements_v1.yaml FR-WF-AO-002 for every workflow in the project that has at least one level-1 workflowOutcome referencing the affected tag; outcome entity ids and hierarchy are unchanged by catalog label edits alone
      - downstream on tag deletion — when owner or editor deletes tag T from projectTagsSection, T is removed from the project tag catalog and from every workflowNode in every workflow in the project that had T assigned via workflowEditNodeFormTagsAutocomplete per tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml; T is removed from every level-1 workflowOutcome in every workflow in the project that had T assigned via workflowEditOutcomeFormTagsAutocomplete per tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml; workflowOutcomesAssignTabTagGroup for T and tag-group ordering on workflowRightSidebarOutcomesTab refresh per FR-WF-AO-002; T is no longer listed in workflowViewSettingsMenuTagsSection when the actor next opens View settings on a Workflow or Outcomes sub-view per tests/docs/requirements/features/shared/context_action_bar_requirements_v1.yaml FR-CAB-006; T is no longer offered in workflowEditNodeFormTagsAutocomplete or workflowEditOutcomeFormTagsAutocomplete option lists project-wide

    roleBehavior:
      owner:
        addNewTagInput: available
        editTagInput: available
        deleteTagButton: available
      editor:
        addNewTagInput: available
        editTagInput: available
        deleteTagButton: available
      viewer:
        addNewTagInput: notAvailable
        editTagInput: readOnly
        deleteTagButton: notAvailable
      commenter:
        addNewTagInput: notAvailable
        editTagInput: readOnly
        deleteTagButton: notAvailable
      user:
        addNewTagInput: notAvailable
        editTagInput: readOnly
        deleteTagButton: notAvailable

    acceptanceCriteria:
      - given project has no tags, projectTagsSection is visible with no projectTagItem entries; given owner or editor, addNewTagInput with placeholder 'Add new tag' is visible
      - given project has no tags and viewer, commenter, or user (published-access) per documentPreconditions, projectTagsSection is visible with displayed value '-'; addNewTagInput is not visible
      - given owner or editor enters a non-empty value in addNewTagInput and presses Enter, a new projectTagItem is shown
      - given owner or editor enters a non-empty value in addNewTagInput and clicks outside addNewTagInput, a new projectTagItem is shown
      - given owner or editor commits addNewTagInput with empty or whitespace-only value by pressing Enter or clicking outside addNewTagInput, no new projectTagItem is created
      - given owner or editor edits a tag label in editTagInput to a non-empty value and presses Enter, projectTagItem reflects the new label
      - given owner or editor edits a tag label in editTagInput to a non-empty value and clicks outside that projectTagItem, projectTagItem reflects the new label
      - given owner or editor commits editTagInput with empty or whitespace-only value by pressing Enter or clicking outside that projectTagItem, projectTagItem label is unchanged
      - given owner or editor clicks deleteTagButton for a tag, that projectTagItem is removed from the list
      - given workflowNode N in a workflow in the project had tag T assigned via workflowEditNodeFormTagsAutocomplete and owner or editor deletes T from projectTagsSection, when owner or editor opens N on the Workflow sub-view, workflowEditNodeFormTagsAutocomplete for N does not show T
      - given level-1 workflowOutcome O in a workflow in the project had tag T assigned via workflowEditOutcomeFormTagsAutocomplete and owner or editor deletes T from projectTagsSection, when owner or editor opens O on the Outcomes sub-view, workflowEditOutcomeFormTagsAutocomplete for O and workflowOutcomeHeaderTagChips on O do not show T
      - given workflowRightSidebarOutcomesTabContent showed workflowOutcomesAssignTabTagGroup for tag T and owner or editor deletes T from projectTagsSection, when actor selects 'Workflow' on workflowViewTabSelector per FR-WF-HEADER-001 and clicks workflowRightSidebarOutcomesTab, workflowOutcomesAssignTabTagGroup for T is no longer rendered per FR-WF-AO-002
      - given workflowViewSettingsMenuTagsSection previously listed tag T and owner or editor deletes T from projectTagsSection, when actor opens View settings on the Workflow or Outcomes sub-view per FR-CAB-006, T is not listed in workflowViewSettingsMenuTagsSection
      - given owner or editor deletes tag T from projectTagsSection, T is not offered as a selectable option in workflowEditNodeFormTagsAutocomplete or workflowEditOutcomeFormTagsAutocomplete in any workflow in the project
      - given viewer, commenter, or user (published-access) per documentPreconditions and project has tags, projectTagsSection shows projectTagItem entries; addNewTagInput and deleteTagButton are not visible; editTagInput is read-only
      - tags are displayed in most-recently-added order

    openQuestions: []

