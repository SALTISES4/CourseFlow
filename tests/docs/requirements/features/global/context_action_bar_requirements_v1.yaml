requirements:
  - id: FR-CAB-001
    title: contextActionBar on project routes

    designEvidence:
      - FIGMA-CAB-PROJECT-ACTION-BAR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar

    preconditions:
      - documentPreconditions hold for a project route
      - current route matches '/project/{id}/*'

    trigger: []

    mainFlow:
      - system renders contextActionBar directly below topNavigationBar when current route matches '/project/{id}/*'
      - contextActionBar remains available when switching between project sub-views via projectViewTabSelector per tests/docs/requirements/features/project/project_header_requirements_v1.yaml FR-PROJ-HEADER-001 (same bar contract across sub-views)

    roleBehavior: {}

    acceptanceCriteria:
      - given FR-CAB-001 preconditions hold, contextActionBar is visible below topNavigationBar

    openQuestions: []

  - id: FR-CAB-002
    title: Project contextActionBar primary actions (edit pencil, add contributors, overflow)

    designEvidence:
      - FIGMA-CAB-PROJECT-ACTION-BAR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - editPencilButton
      - contextActionBarAddContributorsButton
      - contextActionBarOverflowTrigger

    preconditions:
      - FR-CAB-001 preconditions hold

    trigger: []

    mainFlow:
      - on project routes, contextActionBar includes editPencilButton, contextActionBarAddContributorsButton, and contextActionBarOverflowTrigger for every actor in scope
      - contextActionBarAddContributorsButton is icon-only with no user-visible label
      - detailed editPencilButton behavior is specified in project_edit_form_requirements_v1.yaml FR-PROJ-FORM-003
      - contextActionBarAddContributorsButton and contextActionBarOverflowTrigger actionability per roleBehavior; addContributorsDialog opens from contextActionBarAddContributorsButton per tests/docs/requirements/features/project/project_overview_requirements_v1.yaml FR-PROJ-OV-002 and FR-PROJ-OV-004

    roleBehavior:
      owner:
        contextActionBarAddContributorsButton: available
        contextActionBarOverflowTrigger: available
      editor:
        contextActionBarAddContributorsButton: available
        contextActionBarOverflowTrigger: disabled
      viewer:
        contextActionBarAddContributorsButton: disabled
        contextActionBarOverflowTrigger: disabled
      commenter:
        contextActionBarAddContributorsButton: disabled
        contextActionBarOverflowTrigger: disabled
      user:
        contextActionBarAddContributorsButton: disabled
        contextActionBarOverflowTrigger: disabled

    acceptanceCriteria:
      - given FR-CAB-002 preconditions hold, editPencilButton, contextActionBarAddContributorsButton, and contextActionBarOverflowTrigger are visible on contextActionBar for every actor in scope; contextActionBarAddContributorsButton is icon-only with no user-visible label; editPencilButton actionability per FR-PROJ-FORM-003
      - contextActionBarAddContributorsButton and contextActionBarOverflowTrigger actionability per roleBehavior (viewer, commenter, and user see contextActionBarAddContributorsButton visible but disabled); addContributorsDialog and contextActionBarOverflowMenu open rules per FR-PROJ-OV-002

    openQuestions: []

  - id: FR-CAB-003
    title: Project overflow menu

    designEvidence:
      - FIGMA-CAB-PROJECT-ACTION-BAR

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - contextActionBarOverflowTrigger
      - contextActionBarOverflowMenu
      - contextActionBarOverflowItemArchiveProject

    preconditions:
      - FR-CAB-001 preconditions hold

    trigger:
      - actor clicks contextActionBarOverflowTrigger per roleBehavior

    mainFlow:
      - when actor clicks contextActionBarOverflowTrigger per roleBehavior, system opens contextActionBarOverflowMenu
      - contextActionBarOverflowMenu lists exactly one selectable row contextActionBarOverflowItemArchiveProject labeled 'Archive project'
      - when actor clicks contextActionBarOverflowItemArchiveProject per roleBehavior, post-click behaviour is specified in project_archive_requirements_v1.yaml (FR-PROJ-ARCH-001 onward)

    roleBehavior:
      owner:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveProject: available
      editor:
        contextActionBarOverflowTrigger: disabled
      viewer:
        contextActionBarOverflowTrigger: disabled
      commenter:
        contextActionBarOverflowTrigger: disabled
      user:
        contextActionBarOverflowTrigger: disabled

    acceptanceCriteria:
      - given FR-CAB-003 preconditions hold and actor clicks contextActionBarOverflowTrigger per roleBehavior, contextActionBarOverflowMenu opens and shows exactly one row labeled 'Archive project'
      - contextActionBarOverflowItemArchiveProject actionability per roleBehavior; post-click behaviour per FR-PROJ-ARCH-001 onward in project_archive_requirements_v1.yaml

    openQuestions: []

  - id: FR-CAB-004
    title: contextActionBar on authenticated workflow routes

    designEvidence:
      - FIGMA-CAB-WF-OVERVIEW
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar

    preconditions:
      - documentPreconditions hold for a workflow route
      - current route matches '/workflow/{id}/*'

    trigger: []

    mainFlow:
      - system renders contextActionBar directly below topNavigationBar when current route matches '/workflow/{id}/*'
      - contextActionBar remains available when switching between workflow sub-views via workflowViewTabSelector per tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml FR-WF-HEADER-001 (same bar contract across sub-views)
      - contextActionBar includes editPencilButton, contextActionBarOverflowTrigger, and workflowViewSettingsTrigger for every actor in scope; editPencilButton remains visible for every actor, while its actionability is specified in workflow_edit_form_requirements_v1.yaml FR-WF-FORM-001
      - when active workflow sub-view is 'Workflow', contextActionBar also includes workflowJumpToTrigger; on other workflow sub-views this control is not shown
      - contextActionBar shell is shown on each authenticated workflow sub-view, including 'Outcome table' when eligible (inner controls may differ per FR-CAB-005, FR-CAB-006, and FR-CAB-008 through FR-CAB-010)

    roleBehavior: {}

    acceptanceCriteria:
      - given FR-CAB-004 preconditions hold, contextActionBar is visible below topNavigationBar for each of the workflow sub-views in scope
      - given FR-CAB-004 preconditions hold, editPencilButton is visible on contextActionBar for every actor in scope, with actionability conforming to workflow_edit_form_requirements_v1.yaml FR-WF-FORM-001

    openQuestions: []

  - id: FR-CAB-005
    title: Workflow overflow menu rows ('Copy [workflow type]', 'Archive [workflow type]')

    designEvidence:
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - contextActionBarOverflowTrigger
      - contextActionBarOverflowMenu
      - contextActionBarOverflowItemCopyWorkflow
      - contextActionBarOverflowItemArchiveWorkflow

    preconditions:
      - FR-CAB-004 preconditions hold

    trigger:
      - actor clicks contextActionBarOverflowTrigger per roleBehavior

    mainFlow:
      - actor clicks contextActionBarOverflowTrigger per roleBehavior to open contextActionBarOverflowMenu
      - contextActionBarOverflowMenu lists contextActionBarOverflowItemCopyWorkflow labeled matching the 'Copy [workflow type]' template after substituting the current workflow's user-visible type label for '[workflow type]'
      - contextActionBarOverflowMenu lists contextActionBarOverflowItemArchiveWorkflow labeled matching the 'Archive [workflow type]' template after substituting the current workflow's user-visible type label for '[workflow type]'
      - contextActionBarOverflowItemCopyWorkflow and contextActionBarOverflowItemArchiveWorkflow actionability per roleBehavior below; archiving a workflow is owner-only
      - no additional overflow rows exist in this product scope beyond those two
      - when actor clicks contextActionBarOverflowItemCopyWorkflow per roleBehavior, post-click behaviour is specified in workflow_copy_requirements_v1.yaml (FR-WF-COPY-001 onward)
      - when actor clicks contextActionBarOverflowItemArchiveWorkflow per roleBehavior, post-click behaviour is specified in workflow_archive_requirements_v1.yaml (FR-WF-ARCH-001 onward)

    roleBehavior:
      owner:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: available
        contextActionBarOverflowItemCopyWorkflow: available
      editor:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: readOnly
        contextActionBarOverflowItemCopyWorkflow: available
      viewer:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: readOnly
        contextActionBarOverflowItemCopyWorkflow: available
      commenter:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: readOnly
        contextActionBarOverflowItemCopyWorkflow: available
      user:
        contextActionBarOverflowTrigger: available
        contextActionBarOverflowItemArchiveWorkflow: readOnly
        contextActionBarOverflowItemCopyWorkflow: available

    acceptanceCriteria:
      - given FR-CAB-005 preconditions hold and actor clicks contextActionBarOverflowTrigger per roleBehavior, contextActionBarOverflowMenu opens and shows exactly two rows with labels matching the 'Copy [workflow type]' and 'Archive [workflow type]' templates after substituting the current workflow's user-visible type label for '[workflow type]', in that top-to-bottom order
      - contextActionBarOverflowItemCopyWorkflow and contextActionBarOverflowItemArchiveWorkflow actionability per roleBehavior; archiving a workflow is owner-only

    openQuestions: []

  - id: FR-CAB-006
    title: Workflow 'View settings' on contextActionBar (visibility by sub-view)

    designEvidence:
      - FIGMA-CAB-WF-OVERVIEW
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS
      - FIGMA-CAB-WF-OUTCOMES-VIEW-SETTINGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - workflowViewSettingsTrigger
      - workflowViewSettingsMenu
      - workflowViewSettingsMenuItemExpandAllSections
      - workflowViewSettingsMenuItemCollapseAllSections
      - workflowViewSettingsMenuItemExpandAllOutcomes
      - workflowViewSettingsMenuItemCollapseAllOutcomes
      - workflowViewSettingsMenuTagsSection

    preconditions:
      - FR-CAB-004 preconditions hold

    trigger:
      - actor clicks workflowViewSettingsTrigger per roleBehavior when that control is visible
      - actor clicks a row in workflowViewSettingsMenu when that row is visible for the active workflow sub-view

    mainFlow:
      - when active workflow sub-view is 'Overview', workflowViewSettingsTrigger is not shown on contextActionBar
      - when active workflow sub-view is 'Workflow', 'Outcomes', or 'Outcome table', workflowViewSettingsTrigger is visible on contextActionBar and opens workflowViewSettingsMenu when clicked per roleBehavior; Outcome Table menu contents and behavior are defined by FR-CAB-008
      - all rows visible in workflowViewSettingsMenu for the active workflow sub-view are actionable when shown
      - when active workflow sub-view is 'Workflow' and workflowViewSettingsMenu is open, workflowViewSettingsMenu always shows workflowViewSettingsMenuItemExpandAllSections ('Expand all sections') and workflowViewSettingsMenuItemCollapseAllSections ('Collapse all sections'); when parent project has at least one tag per tests/docs/requirements/features/project/project_overview_requirements_v1.yaml FR-PROJ-OV-005 and at least one workflowNode in the current workflow has a tag assigned via workflowEditNodeFormTagsAutocomplete per tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml, workflowViewSettingsMenu also shows workflowViewSettingsMenuTagsSection; otherwise workflowViewSettingsMenuTagsSection is not shown; workflowViewSettingsMenu does not show workflowViewSettingsMenuItemExpandAllOutcomes or workflowViewSettingsMenuItemCollapseAllOutcomes
      - when active workflow sub-view is 'Outcomes' and workflowViewSettingsMenu is open, workflowViewSettingsMenu always shows workflowViewSettingsMenuItemExpandAllOutcomes ('Expand all outcomes') and workflowViewSettingsMenuItemCollapseAllOutcomes ('Collapse all outcomes'); when parent project has at least one tag per FR-PROJ-OV-005 and at least one workflowOutcome in the current workflow has a tag assigned via workflowEditOutcomeFormTagsAutocomplete per tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml, workflowViewSettingsMenu also shows workflowViewSettingsMenuTagsSection; otherwise workflowViewSettingsMenuTagsSection is not shown; workflowViewSettingsMenu does not show workflowViewSettingsMenuItemExpandAllSections or workflowViewSettingsMenuItemCollapseAllSections
      - workflowViewSettingsMenuItemExpandAllSections, workflowViewSettingsMenuItemCollapseAllSections, workflowViewSettingsMenuItemExpandAllOutcomes, and workflowViewSettingsMenuItemCollapseAllOutcomes are discrete selectable menu rows (not switch toggles); legacy archive expand/collapse node rows and 'Show Legend' are not in product scope
      - clicking workflowViewSettingsMenuItemExpandAllSections expands all workflowSectionContainer entries in workflowView per FR-SEC-012 in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml; clicking workflowViewSettingsMenuItemCollapseAllSections collapses all workflowSectionContainer entries in workflowView per FR-SEC-012
      - clicking workflowViewSettingsMenuItemExpandAllOutcomes expands all workflowOutcome entries in workflowOutcomeView per tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml; clicking workflowViewSettingsMenuItemCollapseAllOutcomes collapses all workflowOutcome entries in workflowOutcomeView
      - when workflowViewSettingsMenuTagsSection is shown, it lists project tags from the parent project's tag catalog per FR-PROJ-OV-005 that are assigned to at least one workflowNode (Workflow sub-view) or workflowOutcome (Outcomes sub-view) in the current workflow; each listed tag has an on/off toggle — on the Workflow sub-view, turning a tag off hides workflowNode entries carrying that tag from workflowView; on the Outcomes sub-view, turning a tag off hides workflowOutcome entries carrying that tag from workflowOutcomeView; workflowNode or workflowOutcome entries with no tags assigned remain visible regardless of toggle state; when an entry carries multiple tags, it is hidden if any assigned tag matches a toggled-off tag; tag on/off toggle state in workflowViewSettingsMenuTagsSection is session-scoped only and is not persisted — refreshing the page or reopening the workflow resets all tag toggles to on (show all tagged entries)
      - when tag T is deleted from the project tag catalog per FR-PROJ-OV-005, T is not listed in workflowViewSettingsMenuTagsSection the next time the actor opens View settings on the Workflow or Outcomes sub-view

    roleBehavior:
      owner:
        workflowViewSettingsTrigger: available
      editor:
        workflowViewSettingsTrigger: available
      viewer:
        workflowViewSettingsTrigger: available
      commenter:
        workflowViewSettingsTrigger: available
      user:
        workflowViewSettingsTrigger: available

    acceptanceCriteria:
      - given workflow sub-view is 'Overview', workflowViewSettingsTrigger is not visible
      - given FR-CAB-006 preconditions hold and workflow sub-view is 'Workflow', 'Outcomes', or 'Outcome table', workflowViewSettingsTrigger is visible and clicking it opens workflowViewSettingsMenu; Outcome Table contents conform to FR-CAB-008
      - given workflow sub-view is 'Workflow' and workflowViewSettingsMenu is open, parent project has at least one tag per FR-PROJ-OV-005, and at least one workflowNode in the current workflow has a tag assigned via workflowEditNodeFormTagsAutocomplete, menu shows exactly three areas in order — 'Expand all sections', 'Collapse all sections', and workflowViewSettingsMenuTagsSection — and does not show 'Expand all outcomes' or 'Collapse all outcomes'
      - given workflow sub-view is 'Workflow' and workflowViewSettingsMenu is open, and either parent project has no tags per FR-PROJ-OV-005 or no workflowNode in the current workflow has a tag assigned via workflowEditNodeFormTagsAutocomplete, workflowViewSettingsMenuTagsSection is not shown and menu shows exactly two areas — 'Expand all sections' and 'Collapse all sections'
      - given workflow sub-view is 'Outcomes' and workflowViewSettingsMenu is open, parent project has at least one tag per FR-PROJ-OV-005, and at least one workflowOutcome in the current workflow has a tag assigned via workflowEditOutcomeFormTagsAutocomplete, menu shows exactly three areas in order — 'Expand all outcomes', 'Collapse all outcomes', and workflowViewSettingsMenuTagsSection — and does not show 'Expand all sections' or 'Collapse all sections'
      - given workflow sub-view is 'Outcomes' and workflowViewSettingsMenu is open, and either parent project has no tags per FR-PROJ-OV-005 or no workflowOutcome in the current workflow has a tag assigned via workflowEditOutcomeFormTagsAutocomplete, workflowViewSettingsMenuTagsSection is not shown and menu shows exactly two areas — 'Expand all outcomes' and 'Collapse all outcomes'
      - given actor turned a tag off in workflowViewSettingsMenuTagsSection, when the page is refreshed or the workflow is reopened, that tag toggle is on again and entries carrying that tag are visible per the filter rules above
      - given workflow sub-view is 'Workflow' and workflowNode N has no tags assigned via workflowEditNodeFormTagsAutocomplete, when actor toggles one or more tags off in workflowViewSettingsMenuTagsSection, N remains visible in workflowView
      - given workflow sub-view is 'Outcomes' and workflowOutcome O has no tags assigned via workflowEditOutcomeFormTagsAutocomplete, when actor toggles one or more tags off in workflowViewSettingsMenuTagsSection, O remains visible in workflowOutcomeView
      - given workflow sub-view is 'Workflow' and workflowNode N carries tags {T1, T2, …} via workflowEditNodeFormTagsAutocomplete, when actor toggles T1 off in workflowViewSettingsMenuTagsSection, N is hidden from workflowView; when T1 is toggled back on and no other tag assigned to N matches a toggled-off tag, N is visible again in workflowView
      - given workflow sub-view is 'Outcomes' and level-1 workflowOutcome O carries tags {T1, T2, …} via workflowEditOutcomeFormTagsAutocomplete, when actor toggles T1 off in workflowViewSettingsMenuTagsSection, O is hidden from workflowOutcomeView; when T1 is toggled back on and no other tag assigned to O matches a toggled-off tag, O is visible again in workflowOutcomeView
      - given workflowViewSettingsMenuTagsSection previously listed tag T and owner or editor deletes T from projectTagsSection per FR-PROJ-OV-005, when actor opens View settings on the Workflow or Outcomes sub-view, T is not shown in workflowViewSettingsMenuTagsSection

    openQuestions: []

  - id: FR-CAB-007
    title: Workflow 'Jump to' on contextActionBar scrolls to selected section

    designEvidence:
      - FIGMA-CAB-WF-WORKFLOW-VIEW-SETTINGS

    actors:
      - owner
      - editor
      - viewer
      - commenter
      - user

    uiObjects:
      - contextActionBar
      - workflowJumpToTrigger
      - workflowJumpToMenu
      - workflowJumpToMenuSectionItem
      - workflowJumpToUntitledSectionDisplayFallback
      - workflowSectionContainer
      - workflowSectionNumberLabel
      - workflowSectionTitleText
      - workflowEditSectionFormTitleField

    preconditions:
      - FR-CAB-004 preconditions hold
      - active workflow sub-view is 'Workflow'
      - workflowView contains at least one workflowSectionContainer

    trigger:
      - actor clicks workflowJumpToTrigger per roleBehavior, then clicks workflowJumpToMenuSectionItem

    mainFlow:
      - workflowJumpToTrigger is visible on contextActionBar with label 'Jump to'
      - clicking workflowJumpToTrigger per roleBehavior opens workflowJumpToMenu
      - workflowJumpToMenu lists every workflowSectionContainer in workflowView top-to-bottom order, each as one workflowJumpToMenuSectionItem row
      - each workflowJumpToMenuSectionItem visible label is workflowSectionNumberLabel text for that section, the literal separator ' - ' (ASCII space, hyphen, ASCII space), then either the persisted workflowEditSectionFormTitleField value when non-empty or workflowJumpToUntitledSectionDisplayFallback when the persisted title is the empty string
      - Jump to row label rules apply only inside workflowJumpToMenu and do not change workflowSectionHeader presentation on the canvas, which remains per FR-SEC-002 (empty persisted title shows workflowSectionNumberLabel only with no workflowSectionTitleText)
      - when section order or titles change per FR-SEC-002 or FR-SEC-003, workflowJumpToMenuSectionItem labels reflect the updated workflowSectionNumberLabel values and persisted titles the next time workflowJumpToMenu is opened
      - clicking a workflowJumpToMenuSectionItem scrolls the viewport to the matching workflowSectionContainer in workflowView

    roleBehavior:
      user:
        workflowJumpToTrigger: available
      owner:
        workflowJumpToTrigger: available
      editor:
        workflowJumpToTrigger: available
      viewer:
        workflowJumpToTrigger: available
      commenter:
        workflowJumpToTrigger: available

    acceptanceCriteria:
      - given FR-CAB-007 preconditions hold, workflowJumpToTrigger is visible on contextActionBar with label 'Jump to'
      - given actor clicks workflowJumpToTrigger per roleBehavior, workflowJumpToMenu opens
      - given workflowJumpToMenu is open, every workflowSectionContainer in workflowView is listed as a selectable workflowJumpToMenuSectionItem row in top-to-bottom section order
      - given workflowEditSectionFormTitleField is non-empty for a section, the matching workflowJumpToMenuSectionItem visible label is '{workflowSectionNumberLabel} - {persisted title}' with the literal separator ' - ' between the index and the title text
      - given workflowEditSectionFormTitleField is the empty string for a section, the matching workflowJumpToMenuSectionItem visible label is '{workflowSectionNumberLabel} - Untitled section' in en-CA (workflowJumpToUntitledSectionDisplayFallback after the literal separator ' - ')
      - given a section has an empty persisted title, workflowSectionHeader on the canvas still shows workflowSectionNumberLabel only with no workflowSectionTitleText per FR-SEC-002
      - given actor clicks a workflowJumpToMenuSectionItem, viewport scroll position moves to that corresponding workflowSectionContainer

    openQuestions: []

  - id: FR-CAB-008
    title: "'View settings' on contextActionBar for 'Outcome table' sub-view"

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - contextActionBar
      - workflowViewSettingsTrigger
      - workflowViewSettingsMenu
      - workflowOutcomeTableViewSettingsMenuItemExpandOutcomes
      - workflowOutcomeTableViewSettingsMenuItemCollapseOutcomes
      - workflowOutcomeTableViewSettingsMenuTagsSection
      - workflowOutcomeTableNormalLayout
      - workflowOutcomeTableCompetencyMatrixLayout
      - workflowOutcome
      - workflowNode
      - projectTagItem

    preconditions:
      - documentPreconditions for this file hold
      - current workflow is a course or program workflow
      - FR-CAB-004 preconditions hold
      - active workflow sub-view is 'Outcome table'

    trigger:
      - user clicks workflowViewSettingsTrigger on 'Outcome table' sub-view
      - user toggles a tag in workflowOutcomeTableViewSettingsMenuTagsSection

    mainFlow:
      - when active sub-view is 'Outcome table', workflowViewSettingsTrigger is visible on contextActionBar and opens workflowViewSettingsMenu when clicked
      - workflowViewSettingsMenu shows workflowOutcomeTableViewSettingsMenuItemExpandOutcomes labeled 'Expand outcomes' and workflowOutcomeTableViewSettingsMenuItemCollapseOutcomes labeled 'Collapse outcomes'; workflowOutcomeTableViewSettingsMenuTagsSection is shown only when at least one projectTagItem from FR-PROJ-OV-005 is assigned to at least one workflowOutcome in the current workflow; tags assigned only to workflowNode entries do not make the section visible and are not listed because Outcome Table tag filtering applies only to the outcome axis
      - expand and collapse behavior for workflowOutcomeTableViewSettingsMenuItemExpandOutcomes and workflowOutcomeTableViewSettingsMenuItemCollapseOutcomes follows tests/docs/requirements/features/workflow/workflow_outcome_table_requirements_v1.yaml FR-WF-OT-003
      - workflowOutcomeTableViewSettingsMenuTagsSection lists each projectTagItem from FR-PROJ-OV-005 assigned to at least one workflowOutcome in the current workflow; toggling a tag off hides every rendered occurrence of each workflowOutcome carrying that tag from the outcome axis in both layouts, and toggling it on restores those occurrences unless another assigned tag remains off
      - when a hidden workflowOutcome is a parent, its displayed subtree is also hidden so no descendant is rendered without its ancestor; a descendant with no tags remains hidden while its ancestor is hidden under this hierarchy rule
      - when a workflowOutcome carries multiple tags, it is hidden if any assigned tag matches a toggled-off tag per FR-CAB-006; when all assigned tags are on, every occurrence allowed by FR-WF-OT-008 is visible
      - workflowOutcome entries with no tags remain visible regardless of tag toggles except when hidden as a descendant of a hidden parent under the hierarchy rule above
      - tag filtering changes presentation only and does not change outcome-to-node assignments, completion status, or persisted workflow data
      - node-derived summary values and section totals for hours, credits, classification, and ponderation per FR-WF-OT-009 and FR-WF-OT-010 are unchanged when workflowOutcome rows or columns are hidden
      - on first entry to 'Outcome table' in a newly opened workflow, every outcome tag is toggled on; subsequent tag-toggle and outcome-expansion state is preserved while the actor switches table style or moves among sub-views within that same mounted workflow
      - tag-toggle and outcome-expansion state resets to every tag on and every expandable outcome collapsed when the actor leaves and later reopens the workflow, opens a different workflow, or reloads the page; this presentation state is not persisted to backend data or browser storage
      - expand/collapse and tag filtering change only the current browser presentation and remain available when the workflow is otherwise read-only; they do not require mutation permission or workflow edit-lock ownership

    roleBehavior:
      owner:
        workflowViewSettingsTrigger: available
      editor:
        workflowViewSettingsTrigger: available
      commenter:
        workflowViewSettingsTrigger: available
      viewer:
        workflowViewSettingsTrigger: available
      user:
        workflowViewSettingsTrigger: available

    acceptanceCriteria:
      - given authenticated actor is on 'Outcome table', workflowViewSettingsTrigger is visible and its menu contains 'Expand outcomes' and 'Collapse outcomes'
      - given the workflow has outcome tags in use, workflowOutcomeTableViewSettingsMenuTagsSection lists each in-use outcome tag once and does not list a tag used only by workflowNode entries
      - given the workflow has no tag assigned to a workflowOutcome, workflowOutcomeTableViewSettingsMenuTagsSection is not rendered
      - given outcome O carries a toggled-off tag, every rendered occurrence of O and O's displayed subtree is hidden in both table styles; O is restored only after every tag assigned to O is toggled on
      - given an untagged outcome whose ancestors remain visible, toggling any tag does not hide that outcome
      - given a tag toggle hides outcome rows or columns, outcome assignments, completion status, node-derived summary values, and persisted workflow data remain unchanged
      - given actor is commenter, viewer, published-access user, or an owner or editor without the edit lock, expand, collapse, and outcome-tag controls remain enabled
      - given actor changes outcome expansion or tag toggles, that state survives table-style and workflow sub-view changes within the mounted workflow and resets to collapsed outcomes and all tags on after workflow reopen, workflow change, or page reload

    openQuestions: []

  - id: FR-CAB-009
    title: "'Sort' control on contextActionBar for 'Outcome table' sub-view"

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - contextActionBar
      - workflowOutcomeTableSortTrigger
      - workflowOutcomeTableSortMenu
      - workflowOutcomeTableSortMenuItemChronological
      - workflowOutcomeTableSortMenuItemNodeCategory
      - workflowOutcomeTableSortMenuItemContext
      - workflowOutcomeTableStyleMenuItemNormal
      - workflowOutcomeTableStyleMenuItemCompetencyMatrix
      - workflowOutcomeTableNormalLayout
      - workflowOutcomeTableCompetencyMatrixLayout
      - workflowView
      - workflowEditNodeFormCourseContextSelect
      - workflowSectionContainer
      - workflowSectionRow
      - workflowNode
      - workflowChannel
      - workflowOutcomeTableColumnHeader
      - workflowOutcomeTableSectionGroupBand
      - workflowOutcomeTableNodeRowLabel

    preconditions:
      - documentPreconditions for this file hold
      - FR-CAB-004 preconditions hold
      - active workflow sub-view is 'Outcome table'

    trigger:
      - user clicks workflowOutcomeTableSortTrigger
      - user selects a row in workflowOutcomeTableSortMenu

    mainFlow:
      - workflowOutcomeTableSortTrigger is visible on contextActionBar on 'Outcome table' sub-view and is separate from workflowViewSettingsTrigger and workflowOutcomeTableStyleTrigger
      - workflowOutcomeTableSortMenu lists workflowOutcomeTableSortMenuItemChronological labeled 'Chronological', workflowOutcomeTableSortMenuItemNodeCategory labeled 'Node category', and on course workflows only workflowOutcomeTableSortMenuItemContext labeled 'Context'
      - on program workflows, workflowOutcomeTableSortMenuItemContext is not shown
      - every sort mode preserves workflowSectionContainer order from workflowView and reorders workflowNode entries only within their existing workflowSectionContainer; no sort mode moves a workflowNode into a different section
      - default selection is workflowOutcomeTableSortMenuItemChronological on first entry to 'Outcome table' in a newly opened workflow — within each workflowSectionContainer in workflowView, node order matches 'Workflow' sub-view grid order row-by-row from top to bottom; within each workflowSectionRow, workflowNode entries are ordered left to right across workflowChannels before advancing to the next row
      - when user selects workflowOutcomeTableSortMenuItemNodeCategory, workflowNode entries within each workflowSectionContainer are grouped by their workflowChannel using the current left-to-right workflowChannel order from workflowView; custom, inserted, duplicated, or reordered workflowChannels participate at their current channel position; within each workflowChannel group, workflowNode entries retain chronological order
      - "on course workflows, when user selects workflowOutcomeTableSortMenuItemContext, workflowNode entries within each workflowSectionContainer are grouped by workflowEditNodeFormCourseContextSelect in this order: 'None', 'Formative', 'Summative', then 'Comprehensive'; an unset or null context is treated as 'None'; within each context group, workflowNode entries retain chronological order"
      - in workflowOutcomeTableNormalLayout per FR-WF-OT-001, the selected node order applies to workflowOutcomeTableColumnHeader entries within each workflowOutcomeTableSectionGroupBand; in workflowOutcomeTableCompetencyMatrixLayout per FR-WF-OT-002, the same selected node order applies to workflowOutcomeTableNodeRowLabel rows within each workflowOutcomeTableSectionGroupBand
      - "each non-chronological sort is stable: when two workflowNode entries have the same selected sort value, their relative chronological order is unchanged"
      - the selected sort is preserved when the actor changes between workflowOutcomeTableNormalLayout and workflowOutcomeTableCompetencyMatrixLayout or moves among sub-views within the same mounted workflow; changing table style does not reset the sort
      - the selected sort resets to workflowOutcomeTableSortMenuItemChronological when the actor leaves and later reopens the workflow, opens a different workflow, or reloads the page; the selected sort is not persisted to backend data or browser storage
      - sorting changes only the current browser presentation and remains available when the workflow is otherwise read-only; it does not require mutation permission or workflow edit-lock ownership

    roleBehavior:
      owner:
        workflowOutcomeTableSortTrigger: available
      editor:
        workflowOutcomeTableSortTrigger: available
      commenter:
        workflowOutcomeTableSortTrigger: available
      viewer:
        workflowOutcomeTableSortTrigger: available
      user:
        workflowOutcomeTableSortTrigger: available

    acceptanceCriteria:
      - given a course workflow, workflowOutcomeTableSortMenu contains exactly 'Chronological', 'Node category', and 'Context'; given a program workflow, it contains 'Chronological' and 'Node category' and does not contain 'Context'
      - given 'Chronological' is selected, nodes remain inside their existing sections and follow Workflow grid order row-by-row, left-to-right within each row
      - given 'Node category' is selected, nodes remain inside their existing sections, channel groups follow current left-to-right channel order, and nodes within each channel retain chronological order
      - given a course workflow and 'Context' is selected, context groups are ordered None or unset, Formative, Summative, Comprehensive and nodes tied within a group retain chronological order
      - given any non-chronological sort contains equal sort values, the relative chronological order of tied nodes is unchanged
      - given a selected sort, Normal columns and Competency matrix rows use the same resulting node order
      - given actor changes table style or leaves and returns to Outcome Table within the mounted workflow, the selected sort is preserved and changing style does not reset it
      - given actor reopens the workflow, opens another workflow, or reloads the page, selected sort is 'Chronological'
      - given the workflow is read-only or actor does not hold the edit lock, workflowOutcomeTableSortTrigger remains enabled and sorting does not persist workflow data

    openQuestions: []

  - id: FR-CAB-010
    title: "Table style control on contextActionBar for 'Outcome table' sub-view"

    designEvidence:
      - FIGMA-WF-OT-COURSE-STANDARD-SCROLLED-LEFT
      - FIGMA-WF-OT-COURSE-COMPETENCY-MATRIX-SCROLLED-LEFT

    actors:
      - owner
      - editor
      - commenter
      - viewer
      - user

    uiObjects:
      - contextActionBar
      - workflowOutcomeTableStyleTrigger
      - workflowOutcomeTableStyleMenu
      - workflowOutcomeTableStyleMenuItemNormal
      - workflowOutcomeTableStyleMenuItemCompetencyMatrix
      - workflowOutcomeTableView
      - workflowOutcomeTableNormalLayout
      - workflowOutcomeTableCompetencyMatrixLayout

    preconditions:
      - documentPreconditions for this file hold
      - FR-CAB-004 preconditions hold
      - active workflow sub-view is 'Outcome table'

    trigger:
      - user navigates to 'Outcome table' sub-view
      - user clicks workflowOutcomeTableStyleTrigger
      - user selects workflowOutcomeTableStyleMenuItemNormal or workflowOutcomeTableStyleMenuItemCompetencyMatrix

    mainFlow:
      - workflowOutcomeTableStyleTrigger is visible on contextActionBar when active sub-view is 'Outcome table' and is separate from workflowViewSettingsTrigger and workflowOutcomeTableSortTrigger
      - on first entry to 'Outcome table' in a newly opened workflow, workflowOutcomeTableStyleTrigger shows 'Normal' as the active table style and workflowOutcomeTableView renders workflowOutcomeTableNormalLayout per FR-WF-OT-001
      - workflowOutcomeTableStyleMenu lists workflowOutcomeTableStyleMenuItemNormal labeled 'Normal' and workflowOutcomeTableStyleMenuItemCompetencyMatrix labeled 'Competency matrix'
      - when user selects 'Normal', workflowOutcomeTableView renders workflowOutcomeTableNormalLayout per FR-WF-OT-001 without changing route
      - when user selects 'Competency matrix', workflowOutcomeTableView renders workflowOutcomeTableCompetencyMatrixLayout per FR-WF-OT-002 without changing route
      - both course and program workflows support both table styles
      - the selected table style is preserved when the actor moves among sub-views within the same mounted workflow; returning to 'Outcome table' restores that selected style
      - the selected table style resets to 'Normal' when the actor leaves and later reopens the workflow, opens a different workflow, or reloads the page; the selected style is not persisted to backend data or browser storage
      - changing table style changes only the current browser presentation and remains available when the workflow is otherwise read-only; it does not require mutation permission or workflow edit-lock ownership

    roleBehavior:
      owner:
        workflowOutcomeTableStyleTrigger: available
      editor:
        workflowOutcomeTableStyleTrigger: available
      commenter:
        workflowOutcomeTableStyleTrigger: available
      viewer:
        workflowOutcomeTableStyleTrigger: available
      user:
        workflowOutcomeTableStyleTrigger: available

    acceptanceCriteria:
      - given actor first enters Outcome Table in a newly opened workflow, 'Normal' is active and workflowOutcomeTableNormalLayout is visible
      - given actor selects 'Competency matrix', workflowOutcomeTableCompetencyMatrixLayout replaces the Normal layout without changing '/workflow/{id}/outcome-table'; selecting 'Normal' restores workflowOutcomeTableNormalLayout on the same route
      - given either a course or program workflow, both 'Normal' and 'Competency matrix' style options are available
      - given actor selects a table style and moves to another sub-view and back within the mounted workflow, the selected style is restored
      - given actor reopens the workflow, opens another workflow, or reloads the page, selected style resets to 'Normal'
      - given the workflow is read-only or actor does not hold the edit lock, both table styles remain selectable and changing style does not persist workflow data

    openQuestions: []

