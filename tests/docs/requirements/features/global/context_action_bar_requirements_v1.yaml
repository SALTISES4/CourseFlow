# Normalized requirements: context action bar (project and workflow routes)
# Source: tests/docs/__ARCHIVE/functional-requirements.md (Contributors; Archiving a Project; Archiving a Workflow; View Settings / action bar)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference:
#   - tests/docs/requirements/features/project/project_edit_form_requirements_v1.yaml (editPencilButton, editProjectDialog on project routes—FR-PROJ-FORM-003)
#   - tests/docs/requirements/features/workflow/workflow_edit_form_requirements_v1.yaml (editPencilButton, editWorkflowDialog on workflow routes—FR-WF-FORM-001)
#   - tests/docs/requirements/features/project/project_overview_requirements_v1.yaml (projectMetadataAddContributorsButton; addContributorsDialog—FR-PROJ-OV-004; contributor list outcomes—FR-PROJ-OV-002; project tags catalog—FR-PROJ-OV-005)
#   - tests/docs/requirements/features/project/project_archive_requirements_v1.yaml (FR-PROJ-ARCH-* after 'Archive project' overflow row)
#   - tests/docs/requirements/features/workflow/workflow_archive_requirements_v1.yaml (FR-WF-ARCH-* after 'Archive [workflow type]' overflow row)
#   - tests/docs/requirements/features/workflow/workflow_copy_requirements_v1.yaml (FR-WF-COPY-* after 'Copy [workflow type]' overflow row)
#   - tests/docs/requirements/features/global/workspace_access_requirements_v1.yaml (denied access when documentPreconditions fail — FR-WS-ACCESS-001, FR-WS-ACCESS-002)
#   - tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (workflowView, workflowSectionContainer, workflowSectionNumberLabel, workflowSectionTitleText, workflowEditSectionFormTitleField — FR-SEC-002 section header display; FR-SEC-012 expand/collapse; Jump to row labels FR-CAB-007)
#   - tests/docs/requirements/features/workflow/workflow_node_visual_requirements_v1.yaml (workflowNode — tag filter targets on Workflow sub-view)
#   - tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml (workflowOutcomeView, workflowOutcome — expand/collapse outcome targets)
#   - tests/docs/requirements/features/workflow/workflow_delete_section_requirements_v1.yaml (sole-section delete guard — FR-SEC-006; workflow always retains ≥1 workflowSectionContainer)
#   - tests/docs/requirements/features/workflow/workflow_outcome_table_requirements_v1.yaml (Outcome Table layouts, presentation state, and read-only controls — FR-WF-OT-001 onward)
#   - tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml (workflowOutcomeTableTab — FR-WF-HEADER-003)

documentPreconditions:
  - user is authenticated to CourseFlow
  - on any route matching '/project/{id}/*', actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on that project, or (b) user (published-access, no explicit contributor role) viewing a project that is published
  - routes matching '/project/{id}/*' include '/project/{id}' (empty suffix) and '/project/{id}/<sub-view>' for any sub-view
  - on any route matching '/workflow/{id}/*', actor is one of (a) owner, editor, commenter, or viewer with an explicit contributor role on the parent project of the workflow, or (b) user (published-access, no explicit contributor role) viewing a workflow whose parent project is published
  - routes matching '/workflow/{id}/*' include '/workflow/{id}' (empty suffix) and '/workflow/{id}/<sub-view>' for any sub-view
  - requirements in this file assume the above hold; when they do not, assert per tests/docs/requirements/features/global/workspace_access_requirements_v1.yaml FR-WS-ACCESS-001 (project routes) or FR-WS-ACCESS-002 (workflow routes)

uiObjectDefinitions:
  contextActionBar:
    meaning: Contextual action bar below top navigation on project and workflow routes.
  editPencilButton:
    meaning: Pencil edit control on contextActionBar for project and workflow routes.
  contextActionBarAddContributorsButton:
    meaning: Icon-only add-contributors control on contextActionBar for project routes (no user-visible label).
  contextActionBarOverflowTrigger:
    meaning: Overflow menu trigger on contextActionBar.
  contextActionBarOverflowMenu:
    meaning: Menu surface opened from contextActionBarOverflowTrigger
  contextActionBarOverflowItemArchiveProject:
    meaning: Archive project row in contextActionBarOverflowMenu.
  contextActionBarOverflowItemArchiveWorkflow:
    meaning: Archive row in contextActionBarOverflowMenu; label matches the 'Archive [workflow type]' template per FR-CAB-005.
  contextActionBarOverflowItemCopyWorkflow:
    meaning: Copy row in contextActionBarOverflowMenu; label matches the 'Copy [workflow type]' template per FR-CAB-005.
  workflowViewSettingsTrigger:
    meaning: View settings control on contextActionBar for workflow routes.
  workflowViewSettingsMenu:
    meaning: Menu opened from workflowViewSettingsTrigger
  workflowViewSettingsMenuItemExpandAllSections:
    meaning: Menu row labeled 'Expand all sections' in workflowViewSettingsMenu.
  workflowViewSettingsMenuItemCollapseAllSections:
    meaning: Menu row labeled 'Collapse all sections' in workflowViewSettingsMenu.
  workflowViewSettingsMenuItemExpandAllOutcomes:
    meaning: Menu row labeled 'Expand all outcomes' in workflowViewSettingsMenu.
  workflowViewSettingsMenuItemCollapseAllOutcomes:
    meaning: Menu row labeled 'Collapse all outcomes' in workflowViewSettingsMenu.
  workflowViewSettingsMenuTagsSection:
    meaning: Tags area in workflowViewSettingsMenu listing project tags with on/off toggles.
  workflowJumpToTrigger:
    meaning: Jump to control on contextActionBar on the Workflow sub-view.
  workflowJumpToMenu:
    meaning: Dropdown menu listing workflowSectionContainer entries from workflowJumpToTrigger.
  workflowJumpToMenuSectionItem:
    meaning: A selectable row inside workflowJumpToMenu for one workflowSectionContainer; visible label follows FR-CAB-007 ('{index} - {title or untitled fallback}').
  workflowJumpToUntitledSectionDisplayFallback:
    meaning: Display-only label fragment 'Untitled section' in en-CA when workflowEditSectionFormTitleField is empty; active-locale localized equivalent in other locales; not persisted as the section title.
  workflowSectionNumberLabel:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (FR-SEC-002).
  workflowSectionTitleText:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (FR-SEC-002).
  workflowEditSectionFormTitleField:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml (FR-SEC-003).
  workflowSectionContainer:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml.
  workflowOutcomeTableView:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_outcome_table_requirements_v1.yaml.
  workflowOutcomeTableNormalLayout:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_outcome_table_requirements_v1.yaml.
  workflowOutcomeTableCompetencyMatrixLayout:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_outcome_table_requirements_v1.yaml.
  workflowOutcomeTableStyleTrigger:
    meaning: Table-style dropdown on contextActionBar when active sub-view is 'Outcome table'; shows the active style label ('Normal' or 'Competency matrix').
  workflowOutcomeTableStyleMenu:
    meaning: Menu opened from workflowOutcomeTableStyleTrigger listing table style rows per FR-CAB-010.
  workflowOutcomeTableStyleMenuItemNormal:
    meaning: Table style menu row labeled 'Normal' in workflowOutcomeTableStyleMenu.
  workflowOutcomeTableStyleMenuItemCompetencyMatrix:
    meaning: Table style menu row labeled 'Competency matrix' in workflowOutcomeTableStyleMenu.
  workflowOutcomeTableViewSettingsMenuItemExpandOutcomes:
    meaning: Menu row labeled 'Expand outcomes' in workflowViewSettingsMenu when active sub-view is 'Outcome table'.
  workflowOutcomeTableViewSettingsMenuItemCollapseOutcomes:
    meaning: Menu row labeled 'Collapse outcomes' in workflowViewSettingsMenu when active sub-view is 'Outcome table'.
  workflowOutcomeTableViewSettingsMenuTagsSection:
    meaning: "'TAGS' area in workflowViewSettingsMenu on 'Outcome table' sub-view listing tags assigned to workflowOutcomes in the current workflow; node-only tags are excluded."
  workflowOutcomeTableSortTrigger:
    meaning: "'Sort' dropdown on contextActionBar when active sub-view is 'Outcome table'; separate from workflowViewSettingsTrigger and workflowOutcomeTableStyleTrigger."
  workflowOutcomeTableSortMenu:
    meaning: Menu opened from workflowOutcomeTableSortTrigger listing sort mode rows per FR-CAB-009.
  workflowOutcomeTableSortMenuItemChronological:
    meaning: Sort menu row labeled 'Chronological' in workflowOutcomeTableSortMenu.
  workflowOutcomeTableSortMenuItemNodeCategory:
    meaning: Sort menu row labeled 'Node category' in workflowOutcomeTableSortMenu.
  workflowOutcomeTableSortMenuItemContext:
    meaning: Course-only sort menu row labeled 'Context' in workflowOutcomeTableSortMenu.
  workflowView:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_add_tab_requirements_v1.yaml.
  workflowEditNodeFormCourseContextSelect:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml.
  projectTagItem:
    meaning: Canonical definition in tests/docs/requirements/features/project/project_overview_requirements_v1.yaml.
  workflowOutcome:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_outcome_requirements_v1.yaml.
  workflowNode:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_node_requirements_v1.yaml.
  workflowChannel:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_channel_requirements_v1.yaml.
  workflowSectionRow:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_edit_section_requirements_v1.yaml.
  workflowOutcomeTableColumnHeader:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_outcome_table_requirements_v1.yaml.
  workflowOutcomeTableSectionGroupBand:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_outcome_table_requirements_v1.yaml.
  workflowOutcomeTableNodeRowLabel:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_outcome_table_requirements_v1.yaml.

