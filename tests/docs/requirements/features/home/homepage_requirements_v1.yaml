# Normalized requirements: homepage dashboard
# Source: tests/docs/__ARCHIVE/functional-requirements.md (templates can be viewed from dashboard; library/template context)
# Application code evidence: react/src/components/pages/Home/*
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: home route in tests/docs/requirements/features/navigation/main_navigation_requirements_v1.yaml (FR-NAV-002); workflow create dialog in tests/docs/requirements/features/workflow/workflow_create_stepped_form_requirements_v1.yaml (FR-HOME-002 entry points); tests/docs/requirements/features/library/library_page_requirements_v1.yaml (FR-LIB-001 base scope for homeRecentProjectsSection; FR-LIB-003 default non-archived listing for homeRecentProjectsSection; 'My library' route for homeViewAllProjectsLink); tests/docs/requirements/features/library/explore_page_requirements_v1.yaml (FR-EXP-005 templatesToggle for homeViewAllTemplatesLink); shared card content in tests/docs/requirements/features/shared/card_content_requirements_v1.yaml (projectCard and workflowCard — FR-CARD-001 through FR-CARD-006 as applicable)

documentPreconditions:
  - user is authenticated to CourseFlow

uiObjectDefinitions:
  homePage:
    meaning: Full-page dashboard experience at route pattern /home.
  homeLoadingIndicator:
    meaning: Loading indicator on homePage during home context load.
  homeErrorState:
    meaning: Error-state view on homePage for a failed home context load.
  homeWelcomePanel:
    meaning: Onboarding panel near top of homePage with program, course, and activity create-workflow entry points.
  homeWelcomeDismissButton:
    meaning: Close control in homeWelcomePanel for dismissing the welcome panel.
  homeWelcomeProgramButton:
    meaning: Homepage CTA button to start a program workflow.
  homeWelcomeCourseButton:
    meaning: Homepage CTA button to start a course workflow.
  homeWelcomeActivityButton:
    meaning: Homepage CTA button to start an activity workflow.
  homeRecentProjectsSection:
    meaning: Section on homePage for recent non-archived projectCard instances within libraryPage base query scope per FR-LIB-001 and default archiveToggle-inactive listing per FR-LIB-003.
  homeRecentProjectsTitle:
    meaning: Header title text for homeRecentProjectsSection.
  homeViewAllProjectsLink:
    meaning: Link in homeRecentProjectsSection header with label 'View all projects'.
  projectCard:
    meaning: Canonical definition in tests/docs/requirements/features/shared/card_content_requirements_v1.yaml.
  homeTemplatesSection:
    meaning: Section on homePage for homepage template workflowCard instances.
  homeTemplatesSectionTitle:
    meaning: Header title text for homeTemplatesSection.
  homeViewAllTemplatesLink:
    meaning: Link in homeTemplatesSection header with label 'View all templates'.
  homeTemplatesInfoAlert:
    meaning: Informational alert in homeTemplatesSection about template workflows.
  homeTemplatesInfoAlertCloseButton:
    meaning: Close (X) control on homeTemplatesInfoAlert
  workflowCard:
    meaning: Canonical definition in tests/docs/requirements/features/shared/card_content_requirements_v1.yaml.
  createWorkflowDialog:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_create_stepped_form_requirements_v1.yaml.

locatorMappings:
  homePage: "canonical_locators.yaml -> homePage"
  homeLoadingIndicator: "canonical_locators.yaml -> homeLoadingIndicator"
  homeErrorState: "canonical_locators.yaml -> homeErrorState"
  homeWelcomePanel: "canonical_locators.yaml -> homeWelcomePanel"
  homeWelcomeDismissButton: "canonical_locators.yaml -> homeWelcomeDismissButton"
  homeWelcomeProgramButton: "canonical_locators.yaml -> homeWelcomeProgramButton"
  homeWelcomeCourseButton: "canonical_locators.yaml -> homeWelcomeCourseButton"
  homeWelcomeActivityButton: "canonical_locators.yaml -> homeWelcomeActivityButton"
  homeRecentProjectsSection: "canonical_locators.yaml -> homeRecentProjectsSection"
  homeRecentProjectsTitle: "canonical_locators.yaml -> homeRecentProjectsTitle"
  homeViewAllProjectsLink: "canonical_locators.yaml -> homeViewAllProjectsLink"
  projectCard: "canonical_locators.yaml -> projectCard"
  homeTemplatesSection: "canonical_locators.yaml -> homeTemplatesSection"
  homeTemplatesSectionTitle: "canonical_locators.yaml -> homeTemplatesSectionTitle"
  homeViewAllTemplatesLink: "canonical_locators.yaml -> homeViewAllTemplatesLink"
  homeTemplatesInfoAlert: "canonical_locators.yaml -> homeTemplatesInfoAlert"
  homeTemplatesInfoAlertCloseButton: "canonical_locators.yaml -> homeTemplatesInfoAlertCloseButton"
  workflowCard: "canonical_locators.yaml -> workflowCard"
  createWorkflowDialog: "canonical_locators.yaml -> createWorkflowDialog"

requirements:
  - id: FR-HOME-001
    title: Route, loading, and error state on 'Home'

    designEvidence:
      - FIGMA-HOME-DASHBOARD

    actors:
      - user

    uiObjects:
      - homePage
      - homeLoadingIndicator
      - homeErrorState

    preconditions:
      - current route matches /home

    trigger:
      - user navigates to /home

    mainFlow:
      - while home context query is loading, system shows homeLoadingIndicator
      - when home context query succeeds, system renders homePage content in vertical order: homeWelcomePanel per FR-HOME-002 when visible, then homeRecentProjectsSection per FR-HOME-003 when visible, then homeTemplatesSection per FR-HOME-004
      - when home context query fails, system shows homeErrorState on homePage and does not render homeRecentProjectsSection or homeTemplatesSection content from the failed response

    roleBehavior: {}

    acceptanceCriteria:
      - given home context query is loading, homeLoadingIndicator is visible
      - given home context query succeeds, homePage content is rendered in vertical order homeWelcomePanel (when visible), homeRecentProjectsSection (when visible), homeTemplatesSection per FR-HOME-002 through FR-HOME-004
      - given home context query fails, homeErrorState is visible

    openQuestions: []

  - id: FR-HOME-002
    title: Welcome panel on 'Home'

    designEvidence:
      - FIGMA-HOME-DASHBOARD

    actors:
      - user

    uiObjects:
      - homePage
      - homeWelcomePanel
      - homeWelcomeDismissButton
      - homeWelcomeProgramButton
      - homeWelcomeCourseButton
      - homeWelcomeActivityButton
      - createWorkflowDialog

    preconditions:
      - homePage is rendered

    trigger:
      - user views homePage or clicks a button in homeWelcomePanel

    mainFlow:
      - homeWelcomePanel is visible when welcome-dismiss cookie is not set, independent of whether homeRecentProjectsSection or any projectCard instances are shown on homePage
      - homeWelcomePanel shows heading 'Welcome to CourseFlow'
      - homeWelcomePanel shows copy 'Tell us a bit more about your goals so that we can help you get started.'
      - homeWelcomePanel shows three CTAs in document order: homeWelcomeActivityButton, then homeWelcomeCourseButton, then homeWelcomeProgramButton
      - when user clicks homeWelcomeActivityButton, system opens createWorkflowDialog with workflowType activity per workflow_create_stepped_form_requirements_v1.yaml and createWorkflowDialogTitle 'Select project' on step 1
      - when user clicks homeWelcomeCourseButton, system opens createWorkflowDialog with workflowType course per workflow_create_stepped_form_requirements_v1.yaml and createWorkflowDialogTitle 'Select project' on step 1
      - when user clicks homeWelcomeProgramButton, system opens createWorkflowDialog with workflowType program per workflow_create_stepped_form_requirements_v1.yaml and createWorkflowDialogTitle 'Select project' on step 1
      - when user clicks homeWelcomeDismissButton, system hides homeWelcomePanel and stores welcome-dismiss preference cookie

    roleBehavior: {}

    acceptanceCriteria:
      - given welcome-dismiss cookie is not set, homeWelcomePanel is visible with heading 'Welcome to CourseFlow'
      - given homeWelcomePanel is visible, homeWelcomeActivityButton, homeWelcomeCourseButton, and homeWelcomeProgramButton are visible in document order activity, then course, then program
      - given user clicks homeWelcomeDismissButton, homeWelcomePanel is hidden and welcome-dismiss preference is stored
      - given welcome-dismiss cookie is set, homeWelcomePanel is not visible
      - given user clicks homeWelcomeActivityButton, createWorkflowDialog opens with createWorkflowDialogTitle 'Select project' on step 1 and workflowType activity per workflow_create_stepped_form_requirements_v1.yaml
      - given user clicks homeWelcomeCourseButton, createWorkflowDialog opens with createWorkflowDialogTitle 'Select project' on step 1 and workflowType course per workflow_create_stepped_form_requirements_v1.yaml
      - given user clicks homeWelcomeProgramButton, createWorkflowDialog opens with createWorkflowDialogTitle 'Select project' on step 1 and workflowType program per workflow_create_stepped_form_requirements_v1.yaml

    openQuestions: []

  - id: FR-HOME-003
    title: Recent projects section on 'Home'

    designEvidence:
      - FIGMA-HOME-DASHBOARD

    actors:
      - user

    uiObjects:
      - homePage
      - homeRecentProjectsSection
      - homeRecentProjectsTitle
      - homeViewAllProjectsLink
      - projectCard

    preconditions:
      - homePage is rendered

    trigger:
      - home context query succeeds per FR-HOME-001

    mainFlow:
      - homeRecentProjectsSection includes only non-archived projectCard instances within libraryPage base query scope per FR-LIB-001 (default listing with archiveToggle inactive per FR-LIB-003)
      - when home context includes at least one recent non-archived project in that scope for homePage, system renders homeRecentProjectsSection
      - homeRecentProjectsSection title is 'Recent projects'
      - homeRecentProjectsSection includes homeViewAllProjectsLink with label 'View all projects' and route /library
      - projectCard instances in homeRecentProjectsSection are ordered by most recently modified first (most recent to least recent)
      - homeRecentProjectsSection displays at most 4 projectCard instances
      - projectCard presentation and card interactions in homeRecentProjectsSection conform to card_content_requirements_v1.yaml
      - when home context includes no recent non-archived projects in libraryPage base query scope per FR-LIB-001 for homePage, system does not render homeRecentProjectsSection

    roleBehavior: {}

    acceptanceCriteria:
      - given home context includes at least one recent non-archived project in libraryPage base query scope per FR-LIB-001 for homePage, homeRecentProjectsSection is visible with title 'Recent projects'
      - given homeRecentProjectsSection is visible, every projectCard instance represents a non-archived project within libraryPage base query scope per FR-LIB-001
      - given an archived project within libraryPage base query scope per FR-LIB-001, that project does not appear in homeRecentProjectsSection
      - given homeRecentProjectsSection is visible, homeViewAllProjectsLink is visible and routes to /library
      - given home context includes more than four recent non-archived projects in libraryPage base query scope per FR-LIB-001 for homePage, homeRecentProjectsSection shows at most 4 projectCard instances
      - given home context includes more than one recent non-archived project in libraryPage base query scope per FR-LIB-001 for homePage, projectCard order matches most recently modified first
      - given homeRecentProjectsSection is visible, projectCard instances in homeRecentProjectsSection conform to card_content_requirements_v1.yaml
      - given home context includes no recent non-archived projects in libraryPage base query scope per FR-LIB-001 for homePage, homeRecentProjectsSection is not visible

    openQuestions: []

  - id: FR-HOME-004
    title: Templates section on 'Home'

    designEvidence:
      - FIGMA-HOME-DASHBOARD

    actors:
      - user

    uiObjects:
      - homePage
      - homeTemplatesSection
      - homeTemplatesSectionTitle
      - homeViewAllTemplatesLink
      - homeTemplatesInfoAlert
      - homeTemplatesInfoAlertCloseButton
      - workflowCard

    preconditions:
      - homePage is rendered
      - home context includes at least one hardcoded homepage template for homeTemplatesSection (at most four shown)

    trigger:
      - home context query succeeds per FR-HOME-001

    mainFlow:
      - homepage templates in homeTemplatesSection are a fixed hardcoded product-curated set for now
      - homeTemplatesSection is rendered on homePage
      - homeTemplatesSectionTitle is 'Explore templates' when homeRecentProjectsSection is visible (at least one projectCard on homePage)
      - homeTemplatesSectionTitle is 'Get started with templates' when homeRecentProjectsSection is not visible
      - homeTemplatesSection includes homeViewAllTemplatesLink with label 'View all templates' that navigates to 'Explore' with templatesToggle active per explore_page_requirements_v1.yaml FR-EXP-005
      - homeTemplatesInfoAlert is shown with title 'How to use templates' and explanatory subtitle copy
      - when dismissal cookie for homeTemplatesInfoAlert is not set, homeTemplatesInfoAlert is visible
      - when user clicks homeTemplatesInfoAlertCloseButton, system sets dismissal cookie and hides homeTemplatesInfoAlert
      - when dismissal cookie is set, homeTemplatesInfoAlert is not shown on subsequent visits to homePage
      - homeTemplatesSection renders workflowCard instances for hardcoded homepage templates from home context, with at most four workflowCard instances visible
      - workflowCard presentation and card interactions in homeTemplatesSection conform to card_content_requirements_v1.yaml

    roleBehavior: {}

    acceptanceCriteria:
      - given homeRecentProjectsSection is visible, homeTemplatesSectionTitle matches 'Explore templates'
      - given homeRecentProjectsSection is not visible, homeTemplatesSectionTitle matches 'Get started with templates'
      - homeViewAllTemplatesLink is visible with label 'View all templates'
      - given user clicks homeViewAllTemplatesLink, application navigates to 'Explore' with templatesToggle active per FR-EXP-005
      - given dismissal cookie for homeTemplatesInfoAlert is not set, homeTemplatesInfoAlert is present with title 'How to use templates'
      - given user clicks homeTemplatesInfoAlertCloseButton, homeTemplatesInfoAlert is hidden and dismissal cookie is set
      - given dismissal cookie is set, homeTemplatesInfoAlert is not visible
      - given home context includes more than four hardcoded homepage templates, homeTemplatesSection shows at most 4 workflowCard instances
      - given home context includes between one and four hardcoded homepage templates, workflowCard instance count in homeTemplatesSection matches that count
      - workflowCard instances in homeTemplatesSection conform to card_content_requirements_v1.yaml

    openQuestions: []

