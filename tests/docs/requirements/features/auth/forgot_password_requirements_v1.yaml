      - given password-reset request fails, current route matches '/password-reset'
      - given password-reset request fails, forgotPasswordForm is visible and forgotPasswordSuccessMessage is not visible
      - given password-reset request fails, globalMessageSnackbar shows 'We encountered an issue and your password reset request could not be sent'
      - given globalMessageSnackbar shows after password-reset request failure, globalMessageSnackbar is not visible after a short period without user interaction
      - given password-reset request fails, forgotPasswordEmailField retains its pre-submit value
      - given password-reset request fails, forgotPasswordSubmitButton is enabled and clickable

