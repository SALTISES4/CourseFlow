# Normalized requirements: forgot password (logged out)
# Source: Figma design evidence (FIGMA-FORGOT-PASSWORD-REQUEST, FIGMA-FORGOT-PASSWORD-SUCCESS, FIGMA-FORGOT-PASSWORD-SET-PASSWORD, FIGMA-FORGOT-PASSWORD-INVALID-LINK)
# Scope: logged-out password reset at '/password-reset' (email request per FR-FPWD-001 through FR-FPWD-004; reset-request email per FR-FPWD-011; reset-request submit failure per FR-FPWD-012); set-new-password page reached from a valid email reset link (FR-FPWD-005 through FR-FPWD-008); invalid or expired link handling per FR-FPWD-009; set-password submit failure per FR-FPWD-010; authenticated-user redirect per FR-FPWD-013; not authenticated change-password at '/user/password-reset' (see tests/docs/requirements/features/auth/password_reset_requirements_v1.yaml)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/features/auth/login_requirements_v1.yaml (entry via loginForgotPasswordLink labeled 'Forgot your password?' per FR-LOGIN-001); tests/docs/requirements/features/auth/register_requirements_v1.yaml (forgotPasswordEmailField value is account email and username per FR-REG-001; forgotPasswordSetPasswordGuidelines copy per FR-REG-001); tests/docs/requirements/features/auth/password_reset_requirements_v1.yaml (authenticated change-password at '/user/password-reset' is a separate flow; forgotPasswordSetPasswordConfirmationEmail subject and body match passwordResetConfirmationEmail per FR-PWD-005); tests/docs/requirements/features/home/homepage_requirements_v1.yaml (post-reset destination homePage dashboard at '/home' per FR-FPWD-008); tests/docs/requirements/features/shared/card_content_requirements_v1.yaml (globalMessageSnackbar — FR-CARD-005)

documentPreconditions:
  - user is not authenticated to CourseFlow for FR-FPWD-001 through FR-FPWD-012
  - routes '/register/', '/login/', '/password-reset', and '/password-reset/confirm' are publicly accessible without authentication

uiObjectDefinitions:
  forgotPasswordPage:
    meaning: Public full-page forgot-password experience at route '/password-reset' accessible without authentication.
  forgotPasswordTitle:
    meaning: Page title on forgotPasswordPage labeled 'Reset your CourseFlow password'.
  forgotPasswordForm:
    meaning: Form container on forgotPasswordPage for submitting a password-reset request.
  forgotPasswordEmailField:
    meaning: Required text input labeled 'Email' on forgotPasswordForm for the account email address; this value is the account username per FR-REG-001.
  forgotPasswordSubmitButton:
    meaning: Primary submit button on forgotPasswordForm labeled 'Reset password'.
  forgotPasswordFieldValidationMessage:
    meaning: Inline field-level error text on forgotPasswordForm field controls; validation rules per FR-FPWD-003.
  forgotPasswordSuccessMessage:
    meaning: Confirmation copy on forgotPasswordPage after successful reset-request submission per FR-FPWD-004.
  forgotPasswordResetRequestEmail:
    meaning: Transactional email sent to forgotPasswordEmailField address when it matches an active account after successful reset-request submission per FR-FPWD-011.
  forgotPasswordResetRequestEmailResetButton:
    meaning: Primary call-to-action in forgotPasswordResetRequestEmail labeled 'Reset password' per FR-FPWD-011.
  forgotPasswordSetPasswordPage:
    meaning: Public full-page set-new-password experience at route '/password-reset/confirm' per FR-FPWD-005.
  forgotPasswordSetPasswordTitle:
    meaning: Page title on forgotPasswordSetPasswordPage; copy per FR-FPWD-001.
  forgotPasswordSetPasswordForm:
    meaning: Form container on forgotPasswordSetPasswordPage for entering and confirming the new password.
  forgotPasswordNewPasswordField:
    meaning: Required secret input labeled 'New password' on forgotPasswordSetPasswordForm for the new account password.
  forgotPasswordConfirmPasswordField:
    meaning: Required secret input labeled 'Confirm new password' on forgotPasswordSetPasswordForm to confirm forgotPasswordNewPasswordField.
  forgotPasswordSetPasswordGuidelines:
    meaning: Informational helper text on forgotPasswordSetPasswordForm for forgotPasswordNewPasswordField; copy per FR-REG-001.
  forgotPasswordSetPasswordSubmitButton:
    meaning: Primary submit button on forgotPasswordSetPasswordForm labeled 'Reset password'.
  forgotPasswordSetPasswordFieldValidationMessage:
    meaning: Inline field-level error text on forgotPasswordSetPasswordForm field controls; validation rules per FR-FPWD-007.
  forgotPasswordSetPasswordConfirmationEmail:
    meaning: Email sent to the reset account email address after successful password update from forgotPasswordSetPasswordForm per FR-FPWD-008; subject and body copy per FR-PWD-005.
  forgotPasswordInvalidLinkPage:
    meaning: Public full-page warning at route '/password-reset/confirm' per FR-FPWD-009.
  forgotPasswordInvalidLinkTitle:
    meaning: Warning title on forgotPasswordInvalidLinkPage per FR-FPWD-009.
  forgotPasswordInvalidLinkSubtitle:
    meaning: Informational subtitle on forgotPasswordInvalidLinkPage per FR-FPWD-009.
  forgotPasswordInvalidLinkRequestButton:
    meaning: Primary button on forgotPasswordInvalidLinkPage labeled 'Request a new link' per FR-FPWD-009.
  globalMessageSnackbar:
    meaning: Canonical definition per FR-CARD-005.
  homePage:
    meaning: Canonical definition per FR-HOME-001.

locatorMappings:
  forgotPasswordPage: "canonical_locators.yaml -> forgotPasswordPage"
  forgotPasswordTitle: "canonical_locators.yaml -> forgotPasswordTitle"
  forgotPasswordForm: "canonical_locators.yaml -> forgotPasswordForm"
  forgotPasswordEmailField: "canonical_locators.yaml -> forgotPasswordEmailField"
  forgotPasswordSubmitButton: "canonical_locators.yaml -> forgotPasswordSubmitButton"
  forgotPasswordFieldValidationMessage: "canonical_locators.yaml -> forgotPasswordFieldValidationMessage"
  forgotPasswordSuccessMessage: "canonical_locators.yaml -> forgotPasswordSuccessMessage"
  forgotPasswordResetRequestEmail: "canonical_locators.yaml -> forgotPasswordResetRequestEmail"
  forgotPasswordResetRequestEmailResetButton: "canonical_locators.yaml -> forgotPasswordResetRequestEmailResetButton"
  forgotPasswordSetPasswordPage: "canonical_locators.yaml -> forgotPasswordSetPasswordPage"
  forgotPasswordSetPasswordTitle: "canonical_locators.yaml -> forgotPasswordSetPasswordTitle"
  forgotPasswordSetPasswordForm: "canonical_locators.yaml -> forgotPasswordSetPasswordForm"
  forgotPasswordNewPasswordField: "canonical_locators.yaml -> forgotPasswordNewPasswordField"
  forgotPasswordConfirmPasswordField: "canonical_locators.yaml -> forgotPasswordConfirmPasswordField"
  forgotPasswordSetPasswordGuidelines: "canonical_locators.yaml -> forgotPasswordSetPasswordGuidelines"
  forgotPasswordSetPasswordSubmitButton: "canonical_locators.yaml -> forgotPasswordSetPasswordSubmitButton"
  forgotPasswordSetPasswordFieldValidationMessage: "canonical_locators.yaml -> forgotPasswordSetPasswordFieldValidationMessage"
  forgotPasswordSetPasswordConfirmationEmail: "canonical_locators.yaml -> forgotPasswordSetPasswordConfirmationEmail"
  forgotPasswordInvalidLinkPage: "canonical_locators.yaml -> forgotPasswordInvalidLinkPage"
  forgotPasswordInvalidLinkTitle: "canonical_locators.yaml -> forgotPasswordInvalidLinkTitle"
  forgotPasswordInvalidLinkSubtitle: "canonical_locators.yaml -> forgotPasswordInvalidLinkSubtitle"
  forgotPasswordInvalidLinkRequestButton: "canonical_locators.yaml -> forgotPasswordInvalidLinkRequestButton"
  globalMessageSnackbar: "canonical_locators.yaml -> globalMessageSnackbar"

requirements:
  - id: FR-FPWD-001
    title: Forgot password route and primary form elements

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-REQUEST

    actors:
      - user

    uiObjects:
      - forgotPasswordPage
      - forgotPasswordTitle
      - forgotPasswordForm
      - forgotPasswordEmailField
      - forgotPasswordSubmitButton

    preconditions:
      - documentPreconditions for this file hold

    trigger:
      - user navigates to '/password-reset'

    mainFlow:
      - given user is not authenticated, user can navigate to '/password-reset' without being redirected
      - given current route matches '/password-reset', forgotPasswordPage is visible
      - forgotPasswordTitle is visible on forgotPasswordPage with text 'Reset your CourseFlow password'
      - forgotPasswordPage does not show subtitle or introductory copy below forgotPasswordTitle
      - forgotPasswordForm is visible on forgotPasswordPage
      - forgotPasswordForm shows forgotPasswordEmailField and forgotPasswordSubmitButton in that order
      - forgotPasswordPage does not include a separate username field; forgotPasswordEmailField is the account username
      - forgotPasswordEmailField is required
      - forgotPasswordSubmitButton is visible on forgotPasswordForm with label 'Reset password'
      - forgotPasswordPage does not show a login link to '/login/'

    roleBehavior: {}

    acceptanceCriteria:
      - given user is not authenticated, current route matches '/password-reset' and forgotPasswordPage is visible
      - forgotPasswordTitle is visible with text 'Reset your CourseFlow password'
      - forgotPasswordPage does not show subtitle or introductory copy below forgotPasswordTitle
      - forgotPasswordForm is visible
      - forgotPasswordEmailField is visible with label 'Email', is editable, and is required
      - forgotPasswordPage does not show a separate username field
      - forgotPasswordSubmitButton is visible with label 'Reset password'
      - forgotPasswordPage does not show a login link to '/login/'

    openQuestions: []

  - id: FR-FPWD-002
    title: Forgot password form initial state

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-REQUEST

    actors:
      - user

    uiObjects:
      - forgotPasswordPage
      - forgotPasswordForm
      - forgotPasswordEmailField
      - forgotPasswordFieldValidationMessage
      - forgotPasswordSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - current route matches '/password-reset'

    trigger: []

    mainFlow:
      - forgotPasswordEmailField starts empty
      - forgotPasswordSubmitButton is disabled and not clickable
      - forgotPasswordFieldValidationMessage is not visible for forgotPasswordForm fields before user interaction

    roleBehavior: {}

    acceptanceCriteria:
      - forgotPasswordEmailField value is empty
      - forgotPasswordSubmitButton is disabled and not clickable
      - given user has not interacted with forgotPasswordForm, forgotPasswordFieldValidationMessage is not visible for forgotPasswordEmailField

    openQuestions: []

  - id: FR-FPWD-003
    title: Forgot password field validation rules

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-REQUEST

    actors:
      - user

    uiObjects:
      - forgotPasswordForm
      - forgotPasswordEmailField
      - forgotPasswordFieldValidationMessage
      - forgotPasswordSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - forgotPasswordForm is visible

    trigger:
      - user changes forgotPasswordForm field content

    mainFlow:
      - forgotPasswordEmailField requires a non-empty valid email address
      - given forgotPasswordEmailField value is non-empty but not a valid email address after interaction, forgotPasswordFieldValidationMessage is visible with text 'Invalid email format' for forgotPasswordEmailField and forgotPasswordSubmitButton is disabled and not clickable
      - validation for forgotPasswordForm fields starts after user interaction with the relevant field and runs before user clicks forgotPasswordSubmitButton
      - forgotPasswordSubmitButton is disabled and not clickable until forgotPasswordEmailField is valid per this requirement
      - when forgotPasswordEmailField is valid, forgotPasswordSubmitButton becomes enabled and clickable
      - given validation fails for forgotPasswordEmailField, forgotPasswordFieldValidationMessage is visible on the invalid field, forgotPasswordSubmitButton is disabled and not clickable, and forgotPasswordForm is not submitted while invalid values remain
      - given forgotPasswordFieldValidationMessage is visible for forgotPasswordEmailField and user then enters a valid email address, forgotPasswordFieldValidationMessage is not visible for forgotPasswordEmailField

    roleBehavior: {}

    acceptanceCriteria:
      - given user clears forgotPasswordEmailField after interaction, forgotPasswordFieldValidationMessage is visible with text 'Email is required' for forgotPasswordEmailField
      - given forgotPasswordEmailField value is non-empty but not a valid email address after interaction, forgotPasswordFieldValidationMessage is visible with text 'Invalid email format' for forgotPasswordEmailField
      - given forgotPasswordEmailField is empty or invalid, forgotPasswordSubmitButton is disabled and not clickable
      - given forgotPasswordEmailField is valid, forgotPasswordSubmitButton is enabled and clickable
      - given forgotPasswordFieldValidationMessage is visible for forgotPasswordEmailField and user then enters a valid email address, forgotPasswordFieldValidationMessage is not visible for forgotPasswordEmailField

    openQuestions: []

  - id: FR-FPWD-004
    title: Successful forgot password request submission

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-SUCCESS

    actors:
      - user

    uiObjects:
      - forgotPasswordPage
      - forgotPasswordTitle
      - forgotPasswordForm
      - forgotPasswordEmailField
      - forgotPasswordSubmitButton
      - forgotPasswordSuccessMessage

    preconditions:
      - documentPreconditions for this file hold
      - forgotPasswordForm is visible
      - forgotPasswordEmailField is valid per FR-FPWD-003

    trigger:
      - user changes forgotPasswordForm content and clicks forgotPasswordSubmitButton

    mainFlow:
      - given user clicks forgotPasswordSubmitButton with valid forgotPasswordEmailField value, password-reset request is submitted for the entered email address
      - given submission succeeds, user remains not authenticated to CourseFlow
      - given submission succeeds, forgotPasswordForm is not visible and forgotPasswordSuccessMessage is visible on forgotPasswordPage with text 'If the email address matches an active account, you will receive instructions to reset your password shortly.'
      - given submission succeeds, forgotPasswordTitle is visible with text 'Reset your CourseFlow password'
      - given submission succeeds, current route matches '/password-reset'
      - given submission succeeds and the email address matches an active account, forgotPasswordResetRequestEmail is sent per FR-FPWD-011

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks forgotPasswordSubmitButton with valid forgotPasswordEmailField value, password-reset request submission succeeds
      - given submission succeeds, user is not authenticated to CourseFlow
      - given submission succeeds, current route matches '/password-reset'
      - given submission succeeds, forgotPasswordTitle is visible with text 'Reset your CourseFlow password'
      - given submission succeeds, forgotPasswordForm is not visible
      - given submission succeeds, forgotPasswordSuccessMessage is visible with text 'If the email address matches an active account, you will receive instructions to reset your password shortly.'

    openQuestions: []

  - id: FR-FPWD-005
    title: Set new password page route and primary form elements from email link

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-SET-PASSWORD

    actors:
      - user

    uiObjects:
      - forgotPasswordSetPasswordPage
      - forgotPasswordSetPasswordTitle
      - forgotPasswordSetPasswordForm
      - forgotPasswordNewPasswordField
      - forgotPasswordConfirmPasswordField
      - forgotPasswordSetPasswordGuidelines
      - forgotPasswordSetPasswordSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - user follows a valid password-reset link per FR-FPWD-011

    trigger:
      - user opens the password-reset link from email

    mainFlow:
      - given user is not authenticated, user can open the password-reset email link without being redirected
      - given user opens a valid password-reset email link, current route matches '/password-reset/confirm'
      - forgotPasswordSetPasswordPage is visible
      - forgotPasswordSetPasswordTitle is visible on forgotPasswordSetPasswordPage with text 'Reset your CourseFlow password' per FR-FPWD-001
      - forgotPasswordSetPasswordPage does not show subtitle or introductory copy below forgotPasswordSetPasswordTitle
      - forgotPasswordSetPasswordForm is visible on forgotPasswordSetPasswordPage
      - forgotPasswordSetPasswordForm shows forgotPasswordNewPasswordField, forgotPasswordConfirmPasswordField, forgotPasswordSetPasswordGuidelines, and forgotPasswordSetPasswordSubmitButton in that order
      - all forgotPasswordSetPasswordForm input fields are required; forgotPasswordSetPasswordGuidelines is informational helper text with copy per FR-REG-001
      - forgotPasswordSetPasswordSubmitButton is visible on forgotPasswordSetPasswordForm with label 'Reset password'

    roleBehavior: {}

    acceptanceCriteria:
      - given user opens a valid password-reset email link, current route matches '/password-reset/confirm'
      - forgotPasswordSetPasswordPage is visible
      - forgotPasswordSetPasswordTitle is visible with text 'Reset your CourseFlow password' per FR-FPWD-001
      - forgotPasswordSetPasswordPage does not show subtitle or introductory copy below forgotPasswordSetPasswordTitle
      - forgotPasswordSetPasswordForm is visible
      - forgotPasswordNewPasswordField is visible with label 'New password', is editable, and is required
      - forgotPasswordConfirmPasswordField is visible with label 'Confirm new password', is editable, and is required
      - forgotPasswordSetPasswordGuidelines is visible with copy per FR-REG-001
      - forgotPasswordSetPasswordSubmitButton is visible with label 'Reset password'

    openQuestions: []

  - id: FR-FPWD-006
    title: Set new password form initial state

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-SET-PASSWORD

    actors:
      - user

    uiObjects:
      - forgotPasswordSetPasswordPage
      - forgotPasswordSetPasswordForm
      - forgotPasswordNewPasswordField
      - forgotPasswordConfirmPasswordField
      - forgotPasswordSetPasswordFieldValidationMessage
      - forgotPasswordSetPasswordSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - forgotPasswordSetPasswordPage is visible

    trigger: []

    mainFlow:
      - forgotPasswordNewPasswordField and forgotPasswordConfirmPasswordField start empty
      - forgotPasswordSetPasswordSubmitButton is disabled and not clickable
      - forgotPasswordSetPasswordFieldValidationMessage is not visible for forgotPasswordSetPasswordForm fields before user interaction

    roleBehavior: {}

    acceptanceCriteria:
      - forgotPasswordNewPasswordField value is empty
      - forgotPasswordConfirmPasswordField value is empty
      - forgotPasswordSetPasswordSubmitButton is disabled and not clickable
      - given user has not interacted with forgotPasswordSetPasswordForm, forgotPasswordSetPasswordFieldValidationMessage is not visible for forgotPasswordNewPasswordField or forgotPasswordConfirmPasswordField

    openQuestions: []

  - id: FR-FPWD-007
    title: Set new password field validation rules

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-SET-PASSWORD

    actors:
      - user

    uiObjects:
      - forgotPasswordSetPasswordForm
      - forgotPasswordNewPasswordField
      - forgotPasswordConfirmPasswordField
      - forgotPasswordSetPasswordGuidelines
      - forgotPasswordSetPasswordFieldValidationMessage
      - forgotPasswordSetPasswordSubmitButton

    preconditions:
      - documentPreconditions for this file hold
      - forgotPasswordSetPasswordForm is visible

    trigger:
      - user changes forgotPasswordSetPasswordForm field content

    mainFlow:
      - all forgotPasswordSetPasswordForm input fields are mandatory; user cannot submit forgotPasswordSetPasswordForm with any required field empty or invalid
      - forgotPasswordNewPasswordField requires a non-empty value that satisfies forgotPasswordSetPasswordGuidelines
      - given forgotPasswordNewPasswordField fails forgotPasswordSetPasswordGuidelines after interaction, forgotPasswordSetPasswordFieldValidationMessage is visible with copy per FR-REG-001 for forgotPasswordNewPasswordField and forgotPasswordSetPasswordSubmitButton is disabled and not clickable
      - forgotPasswordConfirmPasswordField requires a non-empty value that matches forgotPasswordNewPasswordField
      - forgotPasswordNewPasswordField and forgotPasswordConfirmPasswordField must match; when they do not match, forgotPasswordSetPasswordFieldValidationMessage shows text 'Passwords do not match' on forgotPasswordConfirmPasswordField
      - validation for forgotPasswordSetPasswordForm fields starts after user interaction with the relevant field and runs before user clicks forgotPasswordSetPasswordSubmitButton
      - forgotPasswordSetPasswordSubmitButton is disabled and not clickable until forgotPasswordNewPasswordField and forgotPasswordConfirmPasswordField are all valid per this requirement
      - when all forgotPasswordSetPasswordForm fields are valid, forgotPasswordSetPasswordSubmitButton becomes enabled and clickable
      - given validation fails for a forgotPasswordSetPasswordForm field, forgotPasswordSetPasswordFieldValidationMessage is visible on the invalid field, forgotPasswordSetPasswordSubmitButton is disabled and not clickable, and forgotPasswordSetPasswordForm is not submitted while invalid values remain
      - given forgotPasswordSetPasswordFieldValidationMessage is visible for a forgotPasswordSetPasswordForm field and the user corrects that field to a valid value, forgotPasswordSetPasswordFieldValidationMessage is not visible for that field
      - given forgotPasswordSetPasswordFieldValidationMessage is visible for forgotPasswordConfirmPasswordField with text 'Passwords do not match' and user then changes forgotPasswordConfirmPasswordField to match forgotPasswordNewPasswordField, forgotPasswordSetPasswordFieldValidationMessage is not visible for forgotPasswordConfirmPasswordField

    roleBehavior: {}

    acceptanceCriteria:
      - given user clears forgotPasswordNewPasswordField after interaction, forgotPasswordSetPasswordFieldValidationMessage is visible with text 'New password is required' for forgotPasswordNewPasswordField
      - given user clears forgotPasswordConfirmPasswordField after interaction, forgotPasswordSetPasswordFieldValidationMessage is visible with text 'Confirm new password is required' for forgotPasswordConfirmPasswordField
      - given forgotPasswordNewPasswordField and forgotPasswordConfirmPasswordField do not match after interaction, forgotPasswordSetPasswordFieldValidationMessage is visible with text 'Passwords do not match' for forgotPasswordConfirmPasswordField
      - given forgotPasswordNewPasswordField fails forgotPasswordSetPasswordGuidelines after interaction, forgotPasswordSetPasswordFieldValidationMessage is visible with copy per FR-REG-001 for forgotPasswordNewPasswordField
      - given any forgotPasswordSetPasswordForm field is empty or invalid, forgotPasswordSetPasswordSubmitButton is disabled and not clickable
      - given all forgotPasswordSetPasswordForm fields are valid, forgotPasswordSetPasswordSubmitButton is enabled and clickable
      - given forgotPasswordSetPasswordFieldValidationMessage is visible for forgotPasswordConfirmPasswordField with text 'Passwords do not match' and user then changes forgotPasswordConfirmPasswordField to match forgotPasswordNewPasswordField, forgotPasswordSetPasswordFieldValidationMessage is not visible for forgotPasswordConfirmPasswordField

    openQuestions: []

  - id: FR-FPWD-008
    title: Successful set new password from email link

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-SET-PASSWORD

    actors:
      - user

    uiObjects:
      - forgotPasswordSetPasswordPage
      - forgotPasswordSetPasswordForm
      - forgotPasswordNewPasswordField
      - forgotPasswordConfirmPasswordField
      - forgotPasswordSetPasswordSubmitButton
      - forgotPasswordSetPasswordConfirmationEmail
      - homePage

    preconditions:
      - documentPreconditions for this file hold
      - forgotPasswordSetPasswordForm is visible
      - forgotPasswordSetPasswordForm is valid per FR-FPWD-007
      - password-reset email link is valid and not expired

    trigger:
      - user changes forgotPasswordSetPasswordForm content and clicks forgotPasswordSetPasswordSubmitButton

    mainFlow:
      - given user clicks forgotPasswordSetPasswordSubmitButton with valid forgotPasswordSetPasswordForm values, account password is updated to forgotPasswordNewPasswordField value
      - given password update succeeds, forgotPasswordSetPasswordConfirmationEmail is sent to the reset account email address per FR-REG-001
      - given password update succeeds, forgotPasswordSetPasswordConfirmationEmail subject is exactly 'Your CourseFlow password was reset'
      - given password update succeeds, forgotPasswordSetPasswordConfirmationEmail body is exactly "Hello,\n\nThe password for your account was changed successfully.\n\nDidn't make this change? Please contact administration immediately to lock your account and verify your access.\n\nThank you,\n\nThe CourseFlow Team."
      - given password update succeeds, user is authenticated to CourseFlow
      - given password update succeeds, application navigates immediately to route '/home'
      - given password update succeeds, homePage is visible per FR-HOME-001

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks forgotPasswordSetPasswordSubmitButton with valid forgotPasswordSetPasswordForm values, password update succeeds
      - given password update succeeds, account password matches forgotPasswordNewPasswordField value
      - given password update succeeds, forgotPasswordSetPasswordConfirmationEmail is sent to the reset account email address per FR-REG-001
      - given password update succeeds, forgotPasswordSetPasswordConfirmationEmail subject is exactly 'Your CourseFlow password was reset'
      - given password update succeeds, forgotPasswordSetPasswordConfirmationEmail body is exactly "Hello,\n\nThe password for your account was changed successfully.\n\nDidn't make this change? Please contact administration immediately to lock your account and verify your access.\n\nThank you,\n\nThe CourseFlow Team."
      - given password update succeeds, user is authenticated to CourseFlow
      - given password update succeeds, application navigates immediately to route '/home' with no interim confirmation copy or snackbar on forgotPasswordSetPasswordPage
      - given password update succeeds, current route matches '/home'
      - given password update succeeds, homePage is visible per FR-HOME-001

    openQuestions: []

  - id: FR-FPWD-009
    title: Invalid or expired password-reset email link

    designEvidence:
      - FIGMA-FORGOT-PASSWORD-INVALID-LINK

    actors:
      - user

    uiObjects:
      - forgotPasswordInvalidLinkPage
      - forgotPasswordInvalidLinkTitle
      - forgotPasswordInvalidLinkSubtitle
      - forgotPasswordInvalidLinkRequestButton
      - forgotPasswordSetPasswordForm
      - forgotPasswordPage
      - forgotPasswordForm
      - forgotPasswordEmailField

    preconditions:
      - documentPreconditions for this file hold
      - user opens a password-reset email link that is invalid, expired, or already used

    trigger:
      - user opens the password-reset link from email

    mainFlow:
      - given user is not authenticated, user can open the password-reset email link without being redirected to login
      - given user opens an invalid, expired, or already-used password-reset email link, current route matches '/password-reset/confirm'
      - user remains not authenticated to CourseFlow
      - forgotPasswordInvalidLinkPage is visible
      - forgotPasswordSetPasswordForm is not visible and password update cannot be submitted
      - forgotPasswordInvalidLinkTitle is visible on forgotPasswordInvalidLinkPage with text 'Link expired or invalid'
      - forgotPasswordInvalidLinkSubtitle is visible on forgotPasswordInvalidLinkPage with text 'For your security, password reset links expire after 24 hours and can only be used once.'
      - forgotPasswordInvalidLinkRequestButton is visible on forgotPasswordInvalidLinkPage with label 'Request a new link'
      - given user clicks forgotPasswordInvalidLinkRequestButton, application navigates to '/password-reset'
      - given user clicks forgotPasswordInvalidLinkRequestButton, forgotPasswordPage is visible per FR-FPWD-001 with forgotPasswordForm and empty forgotPasswordEmailField per FR-FPWD-002

    roleBehavior: {}

    acceptanceCriteria:
      - given user opens an invalid, expired, or already-used password-reset email link, current route matches '/password-reset/confirm'
      - given user opens an invalid, expired, or already-used password-reset email link, user is not authenticated to CourseFlow
      - given user opens an invalid, expired, or already-used password-reset email link, forgotPasswordInvalidLinkPage is visible
      - given user opens an invalid, expired, or already-used password-reset email link, forgotPasswordSetPasswordForm is not visible
      - given user opens an invalid, expired, or already-used password-reset email link, forgotPasswordInvalidLinkTitle is visible with text 'Link expired or invalid'
      - given user opens an invalid, expired, or already-used password-reset email link, forgotPasswordInvalidLinkSubtitle is visible with text 'For your security, password reset links expire after 24 hours and can only be used once.'
      - given user opens an invalid, expired, or already-used password-reset email link, forgotPasswordInvalidLinkRequestButton is visible with label 'Request a new link' and is clickable
      - given user clicks forgotPasswordInvalidLinkRequestButton, current route matches '/password-reset'
      - given user clicks forgotPasswordInvalidLinkRequestButton, forgotPasswordPage is visible per FR-FPWD-001
      - given user clicks forgotPasswordInvalidLinkRequestButton, forgotPasswordForm is visible and forgotPasswordEmailField value is empty per FR-FPWD-002

    openQuestions: []

  - id: FR-FPWD-010
    title: Failed set new password from email link

    designEvidence: []

    actors:
      - user

    uiObjects:
      - forgotPasswordSetPasswordPage
      - forgotPasswordSetPasswordForm
      - forgotPasswordNewPasswordField
      - forgotPasswordConfirmPasswordField
      - forgotPasswordSetPasswordSubmitButton
      - forgotPasswordSetPasswordConfirmationEmail
      - forgotPasswordInvalidLinkPage
      - globalMessageSnackbar

    preconditions:
      - documentPreconditions for this file hold
      - forgotPasswordSetPasswordForm is visible
      - forgotPasswordSetPasswordForm is valid per FR-FPWD-007

    trigger:
      - user clicks forgotPasswordSetPasswordSubmitButton with valid forgotPasswordSetPasswordForm values per FR-FPWD-007 and password update does not succeed

    mainFlow:
      - given password-reset email link is invalid, expired, or has already been used at submit time, application shows forgotPasswordInvalidLinkPage per FR-FPWD-009; forgotPasswordSetPasswordForm is not visible; password update is not submitted; globalMessageSnackbar is not shown
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, user remains not authenticated to CourseFlow
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, current route matches '/password-reset/confirm'
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, forgotPasswordSetPasswordForm remains visible
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, globalMessageSnackbar shows 'We encountered an issue and your password was not reset'
      - given globalMessageSnackbar shows after password update request failure for a reason other than an invalid, expired, or already-used password-reset email link, globalMessageSnackbar is not visible after a short period without user interaction
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, forgotPasswordNewPasswordField and forgotPasswordConfirmPasswordField retain their pre-submit values
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, application does not navigate to '/home'
      - given password update request fails, forgotPasswordSetPasswordConfirmationEmail is not sent per FR-FPWD-008

    roleBehavior: {}

    acceptanceCriteria:
      - given password-reset email link is invalid, expired, or has already been used at submit time, forgotPasswordInvalidLinkPage is visible per FR-FPWD-009 and forgotPasswordSetPasswordForm is not visible
      - given password-reset email link is invalid, expired, or has already been used at submit time, globalMessageSnackbar is not visible
      - given password-reset email link is invalid, expired, or has already been used at submit time, password update is not submitted and forgotPasswordSetPasswordConfirmationEmail is not sent
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link after user clicks forgotPasswordSetPasswordSubmitButton with valid form values, user is not authenticated to CourseFlow
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, current route matches '/password-reset/confirm'
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, forgotPasswordSetPasswordPage and forgotPasswordSetPasswordForm remain visible
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, globalMessageSnackbar shows 'We encountered an issue and your password was not reset'
      - given globalMessageSnackbar shows after password update request failure for a reason other than an invalid, expired, or already-used password-reset email link, globalMessageSnackbar is not visible after a short period without user interaction
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, forgotPasswordNewPasswordField and forgotPasswordConfirmPasswordField retain their pre-submit values
      - given password update request fails for a reason other than an invalid, expired, or already-used password-reset email link, current route does not match '/home'
      - given password update request fails, forgotPasswordSetPasswordConfirmationEmail is not sent

    openQuestions:
      - Confirm design evidence (FIGMA key) for set-password submit failure presentation.

  - id: FR-FPWD-011
    title: Password-reset request email content

    designEvidence: []

    actors:
      - user

    uiObjects:
      - forgotPasswordResetRequestEmail
      - forgotPasswordResetRequestEmailResetButton
      - forgotPasswordSetPasswordPage

    preconditions:
      - documentPreconditions for this file hold
      - password-reset request submission succeeds per FR-FPWD-004
      - submitted forgotPasswordEmailField value matches an active account

    trigger:
      - password-reset request submission succeeds per FR-FPWD-004

    mainFlow:
      - forgotPasswordResetRequestEmail is sent to the address entered in forgotPasswordEmailField
      - forgotPasswordResetRequestEmail subject is exactly 'CourseFlow password reset request'
      - forgotPasswordResetRequestEmail body is exactly "Hi there,\n\nWe received a request to reset the password for your CourseFlow account. You can set a new password by clicking the button below:\n\nImportant details:\n\n- Expiration: for your security, this link will expire in 24 hours.\n- Security notice: if you did not request this change, you can safely ignore this email. Your password will remain secure and unchanged.\n\nBest regards,\n\nThe CourseFlow Team."
      - forgotPasswordResetRequestEmail includes forgotPasswordResetRequestEmailResetButton labeled 'Reset password'
      - given user clicks forgotPasswordResetRequestEmailResetButton while the link is valid and not expired, application opens forgotPasswordSetPasswordPage at route '/password-reset/confirm' per FR-FPWD-005
      - password-reset link expires 24 hours after forgotPasswordResetRequestEmail is sent; after expiry the link is treated per FR-FPWD-009
      - when submitted forgotPasswordEmailField value does not match an active account, forgotPasswordResetRequestEmail is not sent and UI still follows FR-FPWD-004 success presentation

    roleBehavior: {}

    acceptanceCriteria:
      - given password-reset request submission succeeds and forgotPasswordEmailField matches an active account, forgotPasswordResetRequestEmail is sent to that address
      - given password-reset request submission succeeds and forgotPasswordEmailField matches an active account, forgotPasswordResetRequestEmail subject is exactly 'CourseFlow password reset request'
      - given password-reset request submission succeeds and forgotPasswordEmailField matches an active account, forgotPasswordResetRequestEmail body is exactly "Hi there,\n\nWe received a request to reset the password for your CourseFlow account. You can set a new password by clicking the button below:\n\nImportant details:\n\n- Expiration: for your security, this link will expire in 24 hours.\n- Security notice: if you did not request this change, you can safely ignore this email. Your password will remain secure and unchanged.\n\nBest regards,\n\nThe CourseFlow Team."
      - given password-reset request submission succeeds and forgotPasswordEmailField matches an active account, forgotPasswordResetRequestEmailResetButton is labeled 'Reset password' and links to route '/password-reset/confirm' per FR-FPWD-005
      - given password-reset request submission succeeds and forgotPasswordEmailField does not match an active account, forgotPasswordResetRequestEmail is not sent

    openQuestions: []

  - id: FR-FPWD-012
    title: Failed forgot password request submission

    designEvidence: []

