# Normalized requirements: top navigation notifications dropdown (deferred)
# Deferred from current test-generation phase; requirements retained for future work.
# Source: extracted from tests/docs/requirements/features/navigation/top_navigation_requirements_v1.yaml
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/features/navigation/top_navigation_requirements_v1.yaml (shared topNavigationBar shell); tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml (notificationListItem and child objects per FR-TOP-004; route '/user/notifications' via notificationsSeeAllLink)

documentPreconditions:
  - user is authenticated to CourseFlow
  - user is within the main application shell that renders the global top bar

uiObjectDefinitions:
  topNavigationBar:
    meaning: Canonical definition in tests/docs/requirements/features/navigation/top_navigation_requirements_v1.yaml.
  notificationsMenuTrigger:
    meaning: Icon button in topNavigationBar for notificationsDropdownPanel.
  notificationsUnreadBadge:
    meaning: Unread-count badge on notificationsMenuTrigger.
  notificationsDropdownPanel:
    meaning: Dropdown in topNavigationBar for notifications summary content.
  notificationsDropdownHeading:
    meaning: Heading in notificationsDropdownPanel labeled 'Notifications'.
  notificationsSeeAllLink:
    meaning: Link labeled 'See all' in notificationsDropdownPanel header.
  notificationsDropdownEmptyStateMessage:
    meaning: Empty-state message in notificationsDropdownPanel with text 'You do not have any notifications.'.
  notificationsList:
    meaning: Canonical definition in tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml.
  notificationListItem:
    meaning: Canonical definition in tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml.
  notificationListItemUserAvatar:
    meaning: Canonical definition in tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml.
  notificationListItemUserName:
    meaning: Canonical definition in tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml.
  notificationListItemRelativeTimestamp:
    meaning: Canonical definition in tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml.
  notificationListItemContent:
    meaning: Canonical definition in tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml.
  notificationListItemUnreadDot:
    meaning: Canonical definition in tests/docs/requirements/features/deferred/notifications_page_requirements_v1.yaml.

locatorMappings:
  topNavigationBar: "canonical_locators.yaml -> topNavigationBar"
  notificationsMenuTrigger: "canonical_locators.yaml -> notificationsMenuTrigger"
  notificationsUnreadBadge: "canonical_locators.yaml -> notificationsUnreadBadge"
  notificationsDropdownPanel: "canonical_locators.yaml -> notificationsDropdownPanel"
  notificationsDropdownHeading: "canonical_locators.yaml -> notificationsDropdownHeading"
  notificationsSeeAllLink: "canonical_locators.yaml -> notificationsSeeAllLink"
  notificationsDropdownEmptyStateMessage: "canonical_locators.yaml -> notificationsDropdownEmptyStateMessage"

requirements:
  - id: FR-TOP-004
    title: Notifications dropdown panel (list limit, read or unread rows, See all)

    designEvidence:
      - FIGMA-TOP-NOTIF-OPEN

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - notificationsMenuTrigger
      - notificationsDropdownPanel
      - notificationsDropdownHeading
      - notificationsSeeAllLink
      - notificationsList
      - notificationListItem
      - notificationListItemUserAvatar
      - notificationListItemUserName
      - notificationListItemRelativeTimestamp
      - notificationListItemContent
      - notificationListItemUnreadDot

    preconditions:
      - documentPreconditions for this file hold
      - user has at least one notification

    trigger:
      - user clicks notificationsMenuTrigger

    mainFlow:
      - notificationsDropdownPanel is visible with notificationsDropdownHeading and notificationsSeeAllLink
      - notificationsList shows one to three notificationListItem rows for the user's most recent notifications, from most recent to less recent; given user has fewer than three notifications, notificationsList shows all of them
      - each unread notificationListItem shows notificationListItemUserAvatar, notificationListItemUserName, notificationListItemRelativeTimestamp, notificationListItemContent, and notificationListItemUnreadDot
      - given user clicks notificationListItem, that row is marked read and notificationListItemUnreadDot for that row is not visible in notificationsDropdownPanel
      - given user clicks notificationsMenuTrigger or notificationsSeeAllLink, no notificationListItem read state changes
      - given user clicked notificationListItem and marked it read and notificationsDropdownPanel is reopened in the same session, notificationListItemUnreadDot for that row is not visible
      - given user clicks notificationsSeeAllLink, application navigates to route pattern '/user/notifications'

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks notificationsMenuTrigger, notificationsDropdownPanel is visible
      - notificationsDropdownHeading is visible with label 'Notifications'
      - notificationsList shows between 1 and 3 notificationListItem rows, corresponding to the user's most recent notifications
      - given user has fewer than three notifications, notificationsList shows one notificationListItem row per notification
      - each unread notificationListItem shows notificationListItemUserAvatar, notificationListItemUserName, notificationListItemRelativeTimestamp, notificationListItemContent, and notificationListItemUnreadDot
      - notificationListItemRelativeTimestamp is expressed relative to now (for example hours or days ago)
      - notificationListItemContent conveys the notification message (for example reference to a project or workflow action)
      - given user has not clicked notificationListItem, notificationListItemUnreadDot is visible for that row in notificationsDropdownPanel
      - given user clicks notificationListItem, notificationListItemUnreadDot is not visible for that row in notificationsDropdownPanel
      - given user clicks notificationsMenuTrigger or notificationsSeeAllLink, no notificationListItem read state changes
      - given user clicked notificationListItem and marked it read and notificationsDropdownPanel is reopened in the same session, notificationListItemUnreadDot for that row is not visible
      - notificationsSeeAllLink is visible with label 'See all' in notificationsDropdownPanel header
      - given user clicks notificationsSeeAllLink, current route matches '/user/notifications'

    openQuestions: []

  - id: FR-TOP-008
    title: Notifications dropdown when user has no notifications

    designEvidence:
      - FIGMA-TOP-NOTIF-NONE

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - notificationsMenuTrigger
      - notificationsDropdownPanel
      - notificationsDropdownHeading
      - notificationsList
      - notificationsDropdownEmptyStateMessage

    preconditions:
      - documentPreconditions for this file hold
      - notificationsMenuTrigger is visible
      - user has zero notifications

    trigger:
      - user clicks notificationsMenuTrigger

    mainFlow:
      - notificationsDropdownPanel is visible with notificationsDropdownHeading
      - notificationsSeeAllLink is not visible in notificationsDropdownPanel
      - notificationsList shows no notificationListItem rows
      - notificationsDropdownEmptyStateMessage is visible with text 'You do not have any notifications.'

    roleBehavior: {}

    acceptanceCriteria:
      - given user has zero notifications and clicks notificationsMenuTrigger, notificationsDropdownPanel is visible
      - notificationsDropdownHeading is visible with label 'Notifications'
      - notificationsSeeAllLink is not visible in notificationsDropdownPanel
      - no notificationListItem rows are visible in notificationsDropdownPanel
      - notificationsDropdownEmptyStateMessage is visible with text 'You do not have any notifications.'

    openQuestions: []

  - id: FR-TOP-006
    title: Notifications menu trigger unread badge states

    designEvidence:
      - FIGMA-TOP-NOTIF-ZERO
      - FIGMA-TOP-NOTIF-BADGE

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - notificationsMenuTrigger
      - notificationsUnreadBadge

    preconditions:
      - documentPreconditions for this file hold
      - notificationsMenuTrigger is visible

    trigger: []

    mainFlow:
      - given unreadCount is zero, notificationsMenuTrigger shows the bell and notificationsUnreadBadge is not visible
      - given unreadCount is greater than zero, notificationsMenuTrigger shows the bell and notificationsUnreadBadge is visible with the unread count

    roleBehavior: {}

    acceptanceCriteria:
      - given unreadCount is zero, notificationsUnreadBadge is not visible on notificationsMenuTrigger
      - given user has at least one notification and unreadCount is zero, notificationsUnreadBadge is not visible on notificationsMenuTrigger
      - given unreadCount is greater than zero, notificationsUnreadBadge is visible on notificationsMenuTrigger showing the unread count

    openQuestions:
      - Until the client always renders notificationsMenuTrigger while data loads, align loading and error states with top navigation layout expectations.

