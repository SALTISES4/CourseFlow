  favouritesEmptyState:
    meaning: Empty-state view shown in resultsRegion when the listing query returns zero projectCard and workflowCard instances on favouritesPage; copy per designEvidence on FR-FAV-001.
  favouritesErrorState:
    meaning: Error-state view shown in resultsRegion when the listing query fails on favouritesPage; copy per designEvidence on FR-FAV-001.

