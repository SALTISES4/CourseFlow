  pagination:
    meaning: Canonical definition in tests/docs/requirements/features/library/library_page_requirements_v1.yaml.
  paginationPageNumberButton:
    meaning: Canonical definition in tests/docs/requirements/features/library/library_page_requirements_v1.yaml.
  paginationPreviousNextButton:
    meaning: Canonical definition in tests/docs/requirements/features/library/library_page_requirements_v1.yaml.
  paginationFirstLastButton:
