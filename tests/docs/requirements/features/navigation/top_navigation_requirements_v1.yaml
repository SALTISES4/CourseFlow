# Normalized requirements: global top navigation (application shell)
# Source: application code (no separate Google Doc for this run)
# ADR: tests/docs/requirements/adr_requirement_normalization_for_test_generation.md
# Cross-reference: tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml (workflow-route access preconditions for FR-TOP-005); tests/docs/requirements/features/project/project_header_requirements_v1.yaml (projectTitle); tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002 (denied workflow access — workflow-context top bar chrome including returnLinksRegion not rendered); tests/docs/requirements/features/user/notifications_settings_requirements_v1.yaml (notifications settings page per accountMenuItemNotificationsSettings in FR-TOP-003); tests/docs/requirements/features/project/project_create_form_requirements_v1.yaml (createProjectDialog per FR-TOP-002); tests/docs/requirements/features/workflow/workflow_create_stepped_form_requirements_v1.yaml (createWorkflowDialog per FR-TOP-002); tests/docs/requirements/features/auth/password_reset_requirements_v1.yaml (passwordResetPage per FR-TOP-003)
# Deferred (not in current test-generation scope): tests/docs/requirements/features/deferred/top_navigation_notifications_dropdown_requirements_v1.yaml (FR-TOP-004, FR-TOP-006, FR-TOP-008)

documentPreconditions:
  - user is authenticated to CourseFlow
  - user is within the main application shell that renders the global top bar

uiObjectDefinitions:
  topNavigationBar:
    meaning: Global top navigation bar in the main application shell.
  returnLinksRegion:
    meaning: Leading segment of topNavigationBar reserved for contextual return links.
  addMenuTrigger:
    meaning: Icon button in topNavigationBar for addMenuDropdown.
  addMenuDropdown:
    meaning: Dropdown in topNavigationBar listing add-menu create rows.
  addMenuItemProject:
    meaning: Menu row labeled 'Project' in addMenuDropdown.
  addMenuItemProgram:
    meaning: Menu row labeled 'Program' in addMenuDropdown.
  addMenuItemCourse:
    meaning: Menu row labeled 'Course' in addMenuDropdown.
  addMenuItemActivity:
    meaning: Menu row labeled 'Activity' in addMenuDropdown.
  createProjectDialog:
    meaning: Canonical definition in tests/docs/requirements/features/project/project_create_form_requirements_v1.yaml.
  createWorkflowDialog:
    meaning: Canonical definition in tests/docs/requirements/features/workflow/workflow_create_stepped_form_requirements_v1.yaml.
  accountMenuTrigger:
    meaning: Icon button in topNavigationBar for accountMenuDropdown.
  accountMenuDropdown:
    meaning: Dropdown in topNavigationBar listing account menu rows.
  accountMenuItemProfile:
    meaning: Row labeled 'Profile' in accountMenuDropdown.
  accountMenuItemPassword:
    meaning: Row labeled 'Password reset' in accountMenuDropdown.
  accountMenuItemNotificationsSettings:
    meaning: Row labeled 'Notification settings' in accountMenuDropdown.
  accountMenuItemSignOut:
    meaning: Row labeled 'Sign out' in accountMenuDropdown.
  passwordResetPage:
    meaning: Canonical definition in tests/docs/requirements/features/auth/password_reset_requirements_v1.yaml.
  backToProjectLink:
    meaning: Navigation link in returnLinksRegion on workflow routes; label includes 'Return to' and the parent project projectTitle.
  projectTitle:
    meaning: Canonical definition in tests/docs/requirements/features/project/project_header_requirements_v1.yaml.

locatorMappings:
  topNavigationBar: "canonical_locators.yaml -> topNavigationBar"
  addMenuTrigger: "canonical_locators.yaml -> addMenuTrigger"
  accountMenuTrigger: "canonical_locators.yaml -> accountMenuTrigger"
  returnLinksRegion: "canonical_locators.yaml -> returnLinksRegion"
  backToProjectLink: "canonical_locators.yaml -> backToProjectLink"
  addMenuDropdown: "canonical_locators.yaml -> addMenuDropdown"
  addMenuItemProject: "canonical_locators.yaml -> addMenuItemProject"
  addMenuItemProgram: "canonical_locators.yaml -> addMenuItemProgram"
  addMenuItemCourse: "canonical_locators.yaml -> addMenuItemCourse"
  addMenuItemActivity: "canonical_locators.yaml -> addMenuItemActivity"
  accountMenuDropdown: "canonical_locators.yaml -> accountMenuDropdown"
  accountMenuItemProfile: "canonical_locators.yaml -> accountMenuItemProfile"
  accountMenuItemPassword: "canonical_locators.yaml -> accountMenuItemPassword"
  accountMenuItemNotificationsSettings: "canonical_locators.yaml -> accountMenuItemNotificationsSettings"
  accountMenuItemSignOut: "canonical_locators.yaml -> accountMenuItemSignOut"
  passwordResetPage: "canonical_locators.yaml -> passwordResetPage"
  createProjectDialog: "canonical_locators.yaml -> createProjectDialog"
  createWorkflowDialog: "canonical_locators.yaml -> createWorkflowDialog"

requirements:
  - id: FR-TOP-001
    title: Top navigation bar visibility and layout

    designEvidence:
      - FIGMA-TOP-DEFAULT

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - returnLinksRegion
      - addMenuTrigger
      - accountMenuTrigger

    preconditions:
      - documentPreconditions for this file hold

    trigger: []

    mainFlow:
      - topNavigationBar is visible spanning the top of the main application shell
      - given current route matches '/workflow/{id}/*' and tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml documentPreconditions for workflow routes hold, returnLinksRegion is visible in topNavigationBar with backToProjectLink per FR-TOP-005
      - given current route matches '/workflow/{id}/*' and workflow workspace access preconditions do not hold, returnLinksRegion is not visible in topNavigationBar per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002
      - given current route does not match '/workflow/{id}/*', returnLinksRegion is not visible in topNavigationBar
      - addMenuTrigger and accountMenuTrigger are visible in a horizontal cluster at the trailing end of topNavigationBar

    roleBehavior: {}

    acceptanceCriteria:
      - topNavigationBar is visible
      - addMenuTrigger is visible
      - accountMenuTrigger is visible
      - given current route matches '/workflow/{id}/*' and workflow workspace access preconditions do not hold, assert per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002

    openQuestions: []

  - id: FR-TOP-002
    title: Add menu (create project and workflows)

    designEvidence:
      - FIGMA-TOP-DEFAULT
      - FIGMA-TOP-ADD-OPEN

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - addMenuTrigger
      - addMenuDropdown
      - addMenuItemProject
      - addMenuItemProgram
      - addMenuItemCourse
      - addMenuItemActivity
      - createProjectDialog
      - createWorkflowDialog

    preconditions:
      - documentPreconditions for this file hold
      - addMenuTrigger is visible

    trigger:
      - user clicks addMenuTrigger

    mainFlow:
      - addMenuDropdown is visible
      - addMenuDropdown shows addMenuItemProject, addMenuItemProgram, addMenuItemCourse, and addMenuItemActivity
      - given user clicks addMenuItemProject, createProjectDialog is visible
      - given user clicks addMenuItemProgram, addMenuItemCourse, or addMenuItemActivity, createWorkflowDialog is visible with copy appropriate to the selected workflow type

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks addMenuTrigger, addMenuDropdown is visible
      - addMenuItemProject is visible with label 'Project'
      - addMenuItemProgram is visible with label 'Program'
      - addMenuItemCourse is visible with label 'Course'
      - addMenuItemActivity is visible with label 'Activity'
      - given user clicks addMenuItemProject, createProjectDialog is visible
      - given user clicks addMenuItemProgram, addMenuItemCourse, or addMenuItemActivity, createWorkflowDialog is visible with copy adjusted for program, course, or activity respectively

    openQuestions: []

  - id: FR-TOP-003
    title: Account menu (profile, settings, sign out)

    designEvidence:
      - FIGMA-TOP-DEFAULT
      - FIGMA-TOP-PROFILE-OPEN

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - accountMenuTrigger
      - accountMenuDropdown
      - accountMenuItemProfile
      - accountMenuItemPassword
      - accountMenuItemNotificationsSettings
      - accountMenuItemSignOut
      - passwordResetPage

    preconditions:
      - documentPreconditions for this file hold
      - accountMenuTrigger is visible

    trigger:
      - user clicks accountMenuTrigger

    mainFlow:
      - accountMenuDropdown is visible
      - accountMenuDropdown shows accountMenuItemProfile, accountMenuItemPassword, accountMenuItemNotificationsSettings, and accountMenuItemSignOut in top-to-bottom order with a separator above accountMenuItemSignOut
      - given user clicks accountMenuItemProfile, application navigates to route pattern '/user/profile-settings'
      - given user clicks accountMenuItemPassword, application navigates to route pattern '/user/password-reset'
      - given user clicks accountMenuItemNotificationsSettings, application navigates to route pattern '/user/notifications-settings'
      - given user clicks accountMenuItemSignOut, application navigates to '/logout' and user session ends

    roleBehavior: {}

    acceptanceCriteria:
      - given user clicks accountMenuTrigger, accountMenuDropdown is visible
      - accountMenuItemProfile is visible with label 'Profile'
      - accountMenuItemPassword is visible with label 'Password reset'
      - accountMenuItemNotificationsSettings is visible with label 'Notification settings'
      - accountMenuItemSignOut is visible with label 'Sign out'
      - accountMenuDropdown shows accountMenuItemProfile, accountMenuItemPassword, accountMenuItemNotificationsSettings, and accountMenuItemSignOut in top-to-bottom order with a separator above accountMenuItemSignOut
      - given user clicks accountMenuItemProfile, current route matches '/user/profile-settings'
      - given user clicks accountMenuItemPassword, current route matches '/user/password-reset'
      - given user clicks accountMenuItemNotificationsSettings, current route matches '/user/notifications-settings'
      - given user clicks accountMenuItemSignOut, current route matches '/logout' and user session ends

    openQuestions: []

  - id: FR-TOP-005
    title: Return to project link from workflow view

    designEvidence:
      - FIGMA-TOP-DEFAULT

    actors:
      - user

    uiObjects:
      - topNavigationBar
      - returnLinksRegion
      - backToProjectLink
      - projectTitle

    preconditions:
      - documentPreconditions for this file hold
      - tests/docs/requirements/features/workflow/workflow_header_requirements_v1.yaml documentPreconditions for workflow routes hold
      - current route matches '/workflow/{id}/*'

    trigger:
      - user clicks backToProjectLink

    mainFlow:
      - backToProjectLink is visible in returnLinksRegion with label including 'Return to' and the parent project projectTitle
      - given user clicks backToProjectLink, application navigates to route pattern '/project/{id}/workflows' for the parent project

    roleBehavior: {}

    acceptanceCriteria:
      - backToProjectLink is visible in returnLinksRegion with label including 'Return to' and parent project projectTitle
      - given user clicks backToProjectLink, current route matches '/project/{id}/workflows' for the parent project
      - given workflow workspace access preconditions do not hold on a workflow route, assert per tests/docs/requirements/features/shared/workspace_access_requirements_v1.yaml FR-WS-ACCESS-002

    openQuestions: []

