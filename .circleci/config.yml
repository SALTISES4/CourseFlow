            - slack-integration-cf
      - deploy-staging:
          context:
            - slack-integration-cf
          DEPLOY_HOST: 138.197.135.157
          DEPLOY_USER: littlebox
          DEPLOY_PATH: /srv/courseflow-staging.mydalite.org
          DEPLOY_KNOWN_HOSTS: "138.197.135.157 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPu/wf+UWtM37jbU8pfgJOPuZvvapCklcYqrsNQaSl1H"
          SSH_FINGERPRINT: SHA256:M8AB7asPZCR2b9AEaPyRyKxczYo+Z0kkcGqdFX1avzE
          requires:
           # - backend-tests
            - frontend-build
