version: 2.1
orbs:
  slack: circleci/slack@6.1.3

commands:
  install-uv:
    steps:
      - restore_cache:
          keys:
            - uv-v1-{{ arch }}-{{ checksum "uv.lock" }}
            - uv-v1-{{ arch }}-
      - run:
          name: Install uv
          command: |
            python -m pip install --user "uv==0.7.0"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  notify-slack-on-failure:
    steps:
      - slack/notify:
          event: fail
          template: basic_fail_1

executors:
  backend:
    docker:
      - image: cimg/python:3.12
        environment:
          # these are only for testing values
          POSTGRES_DB: courseflow_ci
          POSTGRES_USER: courseflow
          POSTGRES_PASSWORD: courseflow_ci
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          DJANGO_SECRET_KEY: circleci-not-for-production
          DJANGO_DEBUG: "false"
      - image: cimg/postgres:16.15
        environment:
          POSTGRES_DB: courseflow_ci
          POSTGRES_USER: courseflow
          POSTGRES_PASSWORD: courseflow_ci
    working_directory: ~/repo

