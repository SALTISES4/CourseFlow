  frontend-build:
    docker:
      - image: cimg/node:24.14.1
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - yarn-v1-{{ arch }}-{{ checksum "react/yarn.lock" }}
            - yarn-v1-{{ arch }}-
      - run:
          name: Install frontend dependencies
          command: |
            cd react
            yarn install --frozen-lockfile
      - save_cache:
          key: yarn-v1-{{ arch }}-{{ checksum "react/yarn.lock" }}
          paths:
            - ~/.cache/yarn
      - run:
          name: Check translations and build frontend
          command: |
            cd react
            yarn check-i18n
            yarn build
            test -f dist/index.html
      - persist_to_workspace:
          root: ~/repo
          paths:
            - react/dist
      - notify-slack-on-failure

  deploy-staging:
    parameters:
      DEPLOY_HOST:
        type: string
      DEPLOY_USER:
        type: string
      DEPLOY_PATH:
        type: string
      DEPLOY_KNOWN_HOSTS:
        type: string
      SSH_FINGERPRINT:
        type: string
    circleci_ip_ranges: true
    docker:
      - image: cimg/base:stable
        environment:
          DEPLOY_HOST: << parameters.DEPLOY_HOST >>
          DEPLOY_USER: << parameters.DEPLOY_USER >>
          DEPLOY_PATH: << parameters.DEPLOY_PATH >>
          DEPLOY_KNOWN_HOSTS: << parameters.DEPLOY_KNOWN_HOSTS >>
          DEPLOY_SSH_FINGERPRINT: << parameters.SSH_FINGERPRINT >>
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Validate deployment target and configure SSH host key
          command: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
      - add_ssh_keys:
          fingerprints:
            - << parameters.SSH_FINGERPRINT >>
      - attach_workspace:
          at: ~/repo
      - run:
          name: Install deployment tools
          command: |
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends rsync
      - run:
          name: Upload frontend artifact
          command: |
            remote_artifact_dir="/tmp/courseflow"

            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "install -d -m 700 '${remote_artifact_dir}'"

            rsync --archive --compress --delete --safe-links \
              -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
              react/dist/ \
              "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_artifact_dir}/"
      - run:
          name: SSH to server and deploy with just
          command: |
            ssh -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}/courseflow' && git pull && just --yes deploy-staging"
      - notify-slack-on-failure

  notify-workflow:
    docker:
      - image: cimg/base:stable
    steps:
      - slack/notify:
          event: pass
          template: basic_success_1

workflows:
  staging-deployment:
