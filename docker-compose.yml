services:
  postgres:
    profiles:
      - development
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - courseflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cf-network

  mailpit:
    profiles:
      - development
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - cf-network

  django:
    profiles:
      - uat
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${DJANGO_PORT:-8000}:8000"
    environment:
      ENV: ${ENV:?}
      POSTGRES_HOST: ${POSTGRES_HOST:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PORT: ${POSTGRES_PORT:?}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
      DJANGO_DEBUG: ${DJANGO_DEBUG:?}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      EMAIL_HOST: ${EMAIL_HOST:-127.0.0.1}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
      COURSEFLOW_SUPPORT_EMAIL: ${COURSEFLOW_SUPPORT_EMAIL:-admin@courseflow.com}
      COURSEFLOW_FRONTEND_URL: ${COURSEFLOW_FRONTEND_URL:-http://localhost:3000}
      COURSEFLOW_ALLOW_INSECURE_EMAIL_ACTION_URLS: ${COURSEFLOW_ALLOW_INSECURE_EMAIL_ACTION_URLS:-false}
      COURSEFLOW_TRUST_PROXY_CLIENT_IP: ${COURSEFLOW_TRUST_PROXY_CLIENT_IP:-false}
      PASSWORD_RESET_TIMEOUT: ${PASSWORD_RESET_TIMEOUT:-86400}
      PASSWORD_RESET_RATE_LIMIT_SECRET: ${PASSWORD_RESET_RATE_LIMIT_SECRET:-}
      AWS_SES_REGION_NAME: ${AWS_SES_REGION_NAME:-}
      AWS_SES_REGION_ENDPOINT: ${AWS_SES_REGION_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DJANGO_MIGRATE_ON_STARTUP: ${DJANGO_MIGRATE_ON_STARTUP:-true}
    depends_on:
      []
    healthcheck:
      test: ["CMD", "python", "/healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    networks:
      - cf-network

volumes:
  courseflow_pgdata:

networks:
  cf-network:
    driver: bridge
